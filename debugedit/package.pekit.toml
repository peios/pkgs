format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "debugedit"
version      = "{{version}}-2"
architecture = "x86_64"
description  = "debugedit - DWARF build-path rewriting for debuginfo packaging"
license      = "GPL-3.0-or-later"
homepage     = "https://sourceware.org/debugedit/"

[dependencies]
glibc                              = ">= 2.43"
"org.sourceware.elfutils-libs"   = ">= 0.196"

[files]
"@source:COPYING*" = "usr/share/licenses/debugedit/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
