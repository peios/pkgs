# kmod — the multicall tool + its modprobe/insmod/rmmod/lsmod/modinfo compat
# names (plain symlinks). depmod is the exception: it is machine-facing —
# peipkg's install side effect and `make modules_install` call it, people do
# not — so it ships in usr/libexec rather than on PATH.

[package]
name        = "kmod"
description = "kmod - kernel module management tools (depmod, modprobe, ...)"
license     = "GPL-2.0-or-later"

[dependencies]
glibc   = ">= 2.43"
libkmod = "{{version}}"

[files]
"@source:tools/COPYING" = "usr/share/licenses/kmod/"
":usr/bin/**"           = "usr/bin"
":usr/libexec/**"       = "usr/libexec"
