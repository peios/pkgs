# kmod — kernel module tools (depmod/modprobe/...) + libkmod; the kernel's
# `make modules_install` runs depmod over the staged module tree.
#
# PEI-158 kernel-tooling leaf, now on kmod's meson build (34.2; PEI-535
# brought meson + ninja to the pool). 33 had been pinned as the last
# properly dist'd autotools release — 34.0's tarball shipped build-aux/*
# and m4/* as absolute symlinks — and 34.2's tarball is clean again.
# --sbindir=bin puts the modprobe/insmod/... compat names beside kmod in
# bindir (kmod's install script makes them relative symlinks to the
# multicall binary). Manpages off (scdoc). Compressed-module support wired
# to our zlib/xz/zstd; openssl ON now that it is in the pool (modinfo's
# PKCS7 signature display; libkmod gains libcrypto). buildtype=plain so
# the distro CFLAGS/LDFLAGS are the only flags.
#
# The upstream testsuite runs. It builds a playground of dummy modules and
# drives depmod/modprobe/modinfo over a fake rootfs with LD_PRELOAD shims,
# which is real coverage for a TCB binary. Its Makefile defaults KDIR to the
# RUNNING kernel's headers -- a build must not depend on what the farm booted
# -- so KDIR is pointed at our own kernel-devel instead, making the modules
# under test Peios modules. That kernel is clang-built, hence LLVM=1.
#
# The kernel-devel floor is the revision that first shipped
# tools/objtool/objtool, without which Kbuild cannot compile a single external
# module (CONFIG_OBJTOOL is on).

out_dir = "out"

[source.url]
url      = "https://cdn.kernel.org/pub/linux/utils/kernel/kmod/kmod-{{version}}.tar.xz"
extract  = true
root     = "kmod-{{version}}"
versions = ">= 34.2"

# kernel.org publishes a detached signature by the kmod maintainer over the
# DECOMPRESSED tar (PEI-150's `of = "decompressed"`), so the first pin of any
# version is checked against the maintainer's key rather than merely recorded.
# Worth the ten minutes for a TCB binary: TOFU alone attests that later fetches
# match the first one, not that the first one was upstream's.
[source.url.signature]
key_files    = ["keys/kmod-maintainer.asc"]
url          = "https://cdn.kernel.org/pub/linux/utils/kernel/kmod/kmod-{{version}}.tar.sign"
fingerprints = ["EAB33C9690013C733916AC839BA2A5A630CBEA53"]
of           = "decompressed"

[build.main]
command = """
SRC="$(pwd)"
meson setup "$PEKIT_OUT/build" "$SRC" --prefix=/usr --bindir=bin --sbindir=bin \
  --libdir=lib/x86_64-linux-peios --sysconfdir=/etc --buildtype=plain \
  -Dmanpages=false -Dbashcompletiondir=no -Dfishcompletiondir=no \
  -Dzshcompletiondir=no -Dopenssl=enabled -Dzlib=enabled -Dxz=enabled \
  -Dzstd=enabled -Dbuild-tests=true
meson compile -C "$PEKIT_OUT/build"
# One kernel-devel is in the root; take its build tree whatever its release.
KDIR="$(echo /usr/lib/modules/*/build)"

# test-depmod is excluded, and only it. Two of its cases -- modules_outdir and
# modules_order_for_compressed -- compare depmod's output byte for byte with a
# fixture recorded on whatever filesystem the fixture author used. Those
# fixtures carry no modules.order, so depmod emits aliases in directory read
# order, and on ext4 that order comes from a per-filesystem hash seed. Measured
# rather than assumed: the produced modules.alias is the same 2278 bytes as the
# fixture and identical to it once both are sorted. The other fourteen
# test-depmod cases pass, and are lost with it -- worth revisiting if upstream
# ever sorts the comparison.
# --list prints "<project>:<test>", so strip the project prefix before filtering.
tests=$(meson test -C "$PEKIT_OUT/build" --list | sed 's|^[^:]*:||' | grep -vx 'test-depmod')
[ -n "$tests" ] || { echo "kmod: test selection came back empty" >&2; exit 1; }
KDIR="$KDIR" LLVM=1 meson test -C "$PEKIT_OUT/build" --print-errorlogs $tests
DESTDIR="$PEKIT_OUT" meson install -C "$PEKIT_OUT/build" --no-rebuild
rm -rf "$PEKIT_OUT/build"
# depmod is machine-facing: peipkg runs it as an install side effect and the
# kernel's `make modules_install` runs it at build time, but there is no
# documented workflow in which a person invokes it. That puts it in libexec
# rather than on PATH. kmod dispatches on argv[0]'s basename, so it stays a
# symlink to the same multicall binary; the target is relative so it resolves
# both as /usr/libexec/depmod -> /usr/bin/kmod and through the merged views as
# /libexec/depmod -> /bin/kmod.
install -d "$PEKIT_OUT/usr/libexec"
rm -f "$PEKIT_OUT/usr/bin/depmod"
ln -s ../bin/kmod "$PEKIT_OUT/usr/libexec/depmod"
rm -rf "$PEKIT_OUT/etc"
"""

# PIP: kmod is TCB. request_module() execs modprobe as a usermodehelper — the
# kernel acting on its own behalf, at its own authority — and KACS refuses such
# an exec unless the binary carries PeiosTcb trust (PEI-59). Without this the
# floor denies every kernel-initiated module load.
#
# One entry, because kmod is a multicall binary: modprobe, insmod, rmmod, lsmod,
# modinfo and depmod are all symlinks to this file, so signing it covers the set.
# Signing the symlinks would be meaningless anyway — the tier comes from the
# inode actually exec'd.
#
# The tier is decided by which key verified, so naming tcb.priv here is what
# makes this TCB; there is nothing in the signature expressing intent. Keep this
# table to files that genuinely belong in the trusted computing base.
[build.main.sign.pip]
"usr/bin/kmod" = "tcb.priv"

[build.main.dependencies.peipkg]
dash = "*"
coreutils-gnu = "*"
# The testsuite's harness is bash, and its module playground is an out-of-tree
# kbuild against our own clang-built kernel.
bash = "*"
# The harness is a set of shell scripts: it rewrites fixture paths with sed,
# walks the rootfs with find, and the test selection below filters with grep.
# find worked without being declared, which means it arrived transitively --
# state it rather than rely on that.
sed = "*"
grep = "*"
findutils = "*"
# The harness compresses its dummy modules with all three algorithms to
# exercise libkmod's decompressors.
gzip = "*"
xz = "*"
zstd = "*"
"kernel-devel" = ">= 0.20.1-rc12-13"
clang = "*"
llvm = "*"
lld = "*"
make = "*"
build-essentials-c = "*"
pkgconf = "*"
meson = "*"
ninja = "*"
"zlib-devel" = "*"
"xz-devel" = "*"
"zstd-devel" = "*"
"openssl-devel" = "*"

[build.main.dependencies.apt]
build-essential = "*"
bash = "*"
pkg-config = "*"
meson = "*"
ninja-build = "*"
zlib1g-dev = "*"
liblzma-dev = "*"
libzstd-dev = "*"
libssl-dev = "*"
