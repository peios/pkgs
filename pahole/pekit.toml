# pahole (dwarves) — DWARF/BTF introspection tools; the kernel's BTF
# generation (CONFIG_DEBUG_INFO_BTF) runs pahole over vmlinux.
#
# PEI-158 kernel-tooling leaf: our cmake's first out-of-tree consumer,
# built against our elfutils-devel (libdw/libelf). The release tarball
# vendors libbpf (lib/bpf) and LIBBPF_EMBEDDED defaults ON — the embedded
# copy is the point: no system libbpf in the seed. CMAKE_BUILD_TYPE
# defaults to Debug upstream, so Release is passed explicitly;
# LIB_INSTALL_DIR is packager-supplied by design. The btfdiff/fullcircle
# script conveniences are dropped (undeclared runtime deps on diff/perl);
# python3 is absent from the root, so the ostra tree never installs. The
# libdwarves dev surface (headers, .so links) is dropped too — nothing
# builds against libdwarves; the tools + versioned libs are what ship.

out_dir = "out"

[source.url]
url      = "https://fedorapeople.org/~acme/dwarves/dwarves-{{version}}.tar.xz"
extract  = true
root     = "dwarves-{{version}}"
versions = ">= 1.31"

[build.main]
command = """
SRC="$(pwd)"
mkdir -p "$PEKIT_OUT/build"
cd "$PEKIT_OUT/build"
cmake -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \
  -DLIB_INSTALL_DIR=/usr/lib/x86_64-linux-peios "$SRC"
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -f "$PEKIT_OUT/usr/bin/btfdiff" "$PEKIT_OUT/usr/bin/fullcircle" \
  "$PEKIT_OUT/usr/bin/ostra-cg"
rm -rf "$PEKIT_OUT/usr/share/dwarves" "$PEKIT_OUT/usr/include"
find "$PEKIT_OUT/usr/lib/x86_64-linux-peios" -name 'libdwarves*.so' -type l -delete
rm -rf "$PEKIT_OUT/build"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
"org.cmake.cmake" = "*"
"elfutils-devel" = "*"
"zlib-devel" = "*"

[build.main.dependencies.apt]
build-essential = "*"
cmake = "*"
libdw-dev = "*"
zlib1g-dev = "*"
