# timed — the Peios time client — and clock.
#
# Delegate recipe: timed is self-describing (pekit.toml and packages.pekit/
# in its own tree), so this is just a pointer, like netd's, resolvd's and
# trustd's.

out_dir = "out"
delegate = true

# Local working copy for `--local` (compile the in-dev tree, no tag).
[source.local]
path = "../../timed"
