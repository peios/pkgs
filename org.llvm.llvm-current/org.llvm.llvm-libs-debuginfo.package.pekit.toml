[package]
name = "org.llvm.llvm-libs-debuginfo"
description = "LLVM shared-library debugging symbols"
license = "(Apache-2.0 WITH LLVM-exception) AND (CC0-1.0 OR Apache-2.0)"

[dependencies]
"org.llvm.llvm-libs" = "= {{release}}"

[files]
"@source:llvm/LICENSE.TXT" = "usr/share/licenses/org.llvm.llvm-libs-debuginfo/LICENSE.TXT"
"@source:llvm/lib/Support/BLAKE3/LICENSE" = "usr/share/licenses/org.llvm.llvm-libs-debuginfo/BLAKE3-LICENSE"
":.debuginfo/llvm-libs/usr/lib/debug/**" = "usr/lib/debug"
