[package]
name        = "org.llvm.llvm-debugsource"
description = "LLVM, Clang and LLD corresponding debug sources"
license     = "(Apache-2.0 WITH LLVM-exception) AND (CC0-1.0 OR Apache-2.0)"

[dependencies]
"org.llvm.llvm-debuginfo" = "{{version}}-2"

[files]
"@source:llvm/LICENSE.TXT" = "usr/share/licenses/org.llvm.llvm-debugsource/LICENSE.TXT"
"@source:llvm/lib/Support/BLAKE3/LICENSE" = "usr/share/licenses/org.llvm.llvm-debugsource/BLAKE3-LICENSE"
":usr/src/debug/**" = "usr/src/debug"

