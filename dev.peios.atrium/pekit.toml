# Atrium — Peios's browser-delivered interactive session.
#
# Delegate recipe: Atrium owns its build and package split in its source tree.
# This catalogue recipe supplies the local development checkout. An immutable
# Git source will replace the local-only release boundary once Atrium has a
# canonical remote and release tags; tag-signature enforcement is separately
# deferred by decision.

out_dir = "out"
delegate = true

[source.local]
path = "../../atrium"
