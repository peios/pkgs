format = "peipkg"

[package]
name         = "dev.peios.peios-experimental"
version      = "2026.8-8"
architecture = "noarch"
description  = "Peios Experimental edition: the base system and its OS release identity"
license      = "MIT"
license_class = "free"
homepage     = "https://github.com/peios/pkgs"

# An edition is not moved by a routine package operation: upgrading it
# also has to reconcile what the package manager deliberately does not
# touch (the release's registry seeds), and that is upgrade-peios' job.
# peipkg refuses to install or upgrade this package by name and holds it
# back from a bulk upgrade, printing this message; upgrade-peios drives
# peipkg with --bypass-alternate-upgrade. The declaration grants nothing.
[package.alternate_upgrade]
message = "To upgrade Peios use the `upgrade-peios` command."

# The base system. Every entry is a `>=` floor rather than a pin: at this
# pre-alpha stage the floors let packages move without a repackage of the
# edition on every change. Production editions pin exactly. The set and the
# floors are dist/.old/prod/manifest.toml, the last hand-pinned composition.
#
# What that composition has and this deliberately does NOT: live-boot and
# peios-dwe. They make an image a live medium (and a development
# workstation); they are properties of the ISO, not of an installed Peios,
# and peiso adds them. No disk-boot either, and for the same reason from the
# other side: which boot packages a system carries is a property of the
# medium it boots from, and peios-install swaps live-boot for disk-boot on
# the target. An edition that named either would be installable on only one
# kind of medium.
#
# A dependency lands in the depender's root unless the edge says otherwise
# (peipkg DESIGN-named-roots: a package's default_root governs top-level
# installs only). Everything the initramfs runs — prelude, its hooks, the
# module subset, its base tree — is therefore placed there explicitly.
#
# Things listed here that the dependency graph would not otherwise reach:
# the NSS modules authd-nss and resolvd-nss (glibc dlopens them by name, so
# nothing depends on them), the firmware packages
# (a policy choice — the target CPU and devices are unknown at compose time,
# so every vendor ships), and fsbase-irf (each independently executing root
# needs its own mountpoints, and this is the only edge that puts them in the
# initramfs). Not listed: peiosutils and libpeios in the initramfs root —
# the *-irf hooks and ELF-derived edges pull them there.
[dependencies]
# Kernel, modules, and the tools that load them.
"dev.peios.kernel"             = ">= 0.21.0-alpha11-1"
"dev.peios.kernel-modules"     = ">= 0.21.0-alpha11-1"
"dev.peios.kernel-modules-irf" = { constraint = ">= 0.21.0-alpha11-1", root = "initramfs" }
"org.kernel.kmod"              = ">= 34.2-1"
# Local console switching, keymaps and fonts (PEI-1187).
"org.kernel.kbd"               = ">= 2.10.0-1"
"dev.peios.coldplug-irf"       = { constraint = ">= 1.0.0-1", root = "initramfs" }
"io.github.eudev-project.eudev" = ">= 3.2.14-1"

# Base filesystem and topology, in both roots.
"dev.peios.fsbase"                      = ">= 1.0.0-1"
"dev.peios.fsbase-irf"                  = { constraint = ">= 1.0.0-1", root = "initramfs" }
"dev.peios.fsbase-stratafs-mount-hooks" = { constraint = ">= 1.0.0-1", root = "initramfs" }

# Base userspace. peios-install is part of every Peios, not of the live
# medium: an installed system can install another.
"dev.peios.peiosutils" = ">= 0.8.18-1"
"dev.peios.libpeios"   = ">= 0.5.8-1"
"org.gnu.glibc-bin"    = ">= 2.44-1" # locale tools and compiled C.UTF-8
"org.git.kernel.dash"  = ">= 0.5.13.5-1"
"dev.peios.peipkg" = ">= 0.1.9-1"
"dev.peios.peios-install" = ">= 0.3.0-1"

# Text inspection, file selection and archives (PEI-1179).
# These are operator tools in the system root. Explicit compressor commands
# make tar gzip, xz, zstd and bzip2 support available on every installation.
"com.darwinsys.file" = ">= 5.48-1"
"com.facebook.zstd" = ">= 1.5.7-1"
"org.gnu.diffutils" = ">= 3.12-1"
"org.gnu.findutils" = ">= 4.11.0-1"
"org.gnu.gawk" = ">= 5.4.1-1"
"org.gnu.grep" = ">= 3.12-1"
"org.gnu.gzip" = ">= 1.15-1"
"org.gnu.sed" = ">= 4.10-1"
"org.gnu.tar" = ">= 1.35-1"
"org.sourceware.bzip2" = ">= 1.0.8-1"
"org.tukaani.xz" = ">= 5.8.4-1"
"com.greenwoodsoftware.less" = ">= 710-1"
"net.sourceforge.infozip.zip" = ">= 3.0-1"
"net.sourceforge.infozip.unzip" = ">= 6.0-1"

# Content synchronization and TLS diagnostics (PEI-1186).
"org.samba.rsync" = ">= 3.5.1-1"
"org.openssl.openssl" = ">= 4.0.2-1"
"org.debian.whois" = ">= 5.6.6-1"
"net.es.iperf3" = ">= 3.21-1"

# Interactive text editing (PEI-1181).
"org.gnu.nano" = ">= 9.2-1"

# The installer proper: installerd (the engine, a SYSTEM service) and
# install-tui (its terminal surface). Ships alongside peios-install, not
# instead of it, until it has installed a system that boots -- the script is
# still what `make boot-install` drives.
"dev.peios.peios-installer" = ">= 0.1.11-1"

# First-boot setup: oobed and its own terminal surface. A separate package
# from the installer because the two have separate lifetimes -- an installed
# system keeps OOBE and has no use for the installer, and removing the
# installer from it should not take first-boot setup with it.
#
# It ships a seed master and nothing applies it here: `install_autoapply` in
# release.toml is what opts it in, on the installed machine only.
"dev.peios.oobe" = ">= 0.1.11-1"

# The graphical installer and first-boot setup, drawn as GXWI's overlay so the
# machine's address opens straight into them (PEI-1203, PEI-1213). They ship
# beside the terminal surfaces above, with the same lifetimes. The overlay is
# switched on by the installer-gxwi-overlay seed, which release.toml lists in
# live_autoapply only: an installed machine never gets it.
"dev.peios.installer-gxwi" = ">= 0.0.1-1"
"dev.peios.oobe-gxwi" = ">= 0.0.1-1"

# Boot and init. prelude is the initramfs PID 1 and lives only there.
"dev.peios.prelude" = { constraint = ">= 0.0.7-1", root = "initramfs" }
"dev.peios.peinit"  = ">= 0.0.12-1"
# svctl and the shutdown commands are peinit's operator client, split into
# their own package so recovery images can carry the client without PID 1;
# nothing depends on it, so like net and resolv it is listed here (PEI-1071).
"dev.peios.peinit-svctl" = ">= 0.0.12-1"

# Identity (PGSS Logon).
"dev.peios.authd"       = ">= 0.0.24-1"
"dev.peios.authd-lpsd"  = ">= 0.0.24-1"
"dev.peios.authd-lps"   = ">= 0.0.24-1"
"dev.peios.authd-login" = ">= 0.0.24-1"
"dev.peios.authd-nss"   = ">= 0.0.24-1"
# The passwordless live-image administrator is deliberately no longer carried
# by lpsd itself. This image explicitly opts into both its payload and registry
# seed; installed/production images do not acquire it transitively.
"dev.peios.authd-live-account" = ">= 0.0.24-1"

# Durable events, service logs and metrics. 0.1.11 is the first eventd on the
# catalogue event names that kernel alpha11 emits; nothing older pairs with it.
"dev.peios.eventd" = ">= 0.1.11-1"

# Networking: netd owns links, addresses, routes and DHCP; resolvd owns
# name resolution; net and resolv are their operator commands;
# resolvd-nss is dlopened by glibc for host lookups, so like authd-nss
# nothing depends on it and it must be listed.
"dev.peios.netd"        = ">= 0.1.8-1"
"dev.peios.net"         = ">= 0.1.8-1"
"dev.peios.resolvd"     = ">= 0.1.6-1"
"dev.peios.resolv"      = ">= 0.1.6-1"
"dev.peios.resolvd-nss" = ">= 0.1.6-1"

# Network diagnostics and transfers (PEI-1184). These commands retain the
# caller's authority and traverse PNP; they install no network services.
"se.curl.curl" = ">= 8.22.0-1"
"io.github.iputils.iputils" = ">= 2025.06.05-1"
"org.kernel.iproute2" = ">= 7.2.0-1"
"org.isc.bind-utils" = ">= 9.20.29-1"
"org.debian.netcat-openbsd" = ">= 1.238.1-1"

# Capture, relays and route/scanning diagnostics (PEI-1190).
# These retain the caller's token and add no privilege or PNP policy grants.
"org.dest-unreach.socat" = ">= 1.8.1.3-1"
"org.tcpdump.libpcap" = ">= 1.10.7-1"
"org.tcpdump.tcpdump" = ">= 4.99.7-1"
"nl.bitwizard.mtr" = ">= 0.96-1"
"net.sourceforge.traceroute" = ">= 2.1.6-1"
"org.nmap.nmap" = ">= 7.991-1"

# Trust. trustd composes what this machine trusts from the roots
# ca-certificates ships and the decisions under Machine\System\Trust, and
# renders /etc/ssl for the software that reads trust from a path. Nothing
# depends on ca-certificates — trustd needs *a* bundle at a known path, not
# that package specifically — so, like the nss modules, it is listed here.
#
# The floor is on the dotted YYYY.MM.DD scheme org.mozilla.ca-certificates
# uses, and has to be: that package provides the `ca-certificates` name at its
# own version, and a dotted date sorts BELOW an undotted one because the
# numeric major is 2026 rather than 20260830. The prior undotted floor could not
# be satisfied by a qualified package, leaving this edition unresolvable
# (PEI-840).
"dev.peios.trustd" = ">= 0.1.6-1"
"dev.peios.trust"  = ">= 0.1.6-1"
"org.mozilla.ca-certificates" = ">= 2026.09.06-1"

# Zone data. Like the trust roots it is base-system data nothing depends on
# by name: peinit resolves OnCalendar timezones through it, timed and anything
# formatting local time read it (PEI-832).
"org.iana.tzdata" = ">= 2026c-1"

# Time. timed is the only process permitted to set the clock; clock is its
# operator command. There is deliberately no NTP server here — that is a
# separate, future, unprivileged package which subscribes to timed for its
# state, because the client holds the privilege and listens on nothing
# while a server is exposed to the whole domain and needs no privilege.
"dev.peios.timed" = ">= 0.1.10-1"
"dev.peios.clock" = ">= 0.1.10-1"

# Authenticated SSH access; the deprecated Atrium stack is not shipped.
"dev.peios.openssh" = ">= 10.5.1.2-1"
"dev.peios.openssh-settings" = ">= 10.5.1.2-1"

# GXWI display server, compositor, desktop shell and file explorer. 0.0.3 is
# the first gxwi with overlay sessions, which the graphical installer needs.
"dev.peios.gxwi" = ">= 0.0.4-1"
"dev.peios.fenestra" = ">= 0.0.3-1"
"dev.peios.fenesh" = ">= 0.0.6-1"
"dev.peios.gexora" = ">= 0.0.3-1"

# GXWI's shared dialogs and the management apps (PEI-1218, PEI-1400).
"dev.peios.gxwi-sd-editor" = ">= 0.0.1-1"
"dev.peios.gxwi-file-dialog" = ">= 0.0.1-1"
"dev.peios.gxwi-feature-manager" = ">= 0.0.1-1"
"dev.peios.gxwi-package-manager" = ">= 0.0.1-1"
"dev.peios.gxwi-upgrade-peios" = ">= 0.0.1-1"
"dev.peios.gxwi-principals-manager" = ">= 0.0.1-1"
"dev.peios.gxwi-my-settings" = ">= 0.0.1-1"
"dev.peios.gxwi-disk-manager" = ">= 0.0.1-1"
"dev.peios.gxwi-services-manager" = ">= 0.0.1-1"
"dev.peios.gxwi-task-manager" = ">= 0.0.1-1"
"dev.peios.gxwi-event-viewer" = ">= 0.0.2-1"
# The terminal and the text editor, which fenesh's default dock pins.
"dev.peios.peiterm" = ">= 0.0.2-1"
"dev.peios.peitor" = ">= 0.0.1-1"
"dev.peios.gxwi-registry-editor" = ">= 0.0.1-1"
"dev.peios.gxwi-security-policy" = ">= 0.0.1-1"
"dev.peios.gxwi-system-settings" = ">= 0.0.1-1"
"dev.peios.gxwi-network-manager" = ">= 0.0.1-1"

# The PNP viewer (PEI-598): network observation, starting as the packet viewer.
# Experimental is explicitly the development-machine image, so PNPd is
# intentionally installed and its pnpd-service seed is autoapplied. This does
# not approve the unauthenticated listener for a future production profile;
# such a profile requires a separate least-privilege exposure design.
"dev.peios.pnpd" = ">= 0.6.1-1"

# Python, for scripting and the Python-based kernel tools (Bedrock).
"org.python.python3" = ">= 3.14.7-1"
"org.python.python3-libs" = ">= 3.14.7-1"

# CPU microcode for early loading (Bedrock). Both packages build the early
# initramfs payload, so they belong in the initramfs root, like every other
# edge that feeds the initramfs.
"com.amd.amd-ucode" = { constraint = ">= 2026.09.10-1", root = "initramfs" }
"com.intel.intel-ucode" = { constraint = ">= 2026.08.12-1", root = "initramfs" }

# Kernel and performance tools from the PKM tree (Bedrock). Their daemons --
# thermal-engine, freefall, the Hyper-V tools -- install but are not enabled.
# perf and thermometer are left out: both need libraries no package provides.
"dev.peios.cpupower" = ">= 0.21.0-alpha11-1"
"dev.peios.turbostat" = ">= 0.21.0-alpha11-1"
"dev.peios.x86-energy-perf-policy" = ">= 0.21.0-alpha11-1"
"dev.peios.intel-speed-select" = ">= 0.21.0-alpha11-1"
"dev.peios.bootconfig" = ">= 0.21.0-alpha11-1"
"dev.peios.cgroup-tools" = ">= 0.21.0-alpha11-1"
"dev.peios.mm-tools" = ">= 0.21.0-alpha11-1"
"dev.peios.getdelays" = ">= 0.21.0-alpha11-1"
"dev.peios.rtla" = ">= 0.21.0-alpha11-1"
"dev.peios.rv" = ">= 0.21.0-alpha11-1"
"dev.peios.latency-collector" = ">= 0.21.0-alpha11-1"
"dev.peios.kvm-stat" = ">= 0.21.0-alpha11-1"
"dev.peios.usbip" = ">= 0.21.0-alpha11-1"
"dev.peios.gpio-utils" = ">= 0.21.0-alpha11-1"
"dev.peios.iio-utils" = ">= 0.21.0-alpha11-1"
"dev.peios.thermal-engine" = ">= 0.21.0-alpha11-1"
"dev.peios.tmon" = ">= 0.21.0-alpha11-1"
"dev.peios.freefall" = ">= 0.21.0-alpha11-1"
"dev.peios.hv" = ">= 0.21.0-alpha11-1"

# Debugging running programs and inspecting binaries (Bedrock). No compilers:
# Peios does not build code on the machine itself.
"org.gnu.gdb" = ">= 17.2-1"
"org.gnu.gdb-gdbserver" = ">= 17.2-1"
"org.sourceware.elfutils" = ">= 0.196-1"
"org.capstone-engine.capstone" = ">= 5.0.9-1"

# System administration (Bedrock). ncurses brings terminfo, tput and clear.
"cz.ucw.pciutils" = ">= 3.15.0-1"
"io.github.numactl.numactl" = ">= 2.0.19-1"
"org.kernel.libcap-tools" = ">= 2.78-1"
"io.github.thom311.libnl-tools" = ">= 3.12.0-1"
"org.kernel.util-linux-extra" = ">= 2.42.3-1"
"org.kernel.util-linux-getopt" = ">= 2.42.3-1"
"org.kernel.util-linux-hexdump" = ">= 2.42.3-1"
"org.kernel.util-linux-schedutils" = ">= 2.42.3-1"
"org.kernel.util-linux-script" = ">= 2.42.3-1"
"org.gnu.which" = ">= 2.25-1"
"org.gnu.bc" = ">= 1.08.2-1"
"org.gnu.cpio" = ">= 2.15-1"
"org.gnu.ncurses" = ">= 6.6-1"

# File and text extras (Bedrock).
"org.tukaani.xz-utils" = ">= 5.8.4-1"
"org.gnu.gzip-utils" = ">= 1.15-1"
"com.facebook.zstd-utils" = ">= 1.5.7-1"
"com.facebook.zstd-pzstd" = ">= 1.5.7-1"
"org.pcre.pcre2-tools" = ">= 10.48-1"
"io.github.libexpat.expat-tools" = ">= 2.8.5-1"
"org.gnome.libxml2-utils" = ">= 2.15.4-1"
"org.gnome.libxslt-utils" = ">= 1.1.45-1"

# Networking extras (Bedrock). netbase supplies /etc/services, /etc/protocols
# and /etc/ethertypes, which getservbyname and friends read.
"org.debian.netbase" = ">= 6.6-1"
"org.samba.rsync-ssl" = ">= 3.5.1-2"
"org.samba.rrsync" = ">= 3.5.1-2"

# Compatibility runtimes for third-party software (Bedrock).
"org.openssl.openssl3" = ">= 3.5.8-1"
"org.gnu.glibc-gconv-extra" = ">= 2.44-1"

# Perl, for git's Perl-based commands, OpenSSL's CA scripts and admin
# scripting (Bedrock).
"org.perl.perl" = ">= 5.44.0-1"
"org.perl.perl-modules" = ">= 5.44.0-1"
"org.openssl.openssl-perl" = ">= 4.0.2-1"

# Version control and package composition (Bedrock).
"com.git-scm.git" = ">= 2.55.0-1"
"dev.peios.peipkg-compose" = ">= 0.1.9-1"

# Optional features: installed means available in Feature Manager; each stays
# off until enabled (Bedrock).
"dev.peios.feat-dynamic-boot" = ">= 1.1.0-1"

# Banner text (Bedrock).
"org.figlet.figlet" = ">= 2.2.5-1"

# Locale data for the most widely used languages (Bedrock), so System
# Settings' language list is real beyond C.UTF-8. The other glibc langpacks
# stay installable on demand.
"org.gnu.glibc-langpack-en" = ">= 2.44-1"
"org.gnu.glibc-langpack-de" = ">= 2.44-1"
"org.gnu.glibc-langpack-fr" = ">= 2.44-1"
"org.gnu.glibc-langpack-es" = ">= 2.44-1"
"org.gnu.glibc-langpack-it" = ">= 2.44-1"
"org.gnu.glibc-langpack-pt" = ">= 2.44-1"
"org.gnu.glibc-langpack-nl" = ">= 2.44-1"
"org.gnu.glibc-langpack-pl" = ">= 2.44-1"
"org.gnu.glibc-langpack-ru" = ">= 2.44-1"
"org.gnu.glibc-langpack-uk" = ">= 2.44-1"
"org.gnu.glibc-langpack-ja" = ">= 2.44-1"
"org.gnu.glibc-langpack-zh" = ">= 2.44-1"
"org.gnu.glibc-langpack-ko" = ">= 2.44-1"
"org.gnu.glibc-langpack-ar" = ">= 2.44-1"
"org.gnu.glibc-langpack-hi" = ">= 2.44-1"
"org.gnu.glibc-langpack-tr" = ">= 2.44-1"
"org.gnu.glibc-langpack-sv" = ">= 2.44-1"

# Device firmware (PEI-466). Unconditional: see above.
"org.kernel.linux-firmware-iwlwifi"         = ">= 2026.08.10-1"
"org.kernel.linux-firmware-atheros"         = ">= 2026.08.10-1"
"org.kernel.linux-firmware-mediatek"        = ">= 2026.08.10-1"
"org.kernel.linux-firmware-realtek"         = ">= 2026.08.10-1"
"org.kernel.linux-firmware-broadcom"        = ">= 2026.08.10-1"
"org.kernel.linux-firmware-marvell"         = ">= 2026.08.10-1"
"org.kernel.linux-firmware-ralink"          = ">= 2026.08.10-1"
"org.kernel.linux-firmware-amd-graphics"    = ">= 2026.08.10-1"
"org.kernel.linux-firmware-amd-platform"    = ">= 2026.08.10-1"
"org.kernel.linux-firmware-intel-graphics"  = ">= 2026.08.10-1"
"org.kernel.linux-firmware-intel-platform"  = ">= 2026.08.10-1"
"org.kernel.linux-firmware-intel-sound"     = ">= 2026.08.10-1"
"org.kernel.linux-firmware-nvidia-graphics" = ">= 2026.08.10-1"
"org.kernel.linux-firmware-audio-codecs"    = ">= 2026.08.10-1"
"org.kernel.linux-firmware-nic"             = ">= 2026.08.10-1"
"org.kernel.linux-firmware-storage"         = ">= 2026.08.10-1"
"org.kernel.linux-firmware-misc"            = ">= 2026.08.10-1"
"org.sofproject.sof-firmware" = ">= 2025.12.2-1"

# The os-release file generated by the build, plus its compat symlink in the
# vendor config layer (/usr/etc, the bottom of the /etc merge — packages never
# write /etc directly). `:` sources from the main build's stage; an exact
# (non-glob) source maps to its exact destination path.
[files]
"docs/LICENSE"                   = "usr/share/licenses/dev.peios.peios-experimental/LICENSE"
":usr/lib/os-release"           = "usr/lib/os-release"
":usr/etc/os-release"           = "usr/etc/os-release"
":usr/share/peios/release.toml" = "usr/share/peios/release.toml"
