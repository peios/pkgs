# isl — Integer Set Library: gcc's Graphite loop-optimization framework links it
# (the last of gcc's optional math prerequisites). Links gmp.
#
# Tarball source (libisl.sourceforge.io; canonical git at repo.or.cz is
# unreachable and the github mirror needs autogen). isl versions are 2-component
# (0.27).
#
#   nix develop ./_flake#isl -c pekit build --version 0.27

out_dir = "out"

[source.url]
url        = "https://libisl.sourceforge.io/isl-{{version}}.tar.xz"
root       = "isl-{{version}}"
extract    = true
file_regex = '^isl-\d+\.\d+\.tar\.xz$'
versions   = ">= 0.26"

# Standard autotools. The distro CFLAGS/LDFLAGS arrive through the environment;
# assigning LDFLAGS on the configure line OVERRIDES it rather than adding, which
# is how this recipe used to discard the whole distro link flag set while adding
# --build-id (already in LDFLAGS, as sha1). `-std=gnu17` is gone with it: it
# guarded against C23 tripping K&R configure probes, which is a gmp problem
# (now patched at source), not isl's.
#
# gmp found via the cc-wrapper's injected -I/-L (isl's --with-gmp defaults to
# system).
[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios

# libtool appends -Wl,--as-needed after the libraries and hardcodes an rpath to
# the install libdir; Fedora and Arch both rewrite it, so do the same.
sed -e 's|^hardcode_libdir_flag_spec=.*|hardcode_libdir_flag_spec=""|g' \
    -e 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' \
    -e 's|CC="\\(g..\\)"|CC="\\1 -Wl,--as-needed"|' \
    -i libtool

make -j"$(nproc)"

# isl drives gcc's Graphite loop transforms, where a wrong answer is miscompiled
# code rather than a crash. Arch runs the suite; Fedora's spec has it commented
# out, which is not a reason to follow.
make -j"$(nproc)" check

make install DESTDIR="$PEKIT_OUT"

find "$PEKIT_OUT/usr" -name '*.la' -delete
# gdb's pretty-printer for isl types. Upstream installs it beside the library,
# where gdb never looks; both Fedora and Arch move it under the auto-load tree,
# which is keyed by the library's install path. Do the same, or it can only be
# dropped (which is what the isl package's `excludes` was doing).
mkdir -p "$PEKIT_OUT/usr/share/gdb/auto-load/usr/lib/x86_64-linux-peios"
mv "$PEKIT_OUT"/usr/lib/x86_64-linux-peios/libisl.so.*-gdb.py \
   "$PEKIT_OUT/usr/share/gdb/auto-load/usr/lib/x86_64-linux-peios/"

# Post-install debug pipeline (same as gmp/mpfr/mpc): strip libtool's redundant
# rpath + the stray ld-linux DT_NEEDED, scrub DWARF (-> /usr/src/debug/isl), split
# debug build-id-indexed, strip, stage sources. Static .a: strip-debug.
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  patchelf --remove-rpath "$f" 2>/dev/null || true
  patchelf --remove-needed ld-linux-x86-64.so.2 "$f" 2>/dev/null || true
  debugedit -b "$ROOT" -d /usr/src/debug/isl -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$ROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/isl/$(dirname "$rel")"
  cp "$ROOT/$rel" "usr/src/debug/isl/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""

# Build deps. isl is autotools (gcc + make), links gmp, and the post-install
# debug split adds debugedit + patchelf.
[build.main.dependencies.peipkg]
build-essentials-c = "*"
gmp-devel = "*"

[build.main.dependencies.apt]
build-essential = "*"
libgmp-dev = "*"
debugedit = "*"
patchelf = "*"
