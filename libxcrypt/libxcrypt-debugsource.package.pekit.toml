# libxcrypt-debugsource — the libxcrypt source files referenced by the debug
# info, under /usr/src/debug/libxcrypt, so gdb/debuginfod can show source lines.
# The build's post-install step rewrites the DWARF comp_dir to point here
# (debugedit) and stages exactly the referenced sources. Pairs with
# libxcrypt-debuginfo (the symbols); depends on it since source without symbols
# is useless.

[package]
description = "Modern password hashing library - debug sources"

[dependencies]
libxcrypt-debuginfo = "{{version}}"

[files]
":usr/src/debug/**" = "usr/src/debug"
