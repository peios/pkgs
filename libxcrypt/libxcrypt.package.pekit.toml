# libxcrypt — runtime package: the modern shared library (libcrypt.so.2) that
# provides crypt()/crypt_r()/crypt_gensalt(). This is what PAM and shadow link.
# The legacy-ABI libcrypt.so.1 is split into libxcrypt-compat; headers/static/
# pkgconfig/man3 are libxcrypt-devel's.
#
# ":" = the default "main:" build. A glob source ("so.2*") maps to a DIRECTORY;
# an exact-file source maps to a FULL path.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
description = "Modern password hashing library (libcrypt.so.2)"

[dependencies]
# Floor = the glibc we build & test against (Peios ships only 2.43); >= so a
# future glibc still satisfies it (glibc is backward-compatible).
glibc = ">= 2.43"

[files]
# SONAME symlink (libcrypt.so.2) + the real object (libcrypt.so.2.0.0). Excludes
# the compat .so.1, the dev .so symlink, and the static .a.
":usr/lib/x86_64-linux-peios/libcrypt.so.2*" = "usr/lib/x86_64-linux-peios"
# crypt.5 documents hash-method selection / the on-disk format — a runtime/admin
# concern, so it ships with the library (the API man3 pages are devel's). Debian
# bundles crypt.5 into -dev instead; we keep it with the runtime.
":usr/share/man/man5/crypt.5"                = "usr/share/man/man5/crypt.5"
