# libxcrypt — modern password-hashing library (crypt/crypt_r/crypt_gensalt).
#
# Fills the gap left by glibc: glibc 2.38+ no longer builds libcrypt by default,
# so our glibc 2.43 package ships no libcrypt.so. crypt()/crypt_r() now live
# here, and PAM + shadow both link them.
#
# Recipe-supplies path (like glibc/figlet): upstream ships no pekit files, so
# this recipe carries the whole build. Unlike glibc, libxcrypt's git tree does
# NOT commit a configure script, so the build runs ./autogen.sh first (needs
# autoconf/automake/libtool/pkg-config; the build itself needs perl >=5.14 to
# generate the symbol-version map). Out-of-source: autogen.sh regenerates the
# build system in the source tree, then we configure + compile under $PEKIT_OUT
# and stage the install tree there via DESTDIR.
#
# Build deps are NOT declared here — `pekit build` runs inside a nix-shell that
# provides the toolchain (see _flake#libxcrypt), e.g.:
#   nix develop ./_flake#libxcrypt -c pekit build --version 4.5.2

outDir = "out"

[source]
# Canonical upstream (besser82 is the maintainer; this is the project home, not
# a mirror). Releases tag as v<major>.<minor>.<patch> (v4.5.2).
git = "https://github.com/besser82/libxcrypt.git"
rev = "v{{version}}"
# Keep enumeration (`*`/--latest) to three-component release tags.
tag_regex = '^v\d+\.\d+\.\d+$'
# Floor at the current stable line. libxcrypt is small, backward-compatible, and
# security-sensitive (password hashing), so we package latest + future only;
# older releases have no consumer and may carry CVEs. Any version is still
# buildable on demand via `--version X`.
versions = ">=4.4.36"

# Single build that produces BOTH ABIs and runs ONE debug-split over the merged
# tree (so build-ids for both libs land in one /usr/lib/debug index and sources
# stage once — cleaner than duplicating the pipeline across two [build.*]):
#
#   modern  --disable-obsolete-api -> libcrypt.so.2  (default API only; the
#           unsafe legacy funcs encrypt/setkey/fcrypt and glibc's old versioned
#           symbols are dropped). This is the full install (headers/static/pc/man).
#   compat  --enable-obsolete-api  -> libcrypt.so.1  (drop-in ABI replacement for
#           glibc's old libcrypt, for running foreign binaries). Only the
#           versioned .so.1 is grafted in; its headers/static/pc/man are identical
#           to modern's, so they're discarded (--disable-static, install to a
#           scratch root, copy just libcrypt.so.1*).
#
# Layout follows the peipkg payload spec (PSD-009 §3.4), same as glibc: usrmerge
# + arch files under /usr/lib/<triplet>. --enable-hashes defaults to all so
# legacy /etc/shadow entries still verify.
[build.main]
command = """
SRC="$(pwd)"
TRIPLET=x86_64-linux-peios
LIBDIR=/usr/lib/$TRIPLET
"$SRC/autogen.sh"

# modern: libcrypt.so.2 (full install)
mkdir -p "$PEKIT_OUT/build-modern"
cd "$PEKIT_OUT/build-modern"
"$SRC/configure" --prefix=/usr --libdir="$LIBDIR" --disable-obsolete-api
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"

# compat: libcrypt.so.1 (graft only the versioned shared lib)
mkdir -p "$PEKIT_OUT/build-compat"
cd "$PEKIT_OUT/build-compat"
"$SRC/configure" --prefix=/usr --libdir="$LIBDIR" --enable-obsolete-api --disable-static
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT/compat-root"
cp -a "$PEKIT_OUT/compat-root$LIBDIR/"libcrypt.so.1* "$PEKIT_OUT$LIBDIR/"

# Drop libtool archives — every distro removes them (they hardcode paths and
# cause overlinking; pkg-config + DT_NEEDED supersede them).
find "$PEKIT_OUT/usr" -name '*.la' -delete

# Post-install debug pipeline (identical to glibc's): scrub build paths from the
# DWARF (debugedit -> /usr/src/debug/libxcrypt), split debug out build-id-indexed
# (objcopy --only-keep-debug -> /usr/lib/debug/.build-id/), strip the binaries,
# and stage the referenced sources. Static archives just get --strip-debug
# (keeps symtab, DWARF discarded — archive members have no build-id to index).
cd "$PEKIT_OUT"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  debugedit -b "$ROOT" -d /usr/src/debug/libxcrypt -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$ROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/libxcrypt/$(dirname "$rel")"
  cp "$ROOT/$rel" "usr/src/debug/libxcrypt/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"

# Drop build scratch so only the install tree (usr/**) remains.
rm -rf "$PEKIT_OUT/build-modern" "$PEKIT_OUT/build-compat" "$PEKIT_OUT/compat-root"
"""
