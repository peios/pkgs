# perl — the Perl interpreter + core modules; texinfo's texi2any IS perl,
# help2man is perl, and the glibc/openssl-class rebuilds feed on it.
#
# Phase-2a tool (PEI-155): perl's metaconfig Configure has no out-of-source
# support, so the tree is copied into the stage and built there (the bzip2
# shape). Unthreaded, static libperl (no -Duseshrplib): XS modules dlopen
# fine against a static perl, nothing in the seed embeds libperl, and it
# keeps packaging to one tree. Stable production line only (even minors);
# man3 module docs disabled at the source (-Dman3dir=none).

out_dir = "out"

[source.url]
url      = "https://www.cpan.org/src/5.0/perl-{{version}}.tar.xz"
extract  = true
root     = "perl-{{version}}"
versions = ">= 5.44, < 5.45"

[build.main]
command = """
SRC="$(pwd)"
# In-tree build: clear any prior stage state (a stale copied tree or a
# previously installed usr/ would poison the rerun).
rm -rf "$PEKIT_OUT/build" "$PEKIT_OUT/usr"
mkdir -p "$PEKIT_OUT/build"
cp -a "$SRC/." "$PEKIT_OUT/build/"
cd "$PEKIT_OUT/build"
# §3.4.2: usr/lib subdirectories must be the arch triplet, so perl's tree
# lives inside it (the gcc-internal-tree precedent). Version parsed from
# patchlevel.h ({{version}} does not template in build commands, and the
# materialised source root is named "source", not perl-<version>).
V=$(awk '$1=="#define" && $2=="PERL_REVISION"{r=$3} $1=="#define" && $2=="PERL_VERSION"{v=$3} $1=="#define" && $2=="PERL_SUBVERSION"{s=$3} END{print r"."v"."s}' patchlevel.h)
case "$V" in *.*.*) ;; *) echo "bad perl version: $V" >&2; exit 1;; esac
P5=/usr/lib/x86_64-linux-peios/perl5
./Configure -des -Dprefix=/usr -Dcc=gcc \
  -Dprivlib="$P5/$V" \
  -Darchlib="$P5/$V/x86_64-linux" \
  -Dsitelib="$P5/site/$V" \
  -Dsitearch="$P5/site/$V/x86_64-linux" \
  -Dman1dir=/usr/share/man/man1 -Dman3dir=none
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
# perl5.44.0 is a duplicate of perl; keep the one canonical name.
find "$PEKIT_OUT/usr/bin" -name 'perl5.*' -delete
rm -rf "$PEKIT_OUT/build"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
