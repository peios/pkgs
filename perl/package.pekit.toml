format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "perl"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "Perl - the Perl 5 interpreter and core modules"
license      = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage     = "https://www.perl.org/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:Copying"  = "usr/share/licenses/perl/Copying"
"@source:Artistic" = "usr/share/licenses/perl/Artistic"
":usr/bin/**"           = "usr/bin"
# The core module tree, including the XS shared objects and headers under
# .../CORE that XS module builds (texinfo's parser) compile against.
":usr/lib/x86_64-linux-peios/perl5/**" = "usr/lib/x86_64-linux-peios/perl5"
":usr/share/man/man1/**" = "usr/share/man/man1"
