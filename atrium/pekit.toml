# atrium — the Peios web session host (atriumd).
#
# Delegate recipe: atrium is self-describing (pekit.toml and packages.pekit/
# in its own tree), so this is just a pointer, like netd's and resolvd's.

out_dir = "out"
delegate = true

# Local working copy for `--local` (compile the in-dev tree, no tag).
[source.local]
path = "../../atrium"
