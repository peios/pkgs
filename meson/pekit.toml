# meson — the build system. Packaged with ninja to close the PEI-158
# deferral ledger: kmod 34+ is meson-only, and qemu, glib2, pixman and
# the rest of that era follow.
#
# The first Python APPLICATION package, and the model for the rest.
# Libraries (docutils, flit_core) install into the interpreter's
# site-packages, which publishes them to every Python program on the
# machine. meson is a program people run, and its internals were never
# offered as an API, so it takes the layout's private-library slot
# instead: /usr/lib/<triplet>/meson/, where nothing can `import
# mesonbuild` by accident. The one program that knows the address is the
# launcher at /usr/bin/meson, which prepends that directory to sys.path
# (through the /lib runtime view) before importing — the whole mechanism
# is that single line. site-packages stays on the path, so a private
# application still uses shared libraries; privacy only governs whether
# its own modules are offered outward.
#
# Built through setuptools.build_meta (python3-setuptools) on a copy of the
# tree. The build, private install, launcher and bytecode steps are the
# workspace helper's; see _pybuild_/README.md.
#
# Not run here: meson's unit tests want every compiler and tool it has a
# module for. The proof is the smoke test in the pool: a C project
# configured, built and run in a pristine root with meson + ninja + gcc.
#
#   pekit publish --version 1.12.0 --env peipkg --keyring dev

out_dir = "out"

[source.url]
url      = "https://files.pythonhosted.org/packages/source/m/meson/meson-{{version}}.tar.gz"
extract  = true
root     = "meson-{{version}}"
versions = ">= 1.12.0"

# Literal TOML string: the launcher text below carries backslash escapes.
[build.main]
command = """
PRIV="$PEKIT_OUT/usr/lib/x86_64-linux-peios/meson"

# --private: modules into /usr/lib/<triplet>/meson, and the generated
# /usr/bin/meson launcher prepends that directory (through the /lib view) to
# sys.path before importing. Nothing else can import mesonbuild.
python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/install-wheel" \
  --backend setuptools.build_meta --copy-tree --private meson \
  --out "$PEKIT_OUT" "$(pwd)"

# data_files ride in the wheel under meson-<ver>.data/: the man page moves to
# /usr/share/man, and the polkit policy (for a privileged-install helper Peios
# does not have) goes, taking the .data scaffold with it.
install -Dm644 "$PRIV"/meson-*.data/data/share/man/man1/meson.1 \
  "$PEKIT_OUT/usr/share/man/man1/meson.1"
rm -rf "$PRIV"/meson-*.data
"""

[build.main.dependencies.peipkg]
dash               = "*"
coreutils-gnu      = "*"
python3            = ">= 3.14, < 3.15"
python3-setuptools = "*"

[build.main.dependencies.apt]
python3            = "*"
python3-setuptools = "*"
