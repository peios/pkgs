format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "meson"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "Meson - a high-performance build system"
license      = "Apache-2.0"
homepage     = "https://mesonbuild.com"

[dependencies]
# A Python application: its bytecode is bound to the interpreter's feature
# version like any library's.
python3 = ">= 3.14, < 3.15"
# meson generates ninja files and runs ninja for `meson compile`; without it
# `meson setup` fails on the spot.
ninja   = ">= 1.8.2"

[files]
"@source:COPYING"   = "usr/share/licenses/meson/"
":usr/bin/meson"    = "usr/bin/meson"
":usr/lib/x86_64-linux-peios/meson/**" = "usr/lib/x86_64-linux-peios/meson"
":usr/share/man/**" = "usr/share/man"
