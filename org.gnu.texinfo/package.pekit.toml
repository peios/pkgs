# Metadata shared by the GNU Texinfo converter package family. The expression
# covers the converters, manuals, build machinery, bundled Gnulib and Perl
# modules, and the complete generated corresponding-source package.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "noarch"
license       = "GPL-3.0-or-later AND GPL-3.0-only AND GPL-2.0-or-later AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND LGPL-3.0-only AND LGPL-3.0-or-later AND GFDL-1.3-no-invariants-or-later AND CC0-1.0 AND FSFAP AND FSFUL AND FSFULLR AND X11 AND LicenseRef-Public-Domain AND (GPL-1.0-or-later OR Artistic-1.0-Perl)"
license_class = "free"
homepage      = "https://www.gnu.org/software/texinfo/"
