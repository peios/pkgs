# GNU Texinfo converters: texi2any/makeinfo and pod2texi.
#
# This recipe deliberately builds only the architecture-independent Perl
# converters. The interactive Info reader, install-info database manager and
# printed-output shell front-ends remain excluded: Peios has no Info reader
# stack yet, and PEI-731 tracks the ownership/transaction design for the
# shared /usr/share/info/dir file.

tags = ["bootstrap"]
out_dir = "out"

# The corresponding source carries the converters, manuals, build machinery,
# bundled Gnulib and Perl modules.
[source_package]
license = "GPL-3.0-or-later AND GPL-3.0-only AND GPL-2.0-or-later AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND LGPL-3.0-only AND LGPL-3.0-or-later AND GFDL-1.3-no-invariants-or-later AND CC0-1.0 AND FSFAP AND FSFUL AND FSFULLR AND X11 AND LicenseRef-Public-Domain AND (GPL-1.0-or-later OR Artistic-1.0-Perl)"

[source.url]
url         = "https://ftp.gnu.org/gnu/texinfo/texinfo-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/texinfo/"
extract     = true
root        = "texinfo-{{version}}"
file_regex  = 'texinfo-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Follow every newer authenticated stable release;
# converter or install-info changes stop at the regression and payload gates.
versions    = ">= 7.3"

# GNU Texinfo 7.3 is signed by maintainer Gavin Smith. Pin the complete
# primary fingerprint from GNU's release key material so unattended
# discovery must authenticate every newly selected release.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/gavin-smith.asc"]
fingerprints = ["EAF669B31E31E1DECBD11513DDBC579DAB37FBA9"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
cd "$PEKIT_OUT"

"$SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --disable-rpath \
  --disable-perl-xs \
  --disable-install-warnings \
  --disable-silent-rules \
  --enable-t2a-tests \
  --enable-pod-simple-texinfo-tests

# Build only the pure-Perl converter implementations. In particular, avoid
# the Info reader, install-info, texindex and printed-output shell front-ends.
make -C tta -j"$(nproc)"
make -C Pod-Simple-Texinfo -j"$(nproc)"

# Install only the converter programs and their architecture-independent
# runtime. util install-data supplies texinfo.dtd and htmlxref metadata; the
# two po trees supply converter and generated-document translations.
make -C tta install DESTDIR="$PEKIT_OUT"
make -C Pod-Simple-Texinfo install DESTDIR="$PEKIT_OUT"
make -C util install-data DESTDIR="$PEKIT_OUT"
make -C po install-data DESTDIR="$PEKIT_OUT"
make -C po_document install-data DESTDIR="$PEKIT_OUT"

# configure writes the Perl it found under /usr/bin into each script; name
# Perl through the runtime view instead.
for script in "$PEKIT_OUT/usr/bin/texi2any" "$PEKIT_OUT/usr/bin/pod2texi" \
  "$PEKIT_OUT/usr/share/texi2any/load_txi_modules"; do
  sed -i '1s|^#! */usr/bin/perl$|#!/bin/perl|' "$script"
  test "$(head -n 1 "$script")" = '#!/bin/perl'
done

install -d "$PEKIT_OUT/usr/share/man/man1" \
  "$PEKIT_OUT/usr/share/man/man5"
install -m 0644 "$SRC/man/makeinfo.1" \
  "$PEKIT_OUT/usr/share/man/man1/makeinfo.1"
install -m 0644 "$SRC/man/texi2any.1" \
  "$PEKIT_OUT/usr/share/man/man1/texi2any.1"
install -m 0644 "$SRC/man/pod2texi.1" \
  "$PEKIT_OUT/usr/share/man/man1/pod2texi.1"
install -m 0644 "$SRC/man/texinfo.5" \
  "$PEKIT_OUT/usr/share/man/man5/texinfo.5"
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -9n {} \\;
"""

[test]
needs = ["main"]
gate = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
# Do not silently skip legacy-encoding cases when the converter provider is absent.
grep -F "our \$conversion_from_euc_cn = 'yes';" "$STAGE/usr/share/texi2any/Texinfo/ModulePath.pm"
BIN="$STAGE/usr/bin"
SMOKE="$PEKIT_OUT/smoke"
mkdir -p "$SMOKE"

# Run the complete converter/module suites. Peios does not yet package the
# optional Test::Deep module, so accept only that suite's exact single
# missing-module error after every other TAP test has completed.
if ! make -C "$STAGE/tta/perl" -j"$(nproc)" check; then
  actual=$(find "$STAGE/tta/perl" -name '*.trs' -type f | while IFS= read -r result; do
    grep -Eq '^:test-result: (FAIL|ERROR)$' "$result" || continue
    printf '%s\n' "${result#"$STAGE/tta/perl"/}"
  done | LC_ALL=C sort)
  expected='t/z_misc/test_sort.trs'
  [ "$actual" = "$expected" ]
  grep -F "Can't locate Test/Deep.pm" \
    "$STAGE/tta/perl/t/z_misc/test_sort.log"
  grep -Fqx 'ERROR: t/z_misc/test_sort.t - exited with status 2' \
    "$STAGE/tta/perl/t/z_misc/test_sort.log"
fi
# The ordinary command suite covers every converter mode enabled by this
# package. Upstream's opt-in all-checks target additionally forces integrations
# with TeX and third-party syntax highlighters, plus XS-only collation cases;
# those are deliberately outside this pure-Perl package's feature boundary.
make -C "$STAGE/tta/tests" -j"$(nproc)" check
make -C "$STAGE/Pod-Simple-Texinfo" -j"$(nproc)" check

test -x "$BIN/texi2any"
test -x "$BIN/pod2texi"
test -L "$BIN/makeinfo"
test "$(readlink "$BIN/makeinfo")" = texi2any
"$BIN/texi2any" --version | head -1 | grep -F "$PEKIT_VERSION"
"$BIN/pod2texi" --version | head -1 | grep -Fx 'pod2texi 0.01'

# Exercise the staged converter in its principal text, HTML, DocBook, XML
# and Info output modes.
cat > "$SMOKE/sample.texi" <<'EOF'
\input texinfo
@setfilename sample.info
@settitle Texinfo smoke
@node Top
@top Texinfo smoke
@node First chapter
@chapter First chapter
@cindex smoke
The café value is @strong{ready}.
@bye
EOF
"$BIN/texi2any" --plaintext --output="$SMOKE/sample.txt" \
  "$SMOKE/sample.texi"
grep -F 'The café value is *ready*.' "$SMOKE/sample.txt"
"$BIN/texi2any" --html --no-split --output="$SMOKE/sample.html" \
  "$SMOKE/sample.texi"
grep -F '<strong class="strong">ready</strong>' "$SMOKE/sample.html"
"$BIN/texi2any" --docbook --output="$SMOKE/sample.dbk" \
  "$SMOKE/sample.texi"
grep -F '<emphasis role="bold">ready</emphasis>' "$SMOKE/sample.dbk"
"$BIN/texi2any" --xml --output="$SMOKE/sample.xml" \
  "$SMOKE/sample.texi"
grep -F '<strong>ready</strong>' "$SMOKE/sample.xml"
"$BIN/makeinfo" --output="$SMOKE/sample.info" "$SMOKE/sample.texi"
grep -F 'The café value is *ready*.' "$SMOKE/sample.info"

cat > "$SMOKE/sample.pod" <<'EOF'
=head1 NAME

sample - pod2texi smoke

=head1 DESCRIPTION

Converter is B<ready>.

=cut
EOF
"$BIN/pod2texi" --output="$SMOKE/sample-pod.texi" "$SMOKE/sample.pod"
grep -F '@strong{ready}' "$SMOKE/sample-pod.texi"

# Prove that this remains an architecture-independent converter payload and
# that none of the PEI-731-deferred programs/shared files were installed.
for forbidden in info install-info texindex texi2dvi texi2pdf pdftexi2dvi; do
  test ! -e "$BIN/$forbidden"
done
test ! -e "$STAGE/usr/share/info"
test ! -e "$STAGE/usr/share/info/dir"
command -v file >/dev/null
if find "$STAGE/usr" -type f -exec file {} + | grep -F ': ELF '; then
  exit 1
fi
test -n "$(find "$STAGE/usr/share/locale" -type f \
  -name 'texinfo.mo' -print -quit)"
test -n "$(find "$STAGE/usr/share/locale" -type f \
  -name 'texinfo_document.mo' -print -quit)"
find "$STAGE/usr/bin" -type f | while IFS= read -r script; do
  perl -c "$script"
done
for script in "$BIN/texi2any" "$BIN/pod2texi" \
  "$STAGE/usr/share/texi2any/load_txi_modules"; do
  test "$(head -n 1 "$script")" = '#!/bin/perl'
done

# libintl-perl's modules are imported, never command entry points. Preserve
# upstream's explicit refusal to execute them and bound the lint allowance.
MODULES="$STAGE/usr/share/texi2any/lib/libintl-perl/lib/Locale"
test -d "$MODULES"
find "$MODULES" -type f -name '*.pm' | while IFS= read -r module; do
  IFS= read -r first < "$module"
  case "$first" in
    '#!'*) test "$first" = '#! /bin/false';;
  esac
done

'''

[test.dependencies.peipkg]
# Gnulib probes EUC-JP before enabling the EUC-CN conversion regression cases.
"org.gnu.glibc-gconv-extra" = ">= 2.44"
"org.gnu.tar" = "*"
"dev.peios.build-essentials-c" = "*"
"com.darwinsys.file"           = "*"
"org.gnu.glibc-langpack-en"    = ">= 2.43"
"org.gnu.glibc-langpack-fr"    = ">= 2.43"
"org.gnu.gettext"              = "*"
"org.perl.perl"                = "*"

[build.main.dependencies.peipkg]
# Gnulib probes EUC-JP before enabling the EUC-CN conversion regression cases.
"org.gnu.glibc-gconv-extra" = ">= 2.44"
"org.gnu.gzip" = "*"
"dev.peios.build-essentials-c"   = "*"
"com.darwinsys.file" = "*"
"org.gnu.glibc-langpack-en"    = ">= 2.43"
"org.gnu.glibc-langpack-fr"    = ">= 2.43"
"org.gnu.gettext" = "*"
"org.perl.perl"    = "*"
