# slang-devel — slang.h, the .so link, and pkg-config metadata.

[package]
name        = "slang-devel"
description = "S-Lang - headers and link library"

[dependencies]
libslang = "{{version}}"

[files]
":usr/include/**"                          = "usr/include"
":usr/lib/x86_64-linux-peios/libslang.so"  = "usr/lib/x86_64-linux-peios/libslang.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**" = "usr/lib/x86_64-linux-peios/pkgconfig"
