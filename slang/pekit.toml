# slang — the S-Lang terminal library; perf's TUI links it (PEI-158
# Tier 2).
#
# Configure-style but NOT out-of-source capable ("does not support
# configuring from another directory") — built in a tree copy (the bzip2
# dance). Only the shared library is built (install-elf; static dropped,
# house style). Optional module backends (png/pcre/iconv/onig) auto-skip
# in the pristine root — only zlib is declared (the zlib module and
# compressed docs support). The slsh shell rides with the library package.
# libncurses supplies /usr/share/terminfo at BUILD time too: without it
# slang's configure finds no terminfo tree and falls back to -ltermcap,
# which nothing provides.
# NOTE: the library's makefile is not parallel-safe — serial make.

out_dir = "out"

[source.url]
url      = "https://www.jedsoft.org/releases/slang/slang-{{version}}.tar.bz2"
extract  = true
root     = "slang-{{version}}"
versions = ">= 2.3.3"

[build.main]
command = """
SRC="$(pwd)"
LIBDIR=/usr/lib/x86_64-linux-peios
mkdir -p "$PEKIT_OUT/build"
cp -a "$SRC/." "$PEKIT_OUT/build/"
cd "$PEKIT_OUT/build"
./configure --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --libdir="$LIBDIR"
make install-elf DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/doc" "$PEKIT_OUT/build"
find "$PEKIT_OUT$LIBDIR" -maxdepth 1 -name '*.a' -delete
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
"zlib-devel" = "*"
libncurses = "*"

[build.main.dependencies.apt]
build-essential = "*"
zlib1g-dev = "*"
ncurses-base = "*"
