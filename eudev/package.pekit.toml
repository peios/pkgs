# Shared defaults layer for the eudev members (a bare package.pekit.toml
# is never a package once named members exist).

format = "peipkg"

[package]
# -2: the daemon ships (PEI-58). udevd, udevadm, helpers, a Peios rules set,
# the coldplug post-hook and the eudev service seed; kmod and blkid on.
# -3: the service definition names all three privileges udevd needs
# (SeTcbPrivilege for the netlink multicast, SeCreateSymbolicLinkPrivilege for
# /dev/disk/by-*), found on the first boot of -2.
version      = "{{version}}-3"
architecture = "x86_64"
license      = "LGPL-2.1-or-later"
homepage     = "https://github.com/eudev-project/eudev"
