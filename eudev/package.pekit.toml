# Shared defaults layer for the eudev members (a bare package.pekit.toml
# is never a package once named members exist).

format = "peipkg"

[package]
# -2: the daemon ships (PEI-58). udevd, udevadm, helpers, a Peios rules set,
# the coldplug post-hook and the eudev service seed; kmod and blkid on.
# -3: the service definition names all three privileges udevd needs
# (SeTcbPrivilege for the netlink multicast, SeCreateSymbolicLinkPrivilege for
# /dev/disk/by-*), found on the first boot of -2.
# -4: hwdb on and the rules that import it; predictable NIC names
# (80-net-name-slot); static_node pre-creation restored; path_id knows virtio
# so vdX disks get by-path names.
# -5: the coldplug hook creates the static device nodes from modules.devname;
# udev only ever adjusted the permissions of nodes that already existed.
# -6: 60-persistent-input and 70-touchpad actually ship (-4/-5 dropped them
# by a line-wrap in the keep list); the build now asserts every kept rule.
version      = "{{version}}-6"
architecture = "x86_64"
license      = "LGPL-2.1-or-later"
homepage     = "https://github.com/eudev-project/eudev"
