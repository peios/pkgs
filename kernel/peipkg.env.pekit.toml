# Kernel delegate override of the standard rung-2 environment (PEI-158):
# pekit resolves --env names against the recipe dir before the fetched pkm
# source, so this file (not pkm's docker env.pekit.toml) wraps the kernel
# family's stages under --env peipkg. enter.sh injects the pkm toolchain
# knobs a composed root needs; everything else is the standard
# _peiroot_ flow.
#
# The network-needing source-materialisation stages (build.upstream's git
# clone, build.source's patch application) cannot run under this env
# (--unshare-all) — run them off-rung first, then reuse:
#   pekit build source --env none --local --version <v>
#   pekit build headers --env peipkg --no-build=upstream,source --version <v> ...
dependency_provider = "peipkg"

[wrap]
command = 'exec "$PEKIT_WORKSPACE_ROOT/kernel/enter.sh" {{command}}'
