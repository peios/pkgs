# dev.peios.kernel — the Peios kernel plus its in-tree userspace tooling, built from the
# pkm source (40 binary package definitions covering the kernel-* set plus
# perf/bpftool/cpupower/etc., and one generated corresponding-source package).
#
# Delegate recipe: pkm is self-describing — from v0.20.1-rc1 on it commits its
# own pekit files (the build pipeline in pekit.toml, the package definitions in
# packages.pekit/ with their shared base), so this recipe is just a pointer.
# pekit fetches the tag matching --version and borrows the source's own build +
# package definitions; a bare `pekit package` on this member builds the whole
# family, the same way the gcc/glibc members fan a single source into many
# packages. The workspace root's publish.peipkg target merges in underneath
# (root < source < member), so publication updates the signed repository like
# every other production package.
#
# The workspace prepares dependency roots and Pekit isolates every target.
# Member env files only supply compiler configuration. Keyring public inputs
# are explicitly granted; production private keys stay with the coordinator.
# Build fixes belong in pkm itself and reach this recipe with its next tag;
# nothing here patches or overrides the borrowed pipeline.

out_dir = "out"
delegate = true

[source.git]
url = "https://github.com/peios/pkm.git"
ref = "v{{version}}"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?)$'
# pkm only carries its own pekit files from v0.20.1-rc1 on; earlier tags
# (≤ v0.20.0-rc2) predate them, so a "*" sweep skips them instead of failing.
# The floor is written with the prerelease (-rc1, not 0.20.1) deliberately: a
# bare ">=0.20.1" cap would drop every prerelease — including the only tags that
# ship today — so the prerelease suffix is what lets RC tags through the cap.
versions = ">=0.20.1-rc1"
# The pristine Linux tarball comes with the borrowed build: from v0.20.1-rc21
# pkm declares it as [input.linux], beside the KERNEL_VERSION and patch series
# it must agree with, and carries kernel.org's release key. Pekit fetches and
# verifies it and pins it in this recipe's pekit.lock. v0.20.1-rc20 and older
# declare no input and no longer build from this recipe.

# Local working copy for `--local` (build the in-dev tree, no tag).
# Relative to this recipe dir; never used by the farm.
[source.local]
path = "../../pkm"
