llvm-18-dev = "*"
# perf builds with BUILD_BPF_SKEL=1, and perf and bpftool both reach for the
# unversioned clang, llvm-strip and llvm-config (tools/scripts/Makefile.include).
# They need one coherent LLVM: once an llvm-config is on the path they compile
# against its headers, so installing `llvm` without `llvm-dev` breaks bpftool's
# jit_disasm.c on a missing llvm-c/Core.h. These are Debian's default-version
# names, as the native list's org.llvm.clang, org.llvm.llvm and
# org.llvm.llvm-devel are unpinned there. perf's bootstrap bpftool also compiles
# sign.c against the OpenSSL headers (org.openssl.openssl-devel natively).
clang = "*"
llvm = "*"
llvm-dev = "*"
libssl-dev = "*"
# getdelays is built against this kernel's own UAPI via `make headers_install`,
# which copies the headers with rsync (org.samba.rsync natively).
rsync = "*"
libbpf-dev = "*"
bpftool = "*"
libcpupower-dev = "*"
libdebuginfod-dev = "*"
systemtap-sdt-dev = "*"
libbabeltrace-dev = "*"
default-jdk = "*"
source-highlight = "*"
python3 = "*"
perl = "*"
