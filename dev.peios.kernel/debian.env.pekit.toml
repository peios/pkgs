# Compiler configuration; dependency preparation and isolation come from the workspace.
dependency_provider = "apt"
[env]
# The reference overlay supplies the kernel's Rust 1.83 as a Peios build, whose
# rust-src sits under the multiarch libdir rather than the
# $(rustc --print sysroot)/lib/rustlib path Kbuild assumes. The native rung sets
# the same value for the same reason. PKM_LLVM keeps its "-18" default here,
# selecting Debian's versioned clang-18 and ld.lld-18.
RUST_LIB_SRC = "/usr/lib/x86_64-linux-peios/rustlib/src/rust/library"
