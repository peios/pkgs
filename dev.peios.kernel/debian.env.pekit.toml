# Compiler configuration; dependency preparation and isolation come from the workspace.
dependency_provider = "apt"
[env]
# The Debian root receives upstream's signed Rust 1.83.0 (pkgs/_debroot_),
# installed with upstream's own layout, so rust-src sits at the sysroot path
# Kbuild assumes. The native Peios build keeps it under the multiarch libdir,
# which its env file names instead. PKM_LLVM keeps its "-18" default here,
# selecting Debian's versioned clang-18 and ld.lld-18.
RUST_LIB_SRC = "/usr/lib/rustlib/src/rust/library"
