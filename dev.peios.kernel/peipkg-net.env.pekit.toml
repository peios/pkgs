# Kernel delegate override for the workspace peipkg-net profile.
#
# PKM has no build:vendor target, so every target remains on the ordinary
# offline kernel build rung.  Keeping this named override prevents a workspace
# package run selected with --env peipkg-net from losing the kernel-specific
# toolchain settings supplied by enter.sh.
dependency_provider = "peipkg"

[wrap]
command = 'exec "$PEKIT_WORKSPACE_ROOT/dev.peios.kernel/enter.sh" {{command}}'
