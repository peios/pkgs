# v0.20.1-rc13-1 and -2 were published before the production metadata audit
# completed. The repository is immutable, so carry the coherent family as a
# catalogue-level revision instead of rewriting either release. Recipe package
# defaults overlay the delegated source defaults and therefore apply uniformly
# to every kernel and in-tree-tools subpackage (including corresponding source);
# the selector overlays align every exact intra-family dependency and generic
# kernel capability with that same revision. Pekit derives the corresponding-source
# description from this resolved version, so it must identify the -3 family too.
[package]
version = "{{version}}-3"
