# Shared metadata for the private musl build sysroot. This package is not a
# Peios runtime libc and deliberately provides no generic `libc` capability.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "MIT"
license_class = "free"
homepage      = "https://musl.libc.org/"
