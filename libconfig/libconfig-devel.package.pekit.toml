# libconfig-devel — libconfig.h, the .so link, and pkg-config metadata.

[package]
name        = "libconfig-devel"
description = "libconfig - headers and link library"

[dependencies]
libconfig = "{{version}}"

[files]
":usr/include/**"                            = "usr/include"
":usr/lib/x86_64-linux-peios/libconfig.so"   = "usr/lib/x86_64-linux-peios/libconfig.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**"   = "usr/lib/x86_64-linux-peios/pkgconfig"
