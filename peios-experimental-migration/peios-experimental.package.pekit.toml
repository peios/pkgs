format = "peipkg"

[package]
name          = "peios-experimental"
version       = "{{version}}-10"
architecture  = "noarch"
description   = "One-time migration from the legacy Experimental edition package name"
license       = "MIT"
license_class = "free"
homepage      = "https://github.com/peios/pkgs"

[package.alternate_upgrade]
message = "To upgrade Peios use the `upgrade-peios` command."

[dependencies]
"dev.peios.peios-experimental" = ">= 2026.8-14"

[files]
"@recipe:docs/README" = "usr/share/doc/peios-experimental/MIGRATION"
"@recipe:docs/LICENSE" = "usr/share/licenses/peios-experimental/LICENSE"
