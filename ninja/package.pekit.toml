format = "peipkg"

[package]
name         = "ninja"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "Ninja - a small build system with a focus on speed"
license      = "Apache-2.0"
homepage     = "https://ninja-build.org/"

[dependencies]
glibc       = ">= 2.43"
"libstdc++" = ">= 16"

[files]
"@source:COPYING" = "usr/share/licenses/ninja/"
":usr/bin/ninja"  = "usr/bin/ninja"
