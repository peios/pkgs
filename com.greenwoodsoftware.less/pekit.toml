out_dir = "out"

[source.url]
url = "https://www.greenwoodsoftware.com/less/less-{{version}}.tar.gz"
listing_url = "https://www.greenwoodsoftware.com/less/download.html"
file_regex = 'less-[0-9]+(?:\.[0-9]+)?\.tar\.gz'
root = "less-{{version}}"
extract = true
# Follow stable releases; beta archives do not match the discovery expression.
versions = ">= 710"

# PEI-1179: Jack approved the recipe-only legacy-signature exception on
# 2026-09-27. GPG verifies upstream's DSA/SHA-1 signature; Pekit rejects DSA.
# Pin each reviewed archive explicitly: discovery of a newer release fails
# closed until its provenance is reviewed. See provenance/README.md.
[source.url.checksum]
"710" = "sha256:d1008fb78dcae1323ddab664bcb352a61f022b1b131bd8018548e021d975ec7a"

[build.main]
command = '''
set -eu
SRC=$(pwd)
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/com.greenwoodsoftware.less"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man --libexecdir=/usr/libexec/less --with-regex=posix
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr/share/man" -type f -exec gzip -9n {} \;
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" com.greenwoodsoftware.less "$PEKIT_OUT/usr"
'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.ncurses-devel" = "*"
"org.gnu.gzip" = "*"

[test]
needs = ["main"]
gate = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
cd "$STAGE"
make -j"$(nproc)" check TERMLIB=-lncursesw
printf 'alpha\nbeta\ngamma\n' > "$PEKIT_OUT/input"
"$STAGE/usr/bin/less" "$PEKIT_OUT/input" > "$PEKIT_OUT/output"
cmp "$PEKIT_OUT/input" "$PEKIT_OUT/output"
"$STAGE/usr/bin/less" --version | grep -F "$PEKIT_VERSION"
"$STAGE/usr/libexec/less/lessecho" -a '-o[' '-c]' 'two words' | grep -Fx '[two words]'
cc -o "$PEKIT_OUT/pty-drive" "$PEKIT_WORKSPACE_ROOT/_pkgtools_/pty-drive.c"
printf 'expect alpha\nsend /gamma\\r\nexpect gamma\nsend q\n' > "$PEKIT_OUT/pager.script"
TERM=xterm "$PEKIT_OUT/pty-drive" "$PEKIT_OUT/pager.script" -- "$STAGE/usr/bin/less" "$PEKIT_OUT/input"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.ncurses-devel" = "*"
"org.perl.perl" = "*"
"org.gnu.glibc-langpack-en" = "*"
"org.gnu.glibc-gconv-extra" = "*"
