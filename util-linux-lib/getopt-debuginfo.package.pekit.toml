# getopt-debuginfo — separated debug symbols for getopt, build-id-indexed.
#
# Mapped from a staging path rather than from usr/lib/debug: every binary built
# from this source tree lands its debug under the same build-id tree, and a
# build-id cannot be globbed statically, so the build moves this one out before
# packaging. That keeps libblkid-debuginfo owning exactly libblkid's symbols,
# which is the split its own note asks for.
#
# The debug SOURCES are shared with libblkid-debugsource: they are the
# util-linux tree either way, which is why that package is named for the source
# rather than for a library.

[package]
description = "getopt - debugging symbols"
license     = "GPL-2.0-or-later"

[dependencies]
getopt = "{{version}}"

[files]
":getopt-debug/usr/lib/debug/**" = "usr/lib/debug"
