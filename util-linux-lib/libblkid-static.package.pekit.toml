# libblkid-static — the static archive, for statically linking libblkid. Split
# out of -devel (matching the gmp/binutils convention) so a normal link-time
# consumer pulls only the headers + dev symlink, not the archive.

[package]
description = "Block device identification library - static library"

[dependencies]
libblkid-devel = "{{version}}"

[files]
":usr/lib/x86_64-linux-peios/libblkid.a" = "usr/lib/x86_64-linux-peios/libblkid.a"
