# libblkid-debugsource — the util-linux sources referenced by libblkid's debug
# info, under /usr/src/debug/util-linux, so gdb/debuginfod can show source
# lines. Pairs with libblkid-debuginfo (symbols without source are half-blind).
#
# The path is source-named (util-linux), not library-named, so a future sibling
# library built from the same tree shares this debugsource rather than
# duplicating it.

[package]
description = "Block device identification library - debug sources"

[dependencies]
libblkid-debuginfo = "{{version}}"

[files]
":usr/src/debug/**" = "usr/src/debug"
