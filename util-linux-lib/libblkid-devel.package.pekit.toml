# libblkid-devel — headers, the dev .so symlink, and the pkg-config file for
# building software against libblkid. (Peiosutils itself dlopens the library and
# needs none of this, but other platform software that link-time -lblkid does.)

[package]
description = "Block device identification library - development files"

[dependencies]
libblkid = "{{version}}"

[files]
":usr/include/blkid/**"                              = "usr/include/blkid"
# Dev .so symlink (listed explicitly so the versioned runtime libs are not
# double-claimed by a lib*.so glob).
":usr/lib/x86_64-linux-peios/libblkid.so"            = "usr/lib/x86_64-linux-peios/libblkid.so"
# blkid.pc for pkg-config.
":usr/lib/x86_64-linux-peios/pkgconfig/blkid.pc"     = "usr/lib/x86_64-linux-peios/pkgconfig/blkid.pc"
