# libblkid-debuginfo — separated debug symbols for libblkid, build-id-indexed
# under /usr/lib/debug/.build-id/ (gdb/debuginfod locate them by the binary's
# build-id).
#
# NOTE for when a sibling library is enabled: all libraries built from this one
# source land their build-id debug under /usr/lib/debug. If you add e.g.
# libmount, give it its own libmount-debuginfo and split this glob by the
# relevant build-ids (the Fedora per-binary-package model), so each -debuginfo
# tracks exactly its library.

[package]
description = "Block device identification library - debugging symbols"

[dependencies]
libblkid = "{{version}}"

[files]
":usr/lib/debug/**" = "usr/lib/debug"
