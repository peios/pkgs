# Base metadata shared by the qualified disk-boot packages. Each package
# fragment inherits these fields and adds its own identity, description,
# dependencies, and files. Both are buildless: their payloads come from src/.
#
# noarch: the payloads are a shell script and a cmdline template. Their
# peiosutils dependency resolves for the target machine.
format = "peipkg"

[package]
version      = "1.0.0-1"
architecture = "noarch"
license      = "MIT"
license_class = "free"
homepage     = "https://github.com/peios/pkgs"
