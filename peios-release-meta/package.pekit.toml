format = "peipkg"

[package]
name         = "peios-release-meta"
version      = "{{version}}-1"
architecture = "noarch"
description  = "Peios OS release identity: the freedesktop os-release file"

# The os-release file generated by the build, plus its /etc compat symlink.
# `:` sources from the main build's stage; an exact (non-glob) source maps to
# its exact destination path.
[files]
":usr/lib/os-release" = "usr/lib/os-release"
":etc/os-release"     = "etc/os-release"
