# libpfm — hardware performance-event discovery and encoding. SourceForge's
# perfmon2 project is authoritative; wcohen/libpfm4 identifies itself as a
# mirror and is not used as the source of release bytes.

tags = ["bootstrap"]
out_dir = "out"

[source.url]
url         = "https://downloads.sourceforge.net/project/perfmon2/libpfm4/libpfm-{{version}}.tar.gz"
listing_url = "https://sourceforge.net/projects/perfmon2/files/libpfm4/"
root        = "libpfm-{{version}}"
extract     = true
file_regex  = 'libpfm-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz'
# Soft maintenance floor. Follow every later stable release automatically;
# ABI and source-layout drift are enforced by the build and test gates below.
versions    = ">= 4.13.0"

# The official file area publishes release archives but no detached signatures.
# The official v4.13.0 tag is lightweight rather than signed and annotated.
# This is an explicit authentication exception: HTTPS authenticates transport
# and Pekit's immutable SHA-256 lock detects changed bytes, but neither proves
# that a maintainer signed a newly discovered release.

[build.main]
command = """
set -eu
SRC="$(pwd)"
BUILD="$PEKIT_OUT/build"
LIBDIR="$PEKIT_OUT/usr/lib/x86_64-linux-peios"
INCLUDEDIR="$PEKIT_OUT/usr/include/perfmon"

# Upstream's plain Makefiles are in-tree-only. Keep the locked source pristine
# and build a disposable copy so the corresponding-source payload is exact.
mkdir -p "$BUILD"
cp -a "$SRC/." "$BUILD/"
cd "$BUILD"

# Verify that the archive's internal version agrees with the version Pekit
# selected from the official file listing before compiling any payload.
MAJOR=$(sed -n 's/^VERSION=//p' config.mk)
MINOR=$(sed -n 's/^REVISION=//p' config.mk)
PATCH=$(sed -n 's/^AGE=//p' config.mk)
test "$MAJOR.$MINOR.$PATCH" = "$PEKIT_VERSION"
test -s COPYING
test -s README

# Distribution builds must not inherit upstream's -Werror policy: new compiler
# diagnostics are not package build failures. OPTIM carries Peios's inherited
# optimisation, fortification, stack and control-flow flags. Python bindings
# remain disabled: they are optional, and the Peios catalogue does not yet
# contain their SWIG build dependency.
env -u CFLAGS make -j"$(nproc)" \
  ARCH=x86_64 \
  CONFIG_PFMLIB_SHARED=y \
  CONFIG_PFMLIB_NOPYTHON=y \
  OPTIM="$CFLAGS" \
  DBG="-Wall -Wextra -Wno-unused-parameter" \
  LDFLAGS="$LDFLAGS -Wl,-z,ibtplt"

env -u CFLAGS make install \
  DESTDIR="$PEKIT_OUT" \
  PREFIX=/usr \
  LIBDIR=/usr/lib/x86_64-linux-peios \
  LDCONFIG=true \
  ARCH=x86_64 \
  CONFIG_PFMLIB_SHARED=y \
  CONFIG_PFMLIB_NOPYTHON=y \
  OPTIM="$CFLAGS" \
  DBG="-Wall -Wextra -Wno-unused-parameter" \
  LDFLAGS="$LDFLAGS -Wl,-z,ibtplt"

# Compress upstream manuals deterministically for the installed payload.
find "$PEKIT_OUT/usr/share/man" -type f ! -name '*.gz' -exec gzip -9n {} +

# Discover the concrete library while deliberately gating the public ABI.
PFM_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libpfm.so.4.*' | LC_ALL=C sort)
test "$(printf '%s\n' "$PFM_SO" | grep -c .)" -eq 1

# Keep build-ID-indexed symbols and exactly the source files named by rewritten
# runtime DWARF; strip the shared object and the static archive. DWARF paths
# are relative to the disposable build copy, so it is the build root.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" --build-root "$BUILD" \
  net.sourceforge.perfmon2.libpfm "$PFM_SO" "$LIBDIR/libpfm.a"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.sourceware.debugedit"          = "*"

"org.gnu.gzip" = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
TMP="$PEKIT_OUT/libpfm-test"
LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
INCLUDEDIR="$STAGE/usr/include/perfmon"
PFM_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libpfm.so.4.*' | LC_ALL=C sort)
test "$(printf '%s\n' "$PFM_SO" | grep -c .)" -eq 1
test -L "$LIBDIR/libpfm.so"
test -L "$LIBDIR/libpfm.so.4"
test -s "$LIBDIR/libpfm.a"
test "$(find "$INCLUDEDIR" -maxdepth 1 -type f -name '*.h' | wc -l)" -eq 3
test "$(find "$STAGE/usr/share/man/man3" -maxdepth 1 -type f -name '*.3.gz' | wc -l)" -ge 70
readelf -d "$PFM_SO" | grep -F 'Library soname: [libpfm.so.4]'
readelf --dyn-syms -W "$PFM_SO" | grep -E ' pfm_initialize(@|$)'
readelf --dyn-syms -W "$PFM_SO" | grep -E ' pfm_get_os_event_encoding(@|$)'
nm -g --defined-only "$LIBDIR/libpfm.a" | grep -E ' [T] pfm_initialize$'

# This is upstream's complete architecture-aware validation binary. It checks
# event-table structure, encodings, attributes, invalid forms, PMU discovery
# and Linux perf-event translations without opening privileged counters.
(cd "$STAGE/build" && LIBPFM_ENCODE_INACTIVE=1 ./tests/validate)
mkdir -p "$TMP"
cat > "$TMP/main.c" <<'EOF'
#include <perfmon/pfmlib.h>
#include <stdint.h>
#include <stdlib.h>
int main(void) {
  uint64_t *codes = NULL;
  char *full = NULL;
  int count = 0;
  int ret;
  if (setenv("LIBPFM_ENCODE_INACTIVE", "1", 1)) return 1;
  if (pfm_initialize() != PFM_SUCCESS) return 2;
  if (PFM_MAJ_VERSION(pfm_get_version()) != 4) return 3;
  ret = pfm_get_event_encoding("perf::PERF_COUNT_HW_CPU_CYCLES",
      PFM_PLM0 | PFM_PLM3, &full, NULL, &codes, &count);
  if (ret != PFM_SUCCESS || !full || !codes || count < 1) return 4;
  free(full);
  free(codes);
  pfm_terminate();
  return 0;
}
EOF
cc "$TMP/main.c" -I"$STAGE/usr/include" -L"$LIBDIR" -lpfm \
  -Wl,-rpath-link,"$LIBDIR" -o "$TMP/shared"
LD_LIBRARY_PATH="$LIBDIR" "$TMP/shared"
cc "$TMP/main.c" -I"$STAGE/usr/include" "$LIBDIR/libpfm.a" \
  -pthread -lm -o "$TMP/static"
"$TMP/static"

set -- "$STAGE"/usr/lib/debug/.build-id/*/*.debug
test "$#" -eq 1
readelf -S "$1" | grep -F '.debug_info'
test -n "$(find "$STAGE/usr/src/debug/net.sourceforge.perfmon2.libpfm" -type f -print -quit)"
readelf -h "$PFM_SO" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l "$PFM_SO" | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l "$PFM_SO" | grep -F 'GNU_RELRO'
readelf -d "$PFM_SO" | grep -F 'BIND_NOW'
readelf -d "$PFM_SO" | grep -F 'RELR'
readelf -n "$PFM_SO" | grep -E 'x86 feature:.*IBT.*SHSTK'
if readelf -d "$PFM_SO" | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
test "$(readelf -d "$PFM_SO" | grep -c 'Shared library:')" -eq 1
readelf -d "$PFM_SO" | grep -F 'Shared library: [libc.so.6]'
rm -rf "$TMP" "$STAGE/build"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.findutils" = "*"
"org.gnu.grep" = "*"
