# net.sourceforge.perfmon2.libpfm-devel — public headers, linker name and
# complete API/PMU manual set. The static archive is kept in its own sibling.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "net.sourceforge.perfmon2.libpfm-devel"
description = "libpfm - headers and link library"

[provides]
libpfm-devel = "{{version}}"

[dependencies]
"net.sourceforge.perfmon2.libpfm" = "{{version}}-1"

[files]
"@source:COPYING"                      = "usr/share/licenses/net.sourceforge.perfmon2.libpfm-devel/"
":usr/include/**"                        = "usr/include"
":usr/lib/x86_64-linux-peios/libpfm.so"  = "usr/lib/x86_64-linux-peios/libpfm.so"
":usr/share/man/**"                      = "usr/share/man"
