# zlib-ng — the NATIVE zlib-ng library (SONAME libz-ng.so.2): the zng_-prefixed
# API (zng_deflate, zng_inflate, ...) for software that targets zlib-ng directly
# rather than the classic zlib API. The compat/system zlib is the separate
# `zlib` package; headers/static are zlib-ng-devel/zlib-ng-static.

[package]
description = "Compression library (zlib-ng native API) - shared library (libz-ng.so.2)"

[dependencies]
# Floor = the glibc we build & test against (Peios ships only 2.43); >= so a
# future glibc still satisfies it (glibc is backward-compatible).
glibc = ">= 2.43"

[files]
# License text (distro convention: /usr/share/licenses/<name>/).
"@source:LICENSE.md" = "usr/share/licenses/zlib-ng/"
# SONAME symlink (libz-ng.so.2) + real object (libz-ng.so.2.3.3). Excludes the
# dev libz-ng.so symlink and the static libz-ng.a.
":usr/lib/x86_64-linux-peios/libz-ng.so.2*" = "usr/lib/x86_64-linux-peios"
