# zlib-debuginfo — separated debug symbols for BOTH shared libraries (the compat
# libz.so.1 and the native libz-ng.so.2), build-id-indexed under
# /usr/lib/debug/.build-id/ where gdb/perf/debuginfod locate them by build-id.
# One package covers both because debug info is found by build-id, not by name.
# Named after the headline `zlib` package; depends on it.
#
# Static-archive (*.a) debug is NOT here — those are --strip-debug'd and
# discarded at build time.

[package]
description = "Compression library - debugging symbols (zlib + zlib-ng)"

[dependencies]
zlib = "{{version}}"

[files]
":usr/lib/debug/**" = "usr/lib/debug"
