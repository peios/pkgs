# zlib-ng — Peios's zlib, shipped in BOTH ABIs from one source:
#   compat  (-DZLIB_COMPAT=ON)  -> libz.so.1 / zlib.h / zlib.pc      (the system
#           zlib; a drop-in classic-zlib replacement; packaged as `zlib`)
#   native  (-DZLIB_COMPAT=OFF) -> libz-ng.so.2 / zlib-ng.h / zlib-ng.pc  (the
#           zng_-prefixed native API; packaged as `zlib-ng`)
#
# Peios ships zlib-ng (not classic madler zlib) because it is faster
# (runtime-dispatched SIMD) and compat mode is a drop-in. Fedora made the same
# switch at F40 and is the only major distro to have done so: Debian packages
# no zlib-ng at all (zlib1g is still madler 1.3.2), and Arch offers
# zlib-ng-compat only as an opt-in package that Conflicts with zlib.
#
# The one real cost — zlib-ng's compressed output differs byte-for-byte from
# classic zlib (still valid DEFLATE), tripping tests that assert exact bytes —
# is mitigated the way Fedora mitigates it, by disabling zlib-ng's own deflate
# strategies in compat mode (see WITH_NEW_STRATEGIES below). If a consumer ever
# truly needs classic zlib we can add a separate `zlib-legacy` package.
#
# The two modes are a configure-time switch (can't emit both from one build), so
# this runs two CMake builds into one DESTDIR; their outputs have distinct names
# (libz vs libz-ng, zlib.h vs zlib-ng.h, ...) so they never collide. One
# debug-split pass then covers both. Build runs in a nix-shell providing the
# toolchain (see _flake#zlib-ng), e.g.:
#   nix develop ./_flake#zlib-ng -c pekit build --version 2.3.3

out_dir = "out"

[source.git]
url = "https://github.com/zlib-ng/zlib-ng.git"
# Modern releases (2.0.0+, latest 2.3.3) tag as bare <major>.<minor>.<patch>.
# Legacy tags (v1.2.x mirroring classic zlib, and the v2.0.0-RC* pre-releases)
# carry a v prefix; pre-releases also carry -beta/-rc suffixes. tag_regex keeps
# enumeration (`*`/--latest) to bare three-component stable tags, excluding both.
ref = "{{version}}"
tag_regex = '^\d+\.\d+\.\d+$'
# Floor at the 2.2 line, where compat mode + runtime CPU detection are stable.
# Package latest + future only; older builds on demand via `--version X`.
versions = ">=2.2"

# Layout per PSD-009 §3.4: usrmerge + arch files under /usr/lib/<triplet>.
[build.main]
command = """
SRC="$(pwd)"
TRIPLET=x86_64-linux-peios

# Shared configure arguments, held in the positional parameters rather than in
# a string: the distro CFLAGS/LDFLAGS contain spaces, and `sh` word-splits a
# bare "$COMMON" expansion straight through the middle of them.
#
# The distro flag set (workspace.pekit.toml) is passed EXPLICITLY. CMake does
# seed CMAKE_C_FLAGS / CMAKE_*_LINKER_FLAGS from $CFLAGS / $LDFLAGS -- but only
# when the matching cache variable is not already set on the command line. So a
# single -DCMAKE_SHARED_LINKER_FLAGS=... silently discards the WHOLE of LDFLAGS.
# This recipe used to do exactly that to add -Wl,--build-id, and it cost both
# libraries their BIND_NOW, DT_RELR and CET. Passing the flags by hand is
# immune to that trap; --build-id=sha1 already rides along in LDFLAGS.
#
# CMAKE_C_FLAGS_RELWITHDEBINFO is emptied down to -DNDEBUG (Fedora's %cmake
# does the same to its config-specific flags) so the build type contributes no
# -O or -g of its own: optimisation and debug level come from the distro CFLAGS
# and nowhere else, which is then also what -grecord-gcc-switches reports.
#
# BUILD_SHARED_LIBS is deliberately left UNDEFINED. zlib-ng builds BOTH a shared
# and a static lib only when it's undefined; setting it ON yields shared-only
# (no libz.a), OFF yields static-only. On Linux both come out named libz/libz-ng
# (the MSVC "zlibstatic" naming never applies here).
#
# POSITION_INDEPENDENT_CODE=ON makes the static archives PIC. gcc's
# --enable-default-pie gives -fPIE, which is NOT -fPIC: PIE objects may bind
# symbols locally in ways that are invalid inside a shared object, so without
# this libz.a cannot be linked into a .so. Fedora hit this and set the same
# flag (zlib-ng-2.2.4-2, "Enable -fPIC for static compat libraries").
#
# WITH_GZFILEOP => the gz* file API. WITH_RUNTIME_CPU_DETECTION => ONE portable
# binary that dispatches to SSE2/AVX2/etc. at runtime (never -march=native,
# which would lock the build to the build host).
#
# Tests are built and run (ctest, below) for both ABIs, as Fedora and Arch both
# do. WITH_GTEST=OFF because that half needs a C++ toolchain and, when GTest is
# not installed, CMake FetchContent would try to DOWNLOAD googletest mid-build;
# what remains is still substantial and self-contained -- example, infcover, the
# minideflate/minigzip tool tests, and regression tests for CVE-2002-0059,
# CVE-2004-0797, CVE-2005-1849, CVE-2005-2096 and CVE-2018-25032.
set -- \
  -DCMAKE_BUILD_TYPE=RelWithDebInfo \
  -DCMAKE_C_FLAGS_RELWITHDEBINFO=-DNDEBUG \
  -DCMAKE_C_FLAGS="$CFLAGS" \
  -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
  -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS" \
  -DCMAKE_MODULE_LINKER_FLAGS="$LDFLAGS" \
  -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
  -DCMAKE_INSTALL_PREFIX=/usr \
  -DCMAKE_INSTALL_LIBDIR="lib/$TRIPLET" \
  -DCMAKE_SKIP_INSTALL_RPATH=ON \
  -DWITH_GZFILEOP=ON \
  -DWITH_RUNTIME_CPU_DETECTION=ON \
  -DBUILD_TESTING=ON \
  -DWITH_GTEST=OFF

# compat ABI -> libz.so.1 / zlib.h / zlib.pc / cmake/ZLIB
#
# WITH_NEW_STRATEGIES=OFF -- COMPAT ONLY -- disables deflate_quick (level 1) and
# deflate_medium (levels 4-6), zlib-ng's own strategies, which emit valid but
# different DEFLATE than classic zlib. Fedora turns them off in compat mode for
# precisely this reason and has kept them off since 2.1.3-4. It does not make
# the output byte-identical to zlib -- nothing does -- but it removes the
# largest source of divergence for software that asserts exact compressed bytes,
# which is the one real cost of shipping zlib-ng as the system zlib. The price
# is compression speed at the most-used levels; the native package below keeps
# both strategies, because opting into that ABI is opting into zlib-ng.
cmake -S "$SRC" -B "$PEKIT_OUT/build-compat" "$@" -DZLIB_COMPAT=ON -DWITH_NEW_STRATEGIES=OFF
cmake --build "$PEKIT_OUT/build-compat" -j"$(nproc)"
ctest --test-dir "$PEKIT_OUT/build-compat" --output-on-failure
DESTDIR="$PEKIT_OUT" cmake --install "$PEKIT_OUT/build-compat"

# native ABI -> libz-ng.so.2 / zlib-ng.h / zlib-ng.pc / cmake/zlib-ng
cmake -S "$SRC" -B "$PEKIT_OUT/build-native" "$@" -DZLIB_COMPAT=OFF
cmake --build "$PEKIT_OUT/build-native" -j"$(nproc)"
ctest --test-dir "$PEKIT_OUT/build-native" --output-on-failure
DESTDIR="$PEKIT_OUT" cmake --install "$PEKIT_OUT/build-native"

# Post-install debug pipeline (identical to glibc/libxcrypt): scrub build paths
# from the DWARF (debugedit -> /usr/src/debug/zlib-ng), split debug out build-id
# indexed (-> /usr/lib/debug/.build-id/), strip the binaries, stage the
# referenced sources. Covers both libs. Static archives just get --strip-debug.
cd "$PEKIT_OUT"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  debugedit -b "$ROOT" -d /usr/src/debug/zlib-ng -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$ROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/zlib-ng/$(dirname "$rel")"
  cp "$ROOT/$rel" "usr/src/debug/zlib-ng/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
rm -rf "$PEKIT_OUT/build-compat" "$PEKIT_OUT/build-native"
"""

# Build deps. zlib-ng is a CMake project (cmake drives the two compat/native
# builds) and is pure C: it declares `project(... LANGUAGES C)` and only calls
# enable_language(CXX) for gtest/fuzzers/benchmarks, all of which are off here.
# So the C toolchain is enough — build-essentials-c, not -c++, which also keeps
# the C++ runtime out of the root of the library gcc itself links against.
# debugedit (for the post-install debug split) and patchelf arrive with
# build-essentials-c; zlib-ng links no libtool rpath, so patchelf goes unused.
# No external library deps.
[build.main.dependencies.peipkg]
"build-essentials-c" = "*"
"org.cmake.cmake" = "*"

[build.main.dependencies.apt]
build-essential = "*"
cmake = "*"
debugedit = "*"
