# zlib-ng — shared package metadata. Inherited by every
# <name>.package.pekit.toml here; each named file overrides `description` and
# supplies its own `[files]`/`[dependencies]`.
#
# One source (zlib-ng) produces two ABIs and thus two package families:
#   zlib*      the compat ABI (libz.so.1) — Peios's system zlib
#   zlib-ng*   the native ABI (libz-ng.so.2, zng_-prefixed)
# plus shared zlib-debuginfo / zlib-debugsource.

format = "peipkg"

[package]
version = "{{version}}-1"
architecture = "x86_64"
license = "Zlib"
homepage = "https://github.com/zlib-ng/zlib-ng"
