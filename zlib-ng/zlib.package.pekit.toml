# zlib — Peios's system zlib: zlib-ng built in compat mode, providing the
# classic zlib ABI (SONAME libz.so.1) with plain deflate/inflate/gz* symbols.
# This is what everything links as `-lz`. The native zng_-prefixed API is the
# separate zlib-ng package; headers/static are zlib-devel/zlib-static.
#
# A glob source ("so.1*") maps to a DIRECTORY; an exact-file source to a FULL path.

[package]
description = "Compression library (zlib API) - shared library (zlib-ng compat mode)"

[dependencies]
# Floor = the glibc we build & test against (Peios ships only 2.43); >= so a
# future glibc still satisfies it (glibc is backward-compatible).
glibc = ">= 2.43"

[files]
# License text (distro convention: /usr/share/licenses/<name>/). Needed here in
# its own right, not just on zlib-ng: this package is separately installable —
# and in practice the one everything actually pulls in — so the Zlib licence has
# to travel with it.
"@source:LICENSE.md" = "usr/share/licenses/zlib/"
# SONAME symlink (libz.so.1) + real object (libz.so.1.3.1.zlib-ng). Excludes the
# native libz-ng.so.2*, the dev libz.so symlink, and the static libz.a.
":usr/lib/x86_64-linux-peios/libz.so.1*" = "usr/lib/x86_64-linux-peios"
