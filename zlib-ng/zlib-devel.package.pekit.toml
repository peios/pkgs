# zlib-devel — headers, dev symlink, pkg-config, and CMake package config for
# building against the compat zlib API. The dev symlink (libz.so) points at
# libz.so.1.*. Static archive is split into zlib-static. The native-API
# equivalents (zlib-ng.h, libz-ng.so, ...) are in zlib-ng-devel.

[package]
description = "Compression library (zlib API) - development files"

[dependencies]
zlib = "{{version}}"

[files]
":usr/include/zlib.h"                                 = "usr/include/zlib.h"
":usr/include/zconf.h"                                = "usr/include/zconf.h"
":usr/include/zlib_name_mangling.h"                   = "usr/include/zlib_name_mangling.h"
":usr/lib/x86_64-linux-peios/libz.so"                 = "usr/lib/x86_64-linux-peios/libz.so"
":usr/lib/x86_64-linux-peios/pkgconfig/zlib.pc"       = "usr/lib/x86_64-linux-peios/pkgconfig/zlib.pc"
# CMake package config for find_package(ZLIB).
":usr/lib/x86_64-linux-peios/cmake/ZLIB/**"           = "usr/lib/x86_64-linux-peios/cmake/ZLIB"
