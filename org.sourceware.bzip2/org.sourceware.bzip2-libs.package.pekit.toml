# The ABI library is independent of the command-line utilities so applications
# can consume bzip2 data without pulling in shell wrapper dependencies.

[package]
name        = "org.sourceware.bzip2-libs"
description = "bzip2 - libbz2 runtime library"

[provides]
# The retired monolithic package also carries this SONAME. A versioned
# capability makes the canonical split runtime the deterministic provider.
"libbz2.so.1" = "{{version}}"
"libbz2.so.1.0" = "{{version}}"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:LICENSE"                          = "usr/share/licenses/org.sourceware.bzip2-libs/"
":usr/lib/x86_64-linux-peios/libbz2.so.1"  = "usr/lib/x86_64-linux-peios/libbz2.so.1"
":usr/lib/x86_64-linux-peios/libbz2.so.1.*" = "usr/lib/x86_64-linux-peios"
