# Command-line compressor, recovery tool, and supported shell conveniences.

side_effects = ["man-db"]

[package]
name        = "org.sourceware.bzip2"
description = "bzip2 - block-sorting compression tools"

[provides]
# Version the compatibility capability so dependency resolution prefers this
# canonical package over the retired unqualified bzip2 package.
bzip2 = "{{version}}"

[dependencies]
"org.sourceware.bzip2-libs" = "{{version}}-3"
# bzgrep and bzdiff are POSIX shell frontends over these standard tools.
dash          = "*"
"org.gnu.coreutils" = "*"
diffutils     = "*"
grep          = "*"
sed           = "*"

[files]
"@source:LICENSE"   = "usr/share/licenses/org.sourceware.bzip2/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
