# Command-line compressor, recovery tool, and supported shell conveniences.

side_effects = ["man-db"]

[package]
name        = "org.sourceware.bzip2"
description = "Block-sorting compression tools"

[dependencies]
"org.sourceware.bzip2-libs" = "{{version}}-3"
# bzgrep and bzdiff are POSIX shell frontends over these standard tools.
"org.git.kernel.dash"          = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.diffutils"     = "*"
"org.gnu.grep"          = "*"
"org.gnu.sed"           = "*"

[files]
"@source:LICENSE"   = "usr/share/licenses/org.sourceware.bzip2/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
