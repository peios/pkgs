[package]
name        = "org.sourceware.bzip2-devel"
description = "bzip2 - libbz2 headers, linker input, and pkg-config metadata"

[dependencies]
"org.sourceware.bzip2-libs" = "{{version}}-1"

[files]
"@source:LICENSE"                                = "usr/share/licenses/org.sourceware.bzip2-devel/"
":usr/include/bzlib.h"                           = "usr/include/bzlib.h"
":usr/lib/x86_64-linux-peios/libbz2.so"          = "usr/lib/x86_64-linux-peios/libbz2.so"
":usr/lib/x86_64-linux-peios/pkgconfig/bzip2.pc" = "usr/lib/x86_64-linux-peios/pkgconfig/bzip2.pc"
":usr/share/doc/org.sourceware.bzip2-devel/**"   = "usr/share/doc/org.sourceware.bzip2-devel"
