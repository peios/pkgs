[package]
name        = "org.gnome.libxslt-debuginfo"
description = "libxslt, libexslt and xsltproc debugging symbols"

[dependencies]
"org.gnome.libxslt"       = "= {{release}}"
"org.gnome.libxslt-utils" = "= {{release}}"

[files]
"@source:Copyright" = "usr/share/licenses/org.gnome.libxslt-debuginfo/"
":usr/lib/debug/**" = "usr/lib/debug"
