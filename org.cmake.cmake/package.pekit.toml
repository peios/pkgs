# Metadata shared by the CMake package family.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
# CMake links its deliberately bundled bootstrap libraries into the tools.
# This expression covers CMake plus the notices installed from Utilities/.
license       = "BSD-3-Clause AND BSD-2-Clause AND MIT-open-group AND MIT AND Zlib AND Apache-2.0 AND 0BSD AND curl AND bzip2-1.0.6"
license_class = "free"
homepage      = "https://cmake.org/"
