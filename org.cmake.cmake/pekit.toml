# CMake — cross-platform build-system generator.
#
# Bootstrap with the upstream-bundled support libraries to keep this early
# build tool's dependency closure small and deterministic. OpenSSL is the one
# system integration: HTTPS is production functionality for file(DOWNLOAD)
# and FetchContent, so the bundled curl is built with TLS rather than silently
# producing a network-limited CMake.

tags = ["bootstrap"]
out_dir = "out"

[source.git]
url       = "https://gitlab.kitware.com/cmake/cmake.git"
ref       = "v{{version}}"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
# Soft maintenance floor. Stable releases are automatic; the build-system and
# staged-client gates below fail closed on an incompatible future transition.
versions  = ">= 4.4.3"

# Release tags are annotated and OpenPGP-signed by Brad King, CMake's release
# manager. His Kitware GitLab account publishes this primary key, but that copy
# still carries the signing subkey's 2023 expiry; the key file is the
# keyserver.ubuntu.com copy, whose later self-signature extends it to 2027.
[source.git.signature]
key_files    = ["keys/brad-king.asc"]
fingerprints = ["CBA23971357C2E6590D9EFD3EC8FEF3A7BFB4EDA"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
BUILD="$PEKIT_OUT/build"
mkdir -p "$BUILD"
cd "$BUILD"

ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
# Remap source strings without hiding physical DWARF paths from debugedit.
# (The stack protector and PIE are compiler defaults.)
CFLAGS_COMMON="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.cmake.cmake"
CXXFLAGS_COMMON="${CXXFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.cmake.cmake"
LDFLAGS_COMMON="${LDFLAGS:?} -Wl,-z,ibtplt"
export CFLAGS="$CFLAGS_COMMON"
export CXXFLAGS="$CXXFLAGS_COMMON"
export LDFLAGS="$LDFLAGS_COMMON"

"$SRC/bootstrap" --prefix=/usr --parallel="$(nproc)" --no-system-libs \
  -- -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_USE_OPENSSL=ON -DBUILD_TESTING=ON \
  "-DCMAKE_EXE_LINKER_FLAGS=$LDFLAGS_COMMON -pie" \
  "-DCMAKE_SHARED_LINKER_FLAGS=$LDFLAGS_COMMON" \
  "-DCMAKE_MODULE_LINKER_FLAGS=$LDFLAGS_COMMON"
make -j"$(nproc)"

make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/doc" "$PEKIT_OUT/usr/share/doc"

# The XL Fortran preprocessor wrapper starts with /usr/bin/env bash; name
# Bash through the runtime view instead.
set -- "$PEKIT_OUT"/usr/share/cmake-*/Modules/Compiler/XL-Fortran/cpp
test "$#" -eq 1 && test -f "$1"
sed -i '1s|^#!/usr/bin/env bash$|#!/bin/bash|' "$1"
test "$(head -n 1 "$1")" = '#!/bin/bash'

# The complete upstream reference is installed in share/cmake-*/Help and
# accessible with --help-manual. Also provide ordinary man(1) CLI references
# from the exact staged tools, without a bootstrap dependency on Sphinx.
sh "$PEKIT_RECIPE_ROOT/tools/install-manpages.sh" "$PEKIT_OUT" "$PEKIT_VERSION"


# Preserve CMake and every bundled component's redistribution notices with
# collision-free names. The discovery keeps future bundled-library changes
# visible in package diffs without a hand-maintained file list.
LICENSEDIR="$PEKIT_OUT/usr/share/licenses/org.cmake.cmake"
mkdir -p "$LICENSEDIR"
install -m 0644 "$SRC/LICENSE.rst" "$LICENSEDIR/CMake-LICENSE.rst"
find "$SRC/Licenses" "$SRC/Utilities" -type f \
  \\( -iname 'license*' -o -iname 'copying*' -o -iname 'copyright*' \\) | \
  LC_ALL=C sort | while IFS= read -r notice; do
    rel=${notice#"$SRC/"}
    name=$(printf '%s' "$rel" | tr '/ ' '__')
    install -m 0644 "$notice" "$LICENSEDIR/$name"
  done
for name in org.cmake.cmake-data org.cmake.cmake-debuginfo org.cmake.cmake-debugsource; do
  cp -a "$LICENSEDIR" "$PEKIT_OUT/usr/share/licenses/$name"
done

# Distribution debug split of the installed executables.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.cmake.cmake "$PEKIT_OUT/usr/bin"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.openssl.openssl-devel" = "*"
"org.sourceware.debugedit" = "*"
"org.gnu.gzip" = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
CMAKE="$PEKIT_MAIN_OUT/usr/bin/cmake"
output=$("$CMAKE" --version)
case "$output" in "cmake version $PEKIT_VERSION"*) ;; *) exit 1;; esac
test "$("$CMAKE" -E echo staged-contract)" = staged-contract

# Run the upstream release suite from the explicit package gate.
PEKIT_OUT="$PEKIT_MAIN_OUT"
BUILD="$PEKIT_OUT/build"
cd "$BUILD"
# Fast, dependency-closed upstream core coverage. The complete 600+ test set
# probes optional generators, toolchains, networks, and host facilities that
# intentionally are not part of this bootstrap environment.
"$BUILD/bin/ctest" -j"$(nproc)" --output-on-failure \
  --no-tests=error -R '^(SystemInformationNew|kwsys\..*|kwiml\.test|CMake\.Copyright|CommandLineTest|StringFileTest|MathTest|Simple|COnly|CxxOnly|TryCompile)$'


# Exercise and audit the exact installed toolchain after staging.
PEKIT_OUT="$PEKIT_MAIN_OUT"
test "$(head -n 1 "$PEKIT_OUT"/usr/share/cmake-*/Modules/Compiler/XL-Fortran/cpp)" = '#!/bin/bash'
BUILD="$PEKIT_OUT/build"
# Exercise the installed cmake/ctest/cpack triplet against a real C project.
SMOKE="$PEKIT_OUT/.cmake-smoke"
mkdir -p "$SMOKE/src"
printf '%s\n' \
  '#include <stdio.h>' \
  'int main(void) { puts("cmake-smoke"); return 0; }' \
  > "$SMOKE/src/main.c"
printf '%s\n' \
  'cmake_minimum_required(VERSION 3.20)' \
  'project(cmake_smoke C)' \
  'add_executable(cmake-smoke main.c)' \
  'enable_testing()' \
  'add_test(NAME runs COMMAND cmake-smoke)' \
  'install(TARGETS cmake-smoke DESTINATION bin)' \
  'set(CPACK_PACKAGE_NAME cmake-smoke)' \
  'set(CPACK_PACKAGE_VERSION 1.0.0)' \
  'set(CPACK_GENERATOR TGZ)' \
  'include(CPack)' \
  > "$SMOKE/src/CMakeLists.txt"
"$PEKIT_OUT/usr/bin/cmake" -S "$SMOKE/src" -B "$SMOKE/build"
"$PEKIT_OUT/usr/bin/cmake" --build "$SMOKE/build" --parallel "$(nproc)"
"$PEKIT_OUT/usr/bin/ctest" --test-dir "$SMOKE/build" --output-on-failure
mkdir -p "$SMOKE/packages"
"$PEKIT_OUT/usr/bin/cpack" --config "$SMOKE/build/CPackConfig.cmake" \
  -B "$SMOKE/packages" -G TGZ
test -s "$SMOKE/packages/cmake-smoke-1.0.0-Linux.tar.gz"
grep -F 'CMAKE_USE_OPENSSL:BOOL=ON' "$BUILD/CMakeCache.txt"

# Installed executable hardening and distribution debug split.
for tool in cmake ctest cpack; do
  test -s "$PEKIT_OUT/usr/share/man/man1/$tool.1.gz"
  "$PEKIT_OUT/usr/bin/$tool" --help-manual "$tool(1)" > "$PEKIT_OUT/.manual-check"
  grep -F "$tool" "$PEKIT_OUT/.manual-check" >/dev/null
  elf="$PEKIT_OUT/usr/bin/$tool"
  readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  if readelf -d "$elf" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done

rm -f "$PEKIT_OUT/.manual-check"
rm -rf "$PEKIT_MAIN_OUT/.cmake-smoke" "$PEKIT_MAIN_OUT/build"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.openssl.openssl-devel" = "*"
"org.gnu.gzip" = "*"
