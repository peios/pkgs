# CMake's executable tools. Architecture-independent modules and editor
# integration live in the exact-version data package.

side_effects = ["man-db"]

[package]
name        = "org.cmake.cmake"
description = "Cross-platform build-system generator"

[dependencies]
"org.cmake.cmake-data" = "= {{release}}"

[files]
":usr/bin/cmake" = "usr/bin/cmake"
":usr/bin/cpack" = "usr/bin/cpack"
":usr/bin/ctest" = "usr/bin/ctest"
":usr/share/licenses/org.cmake.cmake/**" = "usr/share/licenses/org.cmake.cmake"

":usr/share/man/man1/**" = "usr/share/man/man1"
