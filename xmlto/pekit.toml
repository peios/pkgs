# xmlto — turns DocBook XML into man pages (and other formats) by driving
# xsltproc with the right stylesheet. The last piece of the toolchain perf
# and libperf use for their documentation: asciidoc renders their .txt
# sources to DocBook, and this renders that to troff (PEI-535).
#
# It is a shell script, not a program: the package is xmlto itself plus the
# per-format scripts under /usr/share/xmlto/ that name the stylesheet for
# each output format. Its one compiled part is xmlif, a conditional-text
# filter used by the format scripts.
#
# Autotools from the release tarball, out-of-source via DESTDIR (the m4
# shape) -- but the tarball is a source export with no generated `configure`,
# so autoreconf runs first (the autotools trio came in with PEI-158).
#
# One patch, raising libxslt's template-recursion limit; see patches/series.
#
# PIN THE TOOL PATHS. configure locates a dozen helpers with AC_PATH_PROG
# and bakes absolute paths into the generated script -- which would make the
# payload a property of the build sandbox (the pin-host-sniffing rule), and
# would name /usr/bin directly where a payload script should go through the
# /bin runtime view (pkgs 38a56b4). Both are fixed by stating the paths.
#
#   pekit publish --version 0.0.29 --env peipkg --keyring dev

out_dir = "out"

[source]
patches = "patches"

[source.url]
url      = "https://releases.pagure.org/xmlto/xmlto-{{version}}.tar.bz2"
extract  = true
root     = "xmlto-{{version}}"
versions = ">= 0.0.29"

[build.main]
command = """
SRC="$(pwd)"
(cd "$SRC" && autoreconf -fi)
cd "$PEKIT_OUT"

# xmlto builds its OWN man pages with the toolchain it is installing, so the
# catalog has to be in the environment before make, not merely before the
# smoke test below. A build root has no /etc merge to find it through.
export XML_CATALOG_FILES=/usr/etc/xml/catalog

# The pinned helpers, all through /bin. Deliberately NOT pinned, and so left
# as bare names that resolve to nothing: dblatex, fop, xmltex and pdfxmltex
# (PDF output), and lynx, links and w3m (text output). Peios packages none of
# them, so those formats are unavailable; `xmlto man` and `xmlto html` are
# what the kernel tools need and neither touches them.
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  XMLTO_BASH_PATH=/bin/bash \
  XSLTPROC=/bin/xsltproc \
  XMLLINT=/bin/xmllint \
  GCP=/bin/cp \
  SED=/bin/sed \
  GREP=/bin/grep \
  TAIL=/bin/tail \
  LOCALE=/bin/locale \
  GETOPT=getopt \
  MKTEMP=mktemp \
  FIND=find
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/doc"

# Prove the toolchain end to end rather than only that it compiled: render a
# DocBook manpage document to troff, through the same catalog and stylesheets
# a consumer will use.
cat > smoke.xml <<'EOX'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE refentry PUBLIC "-//OASIS//DTD DocBook XML V4.5//EN"
  "http://www.oasis-open.org/docbook/xml/4.5/docbookx.dtd">
<refentry id="peios-smoke">
  <refmeta><refentrytitle>peios-smoke</refentrytitle><manvolnum>1</manvolnum></refmeta>
  <refnamediv><refname>peios-smoke</refname><refpurpose>toolchain check</refpurpose></refnamediv>
  <refsect1><title>Description</title><para>Rendered by xmlto.</para></refsect1>
</refentry>
EOX
# FORMAT_DIR: xmlto finds its per-format scripts under its installed data
# directory, which for a staged build is not the one compiled in. Upstream
# provides the override precisely for running from a build tree.
FORMAT_DIR="$PEKIT_OUT/usr/share/xmlto/format" \
  PATH="$PEKIT_OUT/usr/bin:$PATH" "$PEKIT_OUT/usr/bin/xmlto" -o . man smoke.xml
test -s peios-smoke.1 || { echo "xmlto: produced no man page" >&2; exit 1; }
grep -q 'peios-smoke' peios-smoke.1 || { echo "xmlto: man page has no content" >&2; exit 1; }
echo "xmlto: rendered DocBook to troff ($(wc -c < peios-smoke.1) bytes)"
rm -f smoke.xml peios-smoke.1
"""

[build.main.dependencies.peipkg]
dash               = "*"
"org.gnu.coreutils" = "*"
grep               = "*"
sed                = "*"
findutils          = "*"
"org.gnu.bash"     = "*"
build-essentials-c = "*"
make               = "*"
"org.gnu.autoconf" = "*"
"org.gnu.automake" = "*"
libtool            = "*"
m4                 = "*"
perl               = "*"
# The runtime chain, present here because the build smoke-tests it.
"org.kernel.util-linux-getopt" = "*"
xsltproc        = "*"
"libxml2-utils" = "*"
"docbook-xsl"   = "*"
"docbook-xml"   = "*"
"glibc-bin"     = "*"

[build.main.dependencies.apt]
build-essential = "*"
autoconf        = "*"
automake        = "*"
libtool         = "*"
xsltproc        = "*"
libxml2-utils   = "*"
docbook-xsl     = "*"
docbook-xml     = "*"
