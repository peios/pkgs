# Metadata shared by the GNU Grep package family. The expression covers the
# command, manual, translations, build machinery, vendored Gnulib and the
# complete generated corresponding-source package.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "GPL-3.0-or-later AND GPL-2.0-or-later AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND LGPL-3.0-or-later AND GFDL-1.3-no-invariants-or-later AND BSD-3-Clause AND X11 AND FSFAP AND FSFUL AND FSFULLR AND LicenseRef-Public-Domain AND (GPL-2.0-or-later WITH Autoconf-exception-generic) AND (GPL-3.0-or-later WITH Autoconf-exception-generic-3.0) AND (GPL-3.0-or-later WITH Texinfo-exception)"
license_class = "free"
homepage      = "https://www.gnu.org/software/grep/"
