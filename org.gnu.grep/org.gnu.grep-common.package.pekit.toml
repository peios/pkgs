side_effects = ["man-db"]

[package]
name         = "org.gnu.grep-common"
architecture = "noarch"
description  = "GNU Grep translations and command manual"
license      = "GPL-3.0-or-later AND GFDL-1.3-no-invariants-or-later"

[files]
"@source:COPYING"      = "usr/share/licenses/org.gnu.grep-common/COPYING"
":usr/share/locale/**" = "usr/share/locale"
":usr/share/man/**"    = "usr/share/man"
