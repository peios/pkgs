# GNU Grep — GNU's line-oriented pattern matching utility.
#
# PCRE matching remains deliberately disabled until Peios has a production
# PCRE2 package. BRE, ERE and fixed-string matching are complete; the staged
# smoke test below makes the temporary absence of `grep -P` explicit.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source]
patches = "patches"

[source.url]
url         = "https://ftp.gnu.org/gnu/grep/grep-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/grep/"
extract     = true
root        = "grep-{{version}}"
file_regex  = 'grep-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Follow every newer authenticated stable release;
# incompatible changes stop at the command-behaviour tests.
versions    = ">= 3.12"

# GNU Grep releases are signed by maintainer Jim Meyering. Pin his complete
# primary fingerprint from the 3.12 release announcement so unattended
# discovery must authenticate each new release before Pekit can lock it.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/jim-meyering.asc"]
fingerprints = ["155D3FC500C834486D1EEA677FD9FCCB000BEEEE"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.grep"
cd "$PEKIT_OUT"

"$SRC/configure" \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --disable-rpath \
  --disable-perl-regexp

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -9n {} \\;

# The grep manual documents both compatibility command names.
ln -sf grep.1.gz "$PEKIT_OUT/usr/share/man/man1/egrep.1.gz"
ln -sf grep.1.gz "$PEKIT_OUT/usr/share/man/man1/fgrep.1.gz"

# Peios currently has no Info reader. The corresponding-source package keeps
# the complete Texinfo manual.
rm -rf "$PEKIT_OUT/usr/share/info"
for wrapper in "$PEKIT_OUT/usr/bin/egrep" "$PEKIT_OUT/usr/bin/fgrep"; do
  test -f "$wrapper"
  # Upstream emits configure's $SHELL (Bash here) even though these wrappers
  # only use POSIX shell syntax.  Normalize it unconditionally to the
  # runtime-view /bin/sh rather than retaining a needless Bash dependency.
  sed -i '1c#!/bin/sh' "$wrapper"
done

# Produce build-ID debuginfo and exact DWARF-referenced source.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.grep "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"org.gnu.gzip" = "*"
"dev.peios.build-essentials-c" = "*"
"org.gnu.glibc-bin"          = ">= 2.43"
"org.gnu.glibc-gconv-extra"  = ">= 2.43"
"org.gnu.glibc-langpack-cs"  = ">= 2.43"
"org.gnu.glibc-langpack-de"  = ">= 2.43"
"org.gnu.glibc-langpack-el"  = ">= 2.43"
"org.gnu.glibc-langpack-en"  = ">= 2.43"
"org.gnu.glibc-langpack-fr"  = ">= 2.43"
"org.gnu.glibc-langpack-ja"  = ">= 2.43"
"org.gnu.glibc-langpack-ru"  = ">= 2.43"
"org.gnu.glibc-langpack-tr"  = ">= 2.43"
"org.gnu.glibc-langpack-zh"  = ">= 2.43"
"org.gnu.gettext" = "*"
"org.perl.perl"               = "*"

[build.main.dependencies.apt]
gzip = "*"
build-essential = "*"
debugedit       = "*"
gettext         = "*"
locales-all     = "*"
perl            = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
BIN="$STAGE/usr/bin"
GREP="$BIN/grep"
SMOKE="$PEKIT_OUT/smoke"
cd "$STAGE"

make -j"$(nproc)" check RUN_EXPENSIVE_TESTS=yes
PATH="$BIN:$PATH"
export PATH
mkdir -p "$SMOKE/tree/keep" "$SMOKE/tree/skip"
test -x "$GREP"
for wrapper in "$BIN/egrep" "$BIN/fgrep"; do
  test "$(sed -n '1p' "$wrapper")" = '#!/bin/sh'
done

printf '%s\n' alpha beta-42 'gamma[1]' > "$SMOKE/input"
"$GREP" -x 'beta-[0-9][0-9]' "$SMOKE/input" > "$SMOKE/bre"
test "$(cat "$SMOKE/bre")" = beta-42
"$GREP" -E -x 'alpha|gamma\[1\]' "$SMOKE/input" > "$SMOKE/ere"
printf '%s\n' alpha 'gamma[1]' > "$SMOKE/ere.expected"
cmp "$SMOKE/ere.expected" "$SMOKE/ere"
"$GREP" -F -x 'gamma[1]' "$SMOKE/input" > "$SMOKE/fixed"
test "$(cat "$SMOKE/fixed")" = 'gamma[1]'

printf '%s\n' needle > "$SMOKE/tree/keep/match.txt"
printf '%s\n' needle > "$SMOKE/tree/keep/ignored.log"
printf '%s\n' needle > "$SMOKE/tree/skip/hidden.txt"
"$GREP" -r -l -F --include='*.txt' --exclude-dir=skip needle \
  "$SMOKE/tree" > "$SMOKE/recursive"
test "$(cat "$SMOKE/recursive")" = "$SMOKE/tree/keep/match.txt"

printf 'zero\0needle\0' > "$SMOKE/nul-input"
"$GREP" -z -F -x needle "$SMOKE/nul-input" > "$SMOKE/nul-output"
printf 'needle\0' > "$SMOKE/nul-expected"
cmp "$SMOKE/nul-expected" "$SMOKE/nul-output"
printf '%s\n' 'Äpfel' > "$SMOKE/locale-input"
LC_ALL=de_DE.UTF-8 "$GREP" -i -F -x 'äpfel' "$SMOKE/locale-input" \
  > "$SMOKE/locale-output"
test "$(cat "$SMOKE/locale-output")" = 'Äpfel'

"$BIN/egrep" -x 'alpha|beta-42' "$SMOKE/input" > "$SMOKE/egrep" \
  2> "$SMOKE/egrep.err"
printf '%s\n' alpha beta-42 > "$SMOKE/egrep.expected"
cmp "$SMOKE/egrep.expected" "$SMOKE/egrep"
"$BIN/fgrep" -x 'gamma[1]' "$SMOKE/input" > "$SMOKE/fgrep" \
  2> "$SMOKE/fgrep.err"
test "$(cat "$SMOKE/fgrep")" = 'gamma[1]'

status=0
"$GREP" -P needle "$SMOKE/input" > "$SMOKE/pcre.out" \
  2> "$SMOKE/pcre.err" || status=$?
test "$status" -eq 2
grep -F 'Perl matching not supported in a --disable-perl-regexp build' \
  "$SMOKE/pcre.err"

"$GREP" --version | head -1 | grep -F "$PEKIT_VERSION"
readelf -h "$GREP" | grep -E 'Type:[[:space:]]+DYN'
readelf -W -l "$GREP" | grep 'GNU_STACK' | grep -F 'RW '
readelf -d "$GREP" | grep -F 'BIND_NOW'
readelf -d "$GREP" | grep -F 'RELR'
if readelf -d "$GREP" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
test -n "$(find "$STAGE/usr/share/locale" -type f -name 'grep.mo' -print -quit)"
test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test -n "$(find "$STAGE/usr/src/debug/org.gnu.grep" -type f -print -quit)"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.glibc-bin"          = ">= 2.43"
"org.gnu.glibc-gconv-extra"  = ">= 2.43"
"org.gnu.glibc-langpack-cs"  = ">= 2.43"
"org.gnu.glibc-langpack-de"  = ">= 2.43"
"org.gnu.glibc-langpack-el"  = ">= 2.43"
"org.gnu.glibc-langpack-en"  = ">= 2.43"
"org.gnu.glibc-langpack-fr"  = ">= 2.43"
"org.gnu.glibc-langpack-ja"  = ">= 2.43"
"org.gnu.glibc-langpack-ru"  = ">= 2.43"
"org.gnu.glibc-langpack-tr"  = ">= 2.43"
"org.gnu.glibc-langpack-zh"  = ">= 2.43"
"org.perl.perl"             = "*"
"org.gnu.binutils"          = "*"
"org.gnu.findutils"         = "*"

[test.dependencies.apt]
build-essential = "*"
locales-all     = "*"
perl            = "*"
binutils        = "*"
findutils       = "*"
