[package]
name        = "org.gnu.sed"
description = "GNU stream editor for filtering and transforming text"
license     = "GPL-3.0-or-later"

[provides]
sed = "{{version}}-1"

[replaces]
sed = "< {{version}}-1"

[dependencies]
glibc                = ">= 2.43"
"org.gnu.sed-common" = "{{version}}-1"

[files]
"@source:COPYING" = "usr/share/licenses/org.gnu.sed/"
":usr/bin/sed"    = "usr/bin/sed"
