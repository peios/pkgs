# authd — Peios' authentication daemon (the PGSS Logon authority) plus login,
# the terminal logon originator.
#
# Delegate recipe: authd is self-describing — it commits its own pekit files
# (the build pipeline in pekit.toml, the package definitions in
# packages.pekit/), so this recipe is just a pointer.
#
# Like peinit, authd's build needs a Rust toolchain and the sibling peios-rs
# crates, which it references via path deps but does not vendor. Build with
# --local against the in-dev tree until that bridge is sorted.

out_dir = "out"
delegate = true

# Local working copy for `--local` (compile the in-dev tree, no tag).
# Relative to this recipe dir; never used by the farm.
[source.local]
path = "../../authd"
