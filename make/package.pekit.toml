format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "make"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU Make - the build automation tool"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/make/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING*" = "usr/share/licenses/make/"
":usr/bin/**"       = "usr/bin"
# gnumake.h: the load-directive plugin ABI header; tiny, so it rides the
# main package rather than earning a -devel split.
":usr/include/**"   = "usr/include"
":usr/share/man/**" = "usr/share/man"
