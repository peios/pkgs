# make — GNU Make: the build driver every recipe's build target assumes.
#
# Phase-1 build-base leaf (PEI-155): plain autotools from the release tarball,
# out-of-source build into the stage via DESTDIR (the dash shape).

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/make/make-{{version}}.tar.gz"
extract  = true
root     = "make-{{version}}"
versions = ">= 4.4.1"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man --disable-nls --without-guile
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
