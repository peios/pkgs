# Loregd owns its hermetic build, package split, tests, hardening gates, and
# source/debug artifacts in the public source tree. This catalogue entry adds
# immutable release discovery, distribution policy, and the local checkout
# used to qualify a release before its tag is published.

out_dir = "out"
delegate = true

[source.git]
url       = "https://github.com/peios/loregd.git"
ref       = "v{{version}}"
# Soft production floor: earlier releases used an unqualified monolithic
# package, online Go resolution, and no corresponding source/debug closure.
versions  = ">= 0.21.6"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[source.local]
path = "../../loregd"
