# netd owns its build, package boundaries, tests, hardening gates, and exact
# source/debug artifacts. The catalogue follows the first public, immutable
# production release while retaining the local checkout for development builds.

out_dir = "out"
delegate = true

[source.git]
url       = "https://github.com/peios/netd.git"
ref       = "v{{version}}"
versions  = ">= 0.1.1"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[source.local]
path = "../../netd"
