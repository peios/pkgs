# Catalogue fragments in this delegated recipe only override selected package
# metadata. Static lint cannot inspect the immutable source recipe; versioned
# lint resolves both layers and checks these fields from the source.
[allow]
"package.license" = "Package licence metadata is owned by the immutable delegated source and is checked by versioned lint"
"package.homepage" = "Package homepage metadata is owned by the immutable delegated source and is checked by versioned lint"
"package.description" = "Package descriptions are owned by the immutable delegated source and are checked by versioned lint"
