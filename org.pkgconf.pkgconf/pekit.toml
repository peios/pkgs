# pkgconf — the package compiler/linker metadata toolkit. The command suite and
# reusable library are built together, tested upstream, and then split so
# ordinary pkg-config consumers do not acquire development files.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source.url]
url         = "https://distfiles.ariadne.space/pkgconf/pkgconf-{{version}}.tar.xz"
listing_url = "https://distfiles.ariadne.space/pkgconf/"
file_regex  = 'pkgconf-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz'
extract     = true
root        = "pkgconf-{{version}}"
# Soft production floor. Follow every newer stable release; development or
# incompatible releases stop at the build and command-behaviour gates.
versions    = ">= 3.0.6"

# Upstream release tags are SSH-signed on GitHub, but neither the official
# tarball directory nor the release assets publish detached signatures Pekit
# can authenticate, and Pekit verifies only OpenPGP Git signatures. This is
# therefore an explicit HTTPS + immutable lockfile hash exception.

[build.main]
command = '''
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.pkgconf.pkgconf"
BUILD="$PEKIT_OUT/build"
PREFIX="$PEKIT_OUT/usr"
LIBDIR="$PREFIX/lib/x86_64-linux-peios"

meson setup "$BUILD" "$SRC" \
  --prefix=/usr \
  --libdir=lib/x86_64-linux-peios \
  --buildtype=plain \
  --default-library=both \
  -Dwith-pkg-config-dir=/usr/lib/x86_64-linux-peios/pkgconfig:/usr/share/pkgconfig \
  -Dwith-system-libdir=/usr/lib/x86_64-linux-peios \
  -Dwith-system-includedir=/usr/include \
  -Dfuzzing=false \
  -Danalyzer=false \
  -Dc_link_args="$LDFLAGS -Wl,-z,ibtplt"

meson compile -C "$BUILD"
DESTDIR="$PEKIT_OUT" meson install -C "$BUILD" --no-rebuild

# Upstream deliberately leaves this vendor choice to distributions. Peios uses
# pkgconf as its pkg-config implementation, matching Debian and Fedora practice.
ln -sfn pkgconf "$PREFIX/bin/pkg-config"
ln -sfn pkgconf.1 "$PREFIX/share/man/man1/pkg-config.1"

find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' | while IFS= read -r page; do
  gzip -9n "$page"
done
find "$PEKIT_OUT/usr/share/man" -type l -name '*.[1-9]' | while IFS= read -r page; do
  target=$(readlink "$page")
  ln -s "$target.gz" "$page.gz"
  rm "$page"
done

rm -rf "$PREFIX/share/doc/pkgconf"

# Static-library code is retained but its debug sections are deliberately
# left to the shared object's debuginfo.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.pkgconf.pkgconf "$PREFIX"
'''

[build.main.dependencies.peipkg]
"org.gnu.gzip" = "*"
"dev.peios.build-essentials-c" = "*"
"org.sourceware.debugedit"              = "*"
"com.mesonbuild.meson"                  = ">= 1.4"
"org.ninja-build.ninja"                  = "*"

[build.main.dependencies.apt]
gzip = "*"
build-essential = "*"
debugedit       = "*"
meson           = ">= 1.4"
ninja-build     = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
BUILD="$STAGE/build"
PREFIX="$STAGE/usr"
LIBDIR="$PREFIX/lib/x86_64-linux-peios"
SMOKE="$PEKIT_OUT/smoke"

meson test -C "$BUILD" --print-errorlogs --timeout-multiplier 4

export LD_LIBRARY_PATH="$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
test "$("$PREFIX/bin/pkgconf" --version)" = "$PEKIT_VERSION"
test "$("$PREFIX/bin/pkg-config" --version)" = "$PEKIT_VERSION"
test -L "$PREFIX/bin/pkg-config"
test "$(readlink "$PREFIX/bin/pkg-config")" = pkgconf

mkdir -p "$SMOKE"
cat > "$SMOKE/peios-smoke.pc" <<'EOF'
prefix=/usr
libdir=${prefix}/lib/x86_64-linux-peios
includedir=${prefix}/include

Name: peios-smoke
Description: pkgconf installed-command smoke test
Version: 1.2.3
Libs: -L${libdir} -lpeios-smoke
Cflags: -I${includedir}/peios-smoke
EOF
PKG_CONFIG_LIBDIR="$SMOKE" "$PREFIX/bin/pkgconf" --validate peios-smoke
test "$(PKG_CONFIG_LIBDIR="$SMOKE" "$PREFIX/bin/pkgconf" --modversion peios-smoke)" = 1.2.3
test "$(PKG_CONFIG_LIBDIR="$SMOKE" "$PREFIX/bin/pkg-config" --modversion peios-smoke)" = 1.2.3
PKG_CONFIG_LIBDIR="$SMOKE" "$PREFIX/bin/pkgconf" --cflags --libs peios-smoke |
  grep -F -- '-I/usr/include/peios-smoke'
for tool in bomtool spdxtool pccritic; do
  "$PREFIX/bin/$tool" --help >/dev/null
done

test -f "$LIBDIR/libpkgconf.so.8.0.0"
test -L "$LIBDIR/libpkgconf.so.8"
test -L "$LIBDIR/libpkgconf.so"
test -s "$LIBDIR/libpkgconf.a"
test -f "$PREFIX/include/pkgconf/libpkgconf/libpkgconf.h"
export PKG_CONFIG_LIBDIR="$LIBDIR/pkgconfig"
export PKG_CONFIG_SYSROOT_DIR="$STAGE"
"$PREFIX/bin/pkgconf" --validate libpkgconf
test "$("$PREFIX/bin/pkgconf" --modversion libpkgconf)" = "$PEKIT_VERSION"

cat > "$SMOKE/consumer.c" <<'EOF'
#include <libpkgconf/libpkgconf.h>
int main(void)
{
  return pkgconf_compare_version("3.0.5", "3.0.6") < 0 ? 0 : 1;
}
EOF
PC_CFLAGS=$("$PREFIX/bin/pkgconf" --cflags libpkgconf)
PC_LIBS=$("$PREFIX/bin/pkgconf" --libs libpkgconf)
cc $PC_CFLAGS "$SMOKE/consumer.c" $PC_LIBS -o "$SMOKE/shared-consumer"
"$SMOKE/shared-consumer"
cc -I"$PREFIX/include/pkgconf" "$SMOKE/consumer.c" \
  "$LIBDIR/libpkgconf.a" -o "$SMOKE/static-consumer"
"$SMOKE/static-consumer"

readelf -d "$LIBDIR/libpkgconf.so.8.0.0" |
  grep -F 'Library soname: [libpkgconf.so.8]'
readelf --dyn-syms -W "$LIBDIR/libpkgconf.so.8.0.0" |
  grep -E ' pkgconf_compare_version(@|$)'
test "$(find "$PREFIX/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 5
test -n "$(find "$PREFIX/src/debug/org.pkgconf.pkgconf" -type f -print -quit)"
for dbg in $(find "$PREFIX/lib/debug/.build-id" -type f -name '*.debug'); do
  readelf -S "$dbg" 2>/dev/null | grep -F '.debug_info'
done

for elf in \
  "$PREFIX/bin/pkgconf" \
  "$PREFIX/bin/bomtool" \
  "$PREFIX/bin/spdxtool" \
  "$PREFIX/bin/pccritic" \
  "$LIBDIR/libpkgconf.so.8.0.0"; do
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep -E 'GNU_STACK.*RW '
  readelf -W -l "$elf" | grep -F 'GNU_RELRO'
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
    readelf -n "$elf" | grep -E 'x86 feature:.*IBT.*SHSTK'
  fi
  if readelf -d "$elf" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
done
readelf -d "$LIBDIR/libpkgconf.so.8.0.0" | grep -F 'Shared library: [libc.so.6]'
for elf in "$PREFIX/bin/pkgconf" "$PREFIX/bin/bomtool" \
  "$PREFIX/bin/spdxtool" "$PREFIX/bin/pccritic"; do
  readelf -d "$elf" | grep -F 'Shared library: [libpkgconf.so.8]'
  readelf -d "$elf" | grep -F 'Shared library: [libc.so.6]'
done
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"com.mesonbuild.meson"         = ">= 1.4"
"org.ninja-build.ninja"        = "*"
"org.gnu.binutils"             = "*"
"org.gnu.findutils"            = "*"
"org.gnu.grep"                 = "*"

[test.dependencies.apt]
build-essential = "*"
meson           = ">= 1.4"
ninja-build     = "*"
binutils        = "*"
findutils       = "*"
grep            = "*"
