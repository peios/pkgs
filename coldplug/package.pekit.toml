# Base metadata shared by the coldplug packages. Each <name>.package.pekit.toml
# inherits these fields and adds its own description, dependencies, and files.
#
# x86_64, not noarch: the payload is a script, but it depends on the x86_64
# userspace (kmod, peiosutils), and arch-dependence is transitive through deps
# — a package pulling x86_64 deps must itself be x86_64 (PSPU §4.1.3).
format = "peipkg"

[package]
version      = "1.0.0-1"
architecture = "x86_64"
license      = "MIT"
