format = "peipkg"

[package]
name         = "bash"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU Bash - the Bourne-Again Shell"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/bash/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING"   = "usr/share/licenses/bash/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
