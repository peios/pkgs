# bash — the GNU Bourne-Again Shell; glibc's build scripts hard-require it
# (the 2b glibc rebuild is why it's in the seed at all).
#
# Phase-2a tool (PEI-155): autotools from the release tarball, out-of-source
# via DESTDIR (the m4 shape). Uses the BUNDLED readline (we package no
# ncurses/readline yet) — without a termcap provider bash falls back to its
# internal termcap subset, which degrades line-editing niceties but is
# irrelevant to build scripts. Rebuild against real ncurses/readline when
# they enter the tree. --without-bash-malloc: bash's own allocator predates
# and misbehaves with modern glibc; every major distro disables it.
#
# bash does NOT hold the `sh` role — dash does (see dash's claims).

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/bash/bash-{{version}}.tar.gz"
extract  = true
root     = "bash-{{version}}"
versions = ">= 5.3"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --without-bash-malloc --disable-nls
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
# Interpreter only: drop the loadable-builtin apparatus (lib/bash + headers
# + bash.pc), the bashbug mailer script, and info/doc trees.
rm -rf "$PEKIT_OUT/usr/lib" "$PEKIT_OUT/usr/include" \
  "$PEKIT_OUT/usr/bin/bashbug" "$PEKIT_OUT/usr/share/info" \
  "$PEKIT_OUT/usr/share/doc" "$PEKIT_OUT/usr/share/man/man1/bashbug.1"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
