# python3-setuptools — the setuptools PEP 517 backend, for the Python
# projects that still build with it (meson is the customer today; C
# extension modules would be the next). A BUILD-TIME library: nothing on
# a running Peios imports it, and it must never become the way software
# is installed — that is the pip world this packaging design exists to
# avoid.
#
# Self-hosting like flit_core: the sdist's own setuptools.build_meta builds
# its wheel (backend-path = ["."]). The wheel carries
# distutils-precedence.pth, a startup hook every distro ships that routes
# `import distutils` (gone from CPython since 3.12) to setuptools' bundled
# copy — kept, it is part of upstream's install contract. The build and
# install steps are the workspace helper's; see _pybuild_/README.md.
#
# No tests: the upstream suite is pytest plus a dozen plugins.
#
#   pekit publish --version 84.0.0 --env peipkg --keyring dev

out_dir = "out"

[source.url]
url      = "https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-{{version}}.tar.gz"
extract  = true
root     = "setuptools-{{version}}"
versions = ">= 84.0.0"

[build.main]
command = """
# --copy-tree: setuptools writes build/ and *.egg-info beside the sources,
# and the fetched tree must stay pristine for the -source package.
python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/install-wheel" \
  --backend setuptools.build_meta --copy-tree --out "$PEKIT_OUT" "$(pwd)"
"""

[build.main.dependencies.peipkg]
dash          = "*"
coreutils-gnu = "*"
python3       = ">= 3.14, < 3.15"

[build.main.dependencies.apt]
python3 = "*"
