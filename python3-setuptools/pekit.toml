# python3-setuptools — the setuptools PEP 517 backend, for the Python
# projects that still build with it (meson is the customer today; C
# extension modules would be the next). A BUILD-TIME library: nothing on
# a running Peios imports it, and it must never become the way software
# is installed — that is the pip world this packaging design exists to
# avoid.
#
# Self-hosting like flit_core: the sdist's own setuptools.build_meta
# builds its wheel (backend-path = ["."]). The build runs on a COPY of the
# source tree because setuptools litters build/ and *.egg-info beside the
# sources, and the fetched tree must stay pristine. Install is extraction;
# the wheel carries distutils-precedence.pth, a startup hook every distro
# ships that routes `import distutils` (gone from CPython since 3.12) to
# setuptools' bundled copy — kept, it is part of upstream's install
# contract. Bytecode compiled here, checked-hash, shipped.
#
# No tests: the upstream suite is pytest plus a dozen plugins.
#
#   pekit publish --version 84.0.0 --env peipkg --keyring dev

out_dir = "out"

[source.url]
url      = "https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-{{version}}.tar.gz"
extract  = true
root     = "setuptools-{{version}}"
versions = ">= 84.0.0"

[build.main]
command = """
SRC="$(pwd)"
SITE="$(python3 -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"

cp -r "$SRC" "$PEKIT_OUT/src"
mkdir -p "$PEKIT_OUT/wheel"
(cd "$PEKIT_OUT/src" && PYTHONDONTWRITEBYTECODE=1 \
  python3 -c 'import sys, setuptools.build_meta as b; b.build_wheel(sys.argv[1])' "$PEKIT_OUT/wheel")

mkdir -p "$PEKIT_OUT$SITE"
python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
  "$PEKIT_OUT"/wheel/setuptools-*.whl "$PEKIT_OUT$SITE"

python3 -m compileall -q --invalidation-mode checked-hash \
  -s "$PEKIT_OUT" -p / "$PEKIT_OUT$SITE"
rm -rf "$PEKIT_OUT/wheel" "$PEKIT_OUT/src"
"""

[build.main.dependencies.peipkg]
dash          = "*"
coreutils-gnu = "*"
python3       = ">= 3.14, < 3.15"

[build.main.dependencies.apt]
python3 = "*"
