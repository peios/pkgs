# Shared metadata for the GDB package family. Each package is defined in its
# own *.package.pekit.toml; this file is only the base layer.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
# GDB and the BFD, opcodes, libctf and libsframe libraries it links statically
# are GPL-3.0-or-later; libiberty is LGPL-2.0-or-later, Gnulib contributes
# LGPL-2.1-or-later modules, libdecnumber carries the GCC runtime exception and
# libbacktrace is BSD-3-Clause.
license       = "GPL-3.0-or-later AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND (GPL-3.0-or-later WITH GCC-exception-3.1) AND BSD-3-Clause"
license_class = "free"
homepage      = "https://www.gnu.org/software/gdb/"
