# glibc — runtime package: the dynamic loader, the versioned shared libraries,
# and the core charset converters. Shared metadata (format/version/arch/license/
# homepage) is inherited from the bare package.pekit.toml; only the description
# and file set live here.
#
# This is the package every dynamically-linked binary needs and nothing more.
# Sibling packages carve out the rest of the build:
#   glibc-bin           the programs, the locale infrastructure, and C.utf8
#   glibc-gconv-extra   the ~247 non-core charset converters
#   glibc-devel         headers, dev .so symlinks, crt*.o, libc_nonshared.a
#   glibc-static        static *.a archives
#   glibc-utils         profiling/tracing tools + their preload/audit modules
#   glibc-locale-source locale source definitions + charmaps (noarch)
#   glibc-langpack-*    compiled per-language locale data
#
# ":" = the default "main:" build. Mapping dest semantics: a glob source ("**",
# "*.so.*") maps to a DIRECTORY; an exact-file source maps to a FULL path.

[package]
name        = "org.gnu.glibc"
description = "GNU C Library - shared libraries and dynamic loader"

[provides]
glibc = "{{version}}-5"

[replaces]
glibc = "<= {{version}}-4"

# The dynamic linker's ABI-fixed path. glibc installs the real loader under the
# triplet (/usr/lib/x86_64-linux-peios/ld-linux-x86-64.so.2), and the x86-64
# psABI hard-codes every dynamic binary's interpreter as
# /lib64/ld-linux-x86-64.so.2. fsbase supplies the explicit
# /lib64 -> usr/lib/x86_64-linux-peios ABI mapping, so that interpreter path
# resolves to the loader glibc ships below — no per-file claim needed.

[files]
# License texts (distro convention: /usr/share/licenses/<name>/).
"@source:COPYING*" = "usr/share/licenses/org.gnu.glibc/"
"@source:LICENSES" = "usr/share/licenses/org.gnu.glibc/"
# Versioned shared libraries (*.so.N) + the dynamic loader. The unversioned dev
# symlinks (*.so) are glibc-devel's; the static *.a are glibc-static's.
":usr/lib/x86_64-linux-peios/*.so.*"   = "usr/lib/x86_64-linux-peios/"
# Core charset converters. The partition is UPSTREAM'S OWN, not a hand-kept
# list: glibc installs two registries, gconv-modules naming these eight and
# gconv-modules.d/gconv-modules-extra.conf naming the other ~524 entries. The
# eight are what UTF-8, Latin-1/9, CP1252 and the internal UCS pivots need, so
# they are the set an ordinary program's iconv path actually touches — and they
# are 135 KB against 7.6 MB for the rest. Debian's libc6 ships exactly these
# eight; Fedora's glibc keeps the same set less ANSI_X3.110.
#
# Everything else, including the extra registry file, is glibc-gconv-extra's.
# A missing extra module is not a broken install: iconv reports the conversion
# as unavailable, exactly as on a Debian or Fedora system without the extras.
":usr/lib/x86_64-linux-peios/gconv/gconv-modules"      = "usr/lib/x86_64-linux-peios/gconv/gconv-modules"
":usr/lib/x86_64-linux-peios/gconv/ANSI_X3.110.so"     = "usr/lib/x86_64-linux-peios/gconv/ANSI_X3.110.so"
":usr/lib/x86_64-linux-peios/gconv/CP1252.so"          = "usr/lib/x86_64-linux-peios/gconv/CP1252.so"
":usr/lib/x86_64-linux-peios/gconv/ISO8859-1.so"       = "usr/lib/x86_64-linux-peios/gconv/ISO8859-1.so"
":usr/lib/x86_64-linux-peios/gconv/ISO8859-15.so"      = "usr/lib/x86_64-linux-peios/gconv/ISO8859-15.so"
":usr/lib/x86_64-linux-peios/gconv/UNICODE.so"         = "usr/lib/x86_64-linux-peios/gconv/UNICODE.so"
":usr/lib/x86_64-linux-peios/gconv/UTF-7.so"           = "usr/lib/x86_64-linux-peios/gconv/UTF-7.so"
":usr/lib/x86_64-linux-peios/gconv/UTF-16.so"          = "usr/lib/x86_64-linux-peios/gconv/UTF-16.so"
":usr/lib/x86_64-linux-peios/gconv/UTF-32.so"          = "usr/lib/x86_64-linux-peios/gconv/UTF-32.so"
# RPC program-number database (runtime data), shipped into the vendor config
# layer — /usr/etc is the bottom of the /etc merge, and a package never writes
# /etc directly, so readers still find it at /etc/rpc through the view.
# /etc/ld.so.cache is omitted — host-specific, rebuilt by `ldconfig`
# post-install.
":etc/rpc"                             = "usr/etc/rpc"
