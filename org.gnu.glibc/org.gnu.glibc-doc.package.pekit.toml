# glibc-doc — the GNU C Library reference manual as HTML, rendered by
# upstream's `make html` (texi2any) from the release's Texinfo sources.
# Arch-independent, so this overrides the base architecture to noarch.
# Peios ships no Info documents.

[package]
name          = "org.gnu.glibc-doc"
description  = "GNU C Library - HTML reference manual"
architecture = "noarch"

[provides]

[replaces]

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.glibc-doc/"
"@source:LICENSES" = "usr/share/licenses/org.gnu.glibc-doc/"
":usr/share/doc/org.gnu.glibc/html/**" = "usr/share/doc/org.gnu.glibc/html"
