# glibc-langpack-<lang>, for languages whose locale directory carries no
# territory suffix.
#
# The sibling glibc-langpack member enumerates on `^([a-z]+)_` and globs
# `<lang>_*`, which covers the 496 locales named <lang>_<CC>[.enc][@mod]. Three
# are named by language alone — eo, syr, tok — so that regex never matches them
# and no package ever claimed them: they were built on every run and shipped
# nowhere. This member is the other half of the enumeration.
#
# It is a separate member rather than a widened glob because the two cannot be
# expressed as one. `<lang>*` would over-match badly — `sa*` swallows sah and
# sat, `an*` swallows anp, `mn*` swallows mni and mnw — putting one language's
# locales in another's package; and a second glob on this member would have to
# match nothing for the ~180 languages that have only the suffixed form, which
# pekit rejects outright (`missing_payload: ... has no matches`). Two members
# with disjoint regexes emit disjoint package sets, so the names never collide.
#
# Inherits base metadata, including architecture = x86_64: compiled locale data
# is native-endian binary, so NOT noarch.
#
# `C.utf8` is deliberately not matched here either — the regex is lowercase-only
# and C.utf8 is glibc-bin's, alongside the tools that consume it.

[multipack.enum.files]
path = "locale:usr/lib/x86_64-linux-peios/locale/*"
regex = '^([a-z]+)$'

[package]
name = "org.gnu.glibc-langpack-{{multipack}}"
description = "GNU C Library - {{multipack}} locale data"

[provides]
"glibc-langpack-{{multipack}}" = "{{version}}-5"

[replaces]
"glibc-langpack-{{multipack}}" = "<= {{version}}-4"

[dependencies]
# Compiled locale data is loaded by glibc at runtime and its binary format is
# tied to the glibc that produced it, so pin the matching family revision.
"org.gnu.glibc" = "{{version}}-5"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.glibc-langpack-{{multipack}}/"
"@source:LICENSES" = "usr/share/licenses/org.gnu.glibc-langpack-{{multipack}}/"
"locale:usr/lib/x86_64-linux-peios/locale/{{multipack}}/**" = "usr/lib/x86_64-linux-peios/locale/{{multipack}}/"
