cat > "$SMOKE/empty-publickey-api.c" <<'EOF'
#define _GNU_SOURCE 1
#include <dlfcn.h>
#include <nss.h>
#include <string.h>
#include <sys/types.h>

typedef int (*getpublickey_function)(const char *, char *);
typedef int (*getsecretkey_function)(const char *, char *, const char *);
typedef int (*netname2user_function)(const char *, uid_t *, gid_t *, int *,
                                    gid_t *);

static getpublickey_function getpublickey_api;
static getsecretkey_function getsecretkey_api;
static netname2user_function netname2user_api;

static int
require_empty(void)
{
  char public_key[1024] = "unchanged-public";
  char secret_key[1024] = "unchanged-secret";
  uid_t uid = 111;
  gid_t gid = 222;
  int ngroups = 0;
  gid_t groups[1] = { 333 };

  if (getpublickey_api("tripwire", public_key) != 0
      || strcmp(public_key, "unchanged-public") != 0)
    return 10;
  if (getsecretkey_api("tripwire", secret_key, "password") != 0
      || strcmp(secret_key, "unchanged-secret") != 0)
    return 11;
  if (netname2user_api("tripwire", &uid, &gid, &ngroups, groups) != 0
      || uid != 111 || gid != 222 || ngroups != 0 || groups[0] != 333)
    return 12;
  return 0;
}

int
main(void)
{
  /* These obsolete interfaces are retained as non-default compatibility ABI
     on x86-64 and intentionally have no installed headers.  Resolve their
     exact historical symbol version instead of pretending they are a new
     development interface.  */
  getpublickey_api = (getpublickey_function)
    dlvsym(RTLD_DEFAULT, "getpublickey", "GLIBC_2.2.5");
  getsecretkey_api = (getsecretkey_function)
    dlvsym(RTLD_DEFAULT, "getsecretkey", "GLIBC_2.2.5");
  netname2user_api = (netname2user_function)
    dlvsym(RTLD_DEFAULT, "netname2user", "GLIBC_2.2.5");
  if (getpublickey_api == NULL || getsecretkey_api == NULL
      || netname2user_api == NULL)
    return 2;

  int status = require_empty();
  if (status != 0)
    return status;
  if (__nss_configure_lookup("publickey", "nis nisplus") != -1)
    return 20;
  status = require_empty();
  return status == 0 ? 0 : status + 20;
}
EOF
