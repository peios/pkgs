# initgroups always prints the requested user and succeeds even when no service
# contributes a group.  Prove config-file and programmatic `files` overrides
# retain the positive Peios provider record instead of treating that shell
# behavior as a negative result.
for mode in config override; do
  output="$SMOKE/getent-$mode-initgroups.out"
  if [ "$mode" = config ]; then
    "$LOADER" --library-path "$STAGED_LIBDIR" \
      "$PEKIT_OUT/usr/bin/getent" initgroups authority > "$output"
  else
    "$LOADER" --library-path "$STAGED_LIBDIR" \
      "$PEKIT_OUT/usr/bin/getent" -s files initgroups authority > "$output"
  fi
  grep -Eq '^authority[[:space:]]+4242$' "$output"
