# publickey is the legacy Secure RPC/DES key database, not a Peios principal
# credential source.  Install successful NIS/NIS+ tripwire providers only on
# this probe's loader path, then require all three public APIs to return false
# without touching their outputs.  Repeat after attempting the exported
# programmatic override: a frozen-empty database must reject it and still never
# dispatch to either tripwire.  netgroup is intentionally not part of this
# policy and is checked as configurable by nss-policy.c below.
cat > "$SMOKE/nss-publickey-tripwire.c" <<'EOF'
#include <nss.h>
#include <string.h>
#include <sys/types.h>

static enum nss_status
tripwire_getpublickey(const char *name, char *key, int *errnop)
{
  (void) name;
  (void) errnop;
  strcpy(key, "forbidden-public-key");
  return NSS_STATUS_SUCCESS;
}

static enum nss_status
tripwire_getsecretkey(const char *name, char *key, const char *password,
                      int *errnop)
{
  (void) name;
  (void) password;
  (void) errnop;
  strcpy(key, "forbidden-secret-key");
  return NSS_STATUS_SUCCESS;
}

static enum nss_status
tripwire_netname2user(char netname[], uid_t *uid, gid_t *gid, int *ngroups,
                     gid_t *groups)
{
  (void) netname;
  *uid = 4242;
  *gid = 4242;
  *ngroups = 0;
  (void) groups;
  return NSS_STATUS_SUCCESS;
}

enum nss_status _nss_nis_getpublickey(const char *name, char *key, int *errnop)
{ return tripwire_getpublickey(name, key, errnop); }
enum nss_status _nss_nisplus_getpublickey(const char *name, char *key,
