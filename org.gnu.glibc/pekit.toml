# Query records that exist in an ordinary Linux files database and require no
# files-derived answer, first through the reference rung's nsswitch.conf and
# then through getent -s (the public path to the programmatic override hook).
# Shadow databases may be unreadable to the unprivileged wrapper, but the
# direct hook test above independently proves their override is rejected rather
# than merely denied by file mode.
FILES_USER=
FILES_UID=
FILES_GROUP=
FILES_GID=
FILES_HOST=
[ ! -r /etc/passwd ] || FILES_USER=$(awk -F: 'NF { print $1; exit }' /etc/passwd)
[ ! -r /etc/passwd ] || FILES_UID=$(awk -F: 'NF { print $3; exit }' /etc/passwd)
[ ! -r /etc/group ] || FILES_GROUP=$(awk -F: 'NF { print $1; exit }' /etc/group)
[ ! -r /etc/group ] || FILES_GID=$(awk -F: 'NF { print $3; exit }' /etc/group)
[ ! -r /etc/hosts ] || FILES_HOST=$(awk '!/^[[:space:]]*(#|$)/ && NF >= 2 { print $2; exit }' /etc/hosts)
[ -n "$FILES_USER" ] || FILES_USER=root
[ -n "$FILES_UID" ] || FILES_UID=0
[ -n "$FILES_GROUP" ] || FILES_GROUP=root
[ -n "$FILES_GID" ] || FILES_GID=0
[ -n "$FILES_HOST" ] || FILES_HOST=localhost
for query in \
  "passwd-name|passwd|$FILES_USER" \
  "passwd-id|passwd|$FILES_UID" \
  "group-name|group|$FILES_GROUP" \
  "group-id|group|$FILES_GID" \
  'shadow|shadow|root' \
  'gshadow|gshadow|root' \
  "hosts|hosts|$FILES_HOST"; do
  label=${query%%|*}
  remainder=${query#*|}
  database=${remainder%%|*}
  key=${remainder#*|}
  for mode in config override; do
    output="$SMOKE/getent-$mode-$label.out"
    status=0
    if [ "$mode" = config ]; then
      "$LOADER" --library-path "$STAGED_LIBDIR" \
        "$PEKIT_OUT/usr/bin/getent" "$database" "$key" > "$output" \
        || status=$?
    else
      "$LOADER" --library-path "$STAGED_LIBDIR" \
        "$PEKIT_OUT/usr/bin/getent" -s files "$database" "$key" \
        > "$output" || status=$?
    fi
    if [ "$status" -ne 2 ]; then
      echo "glibc: $mode $database lookup returned unexpected status $status for $key" >&2
      cat "$output" >&2
      exit 1
    fi
    test ! -s "$output"
  done
done

# A glibc static link is not a hermetic identity/resolver implementation.  NSS
# remains modular even for an ET_EXEC binary: the matching shared glibc and NSS
# providers must exist at runtime.  Prove both sides of that boundary by linking
# the probe explicitly to this staged libc and resolving name/id/group/host
# records through the staged Peios providers.  Composed images must retain the
# same-version runtime and real authd/resolvd providers; glibc-static alone is
# intentionally insufficient for authority-backed lookups.
cat > "$SMOKE/static-nss.c" <<'EOF'
#include <grp.h>
#include <netdb.h>
#include <pwd.h>

int main(void)
{
  struct addrinfo hints = { .ai_family = AF_INET };
  struct addrinfo *ai = 0;
  struct passwd *pw_name = getpwnam("authority");
  struct passwd *pw_id = getpwuid(4242);
  struct group *gr_name = getgrnam("authority");
  struct group *gr_id = getgrgid(4242);
  int gai = getaddrinfo("authority.invalid", 0, &hints, &ai);
  int ok = pw_name != 0 && pw_id != 0 && gr_name != 0 && gr_id != 0 && gai == 0;
  if (ai != 0)
    freeaddrinfo(ai);
  return ok ? 0 : 1;
}
EOF
cc --sysroot="$PEKIT_OUT" -isystem "$PEKIT_OUT/usr/include" \
  -idirafter /usr/include/x86_64-linux-gnu -idirafter /usr/include \
  -B"$STAGED_LIBDIR/" -L"$STAGED_LIBDIR" \
  -static "$SMOKE/static-nss.c" -o "$SMOKE/static-nss"
LD_LIBRARY_PATH="$STAGED_LIBDIR" "$SMOKE/static-nss"
rm -f "$STAGED_LIBDIR/libnss_peios.so.2" "$STAGED_LIBDIR/libnss_peios_net.so.2"
if LD_LIBRARY_PATH="$STAGED_LIBDIR" "$SMOKE/static-nss"; then
  echo 'glibc: static NSS unexpectedly resolved without Peios providers' >&2
  exit 1
fi

# Validate every shipped dynamic ELF/module, scrub build paths from DWARF,
# split debug out (build-id indexed), and strip the binaries (~5x smaller).
# Per ELF: debugedit rewrites the build-tree comp_dir prefix ($ROOT) to a stable
# /usr/src/debug/org.gnu.glibc (otherwise the .debug leak the builder's homedir — same
# class of leak as rpath — and source paths don't resolve on a target) and lists
# the sources it references; objcopy then splits the clean DWARF into
# /usr/lib/debug/.build-id/ and strip removes it. Build-id notes come from the
# toolchain. Static archives and relocatable link inputs get --strip-debug
# (keeping the symtab so they still link; they have no build-id to index).
# Then the referenced sources are copied under
# /usr/src/debug/org.gnu.glibc. (org.gnu.glibc-debuginfo packages
# /usr/lib/debug; org.gnu.glibc-debugsource packages /usr/src/debug.)
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
: > "$PEKIT_OUT/.buildids"
: > "$PEKIT_OUT/.elfs"
: > "$PEKIT_OUT/.inodes"
cd "$PEKIT_OUT"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  inode=$(stat -c '%d:%i' "$f")
  if grep -Fxq "$inode" "$PEKIT_OUT/.inodes"; then
    continue
  fi
  printf '%s\n' "$inode" >> "$PEKIT_OUT/.inodes"
  case "$f" in
    *.a)
      if readelf -h "$f" >/dev/null 2>&1; then
        strip --strip-debug "$f"
      elif ar t "$f" >/dev/null 2>&1; then
        strip --strip-debug "$f"
      elif grep -q 'GNU ld script' "$f"; then
        : # libm.a is a textual linker script, despite its suffix.
      else
        echo "glibc: unrecognized static-library payload: $f" >&2
        exit 1
      fi
      if grep -aF "$ROOT" "$f" >/dev/null; then
        echo "glibc: build path remains in static-library payload $f" >&2
        exit 1
      fi
      continue
      ;;
    *.o)
      strip --strip-debug "$f"
      if grep -aF "$ROOT" "$f" >/dev/null; then
        echo "glibc: build path remains in relocatable payload $f" >&2
        exit 1
      fi
      continue
      ;;
  esac
  if ! readelf -h "$f" >/dev/null 2>&1; then
    continue
  fi

  # glibc owns its stack-protector exceptions internally, but every installed
  # executable and DSO must still be PIE/DYN with RELRO, immediate binding, a
  # non-executable stack, CET IBT+SHSTK, a build ID, and no text relocations. A
  # few interdependent gconv modules intentionally use $ORIGIN; no other
  # runtime path is allowed.
  readelf -h "$f" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -W -l "$f" | grep -F 'GNU_RELRO' >/dev/null
  readelf -W -l "$f" | grep -E 'GNU_STACK.*RW ' >/dev/null
  readelf -d "$f" | grep -F 'BIND_NOW' >/dev/null
  readelf -n "$f" | grep -F 'x86 feature: IBT, SHSTK' >/dev/null
  if readelf -d "$f" | grep -q 'TEXTREL'; then
    echo "glibc: text relocation in $f" >&2
    exit 1
  fi
  runpath=$(readelf -d "$f" | sed -n 's/.*Library r[^:]*: \[\(.*\)\]/\1/p')
  if [ -n "$runpath" ]; then
    case "$f:$runpath" in
      usr/lib/x86_64-linux-peios/gconv/*.so:'$ORIGIN') ;;
      *) echo "glibc: unexpected runtime path in $f: $runpath" >&2; exit 1;;
    esac
  fi

  : > "$PEKIT_OUT/.dl"
  if readelf -W -S "$f" | grep -q '\.debug_info'; then
    debugedit -b "$ROOT" -d "$DEBUG_DEST" \
      -l "$PEKIT_OUT/.dl" -n "$f"
    cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist"
  fi
  bid=$(readelf -n "$f" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -z "$bid" ]; then
    echo "glibc: missing build ID in $f" >&2
    exit 1
  fi
  printf '%s %s\n' "$bid" "$f" >> "$PEKIT_OUT/.buildids"
  printf '%s\n' "$f" >> "$PEKIT_OUT/.elfs"
  p2=$(printf %s "$bid" | cut -c1-2)
  rest=$(printf %s "$bid" | cut -c3-)
  debug="usr/lib/debug/.build-id/$p2/$rest.debug"
  mkdir -p "usr/lib/debug/.build-id/$p2"
  objcopy --only-keep-debug "$f" "$debug"
  chmod 0644 "$debug"
  readelf -n "$debug" | grep -F "Build ID: $bid" >/dev/null
  if grep -aF "$ROOT" "$debug" >/dev/null; then
    echo "glibc: build path remains in debug payload for $f" >&2
    exit 1
  fi
  strip "$f"
  if readelf -W -S "$f" | grep -q '\.debug_info'; then
    echo "glibc: DWARF remains in stripped payload $f" >&2
    exit 1
  fi
  if grep -aF "$ROOT" "$f" >/dev/null; then
    echo "glibc: build path remains in stripped payload $f" >&2
    exit 1
  fi
done
tr '\0' '\n' < "$PEKIT_OUT/.srclist" | LC_ALL=C sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */|*/\<built-in\>) continue;; esac
  case "$rel" in
    # gperf's generated headers use basename-only #line directives.  The same
    # charmap header is compiled from iconv and locale, so DWARF quite
    # legitimately names these three compilation-directory-relative aliases
    # even though the canonical release-archive inputs live in locale/programs.
    # Keep the aliases at the paths DWARF references, but accept no generic
    # missing-source fallback.
    source/iconv/charmap-kw.gperf|source/locale/charmap-kw.gperf)
      origin="$SRC/locale/programs/charmap-kw.gperf" ;;
    source/locale/locfile-kw.gperf)
      origin="$SRC/locale/programs/locfile-kw.gperf" ;;
    source/*) origin="$SRC/${rel#source/}" ;;
    build/*) origin="$BUILD/${rel#build/}" ;;
    *) echo "glibc: unexpected debug source namespace: $rel" >&2; exit 1;;
  esac
  if [ ! -f "$origin" ]; then
    echo "glibc: debug source listed by debugedit is missing: $rel" >&2
    exit 1
  fi
  mkdir -p "usr/src/debug/org.gnu.glibc/$(dirname "$rel")"
  cp "$origin" "usr/src/debug/org.gnu.glibc/$rel"
done
test -n "$(find usr/lib/debug -type f -name '*.debug' -print -quit)"
test -n "$(find usr/src/debug/org.gnu.glibc -type f -print -quit)"
ELF_COUNT=$(wc -l < "$PEKIT_OUT/.elfs")
BUILD_ID_COUNT=$(cut -d' ' -f1 "$PEKIT_OUT/.buildids" | LC_ALL=C sort -u | wc -l)
test "$ELF_COUNT" -ge 250
test "$BUILD_ID_COUNT" -eq "$ELF_COUNT"
rm -rf "$SMOKE"
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist" \
  "$PEKIT_OUT/.buildids" "$PEKIT_OUT/.elfs" "$PEKIT_OUT/.inodes"
'''

# Build deps. glibc is autotools (gcc + make) but pulls in a wider host set than
# the bignums: bison (parser gen), gawk (its scripts need GNU awk specifically),
# python3 + perl (build scripts), texinfo (makeinfo — checked at build start),
# gettext (msgfmt — also checked), and the Linux UAPI headers (linux-libc-dev /
# kernel-headers, which the compiler wrapper supplies). The debug split uses
# debugedit (no patchelf — glibc scrubs no libtool rpath).
[build.main.dependencies.peipkg]
build-essentials-c = "*"
"org.gnu.bash"             = "*"
"org.gnu.bison"            = "*"
"org.gnu.gawk"             = "*"
"org.gnu.gettext"          = "*"
"org.gnu.gzip"             = "*"
"org.gnu.texinfo"          = "*"
"org.perl.perl"            = "*"
"org.python.python3"       = "*"
"org.sourceware.debugedit" = "*"
kernel-headers               = "*"

[build.main.dependencies.apt]
build-essential = "*"
bison = "*"
gawk = "*"
python3 = "*"
perl = "*"
texinfo = "*"
gettext = "*"
debugedit = "*"
linux-libc-dev = "*"
gzip = "*"

# Compiled locale data, kept out of the main build (locale compilation is slow
# and bulky). needs = ["main"] orders this after main and exposes its output dir
# as $PEKIT_MAIN_OUT, so we reuse main's already-built localedef instead of
# recompiling glibc — run it from main's build dir, staging into this build's OUT.
# install-locale-files emits PER-LOCALE DIRECTORIES (localedef --no-archive
# --no-hard-links: .../locale/de_DE.utf8/, etc.) so each langpack can glob one
# language; install-locales would instead emit a single monolithic locale-archive.
[build.locale]
needs = ["main"]
command = '''
set -eu
TRIPLET=x86_64-linux-peios
LIBDIR=/usr/lib/$TRIPLET
MAIN_LIBDIR="$PEKIT_MAIN_OUT$LIBDIR"
LOADER="$MAIN_LIBDIR/ld-linux-x86-64.so.2"
LOCALE="$PEKIT_MAIN_OUT/usr/bin/locale"
LOCALEDEF="$PEKIT_MAIN_OUT/usr/bin/localedef"
LOCALEDIR="$PEKIT_OUT$LIBDIR/locale"
SMOKE="$PEKIT_OUT/.locale-smoke"
JOBS=$(nproc)
MEM_JOBS=$(( $(awk '/MemAvailable/{print $2}' /proc/meminfo) / 1800000 ))
[ "$MEM_JOBS" -lt "$JOBS" ] && JOBS=$MEM_JOBS
[ "$JOBS" -gt 4 ] && JOBS=4
[ "$JOBS" -lt 1 ] && JOBS=1

make -C "$PEKIT_MAIN_OUT/build" -j"$JOBS" \
  localedata/install-locale-files DESTDIR="$PEKIT_OUT"

# Validate the complete per-locale install and exercise a newly added 2.44
# locale so an accidentally stale or partial locale build cannot pass.
test -d "$LOCALEDIR/C.utf8"
test -d "$LOCALEDIR/de_DE.utf8"
test -d "$LOCALEDIR/hrx_BR.utf8"
test "$(find "$LOCALEDIR" -mindepth 1 -maxdepth 1 -type d | wc -l)" -gt 450
# `locale -a` enumerates the compiled-in locale directory, not a private
# LOCPATH.  Load and query the new 2.44 locale directly so this proves the
# staged per-locale corpus rather than accidentally inspecting the host.
LOCPATH="$LOCALEDIR" LC_ALL=hrx_BR.UTF-8 \
  "$LOADER" --library-path "$MAIN_LIBDIR" "$LOCALE" -k decimal_point \
  | grep -Fx 'decimal_point=","'
LOCPATH="$LOCALEDIR" LC_ALL=de_DE.UTF-8 \
  "$LOADER" --library-path "$MAIN_LIBDIR" "$LOCALE" -k decimal_point \
  | grep -Fx 'decimal_point=","'

# Re-run the complete langpack corpus into an independent root and compare a
# normalized manifest of every compiled locale file.  Sampling one or two
# locales would miss nondeterminism or omissions isolated to another language.
REPRO_LOCALE_ROOT="$SMOKE/repro"
make -C "$PEKIT_MAIN_OUT/build" -j"$JOBS" \
  localedata/install-locale-files DESTDIR="$REPRO_LOCALE_ROOT"
for root in "$LOCALEDIR" "$REPRO_LOCALE_ROOT$LIBDIR/locale"; do
  manifest="$root.manifest"
  (
    cd "$root"
    find . \( -type f -o -type l \) -print \
      | LC_ALL=C sort \
      | while IFS= read -r rel; do
          if [ -L "$rel" ]; then
            printf 'L %s %s\n' "$rel" "$(readlink "$rel")"
          else
            printf 'F %s %s ' "$(stat -c '%a' "$rel")" "$rel"
            sha256sum "$rel" | awk '{print $1}'
          fi
        done
  ) > "$manifest"
done
cmp "$LOCALEDIR.manifest" "$REPRO_LOCALE_ROOT$LIBDIR/locale.manifest"
rm -f "$LOCALEDIR.manifest" "$REPRO_LOCALE_ROOT$LIBDIR/locale.manifest"
rm -rf "$SMOKE"
'''

# Build deps. Re-runs make in main's already-configured glibc tree to compile the
# per-locale data with the localedef built there — needs the same gcc + make.
[build.locale.dependencies.peipkg]
build-essentials-c = "*"

[build.locale.dependencies.apt]
build-essential = "*"
