enum nss_status _nss_nis_netname2user(char netname[], uid_t *uid, gid_t *gid,
                                     int *ngroups, gid_t *groups)
{ return tripwire_netname2user(netname, uid, gid, ngroups, groups); }
enum nss_status _nss_nisplus_netname2user(char netname[], uid_t *uid,
