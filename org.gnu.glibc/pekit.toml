# Exercise the exported override hook directly.  All fixed databases must
# reject service selection, while a deliberately non-frozen database remains
# configurable so this does not accidentally disable NSS extension wholesale.
cat > "$SMOKE/nss-policy.c" <<'EOF'
#include <nss.h>
#include <stddef.h>

int main(void)
{
  static const char *const fixed[] = {
    "group", "group_compat", "gshadow", "hosts", "initgroups",
    "passwd", "passwd_compat", "publickey", "shadow", "shadow_compat"
  };
  for (size_t i = 0; i < sizeof fixed / sizeof fixed[0]; ++i)
    if (__nss_configure_lookup(fixed[i], "files") != -1)
      return 10 + i;
  if (__nss_configure_lookup("netgroup", "files") != 0)
    return 30;
  if (__nss_configure_lookup("networks", "files") != 0)
    return 31;
  return 0;
}
EOF
