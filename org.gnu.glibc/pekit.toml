# getent intentionally collapses lookup outcomes into an exit status.  Exercise
# the reentrant APIs directly with a nonzero incoming errno so an empty policy
# database cannot accidentally report an ambient provider error.  Both calls
# must be a normal not-found result: success status and a NULL record.
cat > "$SMOKE/empty-shadow-api.c" <<'EOF'
#include <errno.h>
#include <gshadow.h>
#include <shadow.h>
#include <stddef.h>

int main(void)
{
  char buffer[1024];
  struct spwd sp;
  struct spwd *sp_result = (struct spwd *) 1;
  errno = EIO;
  int sp_rc = getspnam_r("authority", &sp, buffer, sizeof buffer, &sp_result);
  if (sp_rc != 0 || sp_result != NULL)
    return 10;

  struct sgrp sg;
  struct sgrp *sg_result = (struct sgrp *) 1;
  errno = EIO;
  int sg_rc = getsgnam_r("authority", &sg, buffer, sizeof buffer, &sg_result);
  if (sg_rc != 0 || sg_result != NULL)
    return 20;

  return 0;
}
EOF
