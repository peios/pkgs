# glibc-devel — headers and the link-time pieces needed to compile and link
# against glibc. Inherits base metadata; pins the runtime it matches.

# The *.so glob below also matches glibc's runtime preload shims; drop them so
# they stay owned by glibc-utils (no double-claim / install conflict).
excludes = [
  ":usr/lib/x86_64-linux-peios/libmemusage.so",
  ":usr/lib/x86_64-linux-peios/libpcprofile.so",
]

[package]
name        = "org.gnu.glibc-devel"
description = "GNU C Library - development headers and libraries"

[provides]
"glibc-devel" = "{{version}}-5"

[replaces]
"glibc-devel" = "<= {{version}}-4"

[dependencies]
# The dev .so symlinks and the libc.so linker script resolve into glibc's
# versioned libs + loader, and the headers must match the runtime's ABI. Pin to
# the same family revision so the linker surface and installed runtime cannot
# drift during an upgrade.
"org.gnu.glibc" = "{{version}}-5"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.glibc-devel/"
"@source:LICENSES" = "usr/share/licenses/org.gnu.glibc-devel/"
# Headers.
":usr/include/**"                              = "usr/include/"
# Developer .so symlinks + the libc.so / libm.so linker scripts.
":usr/lib/x86_64-linux-peios/*.so"             = "usr/lib/x86_64-linux-peios/"
# C runtime startup objects (crt1.o, crti.o, crtn.o, Scrt1.o, gcrt1.o, ...).
":usr/lib/x86_64-linux-peios/*.o"              = "usr/lib/x86_64-linux-peios/"
# libc_nonshared.a is a static archive but is required for DYNAMIC linking too
# (the libc.so linker script GROUPs it), so it lives here, not in glibc-static.
":usr/lib/x86_64-linux-peios/libc_nonshared.a" = "usr/lib/x86_64-linux-peios/libc_nonshared.a"
# The empty compat archives for libraries merged into libc (2.34) plus the
# historic -lg stub. glibc no longer installs .so linker stubs for these, so
# `-lrt`/`-lpthread`/`-ldl` resolve through these archives — part of the
# DYNAMIC-linking compat surface (Debian ships them in libc6-dev), not of
# static glibc. Old-tarball probes (perl's Time::HiRes -lrt) depend on them.
":usr/lib/x86_64-linux-peios/libanl.a"     = "usr/lib/x86_64-linux-peios/libanl.a"
":usr/lib/x86_64-linux-peios/libdl.a"      = "usr/lib/x86_64-linux-peios/libdl.a"
":usr/lib/x86_64-linux-peios/libg.a"       = "usr/lib/x86_64-linux-peios/libg.a"
":usr/lib/x86_64-linux-peios/libpthread.a" = "usr/lib/x86_64-linux-peios/libpthread.a"
":usr/lib/x86_64-linux-peios/librt.a"      = "usr/lib/x86_64-linux-peios/librt.a"
":usr/lib/x86_64-linux-peios/libutil.a"    = "usr/lib/x86_64-linux-peios/libutil.a"
