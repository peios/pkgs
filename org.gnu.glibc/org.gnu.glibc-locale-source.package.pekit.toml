# glibc-locale-source — locale source definitions, charmaps, and glibc's own
# message catalogs. Arch-independent text/data, so this overrides the base
# architecture to "noarch". No dependency on glibc: the data is standalone, and
# any arch's localedef can compile it.
#
# This ships the locale SOURCE. The compiled, per-language locale data built
# from it ships in the org.gnu.glibc-langpack-<lang> packages.

[package]
name          = "org.gnu.glibc-locale-source"
description  = "GNU C Library - locale source definitions and charmaps"
architecture = "noarch"

[provides]

[replaces]

[files]
"@source:COPYING*"       = "usr/share/licenses/org.gnu.glibc-locale-source/"
"@source:LICENSES"       = "usr/share/licenses/org.gnu.glibc-locale-source/"
":usr/share/i18n/**"   = "usr/share/i18n/"
":usr/share/locale/**" = "usr/share/locale/"
