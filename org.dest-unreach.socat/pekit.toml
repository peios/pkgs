out_dir = "out"
[source]
patches = "patches"
[source.url]
url = "https://deb.debian.org/debian/pool/main/s/socat/socat_{{version}}.orig.tar.bz2"
listing_url = "https://deb.debian.org/debian/pool/main/s/socat/"
file_regex = 'socat_(?P<version>[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\.orig\.tar\.bz2'
versions = ">= 1.8.1.3"
root = "socat-{{version}}"
extract = true
[source.url.checksum]
"1.8.1.3" = "sha256:25bc6476292b2e614220989c77b0b6fca87bb2525d9747b31a6639b1fb602418"
[build.main]
command = '''
set -eu
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
mkdir -p "$PEKIT_OUT/build"
cp -a . "$PEKIT_OUT/build/"
cd "$PEKIT_OUT/build"
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.dest-unreach.socat"
export CXXFLAGS="${CXXFLAGS:-$CFLAGS} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.dest-unreach.socat"
export CPPFLAGS="${CPPFLAGS:-} -DENABLE_PEIOS -D_GNU_SOURCE"
export LDFLAGS="${LDFLAGS:?} -Wl,-z,ibtplt"
LIBS="" ac_cv_lib_cap_cap_get_proc=no ./configure --prefix=/usr --sbindir=/usr/bin --libdir=/usr/lib/x86_64-linux-peios --disable-libwrap --disable-readline --disable-namespaces --disable-posixmq --disable-tun
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
# Package the requested relay CLI, not upstream example scripts or analyzers.
rm -f "$PEKIT_OUT/usr/bin/filan" "$PEKIT_OUT/usr/bin/procan" "$PEKIT_OUT/usr/bin/socat-broker.sh" "$PEKIT_OUT/usr/bin/socat-chain.sh" "$PEKIT_OUT/usr/bin/socat-mux.sh"
rm -rf "$PEKIT_OUT/usr/share/doc"
find "$PEKIT_OUT/usr" -type f -name '*.la' -delete
find "$PEKIT_OUT/usr/bin" -type f -exec sh -c 'for f do if readelf -h "$f" >/dev/null 2>&1; then patchelf --remove-rpath "$f"; fi; done' sh {} +
find "$PEKIT_OUT/usr/share/man" -type f ! -name '*.gz' -exec gzip -9n {} +
find "$PEKIT_OUT/usr/share/man" -type l -exec sh -c 'for f do target=$(readlink "$f"); ln -s "$target.gz" "$f.gz"; rm "$f"; done' sh {} +
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.dest-unreach.socat "$PEKIT_OUT/usr"
'''
[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.gzip" = "*"
"org.openssl.openssl-devel" = "*"
[test]
needs = ["main"]
gate = true
command = 'python3 "$PEKIT_RECIPE_ROOT/tests/installed.py" "$PEKIT_MAIN_OUT"'
[test.dependencies.peipkg]
"org.git.kernel.dash" = "*"
"org.python.python3" = "*"
"dev.peios.build-essentials-c" = "*"
"org.openssl.openssl-devel" = "*"
