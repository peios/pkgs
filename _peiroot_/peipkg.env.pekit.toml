# Rung-2 build environment (PEI-126/PEI-155): peipkg-provided build deps in
# a pristine root composed from our own signed pool, selected with
# `pekit build --env peipkg`.
#
# This is the workspace's inherited `peipkg` profile. Recipes use it directly
# with `--env peipkg`; a recipe-local file of the same name would override it.
# The wrap locates enter.sh through the managed workspace root, so no
# per-recipe link or tailoring is needed.
dependency_provider = "peipkg"

[wrap]
command = 'exec "$PEKIT_WORKSPACE_ROOT/_peiroot_/enter.sh" {{command}}'
