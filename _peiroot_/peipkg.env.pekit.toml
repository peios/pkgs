# Rung-2 build environment (PEI-126/PEI-155): peipkg-provided build deps in
# a pristine root composed from our own signed pool, selected with
# `pekit build --env peipkg`.
#
# This file lives in _peiroot_/ and is symlinked into each migrated recipe
# as peipkg.env.pekit.toml — pekit resolves --env names against the recipe
# directory only. The wrap locates enter.sh through the managed environment,
# so the symlink needs no per-recipe tailoring.
dependency_provider = "peipkg"

[wrap]
command = 'exec "$PEKIT_WORKSPACE_ROOT/_peiroot_/enter.sh" {{command}}'
