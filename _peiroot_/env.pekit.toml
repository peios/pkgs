# The workspace's default (`main`) profile: every target runs in a native root
# composed from the signed Peios repository. Only `--env debian` differs, and
# that is for the minimal-bootstrap seed alone.
#
# Dependency-root preparation is coordinator policy; Pekit isolates workers.
dependency_provider = "peipkg"
[sandbox]
command = 'exec "$PEKIT_WORKSPACE_ROOT/_peiroot_/enter.sh"'
network_targets = ["build:vendor"]
# enter.sh installs this into every root it prepares; in native acquisition
# roots it starts the build-root resolver before the target.
entry = ["/usr/libexec/peiroot/entry"]
