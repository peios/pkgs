# liblzma — the LZMA/XZ compression runtime library, on its own so library
# consumers (elfutils' section decompression, future kmod) need not pull
# the tools.

[package]
name        = "liblzma"
description = "XZ Utils - liblzma LZMA/XZ compression runtime library"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING.0BSD" = "usr/share/licenses/liblzma/"
":usr/lib/x86_64-linux-peios/liblzma.so.5*" = "usr/lib/x86_64-linux-peios"
