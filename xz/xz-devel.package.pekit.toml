# xz-devel — headers, the liblzma.so link, and pkg-config metadata for
# building against liblzma.

[package]
name        = "xz-devel"
description = "XZ Utils - liblzma headers and link library"

[dependencies]
liblzma = "{{version}}"

[files]
":usr/include/**"                             = "usr/include"
":usr/lib/x86_64-linux-peios/liblzma.so"      = "usr/lib/x86_64-linux-peios/liblzma.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**"    = "usr/lib/x86_64-linux-peios/pkgconfig"
