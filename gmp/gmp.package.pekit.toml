# gmp — runtime: the C library (libgmp.so.10), and only that. The C++ wrapper
# (libgmpxx.so.4) is the separate gmp-c++ package; headers and dev symlinks are
# gmp-devel; the static archives are gmp-static.
#
# A glob source ("so.10*") maps to a DIRECTORY.

[package]
description = "GNU Multiple Precision Arithmetic Library"
# The C++ wrapper used to live here, which the old comment justified as "the
# Fedora model" — Fedora in fact splits it as gmp-c++, and the reason is the
# dependency rather than tidiness: libgmpxx links libstdc++, so bundling it put
# libstdc++ in the install closure of EVERYTHING that uses libgmp. gcc's cc1
# links libgmp, as will nettle/gnutls; none of them touch the C++ API.

[dependencies]
glibc = ">= 2.43"

[files]
# License texts. gmp is dual-licensed and ships four: COPYING (the statement of
# which licence applies to what), COPYINGv2 + COPYINGv3 (GPL) and
# COPYING.LESSERv3 (LGPL). Ship the set — under "LGPLv3+ or GPLv2+" the choice
# is the recipient's, so they need all of it to make one.
"@source:COPYING*" = "usr/share/licenses/gmp/"
# SONAME symlink + real object. The dev .so symlink is gmp-devel's, the static
# .a is gmp-static's.
":usr/lib/x86_64-linux-peios/libgmp.so.10*" = "usr/lib/x86_64-linux-peios"
