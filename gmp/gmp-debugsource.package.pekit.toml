# gmp-debugsource — the gmp sources referenced by the debug info, under
# /usr/src/debug/gmp, so gdb/debuginfod can show source lines. Pairs with
# gmp-debuginfo (source without symbols is useless).

[package]
description = "GNU Multiple Precision Arithmetic Library - debug sources"

[dependencies]
gmp-debuginfo = "{{version}}"

[files]
":usr/src/debug/**" = "usr/src/debug"
