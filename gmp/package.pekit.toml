# Base metadata shared by the gmp sub-packages (gmp, gmp-devel, gmp-static, and
# the gmp-debuginfo/-debugsource pair).

format = "peipkg"

[package]
version      = "{{version}}-1"
architecture = "x86_64"
# gmp 6.x is dual-licensed: GNU LGPL v3 or GNU GPL v2 (consumer's choice).
license      = "LGPL-3.0-or-later OR GPL-2.0-or-later"
homepage     = "https://gmplib.org/"
