[package]
name        = "org.samba.rsync-debuginfo"
description = "rsync - debugging symbols"

[dependencies]
"org.samba.rsync" = "= {{release}}"

[files]
"@source:COPYING"      = "usr/share/licenses/org.samba.rsync-debuginfo/"
"@source:popt/COPYING" = "usr/share/licenses/org.samba.rsync-debuginfo/popt-COPYING"
":usr/lib/debug/**"    = "usr/lib/debug"
