# rsync — content synchronization over local paths and SSH (PEI-1186).
# Native archive preservation and daemon identity integration are deferred.

tags = ["bootstrap"]
out_dir = "out"

[source]
patches = "patches"

[source.url]
url         = "https://download.samba.org/pub/rsync/src/rsync-{{version}}.tar.gz"
listing_url = "https://download.samba.org/pub/rsync/src/"
file_regex  = 'rsync-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz'
extract     = true
root        = "rsync-{{version}}"
# Soft maintenance floor. Follow every newer authenticated stable release;
# incompatible protocol or command changes stop at the staged transfer gates.
versions    = ">= 3.5.0"

# Samba's release archive supplies detached signatures. Pin the complete
# primary fingerprint published for Andrew Tridgell rather than accepting any
# signing subkey merely present in the vendored key material.
[source.url.signature]
url          = "{{source_url}}.asc"
of           = "artifact"
key_files    = ["keys/andrew-tridgell.asc"]
fingerprints = ["9FEF112DCE19A0DC7E882CB81BB24997A8535F6F"]

[build.main]
command = '''
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
BUILD="$PEKIT_OUT/build"
PREFIX="$PEKIT_OUT/usr"
RSYNC="$PREFIX/bin/rsync"
mkdir -p "$BUILD"
cd "$BUILD"

# Bundled popt is the only popt implementation currently in the catalogue.
# Use the system compression and cryptography libraries, retain generic xattrs,
# and deliberately omit POSIX ACLs: Peios uses KACS DACLs instead. IDN host
# names (3.5.1+) stay off until libidn2 is packaged. __FILE__ is mapped with
# the same prefix split-debug gives DWARF.
CPPFLAGS="${CPPFLAGS:-} -DENABLE_PEIOS" LIBS="${LIBS:-} -lpeios" \
CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.samba.rsync" \
CXXFLAGS="${CXXFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.samba.rsync" \
LDFLAGS="$LDFLAGS -Wl,-z,ibtplt" \
  "$SRC/configure" \
    --prefix=/usr \
    --bindir=/usr/bin \
    --mandir=/usr/share/man \
    --with-included-popt \
    --with-included-zlib=no \
    --with-rrsync \
    --enable-roll-simd \
    --disable-lz4 \
    --disable-acl-support \
    --disable-idn \
    --disable-md2man

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr/share/man" -type f -exec gzip -n -9 {} +

# Installed interpreters are platform contracts, not PATH-dependent host
# choices. The upstream scripts remain otherwise byte-for-byte release code.
sed -i '1s|^#!/usr/bin/env bash$|#!/bin/bash|' "$PREFIX/bin/rsync-ssl"
sed -i '1s|^#!/usr/bin/env python3$|#!/bin/python3|' "$PREFIX/bin/rrsync"

# This covers rsync's C and rolling-checksum C++ compilation units.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.samba.rsync "$RSYNC"
'''

[test]
needs = ["main"]
gate = true
command = '''
set -eu
SRC="$(pwd)"
STAGE="$PEKIT_MAIN_OUT"
BUILD="$STAGE/build"
PREFIX="$STAGE/usr"
RSYNC="$PREFIX/bin/rsync"
SMOKE="$PEKIT_OUT/smoke"
VERSION_OUT="$PEKIT_OUT/rsync-version"

# Linux-worker upstream coverage uses the portable branch. Installed native
# behavior is separately mandatory in the Peios VM qualification fixture.
BUILD="$PEKIT_OUT/portable-tests"
mkdir -p "$BUILD"
cd "$BUILD"
"$SRC/configure" --prefix=/usr --with-included-popt --with-included-zlib=no \
  --with-rrsync --enable-roll-simd --disable-lz4 --disable-acl-support \
  --disable-idn --disable-md2man
make -j"$(nproc)"
PORTABLE_RSYNC="$BUILD/rsync"

# The worker has a single UID/GID mapping. Exclude only cases whose concrete
# identity or trusted procfs-owner prerequisite is unavailable; all other
# security assertions remain mandatory. Short scratch paths avoid upstream's
# documented 256-byte batch filename limit.
RSYNC_EXCLUDE=$(python3 "$PEKIT_RECIPE_ROOT/tools/test-prerequisites.py")
export scratchbase=/tmp/rsync-tests
mkdir -p "$scratchbase"
RSYNC_EXCLUDE="$RSYNC_EXCLUDE" RSYNC_UNSHARED=1 make -C "$BUILD" -j"$(nproc)" check

test "$(head -n 1 "$PREFIX/bin/rsync-ssl")" = '#!/bin/bash'
test "$(head -n 1 "$PREFIX/bin/rrsync")" = '#!/bin/python3'
for define in HAVE_OPENAT2 HAVE_XXHASH_H HAVE_ZSTD_H SUPPORT_XATTRS USE_OPENSSL USE_ROLL_SIMD; do
  grep -Eq "^#define $define 1$" "$BUILD/config.h"
done
if grep -Eq '^#define (HAVE_LZ4_H|SUPPORT_ACLS|SUPPORT_IDN) 1$' "$BUILD/config.h"; then exit 1; fi

"$RSYNC" --version > "$VERSION_OUT"
grep -F "rsync  version $PEKIT_VERSION" "$VERSION_OUT"
for feature in '64-bit files' hardlinks IPv6 xattrs iconv SIMD-roll openssl-crypto; do
  grep -F "$feature" "$VERSION_OUT"
done
if grep -Eq 'no (xattrs|iconv|SIMD-roll|openssl-crypto)' "$VERSION_OUT"; then exit 1; fi
grep -F 'xxh128' "$VERSION_OUT"
grep -F 'zstd' "$VERSION_OUT"
if grep -F 'lz4' "$VERSION_OUT"; then exit 1; fi

mkdir -p "$SMOKE/src/sub" "$SMOKE/dst"
printf '%s\n' 'Peios rsync smoke' > "$SMOKE/src/sub/payload"
ln "$SMOKE/src/sub/payload" "$SMOKE/src/hardlink"
ln -s sub/payload "$SMOKE/src/symlink"
touch -t 202601020304.05 "$SMOKE/src/sub/payload"
/usr/bin/python3 - "$SMOKE/src/sub/payload" <<'PY'
import os
import sys
os.setxattr(sys.argv[1], b'user.peios-rsync-test', b'preserved')
PY
"$PORTABLE_RSYNC" -aHX "$SMOKE/src/" "$SMOKE/dst/"
cmp "$SMOKE/src/sub/payload" "$SMOKE/dst/sub/payload"
test "$(readlink "$SMOKE/dst/symlink")" = sub/payload
test "$(stat -c %i "$SMOKE/dst/sub/payload")" = "$(stat -c %i "$SMOKE/dst/hardlink")"
test "$(stat -c %Y "$SMOKE/src/sub/payload")" = "$(stat -c %Y "$SMOKE/dst/sub/payload")"
/usr/bin/python3 - "$SMOKE/dst/sub/payload" <<'PY'
import os
import sys
assert os.getxattr(sys.argv[1], b'user.peios-rsync-test') == b'preserved'
PY

DEBUG=$(find "$PREFIX/lib/debug/.build-id" -type f -name '*.debug')
test "$(printf '%s\n' "$DEBUG" | grep -c .)" -eq 1
test -n "$(find "$PREFIX/src/debug/org.samba.rsync" -type f -print -quit)"
readelf -S "$DEBUG" 2>/dev/null | grep -F '.debug_info'
readelf -h "$RSYNC" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l "$RSYNC" | grep -E 'GNU_STACK.*RW '
readelf -W -l "$RSYNC" | grep -F 'GNU_RELRO'
readelf -d "$RSYNC" | grep -F 'BIND_NOW'
readelf -d "$RSYNC" | grep -F 'RELR'
readelf -n "$RSYNC" | grep -E 'x86 feature:.*IBT.*SHSTK'
# Validate the actual linked cryptography ABI selected by the declared SDK.
# This accepts OpenSSL's supported major ABI rather than freezing an old SONAME.
crypto_major=$(printf '#include <openssl/opensslv.h>\nOPENSSL_VERSION_MAJOR\n' | cc -E -P -x c - | tail -n 1)
case "$crypto_major" in 3|4) ;; *) echo "Unreviewed OpenSSL ABI: $crypto_major" >&2; exit 1;; esac
for soname in libc.so.6 "libcrypto.so.$crypto_major" libxxhash.so.0 libzstd.so.1 libz.so.1; do
  readelf -d "$RSYNC" | grep -F "Shared library: [$soname]"
done
if readelf -d "$RSYNC" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
ROOT=$(dirname "$(dirname "$STAGE")")
if strings "$RSYNC" | grep -F "$ROOT"; then exit 1; fi
'''

[test.dependencies.peipkg]
"org.openssl.openssl-devel" = "*"
"com.xxhash.xxhash-devel" = "*"
"com.facebook.zstd-devel" = "*"
"io.github.zlib-ng.zlib-ng-compat-devel" = "*"
"dev.peios.build-essentials-c++" = "*"
"org.gnu.bash"                   = "*"
"org.python.python3"             = "*"

[build.main.dependencies.peipkg]
"dev.peios.libpeios-devel" = ">= 0.5.4-1"
"org.gnu.gzip" = "*"
"dev.peios.build-essentials-c++"      = "*"
"org.sourceware.debugedit"                   = "*"
"org.gnu.bash"              = "*"
"org.openssl.openssl-devel" = "*"
"org.python.python3"        = "*"
"com.xxhash.xxhash-devel"              = "*"
"com.facebook.zstd-devel"                = "*"
"io.github.zlib-ng.zlib-ng-compat-devel"                = "*"
