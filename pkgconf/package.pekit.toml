format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "pkgconf"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "pkgconf - pkg-config compiler/linker flag resolver"
license      = "ISC"
homepage     = "https://gitea.treehouse.systems/ariadne/pkgconf"

# The compatibility name: configure scripts and recipes may ask for either.
[provides]
pkg-config = "{{version}}"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING"    = "usr/share/licenses/pkgconf/"
":usr/bin/**"        = "usr/bin"
":usr/share/aclocal/**" = "usr/share/aclocal"
":usr/share/man/**"  = "usr/share/man"
