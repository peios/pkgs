format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
# The crate closure cbindgen links; build.main's collect-rust-licences
# --check holds this to what those crates declare.
license       = "((MIT OR Apache-2.0) AND Unicode-3.0) AND (Apache-2.0 OR BSL-1.0) AND (Apache-2.0 OR MIT) AND (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT) AND MIT AND (MIT OR Unlicense) AND MPL-2.0"
license_class = "free"
homepage      = "https://github.com/mozilla/cbindgen"
