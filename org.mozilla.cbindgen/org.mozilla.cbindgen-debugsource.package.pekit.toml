[package]
name         = "org.mozilla.cbindgen-debugsource"
architecture = "noarch"
description  = "cbindgen debug sources"

[dependencies]
"org.mozilla.cbindgen-debuginfo" = "= {{release}}"

[files]
"@source:LICENSE"         = "usr/share/licenses/org.mozilla.cbindgen-debugsource/LICENSE"
":licenses/**"            = "usr/share/licenses/org.mozilla.cbindgen-debugsource/third-party"
":usr/src/debug/**"       = "usr/src/debug"
