[package]
name        = "org.mozilla.cbindgen-debuginfo"
description = "cbindgen debugging symbols"

[dependencies]
"org.mozilla.cbindgen" = "= {{release}}"

[files]
"@source:LICENSE"       = "usr/share/licenses/org.mozilla.cbindgen-debuginfo/LICENSE"
":licenses/**"          = "usr/share/licenses/org.mozilla.cbindgen-debuginfo/third-party"
":usr/lib/debug/**"     = "usr/lib/debug"
