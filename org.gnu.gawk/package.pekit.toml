# Metadata shared by the GNU Gawk package family. The expression covers the
# interpreter, manuals, extensions, vendored support code and generated
# corresponding source.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "GPL-3.0-or-later AND GFDL-1.3-or-later AND LGPL-2.1-or-later AND BSD-3-Clause AND (GPL-2.0-or-later WITH Autoconf-exception-generic) AND (GPL-3.0-or-later WITH Autoconf-exception-generic-3.0) AND (GPL-3.0-or-later WITH Texinfo-exception) AND FSFAP AND FSFUL AND FSFULLR AND X11 AND LicenseRef-Public-Domain"
license_class = "free"
homepage      = "https://www.gnu.org/software/gawk/"
