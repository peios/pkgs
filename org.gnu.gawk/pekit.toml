# GNU Gawk — GNU's awk implementation and extension runtime.
#
# Loadable modules live under the architecture-qualified Peios library root.
# The debugger (gawk -D) edits its commands and keeps history through GNU
# Readline (PEI-613), which is therefore in the minimal-bootstrap seed too.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source.url]
url         = "https://ftp.gnu.org/gnu/gawk/gawk-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/gawk/"
extract     = true
root        = "gawk-{{version}}"
file_regex  = 'gawk-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Follow every authenticated stable release
# automatically; language and extension compatibility is tested below.
versions    = ">= 5.4.1"

# Gawk releases are signed by the maintainer. Pin Arnold Robbins's exact
# primary fingerprint from Savannah's official Gawk project keyring.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/arnold-robbins.asc"]
fingerprints = ["D1967C63788713177D861ED7DF597815937EC0D2"]

[build.main]
command = """
set -eu
# Keep the upstream directory-inode test inside a single mount. At a source
# bind-mount boundary readdir("..") and stat("..") name different inodes.
cp -a . "$PEKIT_OUT/source"
SRC="$PEKIT_OUT/source"
cd "$PEKIT_OUT"

CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$PEKIT_OUT=/usr/src/debug/org.gnu.gawk -fmacro-prefix-map=$SRC=/usr/src/debug/org.gnu.gawk/source" \
"$SRC/configure" \
  --prefix=/usr \
  --bindir=/usr/bin \
  --libdir=/usr/lib/x86_64-linux-peios \
  --mandir=/usr/share/man \
  --disable-nls \
  --enable-extensions \
  --disable-pma \
  --with-mpfr=/usr \
  --with-readline=/usr
# configure drops Readline silently when its probe fails; insist on it.
grep -Fx '#define HAVE_LIBREADLINE 1' config.h

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
# Drop the gawkbug reporter and its manual (as bash drops bashbug): it mails
# reports through sendmail, which Peios doesn't ship.
rm -f "$PEKIT_OUT/usr/bin/gawkbug" "$PEKIT_OUT/usr/share/man/man1/gawkbug.1"
find "$PEKIT_OUT/usr/share/man" -type f ! -name '*.gz' \
  -exec gzip -n -9 -- {} +
ln -sf gawk.1.gz "$PEKIT_OUT/usr/share/man/man1/awk.1.gz"
ln -sf gawk.1.gz \
  "$PEKIT_OUT/usr/share/man/man1/gawk-$PEKIT_VERSION.1.gz"

# Peios has no Info reader. Avoid libtool archives.
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc" \
       "$PEKIT_OUT/usr/etc"
find "$PEKIT_OUT/usr/lib/x86_64-linux-peios" -name '*.la' -delete

# Produce conventional build-ID debuginfo and exact DWARF-referenced source
# for the interpreter, its helpers and every installed extension module.
test -n "$(find "$PEKIT_OUT/usr/lib/x86_64-linux-peios/gawk" -type f -name '*.so' -print -quit)"
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.gawk \
  "$PEKIT_OUT/usr/bin/gawk" "$PEKIT_OUT/usr/libexec/awk" \
  "$PEKIT_OUT/usr/lib/x86_64-linux-peios/gawk"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.glibc-bin"          = ">= 2.43"
"org.gnu.glibc-langpack-el"  = ">= 2.43"
"org.gnu.glibc-langpack-en"  = ">= 2.43"
"org.gnu.glibc-langpack-fr"  = ">= 2.43"
"org.gnu.glibc-langpack-ja"  = ">= 2.43"
"org.gnu.glibc-langpack-ru"  = ">= 2.43"
"org.gnu.mpfr-devel"         = ">= 4.2.2"
"org.gnu.readline-devel"     = ">= 8.3"
"org.sourceware.debugedit"   = "*"
"org.gnu.gzip"               = "*"

[build.main.dependencies.apt]
build-essential = "*"
debugedit       = "*"
dwz             = "*"
locales-all     = "*"
libmpfr-dev     = "*"
libreadline-dev = "*"
gzip            = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# Run the complete native regression suite before accepting an upstream
# release. This covers the language, locale handling, MPFR mode, persistent
# arrays, debugger and loadable extensions. PMA is intentionally disabled:
# its process-wide ASLR manipulation is outside Peios's process contract.
# Pekit's test namespace has no usable network, so accept only the probe that
# exercises precisely that unavailable facility.
cd "$PEKIT_MAIN_OUT"
if ! PAGER=cat make -j"$(nproc)" check; then
  actual=$(find test -maxdepth 1 -type f -name '_*' -printf '%f\n' \
    | LC_ALL=C sort)
  expected=$(printf '%s\n' _nonfatal3)
  [ "$actual" = "$expected" ]
  test "$(wc -l < test/_nonfatal3)" -eq 2
  grep -Fqx '1' test/_nonfatal3
  grep -Eq '^gawk: nonfatal3\.awk:4: warning: remote host and port information \(localhost, 0\) invalid: (System error|Temporary failure in name resolution)$' test/_nonfatal3
fi
GAWK="$PEKIT_MAIN_OUT/usr/bin/gawk"
STAGE="$PEKIT_MAIN_OUT"
LIBDIR="$STAGE/usr/lib/x86_64-linux-peios/gawk"
SMOKE="$PEKIT_OUT/gawk-smoke"
mkdir -p "$SMOKE"
test -x "$GAWK"
test ! -e "$STAGE/usr/bin/gawkbug"
test ! -e "$STAGE/usr/share/man/man1/gawkbug.1.gz"
test "$(readlink "$STAGE/usr/bin/awk")" = gawk
test "$STAGE/usr/bin/gawk-$PEKIT_VERSION" -ef "$GAWK"
test -f "$STAGE/usr/include/gawkapi.h"
test -f "$LIBDIR/ordchr.so"
printf '%s\n' 'alpha 2' 'beta 3' > "$SMOKE/input"
"$GAWK" '{ total += $2 } END { print total }' "$SMOKE/input" > "$SMOKE/basic.out"
test "$(cat "$SMOKE/basic.out")" = 5
test "$("$GAWK" -M 'BEGIN { print 2^128 }')" = 340282366920938463463374607431768211456
AWKPATH="$STAGE/usr/share/awk" \
  "$GAWK" '@include "assert.awk"; BEGIN { assert(1, "staged awk library") }'
AWKLIBPATH="$LIBDIR" "$GAWK" -l ordchr 'BEGIN { print ord("A") }' > "$SMOKE/extension.out"
test "$(cat "$SMOKE/extension.out")" = 65
"$STAGE/usr/libexec/awk/pwcat" | "$GAWK" -F: 'NF && NF != 7 { exit 1 }'
"$STAGE/usr/libexec/awk/grcat" | "$GAWK" -F: 'NF && NF != 4 { exit 1 }'
"$GAWK" --version | head -2 | grep -F "$PEKIT_VERSION"
"$GAWK" --version | grep -F 'GNU MPFR'
"$GAWK" --version | grep -F 'GNU MP'

# The debugger through a terminal: Readline history recall (Up-arrow) must
# re-run the previous command.
cc -O2 -o "$SMOKE/pty-drive" "$PEKIT_WORKSPACE_ROOT/_pkgtools_/pty-drive.c"
printf '%s\n' 'BEGIN { x = 1 }' > "$SMOKE/prog.awk"
cat > "$SMOKE/session" <<'EOF'
expect gawk> 
send eval "print 6*7"\r
expect 42
expect gawk> 
send \e[A\r
expect 42
expect gawk> 
send quit\r
EOF
TERM=xterm "$SMOKE/pty-drive" "$SMOKE/session" -- "$GAWK" -D -f "$SMOKE/prog.awk" \
  > "$SMOKE/debugger.out"
# Results follow Readline's bracketed-paste escapes on the same line.
test "$(tr -d '\r' < "$SMOKE/debugger.out" | grep -c '42$')" -eq 2
readelf -d "$GAWK" | grep -F 'Shared library: [libreadline.so.8]'

find "$LIBDIR" -type f -name '*.so' | LC_ALL=C sort > "$SMOKE/extensions"
test -s "$SMOKE/extensions"
printf '%s\n' "$GAWK" "$STAGE/usr/libexec/awk/grcat" "$STAGE/usr/libexec/awk/pwcat" \
  | cat - "$SMOKE/extensions" > "$SMOKE/elfs"
while IFS= read -r elf; do
  readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  if readelf -d "$elf" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done < "$SMOKE/elfs"
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.glibc-bin" = ">= 2.43"
"org.gnu.glibc-langpack-el" = ">= 2.43"
"org.gnu.glibc-langpack-en" = ">= 2.43"
"org.gnu.glibc-langpack-fr" = ">= 2.43"
"org.gnu.glibc-langpack-ja" = ">= 2.43"
"org.gnu.glibc-langpack-ru" = ">= 2.43"
"org.gnu.mpfr-devel" = ">= 4.2.2"
"org.gnu.readline-devel" = ">= 8.3"
"org.git.kernel.dash" = "*"

[test.dependencies.apt]
build-essential = "*"
debugedit = "*"
locales-all = "*"
libmpfr-dev = "*"
libreadline-dev = "*"
patchelf = "*"
dash = "*"
