[package]
name        = "org.gnu.gawk"
description = "GNU pattern scanning and processing language"

[provides]
awk  = "{{version}}"

[dependencies]
"org.gnu.glibc"                 = ">= 2.43"
"org.gnu.gmp"                   = ">= 6.3.0"
"org.gnu.mpfr"                  = ">= 4.2.2"
"org.git.kernel.dash"                  = "*"
"org.gnu.gawk-common" = "{{version}}-1"

[files]
"@source:COPYING"                         = "usr/share/licenses/org.gnu.gawk/"
":usr/bin/gawk"                           = "usr/bin/gawk"
":usr/bin/gawk-*"                         = "usr/bin"
":usr/bin/awk"                            = "usr/bin/awk"
":usr/bin/gawkbug"                        = "usr/bin/gawkbug"
":usr/lib/x86_64-linux-peios/gawk/**"     = "usr/lib/x86_64-linux-peios/gawk"
":usr/libexec/awk/**"                     = "usr/libexec/awk"
