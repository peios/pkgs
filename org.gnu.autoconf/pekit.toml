# GNU Autoconf — configure-script generator; usbip's in-tree autogen.sh
# runs it (PEI-158 Tier 2, wave 3).
#
# Autotools from the release tarball, out-of-source via DESTDIR (the m4
# shape). Pure Perl + M4 scripts at runtime — both declared. The release
# archive, rather than the Git tag, is intentional: it contains the generated
# configure and Makefile.in files needed to bootstrap Autoconf without an
# existing Autotools stack.

tags = ["bootstrap"]
out_dir = "out"

[source.url]
url         = "https://ftpmirror.gnu.org/autoconf/autoconf-{{version}}.tar.xz"
listing_url = "https://ftpmirror.gnu.org/autoconf/"
extract  = true
root     = "autoconf-{{version}}"
# Soft maintenance floor: automatic sweeps follow every newer stable GNU
# release; older history is intentionally outside this recipe.
versions = ">= 2.72"

# GNU publishes a detached signature beside every stable release. Pinning the
# maintainer key closes the trust-on-first-use gap when an unattended sweep
# discovers a version that is not in pekit.lock yet.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/zack-weinberg.asc"]
fingerprints = ["82F854F3CE73174B8B63174091FCC32B6769AA64"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
# configure writes the Perl it found under /usr/bin into each Perl program;
# name Perl through the runtime view instead.
for script in autoconf autoheader autom4te autoreconf autoscan autoupdate ifnames; do
  sed -i '1s|^#! */usr/bin/perl$|#!/bin/perl|' "$PEKIT_OUT/usr/bin/$script"
  test "$(head -n 1 "$PEKIT_OUT/usr/bin/$script")" = '#!/bin/perl'
done
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -n -9 {} \\;
# Peios does not currently ship an Info reader; the manual remains available
# online and in the corresponding-source package.
rm -rf "$PEKIT_OUT/usr/share/info"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.bash"           = "*"
"org.gnu.m4"                       = ">= 1.4.16"
"org.perl.perl"                     = ">= 5.6"
"org.gnu.gzip"                      = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# The staged tools need their staged Perl and M4 data, before installation.
export autom4te_perllibdir="$PEKIT_MAIN_OUT/usr/share/autoconf"
case "$("$PEKIT_MAIN_OUT/usr/bin/autoconf" --version)" in *"$PEKIT_VERSION"*) ;; *) exit 1;; esac
for script in autoconf autoheader autom4te autoreconf autoscan autoupdate ifnames; do
  test "$(head -n 1 "$PEKIT_MAIN_OUT/usr/bin/$script")" = '#!/bin/perl'
done

unset autom4te_perllibdir
# Run the upstream release suite from the explicit package gate.
PEKIT_OUT="$PEKIT_MAIN_OUT"
cd "$PEKIT_OUT"
# The release tarball is already bootstrapped, so the core suite has no
# dependency cycle through Automake or Libtool. Their integration cases (and
# Gettext's autopoint cases) skip cleanly when those optional tools are absent.
# Autotest supports independent test groups; bound concurrency to avoid
# multiplying compiler memory use on large build hosts.
jobs=$(nproc)
if [ "$jobs" -gt 8 ]; then jobs=8; fi
make check TESTSUITEFLAGS="-j$jobs"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.bash"           = "*"
"org.gnu.m4"                       = ">= 1.4.16"
"org.perl.perl"                     = ">= 5.6"
