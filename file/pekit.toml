# file — the file-type identifier + libmagic; libtool probes toolchain
# outputs with it (the 2a reason it's in the seed).
#
# Phase-2a tool (PEI-155): autotools from the release tarball, out-of-source
# via DESTDIR (the m4 shape). All compressed-file inspection backends
# (zlib/bzip2/xz/lzip/zstd) and the seccomp sandbox are disabled — none of
# those libs are declared, keeping libmagic's deps at glibc alone; revisit
# if compressed-magic inspection is ever wanted.

out_dir = "out"

[source.url]
url      = "https://astron.com/pub/file/file-{{version}}.tar.gz"
extract  = true
root     = "file-{{version}}"
versions = ">= 5.48"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --libdir=/usr/lib/x86_64-linux-peios \
  --disable-zlib --disable-bzlib --disable-xzlib --disable-lzlib \
  --disable-zstdlib --disable-libseccomp
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -f "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libmagic.la"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
