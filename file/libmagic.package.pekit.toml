# libmagic — the type-detection library + the compiled magic database it
# reads at runtime.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "libmagic"
description = "file - libmagic type-detection library and magic database"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING" = "usr/share/licenses/libmagic/"
":usr/lib/x86_64-linux-peios/libmagic.so.1*" = "usr/lib/x86_64-linux-peios"
":usr/share/misc/**"     = "usr/share/misc"
":usr/share/man/man4/**" = "usr/share/man/man4"
