# Base metadata shared by the kernel-headers package.

format = "peipkg"

[package]
version      = "{{version}}-1"
architecture = "x86_64"
# The Linux kernel UAPI headers are released under the GPL-2.0 WITH the
# Linux-syscall-note exception, which is what makes them usable by non-GPL
# userspace (the whole point of the sanitized headers_install output).
license      = "GPL-2.0-only WITH Linux-syscall-note"
homepage     = "https://www.kernel.org/"
