# kernel-headers — the Linux UAPI headers under /usr/include/{linux,asm,
# asm-generic,mtd,...}. arch=x86_64: the asm/ subtree is x86-specific (it is
# the kernel's per-arch UAPI), so this is NOT a noarch package even though it
# ships only headers. Disjoint from glibc-devel, which owns the libc headers
# (stdio.h, bits/, ...) and never ships linux/ or asm/ — so the two coexist
# under /usr/include with no overlap.
#
# No runtime dependencies: headers reference no shared objects.

[package]
description = "Linux kernel headers for userspace (UAPI)"

[files]
":usr/include/**" = "usr/include"
