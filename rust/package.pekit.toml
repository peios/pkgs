format = "peipkg"

[package]
name         = "rust"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "Rust - rustc, cargo, rustfmt and the rust-src component"
license      = "Apache-2.0 OR MIT"
homepage     = "https://www.rust-lang.org/"

[dependencies]
glibc       = ">= 2.43"
"libstdc++" = ">= 16"
# rustc links the shared libLLVM from our llvm package; cargo links
# system libssl.
llvm        = ">= 18.1.8, < 19"
libssl      = ">= 3.5"
# Functional, not DT_NEEDED: rustc drives the system linker through cc.
gcc         = ">= 16"

[files]
"@source:COPYRIGHT"      = "usr/share/licenses/rust/"
"@source:LICENSE-APACHE" = "usr/share/licenses/rust/"
"@source:LICENSE-MIT"    = "usr/share/licenses/rust/"
":usr/bin/**"            = "usr/bin"
":usr/lib/x86_64-linux-peios/*.so" = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/rustlib/**" = "usr/lib/x86_64-linux-peios/rustlib"
":usr/share/man/**"      = "usr/share/man"
