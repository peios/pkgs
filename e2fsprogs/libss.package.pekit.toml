# libss — runtime shared library from the e2fsprogs source tree.

[package]
description = "Subsystem command-parsing runtime library (libss)"
license     = "MIT"

[dependencies]
glibc = ">= 2.43"

[files]
# Versioned runtime lib + soname symlink; the unversioned dev .so is -devel's,
# the static .a is -static's.
":usr/lib/x86_64-linux-peios/libss.so.*" = "usr/lib/x86_64-linux-peios"
