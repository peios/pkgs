# e2fsprogs-debugsource — the e2fsprogs sources referenced by the debug info,
# under /usr/src/debug/e2fsprogs, so gdb/debuginfod can show source lines. Pairs
# with e2fsprogs-debuginfo (symbols without source are half-blind).

[package]
description = "Ext2/3/4 filesystem utilities - debug sources"

[dependencies]
e2fsprogs-debuginfo = "{{version}}"

[files]
":usr/src/debug/**" = "usr/src/debug"
