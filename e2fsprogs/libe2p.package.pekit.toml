# libe2p — runtime shared library from the e2fsprogs source tree.

[package]
description = "Ext2 attribute manipulation runtime library (libe2p)"
license     = "LGPL-2.0-or-later"

[dependencies]
glibc = ">= 2.43"

[files]
# Versioned runtime lib + soname symlink; the unversioned dev .so is -devel's,
# the static .a is -static's.
":usr/lib/x86_64-linux-peios/libe2p.so.*" = "usr/lib/x86_64-linux-peios"
