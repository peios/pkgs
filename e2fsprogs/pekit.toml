# e2fsprogs — the ext2/3/4 filesystem userspace (mke2fs/mkfs.ext*, e2fsck/
# fsck.ext*, tune2fs, resize2fs, dumpe2fs, debugfs) plus the libcom_err/libss/
# libe2p/libext2fs support libraries.
#
# Peios PACKAGES e2fsprogs upstream rather than reimplementing it in peiosutils:
# mkfs.* write a Linux-compatible on-disk format Peios deliberately mirrors —
# they sit BELOW the security seam (mount is the seam, not mkfs). See the
# mkfs-e2fsprogs-packaging design note. What Peios needs on top of stock
# e2fsprogs is a small maintained patchset (SDs-are-xattrs), carried pkm-style:
#
#   * -E root_sd=<blob>  : stamp an explicit Security Descriptor on the root
#                          inode (+ lost+found) at format time — the OS rootfs
#                          gets a deterministic SD, not a synthesised one.
#   * -d reinherit       : SD-aware tree population — compute each node's SD via
#                          libpeios peios_sd_reinherit() during the populate walk
#                          (pure userspace; no live kernel/KACS needed).
#
# Patch dev follows pkm/: build the `source` target to materialise the patched
# (today: pristine) tree, read it, write diffs into patches/ + series.
#
#   nix develop ./_flake#e2fsprogs -c pekit build --version 1.47.2

out_dir = "out"

# Single source of truth for the upstream e2fsprogs version. build.upstream
# clones this exact tag; patches/ are generated against it, so a bump means
# re-rebasing the series (apply-patches.sh fails loudly if a patch no longer
# applies — re-run with E2FSPROGS_PATCH_3WAY=1 to surface conflicts as .rej).
[env]
E2FSPROGS_VERSION = "v1.47.2"

# --- upstream: pristine clone of the pinned tag over HTTPS ------------------
[build.upstream]
command = """
git clone --depth 1 --branch "$E2FSPROGS_VERSION" \
	https://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git \
	"$PEKIT_OUT"
"""

[build.upstream.dependencies.peipkg]
git = "*"
ca-certificates = "*"

[build.upstream.dependencies.apt]
git = "*"
ca-certificates = "*"

# --- source: pristine tree + Peios patch series, .git stripped --------------
[build.source]
needs = ["upstream"]
command = """
PATCHES="$(pwd)/patches"
cp -aT "$PEKIT_UPSTREAM_OUT" "$PEKIT_OUT"
./apply-patches.sh "$PEKIT_OUT" "$PATCHES"
# .git is only needed for `git apply` above; strip it so the staged source is a
# plain tree (e2fsprogs' version.h carries the literal version, no git needed).
rm -rf "$PEKIT_OUT/.git"
"""

[build.source.dependencies.peipkg]
git = "*"
patch = "*"

[build.source.dependencies.apt]
git = "*"
patch = "*"

# --- main: out-of-source configure/make/install -----------------------------
# Minimal scaffold build: prove the pinned tree compiles in the pekit env
# before any patch lands, so a future build break is unambiguously the patch.
# Deliberately conservative for now:
#   --enable-elf-shlibs : build the shared support libraries.
#   bundled libblkid/libuuid left ON (default) so this builds standalone with
#       just gcc+make. De-duplicating against util-linux-lib's libblkid (ship
#       one, --disable-libblkid here) is a packaging-phase refinement, tracked
#       with the multi-package fan-out — not needed to materialise/smoke source.
# The debug-split pipeline + per-library .package.pekit.toml fan-out land once
# the patchset is in; they are orthogonal to patch development.
[build.main]
needs = ["source"]
command = """
# libpeios (for the Peios patches) comes from the vendored deps/ tree — the
# build bridge until the root self-hosts libpeios-devel + kernel-headers. Inject
# its headers (<peios/*.h> + the <pkm/*.h> they include) and lib via CC so every
# compile/link sees them; the mke2fs link line's bare -lpeios then resolves. No
# rpath: the shipped mke2fs carries DT_NEEDED libpeios.so.0, resolved from the
# system path once installed (run in-tree with LD_LIBRARY_PATH=deps/lib).
DEPS="$(pwd)/deps"
[ -d "$DEPS/lib" ] && [ -d "$DEPS/include/peios" ] || {
  echo "deps/ is not vendored — run ./deps/refresh.sh (or LIBPEIOS=.. PKM=.. ./deps/refresh.sh)" >&2
  exit 1
}

SRC="$PEKIT_SOURCE_OUT"
cd "$PEKIT_OUT"

"$SRC/configure" CC="gcc -g -I$DEPS/include -L$DEPS/lib" \
  --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios \
  --sysconfdir=/etc \
  --enable-elf-shlibs --disable-nls
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
make install-libs DESTDIR="$PEKIT_OUT"

# Drop libtool archives (hardcoded paths + overlink; DT_NEEDED supersedes).
find "$PEKIT_OUT/usr" -name '*.la' -delete

# Debug split (same shape as util-linux-lib/gmp/glibc): debugedit scrubs the
# build path (-> /usr/src/debug/e2fsprogs) and records referenced sources;
# split debug info build-id-indexed under usr/lib/debug/.build-id; strip the
# shipped ELF; stage the referenced sources. The .c sources live in
# $PEKIT_SOURCE_OUT (the compiler saw absolute paths to it).
SRCROOT="$PEKIT_SOURCE_OUT"
cd "$PEKIT_OUT"
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  patchelf --remove-rpath "$f" 2>/dev/null || true
  debugedit -b "$SRCROOT" -d /usr/src/debug/e2fsprogs -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$SRCROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/e2fsprogs/$(dirname "$rel")"
  cp "$SRCROOT/$rel" "usr/src/debug/e2fsprogs/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""

[build.main.dependencies.peipkg]
gcc = "*"
make = "*"
pkg-config = "*"
# Debug split: debugedit scrubs build paths + lists sources, patchelf drops
# rpaths (strip/objcopy/readelf come with the binutils toolchain).
debugedit = "*"
patchelf = "*"
# NOTE: the Peios patches link libpeios (peios_sddl_parse_sd / peios_sd_reinherit),
# but libpeios isn't a resolvable peipkg dep yet (unpublished, no release tags) —
# it's supplied by the vendored deps/ tree (see deps/README.md). When libpeios
# publishes, drop deps/ and add: libpeios = "*"; libpeios-devel = "*" (the
# cc-wrapper then injects -I/-L, same as gmp→mpfr).

[build.main.dependencies.apt]
build-essential = "*"
pkg-config = "*"
debugedit = "*"
patchelf = "*"
