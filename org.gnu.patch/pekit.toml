# GNU Patch — strict unified/context diff application for source builds.

tags = ["bootstrap"]
out_dir = "out"

# The installed command is GPL-3.0-or-later; the corresponding source also
# carries bundled Gnulib, the manual and generated build helpers.
[source_package]
license = "GPL-3.0-or-later AND LGPL-2.1-or-later AND GFDL-1.3-or-later AND FSFAP AND FSFULLR"

[source.url]
url         = "https://ftpmirror.gnu.org/patch/patch-{{version}}.tar.xz"
listing_url = "https://ftpmirror.gnu.org/patch/"
extract     = true
root        = "patch-{{version}}"
file_regex  = 'patch-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor: follow authenticated stable releases automatically.
versions    = ">= 2.8"

# GNU Patch releases are signed by maintainer Andreas Gruenbacher. The pinned
# full primary fingerprint matches his entry in GNU's official keyring
# (https://ftp.gnu.org/gnu/gnu-keyring.gpg); the committed key is his current
# export of that primary, with its renewed expiry. Unattended discovery must
# authenticate every newly selected release against it.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/andreas-gruenbacher.asc"]
fingerprints = ["259B3792B3D6D319212CC4DCD5BF9FEB0313653A"]

[build.main]
command = '''
set -eu
SRC="$(pwd)"
cd "$PEKIT_OUT"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
CFLAGS="$CFLAGS -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.patch" \
LDFLAGS="$LDFLAGS -Wl,-z,ibtplt" \
"$SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --localedir=/usr/share/locale \
  --disable-silent-rules
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"
gzip -9n "$PEKIT_OUT/usr/share/man/man1/patch.1"

sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.patch "$PEKIT_OUT/usr"
'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.sourceware.debugedit"     = "*"
"org.gnu.gettext"              = "*"
"org.gnu.gzip"                 = "*"
"org.perl.perl"                = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
BIN="$STAGE/usr/bin/patch"
SMOKE="$PEKIT_OUT/smoke"
cd "$STAGE"

# Upstream's complete regression suite covers normal/context/unified diffs,
# rejects, timestamps, backups, path traversal protections and malformed input.
make check

mkdir -p "$SMOKE/tree"
printf '%s\n' alpha beta gamma > "$SMOKE/tree/input"
printf '%s\n' alpha changed gamma > "$SMOKE/expected"
diff -u --label input --label input \
  "$SMOKE/tree/input" "$SMOKE/expected" > "$SMOKE/change.patch" || :
"$BIN" --directory "$SMOKE/tree" --strip=0 --batch --forward \
  --fuzz=0 --input "$SMOKE/change.patch"
cmp "$SMOKE/tree/input" "$SMOKE/expected"
if "$BIN" --directory "$SMOKE/tree" --strip=0 --batch --forward \
  --fuzz=0 --input "$SMOKE/change.patch"; then
  exit 1
fi

"$BIN" --version | head -1 | grep -F "$PEKIT_VERSION"
readelf -h "$BIN" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l "$BIN" | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l "$BIN" | grep -F 'GNU_RELRO'
readelf -d "$BIN" | grep -F 'BIND_NOW'
readelf -d "$BIN" | grep -F 'RELR'
readelf -n "$BIN" | grep -E 'x86 feature:.*IBT.*SHSTK'
if readelf -d "$BIN" | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test -n "$(find "$STAGE/usr/src/debug/org.gnu.patch" -type f -print -quit)"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.diffutils"    = "*"
"org.gnu.findutils"    = "*"
"org.gnu.grep"         = "*"
"org.gnu.gawk"         = "*"
"org.gnu.sed"          = "*"
"org.gnu.make"         = "*"
"org.gnu.binutils"     = "*"
