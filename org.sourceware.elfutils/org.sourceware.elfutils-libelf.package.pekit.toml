[package]
name        = "org.sourceware.elfutils-libelf"
description = "elfutils - ELF object access runtime library"
license     = "GPL-2.0-or-later OR LGPL-3.0-or-later"

[dependencies]
glibc = ">= 2.43"
zlib  = ">= 2.3.3"

[files]
"@source:COPYING-GPLV2"  = "usr/share/licenses/org.sourceware.elfutils-libelf/"
"@source:COPYING-LGPLV3" = "usr/share/licenses/org.sourceware.elfutils-libelf/"
":usr/lib/x86_64-linux-peios/libelf-*.so" = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libelf.so.1" = "usr/lib/x86_64-linux-peios/libelf.so.1"
