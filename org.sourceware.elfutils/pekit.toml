# elfutils — libelf/libdw/libasm plus the eu-* ELF and DWARF tools.
#
# This is the core, offline-capable elfutils family. debuginfod remains a
# separate future package because its client and server introduce the network,
# HTTP, archive and database stack; the ELF/DWARF libraries themselves retain
# every recommended compression format. A bounded unstrip output-name repair
# fixes offline archives of a single executable.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source]
patches = "patches"

[source.url]
url         = "https://sourceware.org/elfutils/ftp/{{version}}/elfutils-{{version}}.tar.bz2"
listing_url = "https://sourceware.org/elfutils/ftp/"
extract     = true
root        = "elfutils-{{version}}"
file_regex  = '(?P<version>[0-9]+\.[0-9]+)/'
# Soft maintenance floor: follow authenticated stable releases automatically.
versions    = ">= 0.196"

[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/aaron-merey.asc"]
fingerprints = ["6C2B631563B8D330578D3CB474FD3FA2779E7073"]

[build.main]
command = """
set -eu
SRC="$PEKIT_SOURCE_ROOT"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.sourceware.elfutils"
export CXXFLAGS="${CXXFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.sourceware.elfutils"
export LDFLAGS="${LDFLAGS:?} -Wl,-z,ibtplt"
cd "$PEKIT_OUT"

"$SRC/configure" \
  --prefix=/usr \
  --bindir=/usr/bin \
  --libdir=/usr/lib/x86_64-linux-peios \
  --mandir=/usr/share/man \
  --program-prefix=eu- \
  --with-bzlib \
  --with-lzma \
  --with-zstd \
  --enable-deterministic-archives \
  --enable-demangler \
  --enable-textrelcheck \
  --enable-symbol-versioning \
  --disable-debuginfod \
  --disable-libdebuginfod \
  --disable-stackprof \
  --disable-nls

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"

# The disabled debuginfod and stackprof components still install reference
# pages. Do not advertise commands, an ABI or services that are not shipped.
rm -f \
  "$PEKIT_OUT/usr/share/man/man1/debuginfod-find.1" \
  "$PEKIT_OUT/usr/share/man/man1/eu-stackprof.1" \
  "$PEKIT_OUT/usr/share/man/man3/debuginfod_"*.3 \
  "$PEKIT_OUT/usr/share/man/man7/debuginfod-client-config.7" \
  "$PEKIT_OUT/usr/share/man/man8/debuginfod.8" \
  "$PEKIT_OUT/usr/share/man/man8/debuginfod.service.8"
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/etc"
find "$PEKIT_OUT/usr" -name '*.la' -delete

sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.sourceware.elfutils "$PEKIT_OUT/usr"

python3 "$PEKIT_RECIPE_ROOT/tools/install-manpages.py" "$PEKIT_OUT" "$PEKIT_VERSION" "$PEKIT_OUT/usr/share/man/man1"

# Deterministic manuals, including relative alias targets.
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' | while IFS= read -r page; do
  gzip -9n "$page"
done
find "$PEKIT_OUT/usr/share/man" -type l -name '*.[1-9]' | while IFS= read -r page; do
  target=$(readlink "$page")
  ln -s "$target.gz" "$page.gz"
  rm "$page"
done

"""

[test]
needs = ["main"]
gate = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
export LD_LIBRARY_PATH="$LIBDIR"
BINDIR="$STAGE/usr/bin"
SMOKE="$PEKIT_OUT/smoke"
# Keep upstream test fixtures inside the target's writable scratch space.
export TMPDIR="$PEKIT_OUT/tmp"
mkdir -p "$TMPDIR"

# Assert the configured production feature set, then run the complete upstream
# suite with ownership-neutral fixture extraction.
for define in USE_ZLIB USE_BZLIB USE_LZMA USE_ZSTD USE_ZSTD_COMPRESS USE_DEMANGLE; do
  grep -Fx "#define $define 1" "$STAGE/config.h"
done
grep -Fx '#define DEFAULT_AR_DETERMINISTIC true' "$STAGE/config.h"
TAR_OPTIONS=--no-same-owner make -C "$STAGE" -j"$(nproc)" check

mkdir -p "$SMOKE"
cat > "$SMOKE/probe.c" <<'EOF'
#include <fcntl.h>
#include <unistd.h>
#include <gelf.h>
#include <elfutils/libdw.h>
int main(int argc, char **argv) {
  GElf_Ehdr ehdr;
  if (argc != 2 || elf_version(EV_CURRENT) == EV_NONE) return 1;
  int fd = open(argv[1], O_RDONLY);
  if (fd < 0) return 2;
  Elf *elf = elf_begin(fd, ELF_C_READ, 0);
  if (!elf || elf_kind(elf) != ELF_K_ELF || !gelf_getehdr(elf, &ehdr)) return 3;
  elf_end(elf);
  Dwarf *dw = dwarf_begin(fd, DWARF_C_READ);
  if (!dw) return 4;
  dwarf_end(dw);
  close(fd);
  return ehdr.e_machine == EM_X86_64 ? 0 : 5;
}
EOF
cc $CFLAGS -I"$STAGE/usr/include" -L"$LIBDIR" \
  -Wl,-rpath-link,"$LIBDIR" $LDFLAGS \
  -o "$SMOKE/probe" "$SMOKE/probe.c" -ldw -lelf
LD_LIBRARY_PATH="$LIBDIR" "$SMOKE/probe" "$SMOKE/probe"
LD_LIBRARY_PATH="$LIBDIR" "$BINDIR/eu-readelf" -h "$SMOKE/probe" | grep -F 'ELF64'
LD_LIBRARY_PATH="$LIBDIR" "$BINDIR/eu-nm" "$SMOKE/probe" | grep -E '^main[[:space:]]'
LD_LIBRARY_PATH="$LIBDIR" "$BINDIR/eu-elflint" --gnu-ld "$SMOKE/probe"

# The archive helper's shell tools are runtime dependencies, and its actual
# offline archive construction must work with the staged ELF tools.
LD_LIBRARY_PATH="$LIBDIR" UNSTRIP="$BINDIR/eu-unstrip" AR="$BINDIR/eu-ar" \
  "$BINDIR/eu-make-debug-archive" "$SMOKE/debug.a" -e "$SMOKE/probe"
"$BINDIR/eu-ar" t "$SMOKE/debug.a" | grep -F probe
for lib in elf dw asm; do
  test "$(readlink "$LIBDIR/lib$lib.so.1")" = "lib$lib-$PEKIT_VERSION.so"
  readelf -d "$LIBDIR/lib$lib-$PEKIT_VERSION.so" | grep -F "Library soname: [lib$lib.so.1]"
done
python3 "$PEKIT_RECIPE_ROOT/tools/install-manpages.py" "$STAGE" "$PEKIT_VERSION" "$PEKIT_OUT/manuals"
for page in "$PEKIT_OUT/manuals/"*.gz; do
  cmp "$page" "$STAGE/usr/share/man/man1/$(basename "$page")"
done


find "$STAGE/usr" -type f ! -type l -not -path "$STAGE/usr/lib/debug/*" -not -path "$STAGE/usr/src/debug/*" | while IFS= read -r f; do
  case "$f" in *.a) continue;; esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  readelf -W -l "$f" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$f" | grep -F 'BIND_NOW'
  if readelf -d "$f" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done
test -n "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' -print -quit)"
test -n "$(find "$STAGE/usr/src/debug/org.sourceware.elfutils" -type f -print -quit)"
'''

