side_effects = ["man-db"]

[package]
name        = "org.kernel.pahole"
description = "DWARF and BTF inspection and encoding tools"

[provides]

[dependencies]
"org.gnu.glibc"                            = ">= 2.43"
"org.kernel.libdwarves"         = "{{version}}-1"
"org.sourceware.elfutils-libs"  = ">= 0.196"
"org.gnu.bash"                  = "*"
"dev.peios.peiosutils"             = "*"
"org.gnu.diffutils"             = "*"
"org.gnu.grep"                  = "*"
"org.gnu.sed"                              = "*"
"org.gnu.gcc"                              = "*"
"org.llvm.llvm"                             = "*"

[files]
"@source:COPYING"                     = "usr/share/licenses/org.kernel.pahole/"
"@source:lib/bpf/LICENSE"              = "usr/share/licenses/org.kernel.pahole/libbpf/"
"@source:lib/bpf/LICENSE.BSD-2-Clause" = "usr/share/licenses/org.kernel.pahole/libbpf/"
"@source:lib/bpf/LICENSE.LGPL-2.1"      = "usr/share/licenses/org.kernel.pahole/libbpf/"
"@source:NEWS"                        = "usr/share/doc/org.kernel.pahole/"
"@source:README"                      = "usr/share/doc/org.kernel.pahole/"
"@source:README.btf"                  = "usr/share/doc/org.kernel.pahole/"
"@source:README.ctracer"              = "usr/share/doc/org.kernel.pahole/"
":usr/bin/**"                         = "usr/bin"
":usr/share/dwarves/**"               = "usr/share/dwarves"
":usr/share/man/**"                   = "usr/share/man"
