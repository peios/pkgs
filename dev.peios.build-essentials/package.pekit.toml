# Shared defaults for every member of the build-essentials policy family.

format = "peipkg"

[package]
version      = "1.0.0-1"
# The packages contain only architecture-neutral documentation and licence
# text. Their dependencies are resolved for the target machine, which selects
# that architecture's toolchain, so the metas themselves are noarch.
architecture = "noarch"
license      = "MIT"
license_class = "free"
homepage     = "https://github.com/peios/pkgs"
