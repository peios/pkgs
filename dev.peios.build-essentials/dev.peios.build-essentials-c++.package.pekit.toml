# C++ floor: the C contract plus the rolling C++ frontend and standard-library
# development surface. Both come from the same GCC source package family.

[package]
name        = "dev.peios.build-essentials-c++"
description = "Peios C++ build environment"

[dependencies]
"dev.peios.build-essentials-c"      = "1.0.0-9"
"org.gnu.gcc-c++"                   = ">= 16"
"org.gnu.gcc-libstdc++-devel"       = ">= 16"

[files]
"@recipe:docs/build-essentials-c++.txt" = "usr/share/doc/dev.peios.build-essentials-c++/README"
"@recipe:docs/LICENSE" = "usr/share/licenses/dev.peios.build-essentials-c++/LICENSE"
