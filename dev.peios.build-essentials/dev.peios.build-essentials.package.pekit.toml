# Ambient userland floor. No compiler: language toolchains belong to the
# stacked -c, -c++, and -rust packages.

[package]
name        = "dev.peios.build-essentials"
description = "Peios baseline build environment"

[provides]
build-essentials = "1.0.0-7"

[replaces]
build-essentials = "<= 1.0.0-6"

[dependencies]
"org.git.kernel.dash" = ">= 0.5.13.5"
"dev.peios.peiosutils" = ">= 0.8.5-1"
"org.gnu.diffutils"   = ">= 3.12"
"org.gnu.findutils"   = ">= 4.11.0"
"org.gnu.gawk"        = ">= 5.4.1"
"org.gnu.grep"        = ">= 3.12"
"org.gnu.make"        = ">= 4.4.1"
"org.gnu.sed"         = ">= 4.10"

[files]
"@recipe:docs/build-essentials.txt" = "usr/share/doc/dev.peios.build-essentials/README"
"@recipe:docs/LICENSE" = "usr/share/licenses/dev.peios.build-essentials/LICENSE"
