# zstd-devel — headers, the libzstd.so link, and pkg-config metadata for
# building against libzstd.

[package]
name        = "zstd-devel"
description = "Zstandard - libzstd headers and link library"

[dependencies]
libzstd = "{{version}}"

[files]
":usr/include/**"                          = "usr/include"
":usr/lib/x86_64-linux-peios/libzstd.so"   = "usr/lib/x86_64-linux-peios/libzstd.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**" = "usr/lib/x86_64-linux-peios/pkgconfig"
