# libzstd — the Zstandard runtime library, on its own so library consumers
# (kmod's module decompression, future elfutils zstd support) need not pull
# the tools.

[package]
name        = "libzstd"
description = "Zstandard - runtime compression library"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:LICENSE" = "usr/share/licenses/libzstd/"
":usr/lib/x86_64-linux-peios/libzstd.so.1*" = "usr/lib/x86_64-linux-peios"
