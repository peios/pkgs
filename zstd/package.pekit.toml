# Shared defaults layer for the zstd members (a bare package.pekit.toml is
# never a package once named members exist).

format = "peipkg"

[package]
version      = "{{version}}-1"
architecture = "x86_64"
license      = "BSD-3-Clause OR GPL-2.0-only"
homepage     = "https://facebook.github.io/zstd/"
