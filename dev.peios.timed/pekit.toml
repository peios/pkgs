# Timed owns its build, package split, tests, hardening gates, and source/debug
# artifacts in the public source tree. This catalogue entry follows immutable
# production releases while retaining the local checkout for pre-release
# qualification.

out_dir = "out"
delegate = true

[source.git]
url       = "https://github.com/peios/timed.git"
ref       = "v{{version}}"
# Soft production floor: earlier artifacts either predate the qualified package
# family or require an unavailable native Git bootstrap package.
versions  = ">= 0.1.3"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[source.local]
path = "../../timed"
