format = "peipkg"

[package]
name         = "m4"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU M4 - the traditional Unix macro processor"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/m4/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING*" = "usr/share/licenses/m4/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
