side_effects = ["man-db"]

[package]
name        = "org.gnu.gperf"
description = "GNU perfect hash function generator"

[provides]

[dependencies]
"org.gnu.glibc"       = ">= 2.43"
"org.gnu.gcc-libstdc++" = ">= 16"

[files]
"@source:COPYING"  = "usr/share/licenses/org.gnu.gperf/COPYING"
":usr/bin/gperf"    = "usr/bin/gperf"
":usr/share/man/**" = "usr/share/man"
