# GNU gperf — a perfect-hash-function generator.

tags = ["bootstrap"]
out_dir = "out"

[source.url]
url         = "https://ftpmirror.gnu.org/gperf/gperf-{{version}}.tar.gz"
listing_url = "https://ftpmirror.gnu.org/gperf/"
extract     = true
root        = "gperf-{{version}}"
file_regex  = 'gperf-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.gz'
# Soft maintenance floor. Follow every newer authenticated stable release;
# incompatible output changes stop at the generated-code tests.
versions    = ">= 3.3"

# GNU gperf 3.3 is signed by maintainer Bruno Haible. Pin the complete primary
# fingerprint from the release announcement so discovery remains authenticated.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/bruno-haible.asc"]
fingerprints = ["E0FFBD975397F77A32AB76ECB6301D9E1BBEAC08"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CXXFLAGS="$CXXFLAGS -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.gperf"
cd "$PEKIT_OUT"

"$SRC/configure" \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
gzip -n -9 "$PEKIT_OUT/usr/share/man/man1/gperf.1"

# Peios currently has no Info reader. The complete manuals remain in the
# corresponding-source package; installed users receive the command man page.
rm -rf "$PEKIT_OUT/usr/share/doc" "$PEKIT_OUT/usr/share/info"

# Emit build-ID debuginfo plus the exact source files named by the binary's
# DWARF records.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.gperf "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"org.gnu.gzip" = "*"
"org.sourceware.debugedit" = "*"
"dev.peios.build-essentials-c++" = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
gzip -t "$STAGE/usr/share/man/man1/gperf.1.gz"
BIN="$STAGE/usr/bin/gperf"
SMOKE="$PEKIT_OUT/smoke"

make -C "$STAGE" -j"$(nproc)" check

# Generate, compile, and execute a representative lookup table, covering both
# a successful lookup and a miss independently of the upstream suite.
mkdir -p "$SMOKE"
cat > "$SMOKE/keywords.gperf" <<'EOF'
%{
#include <stddef.h>
#include <string.h>
%}
struct keyword { const char *name; int value; };
%language=C
%readonly-tables
%struct-type
%define lookup-function-name keyword_lookup
%%
alpha, 1
beta, 2
EOF
"$BIN" "$SMOKE/keywords.gperf" > "$SMOKE/keywords.c"
cat >> "$SMOKE/keywords.c" <<'EOF'
int main (void)
{
  const struct keyword *hit = keyword_lookup ("beta", 4);
  return !(hit != NULL && hit->value == 2
           && keyword_lookup ("gamma", 5) == NULL);
}
EOF
cc -O2 "$SMOKE/keywords.c" -o "$SMOKE/lookup"
"$SMOKE/lookup"
"$BIN" --version | head -1 | grep -F "$PEKIT_VERSION"

readelf -h "$BIN" | grep -E 'Type:[[:space:]]+DYN'
readelf -W -l "$BIN" | grep 'GNU_STACK' | grep -F 'RW '
readelf -d "$BIN" | grep -F 'BIND_NOW'
readelf -d "$BIN" | grep -F 'RELR'
if readelf -d "$BIN" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test -n "$(find "$STAGE/usr/src/debug/org.gnu.gperf" -type f -print -quit)"
'''

[test.dependencies.peipkg]
"org.gnu.gzip" = "*"
"dev.peios.build-essentials-c++" = "*"
"org.gnu.binutils"               = "*"
"org.gnu.findutils"              = "*"
"org.gnu.grep"                   = "*"
