# Metadata shared by the libffi package family. Each package is defined in its
# own *.package.pekit.toml; this file is only a base layer. The aggregate
# licence covers the complete corresponding-source archive, including its
# Autotools/Libtool machinery, the DejaGnu drivers, texinfo.tex, msvcc.sh and
# the GPL bhaible tests (LICENSE-BUILDTOOLS). Payload packages narrow it to
# the MIT library plus the CC0 dlmalloc allocator compiled into closures.c.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "MIT AND CC0-1.0 AND GPL-2.0-or-later AND GPL-3.0-or-later AND (MPL-1.1 OR GPL-2.0-or-later OR LGPL-2.1-or-later) AND (GPL-2.0-or-later WITH Autoconf-exception-generic) AND (GPL-2.0-or-later WITH Libtool-exception) AND (GPL-3.0-or-later WITH Autoconf-exception-generic-3.0) AND (GPL-3.0-or-later WITH Autoconf-exception-macro) AND (GPL-3.0-or-later WITH Texinfo-exception) AND FSFAP AND FSFUL AND FSFULLR AND X11"
license_class = "free"
homepage      = "https://sourceware.org/libffi/"
