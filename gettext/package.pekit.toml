format = "peipkg"

# Seed-minimal: the message-catalog toolbox (msgfmt for the glibc closure
# rebuild, xgettext + msg* for completeness) and the private runtime libs
# the tools link. Deliberately NOT shipped: autopoint/gettextize
# (translator-project scaffolding with tar/gzip runtime deps),
# libgettextpo + all dev links/archives, preloadable_libintl (glibc has
# libintl built in — no libintl package on Peios), the aclocal macros and
# share/gettext tree. A gettext-devel member can add those when something
# needs them.
excludes = [
  ":usr/bin/autopoint",
  ":usr/bin/gettextize",
]

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "gettext"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU gettext - message catalog tools (msgfmt, msgmerge, xgettext)"
license      = "GPL-3.0-or-later AND LGPL-2.1-or-later"
homepage     = "https://www.gnu.org/software/gettext/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING" = "usr/share/licenses/gettext/"
":usr/bin/**"     = "usr/bin"
# The private versioned runtime libs the tools link (no unversioned dev
# links, no static archives).
":usr/lib/x86_64-linux-peios/libgettextlib-{{version}}.so" = "usr/lib/x86_64-linux-peios/libgettextlib-{{version}}.so"
":usr/lib/x86_64-linux-peios/libgettextsrc-{{version}}.so" = "usr/lib/x86_64-linux-peios/libgettextsrc-{{version}}.so"
":usr/lib/x86_64-linux-peios/libtextstyle.so.0*"           = "usr/lib/x86_64-linux-peios"
# xgettext's ITS extraction rules — runtime data, not docs.
":usr/share/gettext-{{version}}/its/**" = "usr/share/gettext-{{version}}/its"
":usr/share/man/man1/**" = "usr/share/man/man1"
