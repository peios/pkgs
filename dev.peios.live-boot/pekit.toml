# dev.peios.live-boot — live-medium boot support (kernel cmdline fragment + the
# root-mount script used during early boot).
#
# BUILDLESS package: nothing is compiled or fetched. The payload is the
# files shipped in this recipe's own src/ dir, mapped literally by
# package.pekit.toml. There is no [build] and no [source] — outDir is kept
# only because packaging writes the .peipkg under it.

out_dir = "out"

[test]
command = "tests/test-mount-root.sh"

[test.dependencies.peipkg]
"org.git.kernel.dash" = ">= 0.5.13.5"
"org.gnu.coreutils"    = ">= 9.11"

[test.dependencies.apt]
dash      = "*"
coreutils = "*"
