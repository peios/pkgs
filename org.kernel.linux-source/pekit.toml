# Authenticated pristine Linux source used as the immutable base for PKM.
# This is deliberately version-pinned: the Peios kernel patch series is
# derived against one exact upstream release and must be rebased deliberately.

out_dir = "out"

# The payload is itself the complete corresponding source archive, so emitting
# a second automatic source package would duplicate the same upstream bytes.
[source_package]
enabled = false

[source.url]
url         = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-{{version}}.tar.xz"
listing_url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/"
extract     = false
file_regex  = 'linux-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
versions    = "= 7.0.9"

# kernel.org signs the uncompressed tar stream. All official kernel tarball
# releases since 4.18 use Greg Kroah-Hartman's release key.
[source.url.signature]
url          = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-{{version}}.tar.sign"
of           = "decompressed"
key_files    = ["keys/greg-kroah-hartman.asc"]
fingerprints = ["647F28654894E3BD457199BE38DBBDC86092693E"]

[build.main]
command = '''
set -eu
ARCHIVE="$(pwd)/linux-$PEKIT_VERSION.tar.xz"
DEST="$PEKIT_OUT/usr/src/dist/linux-$PEKIT_VERSION.tar.xz"
LICENSE="$PEKIT_OUT/usr/share/licenses/org.kernel.linux-source/COPYING"
mkdir -p "$(dirname "$DEST")" "$(dirname "$LICENSE")"
cp "$ARCHIVE" "$DEST"
tar -xOf "$ARCHIVE" "linux-$PEKIT_VERSION/COPYING" > "$LICENSE"
'''

[build.main.dependencies.peipkg]
"org.git.kernel.dash"  = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.tar"          = "*"
"org.tukaani.xz"       = "*"

[build.main.dependencies.apt]
coreutils = "*"
tar       = "*"
xz-utils  = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
ARCHIVE="$PEKIT_MAIN_OUT/usr/src/dist/linux-$PEKIT_VERSION.tar.xz"
LIST="$PEKIT_OUT/members"
test -s "$ARCHIVE"
tar -tf "$ARCHIVE" > "$LIST"
grep -Fx "linux-$PEKIT_VERSION/Makefile" "$LIST"
grep -Fx "linux-$PEKIT_VERSION/COPYING" "$LIST"
grep -Fx "linux-$PEKIT_VERSION/security/security.c" "$LIST"
grep -Fx "linux-$PEKIT_VERSION/include/linux/kernel.h" "$LIST"
if grep -Eq '(^/|(^|/)\.\.(/|$))' "$LIST"; then
  echo "linux-source: archive contains an unsafe member path" >&2
  exit 1
fi
tar -xOf "$ARCHIVE" "linux-$PEKIT_VERSION/COPYING" > "$PEKIT_OUT/COPYING"
cmp "$PEKIT_MAIN_OUT/usr/share/licenses/org.kernel.linux-source/COPYING" \
  "$PEKIT_OUT/COPYING"
'''

[test.dependencies.peipkg]
"org.git.kernel.dash"  = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.diffutils"    = "*"
"org.gnu.grep"         = "*"
"org.gnu.tar"          = "*"
"org.tukaani.xz"       = "*"

[test.dependencies.apt]
coreutils = "*"
diffutils = "*"
grep      = "*"
tar       = "*"
xz-utils  = "*"
