[package]
name        = "org.kernel.linux-source"
description = "Authenticated pristine Linux kernel source archive"
# The payload is the whole tree: COPYING's GPL-2.0 WITH Linux-syscall-note,
# plus every other term a file may carry on its own (LICENSES/preferred and
# LICENSES/deprecated). LICENSES/dual terms only ever appear as an OR choice
# beside a GPL option, so they add nothing here. All texts ship below.
license     = "GPL-2.0-only WITH Linux-syscall-note AND GPL-2.0-only AND GPL-2.0-or-later AND LGPL-2.0-or-later AND LGPL-2.1-only AND LGPL-2.1-or-later AND BSD-2-Clause AND BSD-3-Clause AND BSD-3-Clause-Clear AND MIT AND GPL-1.0-or-later AND ISC AND 0BSD AND Zlib AND X11 AND CC0-1.0 AND Linux-OpenIB AND GFDL-1.1-no-invariants-or-later AND GFDL-1.2-no-invariants-or-later"

[files]
":usr/share/licenses/org.kernel.linux-source/COPYING"     = "usr/share/licenses/org.kernel.linux-source/COPYING"
":usr/share/licenses/org.kernel.linux-source/LICENSES/**" = "usr/share/licenses/org.kernel.linux-source/LICENSES"
":usr/src/dist/linux-{{version}}.tar.xz"                   = "usr/src/dist/linux-{{version}}.tar.xz"
