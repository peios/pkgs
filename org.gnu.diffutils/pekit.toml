# GNU Diffutils — diff, cmp, diff3 and sdiff.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source.url]
url         = "https://ftp.gnu.org/gnu/diffutils/diffutils-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/diffutils/"
extract     = true
root        = "diffutils-{{version}}"
file_regex = 'diffutils-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Follow every signed stable release automatically;
# command-output compatibility is enforced by the staged test below.
versions   = ">= 3.11"

# GNU Diffutils releases are signed by maintainer Jim Meyering. The complete
# primary-key fingerprint from the 3.12 release announcement is pinned so a
# newly discovered version must authenticate before pekit will lock it.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/jim-meyering.asc"]
fingerprints = ["155D3FC500C834486D1EEA677FD9FCCB000BEEEE"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
cd "$PEKIT_OUT"

"$SRC/configure" \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --disable-nls

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"

find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -n -9 {} \\;

# Peios currently has no Info reader. The source package retains the complete
# Texinfo documentation; installed users receive the command manual pages.
rm -rf "$PEKIT_OUT/usr/share/info"

# Produce conventional debuginfo and debugsource payloads.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.diffutils "$PEKIT_OUT/usr/bin"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.perl.perl"               = "*"
"org.gnu.gzip"                = "*"

[build.main.dependencies.apt]
build-essential = "*"
debugedit       = "*"
gzip            = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
cd "$PEKIT_MAIN_OUT"
make -j"$(nproc)" check
BIN="$PEKIT_MAIN_OUT/usr/bin"
SMOKE="$PEKIT_OUT/diffutils-test"
mkdir -p "$SMOKE/left/sub" "$SMOKE/right/sub"
printf '%s\n' alpha beta > "$SMOKE/left/file"
printf '%s\n' alpha gamma > "$SMOKE/right/file"
printf '%s\n' same > "$SMOKE/left/sub/same"
cp "$SMOKE/left/sub/same" "$SMOKE/right/sub/same"
"$BIN/cmp" -s "$SMOKE/left/file" "$SMOKE/left/file"
status=0; "$BIN/cmp" -s "$SMOKE/left/file" "$SMOKE/right/file" || status=$?
[ "$status" -eq 1 ]
status=0; "$BIN/diff" -u "$SMOKE/left/file" "$SMOKE/right/file" > "$SMOKE/unified" || status=$?
[ "$status" -eq 1 ]
grep -F -- '-beta' "$SMOKE/unified"
grep -F -- '+gamma' "$SMOKE/unified"
status=0; "$BIN/diff" -r "$SMOKE/left" "$SMOKE/right" > "$SMOKE/recursive" || status=$?
[ "$status" -eq 1 ]
grep -F file "$SMOKE/recursive"
printf '%s\n' base > "$SMOKE/base"
printf '%s\n' ours > "$SMOKE/ours"
printf '%s\n' theirs > "$SMOKE/theirs"
status=0; "$BIN/diff3" -m "$SMOKE/ours" "$SMOKE/base" "$SMOKE/theirs" > "$SMOKE/merged" || status=$?
[ "$status" -eq 1 ]
grep -F '<<<<<<<' "$SMOKE/merged"
grep -F '>>>>>>>' "$SMOKE/merged"
status=0; "$BIN/sdiff" --suppress-common-lines "$SMOKE/left/file" "$SMOKE/right/file" > "$SMOKE/side" || status=$?
[ "$status" -eq 1 ]
grep -F '|' "$SMOKE/side"
for elf in "$BIN/cmp" "$BIN/diff" "$BIN/diff3" "$BIN/sdiff"; do
  "$elf" --version | head -1 | grep -F "$PEKIT_VERSION"
  readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  if readelf -d "$elf" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils" = "*"
"org.perl.perl" = "*"

[test.dependencies.apt]
build-essential = "*"
coreutils = "*"
dash = "*"
perl = "*"
