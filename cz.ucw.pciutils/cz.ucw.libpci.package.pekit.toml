# libpci's public ABI. Its fast-moving database is packaged independently.

[package]
name        = "cz.ucw.libpci"
description = "pciutils - PCI access runtime library"

[dependencies]
"org.gnu.glibc"                                      = ">= 2.43"
"cz.ucw.pciids"                                      = "*"
"io.github.eudev-project.eudev-libudev" = ">= 3.2.14"
"io.github.zlib-ng.zlib-ng-compat"                                       = ">= 2.3.3"

[files]
"@source:COPYING"                            = "usr/share/licenses/cz.ucw.libpci/"
":usr/lib/x86_64-linux-peios/libpci.so.3*" = "usr/lib/x86_64-linux-peios"
