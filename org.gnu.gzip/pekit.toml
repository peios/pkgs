# GNU gzip — DEFLATE compression plus its non-interactive shell utilities.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source.url]
url         = "https://ftpmirror.gnu.org/gzip/gzip-{{version}}.tar.xz"
listing_url = "https://ftpmirror.gnu.org/gzip/"
extract     = true
root        = "gzip-{{version}}"
file_regex  = 'gzip-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Follow every newer authenticated stable release;
# incompatible changes stop at the command and archive tests.
versions    = ">= 1.14"

# GNU gzip releases are signed by maintainer Jim Meyering. Pin the complete
# primary-key fingerprint so every discovered release must authenticate before
# pekit can lock it.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/jim-meyering.asc"]
fingerprints = ["155D3FC500C834486D1EEA677FD9FCCB000BEEEE"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.gzip"
cd "$PEKIT_OUT"

# The Makefile substitutes $(SHELL) for every /bin/sh in the installed scripts
# (including gzexe's generated header), so pin the runtime-view shell.
CONFIG_SHELL=/bin/sh SHELL=/bin/sh "$SRC/configure" \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"

# Peios has no Info reader. zless and zmore are also intentionally omitted
# until the package set has a pager provider; shipping them now would leave
# installed commands with an unsatisfied runtime contract.
rm -rf "$PEKIT_OUT/usr/share/info"
rm -f \
  "$PEKIT_OUT/usr/bin/zless" \
  "$PEKIT_OUT/usr/bin/zmore" \
  "$PEKIT_OUT/usr/share/man/man1/zless.1" \
  "$PEKIT_OUT/usr/share/man/man1/zmore.1"

# Ship deterministic compressed manuals and explicit alias pages for the
# compatibility commands whose upstream executables share another command's
# implementation and documentation.
MAN1="$PEKIT_OUT/usr/share/man/man1"
"$PEKIT_OUT/usr/bin/gzip" -9n "$MAN1"/*.1
ln -s gzip.1.gz "$MAN1/uncompress.1.gz"
ln -s zgrep.1.gz "$MAN1/zegrep.1.gz"
ln -s zgrep.1.gz "$MAN1/zfgrep.1.gz"

# Emit build-ID debuginfo plus the exact source files referenced by the
# binary's DWARF.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.gzip "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.perl.perl"               = "*"

[build.main.dependencies.apt]
build-essential = "*"
debugedit       = "*"
dwz             = "*"
perl            = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
BIN="$STAGE/usr/bin"
ELF="$BIN/gzip"
SMOKE="$PEKIT_OUT/smoke"
cd "$STAGE"

# Upstream's help/version sweep exercises the uninstalled zmore script.  Peios
# intentionally does not ship zmore until it has a pager package, but the
# script itself must still pass upstream's test.  Supply a test-only pager
# with the standard non-interactive `more FILE...` contract.
mkdir -p "$SMOKE/test-bin"
printf '%s\n' '#!/bin/sh' 'exec cat "$@"' > "$SMOKE/test-bin/more"
chmod 0755 "$SMOKE/test-bin/more"
export PATH="$SMOKE/test-bin:$BIN:$PATH"

make -j"$(nproc)" check
# Every installed script names the runtime-view shell. Keep this list
# explicit so a newly added upstream command cannot silently escape review.
for script in gunzip gzexe zcat zcmp zdiff zegrep zfgrep zforce zgrep znew uncompress; do
  test "$(sed -n '1p' "$BIN/$script")" = '#!/bin/sh'
done

mkdir -p "$SMOKE"
printf '%s\n' alpha beta 'literal[1]' > "$SMOKE/plain"
"$BIN/gzip" -c "$SMOKE/plain" > "$SMOKE/plain.gz"
"$BIN/gzip" -t "$SMOKE/plain.gz"
"$BIN/gzip" -cd "$SMOKE/plain.gz" > "$SMOKE/gzip.out"
cmp "$SMOKE/plain" "$SMOKE/gzip.out"

head -c -1 "$SMOKE/plain.gz" > "$SMOKE/truncated.gz"
status=0
"$BIN/gzip" -t "$SMOKE/truncated.gz" 2>/dev/null || status=$?
[ "$status" -ne 0 ]
printf '%s\n' first > "$SMOKE/first"
printf '%s\n' second > "$SMOKE/second"
"$BIN/gzip" -c "$SMOKE/first" > "$SMOKE/first.gz"
"$BIN/gzip" -c "$SMOKE/second" > "$SMOKE/second.gz"
cat "$SMOKE/first.gz" "$SMOKE/second.gz" > "$SMOKE/combined.gz"
cat "$SMOKE/first" "$SMOKE/second" > "$SMOKE/combined.expected"
"$BIN/gzip" -cd "$SMOKE/combined.gz" > "$SMOKE/combined.out"
cmp "$SMOKE/combined.expected" "$SMOKE/combined.out"

"$BIN/zcat" "$SMOKE/plain.gz" > "$SMOKE/zcat.out"
cmp "$SMOKE/plain" "$SMOKE/zcat.out"
"$BIN/uncompress" -c "$SMOKE/plain.gz" > "$SMOKE/uncompress.out"
cmp "$SMOKE/plain" "$SMOKE/uncompress.out"
cp "$SMOKE/plain.gz" "$SMOKE/gunzip.gz"
"$BIN/gunzip" "$SMOKE/gunzip.gz"
cmp "$SMOKE/plain" "$SMOKE/gunzip"
"$BIN/zgrep" -q '^beta$' "$SMOKE/plain.gz"
"$BIN/zegrep" -q '^(alpha|beta)$' "$SMOKE/plain.gz"
"$BIN/zfgrep" -q 'literal[1]' "$SMOKE/plain.gz"
"$BIN/zcmp" "$SMOKE/plain.gz" "$SMOKE/plain.gz"
printf '%s\n' alpha gamma > "$SMOKE/other"
"$BIN/gzip" -c "$SMOKE/other" > "$SMOKE/other.gz"
status=0
"$BIN/zdiff" "$SMOKE/plain.gz" "$SMOKE/other.gz" > "$SMOKE/zdiff.out" || status=$?
[ "$status" -eq 1 ]
grep -F beta "$SMOKE/zdiff.out"
grep -F gamma "$SMOKE/zdiff.out"

cp "$SMOKE/plain.gz" "$SMOKE/forced"
"$BIN/zforce" "$SMOKE/forced"
test -f "$SMOKE/forced.gz"
cp "$SMOKE/plain.gz" "$SMOKE/legacy.Z"
"$BIN/znew" -t "$SMOKE/legacy.Z"
test -f "$SMOKE/legacy.gz"
"$BIN/gzip" -t "$SMOKE/legacy.gz"
printf '%s\n' '#!/bin/sh' 'printf "%s\n" gzexe-ok' > "$SMOKE/program"
chmod 0755 "$SMOKE/program"
"$BIN/gzexe" "$SMOKE/program"
test "$(head -n 1 "$SMOKE/program")" = '#!/bin/sh'
test "$("$SMOKE/program")" = gzexe-ok

for command in gzip gunzip zcat uncompress gzexe zcmp zdiff zegrep zfgrep zforce zgrep znew; do
  "$BIN/$command" --version | head -n 1 | grep -F "$PEKIT_VERSION"
done
readelf -h "$ELF" | grep -E 'Type:[[:space:]]+DYN'
readelf -W -l "$ELF" | grep 'GNU_STACK' | grep -F 'RW '
readelf -d "$ELF" | grep -F 'BIND_NOW'
readelf -d "$ELF" | grep -F 'RELR'
if readelf -d "$ELF" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test -n "$(find "$STAGE/usr/src/debug/org.gnu.gzip" -type f -print -quit)"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.perl.perl"                = "*"
"org.gnu.diffutils"            = "*"
"org.gnu.grep"                 = "*"
"org.gnu.binutils"             = "*"
"org.gnu.findutils"            = "*"

[test.dependencies.apt]
build-essential = "*"
perl            = "*"
diffutils       = "*"
grep            = "*"
binutils        = "*"
findutils       = "*"
