# bc — GNU bc/dc arbitrary-precision calculators; kbuild's timeconst.bc
# (kernel HZ table generation) feeds on bc.
#
# PEI-158 kernel-tooling leaf: autotools from the signed release tarball,
# out-of-source via DESTDIR (the m4 shape). Readline support is deliberately
# deferred to PEI-613 because Peios does not yet package the library; bc and dc
# remain fully functional for non-interactive use. The tarball ships generated
# scanner/parser sources but its documentation build still needs makeinfo, so
# texinfo is a build dependency even though Peios does not yet ship Info files.
# dc rides along (one tarball, one package).

tags = ["bootstrap"]
out_dir = "out"

[source]
patches = "patches"

[source.url]
url         = "https://ftp.gnu.org/gnu/bc/bc-{{version}}.tar.gz"
listing_url = "https://ftp.gnu.org/gnu/bc/"
extract  = true
root     = "bc-{{version}}"
# Soft maintenance floor: automatic sweeps follow every newer stable GNU
# release; the older 1.07 line remains outside routine publication.
versions = ">= 1.08.0"
# GNU has historically used both two- and three-component stable versions.
file_regex = 'bc-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.gz'

[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/ken-pizzini.asc"]
fingerprints = ["325B54E4653F935A25CF32BDA186278D426A38E9"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
# Preserve physical DWARF paths until debugedit collects the source files.
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.bc"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --infodir=/usr/share/info
make -j"$(nproc)"

make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info"
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -n -9 {} \\;

sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.bc \
  "$PEKIT_OUT/usr/bin/bc" "$PEKIT_OUT/usr/bin/dc"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.texinfo" = "*"
"org.gnu.gzip" = "*"
"org.sourceware.debugedit" = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
BIN="$PEKIT_MAIN_OUT/usr/bin"
test "$(printf '%s\n' 'scale=4; 1/8' | "$BIN/bc")" = .1250
test "$(printf '%s\n' '16i FF p' | "$BIN/dc")" = 255

# Run the upstream release suite from the explicit package gate.
SRC="$(pwd)"
PEKIT_OUT="$PEKIT_MAIN_OUT"
cd "$PEKIT_OUT"
# Upstream's Automake `make check` target only rebuilds the programs, so run
# the shipped mathematical corpus and focused command-line regressions here.
make check
# No line wrapping, so each reported value stays on one line for the check below.
BC_LINE_LENGTH=0 "$PEKIT_OUT/bc/bc" -l "$SRC/Test/checklib.b" </dev/null > checklib.out
grep -q '^Total failures: 0$' checklib.out
# checklib.b compares f(x) at scale s with f(x) at scale s+4 truncated to s.
# bc's library truncates rather than rounds, so a handful of cases differ in
# the last digit by design. Accept a reported mismatch only when it is within
# one unit in the last place; anything larger is a real accuracy failure.
awk '/^  val1 = /{v1=$3} /^  val2 = /{print v1, $3}' checklib.out > checklib.pairs
test "$(grep -c '^Failed:' checklib.out)" -eq "$(wc -l < checklib.pairs)"
while read -r v1 v2; do
  frac=${v1#*.}
  [ "$frac" != "$v1" ] || { echo "org.gnu.bc: unparsable checklib value $v1" >&2; exit 1; }
  # Truncate val2 to val1's scale exactly as checklib does, then compare.
  ok=$(printf 'scale=%d; d=%s/1-(%s); if (d<0) d=-d; d<=10^-%d\n' \
    "${#frac}" "$v2" "$v1" "${#frac}" | "$PEKIT_OUT/bc/bc")
  if [ "$ok" != 1 ]; then
    echo "org.gnu.bc: checklib.b mismatch beyond one ulp: $v1 vs $v2" >&2
    exit 1
  fi
done < checklib.pairs
"$PEKIT_OUT/bc/bc" "$SRC/Test/signum" </dev/null > signum.out
grep -q '^end of tests$' signum.out
if grep -q '^x=' signum.out; then
  echo "org.gnu.bc: signum test printed a failing case" >&2
  exit 1
fi
test "$(printf 'scale=2; 1/2\n' | "$PEKIT_OUT/bc/bc" -sq)" = ".50"
test "$(printf '2 3 + p\n' | "$PEKIT_OUT/dc/dc")" = "5"
# Fedora's long-standing dc radix correction retains a single digit's literal
# value but clamps an invalid digit when it is part of a multi-digit number.
test "$(printf '8 i 9 p\n' | "$PEKIT_OUT/dc/dc")" = "9"
test "$(printf '8 i 19 p\n' | "$PEKIT_OUT/dc/dc")" = "15"
# A calculator used to generate build inputs must not report success after
# losing its output (Debian #488735; dc already handles this upstream).
if printf '1+1\n' | "$PEKIT_OUT/bc/bc" > /dev/full 2>/dev/null; then
  echo "bc accepted a failed standard-output write" >&2
  exit 1
fi

test "$(find "$PEKIT_MAIN_OUT/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 2
test -n "$(find "$PEKIT_MAIN_OUT/usr/src/debug/org.gnu.bc" -type f -print -quit)"
for elf in "$BIN/bc" "$BIN/dc"; do
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep -E 'GNU_STACK.*RW '
  readelf -W -l "$elf" | grep -F 'GNU_RELRO'
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  readelf -n "$elf" | grep -E 'x86 feature:.*IBT.*SHSTK'
  if readelf -d "$elf" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
done

'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.texinfo" = "*"
"org.git.kernel.dash" = "*"
