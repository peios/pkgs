# Metadata shared by the GNU bc package family. Each package is defined in its
# own *.package.pekit.toml; once those exist this file is only a base layer, so
# the main package needs org.gnu.bc.package.pekit.toml of its own.

format = "peipkg"

[package]
version       = "{{version}}-2"
architecture  = "x86_64"
license       = "GPL-3.0-or-later"
license_class = "free"
homepage      = "https://www.gnu.org/software/bc/"
