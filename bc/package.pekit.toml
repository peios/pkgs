format = "peipkg"

[package]
name         = "bc"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU bc - arbitrary-precision calculator language (bc and dc)"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/bc/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING"   = "usr/share/licenses/bc/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
