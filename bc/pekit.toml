# bc — GNU bc/dc arbitrary-precision calculators; kbuild's timeconst.bc
# (kernel HZ table generation) feeds on bc.
#
# PEI-158 kernel-tooling leaf: autotools from the release tarball, out-of-
# source via DESTDIR (the m4 shape). Plain build — readline/libedit line
# editing only engages with an explicit --with flag, so the pristine root
# needs neither; the tarball ships pre-generated scanner/parser sources
# but NOT the .info docs, and the doc rule hard-requires makeinfo — hence
# the texinfo dep (the info output itself is dropped at install).
# dc rides along (one tarball, one package).

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/bc/bc-{{version}}.tar.gz"
extract  = true
root     = "bc-{{version}}"
versions = ">= 1.08"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --infodir=/usr/share/info
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
texinfo = "*"

[build.main.dependencies.apt]
build-essential = "*"
texinfo = "*"
