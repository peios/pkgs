# Resolvd owns its hermetic build, package boundaries, tests, hardening gates,
# and source/debug artifacts in the public source tree. This catalogue entry
# follows its immutable production releases while retaining the local checkout
# for pre-release qualification.

out_dir = "out"
delegate = true

[source.git]
url       = "https://github.com/peios/resolvd.git"
ref       = "v{{version}}"
# Soft production floor: earlier development snapshots predate the qualified
# package family and complete remote dependency provenance.
versions  = ">= 0.1.0"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[source.local]
path = "../../resolvd"
