# resolvd — the Peios stub resolver — resolv, and libnss_peios_net.so.2.
#
# Delegate recipe: resolvd is self-describing (pekit.toml and packages.pekit/
# in its own tree), so this is just a pointer, like netd's.

out_dir = "out"
delegate = true

# Local working copy for `--local` (compile the in-dev tree, no tag).
[source.local]
path = "../../resolvd"
