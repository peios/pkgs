# libatomic-static — the static archive for statically linking libatomic.
# --strip-debug'd at build time (archive members carry no build-id to index).

[package]
license     = "GPL-3.0-or-later WITH GCC-exception-3.1"
name        = "org.gnu.gcc-libatomic-static"
description = "GCC atomic operations runtime static library"

[provides]
"libatomic-static" = "{{version}}-2"

[replaces]
"libatomic-static" = "<= {{version}}-1"

[dependencies]
"org.gnu.gcc-libatomic-devel" = "{{version}}-2"

[files]
"@source:COPYING3"        = "usr/share/licenses/org.gnu.gcc-libatomic-static/COPYING3"
"@source:COPYING.RUNTIME" = "usr/share/licenses/org.gnu.gcc-libatomic-static/COPYING.RUNTIME"
":usr/lib/x86_64-linux-peios/libatomic.a"          = "usr/lib/x86_64-linux-peios/libatomic.a"
":usr/lib/x86_64-linux-peios/libatomic_asneeded.a" = "usr/lib/x86_64-linux-peios/libatomic_asneeded.a"
