# libitm-devel — the link-time .so symlink for building against libitm (-litm /
# -fgnu-tm). The static archive is libitm-static.

[package]
license     = "GPL-3.0-or-later WITH GCC-exception-3.1"
name        = "org.gnu.gcc-libitm-devel"
description = "GCC transactional memory runtime development files"

[provides]
"libitm-devel" = "{{version}}-2"

[replaces]
"libitm-devel" = "<= {{version}}-1"

[dependencies]
"org.gnu.gcc-libitm" = "{{version}}-2"

[files]
"@source:COPYING3"        = "usr/share/licenses/org.gnu.gcc-libitm-devel/COPYING3"
"@source:COPYING.RUNTIME" = "usr/share/licenses/org.gnu.gcc-libitm-devel/COPYING.RUNTIME"
":usr/lib/x86_64-linux-peios/libitm.so" = "usr/lib/x86_64-linux-peios/libitm.so"
