# GCC's architecture-independent Info manuals cover the compiler front ends,
# internals, installation, and the runtime libraries. Keeping them out of the
# compiler/runtime payloads lets minimal build roots omit documentation.

[package]
name         = "org.gnu.gcc-doc"
architecture = "noarch"
description  = "GNU Compiler Collection Info manuals"
license      = "GFDL-1.3-no-invariants-or-later"

[provides]
"gcc-doc" = "{{version}}-2"

[replaces]
"gcc-doc" = "<= {{version}}-1"

[files]
"@source:gcc/doc/include/fdl.texi" = "usr/share/licenses/org.gnu.gcc-doc/GFDL-1.3.texi"
":usr/share/info/*.info*" = "usr/share/info"
