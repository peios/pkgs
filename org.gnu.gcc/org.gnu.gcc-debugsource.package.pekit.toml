# gcc-debugsource — the GCC sources referenced by the debug info, under
# /usr/src/debug/org.gnu.gcc, so gdb/debuginfod can show source lines (not just
# file:line) for both the compiler binaries and the runtime libs. The
# debug-split rewrites the DWARF comp_dir here (debugedit) and stages exactly
# the sources the shipped ELFs reference. Pairs with gcc-debuginfo.

[package]
name        = "org.gnu.gcc-debugsource"
description = "GCC debug sources"
license     = "GPL-3.0-or-later AND (GPL-3.0-or-later WITH GCC-exception-3.1) AND LGPL-2.0-or-later AND LGPL-2.1-or-later"

[provides]
"gcc-debugsource" = "{{version}}-2"

[replaces]
"gcc-debugsource" = "<= {{version}}-1"

[dependencies]
"org.gnu.gcc-debuginfo" = "{{version}}-2"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.gcc-debugsource/"
":usr/src/debug/**" = "usr/src/debug"
