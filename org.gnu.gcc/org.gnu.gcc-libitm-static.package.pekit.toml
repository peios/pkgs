# libitm-static — the static archive for statically linking libitm.
# --strip-debug'd at build time (archive members carry no build-id to index).

[package]
license     = "GPL-3.0-or-later WITH GCC-exception-3.1"
name        = "org.gnu.gcc-libitm-static"
description = "GCC transactional memory runtime static library"

[provides]
"libitm-static" = "{{version}}-2"

[replaces]
"libitm-static" = "<= {{version}}-1"

[dependencies]
"org.gnu.gcc-libitm-devel" = "{{version}}-2"

[files]
"@source:COPYING3"        = "usr/share/licenses/org.gnu.gcc-libitm-static/COPYING3"
"@source:COPYING.RUNTIME" = "usr/share/licenses/org.gnu.gcc-libitm-static/COPYING.RUNTIME"
":usr/lib/x86_64-linux-peios/libitm.a" = "usr/lib/x86_64-linux-peios/libitm.a"
