# gcc-c++ — the GNU C++ compiler: the g++/c++ drivers and the C++ compiler core
# (cc1plus). Builds on top of gcc (shares the driver internals, crt objects,
# binutils) and needs the libstdc++ headers + link symlink to compile/link C++.
#
# An exact-file source maps to a FULL path.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "org.gnu.gcc-c++"
description = "GNU C++ compiler"
license     = "GPL-3.0-or-later AND GFDL-1.3-no-invariants-or-later"

[provides]
"gcc-c++" = "{{version}}-2"

[replaces]
"gcc-c++" = "<= {{version}}-1"

[dependencies]
"org.gnu.gcc"     = "{{version}}-2"
# Compiling/linking C++ needs the standard-library headers + the libstdc++.so
# dev symlink (which pulls libstdc++ runtime).
"org.gnu.gcc-libstdc++-devel" = "{{version}}-2"

[files]
"@source:COPYING3"              = "usr/share/licenses/org.gnu.gcc-c++/COPYING3"
"@source:gcc/doc/include/fdl.texi" = "usr/share/licenses/org.gnu.gcc-c++/GFDL-1.3.texi"
# The C++ drivers (g++ + the c++ alias, prefixed + unprefixed).
":usr/bin/g++"                       = "usr/bin/g++"
":usr/bin/c++"                       = "usr/bin/c++"
":usr/bin/x86_64-linux-peios-g++"    = "usr/bin/x86_64-linux-peios-g++"
":usr/bin/x86_64-linux-peios-c++"    = "usr/bin/x86_64-linux-peios-c++"
# The C++ compiler core.
":usr/lib/x86_64-linux-peios/gcc/x86_64-linux-peios/{{major}}/cc1plus" = "usr/lib/x86_64-linux-peios/gcc/x86_64-linux-peios/{{major}}/cc1plus"

# Man page (pre-generated by GCC; no help2man needed).
":usr/share/man/man1/g++.1" = "usr/share/man/man1/g++.1"
