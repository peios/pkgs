# cpp — the C preprocessor and C compiler core. Following the Fedora split, the
# actual compiler proper for C (cc1, which also does standalone preprocessing via
# `cpp` = cc1 -E) lives here, NOT in gcc; the gcc package depends on cpp. This
# keeps the preprocessor installable for the (rare) consumers that want it
# without the full driver, and gives gcc/gcc-c++ a shared cc1-owning base.
#
# An exact-file source maps to a FULL path; ":" is the default "main:" build.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "org.gnu.gcc-cpp"
description = "GNU C preprocessor"
license     = "GPL-3.0-or-later AND GFDL-1.3-no-invariants-or-later"

[provides]
cpp = "{{version}}-2"

[replaces]
cpp = "<= {{version}}-1"

[dependencies]
# cc1 dynamically links the bignums (compile-time constant folding) + system zlib
# + glibc. Decision 3: dynamic, resolved from the triplet libdir on Peios.
"org.gnu.glibc"                  = ">= 2.43"
"org.gnu.gmp"                    = ">= 6.3.0"
"org.gnu.mpfr"                   = ">= 4.2"
"org.gnu.mpc"                    = ">= 1.3"
"io.sourceforge.libisl.isl"      = ">= 0.27"
"io.github.zlib-ng.zlib-ng-compat" = ">= 2.3.3"

[files]
"@source:COPYING3"              = "usr/share/licenses/org.gnu.gcc-cpp/COPYING3"
"@source:gcc/doc/include/fdl.texi" = "usr/share/licenses/org.gnu.gcc-cpp/GFDL-1.3.texi"
# The standalone preprocessor driver.
":usr/bin/cpp" = "usr/bin/cpp"
# The C compiler core (also the preprocessor engine), in gcc's internal dir.
":usr/lib/x86_64-linux-peios/gcc/x86_64-linux-peios/{{major}}/cc1" = "usr/lib/x86_64-linux-peios/gcc/x86_64-linux-peios/{{major}}/cc1"

# Man page (pre-generated by GCC; no help2man needed).
":usr/share/man/man1/cpp.1" = "usr/share/man/man1/cpp.1"
