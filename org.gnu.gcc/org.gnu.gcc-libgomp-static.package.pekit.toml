# libgomp-static — the static archive for statically linking libgomp.
# --strip-debug'd at build time (archive members carry no build-id to index).

[package]
license     = "GPL-3.0-or-later WITH GCC-exception-3.1"
name        = "org.gnu.gcc-libgomp-static"
description = "GCC OpenMP runtime static library"

[provides]
"libgomp-static" = "{{version}}-2"

[replaces]
"libgomp-static" = "<= {{version}}-1"

[dependencies]
"org.gnu.gcc-libgomp-devel" = "{{version}}-2"

[files]
"@source:COPYING3"        = "usr/share/licenses/org.gnu.gcc-libgomp-static/COPYING3"
"@source:COPYING.RUNTIME" = "usr/share/licenses/org.gnu.gcc-libgomp-static/COPYING.RUNTIME"
":usr/lib/x86_64-linux-peios/libgomp.a" = "usr/lib/x86_64-linux-peios/libgomp.a"
