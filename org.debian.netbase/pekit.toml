# netbase — the standard protocol, service and Ethernet type databases consumed
# by libc and networking tools. Peios stores vendor configuration in /usr/etc;
# StrataFS presents it through the conventional /etc view. The RPC database is
# already shipped by glibc and deliberately remains owned there.

tags = ["bootstrap"]
out_dir = "out"

[source.git]
url       = "https://salsa.debian.org/md/netbase.git"
ref       = "debian/{{version}}"
tag_regex = '^debian/(?P<version>[0-9]+\.[0-9]+)$'
# Soft maintenance floor. This package is architecture-independent data, so
# later releases are selected automatically without an artificial major cap.
versions  = ">= 6.6"

# Upstream's annotated release tags are OpenPGP-signed by the maintainer, Marco
# d'Itri. The key is the one his salsa.debian.org account publishes
# (https://salsa.debian.org/md.gpg).
[source.git.signature]
key_files    = ["keys/marco-d-itri.asc"]
fingerprints = ["6791403B68AE2690517C42EAE6FFF1E38DC968B0"]

[build.main]
command = """
set -eu
SRC="$PEKIT_SOURCE_ROOT"
DEST="$PEKIT_OUT/usr/etc"

mkdir -p "$DEST"
for name in ethertypes protocols services; do
  test -s "$SRC/etc/$name"
  cat "$SRC/etc/$name" > "$DEST/$name"
done
"""

[build.main.dependencies.peipkg]
"org.git.kernel.dash"                = "*"
"dev.peios.peiosutils" = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
ROOT="$PEKIT_MAIN_OUT/usr/etc"
test -s "$ROOT/protocols"
test -s "$ROOT/services"
test -s "$ROOT/ethertypes"
# No service name or alias may claim the same port/protocol tuple twice. Each
# step writes a file under set -e, so a failing sed cannot pass the check.
WORK="$PEKIT_OUT/services-check"
mkdir -p "$WORK"
sed 's/#.*$//; s/[[:space:]][[:space:]]*/ /g' "$ROOT/services" > "$WORK/services"
while read -r name service aliases; do
  for alias in $name $aliases; do printf '%s %s\n' "$alias" "$service"; done
done < "$WORK/services" > "$WORK/pairs"
test -s "$WORK/pairs"
LC_ALL=C sort "$WORK/pairs" > "$WORK/pairs.sorted"
uniq -d "$WORK/pairs.sorted" > "$WORK/duplicates"
if [ -s "$WORK/duplicates" ]; then
  cat "$WORK/duplicates" >&2
  echo "org.debian.netbase: duplicate service name and port/protocol tuple" >&2
  exit 1
fi
awk '$1 == "tcp" && $2 == 6 { found = 1 } END { exit !found }' "$ROOT/protocols"
awk '$1 == "udp" && $2 == 17 { found = 1 } END { exit !found }' "$ROOT/protocols"
awk '$1 == "domain" && $2 == "53/tcp" { found = 1 } END { exit !found }' "$ROOT/services"
awk '$1 == "domain" && $2 == "53/udp" { found = 1 } END { exit !found }' "$ROOT/services"
awk '$1 == "IPv4" && $2 == "0800" { found = 1 } END { exit !found }' "$ROOT/ethertypes"
'''

[test.dependencies.peipkg]
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.gawk" = "*"
"org.gnu.grep" = "*"
"org.gnu.sed" = "*"
