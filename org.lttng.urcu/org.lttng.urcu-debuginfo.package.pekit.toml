"@source:LICENSES/MIT.txt" = "usr/share/licenses/org.lttng.urcu-debuginfo/MIT.txt"
"@source:LICENSES/BSD-2-Clause.txt" = "usr/share/licenses/org.lttng.urcu-debuginfo/BSD-2-Clause.txt"
