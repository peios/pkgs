[package]
name = "org.lttng.urcu-devel"
description = "urcu development files"
[dependencies]
"org.lttng.urcu" = "= {{release}}"
[files]
"@source:LICENSE.md" = "usr/share/licenses/org.lttng.urcu-devel/LICENSE.md"
"@source:LICENSES/LGPL-2.1-or-later.txt" = "usr/share/licenses/org.lttng.urcu-devel/LGPL-2.1-or-later.txt"
"@source:LICENSES/MIT.txt" = "usr/share/licenses/org.lttng.urcu-devel/MIT.txt"
"@source:LICENSES/BSD-2-Clause.txt" = "usr/share/licenses/org.lttng.urcu-devel/BSD-2-Clause.txt"
"@source:LICENSES/LicenseRef-Boehm-GC.txt" = "usr/share/licenses/org.lttng.urcu-devel/LicenseRef-Boehm-GC.txt"
":usr/include/**" = "usr/include"
":usr/lib/x86_64-linux-peios/*.so" = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/pkgconfig/**" = "usr/lib/x86_64-linux-peios/pkgconfig"
