out_dir = "out"
[source.url]
url = "https://lttng.org/files/urcu/userspace-rcu-{{version}}.tar.bz2"
listing_url = "https://lttng.org/files/urcu/"
file_regex = 'userspace-rcu-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)\.tar\.bz2'
root = "userspace-rcu-{{version}}"
extract = true
versions = ">= 0.15.7"
[source.url.signature]
url = "{{source_url}}.asc"
of = "artifact"
key_files = ["keys/release.asc"]
fingerprints = ["2A0B4ED915F2D3FA45F5B16217280A9781186ACF"]
[build.main]
command = '''
set -eu
SRC=$(pwd)
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.lttng.urcu"

sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/config-sub-peios.sh" "$SRC/config/config.sub"
mkdir -p "$PEKIT_OUT/build"
cd "$PEKIT_OUT/build"
"$SRC/configure" --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios --disable-static --disable-examples
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr" -name '*.la' -delete
rm -rf "$PEKIT_OUT/usr/share/doc" "$PEKIT_OUT/usr/share/info"
if [ -d "$PEKIT_OUT/usr/share/man" ]; then
  find "$PEKIT_OUT/usr/share/man" -type f -exec gzip -9n {} +
  find "$PEKIT_OUT/usr/share/man" -type l | while read -r link; do
    target=$(readlink "$link")
    ln -s "$target.gz" "$link.gz"
    rm "$link"
  done
fi
find "$PEKIT_OUT/usr/lib" -type f -name "*.so.*" -exec patchelf --remove-rpath {} +
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.lttng.urcu "$PEKIT_OUT/usr"
'''
[build.main.dependencies.peipkg]
"org.nixos.patchelf" = "*"
"dev.peios.build-essentials-c" = "*"
"org.gnu.gcc-c++" = "*"
"org.gnu.gzip" = "*"
"org.pkgconf.pkgconf" = "*"
"org.gnu.autoconf" = "*"
"org.gnu.automake" = "*"
"org.gnu.libtool" = "*"
[test]
needs = ["main"]
gate = true
command = '''
set -eu
make -C "$PEKIT_MAIN_OUT/build" -j"$(nproc)" check
'''
[test.dependencies.peipkg]
"org.gnu.bash" = "*"
"dev.peios.build-essentials-c" = "*"
"org.gnu.gcc-c++" = "*"
"org.gnu.gzip" = "*"
"org.pkgconf.pkgconf" = "*"
"org.gnu.autoconf" = "*"
"org.gnu.automake" = "*"
"org.gnu.libtool" = "*"
