# numactl-devel — numa.h, the libnuma.so link, and pkg-config metadata.

[package]
name        = "numactl-devel"
description = "numactl - libnuma headers and link library"

[dependencies]
libnuma = "{{version}}"

[files]
":usr/include/**"                          = "usr/include"
":usr/lib/x86_64-linux-peios/libnuma.so"   = "usr/lib/x86_64-linux-peios/libnuma.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**" = "usr/lib/x86_64-linux-peios/pkgconfig"
