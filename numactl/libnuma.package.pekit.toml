# libnuma — the NUMA policy runtime library, on its own so library
# consumers (perf bench numa) need not pull the tools.

[package]
name        = "libnuma"
description = "numactl - libnuma NUMA policy runtime library"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:LICENSE.LGPL2.1" = "usr/share/licenses/libnuma/"
":usr/lib/x86_64-linux-peios/libnuma.so.1*" = "usr/lib/x86_64-linux-peios"
