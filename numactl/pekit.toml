# numactl — NUMA policy library + tools; perf bench numa links libnuma
# (PEI-158 Tier 2).
#
# Autotools from the release tarball, out-of-source via DESTDIR (the m4
# shape). Static lib dropped (house style).

out_dir = "out"

[source.url]
url      = "https://github.com/numactl/numactl/releases/download/v{{version}}/numactl-{{version}}.tar.gz"
extract  = true
root     = "numactl-{{version}}"
versions = ">= 2.0.19"

[build.main]
command = """
SRC="$(pwd)"
LIBDIR=/usr/lib/x86_64-linux-peios
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --libdir="$LIBDIR" --disable-static
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT$LIBDIR" -name '*.la' -delete
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
