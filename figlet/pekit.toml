# figlet — display text as large ASCII-art banners.
#
# First third-party (non-Peios) package. Unlike loregd/prelude, figlet is a
# plain Makefile project with no pekit files of its own, so this is the
# recipe-supplies path (not delegate): pekit/figlet carries the whole build
# and package definition.

outDir = "out"

[build]
# figlet's `install` target depends on `all`, so this single invocation
# compiles the binaries and lays the final archive tree — usr/bin,
# usr/share/figlet, usr/share/man — straight into the build stage via
# DESTDIR. The package then globs that tree.
#
# We drive DEFAULTFONTDIR explicitly, NOT prefix/FONTDIR: it is the one
# variable every figlet version uses both for the font install dir and for
# the -DDEFAULTFONTDIR baked into the binary (its runtime font search path),
# and a command-line assignment overrides each Makefile's own. So this one
# command builds 2.2.3 (Makefile default DEFAULTFONTDIR=fonts) and
# 2.2.4/2.2.5 (DEFAULTFONTDIR=$(prefix)/share/figlet) to the same layout.
command = """
make DESTDIR="$PEKIT_OUT" BINDIR=/usr/bin MANDIR=/usr/share/man DEFAULTFONTDIR=/usr/share/figlet install
"""

[source]
git = "https://github.com/cmatsuoka/figlet.git"
# figlet tags are bare (2.2.5), no "v" prefix.
rev = "{{version}}"
