# Metadata shared by the GNU Findutils package family. The expression includes
# the manuals and vendored Gnulib/source licenses carried by the generated
# corresponding-source package, not only the linked command binaries.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "GPL-3.0-or-later AND GPL-2.0-or-later AND GFDL-1.3-no-invariants-or-later AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND LGPL-3.0-or-later AND BSD-3-Clause AND MIT"
license_class = "free"
homepage      = "https://www.gnu.org/software/findutils/"
