side_effects = ["man-db"]

[package]
name        = "org.python.python3"
description = "Python 3 interpreter and command-line tools"

[provides]

[replaces]

[dependencies]
"org.python.python3-libs" = "{{version}}-5"

[files]
"@source:LICENSE"        = "usr/share/licenses/org.python.python3/LICENSE"
":usr/bin/python3"       = "usr/bin/python3"
":usr/bin/python3.14"    = "usr/bin/python3.14"
":usr/bin/pydoc3"        = "usr/bin/pydoc3"
":usr/bin/pydoc3.14"     = "usr/bin/pydoc3.14"
":usr/share/man/man1/python3.1.gz" = "usr/share/man/man1/python3.1.gz"
":usr/share/man/man1/python3.14.1.gz" = "usr/share/man/man1/python3.14.1.gz"
":usr/share/man/man1/pydoc*.1.gz" = "usr/share/man/man1"
