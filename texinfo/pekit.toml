# texinfo — texi2any (makeinfo) and friends; the glibc/binutils/gcc
# closure rebuilds run makeinfo over their manuals.
#
# Phase-2a tool (PEI-155): autotools from the release tarball, out-of-source
# via DESTDIR (the m4 shape). texi2any is a perl program — perl is a
# runtime dependency, not just build. --disable-perl-xs keeps the parser
# pure perl (slower, but no XS build against perl's CORE headers to carry).
# The standalone info browser needs a termcap provider we don't package;
# if configure demands one, that subdir gets dealt with here rather than
# packaged around.

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/texinfo/texinfo-{{version}}.tar.xz"
extract  = true
root     = "texinfo-{{version}}"
versions = ">= 7.3"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --disable-nls --disable-perl-xs
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
perl = "*"

[build.main.dependencies.apt]
build-essential = "*"
perl = "*"
