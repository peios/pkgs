# peiosutils — the Peios coreutils: a uutils fork plus the Peios-native KACS
# tools (token, sd, logonse, revstrm) and the SD-aware file utilities. One build
# fans into four packages: peiosutils (the multi-call `coreutils` binary + the
# /usr/bin applet symlinks), peiosutils-common (man pages, completions, locale —
# noarch), peiosutils-debuginfo (split DWARF), and peiosutils-debugsource.
#
# Delegate recipe: peiosutils is self-describing — it commits its own pekit files
# (the build pipeline in pekit.toml, the package definitions in packages.pekit/
# with their shared base), so this recipe is just a pointer. pekit fetches the
# tag matching --version and borrows the source's own build + package
# definitions. The runtime libpeios / gcc / glibc dependencies are derived
# automatically from the binaries' DT_NEEDED (and versioned for glibc/libgcc per
# the workspace symbol-version policy).
#
# Note: peiosutils's build needs a rustup stable toolchain (cargo + rustc), clang
# (libclang for peios-sys's bindgen), and binutils + debugedit for the debug
# split. It also needs libpeios — supplied today by a git-ignored vendored deps/
# tree inside the source (deps/refresh.sh), the bridge until the build root
# self-hosts libpeios-devel + kernel-headers. Because deps/ is git-ignored a
# git-tag build can't populate it, so build with --local (the in-dev tree, where
# deps/ is present) until self-hosting lands. On a farm without the dev rustup
# layout, override just [env] here with the farm's toolchain — the rest still
# delegates.

out_dir = "out"
delegate = true

[source.git]
url = "https://github.com/peios/peiosutils.git"
ref = "v{{version}}"
# peiosutils has no release tags yet; the pekit files land in its first tagged
# release (the workspace sits at 0.8.0), so v0.8.0 is the floor. A "*" sweep
# simply finds nothing until that first tag.
versions = ">=0.8.0"

# Local working copy for `--local` (build the in-dev tree, no tag).
# Relative to this recipe dir; never used by the farm.
[source.local]
path = "../../peiosutils"
