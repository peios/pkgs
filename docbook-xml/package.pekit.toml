format = "peipkg"

[package]
name         = "docbook-xml"
version      = "{{version}}-1"
# A DTD is XML text: the same bytes on every architecture.
architecture = "noarch"
description  = "DocBook XML V4.5 DTD - the DocBook document schema"
# The OASIS DocBook DTD carries its own permissive licence, granted in the
# DTD's own header rather than as an SPDX-listed text; free software, and
# stated explicitly because the LicenseRef- form is opaque to tooling.
license       = "LicenseRef-OASIS-DocBook-DTD"
license_class = "free"
homepage      = "https://docbook.org/"

[files]
":usr/share/xml/**" = "usr/share/xml"
