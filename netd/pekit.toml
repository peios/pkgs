# netd — the Peios network manager — and net, its operator command.
#
# Delegate recipe: netd is self-describing (pekit.toml and packages.pekit/
# in its own tree), so this is just a pointer, like authd's.

out_dir = "out"
delegate = true

# Local working copy for `--local` (compile the in-dev tree, no tag).
[source.local]
path = "../../netd"
