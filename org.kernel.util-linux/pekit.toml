# util-linux: libblkid and a deliberately chosen set of commands.
#
# Peiosutils owns the command surfaces normally supplied by util-linux. A
# second implementation of mount, lsblk, dmesg, and the other tools would
# create ambiguous policy and PATH ownership. libblkid remains the platform
# filesystem-signature library used by peiosutils, eudev and e2fsprogs;
# getopt remains because shell tooling such as xmlto requires it.
#
# Beyond those, only commands that neither overlap peiosutils nor carry
# identity, device or kernel-policy authority ship, grouped as:
#   schedutils  taskset, chrt, ionice, renice (CPU affinity and scheduling)
#   script      script, scriptreplay, scriptlive (terminal session recording)
#   extra       flock, setsid, rev, col, colcrt, colrm (shell and text tools)
# Deliberately not built: login-utils (login, su, runuser, newgrp, chsh, chfn,
# sulogin, last, lslogins: authd and KACS own identity and logon); storage and
# mount tools (mount, umount, lsblk, findmnt, blkid, fdisk, sfdisk, mkfs,
# swapon, losetup, wipefs, ...: peiosutils' storage tools own them); wall,
# write and mesg (they rely on a setgid tty group); setpriv, unshare, nsenter
# and setarch (capability and namespace manipulation outside KACS policy);
# kill, more, dmesg and the other peiosutils equivalents; hwclock, rtcwake,
# eject and other device-control tools; and anything needing the disabled
# libmount, libsmartcols, libuuid or libfdisk (column, prlimit, lscpu, ...).

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

# The corresponding source carries the complete util-linux tree. Individual
# binary packages narrow this to the files they actually ship.
[source_package]
license = "GPL-1.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later AND MIT AND BSD-2-Clause AND BSD-3-Clause AND BSD-4-Clause-UC AND EUPL-1.2 AND LicenseRef-Public-Domain"

[source.url]
url         = "https://cdn.kernel.org/pub/linux/utils/util-linux/v{{major}}.{{minor}}/util-linux-{{version}}.tar.xz"
listing_url = "https://api.github.com/repos/util-linux/util-linux/tags?per_page=100"
extract     = true
root        = "util-linux-{{version}}"
file_regex  = '"name"[[:space:]]*:[[:space:]]*"v?[0-9]+\.[0-9]+(?:\.[0-9]+)?"'
# Soft maintenance floor. Follow every newer authenticated stable release;
# deep command or ABI changes stop at the build and staged-interface gates.
versions    = ">= 2.42.3"

# kernel.org signs the decompressed tar rather than its xz transport. Karel
# Zak's complete primary fingerprint is embedded in the 2.42.3 signature.
[source.url.signature]
url          = "https://cdn.kernel.org/pub/linux/utils/util-linux/v{{major}}.{{minor}}/util-linux-{{version}}.tar.sign"
of           = "decompressed"
key_files    = ["keys/karel-zak.asc"]
fingerprints = ["B0C64D14301CC6EFAEDF60E4E4B71D5EEC39C284"]

[build.main]
command = '''
set -eu
SRC="$(pwd)"
BUILD="$PEKIT_OUT/build"
GETOPT_BUILD="$PEKIT_OUT/getopt-build"
LIBDIR="$PEKIT_OUT/usr/lib/x86_64-linux-peios"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
DEBUG_PREFIX=/usr/src/debug/org.kernel.util-linux
export CFLAGS="${CFLAGS:?} -ffile-prefix-map=$ROOT=$DEBUG_PREFIX -fdebug-prefix-map=$ROOT=$DEBUG_PREFIX -fmacro-prefix-map=$ROOT=$DEBUG_PREFIX"
export CXXFLAGS="${CXXFLAGS:?} -ffile-prefix-map=$ROOT=$DEBUG_PREFIX -fdebug-prefix-map=$ROOT=$DEBUG_PREFIX -fmacro-prefix-map=$ROOT=$DEBUG_PREFIX"
mkdir -p "$BUILD" "$GETOPT_BUILD"

# Configure one deliberately narrow library build. All command programs and
# sibling libraries remain disabled; static and shared libblkid are both
# useful package outputs.
cd "$BUILD"
LDFLAGS="$LDFLAGS -Wl,-z,ibtplt" \
"$SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --libdir=/usr/lib/x86_64-linux-peios \
  --disable-all-programs \
  --enable-libblkid \
  --disable-libuuid \
  --disable-libmount \
  --disable-libfdisk \
  --disable-libsmartcols \
  --enable-static \
  --enable-shared \
  --disable-nls \
  --without-python \
  --disable-rpath \
  --disable-silent-rules
make -j"$(nproc)"

make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr" -name '*.la' -delete

# The commands' old Automake declarations cannot override
# --disable-all-programs, so configure a separate build tree and compile only
# the explicit targets. Optional integrations are stated so the commands never
# depend on what the build root contains.
SCHEDUTILS="taskset chrt ionice renice"
SCRIPT="script scriptreplay scriptlive"
EXTRA="flock setsid rev col colcrt colrm"
cd "$GETOPT_BUILD"
LDFLAGS="$LDFLAGS -Wl,-z,ibtplt" \
"$SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --libdir=/usr/lib/x86_64-linux-peios \
  --disable-nls \
  --without-python \
  --without-utempter \
  --without-systemd \
  --without-selinux \
  --without-audit \
  --without-cap-ng \
  --disable-rpath \
  --disable-silent-rules
make -j"$(nproc)" getopt hexdump test_sysinfo test_script test_md5 test_strerror \
  $SCHEDUTILS $SCRIPT $EXTRA
install -D -m 0755 getopt "$PEKIT_OUT/usr/bin/getopt"
install -D -m 0644 "$SRC/misc-utils/getopt.1" \
  "$PEKIT_OUT/usr/share/man/man1/getopt.1"

# hexdump is needed by upstream byte-level regression suites, including Bash.
install -D -m 0755 hexdump "$PEKIT_OUT/usr/bin/hexdump"
install -D -m 0644 "$SRC/text-utils/hexdump.1" "$PEKIT_OUT/usr/share/man/man1/hexdump.1"

# The selected commands and their prebuilt manuals.
for tool in $SCHEDUTILS $SCRIPT $EXTRA; do
  install -D -m 0755 "$tool" "$PEKIT_OUT/usr/bin/$tool"
  page=$(find "$SRC/schedutils" "$SRC/term-utils" "$SRC/sys-utils" "$SRC/text-utils" \
    -maxdepth 1 -name "$tool.1" -print)
  test "$(printf '%s\n' "$page" | grep -c .)" -eq 1
  install -D -m 0644 "$page" "$PEKIT_OUT/usr/share/man/man1/$tool.1"
done

# Compress every installed manual deterministically.
find "$PEKIT_OUT/usr/share/man" -type f \( -name '*.1' -o -name '*.3' \) \
  -exec gzip -9n {} +

LIB=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libblkid.so.*' -print)
test "$(printf '%s\n' "$LIB" | grep -c .)" -eq 1

# Build-ID symbols go to one tree per binary package (getopt-debug and
# hexdump-debug feed their own -debuginfo splits); every DWARF-referenced
# source is gathered once in the family debugsource tree under usr/src/debug.
SPLIT="$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug"
sh "$SPLIT" org.kernel.util-linux "$LIB" "$LIBDIR/libblkid.a"
split_group() {
  group=$1; shift
  mkdir -p "$PEKIT_OUT/$group-debug"
  set -- $(for tool in "$@"; do printf '%s\n' "$PEKIT_OUT/usr/bin/$tool"; done)
  sh "$SPLIT" --stage "$PEKIT_OUT/$group-debug" org.kernel.util-linux "$@"
  cp -R "$PEKIT_OUT/$group-debug/usr/src/." "$PEKIT_OUT/usr/src/"
  rm -rf "$PEKIT_OUT/$group-debug/usr/src"
}
split_group getopt getopt
split_group hexdump hexdump
split_group schedutils $SCHEDUTILS
split_group script $SCRIPT
split_group extra $EXTRA
'''

[test]
needs = ["main"]
gate = true
command = '''
set -eu
SRC="$(pwd)"
STAGE="$PEKIT_MAIN_OUT"
BUILD="$STAGE/build"
GETOPT_BUILD="$STAGE/getopt-build"
LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
LIB=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libblkid.so.*' -print)
SMOKE="$PEKIT_OUT/smoke"
mkdir -p "$SMOKE"

make -C "$BUILD" -j"$(nproc)" check
"$SRC/tests/run.sh" --srcdir="$SRC" --builddir="$GETOPT_BUILD" \
  --parallel="$(nproc)" getopt hexdump script flock setsid rev col colcrt colrm \
  | tee "$SMOKE/commands-suite"
# Every shipped command's upstream cases run, except flock's: they need
# procps' pgrep and the unbuilt lslocks. flock is exercised directly below.
if grep -F SKIPPED "$SMOKE/commands-suite" | grep -v -E '^ *flock:'; then exit 1; fi
BIN="$STAGE/usr/bin"

# Scheduling tools act on this shell; taskset must honour an affinity mask.
"$BIN/taskset" -p $$ | grep -E "pid $$'s current affinity mask: [0-9a-f]+"
test "$("$BIN/taskset" -c 0 sh -c 'grep Cpus_allowed_list /proc/self/status')" \
  = "$(printf 'Cpus_allowed_list:\t0')"
"$BIN/chrt" -p $$ | grep -F "pid $$'s current scheduling policy: SCHED_OTHER"
"$BIN/chrt" --batch 0 sh -c '"$0" -p $$' "$BIN/chrt" | grep -F SCHED_BATCH
"$BIN/ionice" -p $$ | grep -E '^(none|best-effort|idle|realtime)'
"$BIN/ionice" -c 3 sh -c '"$0" -p $$' "$BIN/ionice" | grep -Fx idle
"$BIN/renice" -n 0 -p $$ | grep -F "$$ (process ID) old priority"

# script records a session on a pseudo-terminal; scriptreplay replays it.
"$BIN/script" -q -c 'echo recorded-output' -T "$SMOKE/timing" "$SMOKE/typescript" \
  < /dev/null > "$SMOKE/script.out"
grep -F recorded-output "$SMOKE/typescript"
"$BIN/scriptreplay" -m 0.001 -t "$SMOKE/timing" "$SMOKE/typescript" | grep -F recorded-output

# flock serialises, setsid detaches, and the text filters transform.
"$BIN/flock" "$SMOKE/lock" sh -c 'test -e "$0"' "$SMOKE/lock"
"$BIN/flock" -n "$SMOKE/lock" true
"$BIN/flock" "$SMOKE/lock" sh -c 'touch "$0.held"; sleep 5' "$SMOKE/lock" &
holder=$!
while [ ! -e "$SMOKE/lock.held" ]; do sleep 0.1; done
status=0
"$BIN/flock" -n "$SMOKE/lock" true || status=$?
test "$status" -eq 1
"$BIN/flock" -s -n "$SMOKE/lock" true && exit 1
"$BIN/flock" -w 10 "$SMOKE/lock" true
wait "$holder"
test "$("$BIN/setsid" -w sh -c 'ps_sid=$(cut -d" " -f6 /proc/$$/stat); test "$ps_sid" = $$ && echo leader')" = leader
test "$(printf 'abc\n' | "$BIN/rev")" = cba
test "$(printf 'abcdef\n' | "$BIN/colrm" 2 3)" = adef

test "$(printf '%s\n' "$LIB" | grep -c .)" -eq 1
test -s "$LIBDIR/libblkid.a"
test -L "$LIBDIR/libblkid.so"
test -L "$LIBDIR/libblkid.so.1"
test -x "$STAGE/usr/bin/getopt"
test "$(printf 'AB' | "$STAGE/usr/bin/hexdump" -v -e '1/1 "%02x"')" = 4142
test "$(find "$STAGE/hexdump-debug/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1

rc=0
"$STAGE/usr/bin/getopt" --test >/dev/null 2>&1 || rc=$?
test "$rc" -eq 4
test "$("$STAGE/usr/bin/getopt" -o ab: --long alpha,beta: -- -a --beta value tail)" \
  = " -a --beta 'value' -- 'tail'"
cat > "$SMOKE/libblkid.c" <<'EOF'
#include <blkid/blkid.h>
#include <stdlib.h>
#include <string.h>
int main(void) {
  const char *version = 0, *date = 0; char *type = 0, *value = 0;
  if (blkid_get_library_version(&version, &date) <= 0 || !version || !date) return 1;
  if (blkid_parse_tag_string("UUID=peios", &type, &value) != 0) return 2;
  if (strcmp(type, "UUID") || strcmp(value, "peios")) return 3;
  free(type); free(value); return 0;
}
EOF
gcc ${CPPFLAGS:-} ${CFLAGS:?} -I"$STAGE/usr/include" "$SMOKE/libblkid.c" \
  -L"$LIBDIR" -lblkid -o "$SMOKE/libblkid"
LD_LIBRARY_PATH="$LIBDIR" "$SMOKE/libblkid"

for elf in "$LIB" "$STAGE/usr/bin/getopt" "$STAGE/usr/bin/hexdump" \
    $(for tool in taskset chrt ionice renice script scriptreplay scriptlive \
        flock setsid rev col colcrt colrm; do printf '%s\n' "$STAGE/usr/bin/$tool"; done); do
  readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
    readelf -n "$elf" | grep -E 'x86 feature:.*IBT.*SHSTK'
  fi
  if readelf -d "$elf" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done
readelf -d "$LIB" | grep -F 'Library soname: [libblkid.so.1]'
readelf -d "$LIB" | grep -F 'Shared library: [libc.so.6]'
test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test "$(find "$STAGE/getopt-debug/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test "$(find "$STAGE/schedutils-debug/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 4
test "$(find "$STAGE/script-debug/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 3
test "$(find "$STAGE/extra-debug/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 6
test -n "$(find "$STAGE/usr/src/debug/org.kernel.util-linux" -type f -print -quit)"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.bash"                  = "*"

[test.dependencies.apt]
build-essential = "*"
bash            = "*"

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.sourceware.debugedit"          = "*"
"org.gnu.gzip"                 = "*"

[build.main.dependencies.apt]
build-essential = "*"
debugedit       = "*"
dwz             = "*"
gzip            = "*"
