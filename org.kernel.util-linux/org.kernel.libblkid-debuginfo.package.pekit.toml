[package]
name        = "org.kernel.libblkid-debuginfo"
description = "libblkid debugging symbols"
license     = "LGPL-2.1-or-later"

[dependencies]
"org.kernel.libblkid" = "{{version}}-1"

[files]
"@source:libblkid/COPYING" = "usr/share/licenses/org.kernel.libblkid-debuginfo/COPYING"
":usr/lib/debug/**" = "usr/lib/debug"
