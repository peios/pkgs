[package]
name         = "org.gnome.libxml2-doc"
architecture = "noarch"
description  = "libxml2 API documentation and release notes"

[provides]
"libxml2-doc" = "{{version}}-1"

[files]
"@source:Copyright"                     = "usr/share/licenses/org.gnome.libxml2-doc/"
"@source:NEWS"                          = "usr/share/doc/org.gnome.libxml2/NEWS"
"@source:README.md"                     = "usr/share/doc/org.gnome.libxml2/README.md"
":usr/share/doc/org.gnome.libxml2/**"  = "usr/share/doc/org.gnome.libxml2"
