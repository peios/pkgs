# libxslt — the XSLT engine and the EXSLT extension library, together: every
# consumer of one links the other, and they version in lockstep.

[package]
name        = "libxslt"
description = "libxslt - XSLT 1.0 processing library"

[dependencies]
glibc   = ">= 2.43"
libxml2 = ">= 2.15.3"

[files]
"@source:Copyright" = "usr/share/licenses/libxslt/"
":usr/lib/x86_64-linux-peios/libxslt.so.1*"  = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libexslt.so.0*" = "usr/lib/x86_64-linux-peios"
