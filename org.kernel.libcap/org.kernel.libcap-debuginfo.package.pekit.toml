[package]
name        = "org.kernel.libcap-debuginfo"
description = "Linux POSIX capabilities debugging symbols"

[dependencies]
"org.kernel.libcap"       = "= {{release}}"
"org.kernel.libcap-tools" = "= {{release}}"

[files]
"@source:License"   = "usr/share/licenses/org.kernel.libcap-debuginfo/License"
":usr/lib/debug/**" = "usr/lib/debug"
