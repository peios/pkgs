# libcap — POSIX capabilities library + tools; turbostat links libcap
# (PEI-158 Tier 2).
#
# NOT autotools — kernel.org Make.Rules variables, built in a tree copy because
# objects land in-tree. Go and PAM integrations remain disabled until their
# complete production dependency stacks are available. The C libraries,
# capability tools and complete unprivileged upstream suite are enabled.

out_dir = "out"

[source.url]
url         = "https://cdn.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-{{version}}.tar.xz"
listing_url = "https://cdn.kernel.org/pub/linux/libs/security/linux-privs/libcap2/"
extract     = true
root        = "libcap-{{version}}"
file_regex  = '^libcap-[0-9]+\.[0-9]+\.tar\.xz$'
# Soft maintenance floor. Follow every newer authenticated stable release;
# ABI or command changes stop at the staged-interface tests.
versions    = ">= 2.78"

# kernel.org signs the decompressed release tar, not its xz transport. Pin the
# complete fingerprint of Andrew G. Morgan's kernel.org automation key, which
# upstream's release target uses for the uploaded tar signature.
[source.url.signature]
url          = "https://cdn.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-{{version}}.tar.sign"
of           = "decompressed"
key_files    = ["keys/andrew-morgan-korg.asc"]
fingerprints = ["38A644698C69787344E954CE29EE848AE2CCF3F4"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
LIBDIR="$PEKIT_OUT/usr/lib/x86_64-linux-peios"
BIN="$PEKIT_OUT/usr/bin"
mkdir -p "$PEKIT_OUT/build"
cp -a "$SRC/." "$PEKIT_OUT/build/"
cd "$PEKIT_OUT/build"
make -j"$(nproc)" prefix=/usr lib=lib/x86_64-linux-peios \
  SBINDIR=/usr/bin GOLANG=no PAM_CAP=no RAISE_SETFCAP=no

make install DESTDIR="$PEKIT_OUT" prefix=/usr lib=lib/x86_64-linux-peios \
  SBINDIR=/usr/bin GOLANG=no PAM_CAP=no RAISE_SETFCAP=no

# Do not ship manuals for disabled Go/PAM components as if their commands and
# module were installed.
rm -f "$PEKIT_OUT/usr/share/man/man8/captree.8" \
      "$PEKIT_OUT/usr/share/man/man8/pam_cap.8" \
      "$PEKIT_OUT/usr/share/man/man5/capability.conf.5"

CAP_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libcap.so.2.*' -print)
PSX_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libpsx.so.2.*' -print)

# Produce conventional build-ID debuginfo for both libraries and all four
# commands, and copy precisely the source paths referenced by rewritten DWARF.
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
for elf in "$CAP_SO" "$PSX_SO" \
           "$BIN/capsh" "$BIN/getcap" "$BIN/getpcaps" "$BIN/setcap"; do
  if readelf -d "$elf" | grep -Eq '(RPATH|RUNPATH)'; then
    patchelf --remove-rpath "$elf"
  fi
  if readelf -d "$elf" | grep -F 'Shared library: [ld-linux-x86-64.so.2]'; then
    patchelf --remove-needed ld-linux-x86-64.so.2 "$elf"
  fi
  debugedit -b "$ROOT" -d /usr/src/debug/org.kernel.libcap \
    -l "$PEKIT_OUT/.dl" -n "$elf"
  cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id"
  id_dir=$(printf %s "$build_id" | cut -c1-2)
  id_file=$(printf %s "$build_id" | cut -c3-)
  mkdir -p "$PEKIT_OUT/usr/lib/debug/.build-id/$id_dir"
  objcopy --only-keep-debug "$elf" \
    "$PEKIT_OUT/usr/lib/debug/.build-id/$id_dir/$id_file.debug"
  chmod 0644 "$PEKIT_OUT/usr/lib/debug/.build-id/$id_dir/$id_file.debug"
  strip "$elf"
done
strip --strip-debug "$LIBDIR/libcap.a" "$LIBDIR/libpsx.a"

tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | LC_ALL=C sort -u \
  | while IFS= read -r rel; do
      test -n "$rel" || continue
      case "$rel" in */) continue;; esac
      test -f "$ROOT/$rel" || continue
      mkdir -p "$PEKIT_OUT/usr/src/debug/org.kernel.libcap/$(dirname "$rel")"
      cp "$ROOT/$rel" "$PEKIT_OUT/usr/src/debug/org.kernel.libcap/$rel"
    done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""

[test]
needs = ["main"]
gate = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
BUILD="$STAGE/build"
LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
BIN="$STAGE/usr/bin"
SMOKE="$PEKIT_OUT/smoke"

make -C "$BUILD" -j"$(nproc)" test prefix=/usr lib=lib/x86_64-linux-peios \
  SBINDIR=/usr/bin GOLANG=no PAM_CAP=no RAISE_SETFCAP=no

for tool in capsh getcap getpcaps setcap; do test -x "$BIN/$tool"; done
CAP_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libcap.so.2.*' -print)
PSX_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libpsx.so.2.*' -print)
test "$(printf '%s\n' "$CAP_SO" | grep -c .)" -eq 1
test "$(printf '%s\n' "$PSX_SO" | grep -c .)" -eq 1
test -s "$LIBDIR/libcap.a"
test -s "$LIBDIR/libpsx.a"
test -L "$LIBDIR/libcap.so"
test -L "$LIBDIR/libpsx.so"
readelf -d "$CAP_SO" | grep -F 'Library soname: [libcap.so.2]'
readelf -d "$PSX_SO" | grep -F 'Library soname: [libpsx.so.2]'
export LD_LIBRARY_PATH="$LIBDIR:/usr/lib/x86_64-linux-peios"

mkdir -p "$SMOKE"
cat > "$SMOKE/consumer.c" <<'EOF'
#include <stddef.h>
#include <sys/capability.h>
int main(void) {
  cap_t caps = cap_from_text("cap_net_bind_service=ep");
  cap_flag_value_t value = CAP_CLEAR;
  if (caps == NULL) return 1;
  if (cap_get_flag(caps, CAP_NET_BIND_SERVICE, CAP_EFFECTIVE, &value) != 0) return 2;
  cap_free(caps);
  return value == CAP_SET ? 0 : 3;
}
EOF
cat > "$SMOKE/psx-consumer.c" <<'EOF'
#include <sys/psx_syscall.h>
int main(void) { return psx_set_sensitivity(PSX_IGNORE) == 0 ? 0 : 1; }
EOF
PKG_CONFIG_LIBDIR="$LIBDIR/pkgconfig" pkg-config --validate libcap libpsx
test "$(PKG_CONFIG_LIBDIR="$LIBDIR/pkgconfig" pkg-config --modversion libcap)" = "$PEKIT_VERSION"
cc "$SMOKE/consumer.c" -I"$STAGE/usr/include" -L"$LIBDIR" \
  -Wl,-rpath-link,"$LIBDIR" -lcap -o "$SMOKE/shared"
"$SMOKE/shared"
cc "$SMOKE/consumer.c" -I"$STAGE/usr/include" "$LIBDIR/libcap.a" -o "$SMOKE/static"
"$SMOKE/static"
cc "$SMOKE/psx-consumer.c" -I"$STAGE/usr/include" -L"$LIBDIR" \
  -Wl,-rpath-link,"$LIBDIR" -lpsx -pthread -o "$SMOKE/psx-shared"
"$SMOKE/psx-shared"
cc "$SMOKE/psx-consumer.c" -I"$STAGE/usr/include" "$LIBDIR/libpsx.a" \
  -pthread -o "$SMOKE/psx-static"
"$SMOKE/psx-static"

: > "$SMOKE/file"
test -z "$("$BIN/getcap" "$SMOKE/file")"
"$BIN/setcap" -h > "$SMOKE/setcap.help" 2>&1
grep -F 'cap_from_text(3) formatted file capability' "$SMOKE/setcap.help"
"$BIN/capsh" --decode=0000000000000400 | grep -F 'cap_net_bind_service'
"$BIN/capsh" --print | grep -F 'Current:'
"$BIN/getpcaps" $$ | grep -F "$$:"

test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 6
test -n "$(find "$STAGE/usr/src/debug/org.kernel.libcap" -type f -print -quit)"
for elf in "$CAP_SO" "$PSX_SO" \
           "$BIN/capsh" "$BIN/getcap" "$BIN/getpcaps" "$BIN/setcap"; do
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -W -l "$elf" | grep -F 'GNU_RELRO'
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  readelf -n "$elf" | grep -F 'x86 feature: IBT, SHSTK'
  if readelf -d "$elf" | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
done
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.bash"                 = "*"
"org.pkgconf.pkgconf"          = "*"

[test.dependencies.apt]
build-essential = "*"
bash            = "*"
pkgconf         = "*"

# bash: progs/mkcapshdoc.sh is a bash script.
[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.bash" = "*"
"org.pkgconf.pkgconf" = "*"

[build.main.dependencies.apt]
build-essential = "*"
bash = "*"
debugedit = "*"
patchelf = "*"
pkgconf = "*"
