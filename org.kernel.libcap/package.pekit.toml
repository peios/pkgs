# Shared defaults layer for the libcap members (a bare package.pekit.toml
# is never a package once named members exist).

format = "peipkg"

[package]
version       = "{{version}}-2"
architecture  = "x86_64"
license       = "BSD-3-Clause OR GPL-2.0-only"
license_class = "free"
homepage      = "https://sites.google.com/site/fullycapable/"
