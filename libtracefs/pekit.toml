# libtracefs — tracefs interaction library; rtla and rv drive the kernel
# tracers through it (PEI-158 Tier 2).
#
# kernel.org git snapshot tarball, plain Makefile build in a tree copy
# (the libtraceevent shape — same upstream family, same meson-first
# posture with a maintained Makefile). Links libtraceevent via pkg-config.

out_dir = "out"

[source.url]
url      = "https://git.kernel.org/pub/scm/libs/libtrace/libtracefs.git/snapshot/libtracefs-{{version}}.tar.gz"
extract  = true
root     = "libtracefs-{{version}}"
versions = ">= 1.8.3"

[build.main]
command = """
SRC="$(pwd)"
LIBDIR=/usr/lib/x86_64-linux-peios
mkdir -p "$PEKIT_OUT/build"
cp -a "$SRC/." "$PEKIT_OUT/build/"
cd "$PEKIT_OUT/build"
make -j"$(nproc)" prefix=/usr libdir="$LIBDIR"
make install DESTDIR="$PEKIT_OUT" prefix=/usr libdir="$LIBDIR"
find "$PEKIT_OUT$LIBDIR" -maxdepth 1 -name '*.a' -delete
rm -rf "$PEKIT_OUT/build"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
pkgconf = "*"
"libtraceevent-devel" = "*"
bison = "*"
flex = "*"

[build.main.dependencies.apt]
build-essential = "*"
pkg-config = "*"
libtraceevent-dev = "*"
bison = "*"
flex = "*"
