# numactl provides the libnuma ABI and NUMA policy command suite. Upstream's
# release asset and tag are unsigned, so Pekit's Git lock pins every accepted
# stable tag to its exact commit.

tags = ["bootstrap"]
out_dir = "out"

[source.git]
url       = "https://github.com/numactl/numactl.git"
ref       = "v{{version}}"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
# Soft maintenance floor. Stable releases advance automatically; compatibility
# changes must pass the build and independent test gates below.
versions  = ">= 2.0.19"

[build.main]
command = '''
set -eu
SRC="$(pwd)"
BUILD="$PEKIT_OUT/build"
BOOTSTRAP="$PEKIT_OUT/bootstrap-source"
LIBDIR=/usr/lib/x86_64-linux-peios
STAGED_LIBDIR="$PEKIT_OUT$LIBDIR"

mkdir -p "$BUILD" "$BOOTSTRAP"
cp -a "$SRC/." "$BOOTSTRAP/"
cd "$BOOTSTRAP"
autoreconf -fiv
cd "$BUILD"
# Keep DWARF paths physical until debugedit collects their actual source files.
# Only macro-expanded strings need remapping at compile time.
DEBUG_ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$DEBUG_ROOT=/usr/src/debug/io.github.numactl.numactl" \
"$BOOTSTRAP/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --libdir="$LIBDIR" \
  --disable-silent-rules \
  --enable-shared \
  --enable-static

make -j"$(nproc)"

make install DESTDIR="$PEKIT_OUT"
find "$STAGED_LIBDIR" -maxdepth 1 -name '*.la' -delete
find "$PEKIT_OUT/usr/share/man" -type f ! -name '*.gz' \
  -exec gzip -n -9 -- {} +

# libtool links the commands against the just-built libnuma with
# `-rpath /usr/lib/x86_64-linux-peios`, because it does not know Peios' loader
# already searches that directory, so every command carries it as RUNPATH.
# Remove it; the gate and lint reject any run path that remains.
for f in "$PEKIT_OUT"/usr/bin/*; do
  [ "$(head -c 4 "$f" | tail -c 3)" = ELF ] || continue
  patchelf --remove-rpath "$f"
done

# Split build-ID-indexed debug data and stage every DWARF-referenced source.
# Static archives retain code while dropping their debug sections.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" io.github.numactl.numactl "$PEKIT_OUT/usr"
'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c"   = "*"
"org.sourceware.debugedit"            = "*"
"org.gnu.gcc-libatomic-static"     = "*"
"org.gnu.autoconf"  = "*"
"org.gnu.automake"  = "*"
"org.gnu.bash"      = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.diffutils" = "*"
"org.gnu.gawk"      = "*"
"org.gnu.grep"      = "*"
"org.gnu.libtool"   = "*"
"org.gnu.sed"                 = "*"
"org.nixos.patchelf"             = "*"
"org.pkgconf.pkgconf"              = "*"
"org.gnu.gzip"                     = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# Compile the complete upstream test-program set in every environment. Run the
# full hardware suite when the runner exposes a NUMA topology; Pekit's isolated
# roots currently do not, so their mandatory gate is upstream's topology-
# independent bitmap/API test. PEI-705 tracks a hardware test runner.
cd "$PEKIT_MAIN_OUT/build"
if command -v taskset >/dev/null 2>&1 && \
   ./numactl --hardware 2>/dev/null | grep -Eq '^available: [1-9][0-9]* nodes?'; then
  make -j"$(nproc)" check
else
  make -j"$(nproc)" check TESTS='test/tbitmap'
fi
STAGE="$PEKIT_MAIN_OUT"
STAGED_LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
SMOKE="$PEKIT_OUT/numactl-smoke"
mkdir -p "$SMOKE"

find "$STAGE/usr/bin" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$SMOKE/installed-tools"
printf '%s\n' memhog migratepages migspeed numactl numademo numastat \
  | LC_ALL=C sort > "$SMOKE/expected-tools"
diff -u "$SMOKE/expected-tools" "$SMOKE/installed-tools"
NUMA_SO=$(find "$STAGED_LIBDIR" -maxdepth 1 -type f -name 'libnuma.so.1.*')
test "$(printf '%s\n' "$NUMA_SO" | grep -c .)" -eq 1
test -L "$STAGED_LIBDIR/libnuma.so.1"
test -L "$STAGED_LIBDIR/libnuma.so"
test -f "$STAGED_LIBDIR/libnuma.a"
test -f "$STAGED_LIBDIR/pkgconfig/numa.pc"
test -f "$STAGE/usr/include/numa.h"
readelf -d "$NUMA_SO" | grep -F 'Library soname: [libnuma.so.1]'
readelf --version-info "$NUMA_SO" | grep -F 'libnuma_2.1'
PCDIR="$STAGED_LIBDIR/pkgconfig"
test "$(PKG_CONFIG_PATH="$PCDIR" PKG_CONFIG_SYSROOT_DIR="$STAGE" \
  pkgconf --modversion numa)" = "$PEKIT_VERSION"
LD_LIBRARY_PATH="$STAGED_LIBDIR" "$STAGE/usr/bin/numactl" --version | grep -F "$PEKIT_VERSION"

cat > "$SMOKE/numa.c" <<'EOF'
#include <numa.h>
int main(void) {
  struct bitmask *mask = numa_bitmask_alloc(64);
  if (mask == NULL) return 1;
  numa_bitmask_setbit(mask, 3);
  int ok = numa_bitmask_isbitset(mask, 3) && numa_bitmask_weight(mask) == 1;
  numa_bitmask_free(mask);
  return ok ? 0 : 1;
}
EOF
NUMA_CFLAGS="-I$STAGE/usr/include $(PKG_CONFIG_PATH="$PCDIR" PKG_CONFIG_SYSROOT_DIR="$STAGE" pkgconf --cflags numa)"
NUMA_LIBS=$(PKG_CONFIG_PATH="$PCDIR" PKG_CONFIG_SYSROOT_DIR="$STAGE" pkgconf --libs numa)
NUMA_STATIC_LIBS=$(PKG_CONFIG_PATH="$PCDIR" PKG_CONFIG_SYSROOT_DIR="$STAGE" pkgconf --static --libs numa)
cc $NUMA_CFLAGS "$SMOKE/numa.c" -L"$STAGED_LIBDIR" $NUMA_LIBS -o "$SMOKE/shared"
LD_LIBRARY_PATH="$STAGED_LIBDIR" "$SMOKE/shared"
cc $NUMA_CFLAGS "$SMOKE/numa.c" -L"$STAGED_LIBDIR" -Wl,-Bstatic \
  $NUMA_STATIC_LIBS -Wl,-Bdynamic -o "$SMOKE/static"
"$SMOKE/static"

test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 7
test -n "$(find "$STAGE/usr/src/debug/io.github.numactl.numactl" -type f -print -quit)"
find "$STAGE/usr/bin" "$STAGED_LIBDIR" -type f ! -type l ! -name '*.a' | while IFS= read -r elf; do
  readelf -h "$elf" >/dev/null 2>&1 || continue
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep -F 'GNU_RELRO'
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  readelf -W -l "$elf" | grep -E 'GNU_STACK.*RW '
  if readelf -d "$elf" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
  readelf -n "$elf" | grep -E 'x86 feature:.*IBT.*SHSTK'
done
rm -rf "$SMOKE"
rm -rf "$PEKIT_MAIN_OUT/build" "$PEKIT_MAIN_OUT/bootstrap-source"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.sourceware.debugedit" = "*"
"org.gnu.gcc-libatomic-static" = "*"
"org.gnu.autoconf" = "*"
"org.gnu.automake" = "*"
"org.gnu.bash" = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.diffutils" = "*"
"org.gnu.gawk" = "*"
"org.gnu.grep" = "*"
"org.gnu.libtool" = "*"
"org.gnu.sed" = "*"
"org.pkgconf.pkgconf" = "*"
"org.git.kernel.dash" = "*"
