format = "peipkg"

[package]
name         = "sed"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU sed - the stream editor"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/sed/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING*" = "usr/share/licenses/sed/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
