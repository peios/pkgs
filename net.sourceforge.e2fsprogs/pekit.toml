# e2fsprogs — the ext2/3/4 filesystem userspace (mke2fs/mkfs.ext*, e2fsck/
# fsck.ext*, tune2fs, resize2fs, dumpe2fs, debugfs) plus the libcom_err/libss/
# libe2p/libext2fs support libraries.
#
# Peios PACKAGES e2fsprogs upstream rather than reimplementing it in peiosutils:
# mkfs.* write a Linux-compatible on-disk format Peios deliberately mirrors —
# they sit BELOW the security seam (mount is the seam, not mkfs). See the
# mkfs-e2fsprogs-packaging design note. What Peios needs on top of stock
# e2fsprogs is a small maintained patchset (SDs-are-xattrs), carried as a
# pekit patch series:
#
#   * -E root_sddl=<sddl>     : stamp an explicit Security Descriptor on the
#     -E root_sd_file=<path>    root inode (+ lost+found) at format time — the
#                               OS rootfs gets a deterministic SD, not one
#                               synthesised at mount. Parsed by libpeios
#                               peios_sddl_parse_sd().
#   * -d reinherit       : SD-aware tree population — compute each node's SD via
#                          libpeios peios_sd_reinherit() during the populate walk
#                          (pure userspace; no live kernel/KACS needed).
#
# Patch 3 rewrites mke2fs.conf.in, which misc/Makefile.in feeds through
# profile-to-c.awk into default_profile.c — so the Peios defaults (inode_size
# 512, ea_inode, no acl) are COMPILED INTO mke2fs and apply even where no
# /etc/mke2fs.conf exists. That is why the package deliberately ships no conf
# file (see e2fsprogs.package.pekit.toml).
#
# Patch dev: `pekit lock --latest` materialises the patched release
# under out/ (pekit applies patches/series during source materialisation);
# edit there and regenerate diffs into patches/. pekit applies strictly — no
# fuzz — so on a version bump a stale patch fails loudly; rebase it manually
# against the new tag.
#
#   pekit publish --latest --env peipkg --keyring dev --all

out_dir = "out"

# Follow the canonical kernel.org release archive.  Releases are enumerated
# from its version-directory index, authenticated with Theodore Ts'o's
# detached signature, and then hash-pinned in pekit.lock.  The version floor is
# maintenance policy, not a compatibility claim.
[source]
patches = "patches"

[source.url]
url        = "https://cdn.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v{{version}}/e2fsprogs-{{version}}.tar.xz"
extract    = true
root       = "e2fsprogs-{{version}}"
file_regex = 'v[0-9]+\.[0-9]+(\.[0-9]+)?/'
versions   = ">= 1.47.4"

[source.url.signature]
key_files    = ["keys/theodore-tso.asc"]
url          = "https://cdn.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v{{version}}/e2fsprogs-{{version}}.tar.sign"
fingerprints = ["3AB057B7E78D945C8C5591FBD36F769BC11804F0"]
of           = "decompressed"

# --- main: out-of-source configure/make/install -----------------------------
#   --enable-elf-shlibs : build the shared support libraries.
#   bundled libblkid/libuuid left ON (default). The split of ownership is
#       deliberate and asymmetric: e2fsprogs SHIPS libuuid (org.kernel.util-linux
#       builds with --disable-libuuid), and org.kernel.libblkid SHIPS libblkid
#       (this build's copy is compiled but claimed by no package, so it never
#       enters a payload). The tools therefore link the bundled libblkid at
#       build time and resolve DT_NEEDED libblkid.so.1 to util-linux-lib's at
#       runtime. Verified safe: all 20 blkid_* symbols the shipped binaries
#       reference are exported by util-linux 2.42.3's libblkid.so.1, and the
#       bundled library is unversioned so the loader binds the defaults.
#       Building --disable-libblkid instead would be tidier but needs
#       libblkid-devel, which is not published.
#   --sysconfdir=/etc : the RUNTIME lookup path (PFSL's merged /etc view), not
#       a payload destination — the conf files it governs are unclaimed.
#   --sbindir=/usr/bin : /sbin is for daemons, which appear in service
#       definitions; mke2fs, e2fsck, tune2fs and friends are privileged
#       binaries a PERSON runs, so they belong in /usr/bin. One flag suffices
#       even though 46 install rules use $(root_sbindir) rather than
#       $(sbindir): configure.ac sets `root_sbindir=$sbindir` whenever
#       --sbindir is non-default. (The same clause governs root_libdir, which
#       is why --libdir alone already produces the triplet layout.)
[build.main]
command = """
SRC="$PEKIT_SOURCE_ROOT"
cd "$PEKIT_OUT"

# CC is left to the environment: the workspace CFLAGS already carry -g (the
# debug split below needs it), and libpeios comes from libpeios-devel in the
# composed root — its header tree is on the default include path and gcc's
# triplet libdir is on the default link path, so the patched mke2fs/debugfs
# link lines' bare -lpeios resolves with no injection. The result carries a
# normal DT_NEEDED libpeios.so.0 and no rpath.
#
# The three --without-* are pinned, not left to detection. e2fsprogs sniffs
# the BUILD HOST for a cron.d directory, a systemd pkg-config, and a udev
# pkg-config, and installs e2scrub's cron job / service units / udev rules if
# it finds them. Peios has none of the three, so the answer is always "no" —
# but leaving it to detection makes the payload a property of whatever the
# build ran inside. The pre-rung-2 build did find a cron.d on the host and
# staged usr/libexec/e2fsprogs/e2scrub_all_cron + etc/cron.d/e2scrub_all,
# which the rung-2 build does not. Pinned so the answer is the recipe's.
"$SRC/configure" \
  --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios \
  --sbindir=/usr/bin --sysconfdir=/etc \
  --without-crond-dir --without-systemd-unit-dir --without-udev-rules-dir \
  --enable-elf-shlibs --disable-nls
make -j"$(nproc)"
make check
make install DESTDIR="$PEKIT_OUT"
make install-libs DESTDIR="$PEKIT_OUT"

# Exercise both Peios-specific behavior patches, not merely upstream's stock
# suite.  The helper creates the portable user.peios.sd staging xattr and also
# computes the expected binary descriptors independently through libpeios.
export LD_LIBRARY_PATH="$PEKIT_OUT/usr/lib/x86_64-linux-peios${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
SMOKE="$PEKIT_OUT/.peios-sd-smoke"
mkdir -p "$SMOKE/tree/dir"
touch "$SMOKE/tree/file"
cc -Wall -Wextra -Werror -o "$SMOKE/sd-fixture" \
  "$PEKIT_RECIPE_ROOT/tests/sd-fixture.c" -lpeios

ROOT_SDDL='O:SYG:SYD:(A;OICI;GA;;;SY)'
CHILD_SDDL='O:BAG:BAD:(A;;GR;;;BA)'
printf '%s\n' "$ROOT_SDDL" > "$SMOKE/root.sddl"
"$SMOKE/sd-fixture" parse "$ROOT_SDDL" "$SMOKE/root.expected"
"$SMOKE/sd-fixture" stage "$CHILD_SDDL" "$SMOKE/tree/dir"
"$SMOKE/sd-fixture" stage "$CHILD_SDDL" "$SMOKE/tree/file"
"$SMOKE/sd-fixture" inherit "$ROOT_SDDL" "$CHILD_SDDL" 1 \
  "$SMOKE/dir.expected"
"$SMOKE/sd-fixture" inherit "$ROOT_SDDL" "$CHILD_SDDL" 0 \
  "$SMOKE/file.expected"

truncate -s 32M "$SMOKE/file-option.img"
misc/mke2fs -q -t ext4 -d "$SMOKE/tree" \
  -E "root_sd_file=$SMOKE/root.sddl" "$SMOKE/file-option.img"
debugfs/debugfs -R \
  "ea_get <2> security.peios.sd -f $SMOKE/root.actual" \
  "$SMOKE/file-option.img"
debugfs/debugfs -R \
  "ea_get /lost+found security.peios.sd -f $SMOKE/lost.actual" \
  "$SMOKE/file-option.img"
debugfs/debugfs -R \
  "ea_get /dir security.peios.sd -f $SMOKE/dir.actual" \
  "$SMOKE/file-option.img"
debugfs/debugfs -R \
  "ea_get /file security.peios.sd -f $SMOKE/file.actual" \
  "$SMOKE/file-option.img"
cmp "$SMOKE/root.expected" "$SMOKE/root.actual"
cmp "$SMOKE/root.expected" "$SMOKE/lost.actual"
cmp "$SMOKE/dir.expected" "$SMOKE/dir.actual"
cmp "$SMOKE/file.expected" "$SMOKE/file.actual"

# Cover the inline option separately; root_sd_file above also proves trailing
# newline handling.  A malformed descriptor must be rejected rather than
# silently creating an unstamped filesystem.
truncate -s 32M "$SMOKE/inline-option.img"
misc/mke2fs -q -t ext4 -E "root_sddl=$ROOT_SDDL" \
  "$SMOKE/inline-option.img"
debugfs/debugfs -R \
  "ea_get <2> security.peios.sd -f $SMOKE/inline.actual" \
  "$SMOKE/inline-option.img"
cmp "$SMOKE/root.expected" "$SMOKE/inline.actual"
truncate -s 32M "$SMOKE/invalid.img"
if misc/mke2fs -q -t ext4 -E root_sddl=not-sddl "$SMOKE/invalid.img"; then
  echo "mke2fs accepted an invalid root_sddl" >&2
  exit 1
fi
rm -rf "$SMOKE"

# Drop libtool archives (hardcoded paths + overlink; DT_NEEDED supersedes).
find "$PEKIT_OUT/usr" -name '*.la' -delete

# --- multicall aliases: hard links -> symlinks, and fsck backends to libexec --
#
# e2fsprogs ships four argv[0]-dispatch programs whose aliases are installed as
# HARD links, so each alias is a full copy of the binary as far as anything
# outside the build tree is concerned. The peipkg format has no hard-link
# representation (pack validates symlinks only, §3.4: relative, resolving
# inside the tree), so those copies are what actually get installed — four
# 352 KB e2fsck images, four 150 KB mke2fs images. Relative symlinks carry the
# same argv[0] dispatch and cost a few bytes.
#
# The fsck.<type> aliases additionally MOVE to /usr/libexec/fsck/. They are not
# commands a person types — they are the private interface `fsck` execs after
# choosing a type — and libexec is exactly that distinction. The patched
# fsck_prefix_path looks there (misc/fsck-backend-dir.patch). The canonical
# checker, e2fsck, stays in /usr/bin.
#
# `../../bin/<prog>` is deliberately relative and deliberately two levels up: it
# resolves to /usr/bin/<prog> against the packaging path and to /bin/<prog>
# against the runtime StrataFS view. One link, correct in both.
cd "$PEKIT_OUT/usr/bin"
for alias in e2mmpstatus:dumpe2fs e2label:tune2fs findfs:tune2fs \
             mkfs.ext2:mke2fs mkfs.ext3:mke2fs mkfs.ext4:mke2fs; do
  ln -sfn "${alias#*:}" "${alias%%:*}"
done

mkdir -p "$PEKIT_OUT/usr/libexec/fsck"
for t in ext2 ext3 ext4; do
  rm -f "$PEKIT_OUT/usr/bin/fsck.$t"
  ln -s ../../bin/e2fsck "$PEKIT_OUT/usr/libexec/fsck/fsck.$t"
done

# Debug split (same shape as util-linux-lib/gmp/glibc): debugedit scrubs the
# build path (-> /usr/src/debug/net.sourceforge.e2fsprogs) and records referenced sources;
# split debug info build-id-indexed under usr/lib/debug/.build-id; strip the
# shipped ELF; stage the referenced sources. The .c sources live in
# $PEKIT_SOURCE_ROOT (the compiler saw absolute paths to it).
SRCROOT="$PEKIT_SOURCE_ROOT"
cd "$PEKIT_OUT"
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  patchelf --remove-rpath "$f" 2>/dev/null || true
  debugedit -b "$SRCROOT" -d /usr/src/debug/net.sourceforge.e2fsprogs -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$SRCROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/net.sourceforge.e2fsprogs/$(dirname "$rel")"
  cp "$SRCROOT/$rel" "usr/src/debug/net.sourceforge.e2fsprogs/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""

[build.main.dependencies.peipkg]
# The C floor: compiler, binutils, libc/kernel headers, the shell + userland
# every build assumes, and the debug-split tools (debugedit, patchelf; strip/
# objcopy/readelf come with binutils) the command below invokes.
build-essentials-c = "*"
# makeinfo, for doc/libext2fs.info (claimed as usr/share/info/**).
texinfo = "*"
pkgconf = "*"
# The Peios patches call peios_sddl_parse_sd() / peios_sd_reinherit(), so the
# build needs libpeios's headers and dev symlink; -devel pulls kernel-headers
# for the <pkm/*.h> those headers include. This replaces the vendored deps/
# bridge the recipe used before libpeios published (deps/README.md).
libpeios = "*"
libpeios-devel = "*"

# The upstream regression suite stores several filesystem images as compressed
# fixtures and unpacks them with the command-line tools.  `which` is used by
# its feature probes; declare all four instead of inheriting them accidentally
# from a developer's build root.
"org.sourceware.bzip2" = "*"
gzip = "*"
tar = "*"
which = "*"

# No [build.main.dependencies.apt]: this recipe is rung-2 only. Debian has no
# libpeios, so the apt provider cannot satisfy the patchset's link dependency
# — the same reason `kernel` is peipkg-only. Build it with --env peipkg.
