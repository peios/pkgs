# libext2fs — runtime shared library from the e2fsprogs source tree.

[package]
name        = "net.sourceforge.e2fsprogs-libext2fs"
description = "Ext2/3/4 filesystem access runtime library (libext2fs)"
license     = "LGPL-2.0-only"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:NOTICE" = "usr/share/licenses/net.sourceforge.e2fsprogs-libext2fs/"
# Versioned runtime lib + soname symlink; the unversioned dev .so is -devel's,
# the static .a is -static's.
":usr/lib/x86_64-linux-peios/libext2fs.so.*" = "usr/lib/x86_64-linux-peios"
