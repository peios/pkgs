# libcap — the capabilities runtime libraries (libcap + libpsx) and the
# capability tools (setcap/getcap/capsh/...).

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "libcap"
description = "libcap - POSIX capabilities runtime libraries and tools"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:License" = "usr/share/licenses/libcap/"
":usr/bin/**"     = "usr/bin"
":usr/lib/x86_64-linux-peios/libcap.so.2*" = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libpsx.so.2*" = "usr/lib/x86_64-linux-peios"
":usr/share/man/**" = "usr/share/man"
