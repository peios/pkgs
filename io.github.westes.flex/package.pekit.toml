# Shared metadata for Flex binaries, libraries, development files, debug
# material and generated corresponding source.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "BSD-2-Clause AND (GPL-3.0-or-later WITH Bison-exception-2.2) AND (GPL-2.0-or-later WITH Autoconf-exception-generic) AND (GPL-3.0-or-later WITH Autoconf-exception-generic-3.0) AND (GPL-3.0-or-later WITH Texinfo-exception) AND FSFAP AND FSFUL AND FSFULLR AND X11 AND LicenseRef-Public-Domain"
license_class = "free"
homepage      = "https://github.com/westes/flex"
