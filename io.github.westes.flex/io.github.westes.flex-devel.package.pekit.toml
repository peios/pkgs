[package]
name        = "io.github.westes.flex-devel"
description = "Flex C++ header and libfl development interface"

[dependencies]
"io.github.westes.flex"      = "= {{release}}"
"io.github.westes.flex-libs" = "= {{release}}"

[files]
"@source:COPYING"                       = "usr/share/licenses/io.github.westes.flex-devel/"
":usr/include/FlexLexer.h"             = "usr/include/FlexLexer.h"
":usr/lib/x86_64-linux-peios/libfl.so" = "usr/lib/x86_64-linux-peios/libfl.so"
":usr/lib/x86_64-linux-peios/libfl.a"  = "usr/lib/x86_64-linux-peios/libfl.a"
