# Flex — the fast lexical analyser generator. The signed release tarball
# carries its generated bootstrap sources, while the build still exercises
# Flex's self-hosting path and complete native regression suite.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source.url]
url         = "https://github.com/westes/flex/releases/download/v{{version}}/flex-{{version}}.tar.gz"
listing_url = "https://api.github.com/repos/westes/flex/releases?per_page=100"
extract     = true
root        = "flex-{{version}}"
file_regex  = 'flex-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz'
# Soft maintenance floor. Follow authenticated stable releases automatically;
# compatibility changes must pass the build and independent test gates.
versions    = ">= 2.6.4"

# The upstream release announcement identifies Will Estes's key, and the
# detached GitHub release signature verifies with this exact primary key.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/will-estes.asc"]
fingerprints = ["56C67868E93390AA1039AD1CE4B29C8D64885307"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
cd "$PEKIT_OUT"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
# Let split-debug collect physical source paths before remapping DWARF.
CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/io.github.westes.flex" \
CXXFLAGS="${CXXFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/io.github.westes.flex" \
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --libdir=/usr/lib/x86_64-linux-peios \
  --enable-shared --enable-static --disable-nls
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr/share/man" -type f ! -name '*.gz' \
  -exec gzip -n -9 -- {} +
ln -sf flex.1.gz "$PEKIT_OUT/usr/share/man/man1/flex++.1.gz"

# Peios has no Info reader. Keep the command manual, but do not ship orphaned
# release prose or libtool archives.
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"
find "$PEKIT_OUT/usr/lib/x86_64-linux-peios" -name '*.la' -delete

BIN="$PEKIT_OUT/usr/bin/flex"
LIBDIR="$PEKIT_OUT/usr/lib/x86_64-linux-peios"

# Conventional build-ID debuginfo and exact DWARF-referenced sources for both
# the generator and libfl runtime; the static libfl keeps its code and loses
# only its DWARF.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" io.github.westes.flex \
  "$BIN" "$LIBDIR/libfl.so.2.0.0" "$LIBDIR/libfl.a"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.bison" = "*"
"org.gnu.m4" = "*"
"org.sourceware.debugedit" = "*"
"org.gnu.gzip" = "*"

[build.main.dependencies.apt]
build-essential = "*"
bison = "*"
debugedit = "*"
m4 = "*"
gzip = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# This includes Flex's C, C++, reentrant, Bison-interoperability, tables,
# pthread and self-hosted scanner cases.
cd "$PEKIT_MAIN_OUT"
make -j"$(nproc)" check
STAGE="$PEKIT_MAIN_OUT"
BIN="$STAGE/usr/bin/flex"
LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
test -x "$BIN"
test -f "$STAGE/usr/include/FlexLexer.h"
test -f "$LIBDIR/libfl.a"
test "$(readlink "$STAGE/usr/bin/flex++")" = flex
test "$(readlink "$LIBDIR/libfl.so")" = libfl.so.2.0.0
test "$(readlink "$LIBDIR/libfl.so.2")" = libfl.so.2.0.0

SMOKE="$PEKIT_OUT/flex-smoke"
mkdir -p "$SMOKE"
printf '%s\n' '%option noyywrap nodefault' '%%' \
  '[0-9]+ { printf("N:%s\n", yytext); }' '[[:space:]]+ ;' '. return 2;' \
  '%%' 'int main(void) { return yylex(); }' > "$SMOKE/scanner.l"
"$BIN" --warn -o "$SMOKE/scanner.c" "$SMOKE/scanner.l"
cc -Werror -o "$SMOKE/scanner" "$SMOKE/scanner.c"
printf '%s\n' '12 34' | "$SMOKE/scanner" > "$SMOKE/c.out"
printf '%s\n' N:12 N:34 > "$SMOKE/c.expected"
cmp "$SMOKE/c.expected" "$SMOKE/c.out"

printf '%s\n' '%option c++ noyywrap nodefault' '%%' \
  '[a-z]+ { std::cout << "W:" << YYText() << std::endl; }' \
  '[[:space:]]+ ;' '. return 2;' '%%' > "$SMOKE/scanner.ll"
printf '%s\n' '#include <FlexLexer.h>' \
  'int main(void) { yyFlexLexer scanner; return scanner.yylex(); }' > "$SMOKE/cxx-main.cc"
"$STAGE/usr/bin/flex++" --warn -o "$SMOKE/scanner.cc" "$SMOKE/scanner.ll"
c++ -Werror -I"$STAGE/usr/include" -o "$SMOKE/scanner-cxx" \
  "$SMOKE/scanner.cc" "$SMOKE/cxx-main.cc"
printf '%s\n' 'alpha beta' | "$SMOKE/scanner-cxx" > "$SMOKE/cxx.out"
printf '%s\n' W:alpha W:beta > "$SMOKE/cxx.expected"
cmp "$SMOKE/cxx.expected" "$SMOKE/cxx.out"

printf '%s\n' '%%' '[a-z]+ ECHO;' '[[:space:]]+ ECHO;' '%%' > "$SMOKE/libfl.l"
"$BIN" --warn -o "$SMOKE/libfl.c" "$SMOKE/libfl.l"
cc -Werror -o "$SMOKE/libfl" "$SMOKE/libfl.c" \
  -L"$LIBDIR" -Wl,-rpath,"$LIBDIR" -lfl
printf '%s\n' libfl | "$SMOKE/libfl" > "$SMOKE/libfl.out"
printf '%s\n' libfl > "$SMOKE/libfl.expected"
cmp "$SMOKE/libfl.expected" "$SMOKE/libfl.out"
"$BIN" --version | head -1 | grep -F "$PEKIT_VERSION"
for elf in "$BIN" "$LIBDIR/libfl.so.2.0.0"; do
  readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  if readelf -d "$elf" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done
if readelf -SW "$LIBDIR/libfl.a" | grep -Eq '\.debug_(info|line)'; then
  echo "io.github.westes.flex: libfl.a still carries DWARF" >&2
  exit 1
fi
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.bison" = "*"
"org.gnu.m4" = "*"
"org.git.kernel.dash" = "*"

[test.dependencies.apt]
build-essential = "*"
bison = "*"
m4 = "*"
dash = "*"
