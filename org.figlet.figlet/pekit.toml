# FIGlet — render ordinary text as terminal-friendly banner lettering.
#
# Upstream has a small, stable hand-written Makefile. It does not support
# out-of-tree builds and overrides distribution flags by default, so build a
# private source copy and pass every compiler/linker setting explicitly.

out_dir = "out"

[source.git]
url       = "https://github.com/cmatsuoka/figlet.git"
ref       = "{{version}}"
tag_regex = '^(?P<version>[0-9]+\.[0-9]+(?:\.[0-9]+)*)$'
# Soft maintenance floor: retain the current production baseline and follow
# every newer stable upstream tag automatically. The release tags are not
# signed; Pekit's git lock still pins each accepted tag to its exact commit.
versions = ">= 2.2.5"

[build.main]
command = """
set -eu
SRC="$PEKIT_SOURCE_ROOT"
BUILD="$PEKIT_OUT/build"
FONTDIR="$PEKIT_OUT/usr/share/figlet"
BIN="$PEKIT_OUT/usr/bin"

mkdir -p "$BUILD"
cp -a "$SRC/." "$BUILD/"
cd "$BUILD"

# Upstream hardcodes gcc, -O2/-g and empty linker flags. Command-line
# assignments preserve the workspace's compiler and hardening contract.
make -j"$(nproc)" \
  SHELL=/usr/bin/sh CC=cc LD=cc \
  CFLAGS="${CFLAGS:?}" LDFLAGS="${LDFLAGS:?}" \
  DEFAULTFONTDIR=/usr/share/figlet

make install \
  SHELL=/usr/bin/sh CC=cc LD=cc \
  CFLAGS="${CFLAGS:?}" LDFLAGS="${LDFLAGS:?}" \
  DESTDIR="$PEKIT_OUT" BINDIR=/usr/bin MANDIR=/usr/share/man \
  DEFAULTFONTDIR=/usr/share/figlet

find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -n -9 {} \\;

# Conventional build-ID debuginfo plus the exact source files referenced by
# DWARF, with the private build copy rewritten to the canonical namespace.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" --build-root "$BUILD" \
  org.figlet.figlet "$BIN/figlet" "$BIN/chkfont"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c"   = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.diffutils" = "*"
"org.gnu.sed"                  = "*"
"org.sourceware.debugedit"            = "*"
"org.gnu.gzip"                        = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
BIN="$PEKIT_MAIN_OUT/usr/bin/figlet"
FONTDIR="$PEKIT_MAIN_OUT/usr/share/figlet"
test -n "$("$BIN" -d "$FONTDIR" -f standard PEIOS)"
case "$("$BIN" -v 2>&1)" in *"$PEKIT_VERSION"*) ;; *) exit 1;; esac

# Run the upstream release suite from the explicit package gate.
PEKIT_OUT="$PEKIT_MAIN_OUT"
cd "$PEKIT_OUT/build"
# All 26 upstream rendering regressions, including every shipped font,
# control files, TLF input, layout modes and right-to-left rendering.
make check \
  SHELL=/usr/bin/sh CC=cc LD=cc \
  CFLAGS="${CFLAGS:?}" LDFLAGS="${LDFLAGS:?}" \
  DEFAULTFONTDIR=/usr/share/figlet


# Exercise and audit the exact installed commands after staging.
PEKIT_OUT="$PEKIT_MAIN_OUT"
BIN="$PEKIT_OUT/usr/bin"
FONTDIR="$PEKIT_OUT/usr/share/figlet"
# Exercise all four installed commands against the staged font catalogue.
test "$("$BIN/figlet" -I1)" = 20205
test "$("$BIN/figlet" -I2)" = /usr/share/figlet
printf '%s\n' Peios | FIGLET_FONTDIR="$FONTDIR" "$BIN/figlet" \
  | grep -F '____'
find "$FONTDIR" -type f -name '*.flf' -print | LC_ALL=C sort \
  | while IFS= read -r font; do "$BIN/chkfont" "$font"; done
"$BIN/figlist" -d "$FONTDIR" | grep -Fx standard
"$BIN/showfigfonts" -d "$FONTDIR" Peios > "$PEKIT_OUT/.figlet-fonts"
grep -F 'standard :' "$PEKIT_OUT/.figlet-fonts"
grep -F 'Peios' "$PEKIT_OUT/.figlet-fonts"
rm -f "$PEKIT_OUT/.figlet-fonts"

# Enforce the workspace hardening contract on the final stripped executables.
for elf in "$BIN/figlet" "$BIN/chkfont"; do
  readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  if readelf -d "$elf" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done

rm -rf "$PEKIT_MAIN_OUT/build"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c"   = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.diffutils" = "*"
"org.gnu.sed"                  = "*"
"org.sourceware.debugedit"            = "*"
