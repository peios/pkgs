# dash — the Debian Almquist Shell: a small, fast, strict-POSIX /bin/sh.
#
# Peios's POSIX shell: the interpreter that scripts and prelude's initramfs
# hooks (#!/bin/sh) assume. Recipe-supplies path (like figlet) — dash is a
# plain autotools project with no pekit files of its own.
#
# Tarball source, not git: dash's git tree commits no `configure` (it needs
# autogen) and no generated parser, so the release tarball is the simpler,
# build-dep-light input — it ships both, leaving just gcc + make. Out-of-source
# build into the stage via DESTDIR, the same shape as the gmp/mpfr recipes.

out_dir = "out"

[source.url]
url      = "http://gondor.apana.org.au/~herbert/dash/files/dash-{{version}}.tar.gz"
extract  = true
root     = "dash-{{version}}"
versions = ">= 0.5.11"

[build.main]
command = """
SRC="$(pwd)"
# The dash tarball extracts with mtimes that make `make` think the shipped
# autotools outputs are stale (older than configure.ac/Makefile.am) and try to
# re-run aclocal/autoconf — tools we don't depend on, since the tarball already
# ships them. Touch the generated files so those maintainer rules stay inert.
find "$SRC" \\( -name aclocal.m4 -o -name configure -o -name config.h.in -o -name 'Makefile.in' \\) -exec touch {} +
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
"""

# Plain autotools C: gcc + make. The release tarball ships `configure` and the
# pre-generated arithmetic parser, so no autotools or yacc are required.
[build.main.dependencies.peipkg]
gcc = "*"
make = "*"

[build.main.dependencies.apt]
build-essential = "*"
