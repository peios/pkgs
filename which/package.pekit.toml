format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "which"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU which - locate a command on PATH"
license      = "GPL-3.0-or-later"
homepage     = "https://carlowood.github.io/which/"

[dependencies]
glibc       = ">= 2.43"
"libstdc++" = ">= 16"

[files]
"@source:COPYING"   = "usr/share/licenses/which/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
