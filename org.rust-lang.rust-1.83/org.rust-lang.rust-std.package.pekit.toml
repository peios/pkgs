[package]
name        = "org.rust-lang.rust-std"
description = "Rust standard libraries for x86_64-unknown-linux-gnu"

[provides]
rust-std = "{{version}}-2"

[dependencies]
"org.rust-lang.rust-common" = "= {{version}}-2"
glibc                        = ">= 2.43"
libgcc                       = ">= 16"

[files]
":usr/lib/x86_64-linux-peios/rustlib/manifest-rust-std-*" = "usr/lib/x86_64-linux-peios/rustlib"
":usr/lib/x86_64-linux-peios/rustlib/x86_64-unknown-linux-gnu/**" = "usr/lib/x86_64-linux-peios/rustlib/x86_64-unknown-linux-gnu"
