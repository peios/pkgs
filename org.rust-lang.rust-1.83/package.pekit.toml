# Shared metadata for the Rust 1.83 compiler suite. The suite member preserves
# the historical `rust` dependency contract while the payload is split into
# independently accountable compiler, standard-library and tool packages.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
# Rust itself is dual licensed.  The second group starts with Fedora's 1.83
# audit and includes the additional terms present in the crate trees of the
# components this lane ships (rustc, rustdoc, rustfmt, std). It ships no cargo,
# so none of cargo's statically linked native libraries.
license       = "(Apache-2.0 OR MIT) AND (Apache-2.0 AND (Apache-2.0 WITH LLVM-exception) AND Artistic-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC AND MIT AND MPL-2.0 AND Unicode-3.0 AND Unicode-DFS-2016)"
license_class = "free"
homepage      = "https://www.rust-lang.org/"
