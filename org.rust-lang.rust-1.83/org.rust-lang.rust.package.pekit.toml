[package]
name         = "org.rust-lang.rust"
architecture = "noarch"
description  = "Programming-language compiler and toolchain suite"

[provides]
# Include the package revision so this canonical suite outranks the retained
# monolithic rust 1.83.0-1 artifact in mixed local pools.

[replaces]

[dependencies]
"org.rust-lang.rustc"       = "= {{version}}-1"
"org.rust-lang.cargo"       = "= {{version}}-1"
"org.rust-lang.rustfmt"     = "= {{version}}-1"
"org.rust-lang.rust-src"    = "= {{version}}-1"
"org.rust-lang.rust-common" = "= {{version}}-1"

[files]
"@source:README.md" = "usr/share/doc/org.rust-lang.rust/README.md"
