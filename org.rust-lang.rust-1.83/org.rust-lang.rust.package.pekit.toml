[package]
name         = "org.rust-lang.rust"
architecture = "noarch"
description  = "Programming-language compiler and toolchain suite"

[provides]

[replaces]

# The kernel toolchain lane: Kbuild drives rustc directly, so this suite has
# no cargo. Cargo comes only from the rolling org.rust-lang.rust lane.
[dependencies]
"org.rust-lang.rustc"       = "= {{release}}"
"org.rust-lang.rustfmt"     = "= {{release}}"
"org.rust-lang.rust-src"    = "= {{release}}"
"org.rust-lang.rust-common" = "= {{release}}"

[files]
# Keep the component's upstream notices beside its installed payload.
# rust-common still owns the complete generated dependency-notice inventory.
"@source:COPYRIGHT" = "usr/share/licenses/org.rust-lang.rust/COPYRIGHT"
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.rust/LICENSE-APACHE"
"@source:LICENSE-MIT" = "usr/share/licenses/org.rust-lang.rust/LICENSE-MIT"

"@source:README.md" = "usr/share/doc/org.rust-lang.rust/README.md"
