[elf]
debuginfo = "org.rust-lang.rust-debuginfo"

[allow]
"source.discovery" = "Rust 1.83.0 is the exact compiler selected by PKM's kernel toolchain lock, not the rolling userspace Rust lane"
"source.versions.ceiling" = "The exact Rust 1.83.0 constraint is a deliberate kernel-toolchain pin; moving it requires a coordinated PKM transition"

[split]
# rust-src is the development/source package consumed by build-std and tooling.
# Preserve its upstream CMake sources without exempting unrelated runtime packages.
devel.packages = ["*-devel", "org.rust-lang.rust-src"]
