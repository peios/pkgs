[package]
name        = "org.rust-lang.rust-std"
description = "Rust standard libraries for x86_64-unknown-linux-gnu"

[provides]

[dependencies]
"org.rust-lang.rust-common" = "= {{version}}-3"
"org.gnu.glibc"                        = ">= 2.43"
"org.gnu.gcc-libgcc"                       = ">= 16"

[files]
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.rust-std/LICENSE-APACHE"
"@source:LICENSE-MIT" = "usr/share/licenses/org.rust-lang.rust-std/LICENSE-MIT"
":usr/lib/x86_64-linux-peios/rustlib/manifest-rust-std-x86_64-unknown-linux-gnu" = "usr/lib/x86_64-linux-peios/rustlib/manifest-rust-std-x86_64-unknown-linux-gnu"
":usr/lib/x86_64-linux-peios/rustlib/x86_64-unknown-linux-gnu/**" = "usr/lib/x86_64-linux-peios/rustlib/x86_64-unknown-linux-gnu"
