[package]
name        = "org.rust-lang.rustfmt"
description = "Rust source-code formatter and Cargo integration"

[provides]

[dependencies]
"org.rust-lang.rustc"       = "= {{version}}-3"
"org.rust-lang.rust-common" = "= {{version}}-3"
"org.gnu.glibc"                   = ">= 2.43"
"org.gnu.gcc-libgcc"                  = ">= 16"

[files]
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.rustfmt/LICENSE-APACHE"
"@source:LICENSE-MIT" = "usr/share/licenses/org.rust-lang.rustfmt/LICENSE-MIT"
":usr/bin/rustfmt" = "usr/bin/rustfmt"
":usr/bin/cargo-fmt" = "usr/bin/cargo-fmt"
":usr/lib/x86_64-linux-peios/rustlib/manifest-rustfmt-preview" = "usr/lib/x86_64-linux-peios/rustlib/manifest-rustfmt-preview"
":usr/share/doc/rustfmt/**" = "usr/share/doc/org.rust-lang.rustfmt"
