[package]
name        = "org.rust-lang.rust-debugsource"
description = "Rust compiler-suite sources referenced by debugging information"

[dependencies]
"org.rust-lang.rust-debuginfo" = "= {{version}}-3"
"org.rust-lang.rust-common"    = "= {{version}}-3"

[files]
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.rust-debugsource/LICENSE-APACHE"
"@source:LICENSE-MIT" = "usr/share/licenses/org.rust-lang.rust-debugsource/LICENSE-MIT"
":usr/src/debug/org.rust-lang.rust/**" = "usr/src/debug/org.rust-lang.rust"
