# Rust — the rolling source-built compiler suite used by Peios userspace.
# The kernel's frozen 1.83.0 compiler has a separate retained recipe and exact
# package dependency, so routine stable updates here cannot move Kbuild.
#
# x.py uses the exact private bootstrap seed authenticated by src/stage0 and performs the
# ordinary stage0 -> stage1 -> stage2 self-hosting climb. The source release
# vendors every crate, so both compilation and the installed-tree tests remain
# offline. LLVM and OpenSSL are Peios system libraries rather than bundled
# copies; the upstream llvm-project tree is never built.

tags = ["bootstrap"]
out_dir = "out"

[source]
patches = "patches"

[source.url]
url      = "https://static.rust-lang.org/dist/rustc-{{version}}-src.tar.xz"
extract  = true
root     = "rustc-{{version}}-src"
# The dist directory itself is enormous and no longer a reliable bounded
# listing endpoint. This signed-release channel document advertises exactly
# the current stable source artifact, excluding beta and nightly versions.
listing_url = "https://static.rust-lang.org/dist/channel-rust-stable.toml"
file_regex  = '(?m)^\[pkg\.rust\]\nversion = "[0-9]+\.[0-9]+\.[0-9]+'
# Soft production floor: follow stable Rust automatically from 1.98.1 onward.
versions = ">= 1.98.1"

[source.url.signature]
key_files    = ["keys/rust-release.asc"]
url          = "{{source_url}}.asc"
fingerprints = ["108F66205EAEB0AAA8DD5E1C85AB96E6FA1BE5FE"]

# The bootstrap seed is the exact compiler components authenticated by this
# signed source release's src/stage0 metadata. Acquisition outputs are
# captured; every compiler step remains offline.
[build.vendor]
command = 'python3 "$PEKIT_RECIPE_ROOT/acquire-stage0.py" "$(pwd -P)" "$PEKIT_OUT"'

# Upstream's install.sh runs base utilities, and the acquired rustc and cargo
# run once to confirm their versions.
[build.vendor.dependencies.peipkg]
"dev.peios.peiosutils"             = "*"
"org.gnu.coreutils-build-compat"   = "*"
"org.gnu.grep"                  = "*"
"org.gnu.sed"                      = "*"
"org.gnu.gcc-libgcc"               = ">= 16"
"io.github.zlib-ng.zlib-ng-compat" = ">= 2.3.3"

[build.seed-check]
needs = ["vendor"]
command = '''
set -eu
SEED="$PEKIT_VENDOR_OUT/stage0"
export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-peios${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
python3 "$PEKIT_RECIPE_ROOT/verify-stage0.py" "$PEKIT_VENDOR_OUT"
required=$(sed -n 's/^compiler_version=//p' src/stage0)
test "$("$SEED/bin/rustc" --version | cut -d' ' -f2)" = "$required"
test "$("$SEED/bin/cargo" --version | cut -d' ' -f2)" = "$required"
mkdir -p "$PEKIT_OUT/src"
printf '%s\n' 'fn main() { let v: Vec<_> = (1..=10).collect(); assert_eq!(v.iter().sum::<i32>(), 55); }' > "$PEKIT_OUT/src/main.rs"
"$SEED/bin/rustc" -C linker=gcc "$PEKIT_OUT/src/main.rs" -o "$PEKIT_OUT/direct"
"$PEKIT_OUT/direct"
printf '%s\n' '[package]' 'name = "source-authenticated-seed-check"' 'version = "0.0.0"' 'edition = "2021"' > "$PEKIT_OUT/Cargo.toml"
CARGO_HOME="$PEKIT_OUT/cargo-home" CARGO_TARGET_DIR="$PEKIT_OUT/target" RUSTC="$SEED/bin/rustc" RUSTFLAGS="-Clinker=gcc" "$SEED/bin/cargo" run --offline --manifest-path "$PEKIT_OUT/Cargo.toml"
'''

[build.seed-check.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.python.python3" = "*"
"org.gnu.glibc" = ">= 2.43"
"org.gnu.gcc-libgcc" = ">= 16"
"io.github.zlib-ng.zlib-ng-compat" = ">= 2.3.3"

[build.main]
needs = ["vendor", "seed-check"]
clear_out = false
command = '''
set -eu
SRC="$(pwd -P)"
TRIPLET=x86_64-unknown-linux-gnu
MUSL_TARGET=x86_64-unknown-linux-musl
TRIPLET_DIR=/usr/lib/x86_64-linux-peios
export LD_LIBRARY_PATH="$TRIPLET_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
STAGE0="$PEKIT_VENDOR_OUT/stage0"
MUSL_ROOT="$TRIPLET_DIR/musl"
LLVM_CONFIG=/usr/bin/llvm-config
export PATH="$(dirname "$LLVM_CONFIG"):$PATH"

PREFIX="$PEKIT_OUT/usr"
LIBDIR="$PREFIX/lib/x86_64-linux-peios"
export LD_LIBRARY_PATH="$TRIPLET_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

# The native Peios compiler is also the musl cross compiler. Keep libunwind's
# target build away from the host glibc headers while retaining GCC's builtin
# headers and the distribution hardening/debug-path policy. A plain native C++
# invocation otherwise compiles libunwind against glibc's fortified API and
# leaves unresolved __*_chk references in the musl archive.
GCC_INCLUDE=$(cc -print-file-name=include)
test -d "$GCC_INCLUDE"
MUSL_CFLAGS="-O2 -g -pipe -fstack-protector-strong -fcf-protection=full -nostdinc -isystem $MUSL_ROOT/include -isystem $GCC_INCLUDE -ffile-prefix-map=$SRC=/usr/src/debug/org.rust-lang.rust/source"
export CFLAGS_x86_64_unknown_linux_musl="$MUSL_CFLAGS"
export CXXFLAGS_x86_64_unknown_linux_musl="$MUSL_CFLAGS"

# Keep x.py's compiler cache and validated install across package/test
# invocations. Transient post-install state is always regenerated below.
rm -rf "$PEKIT_OUT/etc" "$PEKIT_OUT/.rust-smoke" \
  "$PEKIT_OUT/.debug-one" "$PEKIT_OUT/.debug-sources" \
  "$PEKIT_OUT/.debug-buildids" "$PEKIT_OUT/.debug-elfs"

python3 "$PEKIT_RECIPE_ROOT/verify-stage0.py" "$PEKIT_VENDOR_OUT"
test -x "$STAGE0/bin/rustc" || {
  echo "rust: declared vendor bootstrap seed is missing" >&2
  exit 1
}
test -x "$STAGE0/bin/cargo"
command -v llvm-config >/dev/null || {
  echo "rust: build root is missing llvm-config" >&2
  exit 1
}
test -s "$MUSL_ROOT/lib/libc.a" || {
  echo "rust: build root is missing org.libc.musl-sysroot" >&2
  exit 1
}
for crt in crt1.o Scrt1.o rcrt1.o crti.o crtn.o; do
  test -s "$MUSL_ROOT/lib/$crt"
done

# Rust's source tree is authoritative for the bootstrap compiler. Fail before
# the expensive build if the package seed and source contract ever diverge.
required_stage0=$(sed -n 's/^compiler_version=//p' "$SRC/src/stage0")
test -n "$required_stage0"
test "$("$STAGE0/bin/rustc" --version | cut -d' ' -f2)" = "$required_stage0"
test "$("$STAGE0/bin/cargo" --version | cut -d' ' -f2)" = "$required_stage0"

# Rust does not consume the workspace C/C++ linker flags for Rust crates. Feed
# each linker token through rustc and enable LLVM's CET instrumentation so the
# shipped Rust code, not merely its ELF note, satisfies the Peios hardening
# contract. This is an upstream compiler-build use of the otherwise unstable
# -Z option; x.py permits it for the self-hosted compiler stages.
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
DEBUGROOT=/usr/src/debug/org.rust-lang.rust
# Partial scopes retain local paths in Rust metadata. Remap every scope;
# debugedit below collects the normalized source paths for detached symbols.
RUSTFLAGS_NOT_BOOTSTRAP="-Zcf-protection=full --remap-path-prefix=$ROOT=$DEBUGROOT --remap-path-scope=all"
for flag in ${LDFLAGS:-}; do
  RUSTFLAGS_NOT_BOOTSTRAP="$RUSTFLAGS_NOT_BOOTSTRAP -Clink-arg=$flag"
done
RUSTFLAGS_NOT_BOOTSTRAP="$RUSTFLAGS_NOT_BOOTSTRAP -Clink-arg=-Wl,-z,ibtplt"
export RUSTFLAGS_NOT_BOOTSTRAP

mkdir -p "$PEKIT_OUT/build"
cat > "$PEKIT_OUT/config.toml" <<EOF
change-id = 158169

[build]
build = "$TRIPLET"
host = ["$TRIPLET"]
target = ["$TRIPLET", "$MUSL_TARGET"]
rustc = "$STAGE0/bin/rustc"
cargo = "$STAGE0/bin/cargo"
build-dir = "$PEKIT_OUT/build"
docs = false
extended = true
tools = ["cargo", "rustdoc", "rustfmt", "src"]
vendor = true

[install]
prefix = "/usr"
sysconfdir = "etc"
libdir = "lib/x86_64-linux-peios"
mandir = "share/man"

[rust]
channel = "stable"
# The shipped GNU/musl targets do not use Darwin/Solaris stripping helpers.
# Keep external LLVM executables owned by their declared LLVM packages.
llvm-tools = false
# Use the package debug-source namespace instead of bootstrap /rustc-dev paths.
remap-debuginfo = false
rpath = false
incremental = false
debuginfo-level-rustc = 1
debuginfo-level-std = 1
debuginfo-level-tools = 1

[llvm]
download-ci-llvm = false
link-shared = true

[target.$TRIPLET]
llvm-config = "$LLVM_CONFIG"
# Bootstrap's sanity gate requires a FileCheck path although install and the
# selected installed-tree tests never execute it. LLVM's test utility is not a
# runtime or link dependency of the compiler.
llvm-filecheck = "$PEKIT_RECIPE_ROOT/regression-fixtures/filecheck-unavailable.sh"

[target.$MUSL_TARGET]
# This private, source-built sysroot supplies only libc and startup objects.
# x.py copies them into rustlib/self-contained; installed target programs never
# depend on a host rustup cache or a system-wide musl runtime.
musl-root = "$MUSL_ROOT"
cc = "/usr/bin/cc"
cxx = "/usr/bin/c++"
EOF

# Avoid rebuilding the self-hosted compiler merely to repeat packaging or its
# independent test. The stamp covers every input outside config.toml that can
# alter x.py's output: the flags, the patch series applied to this source, and
# the system LLVM, OpenSSL, C compiler and musl sysroot it builds against. A
# clean source/version has its own Pekit output root. Target C/C++ flags are
# not part of x.py's native-libunwind cache key, so a changed contract also
# removes that small target slice before rebuilding.
BUILD_STAMP="$PEKIT_OUT/.xpy-install.stamp"
BUILD_CONTRACT=$(
  {
    sha256sum "$PEKIT_OUT/config.toml"
    printf '%s\n' "$RUSTFLAGS_NOT_BOOTSTRAP" "$MUSL_CFLAGS"
    cat "$PEKIT_RECIPE_ROOT"/patches/*
    "$LLVM_CONFIG" --version
    printf '#include <openssl/opensslv.h>\nOPENSSL_VERSION_TEXT\n' | cc -E -P -x c - | tail -n 1
    cc --version | head -n 1
    sha256sum "$MUSL_ROOT/lib/libc.a"
  } | sha256sum | awk '{print $1}'
)
if test -x "$PREFIX/bin/rustc" && \
   test -s "$PEKIT_OUT$TRIPLET_DIR/rustlib/manifest-rustc" && \
   test -s "$PEKIT_OUT$TRIPLET_DIR/rustlib/manifest-rust-std-$MUSL_TARGET" && \
   test "$(cat "$BUILD_STAMP" 2>/dev/null || :)" = "$BUILD_CONTRACT"; then
  echo "rust: reusing validated x.py install"
else
  rm -rf "$PEKIT_OUT/usr"
  rm -rf "$PEKIT_OUT/build/$TRIPLET/stage1-std/$MUSL_TARGET" \
    "$PEKIT_OUT/build/$MUSL_TARGET/native/libunwind"
  cd "$SRC"
  DESTDIR="$PEKIT_OUT" python3 x.py install \
    --config "$PEKIT_OUT/config.toml" -j"$(nproc)"
  test -x "$PREFIX/bin/rustc"
  test -s "$PEKIT_OUT$TRIPLET_DIR/rustlib/manifest-rustc"
  test -s "$PEKIT_OUT$TRIPLET_DIR/rustlib/manifest-rust-std-$MUSL_TARGET"
  printf '%s\n' "$BUILD_CONTRACT" > "$BUILD_STAMP"
fi

# Relocate Cargo's bash completion from upstream's mutable /etc location into
# the immutable vendor tree. Rust-installer bookkeeping and debugger wrappers
# are not package payload. The wrappers are omitted until Peios ships compatible
# gdb/lldb packages; leaving them would advertise broken commands.
if test -f "$PREFIX/etc/bash_completion.d/cargo"; then
  mkdir -p "$PREFIX/share/bash-completion/completions"
  mv "$PREFIX/etc/bash_completion.d/cargo" \
    "$PREFIX/share/bash-completion/completions/cargo"
fi
rm -rf "$PEKIT_OUT/etc" "$PREFIX/etc" "$PEKIT_OUT/usr/lib/rustlib" \
  "$PEKIT_OUT$TRIPLET_DIR/rustlib/etc"
rm -f "$PEKIT_OUT$TRIPLET_DIR/rustlib/uninstall.sh" \
  "$PEKIT_OUT$TRIPLET_DIR/rustlib/install.log" \
  "$PREFIX/bin/rust-gdb" "$PREFIX/bin/rust-gdbgui" "$PREFIX/bin/rust-lldb"

# rust-src's library and vendored-crate scripts name /usr/bin/env sh, bash,
# python3 and the like. Name the interpreter through the runtime view
# instead, keeping any arguments; the gate rejects any of these left behind.
# (grep -l exits 1 for a batch with no match; not an error under pipefail.)
RUST_SRC_TREE="$PEKIT_OUT$TRIPLET_DIR/rustlib/src"
{ find "$RUST_SRC_TREE" -type f -exec grep -lE \
  '^#! */usr/bin/(env +)?(sh|bash|perl|python3)([[:space:]]|$)' {} + || :; } |
while IFS= read -r script; do
  sed -i -E \
    '1s@^#! */usr/bin/(env +)?(sh|bash|perl|python3)([[:space:]]|$)@#!/bin/\2\3@' \
    "$script"
done

# Upstream does not install rustfmt or cargo-fmt manuals.
# Python is already a declared build tool; native Peios does not provide install.
python3 - "$PEKIT_RECIPE_ROOT/man" "$PREFIX/share/man/man1" <<'PYMAN'
import pathlib
import shutil
import sys
source, target = map(pathlib.Path, sys.argv[1:])
target.mkdir(parents=True, exist_ok=True)
for name in ("rustfmt.1", "cargo-fmt.1"):
    destination = target / name
    shutil.copyfile(source / name, destination)
    destination.chmod(0o644)
PYMAN
# Rust's installer leaves its generated manual pages uncompressed. Normalize
# them deterministically for the immutable package payload and man-db.
find "$PREFIX/share/man" -type f ! -name '*.gz' -print |
while IFS= read -r manual; do
  gzip -9n "$manual"
done
test -z "$(find "$PREFIX/share/man" -type f ! -name '*.gz' -print -quit)"

# x.py emits a musl libstd dylib alongside the static target libraries, but
# Peios deliberately does not ship a process-wide musl loader/runtime. Keep the
# target honest and self-contained by dropping that unusable dynamic variant
# and its installer-manifest entry.
MUSL_MANIFEST="$PEKIT_OUT$TRIPLET_DIR/rustlib/manifest-rust-std-$MUSL_TARGET"
test -s "$MUSL_MANIFEST"
find "$PEKIT_OUT$TRIPLET_DIR/rustlib/$MUSL_TARGET/lib" \
  -maxdepth 1 -type f -name '*.so' -print |
while IFS= read -r dylib; do
  rel=${dylib#"$PREFIX/"}
  sed -i "\\|^file:$rel$|d" "$MUSL_MANIFEST"
  rm -f "$dylib"
done
test -z "$(find "$PEKIT_OUT$TRIPLET_DIR/rustlib/$MUSL_TARGET/lib" \
  -maxdepth 1 -type f -name '*.so' -print -quit)"
if nm -u "$PEKIT_OUT$TRIPLET_DIR/rustlib/$MUSL_TARGET/lib/self-contained/libunwind.a" |
   grep -Eq '__[^[:space:]]*_chk$'; then
  echo "rust: musl libunwind contains glibc fortified references" >&2
  exit 1
fi
# The self-contained musl CRT objects and C archives (crt*.o, libc.a,
# libunwind.a) are linked statically into every musl target program. Like any
# shipped static archive they keep their code but not their DWARF, which named
# the directories they were built in and leaked into consumers' debug files.
find "$PEKIT_OUT$TRIPLET_DIR/rustlib/$MUSL_TARGET/lib/self-contained" -type f \
  \( -name '*.o' -o -name '*.a' \) -exec strip --strip-debug {} +
if find "$PEKIT_OUT$TRIPLET_DIR/rustlib/$MUSL_TARGET/lib/self-contained" -type f \
     \( -name '*.o' -o -name '*.a' \) -exec readelf -SW {} + 2>/dev/null |
   grep -q '\.debug_info'; then
  echo "rust: musl self-contained objects still carry debug info" >&2
  exit 1
fi

# Exercise the installed toolchain as downstream users see it. This checks the
# compiler, linker, standard library, Cargo's offline build path, rustfmt and
# rustdoc rather than treating a successful x.py install as sufficient.
export LD_LIBRARY_PATH="$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
export PATH="$PREFIX/bin:$PATH"
test "$(rustc --version | cut -d' ' -f2)" = "$PEKIT_VERSION"
test "$(cargo --version | cut -d' ' -f2)" = "$PEKIT_VERSION"
test "$(rustdoc --version | cut -d' ' -f2)" = "$PEKIT_VERSION"
rustfmt --version >/dev/null
test "$(rustc --version --verbose | sed -n 's/^host: //p')" = "$TRIPLET"

SMOKE="$PEKIT_OUT/.rust-smoke"
mkdir -p "$SMOKE/src" "$SMOKE/cargo-home"
cat > "$SMOKE/src/main.rs" <<'RS'
fn main() {
    println!("peios-rust-ok");
}
RS
cat > "$SMOKE/Cargo.toml" <<'TOML'
[package]
name = "peios-rust-smoke"
version = "0.0.0"
edition = "2021"

[profile.release]
strip = false
TOML
cat > "$SMOKE/Cargo.lock" <<'LOCK'
# This file is automatically @generated by Cargo.
# It is not intended for manual editing.
version = 3

[[package]]
name = "peios-rust-smoke"
version = "0.0.0"
LOCK
rustfmt --check "$SMOKE/src/main.rs"
rustdoc --edition=2021 --crate-name peios_rust_smoke \
  "$SMOKE/src/main.rs" -o "$SMOKE/doc"
test -s "$SMOKE/doc/peios_rust_smoke/index.html"
CARGO_HOME="$SMOKE/cargo-home" cargo build --offline --locked --release \
  --manifest-path "$SMOKE/Cargo.toml"
test "$("$SMOKE/target/release/peios-rust-smoke")" = peios-rust-ok

# Prove the newly built target works without rustup or network state. Cargo's
# empty dependency graph still exercises target selection and locked/offline
# mode; the ELF checks establish a self-contained static PIE rather than a
# dynamically linked executable which merely happens to use musl headers.
MUSL_RUSTFLAGS="${RUSTFLAGS:-} -Zcf-protection=full -C relocation-model=pic -C link-self-contained=yes -C link-arg=-static-pie -C link-arg=-Wl,-z,ibtplt"
CARGO_HOME="$SMOKE/cargo-home" CARGO_TARGET_DIR="$SMOKE/target-musl" \
  RUSTC_BOOTSTRAP=1 RUSTFLAGS="$MUSL_RUSTFLAGS" cargo build --offline --locked --release \
  --target "$MUSL_TARGET" --manifest-path "$SMOKE/Cargo.toml"
MUSL_BIN="$SMOKE/target-musl/$MUSL_TARGET/release/peios-rust-smoke"
test "$("$MUSL_BIN")" = peios-rust-ok
readelf -h "$MUSL_BIN" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -lW "$MUSL_BIN" | grep 'GNU_STACK' | grep -q ' RW '
readelf -lW "$MUSL_BIN" | grep -q 'GNU_RELRO'
readelf -dW "$MUSL_BIN" | grep -Eq 'BIND_NOW|FLAGS.*NOW'
readelf -dW "$MUSL_BIN" | grep -q '(RELR)'
# This is the foreign upstream musl ABI, whose assembly does not yet promise
# native Peios CET support. Never force property notes to claim otherwise.
if readelf -lW "$MUSL_BIN" | grep -q INTERP; then exit 1; fi
if readelf -dW "$MUSL_BIN" | grep -q NEEDED; then exit 1; fi
rm -rf "$SMOKE"

# Record the precise Rust crates linked into each installed component, following
# Fedora's component-specific cargo-tree methodology.  These inventories make
# the family-level SPDX audit reproducible and prevent a future Rust transition
# from silently inheriting 1.83's license conclusion.
LICENSE_ROOT="$PEKIT_OUT/usr/share/licenses/org.rust-lang.rust-common/generated"
mkdir -p "$LICENSE_ROOT/vendor-manifests"
cargo_manifest() {
  name=$1
  shift
  RUSTC_BOOTSTRAP=1 cargo tree \
    --offline --edges normal,build --prefix none --format '{p}' "$@" |
    sed '/([*/]/d; s/ (proc-macro)$//' |
    LC_ALL=C sort -u > "$LICENSE_ROOT/vendor-manifests/$name.txt"
  test -s "$LICENSE_ROOT/vendor-manifests/$name.txt"
}
cargo_manifest rustc -p rustc-main -p rustdoc
cargo_manifest cargo --manifest-path src/tools/cargo/Cargo.toml
cargo_manifest rustfmt --manifest-path src/tools/rustfmt/Cargo.toml
cargo_manifest std --manifest-path library/Cargo.toml --features backtrace

# Couple those component graphs to the exact upstream SPDX declarations.  The
# normalized vendor manifests always carry a concrete package.license string;
# refusing a missing declaration turns a future license change into an
# explicit packaging review rather than NOASSERTION metadata.
python3 - "$SRC" "$LICENSE_ROOT" <<'PY'
import pathlib
import sys
import tomllib

source = pathlib.Path(sys.argv[1])
license_root = pathlib.Path(sys.argv[2])
selected = set()
for manifest in (license_root / "vendor-manifests").glob("*.txt"):
    for line in manifest.read_text(encoding="utf-8").splitlines():
        fields = line.split()
        if len(fields) >= 2 and fields[1].startswith("v"):
            selected.add((fields[0], fields[1][1:]))

rows = []
for name, version in sorted(selected):
    crate = source / "vendor" / f"{name}-{version}" / "Cargo.toml"
    if not crate.is_file():
        raise SystemExit(f"rust: installed crate is absent from vendor tree: {name} {version}")
    with crate.open("rb") as stream:
        license_id = tomllib.load(stream).get("package", {}).get("license")
    if not isinstance(license_id, str) or not license_id.strip():
        raise SystemExit(f"rust: installed crate has no license declaration: {name} {version}")
    rows.append(f"{name}\t{version}\t{license_id.strip()}\n")

(license_root / "crate-licenses.tsv").write_text("".join(rows), encoding="utf-8")
PY
test -s "$LICENSE_ROOT/crate-licenses.tsv"

# Preserve every license/notice file shipped by the crates in those component
# graphs.  One de-duplicated corpus in rust-common is both smaller and more
# complete than repeating only Rust's top-level dual-license files everywhere.
mkdir -p "$LICENSE_ROOT/crates"
cat "$LICENSE_ROOT"/vendor-manifests/*.txt | LC_ALL=C sort -u |
while read -r crate tagged_version _; do
  case "$tagged_version" in
    v*) version=${tagged_version#v} ;;
    *) continue ;;
  esac
  crate_dir="$SRC/vendor/$crate-$version"
  test -d "$crate_dir" || {
    echo "rust: installed crate is absent from vendor tree: $crate $version" >&2
    exit 1
  }
  notice_dir="$LICENSE_ROOT/crates/$crate-$version"
  find "$crate_dir" -maxdepth 1 \( -type f -o -type l \) \
    \( -iname 'COPYING*' -o -iname 'COPYRIGHT*' -o -iname 'LICENCE*' \
       -o -iname 'LICENSE*' -o -iname 'NOTICE*' -o -iname 'UNLICENSE*' \) \
    -print | LC_ALL=C sort |
  while IFS= read -r notice; do
    mkdir -p "$notice_dir"
    cp -L "$notice" "$notice_dir/$(basename "$notice")"
  done
done
test -n "$(find "$LICENSE_ROOT/crates" -type f -print -quit)"

# Cargo's selected native sys crates carry nested upstream notices which do not
# sit at the crate root. Resolve them from Cargo's actual dependency graph,
# rather than embedding the crate versions from one Rust release in the recipe.
NATIVE_LICENSES="$LICENSE_ROOT/native"
mkdir -p "$NATIVE_LICENSES"
native_crate_dir() {
  crate=$1
  tagged=$(awk -v crate="$crate" '$1 == crate { print $2 }' \
    "$LICENSE_ROOT/vendor-manifests/cargo.txt")
  test -n "$tagged"
  test "$(printf '%s\n' "$tagged" | wc -l)" -eq 1
  dir="$SRC/vendor/$crate-${tagged#v}"
  test -d "$dir"
  printf '%s\n' "$dir"
}

CURL_SYS=$(native_crate_dir curl-sys)
LIBGIT2_SYS=$(native_crate_dir libgit2-sys)
LIBSSH2_SYS=$(native_crate_dir libssh2-sys)
cp "$CURL_SYS/curl/COPYING" "$NATIVE_LICENSES/curl-COPYING"
cp "$LIBGIT2_SYS/libgit2/COPYING" "$NATIVE_LICENSES/libgit2-COPYING"
cp "$LIBGIT2_SYS/libgit2/AUTHORS" "$NATIVE_LICENSES/libgit2-AUTHORS"
cp "$LIBSSH2_SYS/libssh2/COPYING" "$NATIVE_LICENSES/libssh2-COPYING"

# Keep a machine-readable inventory beside the canonical notices. OpenSSL,
# zlib and LLVM are deliberately dynamic Peios dependencies and are therefore
# not claimed as bundled payload licenses.
cat > "$LICENSE_ROOT/native-bundles.txt" <<EOF
blessing sqlite bundled-by-cargo
BSD-3-Clause libssh2 ${LIBSSH2_SYS##*/}
curl curl ${CURL_SYS##*/}
LicenseRef-Callaway-GPLv2-with-exceptions libgit2 ${LIBGIT2_SYS##*/}
EOF

# Split every shipped loadable ELF by build ID after normalizing its DWARF
# paths. Rust binaries are large enough that leaving symbols in their runtime
# packages is especially costly; retaining the exact referenced sources keeps
# the detached symbols genuinely useful.
: > "$PEKIT_OUT/.debug-sources"
: > "$PEKIT_OUT/.debug-buildids"
: > "$PEKIT_OUT/.debug-elfs"
cd "$PEKIT_OUT"
find usr/bin usr/lib/x86_64-linux-peios -type f -print | LC_ALL=C sort |
while IFS= read -r elf; do
  # readelf accepts ar/rlib archives and reports each relocatable member. Only
  # installed executable/shared objects belong in runtime hardening and debug
  # processing; touching an rlib would corrupt the Rust standard library.
  readelf -h "$elf" 2>/dev/null |
    grep -Eq 'Type:[[:space:]]+(DYN|EXEC)' || continue
  python3 -c 'import os, stat, sys; p = sys.argv[1]; os.chmod(p, os.stat(p).st_mode | stat.S_IWUSR)' "$elf"
  bid=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$bid" || {
    echo "rust: shipped ELF $elf has no build ID" >&2
    exit 1
  }
  printf '%s\n' "$elf" >> "$PEKIT_OUT/.debug-elfs"
  p2=$(printf %s "$bid" | cut -c1-2)
  rest=$(printf %s "$bid" | cut -c3-)
  dbg="usr/lib/debug/.build-id/$p2/$rest.debug"
  if ! grep -Fxq "$bid" "$PEKIT_OUT/.debug-buildids"; then
    : > "$PEKIT_OUT/.debug-one"
    # Normalize any remaining C/C++ paths, then collect the unified Rust/C++
    # source paths. Rust has already remapped both DWARF and crate metadata.
    debugedit -b "$ROOT" -d "$DEBUGROOT" -n "$elf"
    debugedit -b "$DEBUGROOT" -d "$DEBUGROOT" \
      -l "$PEKIT_OUT/.debug-one" -n "$elf"
    tr '\0' '\n' < "$PEKIT_OUT/.debug-one" >> "$PEKIT_OUT/.debug-sources"
    mkdir -p "$(dirname "$dbg")"
    objcopy --only-keep-debug "$elf" "$dbg"
    python3 -c 'import os, sys; os.chmod(sys.argv[1], 0o644)' "$dbg"
    if readelf -SW "$dbg" 2>/dev/null | grep -Eq '\.debug_info|\.symtab'; then
      printf '%s\n' "$bid" >> "$PEKIT_OUT/.debug-buildids"
    else
      # Rust installs external-LLVM helpers such as rust-objcopy already
      # stripped. Keep checking their runtime ELF below, but do not publish an
      # empty detached-symbol file or attach a debuglink to one.
      rm -f "$dbg"
      dbg=
    fi
  fi
  strip --strip-unneeded "$elf"
  if test -n "$dbg"; then
    objcopy --add-gnu-debuglink="$dbg" "$elf"
  fi
done

LC_ALL=C sort -u "$PEKIT_OUT/.debug-sources" |
while IFS= read -r rel; do
  test -n "$rel" || continue
  case "$rel" in */) continue ;; esac
  test -f "$ROOT/$rel" || continue
  mkdir -p "$PEKIT_OUT/usr/src/debug/org.rust-lang.rust/$(dirname "$rel")"
  cp "$ROOT/$rel" "$PEKIT_OUT/usr/src/debug/org.rust-lang.rust/$rel"
done

test -s "$PEKIT_OUT/.debug-elfs"
debug_count=$(find usr/lib/debug/.build-id -type f -name '*.debug' | wc -l)
buildid_count=$(wc -l < "$PEKIT_OUT/.debug-buildids")
test "$debug_count" -eq "$buildid_count"
test -n "$(find usr/src/debug/org.rust-lang.rust -type f -print -quit)"
for dbg in $(find usr/lib/debug/.build-id -type f -name '*.debug'); do
  readelf -S "$dbg" | grep -Eq '\.debug_info|\.symtab'
done

rm -f "$PEKIT_OUT/.debug-one" "$PEKIT_OUT/.debug-sources" \
  "$PEKIT_OUT/.debug-buildids" "$PEKIT_OUT/.debug-elfs"
'''

[build.main.dependencies.peipkg]
"org.gnu.glibc" = ">= 2.43"
"org.gnu.gcc-libgcc" = ">= 16"
"io.github.zlib-ng.zlib-ng-compat" = ">= 2.3.3"
"dev.peios.build-essentials-c++"       = "*"
# The exact preceding compiler is selected from signed-source metadata by
# build:vendor, preserving its original bytes and avoiding repository timing
# or predecessor patch-version ambiguity.
"org.libc.musl-sysroot"    = ">= 1.2.6"
"org.gnu.gcc-libatomic-static" = ">= 16"
"org.python.python3"                      = "*"
"org.llvm.llvm"                         = ">= 23.1.1, < 24"
"org.llvm.llvm-devel"                = ">= 23.1.1, < 24"
"io.github.zlib-ng.zlib-ng-compat-devel"                = "*"
"com.facebook.zstd-devel"                = "*"
"org.pkgconf.pkgconf"                      = "*"
"org.openssl.openssl-devel"             = ">= 4"
"org.sourceware.debugedit"                    = "*"
"org.gnu.gzip"                         = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
TRIPLET=x86_64-unknown-linux-gnu
MUSL_TARGET=x86_64-unknown-linux-musl
PREFIX="$PEKIT_MAIN_OUT/usr"
LIBDIR="$PREFIX/lib/x86_64-linux-peios"
SMOKE="$PEKIT_OUT/rust-installed-test"
export PATH="$PREFIX/bin:$PATH"
export LD_LIBRARY_PATH="$LIBDIR:/usr/lib/x86_64-linux-peios${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

test "$(rustc --version | cut -d' ' -f2)" = "$PEKIT_VERSION"
test "$(cargo --version | cut -d' ' -f2)" = "$PEKIT_VERSION"
test "$(rustc --version --verbose | sed -n 's/^host: //p')" = "$TRIPLET"

# rust-src names sh, bash, perl and python3 through the runtime view only.
LEFT=$(find "$LIBDIR/rustlib/src" -type f -exec sh -c '
  for f do
    head -n 1 "$f" | grep -qE "^#! */usr/bin/(env +)?(sh|bash|perl|python3)([[:space:]]|\$)" && echo "$f"
  done; :' sh {} +)
if [ -n "$LEFT" ]; then
  printf 'rust-src script still names /usr/bin: %s\n' $LEFT >&2
  exit 1
fi

# Verify the installed outputs against the workspace ELF contract. The
# target's Rust-specific CET flag emits protected landing pads. Compatibility
# notes must survive the ordinary linker merge; payload lint also inspects code.
# Forwarded LDFLAGS supply RELR and full RELRO. Reject build-tree search paths.
# readelf also accepts ar/rlib archives, so only executables and shared objects
# are checked.
find "$PREFIX/bin" "$LIBDIR" -type f -print | LC_ALL=C sort | while IFS= read -r elf; do
  readelf -h "$elf" 2>/dev/null | grep -Eq 'Type:[[:space:]]+(DYN|EXEC)' || continue
  readelf -lW "$elf" | grep 'GNU_STACK' | grep -q ' RW '
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -dW "$elf" | grep -Eq 'BIND_NOW|FLAGS.*NOW'
  readelf -dW "$elf" | grep -q '(RELR)'
  readelf -nW "$elf" | grep -Eq 'x86 feature:.*IBT.*SHSTK'
  readelf -nW "$elf" | grep -q 'Build ID:'
  if readelf -dW "$elf" | grep -Eq 'RPATH|RUNPATH|TEXTREL'; then
    echo "rust: forbidden dynamic tag in $elf" >&2
    exit 1
  fi
done

# The compiler links the system's monolithic LLVM, and cargo the system OpenSSL
# (openssl-sys supports 3.x and 4.x) and zlib; nothing is bundled.
readelf -dW "$LIBDIR"/librustc_driver-*.so | grep -Eq 'Shared library: \[libLLVM\.so\.'
crypto_major=$(readelf -dW "$PREFIX/bin/cargo" | sed -n 's/.*Shared library: \[libcrypto\.so\.\([0-9]*\)\].*/\1/p')
case "$crypto_major" in 3|4) ;; *) echo "rust: cargo links unreviewed OpenSSL ABI '$crypto_major'" >&2; exit 1 ;; esac
for needed in "libssl.so.$crypto_major" libz.so.1; do
  readelf -dW "$PREFIX/bin/cargo" | grep -F "Shared library: [$needed]"
done

mkdir -p "$SMOKE/src" "$SMOKE/cargo-home"
cat > "$SMOKE/src/main.rs" <<'RS'
fn main() {
    println!("peios-rust-test-ok");
}
RS
cat > "$SMOKE/Cargo.toml" <<'TOML'
[package]
name = "peios-rust-installed-test"
version = "0.0.0"
edition = "2021"

[profile.release]
strip = false
TOML
cat > "$SMOKE/Cargo.lock" <<'LOCK'
# This file is automatically @generated by Cargo.
# It is not intended for manual editing.
version = 3

[[package]]
name = "peios-rust-installed-test"
version = "0.0.0"
LOCK

CARGO_HOME="$SMOKE/cargo-home" cargo build --offline --locked --release \
  --manifest-path "$SMOKE/Cargo.toml"
test "$("$SMOKE/target/release/peios-rust-installed-test")" = peios-rust-test-ok

MUSL_RUSTFLAGS="${RUSTFLAGS:-} -Zcf-protection=full -C relocation-model=pic -C link-self-contained=yes -C link-arg=-static-pie -C link-arg=-Wl,-z,ibtplt"
CARGO_HOME="$SMOKE/cargo-home" CARGO_TARGET_DIR="$SMOKE/target-musl" \
  RUSTC_BOOTSTRAP=1 RUSTFLAGS="$MUSL_RUSTFLAGS" cargo build --offline --locked --release \
  --target "$MUSL_TARGET" --manifest-path "$SMOKE/Cargo.toml"
MUSL_BIN="$SMOKE/target-musl/$MUSL_TARGET/release/peios-rust-installed-test"
test "$("$MUSL_BIN")" = peios-rust-test-ok
readelf -h "$MUSL_BIN" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -lW "$MUSL_BIN" | grep 'GNU_STACK' | grep -q ' RW '
readelf -lW "$MUSL_BIN" | grep -q 'GNU_RELRO'
readelf -dW "$MUSL_BIN" | grep -Eq 'BIND_NOW|FLAGS.*NOW'
readelf -dW "$MUSL_BIN" | grep -q '(RELR)'
# This is the foreign upstream musl ABI, whose assembly does not yet promise
# native Peios CET support. Never force property notes to claim otherwise.
if readelf -lW "$MUSL_BIN" | grep -q INTERP; then exit 1; fi
if readelf -dW "$MUSL_BIN" | grep -q NEEDED; then exit 1; fi

# Selected unchanged upstream programs and installed-toolchain ABI/runtime
# regressions. This is a bounded matrix, not the complete compiletest suite.
python3 "$PEKIT_RECIPE_ROOT/regression-fixtures/run.py" \
  --source "$(pwd -P)" --out "$PEKIT_OUT/rust-regressions" \
  --targets x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
'''

[test.dependencies.peipkg]
"org.python.python3" = "*"
"dev.peios.build-essentials-c++"          = "*"
"org.gnu.gcc-libatomic-static" = ">= 16"
"org.llvm.llvm"                            = ">= 23.1.1, < 24"
"io.github.zlib-ng.zlib-ng-compat"                            = ">= 2.3.3"
"org.openssl.libssl"           = ">= 4"
"org.openssl.libcrypto"        = ">= 4"
