[package]
name        = "org.rust-lang.rust-debuginfo"
description = "Rust compiler-suite detached debugging symbols"

[dependencies]
"org.rust-lang.rust"        = "= {{version}}-3"
"org.rust-lang.rust-common" = "= {{version}}-3"

[files]
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.rust-debuginfo/LICENSE-APACHE"
"@source:LICENSE-MIT" = "usr/share/licenses/org.rust-lang.rust-debuginfo/LICENSE-MIT"
":usr/lib/debug/**" = "usr/lib/debug"
