[package]
name         = "org.rust-lang.rust-src"
description  = "Rust standard-library source for rust-analyzer and kernel builds"

[provides]

[dependencies]
"org.rust-lang.rustc"       = "= {{version}}-1"
"org.rust-lang.rust-common" = "= {{version}}-1"

[files]
# Keep the component's upstream notices beside its installed payload.
# rust-common still owns the complete generated dependency-notice inventory.
"@source:COPYRIGHT" = "usr/share/licenses/org.rust-lang.rust-src/COPYRIGHT"
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.rust-src/LICENSE-APACHE"
"@source:LICENSE-MIT" = "usr/share/licenses/org.rust-lang.rust-src/LICENSE-MIT"

":usr/lib/x86_64-linux-peios/rustlib/manifest-rust-src" = "usr/lib/x86_64-linux-peios/rustlib/manifest-rust-src"
":usr/lib/x86_64-linux-peios/rustlib/src/**" = "usr/lib/x86_64-linux-peios/rustlib/src"
