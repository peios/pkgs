[package]
name         = "org.rust-lang.rust"
architecture = "noarch"
description  = "Programming-language compiler, package manager, formatter and source suite"

[provides]
# Include the package revision so this canonical suite outranks the retained
# monolithic rust 1.83.0-1 artifact in mixed local pools.
rust = "{{version}}-3"

[replaces]
rust = "<= {{version}}-3"

[dependencies]
"org.rust-lang.rustc"       = "= {{version}}-3"
"org.rust-lang.cargo"       = "= {{version}}-3"
"org.rust-lang.rustfmt"     = "= {{version}}-3"
"org.rust-lang.rust-src"    = "= {{version}}-3"
"org.rust-lang.rust-common" = "= {{version}}-3"

[files]
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.rust/LICENSE-APACHE"
"@source:LICENSE-MIT" = "usr/share/licenses/org.rust-lang.rust/LICENSE-MIT"
"@source:README.md" = "usr/share/doc/org.rust-lang.rust/README.md"
