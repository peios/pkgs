side_effects = ["man-db"]

[package]
name        = "org.rust-lang.cargo"
description = "Package manager and build tool for the Rust ecosystem"

[provides]

[dependencies]
"org.rust-lang.rustc"       = "= {{version}}-1"
"org.rust-lang.rust-common" = "= {{version}}-1"
"org.gnu.glibc"                   = ">= 2.43"
"org.gnu.gcc-libgcc"                  = ">= 16"
"io.github.zlib-ng.zlib-ng-compat"                    = ">= 2.3.3"
"org.openssl.libssl"    = ">= 3.5"
"org.openssl.libcrypto" = ">= 3.5"

[files]
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.cargo/LICENSE-APACHE"
"@source:LICENSE-MIT" = "usr/share/licenses/org.rust-lang.cargo/LICENSE-MIT"
":usr/bin/cargo" = "usr/bin/cargo"
":usr/lib/x86_64-linux-peios/rustlib/manifest-cargo" = "usr/lib/x86_64-linux-peios/rustlib/manifest-cargo"
":usr/share/doc/cargo/**" = "usr/share/doc/org.rust-lang.cargo"
":usr/share/man/man1/cargo*.1.gz" = "usr/share/man/man1"
":usr/share/bash-completion/completions/cargo" = "usr/share/bash-completion/completions/cargo"
":usr/share/zsh/site-functions/_cargo" = "usr/share/zsh/site-functions/_cargo"
