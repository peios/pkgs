[elf]
debuginfo = "org.rust-lang.rust-debuginfo"

[split]
# rust-src is the development/source package consumed by build-std and tooling.
# Preserve its upstream CMake sources without exempting unrelated runtime packages.
devel.packages = ["*-devel", "org.rust-lang.rust-src"]

[allow_files."payload.junk"]
"usr/lib/x86_64-linux-peios/rustlib/src/rust/**/Cargo.toml.orig" = "Vendored Cargo source metadata required by offline build-std"
"usr/lib/x86_64-linux-peios/rustlib/src/rust/library/vendor/wit-bindgen-*/src/rt/*.o" = "Upstream WASI runtime object inputs preserved in rust-src"
"usr/lib/x86_64-linux-peios/rustlib/x86_64-unknown-linux-musl/lib/self-contained/*.o" = "Musl startup objects required by the self-contained static linker"
