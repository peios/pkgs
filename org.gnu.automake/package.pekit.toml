format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "org.gnu.automake"
version      = "{{version}}-1"
architecture = "noarch"
description  = "GNU Automake - Makefile.in generator"
license      = "GPL-2.0-or-later AND GPL-2.0-or-later WITH Autoconf-exception-generic AND GPL-3.0-or-later AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND GPL-3.0-or-later WITH Texinfo-exception AND GFDL-1.3-or-later AND FSFAP AND FSFUL AND FSFULLR AND FSFULLRWD AND X11 AND LicenseRef-Public-Domain"
license_class = "free"
homepage     = "https://www.gnu.org/software/automake/"

[dependencies]
"org.gnu.autoconf" = ">= 2.72"
gzip               = "*"
perl               = ">= 5.6"
tar                = "*"

[files]
"@source:COPYING*"          = "usr/share/licenses/org.gnu.automake/"
":usr/bin/**"               = "usr/bin"
":usr/share/automake-*/**"  = "usr/share"
":usr/share/aclocal-*/**"   = "usr/share"
":usr/share/aclocal/**"     = "usr/share/aclocal"
":usr/share/man/**"         = "usr/share/man"
