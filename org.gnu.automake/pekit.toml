# GNU Automake — Makefile.in generator; usbip's in-tree autogen.sh runs it
# (PEI-158 Tier 2, wave 3).
#
# Autotools from the release tarball, out-of-source via DESTDIR (the m4
# shape). Pure Perl scripts at runtime; Autoconf is declared because aclocal
# and automake drive it. The release archive is intentional: it contains the
# generated configure and Makefile.in files needed to build without an
# existing Automake installation.

tags = ["bootstrap"]
out_dir = "out"

[source.url]
url         = "https://ftp.gnu.org/gnu/automake/automake-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/automake/"
extract  = true
root     = "automake-{{version}}"
# Soft maintenance floor: automatic sweeps follow every newer stable GNU
# release; older history is intentionally outside this recipe.
versions = ">= 1.18"

# GNU publishes a detached signature beside every stable release. Pinning the
# maintainer key closes the trust-on-first-use gap when an unattended sweep
# discovers a version that is not in pekit.lock yet.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
# Automake 1.19 announcement identifies Kamila Szewczyk's full fingerprint:
# https://www.mail-archive.com/automake%40gnu.org/msg21205.html
# Key exported from https://ftp.gnu.org/gnu/gnu-keyring.gpg, independently
# matched to that announcement; retain Karl Berry for earlier releases.
key_files    = ["keys/karl-berry.asc", "keys/kamila-szewczyk.asc"]
fingerprints = ["17D3311B14BC0F248267BF020716748A30D155AD", "6C222EA6B2BD216AA406516AC868F0B6DE38409D"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -9n {} \\;
# Peios does not currently ship an Info reader; the manual and other upstream
# documentation remain available in the corresponding-source package.
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.bash"           = "*"
"org.gnu.gzip"                     = "*"
"org.gnu.autoconf"      = ">= 2.72"
"org.perl.perl"                     = ">= 5.6"
"org.gnu.tar"                      = "*"

[build.main.dependencies.apt]
build-essential = "*"
bash           = "*"
gzip           = "*"
autoconf       = ">= 2.72"
perl           = ">= 5.6"
tar            = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# Check the staged Perl tools against their staged modules, independently of
# whichever Automake version happens to be installed in the dependency root.
set -- "$PEKIT_MAIN_OUT"/usr/share/automake-*
test "$#" -eq 1
export PERL5LIB="$1"
export AUTOMAKE_UNINSTALLED=1
case "$("$PEKIT_MAIN_OUT/usr/bin/automake" --version)" in *"$PEKIT_VERSION"*) ;; *) exit 1;; esac
test -x "$PEKIT_MAIN_OUT/usr/bin/aclocal"
case "$("$PEKIT_MAIN_OUT/usr/bin/aclocal" --version)" in *"$PEKIT_VERSION"*) ;; *) exit 1;; esac
unset PERL5LIB AUTOMAKE_UNINSTALLED

# The core suite exercises generated C and C++ projects. Optional integrations
# for tools such as Libtool, Gettext, DejaGnu and Vala skip cleanly when those
# tools are absent, avoiding bootstrap cycles in the package set.
# Peipkg builds in a rootless UID namespace whose apparent root cannot restore
# arbitrary archive owners. Avoid GNU tar's root-only owner preservation while
# the suite unpacks its prebuilt amhello fixture.
cd "$PEKIT_MAIN_OUT"
TAR_OPTIONS=--no-same-owner make -j"$(nproc)" check

'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.bash" = "*"
"org.gnu.gzip" = "*"
"org.gnu.autoconf" = ">= 2.72"
"org.git.kernel.dash" = "*"
"org.perl.perl" = "*"
"org.gnu.tar" = "*"

[test.dependencies.apt]
build-essential = "*"
bash = "*"
gzip = "*"
autoconf = ">= 2.72"
dash = "*"
perl = "*"
tar = "*"
