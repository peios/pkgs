format = "peipkg"

[package]
name         = "cmake"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "CMake - cross-platform build system generator"
license      = "BSD-3-Clause"
homepage     = "https://cmake.org/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:LICENSE.rst" = "usr/share/licenses/cmake/"
":usr/bin/**"           = "usr/bin"
# The modules/templates tree cmake reads at runtime.
":usr/share/cmake-*/**" = "usr/share"
":usr/share/aclocal/**" = "usr/share/aclocal"
