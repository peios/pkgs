# libpeios — Peios's userspace C ABI library. The source repository owns the
# build and package split; this workspace member adds release discovery,
# distribution policy, and publication targets.
#
# The locked Cargo Git inputs are materialised only by build.vendor, the one
# networked target; compilation still runs in the offline package root.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"
delegate = true

[source]
patches = "patches"

[source.git]
url       = "https://github.com/peios/libpeios.git"
ref       = "v{{version}}"
versions  = ">= 0.5.0"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[source.local]
path = "../../libpeios"
