# libtool — shared-library build wrapper; usbip's in-tree autogen.sh runs
# libtoolize (PEI-158 Tier 2, wave 3).
#
# Autotools from the release tarball, out-of-source via DESTDIR (the m4
# shape). Ships the scripts + aclocal macros + libltdl (lib and headers
# ride in this one package until something wants a split).

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/libtool/libtool-{{version}}.tar.xz"
extract  = true
root     = "libtool-{{version}}"
versions = ">= 2.5"

[build.main]
command = """
SRC="$(pwd)"
LIBDIR=/usr/lib/x86_64-linux-peios
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --libdir="$LIBDIR" --disable-static
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT$LIBDIR" -name '*.la' -delete
rm -rf "$PEKIT_OUT/usr/share/info"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
autoconf = "*"
automake = "*"

[build.main.dependencies.apt]
build-essential = "*"
autoconf = "*"
automake = "*"
