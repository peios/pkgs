# GNU command semantics needed by conventional upstream build systems but not
# promised by Peiosutils. The commands live exclusively on Pekit's private
# build PATH, so this package can coexist with Peiosutils without claiming any
# installed-system command path.

[package]
name        = "org.gnu.coreutils-build-compat"
description = "Private GNU core utilities for package build roots"

[provides]
"coreutils-build-compat" = "{{version}}"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.coreutils-build-compat/"
":usr/bin/**" = "usr/libexec/coreutils-build"
":usr/lib/x86_64-linux-peios/**" = "usr/lib/x86_64-linux-peios"
