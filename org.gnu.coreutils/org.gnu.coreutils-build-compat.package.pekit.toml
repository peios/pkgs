# GNU ownership and mode commands needed by conventional upstream build
# systems but intentionally absent from Peiosutils. This narrowly scoped
# package can coexist with Peiosutils in a pristine build root.

[package]
name        = "org.gnu.coreutils-build-compat"
description = "GNU ownership and mode utilities for package build roots"

[provides]
"coreutils-build-compat" = "{{version}}"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.coreutils-build-compat/"
":usr/bin/chgrp" = "usr/bin/chgrp"
":usr/bin/chmod" = "usr/bin/chmod"
":usr/bin/chown" = "usr/bin/chown"
