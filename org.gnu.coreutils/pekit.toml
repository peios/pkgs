# GNU Coreutils — the GNU core utilities, packaged for the build-base role.
#
# PEIOS-DIVERGENCE(userland): Peios's installed system userland is peiosutils,
# a KACS-aware hard fork of uutils/coreutils which deliberately omits the
# traditional POSIX ownership and mode tools. Upstream build systems still need
# GNU semantics (chmod, chown, install -m, GNU options), so the GNU commands
# ship only as org.gnu.coreutils-build-compat, in /usr/libexec/coreutils-build,
# which Pekit's sandbox puts first on PATH. No package installs them into
# /usr/bin, where they would collide with peiosutils.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

# Coreutils 9.12 incorporates the four security/correctness backports carried
# for 9.11. Keep only the Peios glibc compatibility patch; the upstream suite
# and staged security regressions remain mandatory for later releases.
[source]
patches = "patches"

[source.url]
url         = "https://ftpmirror.gnu.org/coreutils/coreutils-{{version}}.tar.xz"
listing_url = "https://ftpmirror.gnu.org/coreutils/"
extract     = true
root        = "coreutils-{{version}}"
file_regex = 'coreutils-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Every later stable release is discovered
# automatically; the upstream and security-regression suites fail closed.
versions   = ">= 9.12"

# GNU's release announcement identifies this as Pádraig Brady's signing key.
# Pinning it closes the trust-on-first-use gap for unattended version sweeps.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/padraig-brady.asc"]
fingerprints = ["6C37DC12121A5006BC1DB804DF6FD971306037D9"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.coreutils"
cd "$PEKIT_OUT"

"$SRC/configure" \
  --prefix=/usr \
  --bindir=/usr/bin \
  --libexecdir=/usr/lib/x86_64-linux-peios \
  --mandir=/usr/share/man \
  --disable-nls

# Coreutils has one shared preload helper. Apply PIE flags through Automake's
# general program variables while retaining its target-specific -fPIC/-shared
# flags for libstdbuf.so.
MAKE_PIE_CFLAGS='AM_CFLAGS=-fPIE $(WERROR_CFLAGS)'
MAKE_PIE_LDFLAGS='AM_LDFLAGS=-pie $(IGNORE_UNUSED_LIBRARIES_CFLAGS)'
MAKE_STDBUF_CFLAGS='src_libstdbuf_so_CFLAGS=-fPIC $(WERROR_CFLAGS)'
make -j"$(nproc)" "$MAKE_PIE_CFLAGS" "$MAKE_PIE_LDFLAGS" "$MAKE_STDBUF_CFLAGS"

make install DESTDIR="$PEKIT_OUT" "$MAKE_PIE_CFLAGS" "$MAKE_PIE_LDFLAGS" "$MAKE_STDBUF_CFLAGS"
# The commands are private build tools off the system PATH, so their manuals
# and Info documentation are not shipped: they would also collide with
# peiosutils' manuals. The complete documentation remains in the
# corresponding-source package.
rm -rf "$PEKIT_OUT/usr/share/man" "$PEKIT_OUT/usr/share/info"

# Distribution debug split over all command binaries and libstdbuf.so.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.coreutils "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
# The upstream test harness and generated help/man machinery use Perl.
"org.perl.perl" = "*"
# The help/version regression exercises compressed-input dispatch.
"org.gnu.gzip" = "*"

[build.main.dependencies.apt]
build-essential = "*"
debugedit       = "*"
dwz             = "*"
perl            = "*"
gzip            = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# Run every configured upstream case. Only the exact measured fixture
# limitations below are accepted; any added failure or changed reason is fatal.
cd "$PEKIT_MAIN_OUT"
MAKE_PIE_CFLAGS='AM_CFLAGS=-fPIE $(WERROR_CFLAGS)'
MAKE_PIE_LDFLAGS='AM_LDFLAGS=-pie $(IGNORE_UNUSED_LIBRARIES_CFLAGS)'
MAKE_STDBUF_CFLAGS='src_libstdbuf_so_CFLAGS=-fPIC $(WERROR_CFLAGS)'
if ! make -j"$(nproc)" check "$MAKE_PIE_CFLAGS" "$MAKE_PIE_LDFLAGS" "$MAKE_STDBUF_CFLAGS"; then
  actual=$(find tests -name '*.trs' -type f | while IFS= read -r result; do
    grep -Eq '^:test-result: (FAIL|ERROR|XPASS)$' "$result" || continue
    printf '%s\n' "${result%.trs}"
  done | LC_ALL=C sort)
  # The >10 KiB rm fixture fails in Perl's mkdir setup before invoking rm.
  # Native roots also lack NSS records for the isolated non-root build UID.
  # Derive this exact allowance from the prerequisite, never from a failure.
  expected=tests/rm/deep-2
  if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
    [ "$(id -u)" != 0 ]
    if id -nu >/dev/null 2>&1 || id -ng >/dev/null 2>&1; then exit 1; fi
    expected=$(printf '%s\n' tests/chown/separator tests/help/help-version \
      tests/id/uid tests/id/zero tests/misc/io-errors tests/rm/deep-2)
    grep -F 'cannot find name for user ID' tests/help/help-version.log
    grep -F 'cannot find name for group ID' tests/misc/io-errors.log
    for case_name in chown/separator id/uid id/zero; do
      grep -F 'cannot find name for user ID' "tests/$case_name.log"
    done
  fi
  [ "$actual" = "$expected" ]
  grep -Fx ':test-result: ERROR' tests/rm/deep-2.trs
  grep -F 'File name too long at -e line 2.' tests/rm/deep-2.log
  grep -F 'deep-2.sh: set-up failure:' tests/rm/deep-2.log
  if grep -F '+ rm ---presume-input-tty' tests/rm/deep-2.log; then exit 1; fi
fi
BIN="$PEKIT_MAIN_OUT/usr/bin"
STAGE="$PEKIT_MAIN_OUT"
SMOKE="$PEKIT_OUT/coreutils-smoke"
mkdir -p "$SMOKE/in" "$SMOKE/out"
printf '%s\n' gamma alpha alpha > "$SMOKE/in/words"
"$BIN/sort" -u "$SMOKE/in/words" > "$SMOKE/out/words"
printf '%s\n' alpha gamma > "$SMOKE/expected"
cmp "$SMOKE/expected" "$SMOKE/out/words"
"$BIN/install" -m 0640 "$SMOKE/out/words" "$SMOKE/out/installed"
[ "$("$BIN/stat" -c %a "$SMOKE/out/installed")" = 640 ]
"$BIN/cp" "$SMOKE/out/installed" "$SMOKE/out/copied"
"$BIN/mv" "$SMOKE/out/copied" "$SMOKE/out/moved"
"$BIN/sha256sum" "$SMOKE/out/installed" "$SMOKE/out/moved" | "$BIN/uniq" -w 64 | "$BIN/wc" -l | grep -Fx 1
"$BIN/seq" 3 | "$BIN/paste" -sd, - | grep -Fx '1,2,3'
"$BIN/timeout" 2 "$BIN/true"

longline=$("$BIN/printf" '\\360\\237\\230\\200')$("$BIN/printf" '%0255d' 0 | "$BIN/tr" 0 A)
printf '%s\n%s\n' "$longline" "$longline" | LC_ALL=C.UTF-8 "$BIN/uniq" -w256 > "$SMOKE/out/uniq"
[ "$("$BIN/wc" -l < "$SMOKE/out/uniq")" = 1 ]
printf '   \n' | LC_ALL=C.UTF-8 "$BIN/unexpand" -t 4611686018427387904 > /dev/null 2> "$SMOKE/out/unexpand.err" || status=$?
case ${status:-0} in 0|1) ;; *) exit 1;; esac
unset status

strings "$BIN/stdbuf" | grep -Fx '/usr/lib/x86_64-linux-peios/coreutils'
test -f "$STAGE/usr/lib/x86_64-linux-peios/coreutils/libstdbuf.so"
"$BIN/ls" --version | head -1 | grep -F "$PEKIT_VERSION"
find "$STAGE/usr/bin" "$STAGE/usr/lib/x86_64-linux-peios" -type f ! -type l | while IFS= read -r elf; do
  readelf -h "$elf" >/dev/null 2>&1 || continue
  readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  if readelf -d "$elf" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done
test "$(find "$STAGE/usr/bin" -type f ! -type l | wc -l)" -ge 100
digest=$(printf '%s' Peios | "$BIN/sha256sum")
case "$digest" in 9a1ceeca8dc1e75def84ca9fdf7fed8360c314bda8a4cff1f52ef9c92358d258*) ;; *) exit 1;; esac
test "$(printf '%s\n%s\n' same same | "$BIN/uniq" | "$BIN/wc" -l)" -eq 1
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.perl.perl" = "*"
"org.gnu.gzip" = "*"
"org.git.kernel.dash" = "*"

[test.dependencies.apt]
build-essential = "*"
debugedit = "*"
patchelf = "*"
perl = "*"
gzip = "*"
dash = "*"
