# Ninja is a deliberately small build executor. Upstream does not sign release
# tags, so Pekit's Git lock pins every accepted tag to its exact commit.

tags = ["bootstrap"]
out_dir = "out"

[source.git]
url       = "https://github.com/ninja-build/ninja.git"
ref       = "v{{version}}"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
# Soft maintenance floor. Follow every newer immutable release; incompatible
# executor changes stop at the bootstrap, regression, and staged-command gates.
versions  = ">= 1.13.2"

[build.main]
command = '''
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CXXFLAGS="${CXXFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.ninja-build.ninja"
BUILD="$PEKIT_OUT/build"
BIN="$PEKIT_OUT/usr/bin/ninja"

mkdir -p "$BUILD"
cd "$BUILD"
PYTHONDONTWRITEBYTECODE=1 python3 "$SRC/configure.py" \
  --bootstrap --with-python=python3

# Rebuild Ninja with the just-bootstrapped executable. Keeping the bootstrap
# copy outside the generated graph lets it clean and recreate the real target.
cp ninja ninja.bootstrap
./ninja.bootstrap -t clean ninja
./ninja.bootstrap ninja

install -Dm0755 ninja "$BIN"
python3 "$PEKIT_RECIPE_ROOT/tools/install-manpage.py" "$BIN" "$PEKIT_OUT/usr/share/man/man1/ninja.1.gz"
install -Dm0644 "$SRC/misc/bash-completion" \
  "$PEKIT_OUT/usr/share/bash-completion/completions/ninja"
install -Dm0644 "$SRC/misc/zsh-completion" \
  "$PEKIT_OUT/usr/share/zsh/site-functions/_ninja"
install -Dm0644 "$SRC/misc/ninja.vim" \
  "$PEKIT_OUT/usr/share/vim/vimfiles/syntax/ninja.vim"

# Conventional build-ID debuginfo and the exact DWARF-referenced sources.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.ninja-build.ninja "$PEKIT_OUT/usr"
'''

[test]
needs = ["main"]
gate = true
command = '''
set -eu
SRC="$(pwd)"
STAGE="$PEKIT_MAIN_OUT"
BUILD="$STAGE/build"
BIN="$STAGE/usr/bin/ninja"
SMOKE="$PEKIT_OUT/smoke"

# A bootstrap followed by a self-hosted rebuild must be byte-identical.
cmp -s "$BUILD/ninja.bootstrap" "$BUILD/ninja"
test "$("$BIN" --version)" = "$PEKIT_VERSION"
python3 "$PEKIT_RECIPE_ROOT/tools/install-manpage.py" "$BIN" "$PEKIT_OUT/ninja.1.gz"
cmp "$PEKIT_OUT/ninja.1.gz" "$STAGE/usr/share/man/man1/ninja.1.gz"

# Upstream scripts locate the tested executable relative to the working directory.
cd "$BUILD"

# Upstream's Python regression suites: the syntax module, the jobserver pool,
# the jobserver client (pinned to one CPU with util-linux's taskset) and the
# smart-terminal output suite (driven through util-linux's script).
PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$SRC/misc" \
  python3 "$SRC/misc/ninja_syntax_test.py"
PYTHONDONTWRITEBYTECODE=1 python3 "$SRC/misc/jobserver_pool_test.py"
PYTHONDONTWRITEBYTECODE=1 python3 "$SRC/misc/jobserver_test.py"
PYTHONDONTWRITEBYTECODE=1 python3 "$SRC/misc/output_test.py"

# Upstream's C++ unit suite, ninja_test, against the packaged GoogleTest. The
# staged executor drives the build; the GoogleTest download fallback is
# disabled and a missing GTest is an error rather than a fetch.
cmake -S "$SRC" -B "$PEKIT_OUT/unit" -G Ninja -DCMAKE_MAKE_PROGRAM="$BIN" \
  -DBUILD_TESTING=ON -DCMAKE_REQUIRE_FIND_PACKAGE_GTest=ON \
  -DFETCHCONTENT_FULLY_DISCONNECTED=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
"$BIN" -C "$PEKIT_OUT/unit" ninja_test
if [ -d "$PEKIT_OUT/unit/_deps" ]; then exit 1; fi
(cd "$PEKIT_OUT/unit" && ./ninja_test) > "$PEKIT_OUT/unit.out" 2>&1 || {
  tail -40 "$PEKIT_OUT/unit.out"; exit 1; }
tail -3 "$PEKIT_OUT/unit.out"
grep -E '^\[  PASSED  \] [0-9]+ tests\.$' "$PEKIT_OUT/unit.out"
if grep -F '[  FAILED  ]' "$PEKIT_OUT/unit.out"; then exit 1; fi

# Exercise the installed executor, its shell integration and target tooling.
mkdir -p "$SMOKE"
cat > "$SMOKE/build.ninja" <<'EOF'
rule generate
  command = printf 'ninja-smoke\n' > $out
build result: generate
default result
EOF
"$BIN" -C "$SMOKE" -j2
grep -Fx ninja-smoke "$SMOKE/result"
"$BIN" -C "$SMOKE" -t targets | grep -Fx 'result: generate'

# The same installed-executor regression also runs in the independent
# package-closure check with /bin absent and --require-no-bin.
python3 "$PEKIT_RECIPE_ROOT/tools/test-shell.py" \
  --ninja "$BIN" --work "$PEKIT_OUT/shell-regression"

# Enforce the workspace hardening and split-debug contracts on what ships.
readelf -h "$BIN" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l "$BIN" | grep -F 'GNU_RELRO'
readelf -d "$BIN" | grep -F 'BIND_NOW'
readelf -d "$BIN" | grep -F 'RELR'
readelf -W -l "$BIN" | grep -E 'GNU_STACK.*RW '
if readelf -d "$BIN" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
readelf -n "$BIN" | grep -E 'x86 feature:.*IBT.*SHSTK'
DEBUG=$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug')
test "$(printf '%s\n' "$DEBUG" | grep -c .)" -eq 1
readelf -S "$DEBUG" 2>/dev/null | grep -F '.debug_info'
test -n "$(find "$STAGE/usr/src/debug/org.ninja-build.ninja" -type f -print -quit)"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.git.kernel.dash"            = "*"
"dev.peios.peiosutils"           = "*"
"org.python.python3"             = "*"
"org.gnu.bash"                   = "*"
"org.cmake.cmake"                = "*"
"com.google.googletest-devel"    = ">= 1.18.0"
# jobserver_test.py pins jobs with taskset; output_test.py runs under script.
"org.kernel.util-linux-schedutils" = "*"
"org.kernel.util-linux-script"   = "*"

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.git.kernel.dash"                     = "*"
"org.sourceware.debugedit"                = "*"
"dev.peios.peiosutils"     = "*"
"org.python.python3"                  = "*"
