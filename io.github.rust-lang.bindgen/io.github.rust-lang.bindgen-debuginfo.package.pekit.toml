[package]
name        = "io.github.rust-lang.bindgen-debuginfo"
description = "Bindgen debugging symbols"
license     = "BSD-3-Clause"

[dependencies]
"io.github.rust-lang.bindgen" = "= {{version}}-1"

[files]
"@source:LICENSE"   = "usr/share/licenses/io.github.rust-lang.bindgen-debuginfo/LICENSE"
":usr/lib/debug/**" = "usr/lib/debug"
