# bindgen — the C-to-Rust bindings generator; the kernel's Rust side runs
# it over kernel headers through libclang (PEI-158 item 9).
#
# Pinned exactly to 0.65.1: pkm's build/toolchain.lock is the authority and
# kernel bindgen requirements are strict. A kernel-toolchain update must move
# both pins together; this package must not independently follow newer bindgen.
#
# Source is the published crate from static.crates.io (a tar.gz). crates.io
# does not sign artifacts, so this is lock-only TOFU. crates.io versions are
# immutable, the lock hash matches its sparse index, and the crate's Cargo.lock
# supplies per-dependency hashes that cargo verifies while vendoring.
#
# Two-stage shape: [build.vendor] materialises the Cargo.lock closure in the
# workspace's source-fetch environment; [build.main] consumes it with cargo's
# network-disabled `--offline --locked` mode. Package in one invocation with
# `--env=peipkg-net`; only the vendor stage makes network requests.
#
# clang-sys stays on its default runtime-loading feature, so libclang is
# a RUNTIME dep (dlopen), not a link-time build dep.  Clang carries the driver
# and resource headers; clang-devel carries the unversioned libclang.so entry
# point that clang-sys discovers dynamically.

out_dir = "out"

[source.url]
url      = "https://static.crates.io/crates/bindgen-cli/bindgen-cli-{{version}}.crate"
extract  = true
root     = "bindgen-cli-{{version}}"
versions = "= 0.65.1"

[build.vendor]
command = """
set -eu
SRC="$(pwd)"
export CARGO_HOME=/tmp/cargo
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"
cd "$SRC"
cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
"""

[build.vendor.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.rust-lang.rust" = "*"

[build.vendor.dependencies.apt]
cargo = "*"
ca-certificates = "*"

[build.main]
needs = ["vendor"]
command = """
set -eu
SRC="$(pwd)"
export CARGO_HOME=/tmp/cargo
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
DEBUG_ROOT=/usr/src/debug/io.github.rust-lang.bindgen
# Generate actual IBT landing pads. Restrict unstable-option access to code
# generation so old locked dependencies retain stable feature-probe results.
export RUSTC_WRAPPER="$PEKIT_RECIPE_ROOT/tools/rustc-cet"
CET_LINK="-C link-arg=-Wl,-z,ibtplt"
if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
  # No forced properties: reject unmarked compiler/runtime inputs as well.
  CET_LINK="$CET_LINK -C link-arg=-Wl,-z,cet-report=error"
fi
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }$CET_LINK --remap-path-prefix=$PEKIT_WORKSPACE_ROOT=$DEBUG_ROOT/.workspace --remap-path-prefix=$ROOT=$DEBUG_ROOT/.build --remap-path-prefix=$SRC=$DEBUG_ROOT --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=$DEBUG_ROOT/vendor"
cd "$SRC"
cargo build --release --offline --locked --target-dir "$PEKIT_OUT/target"
mkdir -p "$PEKIT_OUT/usr/bin"
BIN="$PEKIT_OUT/usr/bin/bindgen"
cp "$PEKIT_OUT/target/release/bindgen" "$BIN"

# Preserve build-ID-indexed symbols and exactly the source files referenced by
# the binary's DWARF, including its locked vendored Rust dependencies.
LIST="$PEKIT_OUT/.debug-sources"
debugedit -b "$SRC" -d "$DEBUG_ROOT" -l "$LIST" -n "$BIN"
BUILD_ID=$(readelf -n "$BIN" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
test -n "$BUILD_ID"
FIRST=$(printf %s "$BUILD_ID" | cut -c1-2)
REST=$(printf %s "$BUILD_ID" | cut -c3-)
DEBUG="$PEKIT_OUT/usr/lib/debug/.build-id/$FIRST/$REST.debug"
mkdir -p "$(dirname "$DEBUG")"
objcopy --only-keep-debug "$BIN" "$DEBUG"
strip --strip-unneeded "$BIN"
objcopy --add-gnu-debuglink="$DEBUG" "$BIN"

DEBUG_STAGE="$PEKIT_OUT/usr/src/debug/io.github.rust-lang.bindgen"
mkdir -p "$DEBUG_STAGE"
tr '\\0' '\\n' < "$LIST" | LC_ALL=C sort -u | while IFS= read -r rel; do
  test -n "$rel" || continue
  case "$rel" in */) continue;; esac
  case "$rel" in
    vendor/*) ORIGIN="$PEKIT_VENDOR_OUT/$rel" ;;
    *)        ORIGIN="$SRC/$rel" ;;
  esac
  test -f "$ORIGIN" || continue
  mkdir -p "$DEBUG_STAGE/$(dirname "$rel")"
  cp "$ORIGIN" "$DEBUG_STAGE/$rel"
done
rm -f "$LIST"

# Upstream has no installed bindgen(1), so derive a complete command reference
# from the exact CLI being packaged and compress it deterministically.
MANDIR="$PEKIT_OUT/usr/share/man/man1"
mkdir -p "$MANDIR"
{
  printf '.TH BINDGEN 1 "" "bindgen %s" "User Commands"\n' "$PEKIT_VERSION"
  printf '.SH NAME\nbindgen \\- generate Rust bindings from C and C++ headers\n'
  printf '.SH SYNOPSIS\n.B bindgen\n.RI "[FLAGS] [OPTIONS] [HEADER] -- [CLANG_ARGS]..."\n'
  printf '.SH DESCRIPTION\nGenerate Rust foreign-function bindings from C or C++ headers using libclang.\n'
  printf '.SH OPTIONS\n.nf\n'
  "$BIN" --help
  printf '.fi\n.SH SEE ALSO\n.BR clang (1),\n.BR rustc (1)\n'
} > "$MANDIR/bindgen.1"
gzip -9n "$MANDIR/bindgen.1"
rm -rf "$PEKIT_OUT/target"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.rust-lang.rust" = "*"
"org.llvm.clang" = ">= 18.1.8, < 19"
"org.llvm.clang-devel" = ">= 18.1.8, < 19"
"org.sourceware.debugedit" = "*"
"org.gnu.binutils" = "*"
"org.gnu.gzip" = "*"

[build.main.dependencies.apt]
build-essential = "*"
cargo = "*"
clang-18 = "*"
libclang-18-dev = "*"
debugedit = "*"
binutils = "*"
gzip = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
BIN="$PEKIT_MAIN_OUT/usr/bin/bindgen"
SMOKE="$PEKIT_OUT/bindgen-test"
test -x "$BIN"
test "$("$BIN" --version)" = "bindgen $PEKIT_VERSION"
mkdir -p "$SMOKE"
printf 'struct peios_bindgen_smoke { unsigned long value; };\n' > "$SMOKE/smoke.h"
LIBCLANG_SO="$(find /usr/lib -name libclang.so -print -quit)"
test -n "$LIBCLANG_SO"
export LIBCLANG_PATH="${LIBCLANG_SO%/*}"
"$BIN" --allowlist-type peios_bindgen_smoke --no-layout-tests \
  "$SMOKE/smoke.h" > "$SMOKE/smoke.rs"
grep -q peios_bindgen_smoke "$SMOKE/smoke.rs"
grep -q c_ulong "$SMOKE/smoke.rs"
test -s "$PEKIT_MAIN_OUT/usr/share/man/man1/bindgen.1.gz"
set -- "$PEKIT_MAIN_OUT"/usr/lib/debug/.build-id/*/*.debug
test "$#" -eq 1
test -f "$1"
if readelf -SW "$BIN" | grep -F '.debug_info'; then exit 1; fi
readelf -SW "$1" 2>/dev/null | grep -F '.debug_info'
test -n "$(find "$PEKIT_MAIN_OUT/usr/src/debug/io.github.rust-lang.bindgen" -type f -print -quit)"
# The native link rejects missing input properties; payload lint also checks
# observable indirect-call entry points in the final stripped binary.
if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
  readelf -n "$BIN" | grep -E 'x86 feature:.*IBT.*SHSTK'
fi
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.llvm.clang" = ">= 18.1.8, < 19"
"org.llvm.clang-devel" = ">= 18.1.8, < 19"
"org.git.kernel.dash" = "*"

[test.dependencies.apt]
build-essential = "*"
clang-18 = "*"
libclang-18-dev = "*"
dash = "*"
