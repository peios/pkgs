# rust-stage0 — the pinned upstream Rust binaries that seed the rustc
# bootstrap (PEI-158 item 8; anchor decision approved 2026-08-11: pin +
# TOFU-lock upstream stage0 via the PEI-150 machinery).
#
# rustc is self-hosting: every rustc is compiled by a prior rustc, so the
# chain bottoms out in somebody's binary. This recipe makes that seed an
# explicit, signature-verified, lockfile-pinned artifact: the COMBINED
# upstream release tarball (one artifact = one pekit source; the same
# signed bits src/stage0 pins per-component), verified against the pinned
# Rust release signing key, installed under a private prefix nothing else
# looks at. The rust recipe declares this package as an ordinary peipkg
# build dep and points x.py's build.rustc/build.cargo at the prefix.
#
# Version tracks what rust's src/stage0 declares (rust 1.83.0 -> stage0
# 1.82.0), NOT the rust version — bump the pair in lockstep. The binaries
# are upstream linux-gnu builds; composed roots run them as-is (usrmerge
# provides /lib64/ld-linux-x86-64.so.2, verified). mrustc remains the
# later-adoptable source-trust upgrade (recorded on PEI-158) — swapping it
# in replaces only this seed, nothing downstream.

out_dir = "out"

[source.url]
url      = "https://static.rust-lang.org/dist/rust-{{version}}-x86_64-unknown-linux-gnu.tar.xz"
extract  = true
root     = "rust-{{version}}-x86_64-unknown-linux-gnu"
versions = ">= 1.82"

[source.url.signature]
key_files    = ["keys/rust-release.asc"]
url          = "{{source_url}}.asc"
fingerprints = ["108F66205EAEB0AAA8DD5E1C85AB96E6FA1BE5FE"]

[build.main]
command = """
SRC="$(pwd)"
PREFIX=/usr/lib/x86_64-linux-peios/rust-stage0
sh "$SRC/install.sh" \
  --destdir="$PEKIT_OUT" --prefix="$PREFIX" \
  --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu \
  --disable-ldconfig
# rust-installer bookkeeping (uninstaller, install log) isn't payload; the
# component manifests stay (harmless, and they document what the seed is).
rm -f "$PEKIT_OUT$PREFIX/lib/rustlib/uninstall.sh" \
  "$PEKIT_OUT$PREFIX/lib/rustlib/install.log"
"""

[build.main.dependencies.peipkg]
build-essentials = "*"

[build.main.dependencies.apt]
build-essential = "*"
