# io.github.asciidoc-py.asciidoc — the original AsciiDoc processor
# (asciidoc-py), and a2x, its
# front-end for the toolchain that turns a document into a man page. Here
# because the kernel tools write their documentation in AsciiDoc: kvm_stat's
# man page is built by a2x, and perf's and libperf's by asciidoc feeding
# xmlto (PEI-535).
#
# Upstream calls this "a legacy processor" and points at Asciidoctor for new
# work. That is the right advice for new documents and irrelevant here: the
# kernel's sources are AsciiDoc-the-original, and Asciidoctor is Ruby, which
# Peios does not package.
#
# A private Python APPLICATION: nothing should `import asciidoc`, so the
# modules go to /usr/lib/<triplet>/asciidoc and only the generated
# /usr/bin/asciidoc and /usr/bin/a2x put that directory on sys.path. See
# _pybuild_/README.md.
#
# a2x renders man pages by running xsltproc over its own DocBook
# customisation layer, which imports the DocBook XSL stylesheets by their
# canonical URI -- so docbook-xsl and its catalog are runtime dependencies,
# not just build ones, and a consumer must have XML_CATALOG_FILES pointed at
# that catalog (or be on a booted system, where /etc/xml/catalog is it).
#
#   pekit publish --version 10.2.1 --env peipkg --keyring dev

out_dir = "out"

[source.pypi]
project  = "asciidoc"
artifact = "sdist"
# Soft maintenance floor: automatic sweeps follow every newer compatible
# upstream release; older history is intentionally outside this recipe.
versions = ">= 10.2.1"

[build.main]
command = """
SRC="$(pwd)"
python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/install-wheel" \
  --backend setuptools.build_meta --copy-tree --private asciidoc \
  --out "$PEKIT_OUT" "$SRC"

# Asciidoc's configuration -- asciidoc.conf, the backend definitions, and the
# docbook-xsl customisation layers a2x applies -- ships inside the wheel as
# package data under asciidoc/resources/, where its own lookup expects it
# relative to the module.

# The PyPI sdist does not carry the pytest suite, but it does carry upstream's
# doctests. Run those, then exercise the complete a2x -> DocBook -> xmllint ->
# xsltproc path by building the two man pages upstream added to the 10.2.1
# sdist for distributors. Peios build roots expose the catalog at its package
# path while Debian-family build roots use the conventional /etc path.
python3 -m asciidoc.asciidoc --doctest
MAN="$PEKIT_OUT/usr/share/man/man1"
mkdir -p "$MAN"
if [ -f /usr/etc/xml/catalog ]; then
  export XML_CATALOG_FILES=/usr/etc/xml/catalog
elif [ -f /etc/xml/catalog ]; then
  export XML_CATALOG_FILES=/etc/xml/catalog
else
  echo "asciidoc: no DocBook XML catalog found" >&2
  exit 1
fi
for page in asciidoc a2x; do
  python3 -m asciidoc.a2x -f manpage -D "$MAN" "$SRC/doc/$page.1.txt"
  test -s "$MAN/$page.1" || {
    echo "asciidoc: a2x produced no $page(1) page" >&2
    exit 1
  }
done
"""

[build.main.dependencies.peipkg]
dash                 = "*"
coreutils-gnu        = "*"
python3              = ">= 3.14, < 3.15"
"python3-setuptools" = "*"
xsltproc             = "*"
"libxml2-utils"      = "*"
"docbook-xsl"        = "*"
"docbook-xml"        = "*"

[build.main.dependencies.apt]
python3            = "*"
python3-setuptools = "*"
xsltproc           = "*"
libxml2-utils      = "*"
docbook-xsl        = "*"
docbook-xml        = "*"
