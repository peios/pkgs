format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "io.github.asciidoc-py.asciidoc"
version      = "{{version}}-2"
# x86_64, not noarch: a private application's modules live under the triplet
# directory, and its bytecode is bound to this interpreter.
architecture = "x86_64"
description  = "AsciiDoc - text document format processor, with a2x"
license      = "GPL-2.0-or-later"
homepage     = "https://asciidoc-py.github.io/"

[dependencies]
python3 = ">= 3.14, < 3.15"
# a2x renders man pages with xsltproc over the DocBook stylesheets; both are
# needed at run time, not merely to build this package.
"org.gnome.libxslt-utils"       = ">= 1.1.45"
"org.docbook.docbook-xsl"       = ">= 1.79.2-4"
# a2x validates its generated DocBook with `xmllint --valid` before
# transforming it, so both the tool and the DTD are runtime requirements.
"org.gnome.libxml2-utils"       = ">= 2.15.4"
"org.oasis-open.docbook-xml"    = ">= 4.5"

[files]
"@source:LICENSE"                         = "usr/share/licenses/io.github.asciidoc-py.asciidoc/"
":usr/bin/**"                             = "usr/bin"
":usr/share/man/man1/*.1"                 = "usr/share/man/man1"
":usr/lib/x86_64-linux-peios/asciidoc/**" = "usr/lib/x86_64-linux-peios/asciidoc"
