# ca-certificates — Mozilla's CA root store, as package data.
#
# This package ships one file: /usr/share/ca-certificates/mozilla.crt. It is
# **data, not configuration**. The machine's trust store is composed by
# trustd from this bundle plus the additions and distrusts under
# Machine\System\Trust\Certificates, and rendered to /etc/ssl. Nothing on a
# running machine reads this file except trustd.
#
# Why the roots are a package rather than a registry seed: Mozilla removes
# roots as often as it adds them, and `reg apply` is additive — a root pulled
# for misissuance would linger in the registry until somebody noticed.
# Package upgrade semantics already do exactly the right thing (old payload
# out, new payload in), and it keeps a domain audit legible: every row under
# Trust\ is a decision somebody made, not a hundred and fifty rows of
# upstream churn.
#
# ## Where the bytes come from
#
# certdata.txt, first-hand from Mozilla's source tree — the same file curl's
# mk-ca-bundle.pl reads, on the branch Firefox releases from. Not the NSS
# release tarball: a root change lands as a commit here and only rides into
# a tagged NSS release weeks later, and the emergency path on Peios is
# `trust distrust` (seconds, no rebuild) rather than a bundle bump, so
# freshness of *additions* is all this cadence governs.
#
# Every change to that file is a public commit with an author and a history,
# which is a better audit trail than either a tarball or a regenerated
# bundle. What it is not is *signed*: Mozilla publishes SHA256SUMS for NSS
# releases and nothing for the source tree, and curl publishes only a
# .sha256 — a checksum served from the same host over the same TLS session,
# which adds nothing against a compromised host. So there is deliberately no
# [source.url.signature] block here; pekit's lockfile pins the bytes
# trust-on-first-use instead, and re-fetches of a locked version become
# tamper-evident.
#
# ## What guards the conversion
#
# The converter encodes the trust decision, so it is guarded three ways:
# a floor (a bundle below it is a parser regression, not a small store), a
# diff against the previously shipped bundle (a root appearing without
# explanation is what a compromise looks like), and a cross-check against
# curl's independently produced bundle. The cross-check is not decoration:
# it is what caught a comment *inside* a trust record splitting the object
# and silently dropping a trusted root — 120 roots instead of 121, far above
# any floor, with no previous bundle to diff against.

out_dir = "out"

[source.url]
url     = "https://raw.githubusercontent.com/mozilla-firefox/firefox/refs/heads/release/security/nss/lib/ckfw/builtins/certdata.txt"
extract = false

[build]
command = """
set -eu

# The working directory is where the URL source was downloaded; the
# recipe's own files (the converter, the previous bundle) are under
# PEKIT_RECIPE_ROOT.
SRC="$PEKIT_RECIPE_ROOT"
CERTDATA="$(pwd)/certdata.txt"
test -f "$CERTDATA" || { echo "certdata.txt was not fetched" >&2; exit 1; }

mkdir -p "$PEKIT_OUT/usr/share/ca-certificates"

# curl runs its own extractor over the same certdata.txt; if the two
# disagree by more than a root or two, one of us has the trust bits wrong.
# Fetched best-effort: an offline build still produces a correct bundle, it
# just loses the second opinion.
CROSS=""
if curl -sS --max-time 30 -o "$PEKIT_OUT/cacert.pem" https://curl.se/ca/cacert.pem; then
  CROSS="--cross-check $PEKIT_OUT/cacert.pem"
else
  echo "note: could not fetch curl's bundle; building without the cross-check" >&2
fi

python3 "$SRC/tools/certdata-to-pem.py" "$CERTDATA" \\
  -o "$PEKIT_OUT/usr/share/ca-certificates/mozilla.crt" \\
  --floor 100 \\
  --source "certdata.txt from the Firefox release branch, {{version}}" \\
  --previous "$SRC/previous/mozilla.crt" \\
  $CROSS

rm -f "$PEKIT_OUT/cacert.pem"

# Keep this build's bundle as the baseline the next bump diffs against, and
# commit it: the diff between two published root stores then becomes an
# ordinary `git diff` on this recipe, which is the most reviewable form the
# question "what changed about what this machine trusts" can take.
mkdir -p "$SRC/previous"
cp "$PEKIT_OUT/usr/share/ca-certificates/mozilla.crt" "$SRC/previous/mozilla.crt"
"""

[build.dependencies.peipkg]
python3 = "*"
curl = "*"

[clean]
command = "rm -rf out"
