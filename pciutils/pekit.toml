# pciutils — PCI bus tools + libpci (the Containerfile's libpci-dev row;
# PEI-158 Tier 2 — verify the in-tree consumer when build.tools goes
# green, it is an optional feature probe).
#
# NOT autotools — kernel.org Makefile variables, built in a tree copy (the
# bzip2 dance). Shared libpci on; zlib off (uncompressed pci.ids — no
# runtime zlib dep for the library); DNS off (no libresolv network
# queries); HWDB off (no udev in the seed). sbin tools redirected to
# /usr/bin (usrmerge).

out_dir = "out"

[source.url]
url      = "https://cdn.kernel.org/pub/software/utils/pciutils/pciutils-{{version}}.tar.xz"
extract  = true
root     = "pciutils-{{version}}"
versions = ">= 3.15"

[build.main]
command = """
SRC="$(pwd)"
LIBDIR=/usr/lib/x86_64-linux-peios
mkdir -p "$PEKIT_OUT/build"
cp -a "$SRC/." "$PEKIT_OUT/build/"
cd "$PEKIT_OUT/build"
make -j"$(nproc)" PREFIX=/usr LIBDIR="$LIBDIR" SBINDIR=/usr/bin \
  MANDIR=/usr/share/man SHARED=yes ZLIB=no DNS=no HWDB=no
make install install-lib DESTDIR="$PEKIT_OUT" PREFIX=/usr LIBDIR="$LIBDIR" \
  SBINDIR=/usr/bin MANDIR=/usr/share/man SHARED=yes ZLIB=no DNS=no HWDB=no
rm -rf "$PEKIT_OUT/build"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
pkgconf = "*"

[build.main.dependencies.apt]
build-essential = "*"
pkg-config = "*"
