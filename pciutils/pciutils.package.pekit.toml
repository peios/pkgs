# pciutils — the PCI tools (lspci, setpci) and the pci.ids database.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "pciutils"
description = "pciutils - PCI bus inspection tools (lspci, setpci) and pci.ids"

[dependencies]
glibc  = ">= 2.43"
libpci = "{{version}}"

[files]
"@source:COPYING"    = "usr/share/licenses/pciutils/"
":usr/bin/**"        = "usr/bin"
":usr/share/pci.ids" = "usr/share/pci.ids"
":usr/share/man/**"  = "usr/share/man"
