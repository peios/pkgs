# pciutils-devel — pci/*.h, the libpci.so link, and pkg-config metadata.

[package]
name        = "pciutils-devel"
description = "pciutils - libpci headers and link library"

[dependencies]
libpci = "{{version}}"

[files]
":usr/include/**"                          = "usr/include"
":usr/lib/x86_64-linux-peios/libpci.so"    = "usr/lib/x86_64-linux-peios/libpci.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**" = "usr/lib/x86_64-linux-peios/pkgconfig"
