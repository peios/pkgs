# patchelf — the ELF rpath/interpreter/needed editor the debug-split pipelines use.
#
# Phase-1 build-base leaf (PEI-155): C++ autotools from the GitHub release
# tarball (ships configure).

out_dir = "out"

[source.url]
url      = "https://github.com/NixOS/patchelf/releases/download/{{version}}/patchelf-{{version}}.tar.gz"
extract  = true
root     = "patchelf-{{version}}"
versions = ">= 0.18.0"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/doc" "$PEKIT_OUT/usr/share/zsh"
"""

[build.main.dependencies.peipkg]
"build-essentials-c++" = "*"

[build.main.dependencies.apt]
build-essential = "*"
