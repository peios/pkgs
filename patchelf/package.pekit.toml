format = "peipkg"

[package]
name         = "patchelf"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "patchelf - modify ELF interpreter, rpath, and needed entries"
license      = "GPL-3.0-or-later"
homepage     = "https://github.com/NixOS/patchelf"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING*" = "usr/share/licenses/patchelf/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
