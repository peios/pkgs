format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "elfutils"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "elfutils - libelf/libdw/libasm and the eu-* ELF tools"
license      = "GPL-3.0-or-later AND (GPL-2.0-or-later OR LGPL-3.0-or-later)"
homepage     = "https://sourceware.org/elfutils/"

[dependencies]
glibc = ">= 2.43"
zlib  = ">= 2.3.3"

[files]
"@source:COPYING*" = "usr/share/licenses/elfutils/"
":usr/bin/**"                              = "usr/bin"
# Versioned runtime libraries + their soname links; the unversioned dev
# links live in elfutils-devel.
":usr/lib/x86_64-linux-peios/lib*-{{version}}.so" = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/lib*.so.1"           = "usr/lib/x86_64-linux-peios"
":usr/share/man/**"                        = "usr/share/man"
