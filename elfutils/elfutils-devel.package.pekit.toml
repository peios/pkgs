format = "peipkg"

[package]
name         = "elfutils-devel"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "elfutils - headers, unversioned library links, and pkg-config files"
license      = "GPL-2.0-or-later OR LGPL-3.0-or-later"
homepage     = "https://sourceware.org/elfutils/"

[dependencies]
elfutils = "{{version}}"

[files]
":usr/include/**"                             = "usr/include"
":usr/lib/x86_64-linux-peios/libelf.so"       = "usr/lib/x86_64-linux-peios/libelf.so"
":usr/lib/x86_64-linux-peios/libdw.so"        = "usr/lib/x86_64-linux-peios/libdw.so"
":usr/lib/x86_64-linux-peios/libasm.so"       = "usr/lib/x86_64-linux-peios/libasm.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**"    = "usr/lib/x86_64-linux-peios/pkgconfig"
