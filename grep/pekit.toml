# grep — GNU grep.
#
# Phase-1 build-base leaf (PEI-155): plain autotools from the release tarball.
# --disable-perl-regexp keeps pcre2 out of the seed; build scripts never use
# `grep -P`.

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/grep/grep-{{version}}.tar.xz"
extract  = true
root     = "grep-{{version}}"
versions = ">= 3.11"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man --disable-nls --disable-perl-regexp
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info"
"""

[build.main.dependencies.peipkg]
gcc = "*"
make = "*"

[build.main.dependencies.apt]
build-essential = "*"
