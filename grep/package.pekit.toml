format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "grep"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU grep - pattern matching (built without PCRE; no -P)"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/grep/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING*" = "usr/share/licenses/grep/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
