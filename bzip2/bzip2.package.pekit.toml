# bzip2 — the tools + the runtime shared lib.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "bzip2"
description = "bzip2 - block-sorting compression (bzip2, bunzip2, bzcat)"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:LICENSE"   = "usr/share/licenses/bzip2/"
":usr/bin/**"       = "usr/bin"
":usr/lib/x86_64-linux-peios/libbz2.so.1*" = "usr/lib/x86_64-linux-peios"
":usr/share/man/**" = "usr/share/man"
