# libstdc++-devel — the headers and link-time .so symlink needed to compile and
# link C++ against libstdc++. The static archives are libstdc++-static.

[package]
description = "GNU Standard C++ Library - development files"

[dependencies]
# The dev .so symlink resolves into libstdc++'s versioned lib, and the headers
# must match its ABI; pin the same upstream version.
"libstdc++" = "{{version}}"

[files]
# The C++ standard library headers (<vector>, <string>, ... + the target-specific
# bits/c++config.h under the build triplet subdir).
":usr/include/c++/**"                      = "usr/include/c++"
# Developer .so symlink (libstdc++.so -> libstdc++.so.6).
":usr/lib/x86_64-linux-peios/libstdc++.so" = "usr/lib/x86_64-linux-peios/libstdc++.so"
