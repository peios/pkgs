# libgcc-debugsource — the GCC runtime sources referenced by the debug info,
# under /usr/src/debug/gcc, so gdb/debuginfod can show source lines (not just
# file:line). The build's debug-split rewrites the DWARF comp_dir to point here
# (debugedit) and stages exactly the sources the shipped runtime libs reference.
# Pairs with libgcc-debuginfo; depends on it (source without symbols is useless).

[package]
description = "GCC runtime libraries - debug sources"

[dependencies]
libgcc-debuginfo = "{{version}}"

[files]
":usr/src/debug/**" = "usr/src/debug"
