# libgcc-debuginfo — separated debug symbols for the WHOLE gcc-runtime family
# (libgcc_s, libstdc++, libatomic, libgomp, libquadmath). The build's debug-split
# is build-id-indexed (one /usr/lib/debug/.build-id/ tree), so it cannot be sliced
# per-lib — it's a single package, attached to libgcc (the most fundamental member,
# so the family's debug is reachable wherever any of these libs is installed).
# Same single-debuginfo model as glibc and zlib-ng.
#
# Static-archive debug is NOT here — shipped *.a are --strip-debug'd at build time
# (archive members have no build-id to index).

[package]
description = "GCC runtime libraries - debugging symbols"

[dependencies]
# Symbols are matched to a specific build by build-id; pin the matching upstream
# gcc version (any revision).
libgcc = "{{version}}"

[files]
":usr/lib/debug/**" = "usr/lib/debug"
