# libquadmath-static — the static archive for statically linking libquadmath.
# --strip-debug'd at build time (archive members carry no build-id to index).

[package]
description = "GCC __float128 math runtime - static library"

[dependencies]
"libquadmath-devel" = "{{version}}"

[files]
":usr/lib/x86_64-linux-peios/libquadmath.a" = "usr/lib/x86_64-linux-peios/libquadmath.a"
