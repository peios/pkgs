# libcc1 — the plugin library gdb loads for its `compile` command, which lets a
# debugging session compile and inject C/C++ against the inferior's own types
# and scope. Built by gcc, consumed by gdb.
#
# Its own package rather than part of `gcc`, following the pattern the rest of
# this recipe already uses (libgcc, libstdc++, libatomic, libgomp, libitm,
# libquadmath). The reason is the dependency direction: this is a library FOR
# gdb, so folding it into `gcc` would put the whole compiler in the install
# closure of a debugger. Same mistake as bundling libgmpxx into gmp.
#
# It was previously built and then dropped — matched by no glob in any member.
# Peios has no gdb package yet, so nothing consumes it today; it is packaged
# rather than disabled so the debugger has it waiting, and because silently
# discarding a built artefact is how the first orphan check found it.

[package]
description = "GCC support library for GDB's compile command"

[dependencies]
# Links libstdc++ and libgcc_s of exactly this build.
"libstdc++" = "{{version}}"
libgcc      = "{{version}}"
glibc       = ">= 2.43"

[files]
# SONAME symlink (libcc1.so.0), real object, and the plugin .so gdb dlopens by
# unversioned name.
":usr/lib/x86_64-linux-peios/libcc1.so*" = "usr/lib/x86_64-linux-peios"
