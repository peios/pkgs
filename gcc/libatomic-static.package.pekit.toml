# libatomic-static — the static archive for statically linking libatomic.
# --strip-debug'd at build time (archive members carry no build-id to index).

[package]
description = "GCC atomic operations runtime - static library"

[dependencies]
"libatomic-devel" = "{{version}}"

[files]
":usr/lib/x86_64-linux-peios/libatomic.a"          = "usr/lib/x86_64-linux-peios/libatomic.a"
":usr/lib/x86_64-linux-peios/libatomic_asneeded.a" = "usr/lib/x86_64-linux-peios/libatomic_asneeded.a"
