# libgcc — GCC's low-level runtime support library (libgcc_s.so.1): the stack
# unwinder (_Unwind_*, used by C++ exceptions, pthread_cancel, cleanup handlers)
# and the soft-arithmetic helpers. The most fundamental compiler runtime — even
# glibc depends on it, which is why the family debuginfo attaches here. The dev
# .so symlink, static libgcc.a, and crt startup objects are compiler-internal
# (milestone 2), not here.
#
# ":" = the default "main:" build. An exact-file source maps to a FULL path.

[package]
description = "GCC low-level runtime library (libgcc_s.so.1)"

[dependencies]
# Floor = the glibc we build & test against (Peios ships only 2.43); >= so a
# future glibc still satisfies it (glibc is backward-compatible).
glibc = ">= 2.43"

[files]
# The real SONAME object (libgcc_s has no further-versioned file). The libgcc_s.so
# dev symlink is left for the milestone-2 toolchain.
":usr/lib/x86_64-linux-peios/libgcc_s.so.1" = "usr/lib/x86_64-linux-peios/libgcc_s.so.1"
