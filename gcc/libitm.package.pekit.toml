# libitm — GCC's GNU Transactional Memory runtime (libitm.so.1), linked into code
# compiled with -fgnu-tm (transactional memory constructs). The dev .so symlink is
# libitm-devel; the static archive is libitm-static; the libitm.spec driver
# fragment ships in gcc (with the other specs).
#
# A glob source ("so.1*") maps to a DIRECTORY.

[package]
description = "GCC transactional memory runtime library (libitm.so.1)"

[dependencies]
glibc = ">= 2.43"

[files]
# SONAME symlink (libitm.so.1) + real object (libitm.so.1.N.N).
":usr/lib/x86_64-linux-peios/libitm.so.1*" = "usr/lib/x86_64-linux-peios"
