# libitm-static — the static archive for statically linking libitm.
# --strip-debug'd at build time (archive members carry no build-id to index).

[package]
description = "GCC transactional memory runtime - static library"

[dependencies]
"libitm-devel" = "{{version}}"

[files]
":usr/lib/x86_64-linux-peios/libitm.a" = "usr/lib/x86_64-linux-peios/libitm.a"
