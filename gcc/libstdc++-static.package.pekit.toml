# libstdc++-static — static archives for statically linking the C++ standard
# library (discouraged but supported). libsupc++.a is the C++ ABI runtime;
# libstdc++exp.a the experimental/contracts bits; libstdc++fs.a the pre-C++17
# <filesystem> shim. Split out (like glibc-static) since static C++ linking is
# the exception, not the rule.

[package]
description = "GNU Standard C++ Library - static libraries"

[dependencies]
# Static linking also needs the headers + dev symlink.
"libstdc++-devel" = "{{version}}"

[files]
":usr/lib/x86_64-linux-peios/libstdc++.a"    = "usr/lib/x86_64-linux-peios/libstdc++.a"
":usr/lib/x86_64-linux-peios/libstdc++exp.a" = "usr/lib/x86_64-linux-peios/libstdc++exp.a"
":usr/lib/x86_64-linux-peios/libstdc++fs.a"  = "usr/lib/x86_64-linux-peios/libstdc++fs.a"
":usr/lib/x86_64-linux-peios/libsupc++.a"    = "usr/lib/x86_64-linux-peios/libsupc++.a"
