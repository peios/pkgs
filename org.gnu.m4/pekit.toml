# GNU M4 — the macro processor used by Autoconf and many native source builds.
# The signed release archive carries its generated build system, avoiding a
# bootstrap dependency on M4 itself.

out_dir = "out"

[source.url]
url         = "https://ftp.gnu.org/gnu/m4/m4-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/m4/"
extract     = true
root        = "m4-{{version}}"
file_regex  = 'm4-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz'
# Soft maintenance floor. Follow newer stable 1.x releases automatically;
# M4 2.x is expected to change compatibility surfaces and needs review.
versions    = ">= 1.4.21, < 2"

# GNU publishes a detached signature next to every release archive. Eric
# Blake's complete primary fingerprint is stated in GNU's 1.4.21 release
# announcement, and the pinned key is extracted from GNU's official keyring.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/eric-blake.asc"]
fingerprints = ["71C2CC22B1C4602927D2F3AAA7A16B4A2527436A"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
BIN="$PEKIT_OUT/usr/bin/m4"
cd "$PEKIT_OUT"

# Peios has no legacy /bin contract. Compile syscmd/esyscmd to invoke the
# declared Dash runtime directly. Force the CET property note because
# Debian's unmarked startup objects otherwise make the linker's conservative
# note merge discard it even though the program is built with -fcf-protection.
LDFLAGS="$LDFLAGS -Wl,-z,ibt,-z,shstk" \
"$SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --localedir=/usr/share/locale \
  --with-syscmd-shell=/usr/bin/sh \
  --disable-silent-rules

make -j"$(nproc)"

# Run the complete release suite, including Gnulib portability tests and the
# Perl-backed copyright helper test. Automake's summaries must contain at
# least one passing test and no failure or harness error.
make -j"$(nproc)" check
find . -name test-suite.log -type f | grep -q .
grep -R -q '^# PASS:' --include='test-suite.log' .
if grep -R -E '^# (FAIL|ERROR):[[:space:]]+[1-9]' --include='test-suite.log' .; then
  exit 1
fi

make install DESTDIR="$PEKIT_OUT"

# Peios does not currently ship an Info reader. Preserve the command manual
# and translated diagnostics, but omit orphaned Info and package docs.
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"

test -x "$BIN"
test -f "$PEKIT_OUT/usr/share/man/man1/m4.1"
test -n "$(find "$PEKIT_OUT/usr/share/locale" -type f -name 'm4.mo' -print -quit)"
test "$(find "$PEKIT_OUT/usr/bin" -type f | wc -l)" -eq 1

# Exercise the staged program as a real consumer: ordinary expansion,
# include-path lookup, frozen-state round trip and the configured syscmd shell.
SMOKE="$PEKIT_OUT/.m4-smoke"
mkdir -p "$SMOKE"
cat > "$SMOKE/basic.m4" <<'EOF'
changequote(`[', `]')dnl
define([GREETING], [Hello, $1!])dnl
GREETING([Peios])
EOF
test "$("$BIN" --fatal-warnings "$SMOKE/basic.m4")" = "Hello, Peios!"

cat > "$SMOKE/defs.m4" <<'EOF'
define([INCLUDED], [included-ok])dnl
EOF
cat > "$SMOKE/include.m4" <<'EOF'
changequote(`[', `]')dnl
include([defs.m4])INCLUDED
EOF
test "$("$BIN" --fatal-warnings -I "$SMOKE" "$SMOKE/include.m4")" = "included-ok"

cat > "$SMOKE/freeze.m4" <<'EOF'
changequote(`[', `]')dnl
define([FROZEN], [state-ok])dnl
EOF
"$BIN" -F "$SMOKE/state.m4f" "$SMOKE/freeze.m4"
test "$(printf '%s\n' FROZEN | "$BIN" -R "$SMOKE/state.m4f")" = "state-ok"
cat > "$SMOKE/syscmd.m4" <<'EOF'
changequote(`[', `]')dnl
esyscmd([printf syscmd-ok])
EOF
test "$("$BIN" --fatal-warnings "$SMOKE/syscmd.m4")" = "syscmd-ok"
"$BIN" --version | head -1 | grep -F "$PEKIT_VERSION"
rm -rf "$SMOKE"

# Split the sole shipped ELF by build ID, rewrite its DWARF paths to the
# canonical package namespace and retain every referenced source file.
cd "$PEKIT_OUT"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
patchelf --remove-rpath usr/bin/m4 2>/dev/null || true
: > "$PEKIT_OUT/.srclist"
debugedit -b "$ROOT" -d /usr/src/debug/org.gnu.m4 \
  -l "$PEKIT_OUT/.srclist" -n usr/bin/m4
bid=$(readelf -n usr/bin/m4 | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
test -n "$bid"
p2=$(printf %s "$bid" | cut -c1-2)
rest=$(printf %s "$bid" | cut -c3-)
mkdir -p "usr/lib/debug/.build-id/$p2"
objcopy --only-keep-debug usr/bin/m4 "usr/lib/debug/.build-id/$p2/$rest.debug"
chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"

tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | LC_ALL=C sort -u \
  | while IFS= read -r rel; do
      test -n "$rel" || continue
      case "$rel" in */) continue;; esac
      test -f "$ROOT/$rel" || continue
      mkdir -p "usr/src/debug/org.gnu.m4/$(dirname "$rel")"
      cp "$ROOT/$rel" "usr/src/debug/org.gnu.m4/$rel"
    done
strip usr/bin/m4
rm -f "$PEKIT_OUT/.srclist"

test "$(find usr/lib/debug/.build-id -type f -name '*.debug' | wc -l)" -eq 1
test "$(find usr/src/debug/org.gnu.m4 -type f | wc -l)" -gt 10

# Assert the exact stripped payload that will ship.
readelf -h usr/bin/m4 | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l usr/bin/m4 | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l usr/bin/m4 | grep -F 'GNU_RELRO'
readelf -d usr/bin/m4 | grep -F 'BIND_NOW'
readelf -d usr/bin/m4 | grep -F 'RELR'
readelf -n usr/bin/m4 | grep -E 'x86 feature:.*IBT.*SHSTK'
if readelf -d usr/bin/m4 | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
usr/bin/m4 --version | head -1 | grep -F "$PEKIT_VERSION"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
debugedit          = "*"
gettext            = "*"
patchelf           = "*"
perl               = "*"

[build.main.dependencies.apt]
build-essential = "*"
gettext         = "*"
perl            = "*"
debugedit       = "*"
patchelf        = "*"
