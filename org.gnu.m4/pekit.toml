# GNU M4 — the macro processor used by Autoconf and many native source builds.
# Regenerate configure for the carried Gnulib/glibc compatibility fix using
# the declared bootstrap Autoconf toolchain.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source]
patches = "patches"

[source.url]
url         = "https://ftp.gnu.org/gnu/m4/m4-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/m4/"
extract     = true
root        = "m4-{{version}}"
file_regex  = 'm4-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)\.tar\.xz'
# Soft maintenance floor. Follow every newer authenticated stable release;
# incompatible macro-language changes stop at the build and test gates.
versions    = ">= 1.4.21"

# GNU publishes a detached signature next to every release archive. Eric
# Blake's complete primary fingerprint is stated in GNU's 1.4.21 release
# announcement, and the pinned key is extracted from GNU's official keyring.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/eric-blake.asc"]
fingerprints = ["71C2CC22B1C4602927D2F3AAA7A16B4A2527436A"]

[build.main]
command = """
set -eu
cp -a . "$PEKIT_OUT/source"
SRC="$PEKIT_OUT/source"
cd "$SRC"
# Only a configure macro changed. Keep other shipped generated inputs current.
autoconf
# Only configure logic changed; retain upstream Automake and config-header outputs.
touch aclocal.m4 config.h.in
find "$SRC" -name Makefile.in -exec touch {} +
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.m4"
BIN="$PEKIT_OUT/usr/bin/m4"
cd "$PEKIT_OUT"

# Peios has no legacy /bin contract. Compile syscmd/esyscmd to invoke the
# declared Dash runtime directly. Generate IBT PLT entries without overriding
# the linker's compatibility-note merge for unmarked startup objects.
LDFLAGS="$LDFLAGS -Wl,-z,ibtplt" \
"$SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --localedir=/usr/share/locale \
  --with-syscmd-shell=/usr/bin/sh \
  --disable-silent-rules

make -j"$(nproc)"

make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -9n {} \\;

# Peios does not currently ship an Info reader. Preserve the command manual
# and translated diagnostics, but omit orphaned Info and package docs.
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"

# Split the sole shipped ELF by build ID, rewrite its DWARF paths to the
# canonical package namespace and retain every referenced source file.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.m4 "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"org.gnu.autoconf" = "*"
"org.gnu.gzip" = "*"
"dev.peios.build-essentials-c" = "*"
"org.sourceware.debugedit"          = "*"
"org.gnu.gettext"            = "*"
"org.perl.perl"               = "*"

[build.main.dependencies.apt]
autoconf = "*"
gzip = "*"
build-essential = "*"
gettext         = "*"
perl            = "*"
debugedit       = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
BIN="$STAGE/usr/bin/m4"
SMOKE="$PEKIT_OUT/smoke"
cd "$STAGE"

make -j"$(nproc)" check
find . -name test-suite.log -type f | grep -q .
grep -R -q '^# PASS:' --include='test-suite.log' .
if grep -R -E '^# (FAIL|ERROR):[[:space:]]+[1-9]' --include='test-suite.log' .; then
  exit 1
fi

test -x "$BIN"
test -f "$STAGE/usr/share/man/man1/m4.1.gz"
test -n "$(find "$STAGE/usr/share/locale" -type f -name 'm4.mo' -print -quit)"
test "$(find "$STAGE/usr/bin" -type f | wc -l)" -eq 1

mkdir -p "$SMOKE"
cat > "$SMOKE/basic.m4" <<'EOF'
changequote(`[', `]')dnl
define([GREETING], [Hello, $1!])dnl
GREETING([Peios])
EOF
test "$("$BIN" --fatal-warnings "$SMOKE/basic.m4")" = "Hello, Peios!"
cat > "$SMOKE/defs.m4" <<'EOF'
define([INCLUDED], [included-ok])dnl
EOF
cat > "$SMOKE/include.m4" <<'EOF'
changequote(`[', `]')dnl
include([defs.m4])INCLUDED
EOF
test "$("$BIN" --fatal-warnings -I "$SMOKE" "$SMOKE/include.m4")" = "included-ok"
cat > "$SMOKE/freeze.m4" <<'EOF'
changequote(`[', `]')dnl
define([FROZEN], [state-ok])dnl
EOF
"$BIN" -F "$SMOKE/state.m4f" "$SMOKE/freeze.m4"
test "$(printf '%s\n' FROZEN | "$BIN" -R "$SMOKE/state.m4f")" = "state-ok"
cat > "$SMOKE/syscmd.m4" <<'EOF'
changequote(`[', `]')dnl
esyscmd([printf syscmd-ok])
EOF
test "$("$BIN" --fatal-warnings "$SMOKE/syscmd.m4")" = "syscmd-ok"
"$BIN" --version | head -1 | grep -F "$PEKIT_VERSION"

test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test "$(find "$STAGE/usr/src/debug/org.gnu.m4" -type f | wc -l)" -gt 10
readelf -h "$BIN" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l "$BIN" | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l "$BIN" | grep -F 'GNU_RELRO'
readelf -d "$BIN" | grep -F 'BIND_NOW'
readelf -d "$BIN" | grep -F 'RELR'
if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
  readelf -n "$BIN" | grep -E 'x86 feature:.*IBT.*SHSTK'
fi
if readelf -d "$BIN" | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.findutils"            = "*"
"org.gnu.grep"                 = "*"
"org.perl.perl"                = "*"
"org.gnu.binutils"             = "*"

[test.dependencies.apt]
build-essential = "*"
findutils       = "*"
grep            = "*"
perl            = "*"
binutils        = "*"
