# disk-boot — the main-root half of disk boot. Owns the cmdline TEMPLATE and
# pulls the initramfs half (disk-boot-irf) into the initramfs root via a
# cross-root dependency, exactly as live-boot does. Installing disk-boot in /
# brings the whole disk-boot machinery with it.

[package]
description = "Disk boot support: kernel cmdline template + initramfs root-mount hook"

# disk-boot-irf's home is the initramfs root, so this edge carries IN initramfs
# (the table `root` field).
[dependencies]
disk-boot-irf = { constraint = ">= 1.0.0", root = "initramfs" }

# The cmdline TEMPLATE — deliberately not the finished article. It carries
# everything an installed system needs except `root=`, which cannot be package
# data because it names a filesystem that does not exist until install time.
# peios-install reads this file, appends the target root's UUID, and writes the
# result to /lcl/etc/boot/cmdline on the target: package data supplies the
# stable part, the operator tree holds the per-install part, and mkuki is
# pointed at the latter.
#
# Nothing here selects services. An installed system's login prompt comes from
# the authd, lpsd and login SERVICE DEFINITIONS in the registry hive, which
# travel with the copied /var/state/loregd — not from the kernel command line.
# The template used to carry `peios.login=1` to inject those three as
# compiled-in definitions; peinit retired that token (along with
# `peios.console=1`) when they became ordinary registry data, and its parser
# now ignores both. Do not re-add either token expecting it to do anything: if
# an installed system reaches a console nobody can log into, the fault is in
# the seeded registry data or in the packages that seed it, and the command
# line is the wrong place to look.
#
# One deliberate difference from live-boot's cmdline, because an installed
# system is not a live medium:
#
#   no panic=-1    live-boot sets it so a panic exits QEMU during testing. On
#                  a persistent system it means "reboot immediately on panic",
#                  which turns any reproducible boot failure into a reboot
#                  loop with the message scrolling past. Halting and leaving
#                  the panic on screen is the more useful behaviour for
#                  something you have to actually recover.
[files]
"src/cmdline" = "usr/share/disk-boot/cmdline"
