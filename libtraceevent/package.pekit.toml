# Shared defaults layer for the libtraceevent members (a bare
# package.pekit.toml is never a package once named members exist).

format = "peipkg"

[package]
version      = "{{version}}-1"
architecture = "x86_64"
license      = "LGPL-2.1-only"
homepage     = "https://git.kernel.org/pub/scm/libs/libtrace/libtraceevent.git"
