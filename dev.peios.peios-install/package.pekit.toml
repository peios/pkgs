# peios-install — the installer, as one shell script.
#
# /usr/bin, not /usr/sbin: /sbin is for daemons, which appear in service
# definitions. This is a privileged binary a person runs, invoked as
# `peios-install` through the /bin view.
#
# noarch: the payload is a shell script and its manual. Its dependencies
# resolve for the target machine.

format = "peipkg"
side_effects = ["man-db"]

[package]
name         = "dev.peios.peios-install"
version      = "0.3.0-1"
architecture = "noarch"
description  = "Install the running Peios system onto a disk, partitioning it if asked"
license      = "MIT"
license_class = "free"
homepage     = "https://github.com/peios/pkgs"

# Every tool the script calls, declared. peiosutils supplies mount, umount,
# lsblk, cp, mkdir, sync, reg, part, mkirf and mkuki; e2fsprogs supplies mke2fs
# (with the Peios -E root_sddl= extension the install depends on); dosfstools
# supplies mkfs.vfat for the ESP; peipkg performs the package swap on the
# target.
#
# Nothing here pulls in disk-boot, and nothing can: it is the one package this
# installer must NOT have. disk-boot pulls disk-boot-irf into the initramfs
# root, where it conflicts with live-boot-irf, so a live image naming both the
# installer and live-boot would not resolve. What has to carry disk-boot is the
# machine being INSTALLED, and the installer puts it there from the medium's
# repository.
#
# The script calls no other external command — deliberately. Peios ships no
# grep and no gzip, so a check reaching for either would exit 127 and pass
# silently.
[dependencies]
sh = ">= 1"
"dev.peios.peiosutils" = ">= 0.8.5-1"
"net.sourceforge.e2fsprogs" = ">= 1.47.4"
"io.github.dosfstools.dosfstools" = ">= 4.2-1"
"dev.peios.peipkg" = ">= 0.1.3-1"

[files]
"LICENSE" = "usr/share/licenses/dev.peios.peios-install/LICENSE"
":usr/bin/peios-install" = "usr/bin/peios-install"
":usr/share/man/man1/peios-install.1.gz" = "usr/share/man/man1/peios-install.1.gz"
