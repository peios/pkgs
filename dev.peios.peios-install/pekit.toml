# peios-install — install the running live system onto a disk.
#
# The build stages the exact installed payload. Syntax, destructive-operation
# guards and source-to-payload identity are release gates.
#
# Scope is the minimum that produces a bootable installed system: format,
# copy the tree, write a UKI to the ESP. Since 0.2.0 it can also partition the
# target first (--whole-disk), delegating to `part` rather than reimplementing
# GPT — so the two forms are "here are two partitions" and "here is a disk".
# Nothing here needs privilege beyond what the operation itself is authorised
# for; there is no uid check anywhere, as everywhere else in Peios.

out_dir = "out"

[build.main]
command = '''
set -eu
mkdir -p "$PEKIT_OUT/usr/bin" "$PEKIT_OUT/usr/share/man/man1"
gzip -n -9 -c man/peios-install.1 > "$PEKIT_OUT/usr/share/man/man1/peios-install.1.gz"
cp src/peios-install.sh "$PEKIT_OUT/usr/bin/peios-install"
if command -v mkexec >/dev/null 2>&1; then
  mkexec "$PEKIT_OUT/usr/bin/peios-install"
else
  chmod 0755 "$PEKIT_OUT/usr/bin/peios-install"
fi
'''

[build.main.dependencies.peipkg]
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils"   = "*"
"org.gnu.gzip" = "*"

[build.main.dependencies.apt]
dash      = "*"
coreutils = "*"
gzip = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
sh -n src/peios-install.sh
sh tests/test-peios-install.sh
sh -n "$PEKIT_MAIN_OUT/usr/bin/peios-install"
src_sum=$(sha256sum src/peios-install.sh)
src_sum=${src_sum%% *}
installed_sum=$(sha256sum "$PEKIT_MAIN_OUT/usr/bin/peios-install")
installed_sum=${installed_sum%% *}
test "$src_sum" = "$installed_sum"
gzip -t "$PEKIT_MAIN_OUT/usr/share/man/man1/peios-install.1.gz"
man_sum=$(sha256sum man/peios-install.1)
man_sum=${man_sum%% *}
installed_man_sum=$(gzip -cd "$PEKIT_MAIN_OUT/usr/share/man/man1/peios-install.1.gz" | sha256sum)
installed_man_sum=${installed_man_sum%% *}
test "$man_sum" = "$installed_man_sum"
'''

[test.dependencies.peipkg]
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils"   = "*"
"org.gnu.gzip" = "*"

[test.dependencies.apt]
dash      = "*"
coreutils = "*"
gzip = "*"
