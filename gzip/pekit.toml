# gzip — the classic DEFLATE compressor; source tarballs and kernel builds
# feed on it.
#
# Phase-2a tool (PEI-155): autotools from the release tarball, out-of-source
# via DESTDIR (the m4 shape). Only gzip + the sh wrappers gunzip/zcat are
# packaged: the remaining z* conveniences (zgrep/zdiff/zless/…) shell out to
# grep/sed/less at runtime, and packaging them would smuggle undeclared
# runtime deps into every consumer root.

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/gzip/gzip-{{version}}.tar.xz"
extract  = true
root     = "gzip-{{version}}"
versions = ">= 1.14"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man --disable-nls
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
cd "$PEKIT_OUT/usr/bin"
for f in zcmp zdiff zegrep zfgrep zforce zgrep zless zmore znew uncompress; do rm -f "$f"; done
cd "$PEKIT_OUT/usr/share/man/man1"
for f in zcmp zdiff zegrep zfgrep zforce zgrep zless zmore znew uncompress; do rm -f "$f.1"; done
rm -rf "$PEKIT_OUT/usr/share/info"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
