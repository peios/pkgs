format = "peipkg"

[package]
name         = "gzip"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU gzip - DEFLATE compression (gzip, gunzip, zcat)"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/gzip/"

# gunzip/zcat are sh wrappers around gzip — the sh role covers them.
[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING"   = "usr/share/licenses/gzip/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
