format = "peipkg"

[package]
name         = "intel-ucode"
version      = "{{version}}-1"
architecture = "x86_64"
# Intel's microcode is redistributable as an unmodified binary under the Intel
# Software License Agreement shipped as LICENSE in the source tree. No standard
# SPDX id; LicenseRef per SPDX's custom-license convention.
license      = "LicenseRef-Intel-Microcode"
homepage     = "https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files"
# Microcode is consumed by the kernel from the EARLY initramfs region (before
# secondary CPUs come up), so this package homes in the initramfs root — like
# prelude. mkirf prepends the ++/ tree as the uncompressed early cpio ahead of
# the main archive; see peiosutils mkirf DESIGN §10.
default_root = "initramfs"
description  = "Intel CPU microcode update, early-loaded from the initramfs"

# The assembled container ships into a per-vendor early-cpio SEGMENT
# (++/intel-ucode/) at its kernel-ABI path. mkirf strips the segment label and
# emits the cpio entry `kernel/x86/microcode/GenuineIntel.bin`, 16-byte
# aligned, in the uncompressed leading region the kernel scans before
# decompression. The amd-ucode package ships a sibling segment; mkirf merges
# the two, de-duplicating the shared kernel/x86/microcode/ parents (§10.1).
#
# `:` sources the file from the build stage (pekit.toml [build.main]).
[files]
":++/intel-ucode/kernel/x86/microcode/GenuineIntel.bin" = "++/intel-ucode/kernel/x86/microcode/GenuineIntel.bin"
