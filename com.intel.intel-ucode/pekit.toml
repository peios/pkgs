# com.intel.intel-ucode — Intel CPU microcode, assembled into the single
# container the kernel's early loader scans in the initramfs early-cpio region.
#
# Upstream ships one or more update records in each intel-ucode/ signature file.
# This build validates every record before concatenation; mkirf remains
# responsible for cpio framing and the loader's 16-byte alignment.

out_dir = "out"

# The upstream artefact is itself the redistributable binary firmware. A source
# package would only duplicate those blobs, not provide rebuildable source.
[source_package]
enabled = false

[source.git]
url = "https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files.git"
# Intel's release tags are unsigned lightweight tags. Until authenticated Git
# sources land under PEI-665, retrieval therefore relies on HTTPS and pekit's
# immutable commit lock: a moved tag cannot silently change locked source.
# Named captures present microcode-YYYYMMDD as YYYY.MM.DD, corrective -revN
# tags as a fourth numeric component, and letter-suffixed tags unchanged. The
# ref template round-trips every accepted version to its exact upstream tag.
ref       = "microcode-{{major}}{{minor}}{{patch}}{{suffix}}{{revision_suffix}}"
tag_regex = '^microcode-(?P<major>\d{4})(?P<minor>\d{2})(?P<patch>\d{2})(?:(?P<suffix>[a-z])|-rev(?P<revision>\d+))?$'
# Soft catalogue floor for routine unattended selection, not a compatibility
# boundary. Older releases can be admitted by lowering/removing this constraint.
versions  = ">=2026.0.0"

[build.main]
command = """
set -eu
SRC="$(pwd)"
DEST="$PEKIT_OUT/++/intel-ucode/kernel/x86/microcode"
LICENSE_DIR="$PEKIT_OUT/usr/share/licenses/com.intel.intel-ucode"
DOC_DIR="$PEKIT_OUT/usr/share/doc/com.intel.intel-ucode"
FILE_LIST="$PEKIT_OUT/.intel-ucode-files"
BLOB="$DEST/GenuineIntel.bin"
BLOB_CHECK="$PEKIT_OUT/.GenuineIntel.bin.check"
VALIDATOR="$PEKIT_RECIPE_ROOT/tools/validate-intel-ucode.sh"

fail_microcode() {
  printf '%s\n' "intel microcode validation failed: $*" >&2
  exit 1
}

mkdir -p "$DEST" "$LICENSE_DIR" "$DOC_DIR"
find "$SRC/intel-ucode" -maxdepth 1 -type f \
  -name '[0123456789abcdefABCDEF][0123456789abcdefABCDEF]-[0123456789abcdefABCDEF][0123456789abcdefABCDEF]-[0123456789abcdefABCDEF][0123456789abcdefABCDEF]' \
  -print | LC_ALL=C sort > "$FILE_LIST"
test -s "$FILE_LIST" || fail_microcode "no production microcode files found"
test "$(wc -l < "$FILE_LIST")" -eq \
     "$(find "$SRC/intel-ucode" -maxdepth 1 -type f -print | wc -l)" \
  || fail_microcode "a production microcode file has an unexpected name"

while IFS= read -r file; do
  case "$file" in
    "$SRC/intel-ucode/"*) ;;
    "$SRC/intel-ucode-with-caveats/"*)
      fail_microcode "$file from intel-ucode-with-caveats was selected"
      ;;
    *) fail_microcode "$file is outside the production microcode directory" ;;
  esac
  sh "$VALIDATOR" "$file"
done < "$FILE_LIST"

# Build twice from the sorted manifest and compare their SHA-256 digests. This
# makes ordering explicit and guards the final blob against accidental inputs.
: > "$BLOB"
: > "$BLOB_CHECK"
while IFS= read -r file; do cat "$file" >> "$BLOB"; done < "$FILE_LIST"
while IFS= read -r file; do cat "$file" >> "$BLOB_CHECK"; done < "$FILE_LIST"
test -s "$BLOB"
test "$(sha256sum "$BLOB" | awk '{ print $1 }')" = \
     "$(sha256sum "$BLOB_CHECK" | awk '{ print $1 }')" \
  || fail_microcode "independent deterministic concatenations differ"
sh "$VALIDATOR" "$BLOB"

test -f "$SRC/license" || fail_microcode "upstream license is missing"
test -f "$SRC/README.md" || fail_microcode "upstream README.md is missing"
test -f "$SRC/releasenote.md" || fail_microcode "upstream releasenote.md is missing"
test -f "$SRC/security.md" || fail_microcode "upstream security.md is missing"
cp "$SRC/license" "$LICENSE_DIR/LICENSE"
cp "$SRC/README.md" "$SRC/releasenote.md" "$SRC/security.md" "$DOC_DIR/"

rm -f "$FILE_LIST" "$BLOB_CHECK"
"""

# The peipkg build root contains only declared tools. Apt retains a usable
# bootstrap/development path; production inherits the workspace peipkg env.
[build.main.dependencies.peipkg]
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.findutils" = "*"
"org.gnu.gawk" = "*"

[build.main.dependencies.apt]
dash      = "*"
coreutils = "*"
findutils = "*"
gawk      = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
SRC="$PEKIT_SOURCE_ROOT"
BLOB="$PEKIT_MAIN_OUT/++/intel-ucode/kernel/x86/microcode/GenuineIntel.bin"
VALIDATOR="$PEKIT_RECIPE_ROOT/tools/validate-intel-ucode.sh"
WORK="$PEKIT_OUT/intel-ucode-gate"
FILE_LIST="$WORK/files"
EXPECTED="$WORK/GenuineIntel.bin"

mkdir -p "$WORK"
find "$SRC/intel-ucode" -maxdepth 1 -type f \
  -name '[0123456789abcdefABCDEF][0123456789abcdefABCDEF]-[0123456789abcdefABCDEF][0123456789abcdefABCDEF]-[0123456789abcdefABCDEF][0123456789abcdefABCDEF]' \
  -print | LC_ALL=C sort > "$FILE_LIST"
test -s "$FILE_LIST"
test "$(wc -l < "$FILE_LIST")" -eq \
     "$(find "$SRC/intel-ucode" -maxdepth 1 -type f -print | wc -l)"

: > "$EXPECTED"
while IFS= read -r file; do
  sh "$VALIDATOR" "$file"
  cat "$file" >> "$EXPECTED"
done < "$FILE_LIST"
cmp "$EXPECTED" "$BLOB"
sh "$VALIDATOR" "$BLOB"

# Prove the validator fails closed rather than merely accepting today's input.
# The first byte is the low byte of header_version (normally 1); zeroing it
# must make the staged container invalid before any checksum ambiguity arises.
CORRUPT="$WORK/GenuineIntel.corrupt.bin"
cp "$BLOB" "$CORRUPT"
dd if=/dev/zero of="$CORRUPT" bs=1 seek=0 count=1 conv=notrunc status=none
if sh "$VALIDATOR" "$CORRUPT" >"$WORK/corrupt.log" 2>&1; then
  echo "intel-ucode: validator accepted a corrupted header" >&2
  exit 1
fi
grep -F 'header version 0' "$WORK/corrupt.log"

test -s "$PEKIT_MAIN_OUT/usr/share/licenses/com.intel.intel-ucode/LICENSE"
test -s "$PEKIT_MAIN_OUT/usr/share/doc/com.intel.intel-ucode/README.md"
test -s "$PEKIT_MAIN_OUT/usr/share/doc/com.intel.intel-ucode/releasenote.md"
test -s "$PEKIT_MAIN_OUT/usr/share/doc/com.intel.intel-ucode/security.md"
rm -rf "$WORK"
'''

[test.dependencies.peipkg]
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.diffutils" = "*"
"org.gnu.findutils" = "*"
"org.gnu.gawk" = "*"

[test.dependencies.apt]
dash = "*"
coreutils = "*"
diffutils = "*"
findutils = "*"
gawk = "*"
