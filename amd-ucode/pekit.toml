# amd-ucode — AMD CPU microcode, assembled into the single container the
# kernel's early loader scans, shipped into the initramfs early-cpio region.
#
# Upstream (linux-firmware) ships per-family containers under amd-ucode/
# (microcode_amd*.bin); the early-load blob is their concatenation as
# kernel/x86/microcode/AuthenticAMD.bin. As with intel-ucode, this build only
# ASSEMBLES the blob — mkirf owns the cpio framing and 16-byte alignment
# (peiosutils mkirf DESIGN §10.2).

out_dir = "out"

[source.git]
url = "https://gitlab.com/kernel-firmware/linux-firmware.git"
# linux-firmware tags dated snapshots (YYYYMMDD); the package version is that
# date. NOTE: the full linux-firmware tree is large for one subdirectory — a
# real build should sparse-checkout amd-ucode/ (or mirror just that subtree)
# rather than clone the whole repo. Left as a plain clone here for clarity.
ref       = "{{version}}"
tag_regex = '^\d{8}$'

# Concatenate the per-family AMD containers into the one blob the early loader
# scans, in LC_ALL=C order for a byte-deterministic build. Only coreutils.
[build.main]
command = """
SRC="$(pwd)"
DEST="$PEKIT_OUT/++/amd-ucode/kernel/x86/microcode"
mkdir -p "$DEST"
find "$SRC/amd-ucode" -name 'microcode_amd*.bin' | LC_ALL=C sort | xargs cat > "$DEST/AuthenticAMD.bin"
test -s "$DEST/AuthenticAMD.bin"
"""
