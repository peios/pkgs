# amd-ucode — AMD CPU microcode, assembled into the single container the
# kernel's early loader scans, shipped into the initramfs early-cpio region.
#
# Upstream (linux-firmware) ships per-family containers under amd-ucode/
# (microcode_amd*.bin); the early-load blob is their concatenation as
# kernel/x86/microcode/AuthenticAMD.bin. As with intel-ucode, this build only
# ASSEMBLES the blob — mkirf owns the cpio framing and 16-byte alignment
# (peiosutils mkirf DESIGN §10.2).

out_dir = "out"

# The linux-firmware artefact is itself the distributable firmware. Emitting a
# corresponding-source package would duplicate the entire upstream repository
# without providing rebuildable source for the microcode blobs.
[source_package]
enabled = false

[source.git]
url = "https://gitlab.com/kernel-firmware/linux-firmware.git"
# linux-firmware tags dated snapshots as YYYYMMDD. Named captures expose them
# as the Peios version YYYY.MM.DD; the ref template maps that dotted version
# back to the compact upstream tag. The full checkout is a deliberate cost: Git
# tag enumeration makes unattended --latest updates reliable, while pekit's
# mirror cache makes later refreshes incremental.
ref       = "{{major}}{{minor}}{{patch}}"
tag_regex = '^(?P<major>\d{4})(?P<minor>\d{2})(?P<patch>\d{2})$'

# Concatenate the per-family AMD containers into the one blob the early loader
# scans, in LC_ALL=C order for a byte-deterministic build.
[build.main]
command = """
set -eu
SRC="$(pwd)"
DEST="$PEKIT_OUT/++/amd-ucode/kernel/x86/microcode"
mkdir -p "$DEST"
find "$SRC/amd-ucode" -maxdepth 1 -type f -name 'microcode_amd*.bin' -print0 \
  | LC_ALL=C sort -z \
  | xargs -0r cat > "$DEST/AuthenticAMD.bin"
test -s "$DEST/AuthenticAMD.bin"
"""

# The peipkg build root contains only declared tools. The apt provider keeps
# the same recipe usable on the bootstrap/development rung.
[build.main.dependencies.peipkg]
dash          = "*"
coreutils-gnu = "*"
findutils     = "*"

[build.main.dependencies.apt]
dash      = "*"
coreutils = "*"
findutils = "*"
