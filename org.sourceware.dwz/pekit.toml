# DWZ — DWARF optimisation and duplicate removal. `_pkgtools_/split-debug`
# runs it on every ELF before extracting the debug sections, so it is part of
# dev.peios.build-essentials-c and therefore of the minimal-bootstrap seed.
#
# Upstream's DejaGnu harness only enumerates testsuite/dwz.tests/*.sh and runs
# each one in a scratch directory; the test stage below reimplements that loop
# in shell, with the same per-test prerequisites, so the suite runs without
# DejaGnu. The three DWARF-assembler cases generate their inputs with DejaGnu's
# own DWARF library and are the only ones it cannot build.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source.url]
url         = "https://sourceware.org/pub/dwz/releases/dwz-{{version}}.tar.xz"
listing_url = "https://sourceware.org/pub/dwz/releases/"
extract     = true
root        = "dwz"
file_regex  = 'dwz-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Follow every newer authenticated release; DWARF or
# CLI changes stop at the upstream suite and the smoke gates below.
versions    = ">= 0.17"

# Releases from 0.16 on carry a detached signature by Mark Wielaard, the same
# key that signs Debugedit (org.sourceware.debugedit pins it too).
[source.url.signature]
url          = "{{source_url}}.asc"
of           = "artifact"
key_files    = ["keys/mark-wielaard.asc"]
fingerprints = ["28FF4B30A88D5523A7E2CBA20376A15C6FFC11CD"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
cd "$PEKIT_OUT"

# Upstream's configure only writes a forwarding Makefile for an out-of-tree
# build. Its Makefile assigns CFLAGS itself, so the workspace policy has to be
# passed on the command line; its own warning, version and copyright flags
# are appended with `override` either way. The xxhash header is inlined when
# it supports XXH_INLINE_ALL, so the binary links only libelf.
"$SRC/configure"
make -j"$(nproc)" dwz \\
  CFLAGS="$CFLAGS -fmacro-prefix-map=$ROOT=/usr/src/debug/org.sourceware.dwz" \\
  LDFLAGS="$LDFLAGS -Wl,-z,ibtplt"
make install DESTDIR="$PEKIT_OUT" prefix=/usr
gzip -9n "$PEKIT_OUT/usr/share/man/man1/dwz.1"

# Split with the dwz just built, as debugedit splits with its own debugedit:
# the root need not carry a dwz yet, and the build exercises the tool it ships.
SPLIT_TOOLS="$PEKIT_OUT/split-tools"
mkdir -p "$SPLIT_TOOLS"
ln -sfn "$PEKIT_OUT/dwz" "$SPLIT_TOOLS/dwz"
PATH="$SPLIT_TOOLS:$PATH" \\
  sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.sourceware.dwz "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c"  = "*"
"org.gnu.gzip"                  = "*"
"org.sourceware.elfutils-devel" = ">= 0.196"
"com.xxhash.xxhash-devel"       = ">= 0.8.3"

[build.main.dependencies.apt]
build-essential = "*"
gzip            = "*"
libelf-dev      = "*"
libxxhash-dev   = "*"
debugedit       = "*"
dwz             = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
BUILD="$PEKIT_MAIN_OUT"
# The forwarding Makefile written by configure records the source tree.
SRC=$(sed -n 's/^srcdir:=//p' "$BUILD/Makefile")
test -f "$SRC/dwz.c"
STAGE="$PEKIT_MAIN_OUT"
DWZ="$STAGE/usr/bin/dwz"
SMOKE="$PEKIT_OUT/smoke"
mkdir -p "$SMOKE"
cd "$BUILD"

# Upstream suite. Build its test executables (every TEST_EXECS entry except
# the DejaGnu-generated DWARF-assembler ones) and the -DDEVEL dwz-for-test.
# The Makefile picks its x86_64-only cases from `uname -p`, which reports
# "unknown" on Peios (and on most non-Debian systems); name the machine.
UPSTREAM_MAKE="make -f $SRC/Makefile srcdir=$SRC UNAME=x86_64"
EXECS=$($UPSTREAM_MAKE -s \
  --eval 'print-execs: ; @echo $(filter-out $(TEST_EXECS_DWARF_ASM),$(TEST_EXECS))' \
  print-execs)
$UPSTREAM_MAKE -j"$(nproc)" dwz-for-test $EXECS

rm -rf testsuite-bin testsuite/dwz.tests/execs
mkdir -p testsuite-bin testsuite/dwz.tests/execs
ln -s "$BUILD/dwz" testsuite-bin/dwz
sh "$SRC/testsuite/scripts/xunzip-dir.sh" \
  "$SRC/testsuite/dwz.tests/execs.xz" "$BUILD/testsuite/dwz.tests/execs"

# verify-dwarf.sh loads each result into GDB, and gdb-add-index.sh runs GDB's
# index tool; both environments provide the real GDB.
command -v gdb >/dev/null
command -v gdb-add-index >/dev/null

usable() { [ -s "$BUILD/$1" ]; }
pass=0; fail=0; unsupported=
for test in "$SRC"/testsuite/dwz.tests/*.sh; do
  name=${test##*/}
  need=
  case "$name" in
    pr24171.sh) need=invalid-dw-at-stmt-list-encoding ;;
    pr24173.sh) need=py-section-script ;;
    pr24172.sh) need=dw2-skip-prologue ;;
    pr24170.sh) need=implptr-64bit-d2o4a8r8t0 ;;
    gold-gdb-index.sh) need=hello-gold-gdb-index ;;
    pr24747.sh) need=start-gold ;;
    pr24771.sh) need=hello-gnu-pubnames ;;
    pr24823.sh) need=varval ;;
    pr25109.sh) need=no-multifile-prop ;;
    pr27463.sh) need=unavailable-dwarf-piece ;;
  esac
  skip=0
  if [ -n "$need" ] && ! usable "$need"; then skip=1; fi
  if [ "$name" = pr24341.sh ] \
     && [ "$(readelf -wi min | grep DW_AT_name | grep -c /)" != 2 ]; then
    skip=1
  fi
  if [ "$skip" = 1 ]; then unsupported="$unsupported $name"; continue; fi

  dir="$BUILD/tmp.$name"
  rm -rf "$dir"; mkdir "$dir"
  status=0
  (cd "$dir" && PATH="$BUILD/testsuite-bin:$SRC/testsuite/scripts:$PATH" \
     execs="$BUILD" LC_ALL=C sh -x -e "$test") > "$BUILD/$name.log" 2>&1 || status=$?
  if [ "$status" = 77 ]; then
    unsupported="$unsupported $name"
  elif [ "$status" != 0 ] || [ -n "$(ls -A "$dir")" ]; then
    echo "FAIL: $name"; cat "$BUILD/$name.log"; fail=$((fail + 1))
  else
    pass=$((pass + 1))
  fi
  rm -rf "$dir"
done
echo "dwz suite: $pass passed, $fail failed, unsupported:$unsupported"
test "$fail" -eq 0
# 68 cases: 61 run natively and 63 under Debian. The remainder need inputs
# the toolchain does not produce (gold, zstd-compressed sections from a
# binutils built without zstd). Guard against a harness change silently
# skipping more.
test "$pass" -ge 61

# Installed command: optimise a -g program in place, keep valid DWARF, and
# build a multifile shared between two executables.
"$DWZ" --version 2>&1 | grep -F "dwz version $PEKIT_VERSION"
cat > "$SMOKE/a.c" <<'EOF'
struct point { int x, y; const char *label; };
struct shape { struct point corners[4]; unsigned long area; };
int area(const struct shape *s) { return (int)s->area + s->corners[0].x; }
int main(void) { struct shape s = {{{1, 2, "a"}}, 3}; return area(&s) == 4 ? 0 : 1; }
EOF
sed 's/area(/other_area(/g; s/int main.*/int main(void){return 0;}/' \
  "$SMOKE/a.c" > "$SMOKE/b.c"
for prog in a b; do
  cc -g -O0 "$SMOKE/$prog.c" -o "$SMOKE/$prog"
  cp "$SMOKE/$prog" "$SMOKE/$prog.orig"
done
"$DWZ" "$SMOKE/a"
readelf --debug-dump=info "$SMOKE/a" > "$SMOKE/a.info"
grep -E 'DW_AT_name .*: point$' "$SMOKE/a.info"
"$SMOKE/a"
cp "$SMOKE/a.orig" "$SMOKE/a"
"$DWZ" -m "$SMOKE/common.debug" -M /usr/lib/debug/.dwz/smoke.debug \
  "$SMOKE/a" "$SMOKE/b"
test -s "$SMOKE/common.debug"
for prog in a b; do
  readelf -S "$SMOKE/$prog" | grep -F '.gnu_debugaltlink'
  readelf --string-dump=.gnu_debugaltlink "$SMOKE/$prog" \
    | grep -F /usr/lib/debug/.dwz/smoke.debug
  readelf --debug-dump=info "$SMOKE/$prog" > /dev/null
  "$SMOKE/$prog"
done
# Upstream's multifile cases cover DIE sharing; here the shared file must be
# a well-formed ELF debug object that both executables now point at.
readelf -h "$SMOKE/common.debug" | grep -E 'Type:[[:space:]]+(EXEC|DYN|REL)'
readelf -S "$SMOKE/common.debug" | grep -F '.debug_str'

# Hardening and debug split of the shipped binary.
readelf -h "$DWZ" | grep -E 'Type:[[:space:]]+DYN'
readelf -W -l "$DWZ" | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l "$DWZ" | grep -F 'GNU_RELRO'
readelf -d "$DWZ" | grep -F 'BIND_NOW'
readelf -d "$DWZ" | grep -F 'RELR'
# Debian's startup objects carry no CET notes (see debian.env.pekit.toml).
if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
  readelf -n "$DWZ" | grep -E 'x86 feature:.*IBT.*SHSTK'
fi
if readelf -d "$DWZ" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
if readelf -S "$DWZ" | grep -Fq '.debug_'; then exit 1; fi
test "$(readelf -d "$DWZ" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | LC_ALL=C sort | tr '\n' ' ')" = \
  'libc.so.6 libelf.so.1 '
test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test -n "$(find "$STAGE/usr/src/debug/org.sourceware.dwz" -type f -name 'dwz.c' -print -quit)"
test -f "$STAGE/usr/share/man/man1/dwz.1.gz"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.sourceware.elfutils-devel"  = ">= 0.196"
"org.sourceware.elfutils"        = ">= 0.196"
"com.xxhash.xxhash-devel"        = ">= 0.8.3"
"org.gnu.bash"                   = "*"
"org.gnu.diffutils"              = "*"
"org.gnu.findutils"              = "*"
"org.gnu.grep"                   = "*"
"org.gnu.sed"                    = "*"
"org.tukaani.xz"                 = "*"
"org.gnu.gdb"                    = "*"

[test.dependencies.apt]
build-essential = "*"
"g++"           = "*"
libelf-dev      = "*"
libxxhash-dev   = "*"
elfutils        = "*"
bash            = "*"
diffutils       = "*"
findutils       = "*"
grep            = "*"
sed             = "*"
xz-utils        = "*"
gdb             = "*"
