# gperf — perfect hash function generator; eudev's build feeds on it
# (PEI-158 Tier 2, wave 3).
#
# Autotools from the release tarball, out-of-source via DESTDIR (the m4
# shape). C++ program (links libstdc++).

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/gperf/gperf-{{version}}.tar.gz"
extract  = true
root     = "gperf-{{version}}"
versions = ">= 3.3"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/doc" "$PEKIT_OUT/usr/share/info"
"""

[build.main.dependencies.peipkg]
"build-essentials-c++" = "*"

[build.main.dependencies.apt]
build-essential = "*"
