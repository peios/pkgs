# Metadata shared by the Dash package family. Every member declares its own
# license; the corresponding source package conjoins them with the
# source-only license declared in pekit.toml's [source_package].

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "BSD-3-Clause AND GPL-2.0-or-later"
license_class = "free"
homepage      = "https://git.kernel.org/pub/scm/utils/dash/dash.git"
