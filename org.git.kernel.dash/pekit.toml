# DASH — Peios's small POSIX system shell and the provider of the `sh` role.
# Built from Herbert Xu's release tarballs, which he authenticates with a
# clear-signed SHA-512 checksum manifest beside each one. (The kernel.org Git
# release tags are unsigned lightweight tags, so the tarball is the only
# release form upstream vouches for.)

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

# The installed shell is BSD-3-Clause; the corresponding source also carries
# the GPL-2.0-or-later src/mksignames.c build helper, which no member ships.
[source_package]
license = "GPL-2.0-or-later"

# Upstream serves its release directory over plain HTTP only. The transport
# is not the trust boundary: every artifact must match the signed manifest
# (lint.pekit.toml records the source.url.scheme allowance).
[source.url]
url         = "http://gondor.apana.org.au/~herbert/dash/files/dash-{{version}}.tar.gz"
listing_url = "http://gondor.apana.org.au/~herbert/dash/files/"
extract     = true
root        = "dash-{{version}}"
file_regex  = 'dash-[0-9]+(?:\.[0-9]+)+\.tar\.gz'
# Soft maintenance floor. Follow every later stable release automatically;
# the upstream suite and staged POSIX-shell contract test guard semantics.
versions    = ">= 0.5.13.5"

# dash-X.tar.gz.sha512sum lists "<sha512> <size> <name>" for the tarball and
# is clear-signed by Herbert Xu; the key is his kernel.org pgpkeys entry.
[source.url.signature]
of           = "checksums"
url          = "{{source_url}}.sha512sum"
key_files    = ["keys/herbert-xu.asc"]
fingerprints = ["9F9D45FE50AE361530983792C7271D0A49B18BA7"]

[build.main]
command = '''
set -eu
LOCKED_SRC="$PEKIT_SOURCE_ROOT"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
BUILD_SRC="$PEKIT_OUT/src-copy"
OBJ="$PEKIT_OUT/obj"
SMOKE="$PEKIT_OUT/.dash-smoke"
BIN="$PEKIT_OUT/usr/bin/dash"

mkdir -p "$BUILD_SRC" "$OBJ" "$SMOKE"
# Configure from a private copy so nothing the build writes can alter the
# locked source tree. The release tarball carries upstream's own generated
# configure, which is part of what the manifest signature covers.
cp -a "$LOCKED_SRC/." "$BUILD_SRC/"

cd "$OBJ"
LDFLAGS="$LDFLAGS -Wl,-z,ibtplt" \
"$BUILD_SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --without-libedit \
  --disable-static \
  --disable-silent-rules

# Preserve the first build for the gated reproducibility rebuild.
make -j"$(nproc)"
cp src/dash "$SMOKE/dash.first"

make install DESTDIR="$PEKIT_OUT"
gzip -n -9 "$PEKIT_OUT/usr/share/man/man1/dash.1"

# Split the installed ELF by build ID, normalize DWARF paths to the qualified
# package namespace, and retain every source file referenced by the binary.
# The configure run links no library outside the default search path, so the
# binary carries no RPATH to remove; the gate asserts that.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.git.kernel.dash "$BIN"
'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c"         = "*"
"org.sourceware.debugedit" = "*"
"org.gnu.gzip"             = "*"

[build.main.dependencies.apt]
build-essential = "*"
debugedit       = "*"
dwz             = "*"
gzip            = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
DASH="$PEKIT_MAIN_OUT/usr/bin/dash"
test "$("$DASH" -c 'x=6; y=7; printf %s $((x*y))')" = 42

PEKIT_OUT="$PEKIT_MAIN_OUT"
cd "$PEKIT_OUT/obj"
# Rebuild in the identical object directory and compare the executable before
# running the release suite. This catches nondeterminism without differing
# DWARF compilation directories.
make clean
make -j"$(nproc)"
cmp "$PEKIT_OUT/.dash-smoke/dash.first" src/dash

# Run the upstream release suite from the explicit package gate.
# Current upstream carries no TESTS, check_PROGRAMS, or custom check-local
# rule. Still run Automake's shipped check recursion so a future release that
# adds upstream tests is exercised automatically; the staged semantic suite
# below supplies the current behavioral coverage.
make check

# Exercise and audit the exact installed shell after staging.
TEST_OUT="$PEKIT_OUT"
PEKIT_OUT="$PEKIT_MAIN_OUT"
LOCKED_SRC="$PEKIT_SOURCE_ROOT"
SMOKE="$TEST_OUT/dash-smoke"
BIN="$PEKIT_OUT/usr/bin/dash"
mkdir -p "$SMOKE"
test -x "$BIN"
test -f "$PEKIT_OUT/usr/share/man/man1/dash.1.gz"
test "$(find "$PEKIT_OUT/usr/bin" -maxdepth 1 -type f -printf '%f\n')" = dash
test "$(find "$PEKIT_OUT/usr/share/man" -type f -printf '%P\n')" = man1/dash.1.gz
grep -F "AC_INIT([dash],[$PEKIT_VERSION])" "$LOCKED_SRC/configure.ac"

# Upstream has no regression target. Exercise the staged shell across parsing,
# functions, expansion, arithmetic, command substitution, loops, case, getopts,
# redirections, pipelines, subshells, traps, and error status propagation.
cat > "$SMOKE/semantics.sh" <<'EOF'
set -eu

join()
{
  prefix=$1
  shift
  printf '%s:%s:%s\n' "$prefix" "$#" "$*"
}

value=peios-shell
printf '%s|%s|%s|%s\n' \
  "${value#peios-}" "${value%shell}" "${unset-word}" "$((6 * 7))"
join args alpha beta

result=$(for item in one two three; do
  case "$item" in
    t*) printf '%s' "$item" ;;
  esac
done)
printf 'case:%s\n' "$result"

set -- -a selected tail
getopts 'a:' option
printf 'opts:%s:%s:%s\n' "$option" "$OPTARG" "$OPTIND"
shift $((OPTIND - 1))
printf 'tail:%s\n' "$*"

cat <<'INNER' > heredoc.txt
heredoc payload
INNER
IFS= read -r line < heredoc.txt
printf 'redir:%s\n' "$line"

pipeline=$(printf '%s\n' left right | while IFS= read -r line; do
  printf '<%s>' "$line"
done)
printf 'pipe:%s\n' "$pipeline"

( cd /; printf 'subshell:%s\n' "$PWD" )
trap 'printf "%s\n" exit-trap' 0
EOF

cat > "$SMOKE/expected" <<'EOF'
shell|peios-|word|42
args:2:alpha beta
case:twothree
opts:a:selected:3
tail:tail
redir:heredoc payload
pipe:<left><right>
subshell:/
exit-trap
EOF

(cd "$SMOKE" && "$BIN" semantics.sh) > "$SMOKE/actual"
cmp "$SMOKE/expected" "$SMOKE/actual"
"$BIN" -n "$SMOKE/semantics.sh"
"$BIN" -c 'exit 23' >/dev/null 2>&1 && exit 1 || status=$?
test "$status" -eq 23
"$BIN" -c 'set -e; false; printf unreachable' > "$SMOKE/errexit" 2>&1 \
  && exit 1 || status=$?
test "$status" -eq 1
test ! -s "$SMOKE/errexit"

# Enforce the inherited Peios hardening and dynamic-linkage contract on the
# staged payload. Dash must remain a PIE with only glibc as a runtime ELF
# dependency and must not acquire a search path or executable stack.
readelf -h "$BIN" | grep -E 'Type:[[:space:]]+DYN'
readelf -W -l "$BIN" | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l "$BIN" | grep -F 'GNU_RELRO'
readelf -d "$BIN" | grep -F 'BIND_NOW'
readelf -d "$BIN" | grep -F 'RELR'
if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
  readelf -n "$BIN" | grep -E 'x86 feature:.*IBT.*SHSTK'
fi
readelf -n "$BIN" | grep -F 'Build ID:'
if readelf -d "$BIN" | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
test "$(patchelf --print-needed "$BIN")" = libc.so.6
test "$(find "$PEKIT_OUT/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test "$(find "$PEKIT_OUT/usr/src/debug/org.git.kernel.dash" -type f | wc -l)" -gt 20
if readelf -S "$BIN" | grep -F .gnu_debuglink; then exit 1; fi
if readelf -S "$BIN" | grep -F .debug_info; then exit 1; fi

rm -rf "$PEKIT_MAIN_OUT/.dash-smoke" "$PEKIT_MAIN_OUT/src-copy" "$PEKIT_MAIN_OUT/obj"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c"         = "*"
"org.nixos.patchelf"      = "*"
"org.sourceware.debugedit" = "*"

[test.dependencies.apt]
build-essential = "*"
debugedit       = "*"
patchelf        = "*"
