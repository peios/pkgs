side_effects = ["man-db"]

[package]
name        = "org.git.kernel.dash"
description = "DASH - a small POSIX-compliant system shell"
license     = "BSD-3-Clause"

# Preserve the retired package name during the reverse-DNS migration. Dash is
# Peios's selected POSIX `sh` provider; /bin resolves through usr-merge, so the
# role needs to materialise only /usr/bin/sh.
[provides]
dash = "{{version}}-3"
sh   = "1"

[replaces]
dash = "<= {{version}}-2"

[claims.provides.sh.usrbin]
target = "/usr/bin/dash"
path   = "/usr/bin/sh"

[dependencies]
# Dash is built and tested against the qualified C-library family.  Keep the
# lower bound at the first Peios-supported glibc release while allowing future
# maintenance releases to satisfy it automatically.
"org.gnu.glibc" = ">= 2.44"

[files]
"@source:COPYING"             = "usr/share/licenses/org.git.kernel.dash/COPYING"
":usr/bin/dash"                = "usr/bin/dash"
":usr/share/man/man1/dash.1" = "usr/share/man/man1/dash.1"
