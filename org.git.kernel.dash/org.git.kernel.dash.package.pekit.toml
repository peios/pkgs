side_effects = ["man-db"]

[package]
name        = "org.git.kernel.dash"
description = "Small POSIX-compliant system shell"
license     = "BSD-3-Clause"

# Dash is Peios's selected POSIX `sh` provider. /bin resolves through
# usr-merge, so the role needs to materialise only /usr/bin/sh.
[provides]
sh   = "1"

[claims.provides.sh.usrbin]
target = "/usr/bin/dash"
path   = "/usr/bin/sh"

[dependencies]
# Dash is built and tested against the qualified C-library family.  Keep the
# lower bound at the first Peios-supported glibc release while allowing future
# maintenance releases to satisfy it automatically.
"org.gnu.glibc" = ">= 2.44"

[files]
"@source:COPYING"             = "usr/share/licenses/org.git.kernel.dash/COPYING"
":usr/bin/dash"                = "usr/bin/dash"
":usr/share/man/man1/dash.1" = "usr/share/man/man1/dash.1"
