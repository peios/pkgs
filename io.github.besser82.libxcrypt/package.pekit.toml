# Shared metadata for the libxcrypt package family. The aggregate expression
# covers the complete corresponding-source archive; payload packages narrow it
# to the terms present in the installed library, headers and documentation.

format = "peipkg"

[package]
version       = "{{version}}-2"
architecture  = "x86_64"
license       = "LGPL-2.1-or-later AND BSD-3-Clause AND BSD-2-Clause AND BSD-2-Clause-FreeBSD AND 0BSD AND CC0-1.0 AND LicenseRef-Public-Domain AND (GPL-2.0-or-later WITH Autoconf-exception-generic) AND (GPL-3.0-or-later WITH Autoconf-exception-generic-3.0) AND FSFAP"
license_class = "free"
homepage      = "https://github.com/besser82/libxcrypt"
