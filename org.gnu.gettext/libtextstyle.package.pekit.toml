# Public text styling ABI used by Gettext's native tools.

[package]
name        = "org.gnu.gettext-libtextstyle"
description = "GNU text styling library"
license     = "GPL-3.0-or-later"

[provides]
libtextstyle = "{{version}}"

[replaces]
libtextstyle = "<= {{version}}-2"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:libtextstyle/COPYING" = "usr/share/licenses/org.gnu.gettext-libtextstyle/COPYING"
":usr/lib/x86_64-linux-peios/libtextstyle.so.0*" = "usr/lib/x86_64-linux-peios"
