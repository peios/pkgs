[package]
name        = "org.gnu.gettext-debugsource"
description = "Debug source for GNU Gettext tools and libraries"

# Generated source and headers must match the architecture's symbol package.
[dependencies]
"org.gnu.gettext-debuginfo" = "= {{release}}"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.gettext-debugsource/"
":usr/src/debug/org.gnu.gettext/**" = "usr/src/debug/org.gnu.gettext"
