# GNU Gettext — the message-catalog toolchain and its public libraries.
#
# Java, C#, Emacs and terminal styling integrations are deliberately disabled;
# the native C tools, gettextize/autopoint data, libasprintf, libgettextpo and
# the unstyled libtextstyle ABI remain complete. Glibc supplies libintl on
# Peios, so the upstream preloadable replacement is not shipped. Gettext 1.0's
# optional po-fetch and AI-assisted spit helpers are omitted until their wget/
# unzip and Python Requests/Ollama runtime closures exist in the catalogue.
#
# gnulib/glibc-const-generics: 1.0's bundled gnulib still predates the upstream
# fix (2025-11-23, df17f4f3) for glibc >= 2.43's _Generic const-correctness
# macros; the same #undef patch as m4's, replicated per bundled gnulib copy.
# Drop when a gettext release bundles a fixed gnulib.
#
# gnulib/posix-spawn-addchdir-glibc-2.44: upstream Gnulib commit ca635799
# (2026-07-30) fixes the declaration probe added after Gettext 1.0 was cut.
# Without it, glibc 2.44 redirects Gnulib's fallback definition onto the _np
# symbol and the resulting function recursively jumps to itself. Drop when a
# Gettext release bundles Gnulib ca635799 or later.

tags = ["bootstrap"]
out_dir = "out"

[source]
patches = "patches"

[source.url]
url         = "https://ftpmirror.gnu.org/gettext/gettext-{{version}}.tar.xz"
listing_url = "https://ftpmirror.gnu.org/gettext/"
extract     = true
root        = "gettext-{{version}}"
file_regex  = 'gettext-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Follow every authenticated stable release
# automatically; ABI and catalog round-trip gates fail closed on drift.
versions    = ">= 1.0"

# GNU publishes detached signatures for every release. Pin the exact primary
# fingerprint named in the 1.0 release announcement; unattended discovery is
# therefore authenticated rather than trust-on-first-use.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/bruno-haible.asc"]
fingerprints = ["E0FFBD975397F77A32AB76ECB6301D9E1BBEAC08"]

# Gettext's bundled libcroco intentionally adds -Wno-format. GCC rejects the
# workspace's -Werror=format-security when format checking is disabled, before
# compiling any source. Keep both diagnostics enabled for the package but make
# format-security non-fatal, as GCC's own production recipe does for upstream
# code that cannot consume the workspace error policy verbatim.
[env]
CFLAGS = "-O2 -g -pipe -fexceptions -Wall -Wformat -Wformat-security -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection -grecord-gcc-switches"
CXXFLAGS = "-O2 -g -pipe -fexceptions -Wall -Wformat -Wformat-security -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection -grecord-gcc-switches -Wp,-D_GLIBCXX_ASSERTIONS"

[build.main]
command = """
set -eu
# Regenerate in a copy so the locked, patched source tree stays pristine.
cp -a . "$PEKIT_OUT/source"
SRC="$PEKIT_OUT/source"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.gettext"
# Regenerate only the configure script affected by the upstream Gnulib m4
# backport. Gettext 1.0's generated script predates ca635799.  Pekit's patch
# application necessarily gives the included m4 file a newer timestamp than
# the release-generated Autotools files; mark the other, semantically
# unaffected generated files current so Make does not demand the exact
# upstream Automake minor merely to reproduce unchanged templates.
(cd "$SRC/gettext-tools" && autoconf)
touch "$SRC/gettext-tools/aclocal.m4" "$SRC/gettext-tools/config.h.in"
find "$SRC/gettext-tools" -name Makefile.in -exec touch {} +
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --libdir=/usr/lib/x86_64-linux-peios \
  --disable-java --disable-csharp --disable-curses \
  --without-emacs --disable-openmp --disable-rpath \
  --disable-more-warnings
make -s -j"$(nproc)"
make -s install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -9n {} \\;

# Peios has no Info reader, and glibc supplies the libintl implementation.
# Static and libtool archives are intentionally omitted; consumers link the
# supported shared ABIs instead.
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"
rm -f "$PEKIT_OUT/usr/lib/x86_64-linux-peios/preloadable_libintl.so"
rm -f "$PEKIT_OUT/usr/bin/po-fetch" "$PEKIT_OUT/usr/bin/spit"
rm -f "$PEKIT_OUT/usr/share/gettext/javaversion.class"
find "$PEKIT_OUT/usr/lib/x86_64-linux-peios" \
  \\( -name '*.la' -o -name '*.a' \\) -delete
# These are internal convenience-library link names, not supported ABIs.
rm -f "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libgettextlib.so" \
      "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libgettextsrc.so"

# Despite --disable-rpath, libtool links the tools and libraries that use
# gettext's private libgettextlib/libgettextsrc with
# RUNPATH=/usr/lib/x86_64-linux-peios: the build root has no ld.so.conf naming
# the Peios triplet directory, so libtool does not treat it as a system search
# path. That directory is the loader's default, so drop the redundant RUNPATH.
# Fail closed: patchelf errors abort, and the result is checked here and gated.
cd "$PEKIT_OUT"
find usr -type f -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' \\
  | LC_ALL=C sort | while IFS= read -r elf; do
    [ "$(head -c 4 "$elf" | tail -c 3)" = ELF ] || continue
    if readelf -d "$elf" | grep -Eq '(RPATH|RUNPATH)'; then
      patchelf --remove-rpath "$elf"
      if readelf -d "$elf" | grep -Eq '(RPATH|RUNPATH)'; then
        echo "gettext: failed to remove runtime search path from $elf" >&2
        exit 1
      fi
    fi
  done

# Emit build-ID debuginfo for every installed ELF, including gettext's private
# tool libraries and libexec helpers, and the exact DWARF-referenced source.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.gettext "$PEKIT_OUT/usr"
"""

# gzip: gettext-tools/misc creates autopoint's version archive at build time;
# the development package ships and consumes that archive.
[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.glibc-gconv-extra" = "*"
"org.gnu.glibc-langpack-de" = "*"
"org.gnu.glibc-langpack-en" = "*"
"org.gnu.glibc-langpack-fr" = "*"
"org.gnu.glibc-langpack-ja" = "*"
"org.gnu.glibc-langpack-zh" = "*"
"org.gnu.gzip" = "*"
"org.gnu.autoconf" = "*"
"org.gnu.automake" = "*"
"org.gnu.bash" = "*"
"org.perl.perl" = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# All release tests run inside Pekit's deliberately network-isolated test
# sandbox. Gnulib's test-getaddrinfo reaches public DNS names and recognizes
# EAI_AGAIN as offline, but glibc reports the sandbox denial as EAI_SYSTEM with
# EBUSY. Accept only that one exact non-hermetic failure; any other failed test
# or failure signature remains fatal.
cd "$PEKIT_MAIN_OUT"
set +e
make -s -j"$(nproc)" check
check_status=$?
set -e
if [ "$check_status" -ne 0 ]; then
  failures=$(find . -name test-suite.log -exec sed -n 's/^FAIL: //p' {} + \
    | LC_ALL=C sort -u)
  test "$failures" = "test-getaddrinfo"
  gai_log=gettext-tools/gnulib-tests/test-getaddrinfo.log
  grep -F 'system error: Device or resource busy' "$gai_log"
  grep -F 'expected 0, got -11' "$gai_log"
fi
STAGE="$PEKIT_MAIN_OUT"
BIN="$STAGE/usr/bin"
TMP="$PEKIT_OUT/gettext-test"
mkdir -p "$TMP"
cat > "$TMP/messages.po" <<'EOF'
msgid ""
msgstr ""
"Content-Type: text/plain; charset=UTF-8\n"

msgid "hello"
msgstr "bonjour"
EOF
export LD_LIBRARY_PATH="$STAGE/usr/lib/x86_64-linux-peios"
"$BIN/msgfmt" --check -o "$TMP/messages.mo" "$TMP/messages.po"
"$BIN/msgunfmt" "$TMP/messages.mo" > "$TMP/roundtrip.po"
found=false
while IFS= read -r line; do
  test "$line" != 'msgstr "bonjour"' || found=:
done < "$TMP/roundtrip.po"
$found
grep -F 'msgid "hello"' "$TMP/roundtrip.po"
grep -F 'msgstr "bonjour"' "$TMP/roundtrip.po"
printf '%s\n' 'const char *s = _("catalogued");' > "$TMP/input.c"
"$BIN/xgettext" --keyword=_ --language=C --output="$TMP/extracted.po" "$TMP/input.c"
grep -F 'msgid "catalogued"' "$TMP/extracted.po"
test "$(printf '%s\n' '$name' | name=Peios "$BIN/envsubst")" = Peios
"$BIN/msgfmt" --version | head -1 | grep -F "$PEKIT_VERSION"
test -x "$BIN/autopoint"
test -x "$BIN/gettextize"
test -d "$STAGE/usr/share/gettext"
test -f "$STAGE/usr/include/gettext-po.h"
test -f "$STAGE/usr/include/textstyle.h"

find "$STAGE/usr" -type f ! -type l -not -path '*/usr/lib/debug/*' \
  -not -path '*/usr/src/debug/*' | while IFS= read -r elf; do
    readelf -h "$elf" >/dev/null 2>&1 || continue
    readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN'
    readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
    readelf -d "$elf" | grep -F 'BIND_NOW'
    readelf -d "$elf" | grep -F 'RELR'
    if readelf -d "$elf" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
  done
rm -rf "$TMP"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.glibc-gconv-extra" = "*"
"org.gnu.glibc-langpack-de" = "*"
"org.gnu.glibc-langpack-en" = "*"
"org.gnu.glibc-langpack-fr" = "*"
"org.gnu.glibc-langpack-ja" = "*"
"org.gnu.glibc-langpack-zh" = "*"
"org.gnu.gzip" = "*"
"org.gnu.autoconf" = "*"
"org.gnu.automake" = "*"
"org.gnu.bash" = "*"
"org.perl.perl" = "*"
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils" = "*"
