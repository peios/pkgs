# Project-integration commands, public headers, shared-library link names and
# Autoconf glue. Static archives are deliberately not shipped.

[package]
name        = "org.gnu.gettext-devel"
description = "GNU Gettext project integration and development files"
license     = "GPL-3.0-or-later AND LGPL-2.1-or-later"

[provides]

[dependencies]
"org.git.kernel.dash"              = "*"
"org.gnu.gzip"              = "*"
"org.gnu.gettext-libasprintf"  = "{{version}}-3"
"org.gnu.gettext-libgettextpo" = "{{version}}-3"
"org.gnu.gettext-libtextstyle" = "{{version}}-3"
"org.gnu.autoconf" = "*"
"org.gnu.automake" = "*"
"dev.peios.peiosutils"          = "*"
"org.gnu.diffutils" = "*"
"org.gnu.findutils" = "*"
"org.gnu.gettext"   = "{{version}}-3"
"org.gnu.grep"              = "*"
"org.gnu.sed"               = "*"
"org.gnu.tar"               = "*"

[files]
"@source:COPYING" = "usr/share/licenses/org.gnu.gettext-devel/COPYING"
"@source:gettext-runtime/libasprintf/COPYING.LIB" = "usr/share/licenses/org.gnu.gettext-devel/COPYING.LIB"
":usr/bin/autopoint" = "usr/bin/autopoint"
":usr/bin/gettextize" = "usr/bin/gettextize"
":usr/include/**" = "usr/include"
":usr/lib/x86_64-linux-peios/libasprintf.so" = "usr/lib/x86_64-linux-peios/libasprintf.so"
":usr/lib/x86_64-linux-peios/libgettextpo.so" = "usr/lib/x86_64-linux-peios/libgettextpo.so"
":usr/lib/x86_64-linux-peios/libtextstyle.so" = "usr/lib/x86_64-linux-peios/libtextstyle.so"
":usr/share/aclocal/**" = "usr/share/aclocal"
