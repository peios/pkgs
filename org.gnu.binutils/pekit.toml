# binutils — the GNU binary utilities: the assembler (as), linker (ld), and the
# object tools (ar, nm, objcopy, objdump, ranlib, readelf, strip, strings, size,
# addr2line, c++filt, gprof), plus the libraries libbfd / libopcodes / libctf.
# The shipped gcc drives `as` and `ld`, so this is a hard prerequisite of the
# native compiler.
#
# Tarball source (the binutils-gdb git repo is huge and bundles gdb; the release
# tarball is binutils-only and ships configure). Versions are 2- or 3-component.
#
#   pekit package --all

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

# gprofng/posix-sh-compat-symlinks: upstream writes gprofng's five gp-* legacy
# symlinks with a bash brace expansion, which a POSIX sh leaves unexpanded.
# Drop when a binutils release carries the fix upstream.
# ld/peios-native-lib-path: Peios has no /usr/<triplet>/lib{,64} tooldir;
# --with-lib-path is the complete native linker search policy here.
[source]
patches = "patches"

[source.url]
url         = "https://ftpmirror.gnu.org/binutils/binutils-{{version}}.tar.xz"
listing_url = "https://ftpmirror.gnu.org/binutils/"
root        = "binutils-{{version}}"
extract     = true
# Matched within the directory-listing HTML, so deliberately unanchored.
file_regex = 'binutils-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor: retain the stable 2.46 series and every newer stable
# release. `pekit lock --all-versions` discovers and authenticates new releases
# automatically; this is not a compatibility ceiling or a manual version pin.
versions   = ">= 2.46"

# GNU release signatures close the trust-on-first-use gap for newly discovered
# versions. Nick Clifton signed 2.46.0 and 2.47; Sam James signed 2.46.1. The
# committed keys are minimal exports pinned to the primary fingerprints
# published by the maintainers and in the official release announcement.
[source.url.signature]
url = "{{source_url}}.sig"
key_files = ["keys/nick-clifton.asc", "keys/sam-james.asc"]
fingerprints = [
  "3A24BC1E8FB409FA9F14371813FCEF89DD9E3C4F",
  "5EF3A41171BB77E6110ED2D01F3D03348DB1A3E2",
]

# Out-of-source NATIVE build: build=host=target=x86_64-linux-peios, compiled by
# the shipped Peios gcc inside the composed native root (the Debian seed build
# uses the same triplets; they are ABI-identical to x86_64-pc-linux-gnu). zlib
# comes from the root's own zlib-devel, like any other build dependency.
#
# Layout per the peipkg specification: arch libs under /usr/lib/<triplet>.
[build.main]
command = """
set -eu

SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.binutils"
export CXXFLAGS="${CXXFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.binutils"
TRIPLET=x86_64-linux-peios


# Defensive: exported CC/CXX/AR/... would override configure's tool detection.
unset CC CXX CPP AR AS LD NM RANLIB STRIP OBJCOPY OBJDUMP READELF SIZE STRINGS ADDR2LINE

# PEIOS-DIVERGENCE(triplet): config.sub must accept x86_64-linux-peios, which
# names peios as the USERLAND on a linux kernel — the `android` model. Applied
# as a shared idempotent script rather than a patch series because it must cope
# with several config.sub vintages, and because a context patch against a file
# upstream regenerates would break on every release. Note the trap it exists to
# avoid: the OS-normalisation `case` has a `pe*)` arm that captures "peios" and
# mis-normalises it to obj=peios, os='' unless a peios arm precedes it.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/config-sub-peios.sh" "$SRC/config.sub"

cd "$PEKIT_OUT"
#   --with-lib-path         : the SEARCH_DIR list ld compiles into its default
#       linker script. Without it ld derives the list from libdir and the
#       emulation's "append 64" convention, which yields
#       /usr/lib/x86_64-linux-peios64 — libdir with 64 glued on, a path that
#       cannot exist — plus /usr/lib64, /usr/local/lib and other directories the
#       Peios filesystem layout does not have. The Peios patch suppresses those
#       generic tooldir fallbacks, leaving one correct directory: every
#       arch-specific library lives under the triplet. Reaching it previously
#       depended on /lib64 being the compose-minted symlink to it, i.e. it
#       worked by accident of the usr-merge rather than by design.
#   --with-sysroot=/        : the shipped ld searches the real root at run time.
#   --with-system-zlib      : link the root's libz (zlib-ng compat), not a
#       bundled copy — matches the declared zlib-devel build dependency.
#   --without-debuginfod    : org.sourceware.elfutils is built with
#       --disable-libdebuginfod, so no libdebuginfod exists to link against.
#   --enable-plugins        : ld plugin API (gcc LTO needs the linker plugin).
#   --enable-deterministic-archives : `ar` omits timestamps/uids by default —
#       a prerequisite for reproducible builds (PEI-94).
#   --enable-default-execstack=no : ld does NOT mark the stack executable when
#       an input object lacks .note.GNU-stack. The permissive default is a
#       1990s compatibility behaviour; one hand-written .S with no annotation
#       otherwise silently gives the whole program an executable stack.
#   --enable-relro          : -z relro on by default.
#   --enable-new-dtags      : emit RUNPATH rather than the legacy RPATH, so
#       LD_LIBRARY_PATH still takes precedence and the setting is overridable.
#   --enable-default-hash-style=gnu : the GNU hash table only; the SysV table is
#       dead weight for a distribution whose entire userland is being built here.
#   --enable-cet            : CET/IBT in binutils' own binaries, matching the
#       -fcf-protection in the workspace flag set.
#   --enable-64-bit-bfd     : 64-bit BFD support.
#   --disable-werror        : binutils warns on modern gcc.
#   CFLAGS/CXXFLAGS/LDFLAGS : inherited unchanged from the workspace. In
#       particular, do not assign LDFLAGS on configure's command line: that
#       replaces Peios's full-RELRO, DT_RELR and as-needed policy merely to add
#       a build-id which the workspace flags already request.
"$SRC/configure" \
  --build="$TRIPLET" --host="$TRIPLET" --target="$TRIPLET" \
  --prefix=/usr --libdir=/usr/lib/$TRIPLET \
  --with-sysroot=/ --with-lib-path=/usr/lib/$TRIPLET \
  --enable-shared --enable-plugins --enable-deterministic-archives \
  --enable-default-execstack=no --enable-relro --enable-new-dtags \
  --enable-default-hash-style=gnu --enable-cet --enable-64-bit-bfd \
  --with-system-zlib --without-debuginfod --disable-nls --disable-werror
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
# gprofng-display-html is a Perl program upstream starts with /usr/bin/env;
# name Perl through the runtime view instead.
sed -i '1s|^#! */usr/bin/env perl$|#!/bin/perl|' \
  "$PEKIT_OUT/usr/bin/gprofng-display-html"
test "$(head -n 1 "$PEKIT_OUT/usr/bin/gprofng-display-html")" = '#!/bin/perl'
# The top-level install omits gprofng's doc subdirectory. Its signed release
# already contains the generated manuals; stage those exact upstream pages.
install -m 0644 "$SRC"/gprofng/doc/*.1 "$PEKIT_OUT/usr/share/man/man1/"
ln -s ld.1 "$PEKIT_OUT/usr/share/man/man1/ld.bfd.1"
for name in archive collect-app display-html display-src display-text; do
  ln -s "gprofng-$name.1" "$PEKIT_OUT/usr/share/man/man1/gp-$name.1"
done
ln -s gprofng-display-gmon.1 "$PEKIT_OUT/usr/share/man/man1/gprofng-gmon.1"
# Compress regular pages and retarget relative manual aliases together.
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -9n {} \\;
find "$PEKIT_OUT/usr/share/man" -type l -name '*.[1-9]' | while IFS= read -r man; do
  target=$(readlink "$man")
  rm "$man"
  ln -s "$target.gz" "$man.gz"
done

find "$PEKIT_OUT/usr" -name '*.la' -delete
# Peios currently has no system Info-document registration policy. Keep the man
# pages and remove the otherwise orphaned Info payload, as the other GNU recipes
# in this workspace do.
rm -rf "$PEKIT_OUT/usr/share/info"

# Libtool relinks the tools and libraries that use libbfd/libopcodes/libctf
# with RUNPATH=/usr/lib/x86_64-linux-peios: Peios roots have no ld.so.conf,
# so libtool's system search list is only /lib and /usr/lib and it treats the
# triplet directory as non-standard. The loader already searches it, so the
# entry is redundant and the workspace forbids it. Remove it wherever present.
find "$PEKIT_OUT/usr" -type f | LC_ALL=C sort | while IFS= read -r f; do
  readelf -h "$f" >/dev/null 2>&1 || continue   # not an ELF file
  if readelf -d "$f" | grep -Eq '\\((RPATH|RUNPATH)\\)'; then
    patchelf --remove-rpath "$f"
  fi
done

# Split debug data for every installed ELF and archive. Installed tool aliases
# are hardlinks (including ld/ld.bfd); the helper splits each inode once.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.binutils "$PEKIT_OUT/usr"
"""

# Build deps. Native build: the c++ floor supplies the compiler, make, the
# assembler/linker this package is replacing, and the debug-split tools
# (debugedit, patchelf, strip/objcopy) the post-install pipeline invokes.
[build.main.dependencies.peipkg]
"org.gnu.gzip" = "*"
"dev.peios.build-essentials-c++" = "*"
# Libtool uses file(1) to classify objects and libraries during configure.
"com.darwinsys.file" = "*"
# gas uses perl/pod2man when refreshing the installed command manuals. Release
# tarballs carry pregenerated pages, but a missing generator must not be masked
# by make's non-fatal documentation rule.
"org.perl.perl" = "*"
# --with-system-zlib links the root's libz rather than binutils' bundled copy.
"io.github.zlib-ng.zlib-ng-compat-devel" = "*"
# libsframe compiles its unit tests only when configure finds dejagnu.h.
"org.gnu.dejagnu-devel" = "*"

[build.main.dependencies.apt]
gzip = "*"
build-essential = "*"
debugedit = "*"
dwz       = "*"
file = "*"
patchelf = "*"
perl = "*"
zlib1g-dev = "*"
dejagnu = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
BIN="$PEKIT_MAIN_OUT/usr/bin"
# ar.exp's "replacing non-deterministic member" requires SOURCE_DATE_EPOCH to
# be unset (it says so): with it set, `ar U` records that date instead of the
# member's real one. The test exercises ar, not this build's reproducibility.
unset SOURCE_DATE_EPOCH

# Upstream DejaGnu suites for the binutils tools, the assembler, the linker and
# libsframe, against the build tree, in both environments. Any unexpected
# result fails the gate; expected failures are upstream's own XFAIL markings.
check_dejagnu_sum() {
  label=$1
  sum=$2
  test -s "$sum"
  awk '/^# of expected passes/{if ($NF + 0 > 0) found=1} END{exit !found}' "$sum"
  if grep -Eq '^(FAIL|XPASS|UNRESOLVED|ERROR|KPASS):' "$sum"; then
    echo "binutils: unexpected DejaGnu result in $label ($sum)" >&2
    grep -E '^(FAIL|XPASS|UNRESOLVED|ERROR|KPASS):' "$sum" >&2
    exit 1
  fi
  grep -E '^# of ' "$sum" | sed "s|^|binutils: $label: |"
}
command -v runtest >/dev/null
# The suites select target-specific cases with DejaGnu globs, and upstream's
# "*-*-pe*" (Windows PE/COFF targets) matches x86_64-pc-linux-peios, so
# dozens of PE, DLL and COFF cases would run against this ELF toolchain. Run
# them as x86_64-pc-linux-gnu: the same x86-64 ELF/glibc ABI without the
# collision (the one config.sub has, see config-sub-peios.sh).
TRIPLET_FLAGS="--build=x86_64-pc-linux-gnu --host=x86_64-pc-linux-gnu --target=x86_64-pc-linux-gnu"
make -C "$PEKIT_MAIN_OUT" -k -j"$(nproc)" \
  check-binutils check-gas check-ld check-libsframe check-libctf \
  RUNTESTFLAGS="$TRIPLET_FLAGS" > "$PEKIT_OUT/dejagnu.log" 2>&1 || true
check_dejagnu_sum binutils "$PEKIT_MAIN_OUT/binutils/binutils.sum"
check_dejagnu_sum gas "$PEKIT_MAIN_OUT/gas/testsuite/gas.sum"
check_dejagnu_sum ld "$PEKIT_MAIN_OUT/ld/ld.sum"
check_dejagnu_sum libsframe "$PEKIT_MAIN_OUT/libsframe/libsframe.sum"
check_dejagnu_sum libctf "$PEKIT_MAIN_OUT/libctf/libctf.sum"

# Then the staged, installed tools directly.
export LD_LIBRARY_PATH="$PEKIT_MAIN_OUT/usr/lib/x86_64-linux-peios:/usr/lib/x86_64-linux-peios"
case "$("$BIN/ld" --version)" in *"$PEKIT_VERSION"*) ;; *) exit 1;; esac
case "$("$BIN/as" --version)" in *x86_64-linux-peios*) ;; *) exit 1;; esac

# Exercise the target, deterministic archives, executable-stack policy and
# installed linker search layout in the independently composed test root.
SMOKE="$PEKIT_OUT/binutils-smoke"
mkdir -p "$SMOKE"
printf '%s\n' '.globl _start' '_start:' '  xor %edi, %edi' \
  '  mov $60, %eax' '  syscall' > "$SMOKE/start.s"
"$BIN/as" -o "$SMOKE/start.o" "$SMOKE/start.s"
"$BIN/ld" -o "$SMOKE/start" "$SMOKE/start.o"
"$BIN/readelf" -h "$SMOKE/start" | grep -F 'Machine:' | \
  grep -F 'Advanced Micro Devices X86-64'
grep -F '#define DEFAULT_LD_EXECSTACK 0' "$PEKIT_MAIN_OUT/ld/config.h"
"$BIN/readelf" -W -l "$SMOKE/start" | \
  awk '$1 == "GNU_STACK" && $0 ~ /RWE/ { exit 1 }'
"$BIN/ar" rc "$SMOKE/one.a" "$SMOKE/start.o"
touch "$SMOKE/start.o"
"$BIN/ar" rc "$SMOKE/two.a" "$SMOKE/start.o"
cmp "$SMOKE/one.a" "$SMOKE/two.a"
SEARCH_DIRS=$("$BIN/ld" --verbose | sed -n '/^SEARCH_DIR/p' | head -1)
[ "$SEARCH_DIRS" = 'SEARCH_DIR("/usr/lib/x86_64-linux-peios");' ] || {
  printf 'unexpected native ld search path: %s\n' "$SEARCH_DIRS" >&2
  exit 1
}
test "$(head -n 1 "$BIN/gprofng-display-html")" = '#!/bin/perl'
for name in gp-archive gp-collect-app gp-display-html gp-display-src gp-display-text; do
  [ -L "$BIN/$name" ] || {
    echo "missing gprofng compatibility symlink: $name" >&2
    exit 1
  }
done
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
# The upstream suites: DejaGnu, and the C/C++ compilers the ld tests use.
# `make check` first re-makes `all` against this root's headers, so the
# build's own inputs are needed here too.
"org.gnu.dejagnu" = "*"
# libsframe's unit tests are compiled at check time against dejagnu.h.
"org.gnu.dejagnu-devel" = "*"
"dev.peios.build-essentials-c++" = "*"
"io.github.zlib-ng.zlib-ng-compat-devel" = "*"
"org.perl.perl" = "*"
"com.darwinsys.file" = "*"
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.gawk" = "*"
"org.gnu.diffutils" = "*"
"org.gnu.grep" = "*"
"org.gnu.sed" = "*"
"io.github.zlib-ng.zlib-ng-compat" = "*"

[test.dependencies.apt]
dejagnu = "*"
build-essential = "*"
"g++" = "*"
zlib1g-dev = "*"
perl = "*"
file = "*"
dash = "*"
coreutils = "*"
diffutils = "*"
gawk = "*"
grep = "*"
sed = "*"
zlib1g = "*"
