# binutils-gprofng — GNU Next Generation Profiler.
#
# Split out because it is a profiler, not a binary utility: ~2.5 MB of the main
# package (984 KB of programs plus a 1.5 MB collector-library tree) that exists
# to analyse application performance, while everything else in binutils exists
# to build software. Nothing in the toolchain path — as, ld, ar, the debug-split
# pipeline — touches it. Fedora splits it the same way, as binutils-gprofng.
#
# The collector libraries under <triplet>/gprofng/ are LD_PRELOAD shims that
# gprofng injects into the program being profiled, which is why they live in
# their own directory rather than beside the ordinary shared libraries.

side_effects = ["man-db"]

[package]
name        = "org.gnu.binutils-gprofng"
description = "GNU Next Generation Profiler for analysing application performance"

[dependencies]
# Programs and libraries built against this binutils; libgprofng links libbfd.
"org.gnu.binutils" = "{{version}}-1"
# gprofng is C++, and gprofng-display-html is an installed Perl program.
"org.gnu.gcc-libstdc++" = "*"
"org.perl.perl" = ">= 5.6"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.binutils-gprofng/"
# Drivers plus the gp-* compatibility names. Those five are symlinks onto the
# gprofng-* binaries, and only exist at all because of the patch in
# patches/gprofng/ — upstream writes them with a bash brace expansion that a
# POSIX sh (Peios's sh role is dash) leaves unexpanded, producing one dangling
# link literally named "gp-{archive,collect-app,...}" and none of the five.
":usr/bin/gprofng"   = "usr/bin/gprofng"
":usr/bin/gprofng-*" = "usr/bin/"
":usr/bin/gp-*"      = "usr/bin/"
# Private runtime library; its linker name and archive are in -gprofng-devel.
":usr/lib/x86_64-linux-peios/libgprofng.so.*" = "usr/lib/x86_64-linux-peios/"
":usr/share/man/man1/gprofng*.1.gz" = "usr/share/man/man1/"
":usr/share/man/man1/gp-*.1.gz" = "usr/share/man/man1/"

":usr/lib/x86_64-linux-peios/gprofng/**"      = "usr/lib/x86_64-linux-peios/gprofng/"
