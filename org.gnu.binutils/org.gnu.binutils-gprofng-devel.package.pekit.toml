# Link-time files for the separately installable profiler library.
[package]
name = "org.gnu.binutils-gprofng-devel"
description = "GNU Next Generation Profiler - link-time library files"

[dependencies]
"org.gnu.binutils-gprofng" = "= {{release}}"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.binutils-gprofng-devel/"
":usr/lib/x86_64-linux-peios/libgprofng.so" = "usr/lib/x86_64-linux-peios/libgprofng.so"
":usr/lib/x86_64-linux-peios/libgprofng.a" = "usr/lib/x86_64-linux-peios/libgprofng.a"
