# binutils-debugsource — binutils sources referenced by the debug info, under
# /usr/src/debug/org.gnu.binutils. Pairs with org.gnu.binutils-debuginfo.

[package]
name        = "org.gnu.binutils-debugsource"
description = "GNU binary utilities - debug sources"

[dependencies]
"org.gnu.binutils-debuginfo" = "{{version}}"

[files]
":usr/src/debug/**" = "usr/src/debug"
