# rust-stage0 — signed upstream Rust binaries that seed the rustc bootstrap
# (PEI-158 item 8; anchor decision approved 2026-08-11: signature + immutable
# Pekit lock via the PEI-150 machinery).
#
# rustc is self-hosting: every rustc is compiled by a prior rustc, so the
# chain bottoms out in somebody's binary. This recipe makes that seed an
# explicit, signature-verified, lockfile-pinned artifact: the combined
# upstream release tarball, verified against the pinned Rust release signing
# key and installed under a private prefix nothing else looks at. It is not a
# Peios runtime toolchain. The final Rust recipe is its sole intended consumer.
#
# Version is the seed compiler's own version, not the rustc it will build. Each
# stable release is published here as the seed for the following release; the
# final recipe selects the newest version below its own major.minor line and
# verifies that choice against rustc's authoritative src/stage0 metadata.
# The binaries are upstream linux-gnu builds; composed roots run them as-is
# (usrmerge provides /lib64/ld-linux-x86-64.so.2, verified). mrustc remains the
# later-adoptable source-trust upgrade (recorded on PEI-158) — swapping it in
# replaces only this seed, nothing downstream.

out_dir = "out"

# This input is an upstream binary bootstrap seed, not corresponding source.
# The final org.rust-lang.rust build emits the actual Rust source package.
[source_package]
enabled = false

[source.url]
url      = "https://static.rust-lang.org/dist/rust-{{version}}-x86_64-unknown-linux-gnu.tar.xz"
extract  = true
root     = "rust-{{version}}-x86_64-unknown-linux-gnu"
# Discover only the current stable combined toolchain from Rust's channel
# manifest. Historical seed releases remain available through pekit.lock.
listing_url = "https://static.rust-lang.org/dist/channel-rust-stable.toml"
file_regex  = '(?m)^\[pkg\.rust\]\nversion = "[0-9]+\.[0-9]+\.[0-9]+'
# Soft production floor: 1.97.1 builds Rust 1.98.1, and every newly published
# stable toolchain becomes the already-available seed for the next release.
versions = ">= 1.97.1"

[source.url.signature]
key_files    = ["keys/rust-release.asc"]
url          = "{{source_url}}.asc"
fingerprints = ["108F66205EAEB0AAA8DD5E1C85AB96E6FA1BE5FE"]

[build.main]
command = """
set -eu
SRC="$(pwd -P)"
PREFIX=/usr/lib/x86_64-linux-peios/rust-stage0
export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-peios${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
sh "$SRC/install.sh" \
  --destdir="$PEKIT_OUT" --prefix="$PREFIX" \
  --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu \
  --disable-ldconfig
# rust-installer bookkeeping (uninstaller, install log) isn't payload; the
# component manifests stay because they document the exact seed components.
rm -f "$PEKIT_OUT$PREFIX/lib/rustlib/uninstall.sh" \
  "$PEKIT_OUT$PREFIX/lib/rustlib/install.log"

# The combined upstream installer includes end-user integration that the
# private compiler seed never uses. Removing it keeps the bootstrap boundary
# narrow and avoids exposing duplicate rustc/cargo documentation or debugger
# wrappers from a build-only package.
rm -rf "$PEKIT_OUT$PREFIX/etc" \
  "$PEKIT_OUT$PREFIX/share" \
  "$PEKIT_OUT$PREFIX/libexec" \
  "$PEKIT_OUT$PREFIX/lib/rustlib/etc"
rm -f "$PEKIT_OUT$PREFIX/bin/rustdoc" \
  "$PEKIT_OUT$PREFIX/bin/rust-gdb" \
  "$PEKIT_OUT$PREFIX/bin/rust-gdbgui" \
  "$PEKIT_OUT$PREFIX/bin/rust-lldb"

"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.gnu.gcc-libgcc" = ">= 16"
"io.github.zlib-ng.zlib-ng-compat" = "*"

[build.main.dependencies.apt]
build-essential = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
PREFIX="$PEKIT_MAIN_OUT/usr/lib/x86_64-linux-peios/rust-stage0"

# Catch a lock or recipe edit before a final compiler begins its many-hour
# self-hosted build with the wrong seed.
test "$("$PREFIX/bin/rustc" --version | cut -d' ' -f2)" = "$PEKIT_VERSION"
test "$("$PREFIX/bin/cargo" --version | cut -d' ' -f2)" = "$PEKIT_VERSION"
test -f "$PREFIX/lib/rustlib/manifest-rustc"
test -f "$PREFIX/lib/rustlib/manifest-cargo"
test -f "$PREFIX/lib/rustlib/manifest-rust-std-x86_64-unknown-linux-gnu"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials" = "*"
"org.gnu.gcc-libgcc"         = ">= 16"
"io.github.zlib-ng.zlib-ng-compat" = "*"

[test.dependencies.apt]
build-essential = "*"
