format = "peipkg"

[package]
name         = "org.rust-lang.rust-stage0"
version      = "{{version}}-2"
architecture = "x86_64"
description  = "Upstream Rust release binaries - the pinned bootstrap seed for building rustc (build-time only, never a runtime dependency)"
license      = "Apache-2.0 OR MIT"
license_class = "free"
homepage     = "https://www.rust-lang.org/"

[provides]
rust-stage0 = "{{version}}-2"

[replaces]
rust-stage0 = "< {{version}}-2"

[dependencies]
glibc  = ">= 2.43"
libgcc = ">= 16"
zlib   = ">= 2.3.3"

[files]
"@source:COPYRIGHT"      = "usr/share/licenses/org.rust-lang.rust-stage0/"
"@source:LICENSE-APACHE" = "usr/share/licenses/org.rust-lang.rust-stage0/"
"@source:LICENSE-MIT"    = "usr/share/licenses/org.rust-lang.rust-stage0/"
":usr/lib/x86_64-linux-peios/rust-stage0/**" = "usr/lib/x86_64-linux-peios/rust-stage0"
