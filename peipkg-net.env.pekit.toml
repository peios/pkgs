# Network-capable extension of the rung-2 Peipkg environment for a recipe's
# hash-pinned source-materialisation target, selected with
# `pekit package --env peipkg-net`.
#
# The inherited wrapper runs build:vendor in a read-only host root with the
# host network and trust store, while binding only that target's output
# writable. All other targets are delegated to the ordinary, offline Peipkg
# root. This is intentionally a downloader boundary, not a networked compiler.
dependency_provider = "peipkg"

[wrap]
command = 'exec "$PEKIT_WORKSPACE_ROOT/_peiroot_/enter-net.sh" {{command}}'
