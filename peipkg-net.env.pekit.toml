# Dependency-root preparation is coordinator policy; Pekit isolates workers.
dependency_provider = "peipkg"
[sandbox]
command = 'exec "$PEKIT_WORKSPACE_ROOT/_peiroot_/enter-net.sh"'
network_targets = ["build:vendor"]
# enter-net.sh installs this into every root it prepares; in native
# acquisition roots it starts the build-root resolver before the target.
entry = ["/usr/libexec/peiroot/entry"]
