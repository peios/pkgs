out_dir = "out"

[source]
patches = "patches"

# Debian mirrors the original Info-ZIP release bytes. Upstream has not issued
# a newer stable release; keep a soft floor and follow new originals if added.
[source.url]
url = "https://deb.debian.org/debian/pool/main/z/zip/zip_{{version}}.orig.tar.gz"
listing_url = "https://deb.debian.org/debian/pool/main/z/zip/"
file_regex = 'zip_[0-9]+\.[0-9]+(?:\.[0-9]+)?\.orig\.tar\.gz'
versions = ">= 3.0"
root = "zip30"
extract = true

[build.main]
command = '''
set -eu
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -std=gnu17 -fmacro-prefix-map=$ROOT=/usr/src/debug/net.sourceforge.infozip.zip"
cp -a . "$PEKIT_OUT/build"
cd "$PEKIT_OUT/build"
LDFLAGS="$LDFLAGS" sh unix/configure gcc "$CFLAGS -I. -DUNIX"
make -f unix/Makefile -j"$(nproc)" generic
make -f unix/Makefile install prefix="$PEKIT_OUT/usr" MANDIR="$PEKIT_OUT/usr/share/man/man1"
find "$PEKIT_OUT/usr/share/man" -type f -exec gzip -9n {} \;
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" net.sourceforge.infozip.zip "$PEKIT_OUT/usr"
'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.sourceware.bzip2-devel" = "*"
"org.gnu.gzip" = "*"

[test]
needs = ["main"]
gate = true
command = '''
set -eu
python3 "$PEKIT_RECIPE_ROOT/tests/test-tools.py" "$PEKIT_MAIN_OUT/usr/bin" "$PEKIT_OUT"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.python.python3" = "*"
"net.sourceforge.infozip.unzip" = "*"
