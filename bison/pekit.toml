# bison — the GNU parser generator (yacc's successor); gmp's demos and the
# glibc/gcc/elfutils rebuilds feed on it (AC_PROG_YACC finds `bison -y`).
#
# Phase-2a tool (PEI-155): the first recipe born on the peipkg rung — plain
# autotools from the release tarball, out-of-source via DESTDIR (the m4
# shape). bison shells out to m4 at runtime for skeleton processing, so m4
# is a package dependency, not just a build one.

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/bison/bison-{{version}}.tar.xz"
extract  = true
root     = "bison-{{version}}"
versions = ">= 3.8.2"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --libdir=/usr/lib/x86_64-linux-peios --disable-nls
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/aclocal"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
m4 = "*"

[build.main.dependencies.apt]
build-essential = "*"
m4 = "*"
