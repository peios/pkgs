# org.gnu.gmp-doc — the GMP manual as HTML, rendered by texi2any from the
# release's Texinfo source. Peios ships no Info documents.

[package]
name         = "org.gnu.gmp-doc"
description  = "GNU Multiple Precision Arithmetic Library - HTML manual"
architecture = "noarch"
license      = "GFDL-1.3-or-later"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.gmp-doc/"
":usr/share/doc/org.gnu.gmp/html/**" = "usr/share/doc/org.gnu.gmp/html"
