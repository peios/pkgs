# org.gnu.gmp-static — static archives for statically linking gmp and gmpxx.

[package]
name        = "org.gnu.gmp-static"
description = "GNU Multiple Precision Arithmetic Library - static libraries"

[provides]
"gmp-static" = "{{version}}"

[dependencies]
"org.gnu.gmp-devel" = "{{version}}-2"

[files]
":usr/lib/x86_64-linux-peios/libgmp.a"   = "usr/lib/x86_64-linux-peios/libgmp.a"
":usr/lib/x86_64-linux-peios/libgmpxx.a" = "usr/lib/x86_64-linux-peios/libgmpxx.a"
