# org.gnu.gmp-debugsource — the sources referenced by the debug info, under
# /usr/src/debug/org.gnu.gmp. It pairs with org.gnu.gmp-debuginfo.

[package]
name        = "org.gnu.gmp-debugsource"
description = "GNU Multiple Precision Arithmetic Library - debug sources"

[dependencies]
"org.gnu.gmp-debuginfo" = "{{version}}-1"

[files]
":usr/src/debug/**" = "usr/src/debug"
