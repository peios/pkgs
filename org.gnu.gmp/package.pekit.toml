# Base metadata shared by the GNU GMP package family. The expression covers
# the dual-licensed libraries, tests, manual and generated build machinery
# carried by the corresponding-source package as well as the binary payloads.

format = "peipkg"

[package]
version      = "{{version}}-1"
architecture = "x86_64"
# gmp 6.x is dual-licensed: GNU LGPL v3 or GNU GPL v2 (consumer's choice).
license      = "(LGPL-3.0-or-later OR GPL-2.0-or-later) AND GPL-3.0-or-later AND (GPL-2.0-or-later WITH Libtool-exception) AND (GPL-2.0-or-later WITH Autoconf-exception-generic) AND (GPL-3.0-or-later WITH Autoconf-exception-generic-3.0) AND (GPL-3.0-or-later WITH Texinfo-exception) AND GFDL-1.3-or-later AND FSFAP AND X11 AND LicenseRef-Public-Domain"
license_class = "free"
homepage     = "https://gmplib.org/"
