# libpfm — hardware performance event encoding library; perf's
# --pfm-events support auto-detects it (PEI-158 Tier 2).
#
# NOT autotools — plain Makefile config vars, built in a tree copy (the
# bzip2 dance). DBG overridden to drop upstream's hard-wired -Werror
# (GCC 16 warnings in the event tables would otherwise be fatal — the
# Fedora treatment). GitHub tag tarball (SourceForge's redirect dance is not a
# stable [source.url]). Static lib dropped (house style).

out_dir = "out"

[source.url]
url      = "https://github.com/wcohen/libpfm4/archive/refs/tags/v{{version}}.tar.gz"
extract  = true
root     = "libpfm4-{{version}}"
versions = ">= 4.13"

[build.main]
command = """
SRC="$(pwd)"
LIBDIR=/usr/lib/x86_64-linux-peios
mkdir -p "$PEKIT_OUT/build"
cp -a "$SRC/." "$PEKIT_OUT/build/"
cd "$PEKIT_OUT/build"
make -j"$(nproc)" PREFIX=/usr LIBDIR="$LIBDIR" CONFIG_PFMLIB_SHARED=y \
  DBG="-g -Wall"
make install DESTDIR="$PEKIT_OUT" PREFIX=/usr LIBDIR="$LIBDIR" \
  LDCONFIG=true CONFIG_PFMLIB_SHARED=y DBG="-g -Wall"
find "$PEKIT_OUT$LIBDIR" -maxdepth 1 -name '*.a' -delete
rm -rf "$PEKIT_OUT/build"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
