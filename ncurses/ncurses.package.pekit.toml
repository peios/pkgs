# ncurses — the terminfo tools (the database itself rides with
# libncurses, keeping lib+data self-contained and the dep graph acyclic).

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "ncurses"
description = "ncurses - terminfo tools (tic, tput, infocmp)"

[dependencies]
glibc      = ">= 2.43"
libncurses = "{{version}}"

[files]
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
