side_effects = ["man-db"]

[package]
name        = "org.gnu.make"
description = "GNU Make build automation tool"
license     = "GPL-3.0-or-later"

[provides]

[dependencies]
"org.git.kernel.dash"  = "*"
"org.gnu.glibc" = ">= 2.43"

[files]
"@source:COPYING"        = "usr/share/licenses/org.gnu.make/"
":usr/bin/make"           = "usr/bin/make"
":usr/share/locale/**"    = "usr/share/locale"
":usr/share/man/man1/**"  = "usr/share/man/man1"
