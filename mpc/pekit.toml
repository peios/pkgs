# mpc — GNU MPC, complex-number arithmetic on top of gmp + mpfr (correct
# rounding). The third of gcc's math prerequisites; cc1 links it. Links gmp+mpfr.
#
# Tarball source (ftp.gnu.org).
#
# mpc changed its release archive format at 1.4.0: 1.3.x and earlier are .tar.gz,
# 1.4.0 onwards are .tar.xz. The recipe matched only .tar.gz, so enumeration went
# blind at 1.3.1 and stayed there — and the comment that used to sit here
# explained the standstill by asserting "1.4.x exists only in git", which is
# simply not so: 1.4.0 and 1.4.1 are both on ftp.gnu.org, and Fedora and Arch
# each ship 1.4.1. A silent version freeze dressed up as a considered decision.
#
# So: .tar.xz, and floor the line at 1.4 — the extension is uniform from there,
# and older releases are reachable on demand with `--version X` anyway. The
# soname is unchanged across the bump (libmpc.so.3), so consumers are unaffected.
#
#   nix develop ./_flake#mpc -c pekit build --version 1.4.1

out_dir = "out"

[source.url]
url        = "https://ftp.gnu.org/gnu/mpc/mpc-{{version}}.tar.xz"
root       = "mpc-{{version}}"
extract    = true
file_regex = '^mpc-\d+\.\d+\.\d+\.tar\.xz$'
versions   = ">= 1.4"

# Standard autotools. The distro CFLAGS/LDFLAGS arrive through the environment;
# assigning LDFLAGS on the configure line OVERRIDES it rather than adding, which
# is how this recipe used to discard the whole distro link flag set while adding
# --build-id (already in LDFLAGS, as sha1). `-std=gnu17` is gone with it: it
# guarded against C23 tripping K&R configure probes, which is a gmp problem
# (now patched at source), not mpc's.
#
# gmp + mpfr found via the cc-wrapper's injected -I/-L.
[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios

# libtool appends -Wl,--as-needed after the libraries and hardcodes an rpath to
# the install libdir; Fedora and Arch both rewrite it, so do the same.
sed -e 's|^hardcode_libdir_flag_spec=.*|hardcode_libdir_flag_spec=""|g' \
    -e 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' \
    -e 's|CC="\\(g..\\)"|CC="\\1 -Wl,--as-needed"|' \
    -i libtool

make -j"$(nproc)"

# Correctly-rounded complex arithmetic, which gcc folds constants through.
# Fedora and Arch both run the suite.
#
# LD_LIBRARY_PATH is load-bearing: the libtool rewrite above strips the rpath
# from the test binaries, so without it they load libmpc.so.3 from the composed
# root — which is there because gcc's cpp package depends on mpc — and test the
# previously published library rather than this build. mpc is where that fault
# became visible, because it was the one package whose version had moved:
# tget_version reported "MPC: include 1.4.1, lib 1.3.1" and 17 tests failed,
# ttanh among them, on 1.3.1 behaviour its own newer test vectors reject.
# Fedora's libmpc.spec exports this in %check for exactly this reason.
LD_LIBRARY_PATH="$PEKIT_OUT/src/.libs" make -j"$(nproc)" check

make install DESTDIR="$PEKIT_OUT"

find "$PEKIT_OUT/usr" -name '*.la' -delete
# Installed but packaged by nobody (Peios ships no /usr/share/info).
rm -rf "$PEKIT_OUT/usr/share/info"

# Post-install debug pipeline (same as gmp/mpfr): strip libtool's redundant rpath
# + the stray ld-linux DT_NEEDED, scrub DWARF (-> /usr/src/debug/mpc), split debug
# build-id-indexed, strip, stage sources. Static .a: strip-debug.
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  patchelf --remove-rpath "$f" 2>/dev/null || true
  patchelf --remove-needed ld-linux-x86-64.so.2 "$f" 2>/dev/null || true
  debugedit -b "$ROOT" -d /usr/src/debug/mpc -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$ROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/mpc/$(dirname "$rel")"
  cp "$ROOT/$rel" "usr/src/debug/mpc/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""

# Build deps. mpc is autotools (gcc + make), links gmp + mpfr, and the
# post-install debug split adds debugedit + patchelf.
[build.main.dependencies.peipkg]
build-essentials-c = "*"
gmp-devel = "*"
mpfr-devel = "*"

[build.main.dependencies.apt]
build-essential = "*"
libgmp-dev = "*"
libmpfr-dev = "*"
debugedit = "*"
patchelf = "*"
