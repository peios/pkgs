# mpc-devel — header + dev .so symlink. mpc.h #includes gmp.h and mpfr.h.

[package]
description = "GNU MPC - development files"

[dependencies]
mpc = "{{version}}"
gmp-devel  = ">= 6.3.0"
mpfr-devel = ">= 4.2.2"

[files]
":usr/include/mpc.h"                     = "usr/include/mpc.h"
":usr/lib/x86_64-linux-peios/libmpc.so"  = "usr/lib/x86_64-linux-peios/libmpc.so"
