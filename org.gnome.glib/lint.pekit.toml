[allow]
"source.signature.required" = "GNOME publishes GLib release archives and checksum sidecars but no detached maintainer signatures; HTTPS plus Pekit's immutable SHA-256 lock, checked against the sidecar on acceptance, is the available provenance boundary"

# Every runtime and development split shares the family's symbol archive.
[elf]
debuginfo = "org.gnome.glib-debuginfo"
