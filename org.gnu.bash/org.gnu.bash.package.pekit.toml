side_effects = ["man-db"]

[package]
name = "org.gnu.bash"
description = "GNU Bash - the Bourne-Again Shell"

# Bash holds the preferred interactive-shell role. Dash remains the separate
# `sh` provider for POSIX scripts; consumers that explicitly want an
# interactive shell depend on `ish` and receive /usr/bin/ish.
[provides]
ish = "1"

[claims.provides.ish.usrbin]
target = "/usr/bin/bash"
path   = "/usr/bin/ish"

[dependencies]
"org.gnu.glibc" = ">= 2.43"
"org.gnu.ncurses-libs" = ">= 6.6"

[files]
"@source:COPYING"      = "usr/share/licenses/org.gnu.bash/"
":usr/bin/**"          = "usr/bin"
":usr/share/locale/**" = "usr/share/locale"
":usr/share/man/**"    = "usr/share/man"
