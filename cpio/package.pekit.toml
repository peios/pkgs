format = "peipkg"

[package]
name         = "cpio"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU cpio - archive copier (cpio archives, initramfs images)"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/cpio/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING"   = "usr/share/licenses/cpio/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
