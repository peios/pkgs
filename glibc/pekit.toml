# glibc — the GNU C Library: Peios's core C runtime and dynamic loader.
#
# Recipe-supplies path (like figlet): upstream ships no pekit files, so this
# recipe carries the whole build. glibc is an autotools project that REFUSES to
# configure in its own source tree, so this is an out-of-source build: CWD at
# build time is the checked-out source root; we configure + compile inside
# $PEKIT_OUT and stage the install tree there via DESTDIR. package.pekit.toml
# then globs the staged tree selectively (the build scratch left in $PEKIT_OUT
# never matches the usr/** install globs, the same way figlet's package does).
#
# Build deps are declared per-provider below; the environment selected with
# --env decides which set provisions. The clean-room path is
# `pekit package --all --env debian` (PEI-156): a pristine Debian container
# installs exactly the apt list. Kernel headers come from the environment
# (linux-libc-dev there, kernel-headers under the peipkg provider); from
# libc's point of view they're vanilla Linux, so we don't pass
# --with-headers and let the compiler supply them.

out_dir = "out"

# Build flags: glibc implements the hardening features itself and must not be
# handed the distro's CFLAGS form of them (PEI-159).
#
# _FORTIFY_SOURCE is the one that actually breaks. glibc IS the implementation
# of the fortified entry points, so defining the macro while compiling it makes
# the library fortify itself; Fedora's spec records that libc_nonshared.a
# "cannot be built with the default hardening flags because the glibc build
# system is incompatible with -D_FORTIFY_SOURCE", and Arch strips the same flag
# with the note that it "causes testsuite build failure and is unnecessary
# during actual builds (support is built-in via --enable-fortify-source)".
# So it is removed here and requested through configure instead.
#
# Stack protector and BIND_NOW are not removed but are ALSO requested through
# configure, because glibc needs to control where they apply: parts of the
# library run before the TCB that holds the stack canary exists (early startup,
# static IFUNC resolvers), and glibc's build system is what knows to compile
# those with -fno-stack-protector. --enable-stack-protector=strong is that
# controlled form; the compiler default alone is not.
[env]
CFLAGS = "-O2 -g -pipe -fexceptions -Wall -Werror=format-security -fstack-clash-protection -fcf-protection -grecord-gcc-switches"
CXXFLAGS = "$CFLAGS"

# nss/identity-is-not-configurable: identity comes from the authority and from
# nowhere a configuration file can name. See patches/series — glibc carried no
# Peios patches before this one, and the bar for adding to that stays high.
[source]
patches = "patches"

[source.git]
# Canonical upstream. (The github.com/bminor/glibc mirror is archived.)
url = "https://sourceware.org/git/glibc.git"
# glibc tags releases two-component as glibc-<version> (glibc-2.43), which pekit
# now matches directly: `pekit build --version 2.43` renders this rev to
# glibc-2.43 with no enumeration, and `--version 2.43.0` falls back to the
# glibc-2.43 tag by dropping the trailing zero.
ref = "glibc-{{version}}"
# The dev snapshots between releases carry a three-component .9000 patch
# (glibc-2.43.9000) and sort ABOVE the release, so a semver `versions` bound
# can't drop them generically. tag_regex keeps enumeration (`*`/--latest) to
# the two-component release tags; an explicit `--version 2.43.9000` still
# builds a snapshot on request.
tag_regex = '^glibc-\d+\.\d+$'
# Two-tier floor, "absolute build minimum >= minimum in practice" (AND-ed, so
# the effective floor is the higher bound, 2.43; the 2.32 is intentionally
# redundant, kept as a record of the true build floor):
#   >=2.32  absolute build minimum — a binary search found 2.31 and below HANG
#           (GNU make 4.4.1 spins on glibc's pre-2.32 Makefiles, three make procs
#           at 100% CPU, no compiler activity); 2.32 (2020-08) is the oldest that
#           builds with gcc 14.3 / binutils 2.44 / make 4.4.1. Revisit if the
#           build toolchain changes.
#   >=2.43  minimum in practice — glibc is the singular, backward-compatible
#           system libc, so we only package latest + future; older releases have
#           no consumer and carry unpatched CVEs. Any version down to the build
#           minimum is still buildable on demand via `--version X`.
versions = ">=2.32 >=2.43"

# Layout follows the peipkg payload spec (PSD-009 §3.4): Peios is usrmerged and
# namespaces arch-specific files under /usr/lib/<triplet>. glibc bakes these
# paths into the loader and its artifacts, so the layout MUST be set at configure
# time — a packaging-glob remap would relocate the files but leave the baked-in
# paths pointing at /lib64, yielding a broken libc. Mapping:
#   libdir / libexecdir / slibdir / rtlddir -> /usr/lib/x86_64-linux-peios
#   sbindir / rootsbindir                    -> /usr/bin  (usrmerge: no sbin)
# gconv/ and audit/ modules follow libdir automatically. --disable-werror keeps
# the build robust across the version range (modern gcc warns on older sources).
[build.main]
command = """
SRC="$(pwd)"
for tool in makeinfo msgfmt debugedit; do
  command -v "$tool" >/dev/null || { echo "missing required glibc build tool: $tool" >&2; exit 1; }
done
cd "$PEKIT_OUT"
# Hardening is requested through glibc's own switches rather than flags — see
# the [env] note above. --enable-cet is the matching in-library half of
# -fcf-protection (Intel CET/IBT): the flag emits the landing pads, this makes
# the loader and the library's own asm honour them.
#
# --enable-kernel=6.12 raises the minimum supported kernel from glibc's default
# of 3.2.0 (2012), dropping the runtime fallbacks it otherwise keeps for every
# syscall added since. In 2.43 that is 51 conditional sites in the Linux
# sysdeps, with feature gates at 3.19, 4.0, 4.4, 5.1, 5.3, 5.4, 5.8, 5.9, 5.14,
# 6.0 and 6.6 — all of which a floor at or above 6.6 clears.
#
# 6.12 rather than 6.6 because it is the current LTS and leaves headroom as
# glibc adds gates; the two are equivalent in what they unlock today.
#
# What this actually constrains: a glibc built with this floor REFUSES TO START
# on an older kernel ("FATAL: kernel too old"). Peios binaries run on the Peios
# kernel (Linux 7.x base) and, during builds, on the build-farm host — rung 1
# and rung 2 both execute under docker/bwrap on the host kernel. So this is in
# effect "the oldest build-farm host we support", not just a Peios-runtime
# floor. Raise it only alongside that expectation.
#
# --disable-nscd drops the Name Service Cache Daemon, as Arch does and as
# Fedora does by shipping no nscd subpackage. It is the stronger of glibc's two
# switches: --disable-build-nscd merely stops building the daemon, while this
# also builds a C library that NEVER ATTEMPTS TO CONTACT nscd — so every NSS
# lookup loses a socket connect to a daemon that was never going to answer.
#
# It has no purpose on Peios. nscd exists to amortise expensive identity
# lookups against NIS/LDAP directories, and Peios identity is KACS SIDs with no
# /etc/passwd to cache; nscd's remaining value would be its hosts cache, which
# belongs in a resolver. Set against that, it is a persistent root daemon
# holding a shared mutable cache with a long history of serving stale entries.
"$SRC/configure" --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios --libexecdir=/usr/lib/x86_64-linux-peios --disable-werror \
  --enable-stack-protector=strong --enable-bind-now --enable-fortify-source --enable-cet \
  --enable-kernel=6.12 --disable-nscd \
  CC="gcc -Wl,--build-id" libc_cv_slibdir=/usr/lib/x86_64-linux-peios libc_cv_rtlddir=/usr/lib/x86_64-linux-peios
# glibc installs ldconfig/sln to rootsbindir (/sbin) and nscd/zic/iconvconfig to
# sbindir (/usr/sbin). usrmerge wants them all in /usr/bin, and glibc honors these
# two dirs via configparms — NOT the autoconf --sbindir flag — so set both here.
echo 'rootsbindir=/usr/bin' > configparms
echo 'sbindir=/usr/bin' >> configparms
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
# Post-install: scrub build paths from the DWARF, split debug out (build-id
# indexed), strip the binaries (~5x smaller), and stage the referenced sources.
# Per ELF: debugedit rewrites the build-tree comp_dir prefix ($ROOT) to a stable
# /usr/src/debug/glibc (otherwise the .debug leak the builder's homedir — same
# class of leak as rpath — and source paths don't resolve on a target) and lists
# the sources it references; objcopy then splits the clean DWARF into
# /usr/lib/debug/.build-id/ and strip removes it. Build-id notes come from the
# toolchain (Debian's gcc defaults to --build-id; under nix it was NIX_LDFLAGS). Static archives (*.a) just get --strip-debug
# (keeps the symtab so they still link; DWARF discarded, since archive members
# have no build-id to index — like Fedora's brp-strip-static-archive); *.o and
# non-ELF files are left alone. Then the referenced sources are copied under
# /usr/src/debug/glibc. (glibc-debuginfo packages /usr/lib/debug;
# glibc-debugsource packages /usr/src/debug.)
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  debugedit -b "$ROOT" -d /usr/src/debug/glibc -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$ROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/glibc/$(dirname "$rel")"
  cp "$ROOT/$rel" "usr/src/debug/glibc/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""

# Build deps. glibc is autotools (gcc + make) but pulls in a wider host set than
# the bignums: bison (parser gen), gawk (its scripts need GNU awk specifically),
# python3 + perl (build scripts), texinfo (makeinfo — checked at build start),
# gettext (msgfmt — also checked), and the Linux UAPI headers (linux-libc-dev /
# kernel-headers, which the compiler wrapper supplies). The debug split uses
# debugedit (no patchelf — glibc scrubs no libtool rpath).
[build.main.dependencies.peipkg]
build-essentials-c = "*"
bash = "*"
bison = "*"
python3 = "*"
perl = "*"
texinfo = "*"
gettext = "*"
kernel-headers = "*"
gzip = "*"

[build.main.dependencies.apt]
build-essential = "*"
bison = "*"
gawk = "*"
python3 = "*"
perl = "*"
texinfo = "*"
gettext = "*"
debugedit = "*"
linux-libc-dev = "*"
gzip = "*"

# Compiled locale data, kept out of the main build (locale compilation is slow
# and bulky). needs = ["main"] orders this after main and exposes its output dir
# as $PEKIT_MAIN_OUT, so we reuse main's already-built localedef instead of
# recompiling glibc — run it from main's build dir, staging into this build's OUT.
# install-locale-files emits PER-LOCALE DIRECTORIES (localedef --no-archive
# --no-hard-links: .../locale/de_DE.utf8/, etc.) so each langpack can glob one
# language; install-locales would instead emit a single monolithic locale-archive.
[build.locale]
needs = ["main"]
command = """
make -C "$PEKIT_MAIN_OUT" -j"$(nproc)" localedata/install-locale-files DESTDIR="$PEKIT_OUT"
"""

# Build deps. Re-runs make in main's already-configured glibc tree to compile the
# per-locale data with the localedef built there — needs the same gcc + make.
[build.locale.dependencies.peipkg]
build-essentials-c = "*"

[build.locale.dependencies.apt]
build-essential = "*"
