# glibc — runtime package: the dynamic loader, versioned shared libraries, the
# core programs, and the gconv loadable modules. Shared metadata
# (format/version/arch/license/homepage) is inherited from the bare
# package.pekit.toml; only the description and file set live here.
#
# Sibling packages carve out the rest of the build:
#   glibc-devel    headers, dev .so symlinks, crt*.o, libc_nonshared.a
#   glibc-static   static *.a archives
#   glibc-utils    profiling/tracing tools + their preload/audit modules
#   glibc-locales  locale source + message catalogs (noarch)
#
# ":" = the default "main:" build. Mapping dest semantics: a glob source ("**",
# "*.so.*") maps to a DIRECTORY; an exact-file source maps to a FULL path.

[package]
description = "GNU C Library - shared libraries and dynamic loader"

[files]
# All programs — usrmerge folds the former sbin tools (ldconfig, nscd, zic, ...)
# into /usr/bin. The profiling/tracing utilities are split into glibc-utils via
# the exclude list below.
":usr/bin/**"                          = "usr/bin"
# Versioned shared libraries (*.so.N) + the dynamic loader. The unversioned dev
# symlinks (*.so) are glibc-devel's; the static *.a are glibc-static's.
":usr/lib/x86_64-linux-peios/*.so.*"   = "usr/lib/x86_64-linux-peios"
# gconv charset-conversion modules, loaded at runtime by iconv. (The audit/
# module and the libmemusage.so/libpcprofile.so shims are glibc-utils'.)
":usr/lib/x86_64-linux-peios/gconv/**" = "usr/lib/x86_64-linux-peios/gconv"
# RPC program-number database (runtime data). /etc/ld.so.cache is omitted —
# host-specific, rebuilt by `ldconfig` post-install.
":etc/rpc"                             = "etc/rpc"
# nss_db generation Makefile, relocated out of /var/db (the spec forbids
# populated /var content); it's an admin template, not runtime state.
":var/db/Makefile"                     = "usr/share/glibc/db/Makefile"

# Programs claimed by sibling packages — glibc-utils (profiling/tracing tools)
# and glibc-nscd (the daemon); drop them from usr/bin/** so they aren't
# double-claimed.
exclude = [
  ":usr/bin/mtrace",
  ":usr/bin/nscd",
  ":usr/bin/pcprofiledump",
  ":usr/bin/pldd",
  ":usr/bin/sotruss",
  ":usr/bin/sprof",
  ":usr/bin/xtrace",
]
