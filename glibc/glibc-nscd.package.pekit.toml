# glibc-nscd — the name service cache daemon. Split out of the runtime so a
# minimal system needn't carry it (nscd is increasingly displaced by other nss
# caching mechanisms). It's a program linked against the runtime, so it depends
# on glibc (>= the build version; newer glibc stays backward-compatible).
#
# glibc's `make install` ships only the binary — no seed nscd.conf — so that's
# all this package carries. Inherits base metadata (x86_64).

[package]
description = "GNU C Library - name service cache daemon"

[dependencies]
glibc = ">= {{version}}"

[files]
":usr/bin/nscd" = "usr/bin/nscd"
