# glibc-langpack-<lang> — compiled, per-language locale data (arch-specific).
#
# One package is generated per language present in the "locale" build output:
# [multipack] lists the per-locale dirs, captures the language code (regex group
# 1), dedupes, and emits a package per unique code. `suffix` appends "-<code>" to
# this file's base name (glibc-langpack), giving glibc-langpack-de,
# glibc-langpack-fr, ...; {{multipack}} holds the code in the fields below.
#
# Inherits base metadata, including architecture = x86_64: compiled locale data
# is native-endian binary, so NOT noarch. The locale SOURCE definitions and the
# message catalogs live in the noarch glibc-locale-source.

[multipack]
enum.files.path  = "locale:usr/lib/x86_64-linux-peios/locale/*"
enum.files.regex = '^([a-z]+)_'
suffix           = "-{{multipack}}"

[package]
description = "GNU C Library - {{multipack}} locale data"

[dependencies]
# Compiled locale data is loaded by glibc at runtime and its binary format is
# tied to the glibc that produced it, so pin the matching upstream glibc (the
# operand omits the revision, so any revision of that upstream satisfies it).
glibc = "{{version}}"

[files]
# Every locale for this language (de_DE, de_DE.utf8, de_AT, ...) and its LC_*
# files, taken from the locale build.
"locale:usr/lib/x86_64-linux-peios/locale/{{multipack}}_*/**" = "usr/lib/x86_64-linux-peios/locale"
