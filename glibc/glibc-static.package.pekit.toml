# glibc-static — static archive libraries (*.a) for static linking. Inherits
# base metadata; depends on glibc-devel for the headers, crt objects, and
# libc_nonshared.a that static linking also needs.

# libc_nonshared.a and the merged-lib compat archives (-lrt/-lpthread/... )
# are needed for dynamic linking, so they live in glibc-devel; exclude them
# here to avoid double-claiming.
excludes = [
  ":usr/lib/x86_64-linux-peios/libc_nonshared.a",
  ":usr/lib/x86_64-linux-peios/libanl.a",
  ":usr/lib/x86_64-linux-peios/libdl.a",
  ":usr/lib/x86_64-linux-peios/libg.a",
  ":usr/lib/x86_64-linux-peios/libpthread.a",
  ":usr/lib/x86_64-linux-peios/librt.a",
  ":usr/lib/x86_64-linux-peios/libutil.a",
]

[package]
description = "GNU C Library - static libraries"

[dependencies]
glibc-devel = "{{version}}"

[files]
":usr/lib/x86_64-linux-peios/*.a" = "usr/lib/x86_64-linux-peios/"
