# glibc-utils — optional profiling, tracing, and debugging tools that ship with
# glibc but aren't needed for normal operation (mtrace, xtrace, sotruss, sprof,
# pcprofiledump, pldd), plus the LD_PRELOAD/LD_AUDIT modules they use. Inherits
# base metadata.

[package]
description = "GNU C Library - profiling and tracing utilities"

[dependencies]
# These are programs/modules linked against the runtime; they need at least the
# glibc they were built against (newer glibc stays backward-compatible), so use a
# >= bound rather than the exact pin glibc-devel uses. The operand omits the
# peios revision (§2.2.8), matching any revision at or above that upstream.
glibc = ">= {{version}}"

[files]
# Tools (each an exact-file map, so the dest is the full path).
":usr/bin/mtrace"        = "usr/bin/mtrace"
":usr/bin/pcprofiledump" = "usr/bin/pcprofiledump"
":usr/bin/pldd"          = "usr/bin/pldd"
":usr/bin/sotruss"       = "usr/bin/sotruss"
":usr/bin/sprof"         = "usr/bin/sprof"
":usr/bin/xtrace"        = "usr/bin/xtrace"
# LD_PRELOAD profiling shims.
":usr/lib/x86_64-linux-peios/libmemusage.so"  = "usr/lib/x86_64-linux-peios/libmemusage.so"
":usr/lib/x86_64-linux-peios/libpcprofile.so" = "usr/lib/x86_64-linux-peios/libpcprofile.so"
# LD_AUDIT module used by sotruss.
":usr/lib/x86_64-linux-peios/audit/**" = "usr/lib/x86_64-linux-peios/audit"
