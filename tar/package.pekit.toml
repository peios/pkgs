format = "peipkg"

[package]
name         = "tar"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU tar - the tape/file archiver"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/tar/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING"   = "usr/share/licenses/tar/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
