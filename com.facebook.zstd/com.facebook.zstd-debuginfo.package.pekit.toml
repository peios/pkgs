[package]
name        = "com.facebook.zstd-debuginfo"
description = "Zstandard command and library debugging symbols"
license     = "MIT AND (BSD-3-Clause OR GPL-2.0-only)"

[dependencies]
"com.facebook.zstd"       = "{{version}}-1"
"com.facebook.zstd-libs"  = "{{version}}-1"
"com.facebook.zstd-pzstd" = "{{version}}-1"

[files]
"@source:LICENSE"                      = "usr/share/licenses/com.facebook.zstd-debuginfo/LICENSE"
"@source:lib/dictBuilder/divsufsort.c" = "usr/share/licenses/com.facebook.zstd-debuginfo/LICENSE.divsufsort"
":usr/lib/debug/**"                    = "usr/lib/debug"
