side_effects = ["man-db"]

[package]
name        = "com.facebook.zstd"
description = "Zstandard compression and decompression tools"
license     = "MIT AND (BSD-3-Clause OR GPL-2.0-only)"

[provides]

[replaces]

[dependencies]
"org.gnu.glibc"                                      = ">= 2.43"
"com.facebook.zstd-common"                = "{{version}}-2"
"io.github.zlib-ng.zlib-ng-compat"        = "*"
"org.tukaani.xz-libs"                     = "*"

[files]
"@source:LICENSE"                      = "usr/share/licenses/com.facebook.zstd/LICENSE"
"@source:lib/dictBuilder/divsufsort.c" = "usr/share/licenses/com.facebook.zstd/LICENSE.divsufsort"
":usr/bin/zstd"                        = "usr/bin/zstd"
":usr/bin/unzstd"                      = "usr/bin/unzstd"
":usr/bin/zstdcat"                     = "usr/bin/zstdcat"
":usr/bin/zstdmt"                      = "usr/bin/zstdmt"
":usr/share/man/man1/zstd.1.gz"        = "usr/share/man/man1/zstd.1.gz"
":usr/share/man/man1/unzstd.1.gz"      = "usr/share/man/man1/unzstd.1.gz"
":usr/share/man/man1/zstdcat.1.gz"     = "usr/share/man/man1/zstdcat.1.gz"
":usr/share/man/man1/zstdmt.1.gz"      = "usr/share/man/man1/zstdmt.1.gz"
