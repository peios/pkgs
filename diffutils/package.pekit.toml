format = "peipkg"

[package]
name         = "diffutils"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU diffutils - file comparison utilities"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/diffutils/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING*" = "usr/share/licenses/diffutils/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
