# The source repository owns the port, build, tests and package definitions.
out_dir = "out"
delegate = true
[source.git]
url = "https://github.com/peios/openssh.git"
ref = "v{{version}}"
versions = ">= 10.5.1"
# Upstream OpenSSH X.YpZ is vX.Y.Z; a fourth component counts Peios's own
# releases on that base (v10.5.1.1, v10.5.1.2), and sorts below the next
# upstream release.
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)$'
[source.local]
path = "../../openssh"
