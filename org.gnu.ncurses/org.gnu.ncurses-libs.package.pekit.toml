[package]
name        = "org.gnu.ncurses-libs"
description = "ncurses wide-character terminal runtime libraries"

[provides]
libncurses          = "{{version}}-3"
"libformw.so.6"    = "{{version}}-3"
"libmenuw.so.6"    = "{{version}}-3"
"libncursesw.so.6" = "{{version}}-3"
"libpanelw.so.6"   = "{{version}}-3"
"libtic.so.6"      = "{{version}}-3"
"libtinfo.so.6"    = "{{version}}-3"

[replaces]
libncurses = "<= {{version}}-2"

[dependencies]
glibc                       = ">= 2.43"
"org.gnu.ncurses-terminfo" = "{{version}}-3"

[files]
"@source:COPYING"                              = "usr/share/licenses/org.gnu.ncurses-libs/COPYING"
":usr/lib/x86_64-linux-peios/libncursesw.so.6*" = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libpanelw.so.6*"   = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libmenuw.so.6*"    = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libformw.so.6*"    = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libtinfo.so.6*"    = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libtic.so.6*"      = "usr/lib/x86_64-linux-peios"
