[package]
name        = "org.gnu.ncurses-static"
description = "ncurses static libraries"

[provides]
"ncurses-static" = "{{version}}-3"

[dependencies]
"org.gnu.ncurses-devel" = "{{version}}-3"

[files]
"@source:COPYING" = "usr/share/licenses/org.gnu.ncurses-static/COPYING"
":usr/lib/x86_64-linux-peios/*.a" = "usr/lib/x86_64-linux-peios"
