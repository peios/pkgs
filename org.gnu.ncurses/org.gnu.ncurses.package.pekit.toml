side_effects = ["man-db"]

[package]
name        = "org.gnu.ncurses"
description = "ncurses terminal-information utilities"

[provides]
ncurses = "{{version}}"

[dependencies]
glibc                   = ">= 2.43"
"org.gnu.ncurses-libs" = "{{version}}-1"

[files]
":usr/bin/captoinfo" = "usr/bin/captoinfo"
":usr/bin/clear"     = "usr/bin/clear"
":usr/bin/infocmp"   = "usr/bin/infocmp"
":usr/bin/infotocap" = "usr/bin/infotocap"
":usr/bin/reset"     = "usr/bin/reset"
":usr/bin/tabs"      = "usr/bin/tabs"
":usr/bin/tic"       = "usr/bin/tic"
":usr/bin/toe"       = "usr/bin/toe"
":usr/bin/tput"      = "usr/bin/tput"
":usr/bin/tset"      = "usr/bin/tset"
":usr/share/man/man1/captoinfo.1.gz" = "usr/share/man/man1/captoinfo.1.gz"
":usr/share/man/man1/clear.1.gz"     = "usr/share/man/man1/clear.1.gz"
":usr/share/man/man1/infocmp.1.gz"   = "usr/share/man/man1/infocmp.1.gz"
":usr/share/man/man1/infotocap.1.gz" = "usr/share/man/man1/infotocap.1.gz"
":usr/share/man/man1/reset.1.gz"     = "usr/share/man/man1/reset.1.gz"
":usr/share/man/man1/tabs.1.gz"      = "usr/share/man/man1/tabs.1.gz"
":usr/share/man/man1/tic.1.gz"       = "usr/share/man/man1/tic.1.gz"
":usr/share/man/man1/toe.1.gz"       = "usr/share/man/man1/toe.1.gz"
":usr/share/man/man1/tput.1.gz"      = "usr/share/man/man1/tput.1.gz"
":usr/share/man/man1/tset.1.gz"      = "usr/share/man/man1/tset.1.gz"
":usr/share/man/man5/**"            = "usr/share/man/man5"
":usr/share/man/man7/**"            = "usr/share/man/man7"
