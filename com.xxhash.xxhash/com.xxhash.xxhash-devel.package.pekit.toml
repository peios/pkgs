[package]
name        = "com.xxhash.xxhash-devel"
description = "xxHash headers, linker input, and pkg-config metadata"
license     = "BSD-2-Clause"

[provides]
"xxhash-devel" = "{{version}}-1"

[replaces]
"xxhash-devel" = "<= {{version}}-1"

[dependencies]
"com.xxhash.xxhash-libs" = "{{version}}-1"

[files]
"@source:LICENSE"                                 = "usr/share/licenses/com.xxhash.xxhash-devel/"
":usr/include/**"                                 = "usr/include"
":usr/lib/x86_64-linux-peios/libxxhash.so"        = "usr/lib/x86_64-linux-peios/libxxhash.so"
":usr/lib/x86_64-linux-peios/pkgconfig/libxxhash.pc" = "usr/lib/x86_64-linux-peios/pkgconfig/libxxhash.pc"
