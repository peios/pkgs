# Shared metadata for the xxHash package family and corresponding source. The
# source tree contains the BSD library, GPL-2.0-or-later tools/tests, and two
# GPL-2.0-only sanity-vector programs.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "BSD-2-Clause AND GPL-2.0-or-later AND GPL-2.0-only"
license_class = "free"
homepage      = "https://xxhash.com/"
