# Shared metadata for the xxHash package family. Every member declares its own
# license; the corresponding source package conjoins them with the
# source-only licenses declared in pekit.toml's [source_package].

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "BSD-2-Clause AND GPL-2.0-or-later AND GPL-2.0-only"
license_class = "free"
homepage      = "https://xxhash.com/"
