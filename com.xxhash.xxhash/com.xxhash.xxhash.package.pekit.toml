# The checksum tools. They embed the BSD library implementation, while the CLI
# sources are GPL-2.0-or-later, so they need no separate xxHash runtime library.

side_effects = ["man-db"]

[package]
name        = "com.xxhash.xxhash"
description = "Extremely fast non-cryptographic checksum tools"
license     = "BSD-2-Clause AND GPL-2.0-or-later"

[dependencies]
"org.gnu.glibc" = ">= 2.43"

[files]
"@source:LICENSE"        = "usr/share/licenses/com.xxhash.xxhash/"
"@source:cli/COPYING"    = "usr/share/licenses/com.xxhash.xxhash/"
":usr/bin/**"            = "usr/bin"
":usr/share/man/man1/**" = "usr/share/man/man1"
