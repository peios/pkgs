# xxHash — the reference C implementation, shared/static library, and checksum
# tools. Upstream's Makefile is an in-tree build, so use a private staged copy
# and discard it after extracting debug sources.

out_dir = "out"

[source.git]
url       = "https://github.com/Cyan4973/xxHash.git"
ref       = "v{{version}}"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
# Soft maintenance floor. Follow stable releases automatically; exact SONAME,
# header, tool, and test gates stop publication if upstream changes contract.
versions  = ">= 0.8.3"

# Upstream publishes lightweight tags and no detached source signatures. The
# v0.8.3 tag points at a GitHub web-flow-signed merge commit, which authenticates
# GitHub's merge machinery rather than a dedicated xxHash maintainer key. This
# is an explicit authentication exception: HTTPS authenticates transport and
# Pekit's Git lock makes each accepted commit immutable, but first acceptance of
# a newly discovered tag remains TOFU until Pekit can verify signed Git release
# identities (PEI-665).

[build.main]
command = '''
set -eu
SRC="$(pwd)"
BUILD="$PEKIT_OUT/build"
PREFIX="$PEKIT_OUT/usr"
LIBDIR=/usr/lib/x86_64-linux-peios
STAGED_LIBDIR="$PEKIT_OUT$LIBDIR"

mkdir -p "$BUILD"
cp -a "$SRC/." "$BUILD/"
cd "$BUILD"

# Preserve the workspace distro flags and force the linker to emit the CET
# property note for both shipped ELF objects. DISPATCH enables runtime CPU
# selection for the CLI and shared library without tying them to the build CPU.
export CFLAGS="${CFLAGS:--O2 -g} -fcf-protection=full -fmacro-prefix-map=$SRC=/usr/src/debug/com.xxhash.xxhash"
export CXXFLAGS="${CXXFLAGS:-$CFLAGS}"
export LDFLAGS="${LDFLAGS:-} -Wl,-z,ibt,-z,shstk"

# Build the production payload once. The gated upstream suite may rebuild its
# retained build tree under compatibility flag sets after installation; those
# test-only objects cannot alter the already staged payload.
make -j"$(nproc)" DISPATCH=1 LIBXXH_DISPATCH=1
make install DESTDIR="$PEKIT_OUT" PREFIX=/usr \
  LIBDIR="$LIBDIR" MANDIR=/usr/share/man/man1 \
  DISPATCH=1 LIBXXH_DISPATCH=1

DOCDIR="$PREFIX/share/doc/com.xxhash.xxhash"
mkdir -p "$DOCDIR/doc" "$DOCDIR/cli"
install -m 0644 "$SRC/README.md" "$SRC/CHANGELOG" "$SRC/SECURITY.md" \
  "$DOCDIR/"
install -m 0644 "$SRC/doc/README.md" "$SRC/doc/xxhash_spec.md" \
  "$SRC/doc/xxhash.cry" "$DOCDIR/doc/"
install -m 0644 "$SRC/cli/README.md" "$DOCDIR/cli/"

# Build-ID-indexed symbols and the exact source files named by rewritten DWARF.
# Static code remains available but does not duplicate debug sections.
strip --strip-debug "$STAGED_LIBDIR/libxxhash.a"
cd "$PEKIT_OUT"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
: > "$PEKIT_OUT/.buildids"
for elf in usr/bin/xxhsum \
  "usr/lib/x86_64-linux-peios/libxxhash.so.$PEKIT_VERSION"; do
  patchelf --remove-rpath "$elf"
  debugedit -b "$ROOT" -d /usr/src/debug/com.xxhash.xxhash \
    -l "$PEKIT_OUT/.dl" -n "$elf"
  cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist"
  build_id=$(readelf -n "$elf" | \
    sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id"
  printf '%s\n' "$build_id" >> "$PEKIT_OUT/.buildids"
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  mkdir -p "usr/lib/debug/.build-id/$first"
  objcopy --only-keep-debug "$elf" \
    "usr/lib/debug/.build-id/$first/$rest.debug"
  chmod 0644 "usr/lib/debug/.build-id/$first/$rest.debug"
  strip "$elf"
done
tr '\0' '\n' < "$PEKIT_OUT/.srclist" | LC_ALL=C sort -u \
  | while IFS= read -r rel; do
      test -n "$rel" || continue
      case "$rel" in */) continue;; esac
      test -f "$ROOT/$rel" || continue
      mkdir -p "usr/src/debug/com.xxhash.xxhash/$(dirname "$rel")"
      cp "$ROOT/$rel" "usr/src/debug/com.xxhash.xxhash/$rel"
    done
'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.sourceware.debugedit" = "*"
"org.nixos.patchelf" = "*"

[build.main.dependencies.apt]
build-essential = "*"
debugedit       = "*"
patchelf        = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
TEST_OUT="$PEKIT_OUT"
test -x "$PEKIT_MAIN_OUT/usr/bin/xxhsum"
test -f "$PEKIT_MAIN_OUT/usr/lib/x86_64-linux-peios/libxxhash.a"
set -- "$PEKIT_MAIN_OUT"/usr/lib/x86_64-linux-peios/libxxhash.so.*
test -e "$1"

# Run the upstream release suite from the explicit package gate.
PEKIT_OUT="$PEKIT_MAIN_OUT"
cd "$PEKIT_OUT/build"
# Run upstream's complete release test target: known-answer/API sanity,
# namespace isolation, all CLI checksum/check modes, strict C90/no-XXH3/
# no-stream/no-stdlib builds, benchmark-tool compilation, and the 9.6-million-
# sample collision exercise. Also run the maintained functional targets that
# upstream reserves for its wider CI matrix. Alternate compiler, sanitizer,
# and 32-bit jobs are CI toolchain matrices rather than shipped-feature tests.
# The aggregate test target mutates shared object names between its feature
# modes and is not parallel-safe. Its collision harness also assumes a shell
# with a `time` keyword; the Peios build shell is deliberately POSIX dash, so
# remove only that non-semantic timing wrapper rather than adding a test-only
# runtime tool.
sed -i 's/^\([[:space:]]*@\)time /\1/' tests/collisions/Makefile
# filename-escape.sh prints (but does not assert on) a diagnostic byte dump
# using BSD hexdump. `od` is already in the core build root and displays the
# same bytes without adding an otherwise unused util-linux payload.
sed -i 's/hexdump -C /od -An -tx1c /' tests/filename-escape.sh
make test DISPATCH=1 LIBXXH_DISPATCH=1
LANG=C.UTF-8 make test-unicode DISPATCH=1 LIBXXH_DISPATCH=1
make test-inline test-filename-escape test-cli-comment-line \
  test-cli-ignore-missing test-xxh-nnn-sums trailingWhitespace \
  DISPATCH=1 LIBXXH_DISPATCH=1


# Freeze and exercise the exact installed contract after staging.
PEKIT_OUT="$PEKIT_MAIN_OUT"
cd "$PEKIT_OUT"
PREFIX="$PEKIT_OUT/usr"
STAGED_LIBDIR="$PEKIT_OUT/usr/lib/x86_64-linux-peios"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
WORK="$TEST_OUT/xxhash-gate"
mkdir -p "$WORK"
# Freeze the installed public surface. A future addition/removal is a package
# contract change and must be assigned deliberately rather than leaking between
# splits.
find "$PREFIX/bin" -mindepth 1 -maxdepth 1 \( -type f -o -type l \) \
  -printf '%f\n' | LC_ALL=C sort > "$WORK/actual-tools"
printf '%s\n' xxh128sum xxh32sum xxh3sum xxh64sum xxhsum | LC_ALL=C sort \
  > "$WORK/expected-tools"
diff -u "$WORK/expected-tools" "$WORK/actual-tools"

find "$PREFIX/include" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
  | LC_ALL=C sort > "$WORK/actual-headers"
printf '%s\n' xxh3.h xxh_x86dispatch.h xxhash.h | LC_ALL=C sort \
  > "$WORK/expected-headers"
diff -u "$WORK/expected-headers" "$WORK/actual-headers"

find "$STAGED_LIBDIR" -mindepth 1 -maxdepth 1 \( -type f -o -type l \) \
  -printf '%f\n' | LC_ALL=C sort > "$WORK/actual-libs"
printf '%s\n' libxxhash.a libxxhash.so libxxhash.so.0 \
  "libxxhash.so.$PEKIT_VERSION" | LC_ALL=C sort \
  > "$WORK/expected-libs"
diff -u "$WORK/expected-libs" "$WORK/actual-libs"
test "$(find "$STAGED_LIBDIR/pkgconfig" -maxdepth 1 -type f -printf '%f\n')" \
  = libxxhash.pc

find "$PREFIX/share/man/man1" -mindepth 1 -maxdepth 1 \
  \( -type f -o -type l \) -printf '%f\n' | LC_ALL=C sort \
  > "$WORK/actual-man"
printf '%s\n' xxh128sum.1 xxh32sum.1 xxh3sum.1 xxh64sum.1 xxhsum.1 \
  | LC_ALL=C sort > "$WORK/expected-man"
diff -u "$WORK/expected-man" "$WORK/actual-man"

test "$(readlink "$PREFIX/bin/xxh32sum")" = xxhsum
test "$(readlink "$PREFIX/bin/xxh64sum")" = xxhsum
test "$(readlink "$PREFIX/bin/xxh128sum")" = xxhsum
test "$(readlink "$PREFIX/bin/xxh3sum")" = xxhsum
test "$(readlink "$STAGED_LIBDIR/libxxhash.so.0")" = \
  "libxxhash.so.$PEKIT_VERSION"
test "$(readlink "$STAGED_LIBDIR/libxxhash.so")" = \
  "libxxhash.so.$PEKIT_VERSION"

XXHASH_SO="$STAGED_LIBDIR/libxxhash.so.$PEKIT_VERSION"
readelf -d "$XXHASH_SO" | grep -F 'Library soname: [libxxhash.so.0]'
readelf --dyn-syms -W "$XXHASH_SO" | grep -E ' XXH_versionNumber$'
readelf --dyn-syms -W "$XXHASH_SO" | grep -E ' XXH3_64bits$'

export PKG_CONFIG_LIBDIR="$STAGED_LIBDIR/pkgconfig"
export PKG_CONFIG_SYSROOT_DIR="$PEKIT_OUT"
pkgconf --validate libxxhash
test "$(pkgconf --modversion libxxhash)" = "$PEKIT_VERSION"
pkgconf --libs libxxhash | grep -Eq '(^|[[:space:]])-lxxhash([[:space:]]|$)'

# Exercise all installed CLI aliases and checksum verification against fixed
# vectors, then compile and run the installed API in shared, static, and
# header-only modes.
SMOKE="$WORK/smoke"
mkdir -p "$SMOKE"
printf peios > "$SMOKE/input"
"$PREFIX/bin/xxhsum" "$SMOKE/input" | grep -F '8c1065b7c24ca2fe'
"$PREFIX/bin/xxh32sum" "$SMOKE/input" | grep -F '7bab2596'
"$PREFIX/bin/xxh64sum" "$SMOKE/input" | grep -F '8c1065b7c24ca2fe'
"$PREFIX/bin/xxh128sum" "$SMOKE/input" | \
  grep -F '7988f28f07ebd67d7577bd199952e04f'
"$PREFIX/bin/xxh3sum" "$SMOKE/input" | grep -F 'XXH3_1ebc22da73dee45d'
"$PREFIX/bin/xxhsum" "$SMOKE/input" > "$SMOKE/checksums"
"$PREFIX/bin/xxhsum" --check "$SMOKE/checksums"

cat > "$SMOKE/api.c" <<'EOF'
#include <stdint.h>
#include <string.h>
#include <xxhash.h>

int main(void)
{
  static const char input[] = "peios";
  XXH128_hash_t h;
  if (XXH_versionNumber() != EXPECTED_XXH_VERSION) return 1;
  if (XXH32(input, 5, 0) != UINT32_C(0x7bab2596)) return 2;
  if (XXH64(input, 5, 0) != UINT64_C(0x8c1065b7c24ca2fe)) return 3;
  if (XXH3_64bits(input, 5) != UINT64_C(0x1ebc22da73dee45d)) return 4;
  h = XXH3_128bits(input, 5);
  if (h.high64 != UINT64_C(0x7988f28f07ebd67d) ||
      h.low64 != UINT64_C(0x7577bd199952e04f)) return 5;
  return 0;
}
EOF
OLD_IFS=$IFS
IFS=.
set -- $PEKIT_VERSION
IFS=$OLD_IFS
test "$#" -eq 3
EXPECTED_XXH_VERSION=$(($1 * 10000 + $2 * 100 + $3))
cc -DEXPECTED_XXH_VERSION="$EXPECTED_XXH_VERSION" \
  "$SMOKE/api.c" -I"$PREFIX/include" -L"$STAGED_LIBDIR" \
  -Wl,-rpath-link,"$STAGED_LIBDIR" -lxxhash -o "$SMOKE/shared"
LD_LIBRARY_PATH="$STAGED_LIBDIR" "$SMOKE/shared"
cc -DEXPECTED_XXH_VERSION="$EXPECTED_XXH_VERSION" \
  "$SMOKE/api.c" -I"$PREFIX/include" "$STAGED_LIBDIR/libxxhash.a" \
  -o "$SMOKE/static"
"$SMOKE/static"
sed '1i#define XXH_INLINE_ALL' "$SMOKE/api.c" > "$SMOKE/header-only.c"
cc -DEXPECTED_XXH_VERSION="$EXPECTED_XXH_VERSION" \
  "$SMOKE/header-only.c" -I"$PREFIX/include" -o "$SMOKE/header-only"
"$SMOKE/header-only"

# Enforce the final Peios ELF and runtime-dependency contract. The CLI embeds
# xxHash instead of linking the shared library; both shipped objects need only
# libc and must retain full RELRO, RELR, NX stack, CET, and no path leakage.
for elf in usr/bin/xxhsum \
  "usr/lib/x86_64-linux-peios/libxxhash.so.$PEKIT_VERSION"; do
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -W -l "$elf" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -W -l "$elf" | grep -F 'GNU_RELRO'
  readelf -d "$elf" | grep -F 'BIND_NOW'
  readelf -d "$elf" | grep -F 'RELR'
  readelf -n "$elf" | grep -E 'x86 feature:.*IBT.*SHSTK'
  test "$(readelf -d "$elf" | grep -c 'Shared library:')" -eq 1
  readelf -d "$elf" | grep -F 'Shared library: [libc.so.6]'
  if readelf -d "$elf" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
  if strings "$elf" | grep -F "$ROOT"; then exit 1; fi
done
if readelf -d usr/bin/xxhsum | grep -Fq 'libxxhash.so'; then exit 1; fi

test "$(LC_ALL=C sort -u "$PEKIT_OUT/.buildids" | wc -l)" -eq 2
test "$(find usr/lib/debug/.build-id -type f -name '*.debug' | wc -l)" -eq 2
test -n "$(find usr/src/debug/com.xxhash.xxhash -type f -print -quit)"
for dbg in $(find usr/lib/debug/.build-id -type f -name '*.debug'); do
  readelf -S "$dbg" | grep -F '.debug_info'
done

rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist" "$PEKIT_OUT/.buildids"
rm -rf "$WORK" "$PEKIT_MAIN_OUT/build"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.pkgconf.pkgconf" = "*"

[test.dependencies.apt]
build-essential = "*"
pkgconf         = "*"
