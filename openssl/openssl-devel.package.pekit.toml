# openssl-devel — headers, the lib links, and pkg-config metadata for
# building against libcrypto/libssl (the kernel's sign-file/extract-cert
# compile against these).

[package]
name        = "openssl-devel"
description = "OpenSSL - libcrypto/libssl headers and link libraries"

[dependencies]
libssl = "{{version}}"

[files]
":usr/include/**"                             = "usr/include"
":usr/lib/x86_64-linux-peios/libcrypto.so"    = "usr/lib/x86_64-linux-peios/libcrypto.so"
":usr/lib/x86_64-linux-peios/libssl.so"       = "usr/lib/x86_64-linux-peios/libssl.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**"    = "usr/lib/x86_64-linux-peios/pkgconfig"
