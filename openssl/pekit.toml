# openssl — the OpenSSL toolkit; kernel module signing (scripts/sign-file,
# certs/extract-cert link libcrypto) feeds on it, kmod's --with-openssl and
# elfutils' debuginfod re-enable against it later (PEI-158).
#
# PEI-158 kernel-tooling leaf: perl-driven Configure (our perl), built
# out-of-source (openssl supports a separate build dir natively). Pinned to
# the 3.5 LTS series (supported to 2030): the pkm container's Debian
# snapshot builds the kernel against 3.5.x, so the first kernel attempt
# stays on a known-good libcrypto — the 4.0 bump (engine API removal) is a
# separate decision. no-tests skips the large test build; install_sw skips
# the doc tree (no pod2man churn); install_ssldirs is skipped too — no
# /etc/ssl in the seed, and the kernel's signing flow always passes its own
# -config, so nothing here reads a default openssl.cnf. Static libs
# dropped (house style); the c_rehash perl convenience is dropped
# (undeclared runtime dep).

out_dir = "out"

[source.url]
url      = "https://github.com/openssl/openssl/releases/download/openssl-{{version}}/openssl-{{version}}.tar.gz"
extract  = true
root     = "openssl-{{version}}"
versions = ">= 3.5, < 3.6"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
perl "$SRC/Configure" linux-x86_64 shared no-tests \
  --prefix=/usr --libdir=lib/x86_64-linux-peios --openssldir=/etc/ssl
make -j"$(nproc)"
make install_sw DESTDIR="$PEKIT_OUT"
rm -f "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libssl.a" \
  "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libcrypto.a"
rm -f "$PEKIT_OUT/usr/bin/c_rehash"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"
perl = "*"

[build.main.dependencies.apt]
build-essential = "*"
perl = "*"
