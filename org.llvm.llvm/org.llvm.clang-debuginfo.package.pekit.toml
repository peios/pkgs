[package]
name        = "org.llvm.clang-debuginfo"
description = "Clang compiler and tool debugging symbols"

[dependencies]
"org.llvm.clang" = "{{version}}-2"

[files]
"@source:clang/LICENSE.TXT" = "usr/share/licenses/org.llvm.clang-debuginfo/LICENSE.TXT"
":.debuginfo/clang/usr/lib/debug/**" = "usr/lib/debug"
