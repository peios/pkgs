# clang — the C/C++ compiler (the kernel's CC under LLVM=1), its tools,
# and the resource headers (stdarg.h & co) the driver hands every compile.
# The libclang-cpp and libclang shared libraries are in clang-libs; their
# unversioned links (clang-sys dlopens "libclang.so") are in clang-devel.

[package]
name        = "org.llvm.clang"
description = "C, C++, and Objective-C compiler"

[provides]

[replaces]

[dependencies]
# Hosted C/C++ defaults need startup objects, libc SDK, and libstdc++ headers.
"org.gnu.gcc" = ">= 16"
"org.gnu.gcc-libstdc++-devel" = ">= 16"
"org.llvm.llvm"       = "= {{release}}"
"org.llvm.clang-libs" = "= {{release}}"

[files]
"@source:clang/LICENSE.TXT" = "usr/share/licenses/org.llvm.clang/LICENSE.TXT"
":usr/bin/clang*"   = "usr/bin"
":usr/bin/c-index-test" = "usr/bin/c-index-test"
":usr/bin/diagtool"     = "usr/bin/diagtool"
":usr/lib/x86_64-linux-peios/clang/**"      = "usr/lib/x86_64-linux-peios/clang"

":.manuals/clang/usr/share/man/**" = "usr/share/man"
