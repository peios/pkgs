[package]
name        = "org.llvm.llvm-static"
description = "Complete LLVM, Clang and LLD development SDKs"
architecture = "noarch"
license     = "(Apache-2.0 WITH LLVM-exception) AND (CC0-1.0 OR Apache-2.0)"

[dependencies]
"org.llvm.llvm-devel"  = "{{version}}-1"
"org.llvm.clang-devel" = "{{version}}-1"
"org.llvm.lld-devel"   = "{{version}}-1"

[files]
"@source:llvm/LICENSE.TXT" = "usr/share/licenses/org.llvm.llvm-static/LICENSE.TXT"
"@source:llvm/lib/Support/BLAKE3/LICENSE" = "usr/share/licenses/org.llvm.llvm-static/BLAKE3-LICENSE"
