# GNU Bison — parser generator and yacc-compatible frontend. GCC, glibc and
# several system libraries use it to regenerate parsers during native builds.
#
# The signed GNU release tarball is intentionally used rather than a Git
# checkout: it carries the generated build system and parser sources needed to
# avoid a bootstrap dependency on Bison itself.

out_dir = "out"

# Compatibility fixes already carried by Fedora: correct the C++ GLR skeleton's
# parallel-stack bookkeeping under GCC 15 assertions and mark the generated
# error counter unused for GCC 16. Both patches are upstream-facing and can be
# dropped once the next Bison release supersedes 3.8.2.
[source]
patches = "patches"

[source.url]
url         = "https://ftp.gnu.org/gnu/bison/bison-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/bison/"
extract     = true
root        = "bison-{{version}}"
file_regex = 'bison-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor: unattended sweeps accept every newer stable GNU
# release. Older history is intentionally outside routine publication.
versions   = ">= 3.8.2"

# GNU publishes detached signatures beside its stable release archives. The
# pinned key is Akim Demaille's primary key, matching GNU and Fedora's release
# verification identity for 3.8.2.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/akim-demaille.asc"]
fingerprints = ["7DF84374B1EE1F9764BBE25D0DDCAA3278D5264E"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
cd "$PEKIT_OUT"

"$SRC/configure" \
  --prefix=/usr \
  --bindir=/usr/bin \
  --libdir=/usr/lib/x86_64-linux-peios \
  --mandir=/usr/share/man
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"

# Peios is /usr-native and deliberately has no legacy /bin alias. Upstream's
# generated yacc frontend retains a /bin/sh shebang, so normalize it to the
# shell path supplied by the declared dash runtime dependency.
sed -i '1s|^#! /bin/sh$|#!/usr/bin/sh|' "$PEKIT_OUT/usr/bin/yacc"

# Peios does not yet ship an Info reader. Keep the command manuals and Autoconf
# macros, which are live developer interfaces, while dropping orphaned docs.
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"

# Distribution debug split: scrub build paths, index detached symbols by GNU
# build ID, strip the runtime, and retain precisely the referenced sources.
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  patchelf --remove-rpath "$f" 2>/dev/null || true
  patchelf --remove-needed ld-linux-x86-64.so.2 "$f" 2>/dev/null || true
  debugedit -b "$ROOT" -d /usr/src/debug/org.gnu.bison -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$ROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/org.gnu.bison/$(dirname "$rel")"
  cp "$ROOT/$rel" "usr/src/debug/org.gnu.bison/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
# The upstream suite exercises generated scanners and Autoconf integration.
"io.github.westes.flex" = "*"
"org.gnu.autoconf" = ">= 2.72"
# Bison invokes m4 both while building and when generating parsers.
"org.gnu.m4" = ">= 1.4"
# Native-language catalog generation.
"org.gnu.gettext" = "*"

[build.main.dependencies.apt]
build-essential = "*"
flex = "*"
autoconf = ">= 2.72"
m4 = ">= 1.4"
gettext = "*"
debugedit = "*"
patchelf = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# Exercise the shipped C, C++ and GLR skeletons. Optional language integrations
# skip when their toolchains are absent; the native C/C++ cases are mandatory.
cd "$PEKIT_MAIN_OUT"
make -j"$(nproc)" check
BISON="$PEKIT_MAIN_OUT/usr/bin/bison"
STAGE="$PEKIT_MAIN_OUT"
SMOKE="$PEKIT_OUT/bison-test"
mkdir -p "$SMOKE"
export BISON_PKGDATADIR="$STAGE/usr/share/bison"
printf '%s\n' \
  '%{' \
  'int yylex(void);' \
  'void yyerror(const char *message);' \
  '%}' \
  '%%' \
  'input: %empty ;' \
  '%%' \
  'int yylex(void) { return 0; }' \
  'void yyerror(const char *message) { (void) message; }' \
  'int main(void) { return yyparse(); }' > "$SMOKE/parser.y"
"$BISON" --warnings=error -d -o "$SMOKE/parser.c" "$SMOKE/parser.y"
cc -o "$SMOKE/parser" "$SMOKE/parser.c"
"$SMOKE/parser"
head -1 "$STAGE/usr/bin/yacc" | grep -Fx '#!/usr/bin/sh'
grep -F 'exec "$bindir/bison" -y' "$STAGE/usr/bin/yacc"
"$BISON" -y -d -o "$SMOKE/yacc-parser.c" "$SMOKE/parser.y"
cc -o "$SMOKE/yacc-parser" "$SMOKE/yacc-parser.c"
"$SMOKE/yacc-parser"
"$BISON" --version | head -1 | grep -F "$PEKIT_VERSION"
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"io.github.westes.flex" = "*"
"org.gnu.autoconf" = ">= 2.72"
"org.git.kernel.dash" = "*"
"org.gnu.m4" = "*"
"org.gnu.gettext" = "*"
"org.sourceware.debugedit" = "*"
"org.nixos.patchelf" = "*"

[test.dependencies.apt]
build-essential = "*"
flex = "*"
autoconf = ">= 2.72"
dash = "*"
m4 = "*"
gettext = "*"
debugedit = "*"
patchelf = "*"
