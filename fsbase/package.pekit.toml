# Base metadata shared by the fsbase packages. Each <name>.package.pekit.toml
# (fsbase, fsbase-irf, fsbase-stratafs-mount-hooks) inherits these fields and
# adds its own description and files.
#
# The two skeletons are pure — their payloads are the empty directories the
# recipe's build mints, carved into two subsets. The hooks package is the
# exception that made this recipe stop being source-free: it ships a script
# from src/, and it lives here because what it mounts has to agree with what
# fsbase-irf mints.
#
# x86_64, not noarch: both carry the tuple-named directories
# usr/lib/x86_64-linux-peios and usr/include/x86_64-linux-peios, and the
# psABI-fixed /lib64 link into the first of them.
format = "peipkg"

[package]
# -4: adds the /usr vendor shape to the skeleton, and splits fsbase-irf out as
# a second package built from the same mkdir loop. One version across all of
# them, because one recipe produces them all — bumping any bumps the set.
#
# -5: adds fsbase-stratafs-mount-hooks, the initramfs hook that mounts the base
# StrataFS views over the skeleton fsbase-irf lays down.
#
# -6: fsbase-stratafs-mount-hooks gains the mounted-root half,
# mount-rootfs-stratafs-base.sh, superseding the stratafs-base-topo package.
#
# -7: both mount hooks view /lib over /usr/lib rather than the triplet
# directory. The triplet mapping resolved no library anything used — the loader
# finds them by absolute path and the ELF interpreter comes from /lib64 — while
# breaking the two consumers that do read /lib: kmod has /lib/modules compiled
# in, and the kernel's firmware loader searches /lib/firmware.
#
# -8: fsbase declares the first per-subtree security descriptors on Peios —
# sd_overrides for /home and /tmp. Until now one inheritable ACL on / was the
# whole filesystem's access policy, which cannot express "readable system tree,
# private home directories". Needs a consumer that applies sd_overrides:
# peipkg 0.x with PEI-557 (install) and PEI-558 (compose).
version      = "1.0.0-8"
architecture = "x86_64"
license      = "MIT"
