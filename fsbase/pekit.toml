# fsbase — base filesystem: the runtime mountpoint directories every Peios
# system needs (dev, proc, run, sys, tmp, var) plus /system/boot, where the
# dynamic-initramfs builder writes the boot cpio.
#
# A pure-skeleton package: no source, no compilation. The "build" just mints
# the empty directories into the stage; package.pekit.toml maps each as a
# directory source, which packs as an empty-directory payload entry. dev/proc/
# run/sys/tmp are §3.4's permitted directory-only roots, var/ is permitted
# empty, and system/boot sits under the permitted `system/` top-level.

out_dir = "out"

[build]
command = "for d in dev proc run sys tmp var system/boot; do mkdir -p \"$PEKIT_OUT/$d\"; done"
