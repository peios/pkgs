# fsbase-stratafs-mount-hooks — the initramfs hook that mounts the base
# StrataFS views over the skeleton fsbase-irf lays down.
#
# Built from the fsbase recipe rather than one of its own, because the views it
# mounts are stacked over exactly the /usr/X + /lcl/X pairs fsbase-irf mints.
# Those two lists have to agree — drop /lcl/share from the skeleton and this
# hook's /share view fails at boot — and keeping them in one recipe is the same
# argument that keeps fsbase and fsbase-irf together.
#
# Separate from fsbase-irf rather than folded into it because minting a
# directory and mounting something over it are different jobs with different
# failure modes, and an image may reasonably want the skeleton without the
# views: prod ran an initramfs with no hooks at all before this existed.
#
# Plural in the name because there are two, and there may be more. Both hooks
# assemble the same eight base views over the same /usr + /lcl pairs; they
# differ only in which root they act on and in one stratum:
#
#   mount-initramfs-stratafs-base.sh  the initramfs itself, before every other
#                                     hook (contributes initramfs-ready)
#   mount-rootfs-stratafs-base.sh     the mounted root, after something has
#                                     mounted it (contributes
#                                     rootfs-strata-ready)
#
# One package rather than two because they are the same decision applied to
# two roots — the view stack is defined once, and an image wanting StrataFS
# wants it in both places. This supersedes the stratafs-base-topo package,
# which did the mounted-root half alone and could drift from the skeleton it
# stacked over.

[package]
description = "Initramfs hooks that mount the Peios base StrataFS views"

# BOTH hooks run inside the initramfs, so the initramfs root is home to both.
# That is easy to misread for the second one: it decorates the MOUNTED root,
# but it does so from the initramfs, before the pivot, by chrooting in. A hook
# is where it runs, not where it acts.
default_root = "initramfs"

[dependencies]
# The hook is a #!/usr/bin/sh script.
sh = ">= 1"
# mkdir and mount, before any view exists to find them through.
peiosutils = ">= 0.1.2"
# It is packaged where mkirf now looks, and it declares `contributes`, which an
# older mkirf rejects as an unknown key rather than misreading. Both halves of
# the same prelude/hook interface.
prelude-hook-abi = ">= 2"

# The packaged hook directory — the /usr tier, since this is package payload.
# An operator overriding it drops a file of the same name into
# /lcl/libexec/prelude/hooks.d, which wins without this one being removed.
[files]
"src/mount-initramfs-stratafs-base.sh" = "usr/libexec/prelude/hooks.d/mount-initramfs-stratafs-base.sh"
"src/mount-rootfs-stratafs-base.sh"    = "usr/libexec/prelude/hooks.d/mount-rootfs-stratafs-base.sh"
