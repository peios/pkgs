# fsbase — the full skeleton, for the main system root.
#
# Sources come from the build's main/ stage tree; destinations are the real
# paths. Each directory source packs as an empty-directory payload entry.
#
# Listed explicitly (globs deliberately skip directories — they're for files),
# and kept in the same order as the build's lists so the two stay comparable by
# eye. Only LEAF directories are listed: a directory source maps its whole
# subtree, so naming both a parent and its child collides. Ancestors are
# emitted automatically, so /var, /var/state, /usr/lib, /lcl and /lcl/policy
# still land — they simply arrive as parents of the leaves below.

[package]
description = "Base filesystem - the Peios filesystem skeleton"

# This package writes outside every permitted destination — mountpoint roots
# and system/boot — because laying that structure down IS its job. The
# declaration waives pack-time layout validation; it grants nothing at install
# or compose time, where the operator must also pass the bypass.
#
# Declared per package rather than in the shared base: the hooks package ships
# an ordinary script to an ordinary destination and has no business holding an
# exemption it does not need.
special_system_package = true


[files]
# x86-64 ABI interpreter view. This is deliberately package-owned rather than
# compose-intrinsic; removing fsbase removes the topology it supplied.
":main/lib64" = "lib64"
# kernel interfaces
":main/dev" = "dev"
":main/proc" = "proc"
":main/sys" = "sys"
# XDG_RUNTIME_DIR parent; peinit creates per-service dirs beneath
":main/run/services" = "run/services"
":main/run/lock" = "run/lock"
# cleared on reboot
":main/tmp" = "tmp"
# reserved namespace; peinit provisions per-service state
":main/var/state/services" = "var/state/services"
# the persistent secret store
":main/var/state/secrets" = "var/state/secrets"
":main/var/cache/services" = "var/cache/services"
":main/var/log/services" = "var/log/services"
":main/var/crash" = "var/crash"
# survives reboot; wiped by operators, not the system
":main/var/tmp" = "var/tmp"
# operator tier
":main/lcl/bin" = "lcl/bin"
":main/lcl/sbin" = "lcl/sbin"
":main/lcl/libexec" = "lcl/libexec"
":main/lcl/include" = "lcl/include"
":main/lcl/share" = "lcl/share"
":main/lcl/lib" = "lcl/lib"
# everything in the /etc namespace not derived from the registry
":main/lcl/etc" = "lcl/etc"
":main/lcl/conf" = "lcl/conf"
# boot scripts peinit runs at Phase 1.5
":main/lcl/policy/autorun.d" = "lcl/policy/autorun.d"
# composer-seeded registry apply queue
":main/lcl/policy/autoapply.d" = "lcl/policy/autoapply.d"
# vendor tier: the shape every package installs into
":main/usr/bin" = "usr/bin"
":main/usr/sbin" = "usr/sbin"
":main/usr/libexec" = "usr/libexec"
# public shared libraries, flat and ldconfig-indexed
":main/usr/lib/x86_64-linux-peios" = "usr/lib/x86_64-linux-peios"
# kernel modules + vmlinuz, System.map, config, per version
":main/usr/lib/modules" = "usr/lib/modules"
":main/usr/lib/firmware" = "usr/lib/firmware"
# arch-dependent headers; arch-independent ones sit in the parent
":main/usr/include/x86_64-linux-peios" = "usr/include/x86_64-linux-peios"
":main/usr/share" = "usr/share"
":main/usr/src" = "usr/src"
# vendor config defaults for legacy apps; supplementary config for native ones
":main/usr/etc" = "usr/etc"
":main/usr/conf" = "usr/conf"
# reconciler output, projected into /etc
":main/system/retc" = "system/retc"
# where mkirf writes the boot cpio
":main/system/boot" = "system/boot"
# the initramfs root and the ESP live under here
":main/boot" = "boot"
# operator-placed bulk data; never removed automatically
":main/data" = "data"
# humans only — services have no /home entry
":main/home" = "home"
# index of what this host serves
":main/srv" = "srv"
# software that brings its own layout
":main/opt" = "opt"
":main/mnt" = "mnt"
":main/media" = "media"


# The first per-subtree security descriptors on Peios (PEI-559).
#
# Until now the filesystem's whole access policy was one inheritable ACL,
# stamped on / at boot: SYSTEM and BUILTIN\Administrators GenericAll, Everyone
# read+execute, CREATOR OWNER full control of what it makes. That cannot
# express "readable system tree, private home directories" — one ACL covers
# /usr and /home alike — so an ordinary account had privacy nowhere and, since
# nothing grants Everyone FILE_ADD_FILE, nowhere to write either.
#
# These two entries are the exception to inheritance, not a replacement for it.
# Every other path fsbase mints still takes its descriptor from /.
#
# Both DACLs are protected (the leading P). Without it the inheritable
# Everyone read ACE from / is merged in, which would make /home listable by
# everyone and every file under /tmp world-readable — defeating the point of
# both entries. Protection is what makes a subtree a new inheritance scope.
#
# Absolute SID aliases only: these compile to binary at pack time, on a build
# host with no domain or machine to resolve against, so DA/EA and friends are
# an error. CREATOR OWNER has no alias in either vocabulary and is spelled out.
[sd_overrides]

# /home — only SYSTEM and Administrators may enumerate it.
#
# Everyone gets FX: traverse, read attributes, read the descriptor. NOT FR, so
# a principal can walk through /home to its own directory but cannot list the
# accounts on the machine. That distinction is the whole entry — traverse and
# list are one bit apart (KACS_FILE_TRAVERSE == KACS_FILE_EXECUTE) and it is
# easy to grant both by reflex.
#
# The Everyone ACE carries no OI or CI: it applies to /home itself and
# propagates nowhere. Home directories get their descriptors explicitly from
# authd at logon, naming the principal that owns them.
#
# Note the consequence, which is intended but surprising: a home directory
# created by anything OTHER than authd inherits only the SYSTEM and
# Administrators ACEs, and its owner cannot enter it. Creating a home directory
# by hand needs `sd` afterwards.
"home" = "O:SYG:SYD:P(A;OICI;GA;;;SY)(A;OICI;GA;;;BA)(A;;FX;;;WD)"

# /tmp — the sticky directory, expressed as a DACL.
#
# Everyone gets 0x1200af, spelled as a bare hex mask because FILE_ADD_FILE and
# FILE_ADD_SUBDIRECTORY have no two-letter SDDL mnemonic and libp-go's parser
# rejects a mnemonic and a hex literal in one rights field (libpeios' Rust
# parser accepts the mixture — PEI-562). It is FR|FX|0x6: list, traverse, read
# attributes, read the descriptor, create a file, create a subdirectory.
# Deliberately NOT FILE_DELETE_CHILD (0x40): that is the
# difference between /tmp and a world-writable directory. A principal deletes
# its own entry because CREATOR OWNER gave it DELETE on the entry itself, and
# cannot touch anyone else's because the parent never granted delete-child.
# Unix spells this 1777; it is also exactly the ACL Windows puts on %TEMP%.
#
# The Everyone ACE is not inheritable, and that matters more here than on
# /home: FILE_ADD_FILE and FILE_WRITE_DATA are the same bit, so an OI ACE would
# hand Everyone write access to every file in /tmp rather than the right to
# create one. Files under /tmp are governed by CREATOR OWNER instead, which
# makes them private to their creator — stricter than Unix, where a 022 umask
# leaves them world-readable.
#
# A consequence worth knowing: a subdirectory a user creates in /tmp is private
# too, because nothing propagates a right for Everyone into it. Software that
# expects a shared directory under /tmp (the X11 socket directory is the
# classic) must set its own descriptor, as its packaging should anyway.
#
# This is a plain directory, not a mount. On a live image the overlay upper is
# tmpfs, so it behaves as one and evaporates on reboot; on an installed system
# it is disk-backed, which is what Debian shipped for fifteen years. It is
# therefore neither cleared at boot nor size-limited. PEI-556 makes it a real
# mount and closes both.
"tmp" = "O:SYG:SYD:P(A;OICI;GA;;;SY)(A;OICI;GA;;;BA)(A;;0x1200af;;;WD)(A;OICIIO;GA;;;S-1-3-0)"
