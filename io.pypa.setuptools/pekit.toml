# Setuptools — the setuptools PEP 517 backend, for the Python
# projects that still build with it (meson is the customer today; C
# extension modules would be the next). A BUILD-TIME library: nothing on
# a running Peios imports it, and it must never become the way software
# is installed — that is the pip world this packaging design exists to
# avoid.
#
# Self-hosting like flit_core: the sdist's own setuptools.build_meta builds
# its wheel (backend-path = ["."]). The wheel carries
# distutils-precedence.pth, a startup hook every distro ships that routes
# `import distutils` (gone from CPython since 3.12) to setuptools' bundled
# copy — kept, it is part of upstream's install contract. The build and
# install steps are the workspace helper's; see _pybuild_/README.md.
#
# The build runs the offline upstream functional suite and installed-backend
# gate. Live-network tests and release/performance tooling are a separate scope.
# Qualification tools are acquired and recorded outside the bootstrap build;
# final build/test workers remain offline.

tags = ["bootstrap"]
out_dir = "out"

[source.url]
url         = "https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-{{version}}.tar.gz"
listing_url = "https://pypi.org/simple/setuptools/"
extract     = true
root        = "setuptools-{{version}}"
file_regex  = 'setuptools-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz'
# Soft maintenance floor. Stable releases are selected and locked
# automatically; backend compatibility is enforced by the gates below.
versions    = ">= 84.0.0"

# Test tools are acquired separately from the minimal bootstrap build.
# Final qualification uses --env peipkg-net; only vendor has network.
[build.vendor]
command = '''python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/test-tools" acquire "$PWD" "$PEKIT_OUT" --project setuptools --version "$PEKIT_VERSION"'''
[build.vendor.dependencies.peipkg]
# The peipkg-net profile prepares this acquisition target from its APT mapping
# until pip is packaged natively; this is the recipe's only apt set.

[build.vendor.dependencies.apt]
python3 = "*"
python3-pip = "*"
ca-certificates = "*"

[build.main]
command = """
set -eu
SRC="$(pwd -P)"

# --copy-tree: setuptools writes build/ and *.egg-info beside the sources,
# and the fetched tree must stay pristine for the -source package.
python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/install-wheel" \
  --backend setuptools.build_meta --copy-tree --out "$PEKIT_OUT" "$SRC"

"""

[build.main.dependencies.peipkg]
"org.git.kernel.dash"          = "*"
"dev.peios.peiosutils" = "*"
"org.python.python3" = ">= 3.14, < 3.15"

[test]
gate = true
needs = ["main", "vendor"]
command = '''
set -eu
SITE=$(python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/python_paths.py" "$PEKIT_MAIN_OUT")
test -d "$SITE"
test -f "$SITE/setuptools/build_meta.py"

# Run the suite in a disposable source copy with recorded test-only wheels.
SRC="$(pwd -P)"
TEST_WORK="$PEKIT_OUT/upstream"
mkdir -p "$TEST_WORK"
python3 -c 'import shutil, sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True, symlinks=True)' "$SRC" "$TEST_WORK"
python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/test-tools" install "$PEKIT_VENDOR_OUT" "$PEKIT_OUT/test-tools"
TEST_PYTHON="$PEKIT_OUT/test-tools/bin/python3"
export PYTHONNOUSERSITE=1
unset PYTHONPATH
export PYTHONDONTWRITEBYTECODE=1
export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
unset PIP_NO_INDEX PIP_INDEX_URL
export PIP_CONFIG_FILE="$PEKIT_OUT/pip.conf"
printf '[global]\nindex-url = file:///nonexistent\n' > "$PIP_CONFIG_FILE"
export PIP_FIND_LINKS="$PEKIT_VENDOR_OUT/wheels"
export PIP_DISABLE_PIP_VERSION_CHECK=1
export VIRTUALENV_NO_PERIODIC_UPDATE=1
export VIRTUALENV_OVERRIDE_APP_DATA="$PEKIT_OUT/virtualenv"
cd "$TEST_WORK"
"$TEST_PYTHON" -c 'import setuptools as backend; from pathlib import Path; assert Path(backend.__file__).resolve().is_relative_to(Path.cwd())'
python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/prepare-backend-tests" "$TEST_WORK" "$TEST_PYTHON" "$PEKIT_OUT/test-adjustments.json"
"$TEST_PYTHON" -m pytest -q -p no:cacheprovider -p pytest_home.fixtures -p pytest_subprocess.fixtures -p pytest_timeout \
  -m 'not uses_network' --junitxml="$PEKIT_OUT/upstream.xml" setuptools/tests
cd "$SRC"
unset PYTHONPATH

# Exercise the exact installed backend from the staged package tree.
SRC="$(pwd -P)"
PEKIT_OUT="$PEKIT_MAIN_OUT"
test -d "$SITE"
test -f "$SITE/setuptools/build_meta.py"
test -f "$SITE/distutils-precedence.pth"
test -f "$SITE/setuptools/config/NOTICE"
test -f "$SITE/setuptools/config/_validate_pyproject/NOTICE"
test -f "$SITE/setuptools/_vendor/autocommand-"*.dist-info/LICENSE
test -f "$SITE/setuptools/_vendor/packaging-"*.dist-info/licenses/LICENSE.APACHE
test -f "$SITE/setuptools-"*.dist-info/METADATA

# Exercise the installed backend, not the source checkout. This covers import
# precedence, bundled distutils, vendored requirements parsing, checked-hash
# bytecode, PEP 517 wheel and metadata hooks, RECORD, and corresponding source.
SMOKE="$TEST_WORK/installed-smoke"
mkdir -p "$SMOKE/project" "$SMOKE/dist" "$SMOKE/metadata"
cat > "$SMOKE/project/pyproject.toml" <<'EOF'
[build-system]
requires = []
build-backend = "setuptools.build_meta"

[project]
name = "peios-setuptools-smoke"
version = "1.2.3"
description = "Setuptools installed-backend smoke project"

[tool.setuptools]
py-modules = ["peios_setuptools_smoke"]
EOF
cat > "$SMOKE/project/peios_setuptools_smoke.py" <<'EOF'
'Installed Setuptools smoke module.'

ANSWER = 42
EOF

cd "$PEKIT_OUT"
PYTHONPATH="$SITE:$PEKIT_WORKSPACE_ROOT/_pybuild_" PYTHONDONTWRITEBYTECODE=1 \
python3 -S - "$SITE" "$PEKIT_VERSION" "$SMOKE" <<'PY'
import importlib.metadata
import os
from pathlib import Path
import tarfile
import zipfile

site = Path(__import__('sys').argv[1]).resolve()
version = __import__('sys').argv[2]
smoke = Path(__import__('sys').argv[3]).resolve()

import setuptools
import setuptools.build_meta as backend
from setuptools import _vendor
from setuptools._vendor import packaging
from setuptools._vendor.packaging.requirements import Requirement
import distutils

assert Path(setuptools.__file__).resolve().is_relative_to(site)
assert Path(distutils.__file__).resolve().is_relative_to(site)
assert setuptools.__version__ == version
assert importlib.metadata.version('setuptools') == version
assert Requirement('example>=1').name == 'example'
assert list(_vendor.__path__)
assert all(Path(path).resolve().is_relative_to(site) for path in _vendor.__path__)
assert Path(packaging.__file__).resolve().is_relative_to(site)

py_sources = sorted((site / 'setuptools').rglob('*.py'))
pycs = sorted((site / 'setuptools').rglob('*.pyc'))
assert len(py_sources) >= 100
assert len(pycs) >= 100
for pyc in pycs:
    data = pyc.read_bytes()
    assert len(data) >= 16
    assert int.from_bytes(data[4:8], 'little') == 3  # checked-hash PEP 552

os.chdir(smoke / 'project')
wheel_name = backend.build_wheel(str(smoke / 'dist'))
metadata_name = backend.prepare_metadata_for_build_wheel(str(smoke / 'metadata'))
sdist_name = backend.build_sdist(str(smoke / 'dist'))

wheel = smoke / 'dist' / wheel_name
from wheel_checks import install_and_import
install_and_import(wheel, smoke / 'installed', 'peios_setuptools_smoke')
assert wheel_name == 'peios_setuptools_smoke-1.2.3-py3-none-any.whl'
with zipfile.ZipFile(wheel) as archive:
    names = set(archive.namelist())
    info = 'peios_setuptools_smoke-1.2.3.dist-info'
    assert 'peios_setuptools_smoke.py' in names
    assert f'{info}/METADATA' in names
    assert f'{info}/WHEEL' in names
    assert f'{info}/RECORD' in names
    metadata = archive.read(f'{info}/METADATA').decode()
    assert 'Name: peios-setuptools-smoke\n' in metadata
    assert 'Version: 1.2.3\n' in metadata

assert metadata_name == 'peios_setuptools_smoke-1.2.3.dist-info'
assert (smoke / 'metadata' / metadata_name / 'METADATA').is_file()
sdist = smoke / 'dist' / sdist_name
with tarfile.open(sdist, 'r:gz') as archive:
    names = set(archive.getnames())
    root = 'peios_setuptools_smoke-1.2.3'
    assert f'{root}/pyproject.toml' in names
    assert f'{root}/peios_setuptools_smoke.py' in names
PY

python3 -S - "$SRC" <<'PY'
from pathlib import Path
import sys

assert not any(path.is_dir() for path in Path(sys.argv[1]).rglob('__pycache__'))
PY
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
"org.python.python3-source" = ">= 3.14, < 3.15"
"dev.peios.build-essentials-c++" = "*"
"org.python.python3-devel" = ">= 3.14, < 3.15"
"org.git.kernel.dash"          = "*"
"dev.peios.peiosutils" = "*"
"org.python.python3" = ">= 3.14, < 3.15"
