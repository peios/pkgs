# Capstone — multi-architecture disassembly framework. Build the complete
# architecture set and both library forms, matching the upstream default
# feature surface while keeping runtime, development, and static payloads
# independently installable.

tags = ["bootstrap"]
out_dir = "out"

[source.git]
url       = "https://github.com/capstone-engine/capstone.git"
ref       = "{{version}}"
tag_regex = '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
# Soft maintenance floor. New stable releases are automatic; the SONAME and
# consumer gates below fail closed if a future release changes the public ABI.
versions = ">= 5.0.9"

[build.main]
command = """
set -eu
SRC="$(pwd)"
BUILD="$PEKIT_OUT/build"
LIBDIR="$PEKIT_OUT/usr/lib/x86_64-linux-peios"

# CMake takes the workspace CFLAGS/LDFLAGS from the environment; append only
# this recipe's extras. Keep DWARF paths physical until split-debug collects
# the referenced files, and generate IBT PLT entries. The RelWithDebInfo
# per-configuration flags are emptied so CMake's own -O2 -g -DNDEBUG does not
# override the distribution set.
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.capstone-engine.capstone"
export LDFLAGS="${LDFLAGS:?} -Wl,-z,ibtplt"

cmake -S "$SRC" -B "$BUILD" \
  -DPROJECT_VERSION="$PEKIT_VERSION" \
  -DCMAKE_INSTALL_PREFIX=/usr \
  -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-peios \
  -DCMAKE_BUILD_TYPE=RelWithDebInfo \
  -DCMAKE_C_FLAGS_RELWITHDEBINFO= \
  -DCMAKE_CXX_FLAGS_RELWITHDEBINFO= \
  -DBUILD_SHARED_LIBS=ON \
  -DBUILD_STATIC_LIBS=ON \
  -DCAPSTONE_BUILD_TESTS=ON \
  -DCAPSTONE_BUILD_CSTOOL=ON \
  -DCAPSTONE_BUILD_CSTEST=OFF
cmake --build "$BUILD" --parallel "$(nproc)"
DESTDIR="$PEKIT_OUT" cmake --install "$BUILD"
mkdir -p "$PEKIT_OUT/usr/share/man/man1"
gzip -n -9 -c "$PEKIT_RECIPE_ROOT/cstool.1" > \
  "$PEKIT_OUT/usr/share/man/man1/cstool.1.gz"

DOCDIR="$PEKIT_OUT/usr/share/doc/org.capstone-engine.capstone"
mkdir -p "$DOCDIR"
install -m 0644 "$SRC/README.md" "$SRC/ChangeLog" "$SRC/CREDITS.TXT" \
  "$SRC/SPONSORS.TXT" "$DOCDIR/"

# Distribution debug split.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.capstone-engine.capstone "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.cmake.cmake" = "*"
"org.sourceware.debugedit" = "*"
"org.gnu.gzip" = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
SDK_TEST_OUT="$PEKIT_OUT"
export SDK_TEST_OUT
STAGE="$PEKIT_MAIN_OUT"
output=$(LD_LIBRARY_PATH="$STAGE/usr/lib/x86_64-linux-peios" \
  "$STAGE/usr/bin/cstool" x64 554889e5)
case "$output" in *push*rbp*mov*rbp*rsp*) ;; *) exit 1;; esac

# Run the upstream release suite from the explicit package gate.
PEKIT_OUT="$PEKIT_MAIN_OUT"
BUILD="$PEKIT_OUT/build"
ctest --test-dir "$BUILD" --output-on-failure
rm -rf "$PEKIT_MAIN_OUT/build"

# Exercise the exact installed CLI and C API after packaging transformations.
PEKIT_OUT="$PEKIT_MAIN_OUT"
LIBDIR="$PEKIT_OUT/usr/lib/x86_64-linux-peios"
# Installed CLI and public C API gate.
readelf -d "$LIBDIR/libcapstone.so.$PEKIT_VERSION" | \
  grep -F 'Library soname: [libcapstone.so.5]'
LD_LIBRARY_PATH="$LIBDIR" "$PEKIT_OUT/usr/bin/cstool" x64 554889e5 | \
  grep -F 'push'
SMOKE="$PEKIT_OUT/.capstone-smoke"
mkdir -p "$SMOKE"
printf '%s\n' \
  '#include <capstone/capstone.h>' \
  'int main(void) {' \
  '  csh handle; cs_insn *insn;' \
  '  const unsigned char code[] = { 0x55, 0x48, 0x89, 0xe5 };' \
  '  if (cs_open(CS_ARCH_X86, CS_MODE_64, &handle) != CS_ERR_OK) return 1;' \
  '  size_t count = cs_disasm(handle, code, sizeof code, 0x1000, 0, &insn);' \
  '  if (count != 2) return 2;' \
  '  cs_free(insn, count); cs_close(&handle); return 0;' \
  '}' > "$SMOKE/smoke.c"
cc -I"$PEKIT_OUT/usr/include" -L"$LIBDIR" -Wl,-rpath-link,"$LIBDIR" \
  -o "$SMOKE/smoke" "$SMOKE/smoke.c" -lcapstone
LD_LIBRARY_PATH="$LIBDIR" "$SMOKE/smoke"
printf '%s\n' \
  'cmake_minimum_required(VERSION 3.15)' \
  'project(capstone_consumer C)' \
  'find_package(capstone CONFIG REQUIRED)' \
  'add_executable(capstone_consumer smoke.c)' \
  'target_link_libraries(capstone_consumer PRIVATE capstone::capstone_shared)' \
  > "$SMOKE/CMakeLists.txt"
cmake -S "$SMOKE" -B "$SMOKE/cmake-build" \
  -Dcapstone_DIR="$LIBDIR/cmake/capstone"
cmake --build "$SMOKE/cmake-build" --parallel "$(nproc)"
LD_LIBRARY_PATH="$LIBDIR" "$SMOKE/cmake-build/capstone_consumer"
rm -rf "$SMOKE"


# Test the SDK package closure, not the complete installation prefix.
sh "$PEKIT_RECIPE_ROOT/sdk-consumer/test.sh"
'''

[test.dependencies.peipkg]
"org.python.python3" = "*"
"dev.peios.build-essentials-c++" = "*"
"org.cmake.cmake" = "*"
