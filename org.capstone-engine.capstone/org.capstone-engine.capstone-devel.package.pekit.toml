[package]
name        = "org.capstone-engine.capstone-devel"
description = "Capstone - headers and development metadata"

# The installed CMake export names libcapstone.a (capstone::capstone_static),
# and find_package fails if an imported file is missing, so the static
# archive is part of this SDK (Fedora's -static model).
[dependencies]
"org.capstone-engine.capstone" = "= {{release}}"
"org.capstone-engine.capstone-libs" = "= {{release}}"
"org.capstone-engine.capstone-static" = "= {{release}}"

[files]
"@source:LICENSE.TXT"                           = "usr/share/licenses/org.capstone-engine.capstone-devel/"
"@source:LICENSE_LLVM.TXT"                      = "usr/share/licenses/org.capstone-engine.capstone-devel/"
":usr/include/**"                               = "usr/include"
":usr/lib/x86_64-linux-peios/libcapstone.so"    = "usr/lib/x86_64-linux-peios/libcapstone.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**"      = "usr/lib/x86_64-linux-peios/pkgconfig"
":usr/lib/x86_64-linux-peios/cmake/capstone/**" = "usr/lib/x86_64-linux-peios/cmake/capstone"
