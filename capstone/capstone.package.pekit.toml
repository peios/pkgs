# capstone — the disassembly runtime library + cstool.

[package]
name        = "capstone"
description = "capstone - multi-architecture disassembly library and cstool"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:LICENSE.TXT" = "usr/share/licenses/capstone/"
":usr/bin/cstool" = "usr/bin/cstool"
":usr/lib/x86_64-linux-peios/libcapstone.so.5*" = "usr/lib/x86_64-linux-peios"
