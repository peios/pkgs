[package]
name        = "org.gnu.which"
description = "GNU command locator for shell search paths"
license     = "GPL-3.0-or-later"

[provides]
which = "{{version}}-1"

[replaces]
which = "<= {{version}}-1"

[dependencies]
glibc                  = ">= 2.43"
"org.gnu.which-common" = "{{version}}-1"

[files]
"@source:COPYING" = "usr/share/licenses/org.gnu.which/COPYING"
":usr/bin/which"  = "usr/bin/which"
