# GNU which — report the executable a shell would select from PATH.
#
# The installed program is ANSI C and has no libstdc++ runtime dependency.
# Upstream's shared cwm4 configure layer still performs mandatory C++ compiler
# probes, however, so the build closure intentionally retains a C++ compiler.

tags = ["bootstrap"]
out_dir = "out"

[source.url]
url         = "https://ftpmirror.gnu.org/which/which-{{version}}.tar.gz"
listing_url = "https://ftpmirror.gnu.org/which/"
extract     = true
root        = "which-{{version}}"
file_regex  = 'which-[0-9]+\.[0-9]+\.tar\.gz'
# Soft maintenance floor. Follow every newer authenticated stable release;
# incompatible command changes stop at the staged-command tests.
versions    = ">= 2.25"

# GNU which releases are signed by maintainer Carlo Wood. Pin the complete
# primary-key fingerprint from GNU's official keyring so every release chosen
# through unattended discovery must authenticate before it can be locked.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/carlo-wood.asc"]
fingerprints = ["8020B2666305EE2FD53E6827C155A4EEE4E527A2"]

[build.main]
command = """
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.which"
cd "$PEKIT_OUT"

# Compile protected code and generate IBT PLT entries. Preserve the linker's
# note merge so an unmarked startup object cannot masquerade as protected.
CFLAGS="$CFLAGS -fcf-protection=full" \
CXXFLAGS="$CXXFLAGS -fcf-protection=full" \
LDFLAGS="$LDFLAGS -Wl,-z,ibtplt" \
"$SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --bindir=/usr/bin \
  --mandir=/usr/share/man \
  --infodir=/usr/share/info \
  --disable-silent-rules

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' -exec gzip -9n {} \\;

# Peios currently has no Info reader. The corresponding-source package retains
# the Texinfo source; installed users receive the command manual and concise
# upstream documentation in the noarch common package.
rm -rf "$PEKIT_OUT/usr/share/info"

sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.which "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"org.gnu.gzip" = "*"
# The installed binary is C-only, but upstream's cwm4 configure layer invokes
# AC_PROG_CXX and tests C++ warning flags even for this package.
"dev.peios.build-essentials-c++" = "*"
"org.sourceware.debugedit"              = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
BIN="$STAGE/usr/bin/which"
SMOKE="$PEKIT_OUT/smoke"
ROOT=$(dirname "$(dirname "$STAGE")")
cd "$STAGE"

# This release has no dedicated cases, but the upstream check target is the
# stable entry point that will pick up tests in future automatically selected
# releases.
make -j"$(nproc)" check

mkdir -p "$SMOKE/a" "$SMOKE/b"
test -x "$BIN"
printf '%s\n' '#!/usr/bin/sh' 'exit 0' > "$SMOKE/a/tool"
printf '%s\n' '#!/usr/bin/sh' 'exit 0' > "$SMOKE/b/tool"
printf '%s\n' 'not executable' > "$SMOKE/a/hidden"
chmod 0755 "$SMOKE/a/tool" "$SMOKE/b/tool"
chmod 0644 "$SMOKE/a/hidden"
PATH="$SMOKE/a:$SMOKE/b" "$BIN" tool > "$SMOKE/first"
test "$(cat "$SMOKE/first")" = "$SMOKE/a/tool"
PATH="$SMOKE/a:$SMOKE/b" "$BIN" --all tool > "$SMOKE/all"
printf '%s\n' "$SMOKE/a/tool" "$SMOKE/b/tool" > "$SMOKE/all.expected"
cmp "$SMOKE/all.expected" "$SMOKE/all"
status=0
PATH="$SMOKE/a" "$BIN" hidden > "$SMOKE/hidden.out" \
  2> "$SMOKE/hidden.err" || status=$?
test "$status" -eq 1
test ! -s "$SMOKE/hidden.out"
grep -F 'no hidden in' "$SMOKE/hidden.err"
(
  cd "$SMOKE"
  PATH="$SMOKE/a" "$BIN" ./a/tool > explicit
  test "$(cat explicit)" = "$SMOKE/a/tool"
  PATH='./a' "$BIN" tool > expanded-dot
  test "$(cat expanded-dot)" = "$SMOKE/a/tool"
  PATH='./a' "$BIN" --show-dot tool > shown-dot
  test "$(cat shown-dot)" = './a/tool'
)
printf '%s\n' "alias pick='tool --flag'" \
  | PATH="$SMOKE/a:$SMOKE/b" "$BIN" --read-alias pick > "$SMOKE/alias"
printf '%s\n\t%s\n' "alias pick='tool --flag'" "$SMOKE/a/tool" \
  > "$SMOKE/alias.expected"
cmp "$SMOKE/alias.expected" "$SMOKE/alias"

"$BIN" --version | head -1 | grep -F "v$PEKIT_VERSION"
"$BIN" --help | grep -F 'Write the full path of COMMAND(s)'
readelf -h "$BIN" | grep -E 'Type:[[:space:]]+DYN'
readelf -W -l "$BIN" | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l "$BIN" | grep -F 'GNU_RELRO'
readelf -d "$BIN" | grep -F 'BIND_NOW'
readelf -d "$BIN" | grep -F 'RELR'
readelf -n "$BIN" | grep -E 'x86 feature:.*IBT.*SHSTK'
if readelf -d "$BIN" | grep -E '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
needed=$(readelf -d "$BIN" \
  | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p' \
  | LC_ALL=C sort -u)
test "$needed" = 'libc.so.6'
if strings "$BIN" | grep -F "$ROOT"; then exit 1; fi
test -n "$(find "$STAGE/usr/src/debug/org.gnu.which" -type f -print -quit)"
test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"org.gnu.binutils"               = "*"
"org.gnu.findutils"              = "*"
"org.gnu.grep"                   = "*"
