# eudev — the autotools-maintained udev fork. Five package payloads come out
# of it: the device manager, libudev, development files, detached debug
# symbols and their corresponding source. The source package is generated by
# Pekit as the sixth member.
#
#   libudev   the device-enumeration library, which usbip hard-requires
#             (PEI-158 Tier 2, wave 3). systemd's libudev is meson-only, so
#             eudev is the pool's libudev provider until the joint meson
#             adoption revisits this.
#   eudev     the device manager: udevd, udevadm, the *_id helpers, a Peios
#             rules set, and the peinit service definition (PEI-58). Peios'
#             answer to "who loads the driver when a device appears, and who
#             gives a disk a name that survives reboot" — provisional, chosen
#             over writing our own because the peinit TRM already names eudev
#             and the hardware-matching corpus is the part that is painful to
#             finish.
#
# Autotools from the authenticated release tarball, out-of-source via DESTDIR.
# kmod on, so the `kmod` builtin (what 80-drivers.rules calls per
# MODALIAS) exists; blkid on, so the `blkid` builtin exists and
# 60-persistent-storage can produce /dev/disk/by-uuid. hwdb on: the hardware
# database (keyboard and touchpad quirks, sensor orientation, vendor and model
# names for PCI/USB ids) is what makes a laptop's input devices behave, and
# the rules that import it are shipped. Its sources land in /usr/etc/udev/
# hwdb.d and the compiled hwdb.bin beside them — udevd reads only the binary,
# and `udevadm hwdb --update` regenerates it from the sources plus anything an
# operator drops into /etc/udev/hwdb.d. Manpages want xsltproc; selinux is
# not our model.
#
# WHAT UDEV DOES NOT OWN ON PEIOS: device-node permissions. udev's MODE=,
# GROUP= and OWNER= are POSIX mode, which KACS ignores; access to /dev is the
# SD prelude seeds and the per-node exceptions peinit stamps. The shipped
# rules are therefore a chosen subset of upstream's, and the build asserts
# that none of them carries a DAC assignment — a rule that names a group that
# does not exist here would at best warn at every load and at worst mislead a
# reader into thinking it meant something.

tags = ["bootstrap"]
out_dir = "out"

[source.url]
url         = "https://github.com/eudev-project/eudev/releases/download/v{{version}}/eudev-{{version}}.tar.gz"
listing_url = "https://api.github.com/repos/eudev-project/eudev/releases?per_page=100"
file_regex  = 'eudev-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz'
extract     = true
root        = "eudev-{{version}}"
# Soft maintenance floor: follow every newer authenticated stable release.
versions    = ">= 3.2.14"

[source.url.signature]
url          = "{{source_url}}.asc"
of           = "artifact"
key_files    = ["keys/boian-bonev.asc"]
fingerprints = ["BA60BC20F37E59444D6D25001365720913D2F22D"]

[build.main]
command = """
set -eu
SRC="$PEKIT_SOURCE_ROOT"
LIBDIR=/usr/lib/x86_64-linux-peios
# The build tree is a subdirectory, not the stage itself, so the generated
# sources DWARF names are captured in debugsource like the pristine ones.
BUILD="$PEKIT_OUT/build"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
DEBUG_PREFIX=/usr/src/debug/io.github.eudev-project.eudev

mkdir -p "$BUILD"
cd "$BUILD"
# Helpers and rules.d land in $libdir/udev, upstream's default. That is the
# triplet directory rather than /usr/lib/udev because PSPU §3.4.2 permits
# nothing else under /usr/lib — pack rejects the payload otherwise.
CFLAGS="${CFLAGS:?} -ffile-prefix-map=$ROOT=$DEBUG_PREFIX" \
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --sbindir=/usr/bin \
  --libdir="$LIBDIR" --sysconfdir=/etc \
  --disable-manpages --enable-hwdb --enable-blkid --enable-kmod \
  --disable-selinux --disable-static --disable-rule-generator \
  --disable-mtd_probe

# Fail instead of silently degrading when a future dependency or configure
# change turns off the two device-discovery integrations we require.
grep -Fx '#define HAVE_BLKID 1' config.h
grep -Fx '#define HAVE_KMOD 1' config.h
make -j"$(nproc)"

make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT$LIBDIR" -name '*.la' -delete

# Upstream's generated release pages are authoritative even when the optional
# DocBook toolchain is disabled. Stage them in the canonical compressed form.
for page in udev.conf.5 hwdb.7 udev.7 udevadm.8 udevd.8; do
  section=${page##*.}
  mkdir -p "$PEKIT_OUT/usr/share/man/man$section"
  gzip -n -9 -c "$SRC/man/$page" > \
    "$PEKIT_OUT/usr/share/man/man$section/$page.gz"
done

# udev.h is a private daemon header that cannot be consumed without other
# uninstalled internals; udev.pc describes that private interface. The public
# development contract is libudev.h plus libudev.pc.
rm -f "$PEKIT_OUT/usr/include/udev.h" "$PEKIT_OUT/usr/share/pkgconfig/udev.pc"

# /etc is a StrataFS view over /usr/etc; package payload goes to the latter.
# The hwdb binary is compiled here, from the sources just installed, with the
# udevadm just built. --root is prepended to BOTH the source directories and
# the output path, so -o is given relative to the stage root.
install -d "$PEKIT_OUT/usr/etc/udev"
LD_LIBRARY_PATH="$PEKIT_OUT$LIBDIR" "$PEKIT_OUT/usr/bin/udevadm" hwdb --update \
  --root="$PEKIT_OUT" -o /usr/etc/udev/hwdb.bin
mv "$PEKIT_OUT/etc/udev/udev.conf" "$PEKIT_OUT/usr/etc/udev/udev.conf"
mv "$PEKIT_OUT/etc/udev/hwdb.d" "$PEKIT_OUT/usr/etc/udev/hwdb.d"
rm -rf "$PEKIT_OUT/etc"

# The rules set. Upstream installs its whole catalogue; replace it with the
# subset Peios means, plus our own defaults file. What is left out and why:
#   50-udev-default   almost entirely GROUP=/MODE=; the non-DAC lines are
#                     rewritten as 50-peios-default.rules
#   64-btrfs, 75-probe_mtd, 60-persistent-storage-tape, 60-fido-id,
#   60-persistent-alsa, 60-persistent-v4l, 70-camera, 70-memory, 60-drm,
#   81-net-dhcp       subsystems with no Peios consumer yet
# 80-net-name-slot is kept deliberately: a NIC is named by its bus position
# (enp0s3) rather than by probe order (eth0), so a configuration written
# against a name survives a second card or a driver that probes faster. Taken
# now, before any networking service exists, so nothing ever learns eth0.
RULES="$PEKIT_OUT$LIBDIR/udev/rules.d"
keep="60-autosuspend 60-block 60-cdrom_id 60-evdev 60-input-id 60-persistent-input
      60-persistent-storage 60-sensor 60-serial 70-joystick 70-mouse 70-touchpad
      75-net-description 78-sound-card 80-drivers 80-net-name-slot"
# Normalize this to one line because the match brackets each name with spaces.
keep=$(printf '%s' "$keep" | tr '\n' ' ')
for f in "$RULES"/*.rules; do
  name=$(basename "$f" .rules)
  case " $keep " in *" $name "*) ;; *) rm -f "$f" ;; esac
done
# 50-peios-default.rules, udev-coldplug and eudev-service.reg are recipe
# payload, mapped straight from src/ by the package manifest.
# No rule shipped here may assign DAC: it would be inert under KACS and
# misleading to read.

# Do not ship helpers with no retained rule or Peios consumer.
rm -f \
  "$PEKIT_OUT$LIBDIR/udev/collect" \
  "$PEKIT_OUT$LIBDIR/udev/dmi_memory_id" \
  "$PEKIT_OUT$LIBDIR/udev/fido_id" \
  "$PEKIT_OUT$LIBDIR/udev/mtd_probe" \
  "$PEKIT_OUT$LIBDIR/udev/v4l_id"

# Conventional build-id debug packages. Rewrite source paths to the canonical
# package namespace before producing detached symbols and stripping payloads.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" io.github.eudev-project.eudev "$PEKIT_OUT/usr"
"""

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c"  = "*"
"org.gnu.gperf"                = "*"
"org.pkgconf.pkgconf"              = "*"
"org.kernel.kmod-devel"           = "*"
"org.kernel.libblkid-devel" = "*"
# libtool's configure shells out to file(1); absent, the run dies mid-way.
"com.darwinsys.file"                  = "*"
"org.perl.perl"                  = "*"
"org.python.python3"               = "*"
"org.gnu.tar"                   = "*"
"org.tukaani.xz"                    = "*"
# This is build-only bootstrap tooling: build-essentials-c already composes
# the GNU implementation into the build root. The shipped eudev package below
# depends on Peios's peiosutils instead.
"dev.peios.peiosutils"  = "*"
"org.sourceware.debugedit"             = "*"
"org.gnu.gzip"                         = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
# Run upstream's rules suite. Its syntax checker has a historical /usr/bin/python
# shebang; Peios intentionally names Python 3 explicitly. udev-test.pl creates
# a nested mount namespace, which is unavailable inside Pekit's test sandbox;
# staged command, hwdb and ABI probes below cover executable behavior there.
sed -i '1s|^#!/usr/bin/python$|#!/usr/bin/python3|' \
  "$PEKIT_SOURCE_ROOT/test/rule-syntax-check.py"
cd "$PEKIT_MAIN_OUT/build"
TAR_OPTIONS=--no-same-owner make -j"$(nproc)" check TESTS=rules-test.sh
STAGE="$PEKIT_MAIN_OUT"
BINDIR="$STAGE/usr/bin"
STAGED_LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
test -x "$BINDIR/udevadm"
test -s "$STAGE/usr/etc/udev/hwdb.bin"
test -f "$STAGE/usr/include/libudev.h"
set -- "$STAGED_LIBDIR"/libudev.so.*
test -e "$1"
RULES="$STAGED_LIBDIR/udev/rules.d"
keep="60-autosuspend 60-block 60-cdrom_id 60-evdev 60-input-id 60-persistent-input
      60-persistent-storage 60-sensor 60-serial 70-joystick 70-mouse 70-touchpad
      75-net-description 78-sound-card 80-drivers 80-net-name-slot"
keep=$(printf '%s' "$keep" | tr '\n' ' ')
for name in $keep; do
  [ -f "$RULES/$name.rules" ] || {
    echo "kept rule missing from payload: $name" >&2
    exit 1
  }
done
if grep -lE 'MODE=|GROUP=|OWNER=' "$RULES"/*.rules; then
  echo "rules carrying MODE=/GROUP=/OWNER= — not shipped on Peios" >&2
  exit 1
fi
LD_LIBRARY_PATH="$STAGED_LIBDIR" "$BINDIR/udevadm" --version | grep -E '^[0-9]+$'
UDEV_HWDB_BIN="$STAGE/usr/etc/udev/hwdb.bin" \
LD_LIBRARY_PATH="$STAGED_LIBDIR" "$BINDIR/udevadm" hwdb \
  --test='pci:v00000000d00000000sv00000000sd00000000bc01sc01i00' \
  | grep -F 'ID_PCI_CLASS_FROM_DATABASE=Mass storage controller'

SMOKE="$PEKIT_OUT/eudev-smoke"
mkdir -p "$SMOKE"
cat > "$SMOKE/libudev.c" <<'EOF'
#include <libudev.h>

int main(void) {
  struct udev *udev = udev_new();
  if (!udev) return 1;
  udev_unref(udev);
  return 0;
}
EOF
cc ${CFLAGS:?} -I"$STAGE/usr/include" -L"$STAGED_LIBDIR" \
  -Wl,-rpath-link,"$STAGED_LIBDIR" ${LDFLAGS:?} \
  -o "$SMOKE/libudev" "$SMOKE/libudev.c" -ludev
LD_LIBRARY_PATH="$STAGED_LIBDIR" "$SMOKE/libudev"

# Detached debug files carry symbols rather than runnable dynamic sections.
find "$STAGE/usr" -type f ! -type l \
  ! -path "$STAGE/usr/lib/debug/*" ! -path "$STAGE/usr/src/debug/*" \
  | while IFS= read -r f; do
  readelf -h "$f" >/dev/null 2>&1 || continue
  readelf -W -l "$f" | grep 'GNU_STACK' | grep -F 'RW '
  readelf -d "$f" | grep -F 'BIND_NOW'
  if readelf -d "$f" | grep -E '(RPATH|RUNPATH)'; then exit 1; fi
done
rm -rf "$SMOKE"
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.gperf" = "*"
"org.pkgconf.pkgconf" = "*"
"org.kernel.kmod-devel" = "*"
"org.kernel.libblkid-devel" = "*"
"com.darwinsys.file" = "*"
"org.perl.perl" = "*"
"org.python.python3" = "*"
"org.gnu.tar" = "*"
"org.tukaani.xz" = "*"
"dev.peios.peiosutils" = "*"
"org.sourceware.debugedit" = "*"
"org.git.kernel.dash" = "*"
