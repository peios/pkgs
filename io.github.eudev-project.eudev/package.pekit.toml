# Shared metadata for the eudev package family.

format = "peipkg"

[package]
# -4 republishes the qualified peiosutils dependency after retiring the
# undeployed compatibility alias.
version      = "{{version}}-1"
architecture = "x86_64"
license      = "GPL-2.0-or-later AND LGPL-2.1-or-later"
license_class = "free"
homepage     = "https://github.com/eudev-project/eudev"
