# Debug symbols for the daemon, tools, helpers and libudev from this source.

[package]
name        = "io.github.eudev-project.eudev-debuginfo"
description = "eudev - debugging symbols"

[dependencies]
"io.github.eudev-project.eudev" = "= {{release}}"

[files]
"@source:COPYING" = "usr/share/licenses/io.github.eudev-project.eudev-debuginfo/"
":usr/lib/debug/**" = "usr/lib/debug"
