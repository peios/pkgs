# libudev-devel — libudev.h, the .so link, and pkg-config metadata.

[package]
name        = "io.github.eudev-project.eudev-devel"
description = "libudev - headers and link library (eudev)"
license     = "LGPL-2.1-or-later"

[dependencies]
"io.github.eudev-project.eudev-libudev" = "{{version}}-3"

[files]
":usr/include/libudev.h"                   = "usr/include/libudev.h"
":usr/lib/x86_64-linux-peios/libudev.so"   = "usr/lib/x86_64-linux-peios/libudev.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**" = "usr/lib/x86_64-linux-peios/pkgconfig"
