# Network-enabled rung-2 environment, for bindgen's [build.vendor] stage
# ONLY (cargo vendor reaches crates.io). See enter-net.sh's header for
# what it adds over the standard peipkg env and why. Select with
# `pekit build vendor --env peipkg-net`; every other stage keeps the
# offline peipkg env.
dependency_provider = "peipkg"

[wrap]
command = 'exec "$PEKIT_WORKSPACE_ROOT/bindgen/enter-net.sh" {{command}}'
