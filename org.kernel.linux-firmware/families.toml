# families.toml — how upstream linux-firmware is split into Peios packages.
#
# This file is the single source of truth for the split (PEI-466). Two
# things consume it:
#
#   tools/gen-members.py   writes one canonical
#                          org.kernel.linux-firmware-<family> package member
#                          for every family (run via `pekit gen members`; the
#                          drift gate fails a build whose members are stale)
#   tools/sort-firmware.py sorts the WHENCE-listed blobs into per-family
#                          trees at build time, and FAILS if any blob is not
#                          claimed by a family or the ignore list, or if a
#                          family's licences do not match what its blobs cite
#
# So a new upstream release that adds a driver, a directory or a vendor
# licence stops the build with a name, and a human adds it here. Derived with
# a gate, not derived automatically: a new vendor licence is a thing someone
# should read.
#
# Matching. Every WHENCE `Driver:` block is assigned as a whole when its
# driver name (the text before " - ") fullmatches one of a family's `drivers`
# regexes; otherwise each of its files is assigned by the first family whose
# `paths` fnmatch pattern matches the path. Families are tried in file order.
# A block's Link: entries follow the family of the file they point at.
#
# Licences (PEI-1166). What a family ships is derived from WHENCE, per file:
# every LICEN[CS]E.* and NOTICE.* text cited for the family's files, the
# LICENSES/<id> text behind every worded declaration ("GPLv2 or later. See
# GPL-2.0", "MIT", "Allegedly GPLv2+, ..."), and a WHENCE excerpt carrying
# upstream's wording and copyright notices for each entry the family ships.
# `license` is the SPDX expression the package declares; the build derives it
# too (vendor texts through [licence_ids] below, worded declarations through
# the sorter's FREE_LICENCES table) and fails unless the two agree, printing
# the expected expression. Peios follows SPDX's LicenseRef- convention for
# vendor terms with no SPDX id; `license_class` is "firmware" (PSPU §18)
# unless a family is genuinely free software.

[family.iwlwifi]
description = "Intel Wireless Wi-Fi (iwlwifi) firmware"
drivers  = ["iwlwifi"]
license  = "LicenseRef-Intel-Firmware"

[family.atheros]
description = "Qualcomm Atheros Wi-Fi and Bluetooth firmware"
drivers  = ["ar9170", "ath9k_htc", "ath3k", "ath6kl", "ath10k", "ath11k", "ath12k",
            "ar5523", "carl9170", "wil6210", "btqca", "qca",
            "DFU Driver for Atheros bluetooth chipset AR3012",
            "Atheros AR300x UART HCI Bluetooth Chip driver"]
license  = "BSD-3-Clause AND GPL-2.0-or-later AND LicenseRef-Qualcomm-Atheros-Firmware AND LicenseRef-Qualcomm-Firmware"

[family.mediatek]
description = "MediaTek Wi-Fi and Bluetooth firmware (mt76, mt79xx, btmtk)"
drivers  = ["mt7601u", "btmtk_usb", "btmtk", "mt76x0", "mt76x2e", "mt76x2u", "mt7615e", "mt7622",
            "mt7663", "mt7915e", "mt7902", "mt7920", "mt7921", "mt7922", "mt7925", "mt7927", "mt7996e",
            "mtk_wed", "mtk-2p5ge"]
license  = "LicenseRef-MediaTek-Firmware"

[family.ralink]
description = "Ralink rt2x00 Wi-Fi firmware"
drivers  = ["rt61pci", "rt73usb", "rt2800pci", "rt2860sta", "rt2800usb", "rt2870sta"]
license  = "LicenseRef-Ralink-Firmware"

[family.realtek]
description = "Realtek Wi-Fi, Bluetooth, Ethernet, and audio firmware"
drivers  = ["r8712u", "rtl8[0-9a-z]+", "rtw88", "rtw89", "r8169", "r8152", "rt1320"]
paths    = ["rtl_bt/*"]
license  = "LicenseRef-Realtek-Firmware"

[family.broadcom]
description = "Broadcom and Cypress Wi-Fi, Bluetooth, and Ethernet firmware"
drivers  = ["brcmfmac", "brcmsmac", "BCM-0bb4-0306", "tg3", "bnx2", "bnx2x"]
license  = "GPL-2.0-only AND LicenseRef-Broadcom-Firmware AND LicenseRef-Cypress-Firmware"

[family.marvell]
description = "Marvell and NXP Wi-Fi and Bluetooth firmware"
drivers  = ["libertas", "mwl8k", "mwifiex", "mwlwifi", "nxpwifi", "btnxpuart", "nxp-sr1xx"]
license  = "LicenseRef-Marvell-Firmware AND LicenseRef-NXP-Firmware"

[family.amd-graphics]
description = "AMD Radeon graphics firmware (amdgpu, radeon, r128)"
drivers  = ["amdgpu", "radeon", "r128", "isp"]
license  = "LicenseRef-AMD-Firmware AND MIT"

[family.amd-platform]
description = "AMD platform firmware: PSP/SEV (ccp), Platform Management Framework, XDNA NPU"
drivers  = ["ccp", "amd_pmf", "amdxdna"]
license  = "LicenseRef-AMD-Firmware"

[family.intel-graphics]
description = "Intel graphics firmware (i915, xe: GuC, HuC, DMC)"
drivers  = ["i915", "xe"]
license  = "LicenseRef-Intel-Firmware"

[family.intel-platform]
description = "Intel platform, sensor, camera, accelerator, and NIC firmware"
drivers  = ["btusb", "ish", "atomisp", "ipu3-imgu", "intel-ipu6-isys", "intel-ipu7-isys", "mei-vsc-hw",
            "intel_vpu", "qat", "ice", "e100", "isci"]
license  = "GPL-2.0-only AND LicenseRef-Dell-Firmware AND LicenseRef-HP-Firmware AND LicenseRef-Intel-Firmware AND LicenseRef-Lenovo-Firmware"
# btusb's block also lists Realtek Bluetooth blobs (rtl_bt/); the realtek
# family's path pattern claims those first — see the matching note above.

[family.intel-sound]
description = "Intel AVS, catpt, and Skylake SST audio DSP firmware"
drivers  = ["snd_soc_sst_acpi", "snd_soc_catpt", "snd_soc_avs", "snd_intel_sst_core", "snd-soc-skl"]
license  = "Apache-2.0 AND LicenseRef-Intel-Firmware"

[family.nvidia-graphics]
description = "NVIDIA GPU firmware for nouveau and nova (GSP)"
drivers  = ["nouveau"]
license  = "LicenseRef-NVIDIA-Firmware"

[family.audio-codecs]
description = "Laptop audio codec and amplifier firmware"
drivers  = ["cs35l41", "cs35l56", "cs42l43", "cs42l45", "ti-tas257x", "ti-tas2781", "ti-tas2783", "ti-tas2563", "PCM6240",
            "snd-hda-codec-ca0132"]
license  = "LicenseRef-Cirrus-Firmware AND LicenseRef-TI-Firmware AND LicenseRef-Creative-Firmware"

[family.nic]
description = "Wired Ethernet adapter and PHY firmware"
drivers  = ["cxgb3", "cxgb4", "qed", "myri10ge", "tehuti", "typhoon", "vxge", "slicoss", "sxg", "netxen_nic",
            "kaweth", "starfire", "as21xxx"]
license  = "GPL-2.0-only AND LicenseRef-3Com-Firmware AND LicenseRef-Aeonsemi-Firmware AND LicenseRef-Alacritech-Firmware AND LicenseRef-Chelsio-Firmware AND LicenseRef-Exar-Firmware AND LicenseRef-Kaweth-Firmware AND LicenseRef-Myricom-Firmware AND LicenseRef-NetLogic-Firmware AND LicenseRef-QLogic-Firmware AND LicenseRef-Tehuti-Firmware"

[family.storage]
description = "Storage HBA, Fibre Channel, and card-reader firmware"
drivers  = ["qla2xxx", "qla1280", "advansys", "BFA/BNA", "ene-ub6250"]
license  = "LicenseRef-QLogic-Firmware AND LicenseRef-AdvanSys-Firmware AND LicenseRef-ENE-Firmware"

[family.misc]
description = "Miscellaneous x86 peripheral firmware"
drivers  = ["keyspan", "keyspan_pda", "emi26", "ti_usb_3410_5052", "whiteheat", "io_edgeport", "io_ti",
            "mxu11x0", "mxuport", "rp2",
            "cpia2", "dabusb", "cx231xx", "cx23418", "cx23885", "cx23840", "dvb-ttpci", "xc4000", "xc5000",
            "dib0700", "drxk", "it9135", "as102", "smsmdtv", "go7007", "s2255drv", "tlg2300",
            "usbdux/usbduxfast/usbduxsigma",
            "orinoco", "vt6656", "cw1200", "rsi", "wfx", "wilc1000", "mm81x", "atusb",
            "pcnet_cs", "3c589_cs", "3c574_cs", "serial_cs", "smc91c92_cs",
            "snd-sb16-csp", "snd-wavefront", "dsp56k", "bmi260", "Mont-TSSE"]
license  = "GPL-1.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later AND GPL-3.0-only AND LicenseRef-Abilis-Firmware AND LicenseRef-Agere-Firmware AND LicenseRef-Atmel-Firmware AND LicenseRef-BayCom-Firmware AND LicenseRef-Bosch-Firmware AND LicenseRef-Comtrol-Firmware AND LicenseRef-Conexant-Firmware AND LicenseRef-Cresta-Firmware AND LicenseRef-DiBcom-Firmware AND LicenseRef-Emagic-Firmware AND LicenseRef-ITE-Firmware AND LicenseRef-Keyspan-Firmware AND LicenseRef-Micronas-Firmware AND LicenseRef-Montage-Firmware AND LicenseRef-Morse-Micro-Firmware AND LicenseRef-Moxa-Firmware AND LicenseRef-Multi-Tech-Firmware AND LicenseRef-Redpine-Firmware AND LicenseRef-STMicroelectronics-Firmware AND LicenseRef-Sagrad-Firmware AND LicenseRef-Sensoray-Firmware AND LicenseRef-Siano-Firmware AND LicenseRef-Silicon-Labs-Firmware AND LicenseRef-Telegent-Firmware AND LicenseRef-TerraTec-Firmware AND LicenseRef-VIA-Firmware AND LicenseRef-Xceive-Firmware"

# Not shipped. Non-x86 SoC firmware, datacentre switch and accelerator blobs,
# and blobs Peios packages elsewhere. Listed explicitly so that the gate
# still catches anything genuinely new.
[ignore]
drivers = [
  # Shipped by the amd-ucode package (early-loaded microcode, not this path).
  "microcode_amd",
  # Qualcomm SoC, Adreno, remoteproc, video and modem firmware — ARM platforms.
  "adreno", "venus", "iris", "qcom_q6v5_pas", "qcom_q6v5_mss", "qaic", "qdu100", "qcom-geni-se",
  "sdx61", "sdx35", "Qualcomm ASoC tplg Firmware",
  # Other ARM SoCs.
  "ixp4xx-npe", "imx-sdma", "s5p-mfc", "xhci-rcar", "pcie-rcar-gen4", "xhci-tegra", "tegra-vic",
  "meson-vdec", "amlogic", "rk3399-dptx", "panthor", "powervr", "knav_qmss_queue", "ti-vpe",
  "mtk-vpu", "mt8196", "mtk_scp", "mtk-sof", "cdns-mhdp", "amphion", "wave5", "wave6",
  "lt7911exc", "lt8713sx", "lt9611c", "lt9611uxc", "mscc-phy", "airoha-npu-7581",
  "airoha-npu-7581-mt7996", "airoha-npu-7583", "en8811h", "an8811hb", "fsl-mc bus",
  "wl1251", "wl12xx", "wl18xx", "cc33xx", "TI_ST", "ueagle-atm",
  # Datacentre switches, SmartNICs, InfiniBand/OPA and crypto accelerators.
  "mlxsw_spectrum", "nfp", "prestera", "rvu_cptpf", "liquidio", "nitrox", "inside-secure",
  "ib_qib", "hfi1", "mga",
]

# Every vendor licence text a packaged family's blobs cite, mapped to the SPDX
# identifier Peios declares for it. A text no family cites any more fails the
# build, as does a newly cited one with no entry: read it, then add it here.
# Identifiers name the licensor; several texts from one licensor share one.
