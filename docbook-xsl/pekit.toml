# docbook-xsl — the DocBook XSL stylesheets. Data, not code: a tree of XSLT
# that xsltproc applies to turn DocBook XML into man pages, HTML and the
# rest. Here for the man pages perf, libperf and kvm_stat write as asciidoc
# (PEI-535).
#
# The NON-namespaced ("nons") 1.79.2 release, which is what Debian and Fedora
# ship as their docbook-xsl. DocBook 4.x documents -- which is what asciidoc
# emits and what the kernel tools' sources are -- carry no namespace, and the
# namespaced stylesheets handle them by converting the whole document first.
# That conversion is not free: it feeds much longer strings through
# lib.xsl's string.subst, which recurses once per match, and perf's larger
# pages then blow libxslt's 3000-deep template limit outright ("a potential
# infinite template recursion was detected"). The nons stylesheets process
# DocBook 4 directly and the pages render.
#
# No build: unpack, trim, and write a catalog. The catalog is the whole
# point of the package. A DocBook stylesheet is referenced by a canonical
# URI rather than a path, so a customisation layer that says
#
#   <xsl:import href="http://docbook.sourceforge.net/release/xsl/current/manpages/docbook.xsl"/>
#
# resolves only if an XML catalog rewrites that URI onto a local file --
# otherwise xsltproc goes to the network, which a build root has none of.
# Upstream's own catalog.xml covers only the newer cdn.docbook.org form, so
# this recipe writes one covering both -- and pointing the classic
# `.../release/xsl/...` names at this nons tree, which is exactly the mapping
# Debian and Fedora publish.
#
#   pekit publish --version 1.79.2 --env peipkg --keyring dev

out_dir = "out"

[source.url]
url      = "https://github.com/docbook/xslt10-stylesheets/releases/download/release/{{version}}/docbook-xsl-nons-{{version}}.tar.bz2"
extract  = true
root     = "docbook-xsl-nons-{{version}}"
versions = ">= 1.79.2"

[build.main]
command = """
SRC="$(pwd)"
# Unversioned destination: the pool carries one DocBook XSL at a time, and a
# versioned path would make every consumer's catalog setting a moving target.
XSL="$PEKIT_OUT/usr/share/xml/docbook/xsl-stylesheets"
mkdir -p "$XSL"
cp -a "$SRC"/. "$XSL/"

# Trim to the stylesheets themselves. Dropped: the documentation and its
# sources, the test corpus, the Java extensions and the tools that need
# them, and the editor/website scaffolding -- none of which xsltproc reads.
rm -rf "$XSL/doc" "$XSL/docsrc" "$XSL/tests" "$XSL/extensions" "$XSL/tools" \
       "$XSL/webhelp" "$XSL/website" "$XSL/eclipse" "$XSL/javahelp" \
       "$XSL/htmlhelp" "$XSL/slides" "$XSL/roundtrip" "$XSL/template" \
       "$XSL/images" "$XSL/build.xml" "$XSL/Makefile" "$XSL/install.sh"
rm -f "$XSL"/RELEASE-NOTES.* "$XSL"/NEWS.html "$XSL"/NEWS.xml
find "$XSL" -name 'build.xml' -delete
find "$XSL" -name '.git*' -delete

# The catalog. Upstream ships one for the cdn.docbook.org URIs; the
# docbook.sourceforge.net form is what asciidoc's customisation layers and
# xmlto's format scripts actually name, and it is not in upstream's file.
# Both are written here, "current" and the exact version, for URI and system
# identifier alike -- the four rewrites every distribution's catalog carries.
cat > "$XSL/catalog.xml" <<'EOC'
<?xml version="1.0" encoding="utf-8"?>
<!-- XML Catalog for the DocBook XSL Stylesheets, as packaged by Peios.
     Rewrites the canonical DocBook stylesheet URIs onto this local tree, so
     that a transform resolves offline. -->
<catalog xmlns="urn:oasis:names:tc:entity:xmlns:xml:catalog">
  <rewriteURI    uriStartString="http://cdn.docbook.org/release/xsl/current/"            rewritePrefix="./"/>
  <rewriteSystem systemIdStartString="http://cdn.docbook.org/release/xsl/current/"       rewritePrefix="./"/>
  <rewriteURI    uriStartString="http://cdn.docbook.org/release/xsl/1.79.2/"             rewritePrefix="./"/>
  <rewriteSystem systemIdStartString="http://cdn.docbook.org/release/xsl/1.79.2/"        rewritePrefix="./"/>
  <rewriteURI    uriStartString="http://docbook.sourceforge.net/release/xsl/current/"    rewritePrefix="./"/>
  <rewriteSystem systemIdStartString="http://docbook.sourceforge.net/release/xsl/current/" rewritePrefix="./"/>
  <rewriteURI    uriStartString="http://docbook.sourceforge.net/release/xsl/1.79.2/"     rewritePrefix="./"/>
  <rewriteSystem systemIdStartString="http://docbook.sourceforge.net/release/xsl/1.79.2/" rewritePrefix="./"/>
</catalog>
EOC

# The system catalog, at the bottom layer of the /etc merge: libxml2 reads
# /etc/xml/catalog by default, so on a booted system a transform resolves
# with no environment set at all. A build root has no /etc merge, so recipes
# there set XML_CATALOG_FILES at this file's /usr path instead.
#
# This package owns the file, and delegates to the DocBook DTD's catalog as
# well as its own, because the two are a matched pair: a2x validates against
# the DTD and then transforms with these stylesheets. A missing nextCatalog
# target is skipped rather than fatal, so the file is correct with
# docbook-xml absent.
#
# It does not generalise. A third contributor would want its own entry here,
# in a package it does not own, which is the point at which this needs a real
# drop-in mechanism -- a peipkg side effect that regenerates the catalog, the
# way distributions run `xmlcatalog --add` from a post-install hook.
mkdir -p "$PEKIT_OUT/usr/etc/xml"
cat > "$PEKIT_OUT/usr/etc/xml/catalog" <<'EOC'
<?xml version="1.0" encoding="utf-8"?>
<catalog xmlns="urn:oasis:names:tc:entity:xmlns:xml:catalog">
  <nextCatalog catalog="/usr/share/xml/docbook/xsl-stylesheets/catalog.xml"/>
  <nextCatalog catalog="/usr/share/xml/docbook/schema/dtd/4.5/catalog.xml"/>
</catalog>
EOC

# Prove the catalog resolves rather than assuming it: ask xmlcatalog to map
# the URI xmlto and asciidoc actually use, and check it lands on a real file.
resolved=$(XML_CATALOG_FILES="$XSL/catalog.xml" xmlcatalog "$XSL/catalog.xml" \
  "http://docbook.sourceforge.net/release/xsl/current/manpages/docbook.xsl")
echo "catalog resolves manpages/docbook.xsl -> $resolved"
case "$resolved" in
  *manpages/docbook.xsl) ;;
  *) echo "docbook-xsl: catalog did not resolve the manpages stylesheet" >&2; exit 1 ;;
esac
"""

[build.main.dependencies.peipkg]
dash                = "*"
"org.gnu.coreutils" = "*"
findutils           = "*"
"libxml2-utils" = "*"

[build.main.dependencies.apt]
libxml2-utils = "*"
