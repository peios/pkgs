format = "peipkg"

[package]
name         = "findutils"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU find and xargs (locate/updatedb not packaged)"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/findutils/"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING*" = "usr/share/licenses/findutils/"
":usr/bin/**"       = "usr/bin"
":usr/share/man/**" = "usr/share/man"
