# Workspace-shared package config.
#
# This is NOT a package on its own — it has no format/[files], so it never
# validates standalone. It is a defaults layer merged UNDER every member's
# package definition (detected only because workspace.pekit.toml sits
# beside it).
#
# Merge precedence, lowest to highest:
#
#   this root  <  the package's source  <  the member's own recipe
#
# So these are fallbacks: a member, or its upstream source, overrides
# anything set here; the root only supplies what neither does — like the
# publish target, which upstreams don't know about.

# Every package's runtime [dependencies] name Peipkg packages, so they belong
# to the peipkg dependency provider. Workspace ordering follows them when the
# selected env's provider is peipkg (and never under the apt-backed Debian
# env, whose builds install nothing this catalogue produces).
dependency_provider = "peipkg"

#
# The signed Peios repository every recipe publishes to, and the one native
# builds install their dependencies from. Per-recipe out/ trees remain the
# regeneratable staging area, so publication does not duplicate every artifact
# into a flat pool. The keyring selects environment-specific key custody
# without putting a key path or private material in version control.
# _repo2_ is the September 2026 rebootstrap's repository; the older
# _peipkgRepo_ stays in place, frozen, for images still composed from it.
# _peiroot_/snapshot-repository.py names the same directory.
[publish.peipkg]
path = "_repo2_"
name = "peios"
signing_key = "keyring:signing.repository_key"
