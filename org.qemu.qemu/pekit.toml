# QEMU — the machine emulator, packaged as qemu-system-x86_64 alone.
#
# Its first consumer is the kernel family: pkm's test.kunit, test.modsig,
# test.fwsig and test.stratafs boot the kernel they built in QEMU (PEI-534),
# which needs a Peios QEMU. The build is therefore the
# headless x86 system emulator and nothing else: one target, KVM and TCG,
# pixman, no GUI, audio, network backends, block drivers, user-mode
# emulation or tools. --without-default-features makes that explicit: every
# optional feature is off unless named below, so a dependency appearing in the
# root cannot silently widen the package.
#
# Python. configure runs its tooling from a venv that upstream fills with pip;
# Peios ships no pip. peios-patches/0001 lets that venv use the system meson
# and distlib (io.pypa.distlib) without pip, and leaves out the pip-installed
# tooling group and pycotap, which only QEMU's own test scripts use.
#
# Firmware. Even a direct -kernel boot runs SeaBIOS and a linuxboot/multiboot
# option ROM, and the default pc/q35 devices load their VGA and NIC ROMs. The
# release tarball carries upstream's prebuilt blobs together with their
# sources under roms/ (so the corresponding-source package has them); the
# stock install_blobs step would also install firmware for eight other
# architectures, several of them foreign ELF files. Only the x86 firmware is
# installed, by the list below.

tags = ["bootstrap"]
out_dir = "out"

[source.url]
url         = "https://download.qemu.org/qemu-{{version}}.tar.xz"
listing_url = "https://download.qemu.org/"
file_regex  = 'qemu-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz'
# Unpacked by the build, not by Pekit: the tarball's EDK2 tree carries a
# symlink out of the source root (roms/edk2/EmulatorPkg/Unix/Host/
# X11IncludeHack -> /usr/include/X11), which Pekit's extractor rightly
# refuses. The build leaves roms/edk2 out, since UEFI firmware is not built
# or installed; the corresponding-source package carries the tarball whole.
extract     = false
# Soft maintenance floor. Stable releases are followed automatically; the
# emulator and boot gates below catch a release that changes the contract.
versions    = ">= 11.1.0"

# Release tarballs are signed by QEMU's release manager. The key file is the
# keyserver.ubuntu.com copy: keys.openpgp.org serves a self-signature whose
# expiry has passed, while this one carries the extension (to 2031).
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/michael-roth.asc"]
fingerprints = ["CEACC9E15534EBABB82D3FA03353C9CEF108B584"]

[build.main]
command = '''
set -eu
WORK="$PEKIT_OUT/work"
SRC="$WORK/qemu-$PEKIT_VERSION"
BUILD="$WORK/build"
PREFIX="$PEKIT_OUT/usr"
DATA="$PREFIX/share/qemu"
LICENSES="$PREFIX/share/licenses/org.qemu.qemu-system-x86"

mkdir -p "$WORK"
tar -C "$WORK" -xf "qemu-$PEKIT_VERSION.tar.xz" \
  --exclude="qemu-$PEKIT_VERSION/roms/edk2"
# Pekit's [source] patches apply to an extracted tree, and this one is
# unpacked here, so the recipe's own patches are applied here too.
for p in "$PEKIT_RECIPE_ROOT"/peios-patches/*.patch; do
  patch -d "$SRC" -p1 --no-backup-if-mismatch < "$p"
done

# configure hands its own flags to meson; pass the distribution's through it
# once rather than also through the environment meson reads.
EXTRA_CFLAGS="$CFLAGS -fmacro-prefix-map=$WORK=/usr/src/debug/org.qemu.qemu"
EXTRA_LDFLAGS="$LDFLAGS"
unset CFLAGS CXXFLAGS LDFLAGS

# Peios installs meson as a private application, its modules and dist-info in
# /usr/lib/<triplet>/meson rather than site-packages. QEMU's venv finds the
# meson distribution, and runs the launcher it generates from it, only with
# that directory on the path; it stays set for the build, which re-runs meson.
export PYTHONPATH=/usr/lib/x86_64-linux-peios/meson

mkdir -p "$BUILD"
cd "$BUILD"
# The build venv (mkvenv) is created with system site-packages and accepts the
# system meson (>= 1.5); distlib is what mkvenv needs to inspect it. Nothing is
# downloaded: the release tarball carries every subproject the build uses.
"$SRC/configure" \
  --prefix=/usr \
  --libdir=lib/x86_64-linux-peios \
  --sysconfdir=/etc \
  --localstatedir=/var \
  --python=python3 \
  --disable-download \
  --without-default-features \
  --target-list=x86_64-softmmu \
  --enable-system \
  --enable-kvm \
  --enable-tcg \
  --enable-pixman \
  --disable-install-blobs \
  --disable-docs \
  --disable-werror \
  --extra-cflags="$EXTRA_CFLAGS" \
  --extra-ldflags="$EXTRA_LDFLAGS"

make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
cd "$WORK"

# Licences: QEMU's own, and those of the firmware installed below.
install -Dm644 "$SRC/COPYING" "$LICENSES/COPYING"
install -Dm644 "$SRC/COPYING.LIB" "$LICENSES/COPYING.LIB"
install -Dm644 "$SRC/LICENSE" "$LICENSES/LICENSE"
install -Dm644 "$SRC/pc-bios/README" "$LICENSES/FIRMWARE-README"
install -Dm644 "$SRC/roms/seabios/COPYING.LESSER" "$LICENSES/SEABIOS-COPYING.LESSER"
install -Dm644 "$SRC/roms/ipxe/COPYING.GPLv2" "$LICENSES/IPXE-COPYING.GPLv2"
install -Dm644 "$SRC/roms/ipxe/COPYING.UBDL" "$LICENSES/IPXE-COPYING.UBDL"
install -Dm644 "$SRC/roms/qboot/LICENSE" "$LICENSES/QBOOT-LICENSE"
for pkg in org.qemu.qemu-debuginfo org.qemu.qemu-debugsource; do
  install -Dm644 "$SRC/COPYING" "$PREFIX/share/licenses/$pkg/COPYING"
done

# Desktop integration for a GUI this build does not have; keyboard maps for
# the VNC, SDL and GTK front ends it does not have either; and the device
# trees meson installs regardless of targets, all for PowerPC and MicroBlaze
# boards.
rm -rf "$PREFIX/share/applications" "$PREFIX/share/icons" \
  "$DATA/keymaps" "$DATA/dtb"

# x86 firmware only: SeaBIOS (pc, isa-vga and microvm builds), qboot, the
# linuxboot/multiboot/PVH option ROMs and KVM's vapic ROM, SeaVGABIOS for each
# x86 display device, and iPXE's EFI ROMs for the NICs pc and q35 create.
mkdir -p "$DATA"
for blob in \
  bios.bin bios-256k.bin bios-microvm.bin qboot.rom \
  linuxboot_dma.bin multiboot_dma.bin pvh.bin kvmvapic.bin \
  vgabios.bin vgabios-ati.bin vgabios-bochs-display.bin vgabios-cirrus.bin \
  vgabios-qxl.bin vgabios-ramfb.bin vgabios-stdvga.bin vgabios-virtio.bin \
  vgabios-vmware.bin \
  efi-e1000.rom efi-e1000e.rom efi-eepro100.rom efi-ne2k_pci.rom \
  efi-pcnet.rom efi-rtl8139.rom efi-virtio.rom efi-vmxnet3.rom; do
  install -m 0644 "$SRC/pc-bios/$blob" "$DATA/$blob"
done

# Build-ID debug data and the source tree it references, then strip.
: > "$PEKIT_OUT/.srclist"
for elf in "$PREFIX/bin/qemu-system-x86_64"; do
  debugedit -b "$WORK" -d /usr/src/debug/org.qemu.qemu \
    -l "$PEKIT_OUT/.dl" -n "$elf"
  tr '\0' '\n' < "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist"
  bid=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$bid"
  p2=$(printf %s "$bid" | cut -c1-2)
  rest=$(printf %s "$bid" | cut -c3-)
  mkdir -p "$PREFIX/lib/debug/.build-id/$p2"
  objcopy --only-keep-debug "$elf" "$PREFIX/lib/debug/.build-id/$p2/$rest.debug"
  chmod 0644 "$PREFIX/lib/debug/.build-id/$p2/$rest.debug"
  strip "$elf"
done
LC_ALL=C sort -u "$PEKIT_OUT/.srclist" | while IFS= read -r rel; do
  test -n "$rel" || continue
  case "$rel" in */) continue;; esac
  test -f "$WORK/$rel" || continue
  mkdir -p "$PREFIX/src/debug/org.qemu.qemu/$(dirname "$rel")"
  cp "$WORK/$rel" "$PREFIX/src/debug/org.qemu.qemu/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
# The unpacked tree and build directory are scratch, not payload.
rm -rf "$WORK"
'''

[build.main.dependencies.peipkg]
"org.git.kernel.dash"                     = "*"
"org.gnu.bash"                            = "*"
"dev.peios.peiosutils"                    = "*"
"org.gnu.tar"                             = "*"
"org.tukaani.xz"                          = "*"
"org.gnu.patch"                           = "*"
"org.gnu.sed"                             = "*"
"org.gnu.grep"                            = "*"
"org.gnu.gawk"                            = "*"
"org.gnu.findutils"                       = "*"
"org.gnu.diffutils"                       = "*"
"org.gnu.make"                            = "*"
"dev.peios.build-essentials-c"            = "*"
"org.gnu.binutils"                        = "*"
"org.sourceware.debugedit"                = "*"
"org.python.python3"                      = ">= 3.14, < 3.15"
"io.pypa.distlib"                         = "*"
"com.mesonbuild.meson"                    = ">= 1.5"
"org.ninja-build.ninja"                   = "*"
"org.pkgconf.pkgconf"                     = "*"
"org.gnome.glib-devel"                    = ">= 2.66"
"org.pixman.pixman-devel"                 = "*"
"io.github.zlib-ng.zlib-ng-compat-devel"  = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
QEMU="$STAGE/usr/bin/qemu-system-x86_64"
DATA="$STAGE/usr/share/qemu"
WORK="$PEKIT_OUT/smoke"
mkdir -p "$WORK"

"$QEMU" --version | grep -F "QEMU emulator version $PEKIT_VERSION"
"$QEMU" -machine help | grep -E '^pc '
"$QEMU" -machine help | grep -E '^q35 '
"$QEMU" -accel help | grep -Fx tcg
"$QEMU" -accel help | grep -Fx kvm
for dev in virtio-blk-pci virtio-net-pci virtio-serial-pci isa-debug-exit; do
  "$QEMU" -device help | grep -F "name \"$dev\""
done

# Boot a freestanding multiboot image under TCG on both machine types, with
# their default devices, the way the kernel's test stages boot: SeaBIOS, the
# multiboot option ROM and the default VGA ROM all have to load. The image
# prints a marker on COM1 and leaves through isa-debug-exit, so QEMU's exit
# status is (0x31 << 1) | 1 = 99.
cat > "$WORK/boot.S" <<'EOF'
.section .multiboot, "a"
.align 4
.long 0x1BADB002
.long 0x00000000
.long -(0x1BADB002)
.text
.code32
.global _start
_start:
  mov $msg, %esi
1: lodsb
  test %al, %al
  jz 2f
  mov $0x3f8, %dx
  out %al, %dx
  jmp 1b
2: mov $0x31, %al
  out %al, $0xf4
3: hlt
  jmp 3b
.section .rodata
msg: .asciz "PEIOS-QEMU-SMOKE-OK\n"
EOF
cat > "$WORK/boot.ld" <<'EOF'
ENTRY(_start)
SECTIONS {
  . = 0x100000;
  .text : { *(.multiboot) *(.text*) }
  .rodata : { *(.rodata*) }
  /DISCARD/ : { *(.note*) *(.comment) }
}
EOF
as --32 -o "$WORK/boot.o" "$WORK/boot.S"
ld -m elf_i386 -T "$WORK/boot.ld" --build-id=none -z noexecstack -o "$WORK/boot.elf" "$WORK/boot.o"
for machine in pc q35; do
  rm -f "$WORK/serial-$machine.log"
  set +e
  timeout 120 "$QEMU" -L "$DATA" -machine "$machine,accel=tcg" -m 64 \
    -display none -monitor none -no-reboot \
    -serial "file:$WORK/serial-$machine.log" \
    -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
    -kernel "$WORK/boot.elf"
  status=$?
  set -e
  test "$status" -eq 99
  grep -Fx 'PEIOS-QEMU-SMOKE-OK' "$WORK/serial-$machine.log"
done

# Payload: the emulator, the x86 firmware and nothing for other architectures.
for blob in bios-256k.bin linuxboot_dma.bin multiboot_dma.bin kvmvapic.bin \
  vgabios-stdvga.bin efi-e1000.rom efi-e1000e.rom efi-virtio.rom; do
  test -s "$DATA/$blob"
done
test ! -e "$DATA/openbios-sparc32"
test ! -e "$DATA/s390-ccw.img"
test ! -e "$DATA/dtb"
test ! -e "$DATA/keymaps"
test -s "$DATA/trace-events-all"
test -z "$(find "$STAGE/usr/share" -name '*.desktop' -print -quit)"

# Hardening of the one ELF program shipped.
readelf -h "$QEMU" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l "$QEMU" | grep -E 'GNU_STACK.*RW '
readelf -W -l "$QEMU" | grep -F 'GNU_RELRO'
readelf -d "$QEMU" | grep -F 'BIND_NOW'
if readelf -d "$QEMU" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
readelf -n "$QEMU" | grep -E 'x86 feature:.*IBT.*SHSTK'
test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test -n "$(find "$STAGE/usr/src/debug/org.qemu.qemu" -type f -print -quit)"
'''

[test.dependencies.peipkg]
"org.git.kernel.dash"   = "*"
"org.gnu.bash"          = "*"
"dev.peios.peiosutils"  = "*"
"org.gnu.grep"          = "*"
"org.gnu.findutils"     = "*"
"org.gnu.binutils"      = "*"
"org.gnome.glib"        = ">= 2.66"
"org.pixman.pixman"     = "*"
"io.github.zlib-ng.zlib-ng-compat" = "*"
