[elf]
debuginfo = "org.qemu.qemu-debuginfo"

# QEMU's manual (qemu.1) is generated from docs/ by Sphinx, with QEMU's own
# hxtool and kernel-doc extensions; Peios does not package Sphinx, so the build
# runs with --disable-docs. `qemu-system-x86_64 -help` documents every option.
[allow_files."payload.manpages.required"]
"usr/bin/qemu-system-x86_64" = "The manual is generated by Sphinx with QEMU's own extensions, and Sphinx is not packaged for Peios; -help documents every option"
