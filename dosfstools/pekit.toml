# dosfstools — the FAT12/16/32 userspace: mkfs.fat, fsck.fat, fatlabel.
#
# Peios needs this for exactly one thing today: the EFI system partition. An
# ESP is FAT by UEFI specification, so a disk installation cannot create its
# own boot partition without a FAT formatter. Until this landed, the only
# mkfs.vfat in the picture was the BUILD HOST's, called by peiso when it packs
# the ISO's ESP (peiso/internal/build/iso.go) — fine for a build host, absent
# on a running Peios.
#
# Unlike e2fsprogs, this needs no FUNCTIONAL patchset. A FAT filesystem has no
# extended attributes and therefore no way to hold a security descriptor;
# there is nothing for the SD-stamping work to extend. An ESP is governed at
# the mount, not on disk — see the mount-policy classes, where FAT is
# necessarily facs_synthesize_ephemeral. The one patch carried here fixes the
# upstream test harness, not the tools.
#
#   pekit publish --version 4.2 --env peipkg --keyring dev

out_dir = "out"

# One patch, and it touches only the test harness — see patches/series.
[source]
patches = "patches"

# 4.2 (2021) is the current release; dosfstools is mature and quiet. GitHub
# release tarball rather than the git tree, which commits no configure.
[source.url]
url      = "https://github.com/dosfstools/dosfstools/releases/download/v{{version}}/dosfstools-{{version}}.tar.gz"
extract  = true
root     = "dosfstools-{{version}}"
versions = ">= 4.2"

# --- main: out-of-source configure/make/install -----------------------------
#   --enable-compat-symlinks : installs the mkfs.<type>/fsck.<type> names.
#       These are load-bearing, not cosmetic: `fsck` dispatches by exec'ing
#       fsck.<type> (e2fsprogs misc/fsck.c), and `mkfs.vfat` is the name every
#       ESP recipe in existence uses. Three PRE-4.0 aliases come with them and
#       are removed below.
#   iconv is left enabled: it is used to convert long-filename charsets, and
#       glibc provides iconv in libc, so this adds no dependency.
#   --enable-atari-check is deliberately absent (default off) — a runtime probe
#       for 68k Atari hardware.
[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"

# --sbindir=/usr/bin: /sbin is for daemons, which appear in service
# definitions. mkfs.fat, fsck.fat and fatlabel are privileged binaries a PERSON
# runs, so they belong in /usr/bin.
"$SRC/configure" --prefix=/usr --sbindir=/usr/bin --mandir=/usr/share/man \
  --enable-compat-symlinks
make -j"$(nproc)"

# The upstream suite is 20-plus mkfs and fsck cases against known-good
# reference images, and it is the only real evidence that this package
# produces correct filesystems. It expands those images with `xxd`, and when
# xxd is missing it SKIPS every test rather than failing — a green result that
# proves nothing. Peios packages no xxd, so on the peipkg rung it would always
# skip. Say which of the two happened instead of leaving it to be inferred.
if command -v xxd >/dev/null 2>&1; then
  make check
else
  echo "dosfstools: upstream test suite NOT run — no xxd in this build root, every case would skip" >&2
fi

make install DESTDIR="$PEKIT_OUT"

# Drop the pre-4.0 command names. `mkfs.vfat`/`mkfs.msdos`/`fsck.vfat`/
# `fsck.msdos` are kept because they are a contract — the type name in
# `mkfs -t`, `fsck -t` and `mount -t` is what gets exec'd. `mkdosfs`,
# `dosfsck` and `dosfslabel` are aliases for dosfstools <= 3.x command names,
# a compatibility burden Peios does not carry: nothing on this system has ever
# been able to call them.
for legacy in mkdosfs dosfsck dosfslabel; do
  rm -f "$PEKIT_OUT/usr/bin/$legacy" "$PEKIT_OUT/usr/share/man/man8/$legacy.8"
done

# The fsck.<type> names are the private interface `fsck` execs once it has
# chosen a filesystem type, not commands a person types, and e2fsprogs' patched
# fsck_prefix_path looks for them in /libexec/fsck. Publish all three there.
#
# fsck.fat is BOTH: the real program's own name, which a person does type, and
# the type name `fsck -t fat` dispatches on. So the binary stays put in
# /usr/bin and libexec gets a link to it, exactly like the other two. Only the
# two alias symlinks leave /usr/bin.
#
# `../../bin/fsck.fat` is relative and two levels up on purpose: it resolves to
# /usr/bin/fsck.fat against the packaging path and /bin/fsck.fat against the
# runtime StrataFS view. One link, correct in both.
#
# The mkfs.<type> names stay in /usr/bin: Peios ships no `mkfs` front-end, so
# nothing dispatches on them — they are only ever typed.
mkdir -p "$PEKIT_OUT/usr/libexec/fsck"
rm -f "$PEKIT_OUT/usr/bin/fsck.vfat" "$PEKIT_OUT/usr/bin/fsck.msdos"
for t in fat vfat msdos; do
  ln -s ../../bin/fsck.fat "$PEKIT_OUT/usr/libexec/fsck/fsck.$t"
done

# House convention: packages ship usr/share/licenses/<name>/ and never
# usr/share/doc. dosfstools installs eight ChangeLog/README/ANNOUNCE files
# from the 2.x and mkdosfs era; COPYING is claimed as the licence instead.
rm -rf "$PEKIT_OUT/usr/share/doc"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

# dosfstools carries no Peios patches, so unlike e2fsprogs it builds on rung 1
# as well. That rung is where the test suite can actually run: xxd comes from
# vim-common, which Debian has and Peios does not package.
[build.main.dependencies.apt]
build-essential = "*"
xxd = "*"
