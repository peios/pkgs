# Go 1.24.6 binary bootstrap seed for building Go 1.26 and 1.27.
#
# Go's compiler is self-hosting. Upstream requires Go 1.24.6 or newer to build
# Go 1.26, so this signature-verified upstream release, pinned by Pekit's
# immutable SHA-256 lock, is the explicit binary root of trust. It lives under
# a private prefix and is intended only for the source-built org.golang.go
# recipe.

out_dir = "out"

[source_package]
enabled = false

[source.url]
url      = "https://go.dev/dl/go{{version}}.linux-amd64.tar.gz"
extract  = true
root     = "go"
versions = "= 1.24.6"

# go.dev/dl publishes an armored detached signature beside each archive
# (<archive>.asc, served from dl.google.com), made with a signing subkey of
# Google's Linux package signing key. The pinned primary fingerprint matches
# the key published at https://dl.google.com/linux/linux_signing_key.pub and
# Google's documentation at https://www.google.com/linuxrepositories/.
[source.url.signature]
url          = "{{source_url}}.asc"
of           = "artifact"
key_files    = ["keys/google-linux-signing-key.asc"]
fingerprints = ["EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"]

[build.main]
command = '''
set -eu
SRC=$(pwd -P)
PREFIX="$PEKIT_OUT/usr/lib/x86_64-linux-peios/go-stage0"
mkdir -p "$PREFIX"

# The bootstrap go command needs the matching GOROOT source tree as well as
# bin/ and pkg/tool; copy the complete upstream distribution and remove only
# end-user material irrelevant to compiler bootstrapping.
cp -a "$SRC/." "$PREFIX/"
rm -rf "$PREFIX/doc" "$PREFIX/misc" "$PREFIX/test"

# Upstream's source tree contains prebuilt ELF samples used by debug-package
# tests. They are not part of the bootstrap compiler and must not be treated as
# shipped runtime objects by Peipkg's automatic ELF dependency scanner.
find "$PREFIX/src" -type f -path '*/testdata/*' -exec sh -c '
  for file do
    if readelf -h "$file" >/dev/null 2>&1; then
      rm -f "$file"
    fi
  done
' sh {} +
find "$PREFIX/src" -type f -name .gitignore -delete
find "$PREFIX/src" -type f -path '*/testdata/*'   \( -name '*.o' -o -name '*.a' \) -delete
rm -f "$PREFIX/src/all.rc" "$PREFIX/src/clean.rc" "$PREFIX/src/make.rc" "$PREFIX/src/run.rc"
# The vendored telemetry npm/npx wrappers serve upstream's web development
# workflow only (the source-built org.golang.go drops them too).
rm -f "$PREFIX/src/cmd/vendor/golang.org/x/telemetry/npm" \
  "$PREFIX/src/cmd/vendor/golang.org/x/telemetry/npx"
# Upstream's scripts name /usr/bin/env bash, /usr/bin/perl and the like. Name
# the interpreter through the runtime view instead, keeping any arguments;
# the gate rejects any /usr/bin interpreter left behind. (grep -l exits 1 for
# a batch with no match; that is not an error under pipefail.)
{ find "$PREFIX/src" "$PREFIX/lib" -type f -exec grep -lE \
  '^#! */usr/bin/(env +)?(sh|bash|perl|python3)([[:space:]]|$)' {} + || :; } |
while IFS= read -r script; do
  sed -i -E \
    '1s@^#! */usr/bin/(env +)?(sh|bash|perl|python3)([[:space:]]|$)@#!/bin/\2\3@' \
    "$script"
done


'''

[build.main.dependencies.peipkg]
"org.gnu.coreutils-build-compat" = "*"
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils"   = "*"
"org.gnu.binutils"    = "*"
"org.gnu.findutils"   = "*"
"org.gnu.grep"        = "*"
"org.gnu.sed"         = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
PREFIX="$PEKIT_MAIN_OUT/usr/lib/x86_64-linux-peios/go-stage0"

test -x "$PREFIX/bin/go"
test -x "$PREFIX/bin/gofmt"
test "$($PREFIX/bin/go version | cut -d' ' -f3)" = "go$PEKIT_VERSION"
test "$($PREFIX/bin/go env GOOS)" = linux
test "$($PREFIX/bin/go env GOARCH)" = amd64
test -d "$PREFIX/src/cmd/compile"
test -d "$PREFIX/pkg/tool/linux_amd64"
python3 "$PEKIT_RECIPE_ROOT/verify-seed.py" "$(pwd)" "$PREFIX"
# No shipped script names its interpreter under /usr/bin.
if find "$PREFIX/src" "$PREFIX/lib" -type f \
    -exec sh -c 'for f do head -n 1 "$f" | grep -qE "^#! */usr/bin/" && echo "$f"; done; :' sh {} + |
    grep .; then
  exit 1
fi
mkdir -p "$PEKIT_OUT/smoke"
printf '%s\n' 'package main' 'func main() { var n int; for i := 1; i <= 10; i++ { n += i }; if n != 55 { panic(n) } }' > "$PEKIT_OUT/smoke/main.go"
GOROOT="$PREFIX" GOCACHE="$PEKIT_OUT/cache" GOENV=off GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local CGO_ENABLED=0 \
  "$PREFIX/bin/go" build -o "$PEKIT_OUT/smoke/main" "$PEKIT_OUT/smoke/main.go"
"$PEKIT_OUT/smoke/main"

'''

[test.dependencies.peipkg]
"org.python.python3" = "*"
"org.git.kernel.dash"   = "*"
"dev.peios.peiosutils" = "*"
"org.gnu.findutils"   = "*"
"org.gnu.grep"        = "*"
