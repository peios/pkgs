# libnl — the netlink runtime libraries (core, genl, route, nf, idiag,
# xfrm, ...).

[package]
name        = "libnl"
description = "libnl - netlink protocol runtime libraries"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING" = "usr/share/licenses/libnl/"
":usr/lib/x86_64-linux-peios/libnl-*.so.*" = "usr/lib/x86_64-linux-peios"
