# libnl-devel — headers, .so links, and pkg-config metadata for the
# netlink library suite.

[package]
name        = "libnl-devel"
description = "libnl - headers and link libraries"

[dependencies]
libnl = "{{version}}"

[files]
":usr/include/**"                          = "usr/include"
":usr/lib/x86_64-linux-peios/libnl-*.so"   = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/pkgconfig/**" = "usr/lib/x86_64-linux-peios/pkgconfig"
