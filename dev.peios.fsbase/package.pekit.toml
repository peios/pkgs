# Base metadata shared by the fsbase packages. Each <name>.package.pekit.toml
# (`dev.peios.fsbase`, `dev.peios.fsbase-irf`, and
# `dev.peios.fsbase-stratafs-mount-hooks`) inherits these fields and adds its
# own identity, description, dependencies, and files.
#
# The functional payload of the two skeletons is the empty directories the
# recipe's build mints, carved into two subsets; each also carries the shared
# licence text. The hooks package ships scripts from src/ and lives here
# because what it mounts has to agree with what fsbase-irf mints.
#
# noarch: the payload is empty directories, a symlink, licence text and shell
# hooks, none of it machine code. The skeletons name the x86_64 tuple
# directories and the psABI /lib64 link as layout, not as architecture-specific
# content.
format = "peipkg"

[package]
version      = "1.0.0-1"
architecture = "noarch"
license      = "MIT"
license_class = "free"
homepage     = "https://github.com/peios/pkgs"
