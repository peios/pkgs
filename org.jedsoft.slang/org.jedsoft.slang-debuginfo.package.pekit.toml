[package]
name        = "org.jedsoft.slang-debuginfo"
description = "S-Lang debugging symbols"

[dependencies]
"org.jedsoft.slang"      = "= {{release}}"
"org.jedsoft.slang-libs" = "= {{release}}"

[files]
"@source:COPYING*" = "usr/share/licenses/org.jedsoft.slang-debuginfo/"
":usr/lib/debug/**" = "usr/lib/debug"
