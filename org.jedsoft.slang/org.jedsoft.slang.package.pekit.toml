# slsh, its standard library, and the supported loadable module set.

side_effects = ["man-db"]

[package]
name        = "org.jedsoft.slang"
description = "S-Lang interpreter, standard library, and loadable modules"

[dependencies]
"org.gnu.glibc"                     = ">= 2.43"
"org.jedsoft.slang-libs" = "{{version}}-1"
"io.github.zlib-ng.zlib-ng-compat"                      = ">= 2.3.3"

[files]
"@source:COPYING"                              = "usr/share/licenses/org.jedsoft.slang/"
":usr/bin/slsh"                                = "usr/bin/slsh"
":usr/etc/slsh.rc"                             = "usr/etc/slsh.rc"
":usr/lib/x86_64-linux-peios/slang/**"         = "usr/lib/x86_64-linux-peios/slang"
":usr/share/slsh/**"                           = "usr/share/slsh"
":usr/share/man/man1/slsh.1"                   = "usr/share/man/man1/slsh.1"
