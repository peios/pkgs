# Shared metadata for the complete S-Lang package family and corresponding
# source. The expression includes the installed MIT-derived modules and the
# build-system/source-only licensing carried by the generated source package.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "GPL-2.0-or-later AND X11 AND BSD-3-Clause AND MIT-open-group AND (GPL-3.0-or-later WITH Autoconf-exception-generic-3.0) AND LicenseRef-Public-Domain"
license_class = "free"
homepage      = "https://www.jedsoft.org/slang/"
