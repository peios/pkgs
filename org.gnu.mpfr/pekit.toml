# GNU MPFR — correctly rounded arbitrary-precision floating-point arithmetic.
# GCC uses it for compile-time folding, so the complete upstream correctness
# suite and installed shared/static API tests are release gates.

tags = ["bootstrap", "minimal-bootstrap"]
out_dir = "out"

[source.url]
url         = "https://ftp.gnu.org/gnu/mpfr/mpfr-{{version}}.tar.xz"
listing_url = "https://ftp.gnu.org/gnu/mpfr/"
extract     = true
root        = "mpfr-{{version}}"
file_regex  = 'mpfr-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz'
# Soft maintenance floor. Follow every newer authenticated stable release;
# ABI or arithmetic changes stop at the build and test gates.
versions    = ">= 4.2"

# MPFR's official release page publishes the signer fingerprint and detached
# signatures. Pin Vincent Lefevre's current full primary fingerprint.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/vincent-lefevre.asc"]
fingerprints = ["A534BE3F83E241D918280AEB5831D11A0D4DB02A"]

[build.main]
command = '''
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
export CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$ROOT=/usr/src/debug/org.gnu.mpfr"
cd "$PEKIT_OUT"
"$SRC/configure" \
  --build=x86_64-pc-linux-gnu \
  --host=x86_64-pc-linux-gnu \
  --prefix=/usr \
  --libdir=/usr/lib/x86_64-linux-peios

# Put --as-needed before libraries and suppress an rpath into the system
# library directory. Fedora and Arch apply the same generated-libtool policy.
sed -e 's|^hardcode_libdir_flag_spec=.*|hardcode_libdir_flag_spec=""|g' \
    -e 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' \
    -e 's|CC="\(g..\)"|CC="\1 -Wl,--as-needed"|' \
    -i libtool

make -j"$(nproc)"

make install DESTDIR="$PEKIT_OUT"
find "$PEKIT_OUT/usr" -name '*.la' -delete
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"
# Peios ships no /usr/share/info. The MPFR manual is the library's only
# complete reference, so build it from the release's Texinfo source as HTML
# for org.gnu.mpfr-doc instead.
mkdir -p "$PEKIT_OUT/usr/share/doc/org.gnu.mpfr"
texi2any --html --output="$PEKIT_OUT/usr/share/doc/org.gnu.mpfr/html" \
  "$SRC/doc/mpfr.texi"

# Split build-ID-indexed debug data and stage the exact sources referenced by
# rewritten DWARF paths. Static archives retain code but drop debug data.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.gnu.mpfr "$PEKIT_OUT/usr"
'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.gmp-devel"          = "*"
"org.gnu.gmp-static"         = "*"
"org.pkgconf.pkgconf"            = "*"
# texi2any renders the HTML manual for org.gnu.mpfr-doc.
"org.gnu.texinfo"              = "*"

[build.main.dependencies.apt]
build-essential = "*"
libgmp-dev      = "*"
debugedit       = "*"
dwz             = "*"
pkgconf         = "*"
texinfo         = "*"

[test]
needs = ["main"]
gate  = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
INCLUDEDIR="$STAGE/usr/include"
PCDIR="$LIBDIR/pkgconfig"
SMOKE="$PEKIT_OUT/smoke"
MPFR_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libmpfr.so.*' | LC_ALL=C sort)

# Correct rounding is the product; force the suite to load this build.
LD_LIBRARY_PATH="$STAGE/src/.libs" make -C "$STAGE" -j"$(nproc)" check

test "$(printf '%s\n' "$MPFR_SO" | grep -c .)" -eq 1
test -L "$LIBDIR/libmpfr.so"
test -L "$LIBDIR/libmpfr.so.6"
test -f "$LIBDIR/libmpfr.a"
test -f "$PCDIR/mpfr.pc"
readelf -d "$MPFR_SO" | grep -Eq 'SONAME.*[[]libmpfr[.]so[.]6[]]'
grep -F 'Version: ' "$PCDIR/mpfr.pc" | grep -F "$PEKIT_VERSION"
grep -F 'MPFR_USE_THREAD_SAFE=1' "$STAGE/config.log"
test -s "$STAGE/usr/share/doc/org.gnu.mpfr/html/index.html"
grep -F "GNU MPFR $PEKIT_VERSION" "$STAGE/usr/share/doc/org.gnu.mpfr/html/index.html"
test ! -e "$STAGE/usr/share/info"

mkdir -p "$SMOKE"
cat > "$SMOKE/smoke.c" <<'EOF'
#include <mpfr.h>
int main(void) {
  mpfr_t value;
  mpfr_init2(value, 256);
  mpfr_set_ui(value, 3, MPFR_RNDN);
  mpfr_div_ui(value, value, 8, MPFR_RNDN);
  int ok = mpfr_cmp_d(value, 0.375) == 0;
  mpfr_clear(value);
  return ok ? 0 : 1;
}
EOF
MPFR_CFLAGS=$(PKG_CONFIG_PATH="$PCDIR" PKG_CONFIG_SYSROOT_DIR="$STAGE" pkgconf --cflags mpfr)
MPFR_LIBS=$(PKG_CONFIG_PATH="$PCDIR" PKG_CONFIG_SYSROOT_DIR="$STAGE" pkgconf --libs mpfr)
cc $MPFR_CFLAGS "$SMOKE/smoke.c" $MPFR_LIBS -o "$SMOKE/shared"
LD_LIBRARY_PATH="$LIBDIR" "$SMOKE/shared"
cc $MPFR_CFLAGS "$SMOKE/smoke.c" -Wl,-Bstatic $MPFR_LIBS \
  -Wl,-Bdynamic -lm -o "$SMOKE/static"
"$SMOKE/static"

test "$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug' | wc -l)" -eq 1
test -n "$(find "$STAGE/usr/src/debug/org.gnu.mpfr" -type f -print -quit)"
readelf -W -l "$MPFR_SO" | grep -F 'GNU_RELRO'
readelf -d "$MPFR_SO" | grep -F 'BIND_NOW'
readelf -W -l "$MPFR_SO" | grep -E 'GNU_STACK.*RW '
if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
  readelf -n "$MPFR_SO" | grep -E 'x86 feature:.*IBT.*SHSTK'
fi
if readelf -d "$MPFR_SO" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
readelf -d "$MPFR_SO" | grep -F 'Shared library: [libgmp.so.10]'
readelf -d "$MPFR_SO" | grep -F 'Shared library: [libc.so.6]'
# Thread-safe MPFR uses TLS. Debian's GCC 14 reaches it through
# __tls_get_addr, which ld.so provides, so the seed's Debian build rightly
# names ld-linux; the native toolchain's build does not, and is held to that.
if [ "${PEKIT_NATIVE_ROOT:-}" = 1 ]; then
  if readelf -d "$MPFR_SO" | grep -F 'Shared library: [ld-linux-x86-64.so.2]'; then exit 1; fi
fi
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.gmp-devel"            = "*"
"org.gnu.gmp-static"           = "*"
"org.pkgconf.pkgconf"          = "*"
"org.gnu.binutils"             = "*"
"org.gnu.findutils"            = "*"
"org.gnu.grep"                 = "*"

[test.dependencies.apt]
build-essential = "*"
libgmp-dev      = "*"
pkgconf         = "*"
binutils        = "*"
findutils       = "*"
grep            = "*"
