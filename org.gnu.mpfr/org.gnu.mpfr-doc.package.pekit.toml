# The MPFR manual as HTML, rendered by texi2any from the release's Texinfo
# source. Peios ships no Info documents.

[package]
name         = "org.gnu.mpfr-doc"
description  = "GNU MPFR - HTML manual"
architecture = "noarch"
license      = "GFDL-1.3-or-later"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.mpfr-doc/"
":usr/share/doc/org.gnu.mpfr/html/**" = "usr/share/doc/org.gnu.mpfr/html"
