[package]
name        = "org.gnu.mpfr-devel"
description = "GNU MPFR development files"

[provides]

[dependencies]
"org.gnu.mpfr"      = "= {{release}}"
"org.gnu.gmp-devel" = ">= 6.3.0"

[files]
"@source:COPYING*" = "usr/share/licenses/org.gnu.mpfr-devel/"
":usr/include/mpfr.h"                           = "usr/include/mpfr.h"
":usr/include/mpf2mpfr.h"                       = "usr/include/mpf2mpfr.h"
":usr/lib/x86_64-linux-peios/libmpfr.so"        = "usr/lib/x86_64-linux-peios/libmpfr.so"
":usr/lib/x86_64-linux-peios/pkgconfig/mpfr.pc" = "usr/lib/x86_64-linux-peios/pkgconfig/mpfr.pc"
