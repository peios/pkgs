# The graphical installer and first-boot setup in a browser: installer-gxwi
# and oobe-gxwi, with their debug symbols and source. The source release owns
# the recipe; this entry supplies release discovery and the local tree.
out_dir = "out"
delegate = true
[source.git]
url = "https://github.com/peios/installer-gxwi.git"
ref = "v{{version}}"
versions = ">= 0.0.1"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
[source.local]
path = "../../installer-gxwi"
