[package]
name        = "org.kernel.libtraceevent-debugsource"
description = "libtraceevent library and plugin debug sources"

[dependencies]
"org.kernel.libtraceevent-debuginfo"      = "= {{release}}"
"org.kernel.libtraceevent-libs-debuginfo" = "= {{release}}"

[files]
"@source:LICENSES/LGPL-2.1" = "usr/share/licenses/org.kernel.libtraceevent-debugsource/LGPL-2.1"
"@source:LICENSES/GPL-2.0"  = "usr/share/licenses/org.kernel.libtraceevent-debugsource/GPL-2.0"
":usr/src/debug/**"         = "usr/src/debug"
