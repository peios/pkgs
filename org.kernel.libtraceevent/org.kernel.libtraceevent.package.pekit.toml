# Runtime event-format plugins. Keep this as the primary package so replacing
# the retired combined `libtraceevent` package preserves its complete payload.

[package]
name        = "org.kernel.libtraceevent"
description = "Linux trace-event parsing plugins"

[provides]

[replaces]

[dependencies]
"org.gnu.glibc"                        = ">= 2.43"
"org.kernel.libtraceevent-libs" = "= {{release}}"

[files]
"@source:LICENSES/LGPL-2.1" = "usr/share/licenses/org.kernel.libtraceevent/LGPL-2.1"
"@source:LICENSES/GPL-2.0"  = "usr/share/licenses/org.kernel.libtraceevent/GPL-2.0"
":usr/lib/x86_64-linux-peios/traceevent/plugins/**" = "usr/lib/x86_64-linux-peios/traceevent/plugins"
