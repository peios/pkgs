# Metadata shared by the GNU tar package family. The expression covers tar,
# bundled Gnulib/build helpers, the invariant-section manual, test helpers and
# generated corresponding source.

format = "peipkg"

[package]
version       = "{{version}}-2"
architecture  = "x86_64"
license       = "GPL-3.0-or-later AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND LGPL-3.0-or-later AND GFDL-1.3-invariants-or-later AND (GPL-2.0-or-later WITH Autoconf-exception-generic) AND (GPL-3.0-or-later WITH Autoconf-exception-generic-3.0) AND (GPL-3.0-or-later WITH Bison-exception-2.2) AND (GPL-3.0-or-later WITH Texinfo-exception) AND FSFAP AND FSFULLR AND FSFULLRWD AND X11 AND LicenseRef-Public-Domain"
license_class = "free"
homepage      = "https://www.gnu.org/software/tar/"
