# libxml2 — the runtime library on its own, so that a consumer of the parser
# need not pull the command-line tools.

[package]
name        = "libxml2"
description = "libxml2 - XML parser and toolkit runtime library"

[dependencies]
glibc   = ">= 2.43"
zlib    = ">= 2.3.3"
liblzma = ">= 5.8"

[files]
"@source:Copyright" = "usr/share/licenses/libxml2/"
":usr/lib/x86_64-linux-peios/libxml2.so.16*" = "usr/lib/x86_64-linux-peios"
