# librsi — Peios's registry-source C ABI library. The source repository owns
# the build and package split; this workspace member adds release discovery,
# distribution policy, and publication targets. Same shape as
# dev.peios.libpeios.
#
# The locked Cargo Git inputs are materialised only by build.vendor, the one
# networked target; compilation still runs in the offline package root.

out_dir = "out"
delegate = true

[source.git]
url       = "https://github.com/peios/librsi.git"
ref       = "v{{version}}"
versions  = ">= 0.1.4"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[source.local]
path = "../../librsi"
