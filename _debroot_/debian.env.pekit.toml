# Dependency-root preparation is coordinator policy; Pekit isolates workers.
dependency_provider = "apt"
[sandbox]
command = 'exec "$PEKIT_WORKSPACE_ROOT/_debroot_/enter.sh"'
network_targets = ["build:vendor"]

# Debian's toolchain links its own startup and runtime objects, which carry no
# IBT/SHSTK notes, so nothing built here can meet Peios' CET rule. The native
# environments enforce it; this exemption is the Debian root's, not any
# package's.
[lint.allow]
"elf.cet" = "Debian startup/runtime objects carry no Peios CET markers; native builds enforce the rule"
