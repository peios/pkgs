# Rung-1 build environment (PEI-126/PEI-156): apt-provided build deps in
# a pristine Debian container, selected with `pekit build --env debian`.
#
# This is the workspace's inherited `debian` profile. Recipes use it directly
# with `--env debian`; a recipe-local file of the same name would override it.
# The wrap locates enter.sh through the managed workspace root, so no
# per-recipe link or tailoring is needed.
dependency_provider = "apt"

[wrap]
command = 'exec "$PEKIT_WORKSPACE_ROOT/_debroot_/enter.sh" {{command}}'
