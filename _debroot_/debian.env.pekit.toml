# Rung-1 build environment (PEI-126/PEI-156): apt-provided build deps in
# a pristine Debian container, selected with `pekit build --env debian`.
#
# This file lives in _debroot_/ and is symlinked into each migrated
# recipe as debian.env.pekit.toml — pekit resolves --env names against
# the recipe directory only. The wrap locates enter.sh through the
# managed environment, so the symlink needs no per-recipe tailoring.
dependency_provider = "apt"

[wrap]
command = 'exec "$PEKIT_WORKSPACE_ROOT/_debroot_/enter.sh" {{command}}'
