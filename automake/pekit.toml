# automake — Makefile.in generator; usbip's in-tree autogen.sh runs it
# (PEI-158 Tier 2, wave 3).
#
# Autotools from the release tarball, out-of-source via DESTDIR (the m4
# shape). Pure perl scripts at runtime; autoconf declared (aclocal and
# automake drive it).

out_dir = "out"

[source.url]
url      = "https://ftp.gnu.org/gnu/automake/automake-{{version}}.tar.xz"
extract  = true
root     = "automake-{{version}}"
versions = ">= 1.18"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"
"""

[build.main.dependencies.peipkg]
build-essentials = "*"
autoconf = "*"
perl = "*"

[build.main.dependencies.apt]
build-essential = "*"
autoconf = "*"
