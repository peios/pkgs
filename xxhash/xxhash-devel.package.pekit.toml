# xxhash-devel — headers, the libxxhash.so link, the static archive, and
# pkg-config metadata (debugedit's closure rebuild consumes these).

[package]
name        = "xxhash-devel"
description = "xxHash - headers and link libraries"

[dependencies]
xxhash = "{{version}}"

[files]
":usr/include/**"                              = "usr/include"
":usr/lib/x86_64-linux-peios/libxxhash.so"     = "usr/lib/x86_64-linux-peios/libxxhash.so"
":usr/lib/x86_64-linux-peios/libxxhash.a"      = "usr/lib/x86_64-linux-peios/libxxhash.a"
":usr/lib/x86_64-linux-peios/pkgconfig/**"     = "usr/lib/x86_64-linux-peios/pkgconfig"
