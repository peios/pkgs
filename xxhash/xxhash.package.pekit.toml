# xxhash — the xxhsum tool + the runtime shared lib. The library is
# BSD-2-Clause; the xxhsum CLI is GPLv2+.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "xxhash"
description = "xxHash - fast hash algorithm (xxhsum + libxxhash runtime)"
license     = "BSD-2-Clause AND GPL-2.0-or-later"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:LICENSE"   = "usr/share/licenses/xxhash/"
":usr/bin/**"       = "usr/bin"
":usr/lib/x86_64-linux-peios/libxxhash.so.0*" = "usr/lib/x86_64-linux-peios"
":usr/share/man/**" = "usr/share/man"
