# xxhash — the xxHash fast hash library; debugedit 5.x hard-requires
# libxxhash >= 0.8 for build-id hashing (the find that put this in the
# seed).
#
# Phase-2a tool (PEI-155): plain Makefile, no out-of-source support — the
# tree is copied into the stage and built there (the bzip2 shape). The
# Makefile honours PREFIX/LIBDIR/MANDIR/DESTDIR, so no path bending needed
# beyond the triplet libdir.

out_dir = "out"

[source.url]
url      = "https://github.com/Cyan4973/xxHash/archive/refs/tags/v{{version}}.tar.gz"
extract  = true
root     = "xxHash-{{version}}"
versions = ">= 0.8.3"

[build.main]
command = """
SRC="$(pwd)"
mkdir -p "$PEKIT_OUT/build"
cp -a "$SRC/." "$PEKIT_OUT/build/"
cd "$PEKIT_OUT/build"
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT" PREFIX=/usr \
  LIBDIR=/usr/lib/x86_64-linux-peios MANDIR=/usr/share/man/man1
rm -rf "$PEKIT_OUT/build"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
