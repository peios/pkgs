# mpfr-devel — headers, dev .so symlink, pkg-config. mpfr.h #includes gmp.h, so
# this also needs gmp-devel.

[package]
description = "GNU MPFR - development files"

[dependencies]
mpfr = "{{version}}"
# mpfr.h pulls in gmp.h.
gmp-devel = ">= 6.3.0"

[files]
":usr/include/mpfr.h"                       = "usr/include/mpfr.h"
":usr/include/mpf2mpfr.h"                   = "usr/include/mpf2mpfr.h"
":usr/lib/x86_64-linux-peios/libmpfr.so"    = "usr/lib/x86_64-linux-peios/libmpfr.so"
":usr/lib/x86_64-linux-peios/pkgconfig/**"  = "usr/lib/x86_64-linux-peios/pkgconfig"
