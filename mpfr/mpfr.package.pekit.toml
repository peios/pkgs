# mpfr — runtime: libmpfr.so.6. Links libgmp, so depends on gmp.

[package]
description = "GNU MPFR multiple-precision floating-point library"

[dependencies]
glibc = ">= 2.43"
# Links libgmp.so.10; floor = the gmp Peios ships.
gmp = ">= 6.3.0"

[files]
# License texts (distro convention: /usr/share/licenses/<name>/).
"@source:COPYING*" = "usr/share/licenses/mpfr/"
":usr/lib/x86_64-linux-peios/libmpfr.so.6*" = "usr/lib/x86_64-linux-peios"
