# mpfr — GNU MPFR, the multiple-precision floating-point library (correct
# rounding). gcc's cc1/cc1plus link it (with gmp) for compile-time float constant
# folding; also a Tier-4 dep of gnutls. Links gmp.
#
# Tarball source: mpfr's git tree commits no configure (needs autogen), so this
# uses the GPG-signed release tarball (ships configure), enumerated from the
# ftp.gnu.org index.
#
#   nix develop ./_flake#mpfr -c pekit build --version 4.2.2

outDir = "out"

[source]
url        = "https://ftp.gnu.org/gnu/mpfr/mpfr-{{version}}.tar.xz"
extract    = true
file_regex = '^mpfr-\d+\.\d+\.\d+\.tar\.xz$'
versions   = ">= 4.2"

# Standard autotools, so the default CFLAGS already carry -g -O2 (debug present,
# unlike gmp's custom flags). CC pins gnu17 defensively: the shell's gcc 15
# defaults to C23, which trips legacy K&R configure probes. mpfr finds gmp via the
# cc-wrapper's injected -I/-L (no --with-gmp needed).
[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" CC="gcc -std=gnu17" --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"

# Drop libtool archives.
find "$PEKIT_OUT/usr" -name '*.la' -delete

# Post-install debug pipeline (same as glibc/gmp): strip libtool's redundant
# install-libdir rpath, scrub DWARF build paths (-> /usr/src/debug/mpfr), split
# debug build-id-indexed, strip, stage referenced sources. Static .a: strip-debug.
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  patchelf --remove-rpath "$f" 2>/dev/null || true
  # Linking the store's libgmp drags a stray DT_NEEDED on the dynamic linker onto
  # the shipped lib; a .so never legitimately NEEDs the loader, so strip it (the
  # real deps are bare sonames that resolve on Peios). No-op when absent.
  patchelf --remove-needed ld-linux-x86-64.so.2 "$f" 2>/dev/null || true
  debugedit -b "$ROOT" -d /usr/src/debug/mpfr -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$ROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/mpfr/$(dirname "$rel")"
  cp "$ROOT/$rel" "usr/src/debug/mpfr/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""
