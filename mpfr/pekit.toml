# mpfr — GNU MPFR, the multiple-precision floating-point library (correct
# rounding). gcc's cc1/cc1plus link it (with gmp) for compile-time float constant
# folding; also a Tier-4 dep of gnutls. Links gmp.
#
# Tarball source: mpfr's git tree commits no configure (needs autogen), so this
# uses the GPG-signed release tarball (ships configure), enumerated from the
# ftp.gnu.org index.
#
#   nix develop ./_flake#mpfr -c pekit build --version 4.2.2

out_dir = "out"

[source.url]
url        = "https://ftp.gnu.org/gnu/mpfr/mpfr-{{version}}.tar.xz"
extract    = true
root       = "mpfr-{{version}}"
file_regex = '^mpfr-\d+\.\d+\.\d+\.tar\.xz$'
versions   = ">= 4.2"

# Standard autotools. The distro CFLAGS/LDFLAGS reach the build through the
# environment; nothing is passed on the configure line, because assigning
# LDFLAGS there OVERRIDES the environment rather than adding to it — which is
# how this recipe previously threw the whole distro link flag set away in the
# course of adding --build-id (which LDFLAGS already carries, as sha1).
#
# `-std=gnu17` is likewise gone. It was set defensively against gcc's C23
# default tripping K&R configure probes; mpfr's configure has no such probe
# (that was gmp, which now carries the upstream fix as a patch), and pinning a
# superseded standard for a hazard the package does not have only rots.
#
# mpfr finds gmp via the cc-wrapper's injected -I/-L (no --with-gmp needed).
[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios

# libtool appends -Wl,--as-needed AFTER the libraries, where it cannot act on
# them, and hardcodes an rpath to the install libdir. Fedora and Arch both
# rewrite the generated libtool for exactly this; do the same.
sed -e 's|^hardcode_libdir_flag_spec=.*|hardcode_libdir_flag_spec=""|g' \
    -e 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' \
    -e 's|CC="\\(g..\\)"|CC="\\1 -Wl,--as-needed"|' \
    -i libtool

make -j"$(nproc)"

# Correct rounding is the entire product; the suite is what establishes it, and
# gcc folds float constants through this library. Fedora and Arch both run it.
#
# LD_LIBRARY_PATH is load-bearing: the libtool rewrite above strips the rpath
# from the test binaries, so without it they load libmpfr.so.6 from the
# composed root and test the previously published library instead of this
# build. Fedora's mpfr.spec exports it in %check for the same reason.
LD_LIBRARY_PATH="$PEKIT_OUT/src/.libs" make -j"$(nproc)" check

make install DESTDIR="$PEKIT_OUT"

# Drop libtool archives.
find "$PEKIT_OUT/usr" -name '*.la' -delete
# Installed but packaged by nobody: Peios ships no /usr/share/info and no
# /usr/share/doc (the licence texts come from @source instead, into
# /usr/share/licenses/mpfr/). Remove rather than leave orphaned in staging.
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"

# Post-install debug pipeline (same as glibc/gmp): strip libtool's redundant
# install-libdir rpath, scrub DWARF build paths (-> /usr/src/debug/mpfr), split
# debug build-id-indexed, strip, stage referenced sources. Static .a: strip-debug.
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
: > "$PEKIT_OUT/.srclist"
find usr -type f ! -type l -not -path 'usr/lib/debug/*' -not -path 'usr/src/debug/*' | while IFS= read -r f; do
  case "$f" in
    *.a) strip --strip-debug "$f" 2>/dev/null || true; continue;;
    *.o) continue;;
  esac
  readelf -h "$f" >/dev/null 2>&1 || continue
  patchelf --remove-rpath "$f" 2>/dev/null || true
  # Linking the store's libgmp drags a stray DT_NEEDED on the dynamic linker onto
  # the shipped lib; a .so never legitimately NEEDs the loader, so strip it (the
  # real deps are bare sonames that resolve on Peios). No-op when absent.
  patchelf --remove-needed ld-linux-x86-64.so.2 "$f" 2>/dev/null || true
  debugedit -b "$ROOT" -d /usr/src/debug/mpfr -l "$PEKIT_OUT/.dl" -n "$f" 2>/dev/null && cat "$PEKIT_OUT/.dl" >> "$PEKIT_OUT/.srclist" || true
  bid=$(readelf -n "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  if [ -n "$bid" ]; then
    p2=$(printf %s "$bid" | cut -c1-2)
    rest=$(printf %s "$bid" | cut -c3-)
    mkdir -p "usr/lib/debug/.build-id/$p2"
    objcopy --only-keep-debug "$f" "usr/lib/debug/.build-id/$p2/$rest.debug"
    chmod 0644 "usr/lib/debug/.build-id/$p2/$rest.debug"
  fi
  strip "$f"
done
tr '\\0' '\\n' < "$PEKIT_OUT/.srclist" | sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue;; esac
  [ -f "$ROOT/$rel" ] || continue
  mkdir -p "usr/src/debug/mpfr/$(dirname "$rel")"
  cp "$ROOT/$rel" "usr/src/debug/mpfr/$rel"
done
rm -f "$PEKIT_OUT/.dl" "$PEKIT_OUT/.srclist"
"""

# Build deps. mpfr is autotools (gcc + make), links gmp, and the post-install
# debug split adds debugedit + patchelf (binutils rides along with gcc).
[build.main.dependencies.peipkg]
build-essentials-c = "*"
gmp-devel = "*"

[build.main.dependencies.apt]
build-essential = "*"
libgmp-dev = "*"
debugedit = "*"
patchelf = "*"
