# Base metadata shared by the live-boot packages. Each <name>.package.pekit.toml
# (live-boot, live-boot-irf) inherits these fields and adds its own description,
# dependencies, and files. Both are buildless — their payloads come from src/.
#
# x86_64, not noarch: although the payloads (a script, a cmdline) are arch-
# independent, these packages depend on the x86_64 userspace (live-boot-irf ->
# peiosutils). §4.1.3 only permits `any`-arch deps, which require the satisfier
# to match the depender's arch (or be noarch) — so a package that pulls x86_64
# deps must itself be x86_64. Arch-dependence is transitive through deps.
format = "peipkg"

[package]
# -7: the root-mount hook stands aside when `root=` is on the kernel cmdline,
# so disk-boot's hook can take the boot instead. Both ship in the same
# initramfs and both provide `root-mounted`.
#
# -8: standing aside is now DECLINING (exit 69) rather than exiting 0, so a
# hook that did nothing no longer reports the same outcome as one that did the
# job. Requires a prelude honouring the hook-outcomes contract, which the irf
# package's dependency enforces.
#
# -9: the hook moves to /usr/libexec/prelude/hooks.d, mounts at /mnt/rootfs
# rather than /sysroot, and contributes to `rootfs-ready` instead of providing
# `root-mounted`.
#
# -10: the medium's rootfs image is `rootfs.squashfs`, not `sysroot.squashfs`.
# The mount path became /mnt/rootfs in -9 and the file name was the last place
# the old word survived — a hook mounting /mnt/rootfs.lower from a file called
# sysroot is the kind of half-rename that misleads a year later.
#
# -11: the hook no longer reads `root=` to decide whether it is wanted. Package
# presence is the selector — the installer swaps live-boot for disk-boot — so
# the check had nothing left to decide. live-boot-irf now conflicts with
# disk-boot-irf, which is where the "exactly one root-mount hook" invariant
# went when the runtime check came out.
#
# -12: the hook carries the medium into the new root at /media/peios. prelude
# mount-moves only /proc, /sys and /dev and then chroots, so everything else
# the initramfs mounted is unreachable afterwards — a live system could not
# read the medium it booted from. This hook has already identified the right
# device by the only reliable test, so relocating that mount is strictly
# better than any later rescan. Non-fatal: a boot that reaches a prompt with
# an unreachable medium beats no boot.
#
# -13: the tmpfs upper is seeded with an explicit descriptor granting Everyone
# read+execute, rather than with seed-sd's built-in default. That default is a
# *bootstrap* descriptor (SYSTEM and Administrators only) and it is also what
# stamps /dev, where every ACE is inherited by the next hot-plugged block
# device — so it must stay narrow and could not be widened in place. But it
# was, in effect, the access policy of the entire system: KACS's missing-SD
# synthesis prefers inheritance from the parent over the mount template, and
# the whole SD-less squashfs inherits up a chain that terminates at this
# descriptor. The result was that no service running as anything but SYSTEM
# could chdir to its own working directory, because execute is the traverse
# bit and an explicit chdir gets no SeChangeNotifyPrivilege bypass (PEI-546).
#
# -14: and a CREATOR OWNER ACE, inherit-only, so whoever creates an object gets
# full control of it. Without it a non-SYSTEM service can create a file it
# cannot read back: the inherited SYSTEM and Administrators ACEs are a
# non-empty DACL, and a token's default DACL is only consulted when inheritance
# yields nothing at all.
version      = "1.0.0-14"
architecture = "x86_64"
license      = "MIT"
