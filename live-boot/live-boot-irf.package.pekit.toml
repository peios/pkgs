# live-boot-irf — the initramfs half: the root-mount hook mkirf packs into the
# cpio. Its home is the initramfs root (live-boot depends on it IN initramfs).
# It depends on peiosutils so the hook's mkdir/mount tools land in the initramfs
# alongside it — as a dep of an initramfs-homed package, peiosutils routes to
# the initramfs by default, no IN needed. (seed-sd comes from prelude, the
# initramfs's PID 1.) This is the initramfs composing itself via the dep graph.

[package]
description = "Initramfs root-mount hook for live-medium boot (squashfs + tmpfs overlay)"

[dependencies]
peiosutils = ">= 0.1.2"
# Everything this hook and prelude must agree on: that exit 69 means declined
# rather than failed, and that the real root is mounted at /mnt/rootfs. Each
# half fails hard on its own — against a prelude predating the outcome
# contract the hook would HALT the boot it was standing aside for, and against
# one still expecting /sysroot it would mount where nothing looks. The
# dependency makes either mismatch a compose-time error instead.
prelude-hook-abi = ">= 2"

# The hook lives in the packaged hook directory, one of the places mkirf scans
# when it packs the initramfs cpio. /usr because it is package payload; an
# operator overriding it drops a file of the same name in
# /lcl/libexec/prelude/hooks.d, which wins without this one being deleted.
[files]
"src/mount-root.sh" = "usr/libexec/prelude/hooks.d/mount-root.sh"
