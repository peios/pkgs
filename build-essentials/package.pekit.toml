# Shared defaults layer for the build-essentials members (a bare
# package.pekit.toml is never a package once named members exist).

format = "peipkg"

[package]
version      = "1.0.0-2"
# x86_64 by choice, not necessity (since the §4.1.3 clarification, noarch
# dependers resolve against the primary architecture): the floor genuinely
# is per-architecture — an arm64 system wants an arm64 gcc — and Debian's
# build-essential is arch-specific for the same reason.
architecture = "x86_64"
license      = "MIT"
