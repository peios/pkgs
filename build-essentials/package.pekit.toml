# Shared defaults layer for the build-essentials members (a bare
# package.pekit.toml is never a package once named members exist).

format = "peipkg"

[package]
version      = "1.0.0-1"
# x86_64, not noarch, and necessarily so: §4.1.3 (PSD-009 v0.22) resolves a
# dependency only against the depender's own architecture or noarch, so a
# noarch meta can never pull x86_64 packages. Debian's build-essential is
# arch-specific for the same reason — the floor is per-architecture.
architecture = "x86_64"
license      = "MIT"
