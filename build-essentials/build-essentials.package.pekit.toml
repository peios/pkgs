# The ambient userland floor: shell + tools every build may assume without
# declaring. No toolchain — that's the per-language stacks' job. make is
# baseline by decision: it's a general orchestrator (Makefiles drive far more
# than C), not a C artifact.

[package]
name        = "build-essentials"
description = "Build environment baseline - shell and userland every build may assume"

[dependencies]
# The build baseline intentionally selects the bootstrap Coreutils
# implementation. Peiosutils is the installed-system userland, but deliberately
# omits POSIX ownership/mode tools such as chmod that upstream build systems
# require while constructing packages.
dash      = "*"
coreutils = "*"
sed       = "*"
grep      = "*"
gawk      = "*"
findutils = "*"
diffutils = "*"
make      = "*"

[files]
"@recipe:docs/build-essentials.txt" = "usr/share/doc/build-essentials/README"
