# flex — the generator itself + the runtime shared lib.

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name        = "flex"
description = "flex - the fast lexical analyser generator"

# flex 2.6 execs m4 at runtime — a hard runtime dep.
[dependencies]
glibc = ">= 2.43"
m4    = "*"

[files]
"@source:COPYING" = "usr/share/licenses/flex/"
":usr/bin/**"       = "usr/bin"
":usr/lib/x86_64-linux-peios/libfl.so.2*" = "usr/lib/x86_64-linux-peios"
":usr/share/man/**" = "usr/share/man"
