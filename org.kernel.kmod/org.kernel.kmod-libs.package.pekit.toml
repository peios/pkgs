# org.kernel.kmod-libs — the module-management runtime library, on its own so library
# consumers (a future init/udev) need not pull the tools. DT_NEEDED carries
# the compressed-module decompressors.

[package]
name        = "org.kernel.kmod-libs"
description = "libkmod kernel module management library"
license     = "LGPL-2.1-or-later"

[provides]

[dependencies]
"org.gnu.glibc"   = ">= 2.43"
"io.github.zlib-ng.zlib-ng-compat"    = ">= 2.3.3"
"org.tukaani.xz-libs" = ">= 5.8"
"com.facebook.zstd-libs" = ">= 1.5.7"
# openssl on: modinfo PKCS7 signature display (libcrypto).
"org.openssl.libssl"  = ">= 3.5.7"

[files]
"@source:libkmod/COPYING" = "usr/share/licenses/org.kernel.kmod-libs/COPYING"
":usr/lib/x86_64-linux-peios/libkmod.so.2*" = "usr/lib/x86_64-linux-peios"
