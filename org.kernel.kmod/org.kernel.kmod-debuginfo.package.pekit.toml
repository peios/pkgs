[package]
name        = "org.kernel.kmod-debuginfo"
description = "kmod and libkmod debugging symbols"

[dependencies]
"org.kernel.kmod"      = "{{version}}-1"
"org.kernel.kmod-libs" = "{{version}}-1"

[files]
"@source:tools/COPYING"   = "usr/share/licenses/org.kernel.kmod-debuginfo/GPL-2.0-or-later"
"@source:libkmod/COPYING" = "usr/share/licenses/org.kernel.kmod-debuginfo/LGPL-2.1-or-later"
":usr/lib/debug/**"       = "usr/lib/debug"
