# Public libkmod static archive. Its private link interface uses the same
# compressor and crypto libraries as the shared object.

[package]
name        = "org.kernel.kmod-static"
description = "libkmod static library"
license     = "LGPL-2.1-or-later"

[provides]

[dependencies]
"org.kernel.kmod-devel" = "{{version}}-1"
"io.github.zlib-ng.zlib-ng-compat-devel"            = ">= 2.3.3"
"org.tukaani.xz-devel"              = ">= 5.8"
"com.facebook.zstd-devel"            = ">= 1.5.7"
"org.openssl.openssl-devel"         = ">= 3.5"

[files]
"@source:libkmod/COPYING"                   = "usr/share/licenses/org.kernel.kmod-static/COPYING"
":usr/lib/x86_64-linux-peios/libkmod.a" = "usr/lib/x86_64-linux-peios/libkmod.a"
