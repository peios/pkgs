[package]
name        = "org.kernel.kmod-debugsource"
description = "kmod and libkmod debug sources"

[dependencies]
"org.kernel.kmod-debuginfo" = "{{version}}-1"

[files]
"@source:tools/COPYING"   = "usr/share/licenses/org.kernel.kmod-debugsource/GPL-2.0-or-later"
"@source:libkmod/COPYING" = "usr/share/licenses/org.kernel.kmod-debugsource/LGPL-2.1-or-later"
":usr/src/debug/**"       = "usr/src/debug"
