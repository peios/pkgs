side_effects = ["man-db"]
[package]
name = "org.freedesktop.libbsd-devel"
description = "libbsd development files"
[dependencies]
"org.freedesktop.libmd-devel" = "*"
"org.freedesktop.libbsd" = "= {{release}}"
[files]
"@source:COPYING" = "usr/share/licenses/org.freedesktop.libbsd-devel/COPYING"
":usr/include/**" = "usr/include"
":usr/lib/x86_64-linux-peios/*.so" = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/pkgconfig/**" = "usr/lib/x86_64-linux-peios/pkgconfig"
":usr/share/man/**" = "usr/share/man"
