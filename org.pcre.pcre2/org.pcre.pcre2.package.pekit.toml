# The 8-bit PCRE2 runtime (libpcre2-8, what glib and most consumers link) and
# the POSIX regcomp/regexec wrapper built on it. The just-in-time compiler
# inside the library is separately BSD-2-Clause, so its notice travels too.

[package]
name        = "org.pcre.pcre2"
description = "Perl-compatible regular expression library (8-bit and POSIX)"

[dependencies]
"org.gnu.glibc" = ">= 2.43"

[files]
"@source:LICENCE.md"         = "usr/share/licenses/org.pcre.pcre2/"
"@source:deps/sljit/LICENSE" = "usr/share/licenses/org.pcre.pcre2/LICENSE.sljit"
"@source:README"             = "usr/share/doc/org.pcre.pcre2/"
"@source:NEWS"               = "usr/share/doc/org.pcre.pcre2/"
"@source:AUTHORS.md"         = "usr/share/doc/org.pcre.pcre2/"
":usr/lib/x86_64-linux-peios/libpcre2-8.so.0*"     = "usr/lib/x86_64-linux-peios"
":usr/lib/x86_64-linux-peios/libpcre2-posix.so.3*" = "usr/lib/x86_64-linux-peios"
