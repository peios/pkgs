# peinit's own lint.pekit.toml names its single family debug package, but a
# delegated source root's lint file merges before the workspace's, so the
# workspace default "{{name}}-debuginfo" would win. Restate it here.
[elf]
debuginfo = "dev.peios.peinit-debuginfo"

[allow]
"source.signature.required" = "First-party release tags are not yet signed (PEI-1169); HTTPS plus the commit pinned in pekit.lock is the provenance boundary until they are"
