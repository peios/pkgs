# dev.peios.peinit — Peios real-root PID 1 service manager.
#
# Delegate recipe: peinit is self-describing — it commits its own pekit files
# (the build pipeline in pekit.toml, the package definition in
# package.pekit.toml), so this recipe is just a pointer. pekit fetches the tag
# matching --version and borrows the source's own build + package definitions.
# The runtime glibc / libgcc dependencies are derived automatically from the
# binary's DT_NEEDED (and versioned per the workspace symbol-version policy).
#
# From v0.0.2 onward the source pins its authd protocol and peios-rs crates to
# immutable public commits and vendors the complete graph before either build
# environment goes offline. No sibling checkout participates in a release.

out_dir = "out"
delegate = true

[source.git]
url = "https://github.com/peios/peinit.git"
ref = "v{{version}}"
tag_regex = '^v[0-9]+\.[0-9]+\.[0-9]+$'
# v0.0.2 is the first immutable, self-contained production package family.
# The floor is soft: future releases are discovered automatically.
versions = ">=0.0.2"

# Local working copy for `--local` (compile the in-dev tree, no tag).
# Relative to this recipe dir; never used by the farm.
[source.local]
path = "../../peinit"
