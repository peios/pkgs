format = "peipkg"

# PSPU §5.24: a payload carrying man pages SHOULD declare man-db, so that
# `man -k` and `apropos` find them instead of falling back to a filesystem
# scan. Top-level, not inside a table -- TOML would otherwise scope it to
# whichever table precedes it.
side_effects = ["man-db"]

[package]
name         = "coreutils-gnu"
version      = "{{version}}-1"
architecture = "x86_64"
description  = "GNU core utilities - bootstrap build-base userland (superseded by peiosutils on installed systems)"
license      = "GPL-3.0-or-later"
homepage     = "https://www.gnu.org/software/coreutils/"

# The build-base `coreutils` capability. Dependents ask for `coreutils`;
# today this GNU build fills it, later peiosutils (+ the chmod shim) takes
# the role over without touching any dependent.
[provides]
coreutils = "{{version}}"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:COPYING*" = "usr/share/licenses/coreutils-gnu/"
":usr/bin/**"                       = "usr/bin"
# libstdbuf.so (stdbuf's LD_PRELOAD helper), homed per PSD-009 §3.4.
":usr/lib/x86_64-linux-peios/**"    = "usr/lib/x86_64-linux-peios"
":usr/share/man/**"                 = "usr/share/man"
