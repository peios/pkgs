# coreutils-gnu — the GNU core utilities, packaged for the BUILD-BASE role.
#
# PEIOS-DIVERGENCE(userland): Peios's system userland is peiosutils (a hard
# fork of uutils/coreutils, KACS-aware, no POSIX-permission tools). This GNU
# build exists for build closure only: autotools builds need GNU semantics,
# a C-buildable seed (peiosutils is Rust — packaging it drags the Rust
# toolchain into the Phase-2 closure), and a `chmod` that exists and exits 0
# (configure runs `chmod +x` constantly; peiosutils deliberately has none).
# When the Rust toolchain enters the seed, peiosutils + a small
# coreutils-shim (chmod/chown/chgrp no-op compatibility) replace this
# package; it provides the `coreutils` capability so dependents survive the
# handover.
#
# Phase-1 build-base leaf (PEI-155): plain autotools from the release tarball.

out_dir = "out"

# gnulib/glibc-const-generics: 9.9's bundled gnulib redeclares functions
# glibc >= 2.43 turns into _Generic const-correctness macros (the m4/gettext
# patch template). Drop when a release bundles the upstream gnulib fix.
[source]
patches = "patches"

[source.url]
url      = "https://ftp.gnu.org/gnu/coreutils/coreutils-{{version}}.tar.xz"
extract  = true
root     = "coreutils-{{version}}"
versions = ">= 9.7"

[build.main]
command = """
SRC="$(pwd)"
cd "$PEKIT_OUT"
"$SRC/configure" --prefix=/usr --bindir=/usr/bin --mandir=/usr/share/man \
  --libexecdir=/usr/lib/x86_64-linux-peios --disable-nls
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"
rm -rf "$PEKIT_OUT/usr/share/info"
"""

[build.main.dependencies.peipkg]
build-essentials-c = "*"

[build.main.dependencies.apt]
build-essential = "*"
