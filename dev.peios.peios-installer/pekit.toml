# The installer source release owns one hermetic build and the full installer,
# OOBE, debug and corresponding-source package family. This catalogue entry
# supplies immutable public release discovery and its local qualification tree.

out_dir = "out"
delegate = true

[source.git]
url       = "https://github.com/peios/installer.git"
ref       = "v{{version}}"
# Soft production floor: v0.1.8 is the first release that needs no catalogue
# overlay (PEI-1163).
versions  = ">= 0.1.8"
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

[source.local]
path = "../../installer"
