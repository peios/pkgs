format = "peipkg"

[package]
name          = "dev.peios.peios-installer"
version       = "{{version}}-16"
architecture  = "x86_64"
description   = "Peios installer - installerd engine, the install-tui surface and msip-drive"
license       = "MIT"
license_class = "free"

# The tools installerd drives. It shells out to them rather than linking
# anything: `part` and the filesystem tools come from peiosutils and its
# siblings, peipkg performs the boot-package swap on the target, and mkirf
# and mkuki rebuild the initramfs and the UKI. Each one is a phase that
# fails loudly if the tool is absent, so they are dependencies in the real
# sense rather than a convenience list.
[dependencies]
peiosutils = ">= 0.1.4"
peipkg     = ">= 0.1.1"
dosfstools = ">= 4.2"
"net.sourceforge.e2fsprogs" = ">= 1.47.4"
prelude    = ">= 0.0.1"

# Globs, not single paths: a one-file source maps its destination as a file
# name rather than a directory, which collides with the directory the root
# already has.
[files]
":usr/sbin/**"           = "usr/sbin"
":usr/bin/**"            = "usr/bin"
":usr/share/regim/**"    = "usr/share/regim"
":usr/share/licenses/**" = "usr/share/licenses"
