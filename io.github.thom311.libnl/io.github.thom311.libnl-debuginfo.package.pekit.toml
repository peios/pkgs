# io.github.thom311.libnl-debuginfo — build-ID-indexed symbols for the runtime
# protocol libraries.

[package]
name        = "io.github.thom311.libnl-debuginfo"
description = "Netlink protocol libraries - debugging symbols"

[dependencies]
"io.github.thom311.libnl"       = "= {{release}}"

[files]
"@source:COPYING"   = "usr/share/licenses/io.github.thom311.libnl-debuginfo/"
":usr/lib/debug-libnl/**" = "usr/lib/debug"
