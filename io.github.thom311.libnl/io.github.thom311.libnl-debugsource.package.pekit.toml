# io.github.thom311.libnl-debugsource — exact source files referenced by the
# rewritten DWARF.

[package]
name        = "io.github.thom311.libnl-debugsource"
description = "Netlink protocol libraries and tools - debug sources"

[dependencies]
"io.github.thom311.libnl-debuginfo" = "= {{release}}"
"io.github.thom311.libnl-tools-debuginfo" = "= {{release}}"

[files]
"@source:COPYING"       = "usr/share/licenses/io.github.thom311.libnl-debugsource/"
":usr/src/debug/**" = "usr/src/debug"
