# Public libltdl headers and unversioned linker name.

[package]
name        = "org.gnu.libtool-ltdl-devel"
description = "GNU Libtool - libltdl headers and link library"
license     = "LGPL-2.0-or-later WITH Libtool-exception"

[provides]
libltdl-devel = "{{version}}"

[dependencies]
"org.gnu.libtool-ltdl" = "{{version}}-1"

[files]
"@source:libltdl/COPYING.LIB" = "usr/share/licenses/org.gnu.libtool-ltdl-devel/COPYING.LIB"
":usr/include/**" = "usr/include"
":usr/lib/x86_64-linux-peios/libltdl.so" = "usr/lib/x86_64-linux-peios/libltdl.so"
