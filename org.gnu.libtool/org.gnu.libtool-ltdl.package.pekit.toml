# Runtime for GNU's portable dlopen wrapper.

[package]
name        = "org.gnu.libtool-ltdl"
description = "GNU Libtool - portable dynamic module loader runtime"
license     = "LGPL-2.0-or-later WITH Libtool-exception"

[provides]
libltdl = "{{version}}"

[dependencies]
glibc = ">= 2.43"

[files]
"@source:libltdl/COPYING.LIB" = "usr/share/licenses/org.gnu.libtool-ltdl/COPYING.LIB"
":usr/lib/x86_64-linux-peios/libltdl.so.7*" = "usr/lib/x86_64-linux-peios"
