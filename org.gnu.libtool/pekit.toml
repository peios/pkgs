# GNU Libtool — portable shared-library build tooling and libltdl.

tags = ["bootstrap"]
out_dir = "out"

# The corresponding source carries Libtool's complete tree: scripts and
# macros under their exceptions, bundled Gnulib, the manual and build helpers.
[source_package]
license = "GPL-2.0-or-later AND GPL-2.0-or-later WITH Autoconf-exception-generic AND GPL-2.0-or-later WITH Libtool-exception AND LGPL-2.0-or-later WITH Libtool-exception AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND MIT AND FSFAP AND FSFULLR AND FSFULLRWD AND GFDL-1.3-or-later AND X11 AND LicenseRef-Public-Domain"

[source.url]
url         = "https://ftpmirror.gnu.org/libtool/libtool-{{version}}.tar.xz"
listing_url = "https://ftpmirror.gnu.org/libtool/"
extract     = true
root        = "libtool-{{version}}"
file_regex  = 'libtool-[0-9]+\.[0-9]+(?:\.[0-9]+)?\.tar\.xz'
# Soft maintenance floor. Follow every newer authenticated stable release;
# incompatible build-system changes stop at the regression gates.
versions    = ">= 2.6.2"

# GNU's stable archives carry detached signatures. Pin current maintainer
# Ileana Dumitrescu's complete primary-key fingerprint, as published in the
# official release announcement, so unattended discovery is authenticated.
[source.url.signature]
url          = "{{source_url}}.sig"
of           = "artifact"
key_files    = ["keys/ileana-dumitrescu.asc"]
fingerprints = ["FA26CA784BE188927F22B99F6570EA01146F7354"]

[build.main]
command = """
set -eu
LOCKED_SRC="$(pwd)"
WORK="$PEKIT_OUT/build"
SRC="$WORK/source"
TOOLS_BUILD="$WORK/tools"
LTDL_BUILD="$WORK/ltdl"
LIBDIR="$PEKIT_OUT/usr/lib/x86_64-linux-peios"
BIN="$PEKIT_OUT/usr/bin"
DEBUG_PREFIX=/usr/src/debug/org.gnu.libtool

# Keep Pekit's locked source pristine and give debugedit one common prefix for
# both the full suite and the separately hardened libltdl build.
mkdir -p "$SRC" "$TOOLS_BUILD" "$LTDL_BUILD"
cp -a "$LOCKED_SRC/." "$SRC/"
grep -F "PACKAGE_VERSION='$PEKIT_VERSION'" "$SRC/configure"
test -s "$SRC/COPYING"
test -s "$SRC/libltdl/COPYING.LIB"
test -s "$SRC/README"

# Libtool records configure-time linker choices in the installed scripts.
# Build and test the portable tools with neutral flags so a particular build
# farm's hardening policy is not imposed on every future consumer. A second,
# isolated build below applies the inherited flags to the shipped C library.
cd "$TOOLS_BUILD"
env CONFIG_SHELL=/bin/sh SHELL=/bin/sh CFLAGS="-O2 -g" CXXFLAGS="-O2 -g" CPPFLAGS="" LDFLAGS="" \
  "$SRC/configure" \
    --prefix=/usr \
    --bindir=/usr/bin \
    --libdir=/usr/lib/x86_64-linux-peios \
    --mandir=/usr/share/man \
    --enable-shared \
    --enable-static
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"

# Rebuild installable libltdl from its supported standalone configuration.
# This prevents inherited hardening/linker flags from leaking into libtool's
# generated consumer scripts while keeping the actual runtime fully hardened.
cd "$LTDL_BUILD"
LTDL_CFLAGS="${CFLAGS:?} -fmacro-prefix-map=$WORK=$DEBUG_PREFIX"
"$SRC/libltdl/configure" \
  --prefix=/usr \
  --libdir=/usr/lib/x86_64-linux-peios \
  --enable-ltdl-install \
  --enable-shared \
  --enable-static \
  CFLAGS="$LTDL_CFLAGS" \
  CPPFLAGS="${CPPFLAGS-}" \
  LDFLAGS="${LDFLAGS:?} -Wl,-z,ibtplt"
make -j"$(nproc)"
make install DESTDIR="$PEKIT_OUT"

# Libtool archives encode build-host paths and are not a supported linker
# interface. Keep the static archive, but never ship the .la metadata.
find "$LIBDIR" -maxdepth 1 -type f -name '*.la' -delete
rm -rf "$PEKIT_OUT/usr/share/info" "$PEKIT_OUT/usr/share/doc"

LTDL_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libltdl.so.7.*' | LC_ALL=C sort)
test "$(printf '%s\n' "$LTDL_SO" | grep -c .)" -eq 1

# Installed scripts name the shell through the runtime view. Keep the command
# list explicit so newly installed programs cannot escape packaging review.
for script in libtool libtoolize libtool-next-version; do
  test -f "$BIN/$script"
  sed -i '1s|^#!.*sh$|#!/bin/sh|' "$BIN/$script"
done

# The copied build helper has a shell entry point and is directly runnable by
# generated projects. Preserve that contract, naming the shell through the
# runtime view rather than upstream's /usr/bin/env, and compress manuals
# without timestamps so identical inputs produce identical package bytes.
sed -i '1s|^#! */usr/bin/env sh$|#!/bin/sh|' \
  "$PEKIT_OUT/usr/share/libtool/build-aux/ltmain.sh"
chmod 0755 "$PEKIT_OUT/usr/share/libtool/build-aux/ltmain.sh"
find "$PEKIT_OUT/usr/share/man/man1" -type f -name '*.1' -exec gzip -9n {} +

# Create build-ID-indexed symbols, strip the static archive's debug sections
# and copy exactly the source/generated files named by the runtime's rewritten
# DWARF. The prefix map above is relative to $WORK, not the job root.
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" --build-root "$WORK" \
  org.gnu.libtool "$LTDL_SO" "$LIBDIR/libltdl.a"
"""

[test]
needs = ["main"]
gate = true
command = '''
set -eu
STAGE="$PEKIT_MAIN_OUT"
WORK="$STAGE/build"
TOOLS_BUILD="$WORK/tools"
LTDL_BUILD="$WORK/ltdl"
LIBDIR="$STAGE/usr/lib/x86_64-linux-peios"
BIN="$STAGE/usr/bin"
SMOKE="$PEKIT_OUT/smoke"
PROJECT="$SMOKE/project"
STAGED_DATA="$SMOKE/libtool-data"

# Run both complete upstream suites against the exact retained build trees.
make -C "$TOOLS_BUILD" check TESTSUITEFLAGS="-j$(nproc)"
make -C "$LTDL_BUILD" -j"$(nproc)" check

# Gate the complete, deliberate install surface before package selection.
for script in libtool libtoolize libtool-next-version; do
  test "$(sed -n '1p' "$BIN/$script")" = '#!/bin/sh'
  "$BIN/$script" --version | grep -F "$PEKIT_VERSION"
done
test "$(sed -n '1p' "$STAGE/usr/share/libtool/build-aux/ltmain.sh")" = '#!/bin/sh'
test "$(find "$BIN" -maxdepth 1 -type f | wc -l)" -eq 3
test -s "$STAGE/usr/share/aclocal/libtool.m4"
test -s "$STAGE/usr/share/aclocal/ltdl.m4"
test -s "$STAGE/usr/share/libtool/build-aux/ltmain.sh"
test "$(find "$STAGE/usr/share/man/man1" -maxdepth 1 -type f -name '*.1.gz' | wc -l)" -eq 3
test "$(find "$STAGE/usr/include" -type f -name '*.h' | wc -l)" -eq 4
test -L "$LIBDIR/libltdl.so"
test -L "$LIBDIR/libltdl.so.7"
test -s "$LIBDIR/libltdl.a"
LTDL_SO=$(find "$LIBDIR" -maxdepth 1 -type f -name 'libltdl.so.7.*' | LC_ALL=C sort)
test "$(printf '%s\n' "$LTDL_SO" | grep -c .)" -eq 1
readelf -d "$LTDL_SO" | grep -F 'Library soname: [libltdl.so.7]'
readelf --dyn-syms -W "$LTDL_SO" | grep -E ' lt_dlinit(@|$)'
readelf --dyn-syms -W "$LTDL_SO" | grep -E ' lt_dlopen(@|$)'
nm -g --defined-only "$LIBDIR/libltdl.a" | grep -E ' [T] lt_dlinit$'

# Generate and build a real Autoconf/Automake project using only the staged
# libtoolize, macros and support files.
mkdir -p "$PROJECT" "$STAGED_DATA"
ln -s "$STAGE/usr/share/libtool/build-aux" "$STAGED_DATA/build-aux"
ln -s "$STAGE/usr/share/libtool" "$STAGED_DATA/libltdl"
ln -s "$STAGE/usr/share/aclocal" "$STAGED_DATA/m4"
cat > "$PROJECT/configure.ac" <<'EOF'
AC_INIT([peios-libtool-consumer], [1.0])
AM_INIT_AUTOMAKE([foreign])
AC_PROG_CC
LT_INIT
AC_CONFIG_FILES([Makefile])
AC_OUTPUT
EOF
cat > "$PROJECT/Makefile.am" <<'EOF'
lib_LTLIBRARIES = libanswer.la
libanswer_la_SOURCES = answer.c
libanswer_la_LDFLAGS = -version-info 1:0:0 -no-undefined
bin_PROGRAMS = answer-client
answer_client_SOURCES = main.c
answer_client_LDADD = libanswer.la
EOF
cat > "$PROJECT/answer.c" <<'EOF'
int peios_libtool_answer(void) { return 42; }
EOF
cat > "$PROJECT/main.c" <<'EOF'
extern int peios_libtool_answer(void);
int main(void) { return peios_libtool_answer() == 42 ? 0 : 1; }
EOF
cd "$PROJECT"
PATH="$BIN:$PATH" _lt_pkgdatadir="$STAGED_DATA" \
  "$BIN/libtoolize" --copy --force
ACLOCAL_PATH="$STAGE/usr/share/aclocal" aclocal
autoconf
automake --add-missing --copy
env CFLAGS="${CFLAGS:?}" LDFLAGS="${LDFLAGS:?}" ./configure \
  --prefix=/usr --libdir=/usr/lib/x86_64-linux-peios
make -j"$(nproc)"
./answer-client
test -f .libs/libanswer.so.1.0.0
readelf -d .libs/libanswer.so.1.0.0 | grep -F 'Library soname: [libanswer.so.1]'

# Exercise libltdl's public API against a real loadable module through both
# shared and static linkage.
cat > "$SMOKE/plugin.c" <<'EOF'
int peios_ltdl_answer(void) { return 42; }
EOF
cat > "$SMOKE/consumer.c" <<'EOF'
#include <ltdl.h>
typedef int (*answer_fn)(void);
int main(int argc, char **argv)
{
  lt_dlhandle handle;
  answer_fn answer;
  if (argc != 2 || lt_dlinit() != 0)
    return 1;
  handle = lt_dlopen(argv[1]);
  if (!handle)
    return 2;
  answer = (answer_fn) lt_dlsym(handle, "peios_ltdl_answer");
  if (!answer || answer() != 42)
    return 3;
  if (lt_dlclose(handle) != 0 || lt_dlexit() != 0)
    return 4;
  return 0;
}
EOF
cc -fPIC -shared "$SMOKE/plugin.c" -o "$SMOKE/plugin.so"
cc "$SMOKE/consumer.c" -I"$STAGE/usr/include" -L"$LIBDIR" -lltdl \
  -o "$SMOKE/shared-consumer"
LD_LIBRARY_PATH="$LIBDIR" "$SMOKE/shared-consumer" "$SMOKE/plugin.so"
cc "$SMOKE/consumer.c" -I"$STAGE/usr/include" "$LIBDIR/libltdl.a" \
  -ldl -o "$SMOKE/static-consumer"
"$SMOKE/static-consumer" "$SMOKE/plugin.so"

# Validate reproducibility, split debugging and the runtime security contract.
if grep -R -F "$WORK" "$BIN" "$STAGE/usr/share/libtool"; then exit 1; fi
DEBUG=$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug')
test "$(printf '%s\n' "$DEBUG" | grep -c .)" -eq 1
readelf -S "$DEBUG" 2>/dev/null | grep -F '.debug_info'
test -n "$(find "$STAGE/usr/src/debug/org.gnu.libtool" -type f -print -quit)"
readelf -h "$LTDL_SO" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l "$LTDL_SO" | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l "$LTDL_SO" | grep -F 'GNU_RELRO'
readelf -d "$LTDL_SO" | grep -F 'BIND_NOW'
readelf -d "$LTDL_SO" | grep -F 'RELR'
readelf -n "$LTDL_SO" | grep -E 'x86 feature:.*IBT.*SHSTK'
if readelf -d "$LTDL_SO" | grep -Eq '(RPATH|RUNPATH)'; then exit 1; fi
test "$(readelf -d "$LTDL_SO" | grep -c 'Shared library:')" -eq 1
readelf -d "$LTDL_SO" | grep -F 'Shared library: [libc.so.6]'
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"com.darwinsys.file"             = "*"
"org.gnu.autoconf"               = "*"
"org.gnu.automake"               = "*"
"org.gnu.tar"                    = "*"

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-c++" = "*"
"com.darwinsys.file"   = "*"
"org.sourceware.debugedit"               = "*"
"org.gnu.autoconf"      = "*"
"org.gnu.automake"      = "*"
"org.gnu.tar"                       = "*"
"org.gnu.gzip"                      = "*"
