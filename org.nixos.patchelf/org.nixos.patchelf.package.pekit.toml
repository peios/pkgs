side_effects = ["man-db"]

[package]
name        = "org.nixos.patchelf"
description = "ELF interpreter, run-path and dependency editor"

[provides]
patchelf = "{{version}}"

[dependencies]
glibc        = ">= 2.43"
"libstdc++" = ">= 16"

[files]
"@source:COPYING"                         = "usr/share/licenses/org.nixos.patchelf/"
"@source:README.md"                       = "usr/share/doc/org.nixos.patchelf/"
":usr/bin/patchelf"                       = "usr/bin/patchelf"
":usr/share/man/man1/patchelf.1"          = "usr/share/man/man1/patchelf.1"
":usr/share/zsh/site-functions/_patchelf" = "usr/share/zsh/site-functions/_patchelf"
