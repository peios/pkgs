# Flit Core — the PEP 517 build backend, and the root of
# Python packaging on Peios.
#
# Our python3 is seed-minimal on purpose: no pip, no ensurepip, no
# setuptools, and Python 3.14 has no distutils. So nothing can install a
# Python project until a build backend exists — and flit_core is the one
# backend that needs no backend: it builds its own wheel with nothing but
# the interpreter (`python3 -m flit_core.wheel`), and a wheel is a zip
# that installs by extraction. Everything Python above this (docutils,
# meson, ...) is built by calling a backend's PEP 517 hook the same way.
#
# Every step below — call the backend, extract the wheel into the one
# site-packages, generate launchers, compile checked-hash bytecode — is the
# workspace helper's, so that the policy lives in one place rather than in
# each recipe. See _pybuild_/README.md for what it does and why.
#
# The upstream suite requires pytest and testpath, which do not belong in the
# bootstrap runtime closure. The Debian reference rung runs it in full; the
# Peipkg rung exercises the installed backend end-to-end with only Python.

out_dir = "out"

# PyPI's stable per-project source URL (no content hash in the path) and Simple
# API discover every stable point release. PyPI publishes no detached source
# signatures, so the immutable pekit.lock is an explicit TOFU trust boundary.
[source.url]
url         = "https://files.pythonhosted.org/packages/source/f/flit_core/flit_core-{{version}}.tar.gz"
listing_url = "https://pypi.org/simple/flit-core/"
extract     = true
root        = "flit_core-{{version}}"
file_regex  = 'flit_core-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz'
# Soft maintenance floor and major-version review boundary. Stable 4.x point
# releases are selected and locked automatically.
versions    = ">= 4.0.2, < 5"

[build.main]
command = """
set -eu
SRC="$(pwd -P)"

# Run every upstream core test in the reference environment. The native
# bootstrap root intentionally does not acquire pytest and testpath merely to
# build its own build backend; the installed self-hosting gate below covers it.
if [ "${PEKIT_DEPENDENCY_PROVIDER:-}" = apt ]; then
  PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -q "$SRC/tests_core"
fi

# flit_core builds its own wheel: the backend is in the tree being built, and
# `python3 -c` puts the cwd on sys.path, which is the whole bootstrap.
python3 "$PEKIT_WORKSPACE_ROOT/_pybuild_/install-wheel" \
  --backend flit_core.buildapi --out "$PEKIT_OUT" "$SRC"

if [ "${PEKIT_DEPENDENCY_PROVIDER:-}" = apt ]; then
  # The reference interpreter's sysconfig path is deliberately not packageable
  # by the Peios-only [files] mapping below. It validates upstream and backend
  # behavior, but cannot accidentally be published as a Python 3.14 artifact.
  SITE="$PEKIT_OUT$(python3 -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
else
  set -- "$PEKIT_OUT"/usr/lib/x86_64-linux-peios/python3.*/site-packages
  [ "$#" -eq 1 ] && [ -d "$1" ] || {
    echo "flit-core: expected exactly one Peios site-packages directory" >&2
    exit 1
  }
  SITE="$1"
fi
test -d "$SITE"
test -f "$SITE/flit_core/buildapi.py"
test -f "$SITE/flit_core/vendor/tomli-1.2.3.dist-info/LICENSE"
test -f "$SITE/flit_core-"*.dist-info/METADATA

# Exercise the installed package as the backend it exists to provide: import
# and metadata, vendored TOML parsing, checked-hash bytecode, wheel metadata and
# RECORD generation, prepared metadata, and corresponding-source creation.
SMOKE="$PEKIT_OUT/.flit-core-smoke"
mkdir -p "$SMOKE/project" "$SMOKE/dist" "$SMOKE/metadata"
cat > "$SMOKE/project/pyproject.toml" <<'EOF'
[build-system]
requires = []
build-backend = "flit_core.buildapi"

[project]
name = "peios-flit-smoke"
version = "1.2.3"
description = "Flit Core installed-backend smoke project"
EOF
cat > "$SMOKE/project/peios_flit_smoke.py" <<'EOF'
'Installed Flit Core smoke module.'

ANSWER = 42
EOF

cd "$PEKIT_OUT"
PYTHONPATH="$SITE" PYTHONDONTWRITEBYTECODE=1 \
python3 -S - "$SITE" "$PEKIT_VERSION" "$SMOKE" <<'PY'
import importlib.metadata
import os
from pathlib import Path
import tarfile
import zipfile

site = Path(__import__('sys').argv[1]).resolve()
version = __import__('sys').argv[2]
smoke = Path(__import__('sys').argv[3]).resolve()

import flit_core
from flit_core import buildapi
from flit_core.vendor import tomli

assert Path(flit_core.__file__).resolve().is_relative_to(site)
assert flit_core.__version__ == version
assert importlib.metadata.version('flit_core') == version
assert tomli.loads('answer = 42')['answer'] == 42

py_sources = sorted((site / 'flit_core').rglob('*.py'))
pycs = sorted((site / 'flit_core').rglob('*.pyc'))
assert len(py_sources) >= 10
assert len(pycs) >= 10
for pyc in pycs:
    data = pyc.read_bytes()
    assert len(data) >= 16
    assert int.from_bytes(data[4:8], 'little') == 3  # checked-hash PEP 552

os.chdir(smoke / 'project')
wheel_name = buildapi.build_wheel(str(smoke / 'dist'))
metadata_name = buildapi.prepare_metadata_for_build_wheel(str(smoke / 'metadata'))
sdist_name = buildapi.build_sdist(str(smoke / 'dist'))

wheel = smoke / 'dist' / wheel_name
assert wheel_name == 'peios_flit_smoke-1.2.3-py2.py3-none-any.whl'
with zipfile.ZipFile(wheel) as archive:
    names = set(archive.namelist())
    info = 'peios_flit_smoke-1.2.3.dist-info'
    assert 'peios_flit_smoke.py' in names
    assert f'{info}/METADATA' in names
    assert f'{info}/WHEEL' in names
    assert f'{info}/RECORD' in names
    metadata = archive.read(f'{info}/METADATA').decode()
    assert 'Name: peios-flit-smoke\\n' in metadata
    assert 'Version: 1.2.3\\n' in metadata

assert metadata_name == 'peios_flit_smoke-1.2.3.dist-info'
assert (smoke / 'metadata' / metadata_name / 'METADATA').is_file()
sdist = smoke / 'dist' / sdist_name
assert sdist_name == 'peios_flit_smoke-1.2.3.tar.gz'
with tarfile.open(sdist, 'r:gz') as archive:
    names = set(archive.getnames())
    assert 'peios_flit_smoke-1.2.3/pyproject.toml' in names
    assert 'peios_flit_smoke-1.2.3/peios_flit_smoke.py' in names
PY

python3 -S - "$SRC" <<'PY'
from pathlib import Path
import sys

assert not any(path.is_dir() for path in Path(sys.argv[1]).rglob('__pycache__'))
PY
rm -rf "$SMOKE"
"""

[build.main.dependencies.peipkg]
dash          = "*"
"org.gnu.coreutils" = "*"
"org.python.python3" = ">= 3.14, < 3.15"

[build.main.dependencies.apt]
python3          = "*"
python3-pytest   = "*"
python3-testpath = "*"
