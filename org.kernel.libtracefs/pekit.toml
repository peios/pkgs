# libtracefs — the kernel tracefs interaction library used by trace-cmd,
# perf/rtla and other tracing clients.

tags = ["bootstrap"]
out_dir = "out"

[source.git]
url       = "https://git.kernel.org/pub/scm/libs/libtrace/libtracefs.git"
ref       = "libtracefs-{{version}}"
tag_regex = '^libtracefs-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
# Soft maintenance floor. Follow every newer immutable release; ABI, header,
# documentation, and test gates below stop incompatible changes.
versions  = ">= 1.8.3"

# Upstream release tags are annotated and signed by the same kernel.org
# maintainer key as libtraceevent: Steven Rostedt's, from kernel.org's official
# pgpkeys.git (keys/EBC26CDB5A56DE73.asc), signing subkey
# 514B0EDE3C387F944FB3799329E574109AEBFAAA.
[source.git.signature]
key_files    = ["keys/steven-rostedt.asc"]
fingerprints = ["5ED9A48FC54C0A22D1D0804CEBC26CDB5A56DE73"]

[build.main]
command = '''
set -eu
SRC="$(pwd)"
ROOT=$(dirname "$(dirname "$PEKIT_OUT")")
BUILD="$PEKIT_OUT/build"
PREFIX="$PEKIT_OUT/usr"
LIBDIR="$PREFIX/lib/x86_64-linux-peios"
COMPLETION="$PREFIX/share/bash-completion/completions/tracefs_sql.bash"
JOBS=2

mkdir -p "$BUILD"

# Upstream honours environment CFLAGS directly. Append reproducible debug
# paths and CET while retaining the workspace profile's optimisation and
# linker policy. Generate IBT PLT entries while preserving input-note merging.
export CFLAGS="${CFLAGS:?} -Wall -fcf-protection=full -fmacro-prefix-map=$ROOT=/usr/src/debug/org.kernel.libtracefs"
export LDFLAGS="${LDFLAGS:?} -Wl,-z,ibtplt"

make -C "$SRC" O="$BUILD" -j"$JOBS" \
  prefix=/usr \
  libdir=/usr/lib/x86_64-linux-peios \
  libdir_relative=lib/x86_64-linux-peios \
  includedir=/usr/include/tracefs \
  includedir_relative=include/tracefs \
  pkgconfig_dir=/usr/lib/x86_64-linux-peios/pkgconfig \
  completion_dir=/usr/share/bash-completion/completions


make -C "$SRC" O="$BUILD" -j1 \
  DESTDIR="$PEKIT_OUT/" prefix=/usr \
  libdir=/usr/lib/x86_64-linux-peios \
  libdir_relative=lib/x86_64-linux-peios \
  includedir=/usr/include/tracefs \
  includedir_relative=include/tracefs \
  pkgconfig_dir=/usr/lib/x86_64-linux-peios/pkgconfig \
  completion_dir=/usr/share/bash-completion/completions install

# Upstream uses xmlto only as a wrapper around this DocBook XSL transform.
# Build documentation from a private copy and invoke xsltproc
# (org.gnome.libxslt-utils) with the DocBook manpage stylesheets
# (org.docbook.docbook-xsl) directly, through the exact narrow interface
# expected by upstream's maintained Makefile, rather than adding xmlto and its
# runtime to the build.
export SOURCE_DATE_EPOCH="$PEKIT_SOURCE_TIMESTAMP"
DOCSRC="$PEKIT_OUT/doc-src"
mkdir -p "$DOCSRC"
cp -a "$SRC/Documentation" "$SRC/scripts" "$DOCSRC/"
find "$DOCSRC/Documentation" -type f \( -name '*.txt' -o -name '*.txt.1' \) \
  -exec sed -i 's/^\[source,[[:space:]]*c\]$/[listing]/' '{}' +
# Upstream 1.8.3 (and current main as of 2026-09-06) leaves commas at
# the ends of two NAME lists. DocBook interprets them as empty aliases and
# emits a hidden, invalid `.3` page. Correct only the private documentation
# copy so the installed API manuals are complete and well-formed.
sed -i \
  's/tracefs_synth_save,tracefs_synth_set_instance,$/tracefs_synth_save, tracefs_synth_set_instance/' \
  "$DOCSRC/Documentation/libtracefs-synth2.txt"
sed -i \
  's/tracefs_synth_append_end_filter, tracefs_synth_free,$/tracefs_synth_append_end_filter, tracefs_synth_free/' \
  "$DOCSRC/Documentation/libtracefs-synth.txt"
/usr/bin/bash "$SRC/check-manpages.sh" "$SRC/Documentation"

cat > "$DOCSRC/Documentation/peios-manpage.xsl" <<'EOF'
<?xml version="1.0"?>
<xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform"
                version="1.0">
  <xsl:import href="http://docbook.sourceforge.net/release/xsl/current/manpages/docbook.xsl"/>
  <xsl:import href="manpage-normal.xsl"/>
</xsl:stylesheet>
EOF
XMLTO_COMPAT="$PEKIT_OUT/xmlto-manpage"
cat > "$XMLTO_COMPAT" <<'EOF'
#!/bin/sh
set -eu
test "$1" = -o
output=$2
shift 2
test "$1" = -m
shift 2
test "$1" = man
input=$2
cd "$output"
exec xsltproc --nonet "$PEIOS_MANPAGE_XSL" "$input"
EOF
chmod 0755 "$XMLTO_COMPAT"
export PEIOS_MANPAGE_XSL="$DOCSRC/Documentation/peios-manpage.xsl"
make -C "$DOCSRC/Documentation" -j1 src="$DOCSRC" \
  TRACEFS_VERSION="$PEKIT_VERSION" XMLTO="$XMLTO_COMPAT" all
make -C "$DOCSRC/Documentation" -j1 src="$DOCSRC" \
  TRACEFS_VERSION="$PEKIT_VERSION" XMLTO="$XMLTO_COMPAT" \
  DESTDIR="$PEKIT_OUT/" prefix=/usr install

install -d "$PREFIX/share/doc"
mv "$PREFIX/share/doc/libtracefs-doc" \
  "$PREFIX/share/doc/org.kernel.libtracefs"

mkdir -p "$PEKIT_OUT/.repro"
cp "$LIBDIR/libtracefs.a" \
  "$LIBDIR/libtracefs.so.$PEKIT_VERSION" "$PEKIT_OUT/.repro/"

# upstream's scripts/utils.mk links the shared library with -rpath=$ORIGIN;
# the library needs no run path, so remove it.
patchelf --remove-rpath "$LIBDIR/libtracefs.so.$PEKIT_VERSION"
sh "$PEKIT_WORKSPACE_ROOT/_pkgtools_/split-debug" org.kernel.libtracefs \
  "$LIBDIR/libtracefs.so.$PEKIT_VERSION" "$LIBDIR/libtracefs.a"

# DocBook XSL versions disagree on whether aliases include their section.
# Use the section-qualified form expected when man/groff resolves .so paths.
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' | while IFS= read -r page; do
  sed -i -E 's|^\.so ([^/]+\.([1-9]))$|.so man\2/\1|' "$page"
done

# Deterministic manuals, including relative alias targets.
find "$PEKIT_OUT/usr/share/man" -type f -name '*.[1-9]' | while IFS= read -r page; do
  gzip -9n "$page"
done
find "$PEKIT_OUT/usr/share/man" -type l -name '*.[1-9]' | while IFS= read -r page; do
  target=$(readlink "$page")
  ln -s "$target.gz" "$page.gz"
  rm "$page"
done

'''

[test]
needs = ["main"]
gate = true
command = '''
set -eu
SRC="$(pwd)"
STAGE="$PEKIT_MAIN_OUT"
ROOT=$(dirname "$(dirname "$STAGE")")
BUILD="$STAGE/build"
PREFIX="$STAGE/usr"
LIBDIR="$PREFIX/lib/x86_64-linux-peios"
COMPLETION="$PREFIX/share/bash-completion/completions/tracefs_sql.bash"
SMOKE="$PEKIT_OUT/smoke"
JOBS=2
export CFLAGS="${CFLAGS:?} -Wall -fcf-protection=full -fmacro-prefix-map=$ROOT=/usr/src/debug/org.kernel.libtracefs"
export LDFLAGS="${LDFLAGS:?} -Wl,-z,ibtplt"

# Not run: upstream's unit suite (make test; utest/trace-utest) needs CUnit,
# which the catalogue does not package yet (PEI-1164). The hermetic tests below
# are the gate until it does.

test "$(find "$PREFIX/include/tracefs" -mindepth 1 -maxdepth 1 \
  -type f -printf '%f\n')" = tracefs.h
find "$LIBDIR" -mindepth 1 -maxdepth 1 \( -type f -o -type l \) \
  -printf '%f\n' | LC_ALL=C sort > "$PEKIT_OUT/actual-libs"
printf '%s\n' libtracefs.a libtracefs.so libtracefs.so.1 \
  "libtracefs.so.$PEKIT_VERSION" | LC_ALL=C sort > "$PEKIT_OUT/expected-libs"
diff -u "$PEKIT_OUT/expected-libs" "$PEKIT_OUT/actual-libs"
test -s "$COMPLETION"
test "$(find "$(dirname "$COMPLETION")" -mindepth 1 -maxdepth 1 \
  -type f -printf '%f\n')" = tracefs_sql.bash
test "$(readlink "$LIBDIR/libtracefs.so")" = libtracefs.so.1
test "$(readlink "$LIBDIR/libtracefs.so.1")" = "libtracefs.so.$PEKIT_VERSION"
test "$(find "$LIBDIR/pkgconfig" -maxdepth 1 -type f -printf '%f\n')" = libtracefs.pc

for txt in "$SRC"/Documentation/libtracefs*.txt; do
  page=$(basename "$txt" .txt)
  test -s "$PREFIX/share/doc/org.kernel.libtracefs/$page.html"
done
for txt in "$SRC"/Documentation/libtracefs*.txt.1; do
  page=$(basename "$txt" .txt.1)
  test -s "$PREFIX/share/doc/org.kernel.libtracefs/$page.html"
done
for section in 3 1; do
  find "$STAGE/doc-src/Documentation" -maxdepth 1 -type f -name "*.$section" \
    ! -name '*.txt.1' -printf '%f.gz\n' | LC_ALL=C sort > "$PEKIT_OUT/expected-man$section"
  find "$PREFIX/share/man/man$section" -maxdepth 1 \( -type f -o -type l \) \
    -name "*.$section.gz" -printf '%f\n' | LC_ALL=C sort > "$PEKIT_OUT/actual-man$section"
  test -s "$PEKIT_OUT/expected-man$section"
  diff -u "$PEKIT_OUT/expected-man$section" "$PEKIT_OUT/actual-man$section"
done

make -C "$SRC" O="$BUILD" clean
make -C "$SRC" O="$BUILD" -j"$JOBS" \
  prefix=/usr libdir=/usr/lib/x86_64-linux-peios \
  libdir_relative=lib/x86_64-linux-peios \
  includedir=/usr/include/tracefs includedir_relative=include/tracefs \
  pkgconfig_dir=/usr/lib/x86_64-linux-peios/pkgconfig \
  completion_dir=/usr/share/bash-completion/completions
cmp "$STAGE/.repro/libtracefs.a" "$BUILD/lib/libtracefs.a"
cmp "$STAGE/.repro/libtracefs.so.$PEKIT_VERSION" \
  "$BUILD/lib/libtracefs.so.$PEKIT_VERSION"

LIBSO="$LIBDIR/libtracefs.so.$PEKIT_VERSION"
readelf -d "$LIBSO" | grep -F 'Library soname: [libtracefs.so.1]'
readelf --dyn-syms -W "$LIBSO" | grep -E ' tracefs_instance_alloc(@|$)'
unset PKG_CONFIG_LIBDIR PKG_CONFIG_SYSROOT_DIR
export PKG_CONFIG_PATH="$LIBDIR/pkgconfig"
pkgconf --validate libtracefs
test "$(pkgconf --modversion libtracefs)" = "$PEKIT_VERSION"
pkgconf --libs libtracefs | grep -Eq '(^|[[:space:]])-ltracefs([[:space:]]|$)'
pkgconf --cflags libtracefs | grep -F '/usr/include/tracefs'
grep -F 'libdir=${prefix}/lib/x86_64-linux-peios' "$LIBDIR/pkgconfig/libtracefs.pc"
grep -F 'Requires: libtraceevent > 1.8' "$LIBDIR/pkgconfig/libtracefs.pc"

mkdir -p "$SMOKE/trace/instances/peios"
cat > "$SMOKE/consumer.c" <<'EOF'
#include <tracefs.h>
#include <stdlib.h>
#include <string.h>
int main(int argc, char **argv) {
  struct tracefs_dynevent *probe; struct tracefs_instance *instance;
  enum tracefs_dynevent_type type;
  char *system = NULL, *event = NULL, *prefix = NULL;
  char *address = NULL, *format = NULL, *path = NULL; char **list = NULL;
  int ret = 1;
  if (argc != 2) return 2;
  instance = tracefs_instance_alloc(argv[1], "peios");
  if (!instance || strcmp(tracefs_instance_get_name(instance), "peios")) goto out;
  path = tracefs_instance_get_file(instance, "trace");
  if (!path || !strstr(path, "/instances/peios/trace")) goto out;
  tracefs_put_tracing_file(path); path = NULL;
  list = tracefs_list_add(list, "alpha"); list = tracefs_list_add(list, "beta");
  if (!list || tracefs_list_size(list) != 2 || strcmp(list[1], "beta")) goto out;
  if (tracefs_option_id("event-fork") != TRACEFS_OPTION_EVENT_FORK ||
      strcmp(tracefs_option_name(TRACEFS_OPTION_EVENT_FORK), "event-fork")) goto out;
  probe = tracefs_kprobe_alloc(NULL, "peios_probe", "do_sys_open", "fd=%ax");
  if (!probe) goto out;
  type = tracefs_dynevent_info(probe, &system, &event, &prefix, &address, &format);
  if (type != TRACEFS_DYNEVENT_KPROBE || strcmp(system, "kprobes") ||
      strcmp(event, "peios_probe") || strcmp(prefix, "p") ||
      strcmp(address, "do_sys_open") || strcmp(format, "fd=%ax")) {
    tracefs_dynevent_free(probe); goto out;
  }
  tracefs_dynevent_free(probe); ret = 0;
out:
  free(system); free(event); free(prefix); free(address); free(format);
  tracefs_put_tracing_file(path); tracefs_list_free(list);
  tracefs_instance_free(instance); return ret;
}
EOF
cc -std=gnu99 -Wall -Wextra -Werror "$SMOKE/consumer.c" \
  -I"$PREFIX/include/tracefs" $(pkgconf --cflags libtraceevent) \
  -L"$LIBDIR" -Wl,-rpath-link,"$LIBDIR" -ltracefs \
  $(pkgconf --libs libtraceevent) -lpthread -o "$SMOKE/shared"
LD_LIBRARY_PATH="$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
  "$SMOKE/shared" "$SMOKE/trace"
cc -std=gnu99 -Wall -Wextra -Werror "$SMOKE/consumer.c" \
  -I"$PREFIX/include/tracefs" $(pkgconf --cflags libtraceevent) \
  "$LIBDIR/libtracefs.a" $(pkgconf --libs libtraceevent) -lpthread \
  -o "$SMOKE/static"
"$SMOKE/static" "$SMOKE/trace"

DEBUG=$(find "$STAGE/usr/lib/debug/.build-id" -type f -name '*.debug')
test "$(printf '%s\n' "$DEBUG" | grep -c .)" -eq 1
test -n "$(find "$STAGE/usr/src/debug/org.kernel.libtracefs" -type f -print -quit)"
readelf -S "$DEBUG" 2>/dev/null | grep -F '.debug_info'
readelf -h "$LIBSO" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -W -l "$LIBSO" | grep 'GNU_STACK' | grep -F 'RW '
readelf -W -l "$LIBSO" | grep -F 'GNU_RELRO'
readelf -d "$LIBSO" | grep -F 'BIND_NOW'
readelf -d "$LIBSO" | grep -F 'RELR'
readelf -n "$LIBSO" | grep -E 'x86 feature:.*IBT.*SHSTK'
if readelf -d "$LIBSO" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then exit 1; fi
test "$(readelf -d "$LIBSO" | grep -c 'Shared library:')" -eq 2
readelf -d "$LIBSO" | grep -F 'Shared library: [libtraceevent.so.1]'
readelf -d "$LIBSO" | grep -F 'Shared library: [libc.so.6]'
if strings "$LIBSO" | grep -F "$ROOT"; then exit 1; fi
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-c" = "*"
"org.gnu.findutils"            = "*"
"org.gnu.grep"                 = "*"
"org.gnu.make"                 = "*"
"org.gnu.bash"                 = "*"
"org.kernel.libtraceevent-devel"   = ">= 1.9.0-1, < 2"
"org.pkgconf.pkgconf"          = "*"

[build.main.dependencies.peipkg]
"org.gnu.gzip" = "*"
"dev.peios.build-essentials-c"              = "*"
"org.sourceware.debugedit"                           = "*"
"org.gnu.findutils"                           = "*"
"org.gnu.grep"                    = "*"
"io.github.asciidoc-py.asciidoc" = "*"
"org.gnu.make"                                = "*"
"org.nixos.patchelf"              = "*"
"org.gnu.bash"                    = "*"
"org.kernel.libtraceevent-devel"      = ">= 1.9.0-1, < 2"
"org.gnu.which"                   = "*"
# xsltproc and the DocBook manpage stylesheets for the xmlto-free man build.
"org.gnome.libxslt-utils"         = "*"
"org.docbook.docbook-xsl"         = "*"
"org.pkgconf.pkgconf"                             = "*"
"org.gnu.sed"                                 = "*"
